# Source: observability-stack/templates/vmusers.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: observability-stack-k8s-viewer
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.role: reader
spec:
  name: "k8s:viewer"
  disable_secret_creation: true
  jwt:
    oidc:
      issuer: "https://issuer.example"
    matchClaims:
      groups: "^(cluster-a:k8s:viewer|cluster-b:k8s:viewer)$"
      aud: "^(example-observability-client)$"
    defaultVMAccessClaim:
      metricsExtraFilters:
        - '{k8s_cluster_name="cluster-a"}'
        - '{k8s_cluster_name="cluster-b"}'
      logsExtraStreamFilters:
        - _stream:{"k8s.cluster.name"="cluster-a" or "k8s.cluster.name"="cluster-b"}
  load_balancing_policy: first_available
  retry_status_codes: 
    - 500
    - 502
    - 503
  targetRefs:
    - static:
        url: "http://vmsingle-observability-stack-victoria-metrics-k8s-stack.default.svc:8428"
      paths:
        - /prometheus/api/v1/query
        - /prometheus/api/v1/query_range
        - /prometheus/api/v1/series
        - /prometheus/api/v1/labels
        - /prometheus/api/v1/label/[^/]+/values
        - /prometheus/api/v1/status/tsdb
        - /prometheus/api/v1/status/buildinfo
        - /prometheus/api/v1/rules
        - /prometheus/api/v1/query_exemplars
        - /prometheus/api/v1/format_query
        - /prometheus/vmui.*
      query_args:
        - name: extra_filters
          values:
            - "{{.MetricsExtraFilters}}"
        - name: extra_filters[]
          values:
            - "{{.MetricsExtraFilters}}"
      targetRefBasicAuth:
        username:
          name: "observability-store-credentials"
          key: "username"
        password:
          name: "observability-store-credentials"
          key: "password"
    - static:
        url: "http://observability-stack-victoria-logs-single-server.default.svc:9428"
      paths:
        - /select/logsql/.*
        - /select/vmui.*
      query_args:
        - name: extra_stream_filters
          values:
            - "{{.LogsExtraStreamFilters}}"
      targetRefBasicAuth:
        username:
          name: "observability-store-credentials"
          key: "username"
        password:
          name: "observability-store-credentials"
          key: "password"

