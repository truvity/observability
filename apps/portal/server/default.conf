# The portal's whole server configuration. A static server and nothing else:
# the page is a built single-page app, and the one thing that varies per
# estate is /config/portal.json, which the chart mounts from a ConfigMap.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    # `unsafe-eval` is the page's JSON Schema validator (ajv compiles the
    # published schema with `new Function`); there is no other eval and no
    # inline script. Everything else is same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # The probes' target. Kept off the page so readiness never depends on
    # the app rendering.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The extra catalog. Not cached: a change to the ConfigMap must show on
    # the next load. Absent when nothing is mounted, and the app treats the
    # 404 as "the built-in catalog only".
    location = /config/portal.json {
        alias /config/portal.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Built assets carry a content hash in their name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    # Anything else is not part of this page: one document, no fallback.
    location / {
        return 404;
    }
}
