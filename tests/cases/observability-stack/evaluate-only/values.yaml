# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
# It also proves the chart renders on a cluster that does not use the
# default — an estate on the default sees exactly this one difference.
global:
  cluster:
    dnsDomain: cluster.example.

# The explicit, named "evaluate, notify nobody yet" shape:
# docs/notifications.md, "Evaluate, notify nobody yet". A consumer with
# no Slack or webhook credential yet, who wants every rule evaluated and
# visible in vmalert rather than turning the whole alerting path off.
#
# Alertmanager is off — this mode does not render it — and vmalert keeps
# running with `-notifier.blackhole` on both alerters instead of a
# notifier URL. This is the golden that proves that render.
alertmanager:
  enabled: false

vmalert:
  externalUrl: https://grafana.example

# MIRROR of alertmanager.enabled above — observability-stack.validate.
# vendoredSyncSources' own doc comment has the reasoning: the vendored
# sync job's alertmanager.rules source is gated on THIS chart's own
# Alertmanager, not the vendored one, which is always off regardless.
victoria-metrics-k8s-stack:
  defaultRules:
    sources:
      alertmanager:
        enabled: false

notifications:
  mode: evaluate-only
