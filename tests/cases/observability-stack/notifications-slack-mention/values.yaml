# Slack mentions. `critical` pings `@here` and `warning` does not, in the
# SAME channel: they are two receivers (`slack-acme--alerts--here` and
# `slack-acme--alerts`), because the mention is part of a receiver's text.
# The catch-all pings `@channel`; a route's string override keeps the
# tier's mention, and its object form may set its own.
# The cluster's DNS suffix is a neutral placeholder: a golden render is a
# tracked file in a public repository.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - name: acme
        appTokenSecret: {name: example-acme-slack-bot, key: token}
  severities:
    critical: {receiver: slack, channel: "#alerts", mention: here}
    warning: {receiver: slack, channel: "#alerts"}
  catchAll: {receiver: slack, channel: "#alerts-everything-else", mention: channel}
  routes:
    - match: {k8s_namespace_name: example-app}
      critical: "#example-app-critical"
      warning: {channel: "#example-app", mention: channel}
