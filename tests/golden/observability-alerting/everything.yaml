# Source: observability-alerting/templates/selfalerts.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: observability-stack-selfalerts
  labels:
    app.kubernetes.io/name: stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - name: observability-stack.selfalerts
      interval: 15s
      rules:
        # SlackNotificationsFailing. Alertmanager counts a failed Slack
        # delivery (bad or revoked token, a channel the bot may not post
        # in, Slack down) and keeps retrying; nothing else says a
        # notification is being lost. `integration="slack"` is the
        # Alertmanager label for `slack_configs`.
        #
        # This alert must NEVER be routed to Slack: templates/
        # vmalertmanager.yaml puts a route for it at the top of the tree,
        # to `notifications.slack.failureReceiver`, or to the null
        # receiver when that is unset.
        #
        # Healthy range: 0. The series exists because templates/
        # alertmanager-scrape.yaml scrapes Alertmanager's own /metrics.
        - alert: SlackNotificationsFailing
          expr: >-
            sum without (pod, instance) (increase(alertmanager_notifications_failed_total{integration="slack"}[15m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Alertmanager is failing to deliver to Slack"
            description: >-
              alertmanager_notifications_failed_total{integration="slack"}
              rose in the last 15m. Alerts routed to
              Slack are not arriving: check the workspace's bot token
              Secret, that the channel exists (a private channel needs the
              bot invited) and Slack's own status.
        # MetricStoreIgnoringRows.
        #
        # THE INCIDENT: a series past the metrics store's per-day label
        # limit is discarded WHILE THE WRITE STILL ANSWERS 200 — a
        # collector reported 888k rows written with zero errors while the
        # store held none of them, and this counter sat at 9,748,387 with
        # nothing else showing it. This is the rule that would have
        # caught it. Confirmed for THIS install by whoever set
        # selfAlerts.ingest.metric — see values.yaml.
        #
        # Healthy range: 0. The counter only advances when a sample is
        # refused for exceeding a configured limit, so a write path that
        # is not hitting one never touches it.
        - alert: MetricStoreIgnoringRows
          expr: >-
            sum without (pod, instance) (rate(example_vm_rows_ignored_total[2m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "The metrics store is silently discarding rows"
            description: >-
              example_vm_rows_ignored_total is rising. Rows past a configured limit
              (label count, cardinality) are dropped while the write still
              answers 200: a sender can report a clean write with zero
              errors while the store holds none of it. Measured on a live
              install: 888k rows reported written, the store held none,
              and this counter sat at 9,748,387.
        # LogStoreDroppingRows. Confirmed for THIS install by whoever set
        # selfAlerts.logStore.metric — see values.yaml; needs
        # victoria-logs-single.server.serviceMonitor (or equivalent) to
        # be scraping the log store into this metrics store at all.
        #
        # Healthy range: 0, the same as MetricStoreIgnoringRows above.
        # Safe with the log store disabled: rate() of a counter no series
        # carries returns no data, not zero, so an absent store never
        # fires this.
        - alert: LogStoreDroppingRows
          expr: >-
            sum without (pod, instance) (rate(example_vl_rows_dropped_total[2m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "The log store is dropping rows"
            description: >-
              example_vl_rows_dropped_total is rising. Rows are being discarded on
              write; the ingesting collector sees a successful response
              regardless.
        # TraceStoreDroppingRows. Same reasoning, the trace store.
        # Confirmed for THIS install by whoever set
        # selfAlerts.traceStore.metric — see values.yaml.
        - alert: TraceStoreDroppingRows
          expr: >-
            sum without (pod, instance) (rate(example_vt_rows_dropped_total[2m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "The trace store is dropping rows"
            description: >-
              example_vt_rows_dropped_total is rising. Spans are being discarded
              on write; the ingesting collector sees a successful response
              regardless.
        # MetricStoreCardinalityNearLimit (hourly). Confirmed for THIS
        # install by whoever set selfAlerts.cardinality.hourly* — see
        # values.yaml.
        #
        # docs/notifications.md: "hourly or daily series at 90% of the
        # limit". 0.85 is that headroom: comfortably
        # under the cap at which new series stop being accepted for the
        # rest of the window. A separate alert from the daily rule below
        # — different window, different meaning, and a name that says
        # which one fired rather than a `window` label a reader has to go
        # look at.
        - alert: MetricStoreCardinalityNearLimit
          expr: >-
            (example_vm_hourly_series_limit_max_series > 0)
            and
            (example_vm_hourly_series_limit_current_series / example_vm_hourly_series_limit_max_series) > 0.85
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "The metrics store is close to its hourly series limit"
            description: >-
              Hourly active series are above 85% of
              storage.maxHourlySeries. Above the limit, new series stop
              being accepted for the rest of the hour — the exact shape of
              an exporter that appears to have stopped exporting.
        # MetricStoreDailyCardinalityNearLimit. Same reasoning as the
        # hourly rule, the daily cap — churn over a day rather than a
        # burst within an hour, which is why it is a second rule and not
        # the same alert with a different label.
        - alert: MetricStoreDailyCardinalityNearLimit
          expr: >-
            (example_vm_daily_series_limit_max_series > 0)
            and
            (example_vm_daily_series_limit_current_series / example_vm_daily_series_limit_max_series) > 0.85
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "The metrics store is close to its daily series limit"
            description: >-
              Daily active series are above 85% of
              storage.maxDailySeries. Above the limit, new series stop
              being accepted for the rest of the day. A workload whose pod
              names change on every deploy is the usual source of churn
              this rule catches that the hourly one has not yet.
        # LogStoreStreamsChurning.
        #
        # A stream field that is not constant for the life of a pod —
        # `ip`, `user_id`, `trace_id`, or any per-request resource
        # attribute an SDK sets — is the documented way to wreck the log
        # store, and it looks fine for the first week: the count grows,
        # queries slow, and nothing errors. Check `VL-Stream-Fields` on
        # the writers and the log agent's own stream fields.
        #
        # Healthy range: a stream per pod per day. 2
        # streams/second, averaged over an hour, is two orders of
        # magnitude above that baseline.
        - alert: LogStoreStreamsChurning
          expr: >-
            sum without (pod, instance) (rate(example_vl_streams_created_total[1h])) > 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The log store is creating streams faster than pods explain"
            description: >-
              example_vl_streams_created_total is above
              2 streams/s averaged over an hour — a
              stream field is varying when it should be constant.
        # TraceStoreStreamsChurning. Same failure, the trace store, which
        # keys streams on `service.name` AND the span name — a span name
        # carrying an id (a URL with a path parameter in it) is the usual
        # cause there rather than a label copied from the pod.
        - alert: TraceStoreStreamsChurning
          expr: >-
            sum without (pod, instance) (rate(example_vt_streams_created_total[1h])) > 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The trace store is creating streams faster than services explain"
            description: >-
              example_vt_streams_created_total is above
              2 streams/s averaged over an hour — a span
              name is carrying an id rather than staying constant per service.
        # WriterBufferGrowing. Generic across writers on purpose: this
        # chart's own vmalert remote-write client shares its metrics
        # family with vmagent's, so whichever writer's buffer this name
        # is confirmed against, the shape it watches is the same.
        #
        # Rate of change rather than a fixed byte threshold — a magnitude
        # this chart has no basis to guess — so the rule fires on the
        # buffer GROWING rather than on crossing a size nobody confirmed.
        # Growth means the write path is blocked and the eventual loss is
        # proportional to how long it takes somebody to look.
        #
        # Per destination: the buffer metric of every remote-write agent
        # carries the destination's `url`, so a series (and an alert)
        # exists per URL — a replica that is down fires for ITS url while
        # the other half of an HA pair stays quiet. `bufferMetricsExtra`
        # adds the other agents' names (the log agent's is not the metrics
        # agent's) to the same rule.
        - alert: WriterBufferGrowing
          expr: >-
            deriv({__name__=~"example_vmalert_remotewrite_pending_data_bytes|example_vlagent_remotewrite_pending_data_bytes"}[15m]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "A writer's remote-write buffer is growing"
            description: >-
              The buffer for destination {{ $labels.url }}
              (example_vmalert_remotewrite_pending_data_bytes, example_vlagent_remotewrite_pending_data_bytes) has been increasing for
              15m. Nothing is lost yet — that is what the
              buffer is for — and everything will be once it is full.
              Check the destination and the network policy in front of it.
        # WriterDroppingPackets. Same `writer` block, the buffer already
        # full: both remote-write agents in this family treat a 400 as
        # permanent and drop the block, and the log agent does the same
        # on a 404 — a wrong write path is unrecoverable loss, not a
        # retry.
        #
        # Per destination, like the buffer rule: summed by `url`, so a
        # drop toward one half of a pair names that half.
        - alert: WriterDroppingPackets
          expr: >-
            sum without (pod, instance) (rate({__name__=~"example_vmalert_remotewrite_packets_dropped_total|example_vlagent_remotewrite_packets_dropped_total"}[5m])) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "A writer is dropping packets on its remote-write path"
            description: >-
              example_vmalert_remotewrite_packets_dropped_total, example_vlagent_remotewrite_packets_dropped_total is rising for destination
              {{ $labels.url }}. Data is being
              discarded, not delayed: a 400 or 404 from the destination is
              treated as permanent, and the block is gone, not retried.
        # GatewayQueueFilling.
        #
        # THE INCIDENT (this week): a network policy change cut
        # charts/observability-emitters' OpenTelemetry gateway off from
        # its own proxy, and "sending queue is full" ran for hours with
        # every pod Running and nothing reporting it. The gateway is a
        # component of the sibling chart, not this one; this rule fires
        # once its metrics reach THIS store (scraped, or remote-written,
        # into vmsingle), and vmalert here reads them directly — never
        # through the proxy, the same as every other rule in this file.
        # Confirmed for THIS install by whoever set
        # selfAlerts.gateway.queueSizeMetric / queueCapacityMetric — see
        # values.yaml.
        #
        # Healthy range: comfortably under 1; a queue that is never
        # exercised sits near 0. 0.75 is the "queue
        # above 80%" the incident report gives — headroom before the
        # queue is full and the collector starts blocking or dropping.
        - alert: GatewayQueueFilling
          expr: >-
            example_otelcol_exporter_queue_size / example_otelcol_exporter_queue_capacity > 0.75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The OpenTelemetry gateway's export queue is filling"
            description: >-
              The queue of exporter {{ $labels.exporter }} (one per
              destination and signal): example_otelcol_exporter_queue_size is above 75% of
              example_otelcol_exporter_queue_capacity. Once it is full the
              collector blocks or drops, and "sending queue is full" is
              exactly the failure that ran for hours unreported.
        # GatewayExportFailing.
        #
        # Separate from GatewayEnqueueFailing below: a SEND failure is a
        # destination refusing a batch the gateway already accepted, an
        # ENQUEUE failure is the gateway's own queue refusing at the
        # door. Different losses, and a single rule cannot tell an
        # operator which one paged them.
        #
        # otelcol_exporter_send_failed_* and _enqueue_failed_* both carry
        # a per-signal suffix (spans, metric_points, log_records) this
        # session did not enumerate with confidence, so
        # exportFailedMetricPrefix is matched by METRIC NAME PREFIX rather
        # than a listed suffix — every signal the gateway exports for,
        # without guessing which exist. Confirmed for THIS install by
        # whoever set selfAlerts.gateway.exportFailedMetricPrefix — see
        # values.yaml.
        #
        # Healthy range: 0. A send or enqueue failure is not something a
        # healthy exporter path produces at any rate. Measured on a live
        # install: a NOT-RETRYABLE export answering 400 for a month is
        # how a trace store stayed empty while every pod was Healthy.
        - alert: GatewayExportFailing
          expr: >-
            sum without (pod, instance) (rate({__name__=~"example_otelcol_exporter.*"}[2m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "The OpenTelemetry gateway is failing to export"
            description: >-
              A example_otelcol_exporter* series is advancing for
              exporter {{ $labels.exporter }}. Data the gateway
              accepted is not reaching its destination.
        # GatewayEnqueueFailing. Same `gateway` group, the OTHER queue
        # failure: this one is the gateway itself refusing what a sender
        # hands it, rather than the destination refusing what the
        # gateway already accepted (GatewayExportFailing above). A sender
        # that checks its own return code sees THIS one as an error —
        # unlike every other rule in this group, which are all invisible
        # to whoever is sending.
        #
        # Matched by metric-name PREFIX, same reasoning as
        # exportFailedMetricPrefix: `_enqueue_failed_` carries the same
        # per-signal suffix `_send_failed_` does, and this session did
        # not enumerate them with confidence either. Confirmed for THIS
        # install by whoever set
        # selfAlerts.gateway.enqueueFailedMetricPrefix — see values.yaml.
        #
        # Healthy range: 0. An enqueue failure is not something a healthy
        # exporter path produces at any rate.
        - alert: GatewayEnqueueFailing
          expr: >-
            sum without (pod, instance) (rate({__name__=~"example_otelcol_exporter.*"}[2m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "The OpenTelemetry gateway is refusing what senders hand it"
            description: >-
              A example_otelcol_exporter* series is advancing for
              exporter {{ $labels.exporter }}. The queue is full, so
              the gateway is rejecting at the door rather than accepting
              and later failing to send.
        # ProxyAtConcurrencyLimit. Confirmed for THIS install by whoever
        # set selfAlerts.proxyConcurrency.limitedRequestsMetric — see
        # values.yaml. UNLIKE every other rule in this file, a live
        # measurement found vmauth_concurrent_requests_limit_reached_total
        # present on the store — the one counter with actual evidence
        # behind it rather than a guess — but it is still not written in
        # below; this chart holds every metric name to the same rule.
        - alert: ProxyAtConcurrencyLimit
          expr: >-
            sum without (pod, instance) (rate(example_vmauth_concurrent_requests_limit_reached_total[2m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "The proxy is refusing requests at its concurrency limit"
            description: >-
              example_vmauth_concurrent_requests_limit_reached_total is rising. Reads are
              failing while every store is healthy, which is the shape
              that gets diagnosed as the store for an hour first. Either
              a caller is hammering it or the limit is too low for the
              readers it now has.
        # MetricStoreDiskNearGuard. Confirmed for
        # THIS install by whoever set selfAlerts.diskGuard.metrics —
        # see values.yaml. headroomFactor mirrors platform-alerts'
        # storeLimits.headroomFactor and its default (2): comfortably
        # above the 1x at which the store already stopped accepting
        # writes. A logs or traces store that fills its disk switches to
        # read-only and does NOT drop data to recover, so arriving late
        # here is arriving after an outage rather than before one.
        #
        # `for:` exists because free space falls MONOTONICALLY under
        # normal operation, so one reading under the guard is a
        # measurement artefact, not a trend — see selfAlerts.diskGuard.for
        # in values.yaml.
        - alert: MetricStoreDiskNearGuard
          expr: >-
            example_vm_free_disk_space_bytes / example_vm_free_disk_space_limit_bytes < 3
          for: 8m
          labels:
            severity: warning
          annotations:
            summary: "The metrics store is approaching its disk guard"
            description: >-
              Free space is under 3x the
              store's own minFreeDiskSpaceBytes guard. It is still serving
              reads and will keep doing so after it stops writing.
        # LogStoreDiskNearGuard. Confirmed for
        # THIS install by whoever set selfAlerts.diskGuard.logs —
        # see values.yaml. headroomFactor mirrors platform-alerts'
        # storeLimits.headroomFactor and its default (2): comfortably
        # above the 1x at which the store already stopped accepting
        # writes. A logs or traces store that fills its disk switches to
        # read-only and does NOT drop data to recover, so arriving late
        # here is arriving after an outage rather than before one.
        #
        # `for:` exists because free space falls MONOTONICALLY under
        # normal operation, so one reading under the guard is a
        # measurement artefact, not a trend — see selfAlerts.diskGuard.for
        # in values.yaml.
        - alert: LogStoreDiskNearGuard
          expr: >-
            example_vl_free_disk_space_bytes / example_vl_free_disk_space_limit_bytes < 3
          for: 8m
          labels:
            severity: warning
          annotations:
            summary: "The logs store is approaching its disk guard"
            description: >-
              Free space is under 3x the
              store's own minFreeDiskSpaceBytes guard. It is still serving
              reads and will keep doing so after it stops writing.
        # TraceStoreDiskNearGuard. Confirmed for
        # THIS install by whoever set selfAlerts.diskGuard.traces —
        # see values.yaml. headroomFactor mirrors platform-alerts'
        # storeLimits.headroomFactor and its default (2): comfortably
        # above the 1x at which the store already stopped accepting
        # writes. A logs or traces store that fills its disk switches to
        # read-only and does NOT drop data to recover, so arriving late
        # here is arriving after an outage rather than before one.
        #
        # `for:` exists because free space falls MONOTONICALLY under
        # normal operation, so one reading under the guard is a
        # measurement artefact, not a trend — see selfAlerts.diskGuard.for
        # in values.yaml.
        - alert: TraceStoreDiskNearGuard
          expr: >-
            example_vt_free_disk_space_bytes / example_vt_free_disk_space_limit_bytes < 3
          for: 8m
          labels:
            severity: warning
          annotations:
            summary: "The traces store is approaching its disk guard"
            description: >-
              Free space is under 3x the
              store's own minFreeDiskSpaceBytes guard. It is still serving
              reads and will keep doing so after it stops writing.
        - alert: MetricStoreSnapshotOlderThanWindow
          expr: >-
            time() - max(
              kube_cronjob_status_last_successful_time{namespace="default", cronjob="observability-stack-backup-metrics-incremental"}
            ) > 3h
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "The metrics store's newest backup snapshot is stale"
            description: >-
              No successful run of observability-stack-backup-metrics-incremental
              within 3h. A CronJob that has stopped
              being scheduled produces no failures at all, which is the
              same reasoning platform-alerts' CronJobNotSucceeding rule
              uses for any other CronJob.
        - alert: LogStoreSnapshotOlderThanWindow
          expr: >-
            time() - max(
              kube_cronjob_status_last_successful_time{namespace="default", cronjob="observability-stack-backup-logs"}
            ) > 90m
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "The log store's newest backup snapshot is stale"
            description: >-
              No successful run of observability-stack-backup-logs
              within 90m. A CronJob that has
              stopped being scheduled produces no failures at all — the
              same blind spot the metrics store's own rule exists for.
        - alert: TraceStoreSnapshotOlderThanWindow
          expr: >-
            time() - max(
              kube_cronjob_status_last_successful_time{namespace="default", cronjob="observability-stack-backup-traces"}
            ) > 90m
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "The trace store's newest backup snapshot is stale"
            description: >-
              No successful run of observability-stack-backup-traces
              within 90m. A CronJob that has
              stopped being scheduled produces no failures at all — the
              same blind spot the metrics store's own rule exists for.
