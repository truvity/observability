---
# Source: platform-alerts/templates/vmrule.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - name: platform-alerts.probes
      interval: 1m
      rules:
        # An HTTP probe that is not answering 2xx from this cluster.
        #
        # `probe_success` is the blackbox exporter's own series for a probe
        # of `observability-emitters` (`metrics.scrape.probes`): 1 while the
        # URL answers as the module accepts (any 2xx by default), 0 for a
        # refused connection, a TLS failure or any other status. `max by
        # (probe)` so a probe that resolves to several targets is down only
        # when all are.
        - alert: BoxFrontListenerDown
          expr: >-
            max by (k8s_cluster_name, probe) (probe_success{probe=~"box-front-buildkit-.+"}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "HTTP probe {{ $labels.probe }} has not answered 2xx for 5m"
            description: >-
              The probe {{ $labels.probe }} (charts/observability-emitters
              `metrics.scrape.probes`) has read probe_success == 0 for 5m: the URL
              refused the connection, failed TLS or answered something the
              probe's module does not accept (any 2xx, by default) from this
              cluster's own egress.
        # The deadman for the rule above.
        #
        # `probe_success == 0` evaluates to nothing, not to a value, when
        # the series does not exist: a probe whose series never reached the
        # store (the exporter down, the VMProbe not selected, the series
        # filed under labels the store's readers do not see) makes
        # BoxFrontListenerDown silent while the probe is not working at all.
        # `absent()` is true exactly then. With the default selector it
        # fires only when NO probe reports; name a probe (`probe`) to watch
        # one, which is what a single-probe estate wants.
        - alert: BoxFrontListenerDownAbsent
          expr: >-
            (group by (k8s_cluster_name, probe) (max_over_time(probe_success{probe=~"box-front-buildkit-.+", k8s_cluster_name!=""}[1d])) unless group by (k8s_cluster_name, probe) (probe_success{probe=~"box-front-buildkit-.+", k8s_cluster_name!=""})) or (absent(probe_success{probe=~"box-front-buildkit-.+"}) unless on() group(max_over_time(probe_success{probe=~"box-front-buildkit-.+"}[1d])))
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "No probe_success series for box-front-buildkit-.+ for 15m{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }}"
            description: >-
              probe_success{probe=~"box-front-buildkit-.+"} has not been seen in
              15m{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }}, so BoxFrontListenerDown cannot fire even if the
              URL is down. Check the blackbox exporter and the VMProbe
              (charts/observability-emitters `metrics.scrape.probes`), that the
              agent's scrape of the probe is up, and that its series carry the
              cluster's tenancy labels.
