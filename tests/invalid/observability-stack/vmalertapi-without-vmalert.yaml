# expect: `vmalertAPI: true` but `vmalert.enabled` is false
# vmalertAPI with no vmalert to serve it.
global:
  cluster:
    dnsDomain: cluster.example.

# Two principals. The first is a machine reader in the shape an MCP server
# needs: metrics only, and `vmalertAPI` adding the metrics vmalert's alerts
# and rules (unfiltered, which `allowUnfilteredAlertReads` acknowledges).
# The second has no `vmalertAPI` and must get no vmalert route at all.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  allowUnfilteredAlertReads: true
  principals:
    - group: example:observability-mcp:reader
      audience: example-mcp-reader
      routes: [metrics]
      vmalertAPI: true
      grants:
        - cluster: example-cluster
          allNamespaces: true
    - group: example:k8s:viewer
      routes: [metrics]
      grants:
        - cluster: example-cluster
          namespaces: [example-app]

notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
vmalert:
  enabled: false
alertmanager:
  enabled: false
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
