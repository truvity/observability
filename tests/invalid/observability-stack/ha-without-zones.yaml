# expect: No store here replicates across a zone
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# No store here replicates across a zone, so an install labelled highly
# available with one zone is the single-zone install with a label that
# stops anyone looking at it again.
ha: true
zones:
  - example-1a
