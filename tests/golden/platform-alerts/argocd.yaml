---
# Source: platform-alerts/templates/vmrule.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: platform-alerts.argocd
      interval: 1m
      rules:
        # An Application whose sync ended in Failed or Error.
        #
        # `argocd_app_sync_total` is a counter per Application and phase. The
        # Failed series of an Application that never failed does not exist
        # until its first failure, and plain `increase` skips a series' first
        # sample, so the first failure would go unseen: `increase_pure`
        # counts from zero. It stays true for `syncFailed.window` after the
        # last failure.
        - alert: ArgoCDAppSyncFailed
          expr: >-
            sum by (k8s_cluster_name, name, project, dest_server, phase) (
              increase_pure(argocd_app_sync_total{job=~"argocd-.*-metrics", phase=~"Failed|Error"}[10m])
            ) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} ended a sync as {{ $labels.phase }}"
            description: >-
              A sync of application {{ $labels.name }} (project
              {{ $labels.project }}, destination {{ $labels.dest_server }})
              ended in {{ $labels.phase }} within the last
              10m. Open the application and read the
              sync result: a manifest the cluster refused, a hook that
              failed, or a resource that never became healthy.
            runbook_url: "https://runbooks.example.com/ArgoCDAppSyncFailed"
        # An Application whose health is Degraded, Missing or Unknown.
        #
        # `argocd_app_info` is a gauge of 1 per Application, carrying its
        # health in `health_status`. Progressing is left out on purpose: a
        # rollout is Progressing, and one that never finishes is caught by
        # Degraded when its resources time out.
        - alert: ArgoCDAppUnhealthy
          expr: >-
            max by (k8s_cluster_name, name, project, dest_server, health_status) (
              argocd_app_info{job=~"argocd-.*-metrics", health_status=~"Degraded|Missing|Unknown"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} has been {{ $labels.health_status }} for 15m"
            description: >-
              Application {{ $labels.name }} (project {{ $labels.project }},
              destination {{ $labels.dest_server }}) reports health
              {{ $labels.health_status }}. Open it and read the resource that
              is not healthy: a crash-looping workload, a missing object, or a
              cluster Argo CD cannot read (see ArgoCDClusterConnectionLost).
            runbook_url: "https://runbooks.example.com/ArgoCDAppUnhealthy"
        # An Application whose live state has differed from Git for too long.
        #
        # An application that does not self-heal and does not prune is
        # OutOfSync by design (a resource kept on purpose): leave `outOfSyncFor`
        # long, or switch the rule off with `outOfSync.enabled: false`.
        - alert: ArgoCDAppOutOfSync
          expr: >-
            max by (k8s_cluster_name, name, project, dest_server) (
              argocd_app_info{job=~"argocd-.*-metrics", sync_status="OutOfSync"}
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} has been OutOfSync for 30m"
            description: >-
              Application {{ $labels.name }} (project {{ $labels.project }},
              destination {{ $labels.dest_server }}) differs from Git and
              nothing has reconciled it for 30m. Check that
              automated sync is on, or sync it by hand, and read the diff.
            runbook_url: "https://runbooks.example.com/ArgoCDAppOutOfSync"
        # A destination cluster the application controller cannot reach.
        #
        # `argocd_cluster_connection_status` is 1 while the controller's
        # connection to the cluster works and 0 while it does not. With the
        # connection down every application on that cluster is stale, and
        # none of the app-level alerts can say so.
        - alert: ArgoCDClusterConnectionLost
          expr: >-
            min by (k8s_cluster_name, server) (argocd_cluster_connection_status{job=~"argocd-.*-metrics"}) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD cannot reach the cluster {{ $labels.server }}"
            description: >-
              The application controller has had no working connection to
              {{ $labels.server }} for 5m: its
              applications are no longer reconciled. Check the cluster's API
              endpoint, the credentials Argo CD holds for it, and the network
              path from the controller.
            runbook_url: "https://runbooks.example.com/ArgoCDClusterConnectionLost"
        # The repo server failing to fetch from Git.
        #
        # `argocd_git_fetch_fail_total` is born at the first failure of a
        # repository, hence `increase_pure`. At least `gitFetch.minFailures`
        # within the window, so one dropped connection does not fire: Argo CD
        # retries every few minutes, and a repository that is really
        # unreachable fails on every attempt.
        - alert: ArgoCDGitFetchFailing
          expr: >-
            sum by (k8s_cluster_name, repo) (
              increase_pure(argocd_git_fetch_fail_total{job=~"argocd-.*-metrics"}[10m])
            ) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The Argo CD repo server cannot fetch {{ $labels.repo }}"
            description: >-
              At least 3 Git fetches of
              {{ $labels.repo }} failed within 10m, for
              5m. Applications that track it cannot see new
              commits or render manifests. Check the repository's address and
              credentials, the Git host, and the repo server's log.
            runbook_url: "https://runbooks.example.com/ArgoCDGitFetchFailing"
        # The deadman for every rule above: no Application is reported at all
        # (the application controller down, its ServiceMonitor gone, the
        # scrape blocked) reads as healthy to rules that compare values.
        - alert: ArgoCDMetricsAbsent
          expr: >-
            (group by (k8s_cluster_name) (max_over_time(argocd_app_info{job=~"argocd-.*-metrics", k8s_cluster_name!=""}[1d])) unless group by (k8s_cluster_name) (argocd_app_info{job=~"argocd-.*-metrics", k8s_cluster_name!=""})) or (absent(argocd_app_info{job=~"argocd-.*-metrics"}) unless on() group(max_over_time(argocd_app_info{job=~"argocd-.*-metrics"}[1d])))
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD has reported no applications for 15m{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }}"
            description: >-
              argocd_app_info{job=~"argocd-.*-metrics"} has not been seen in
              15m{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }}, so none of the Argo CD rules can fire. The
              application controller is down or its metrics endpoint is not
              scraped: check its pod and the ServiceMonitor the chart renders
              (`controller.metrics.serviceMonitor.enabled`).
            runbook_url: "https://runbooks.example.com/ArgoCDMetricsAbsent"
