# expect: which is not an identifier
# A principal whose own `audience` is set and empty, rather than left out.
#
# `tenancy.audience` (below) is a valid, non-empty client id, so the
# proxy's own audience pin is fine — this fixture is about the OTHER
# audience, the per-principal override. Leaving it out entirely falls
# back to `tenancy.audience`; setting it to "" is a different thing that
# looks like a decision and is not one. The chart's own audience shape
# (`^\S+$`) refuses both this and whitespace, but a JSON Schema pattern
# of `^\S*$` already allows an empty string through, so only the
# render-time check here ever sees this particular value.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:example-app:metrics-gate
      audience: ""
      grants:
        - cluster: example-cluster
          namespaces: [example-app]

# `alertmanager.enabled` defaults to true, and with no `notifications`
# receiver configured that refusal fires before this fixture ever
# reaches its own check (see docs/safety.md). This is the minimum
# receiver that satisfies it, so the fixture is preempted no further.
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
