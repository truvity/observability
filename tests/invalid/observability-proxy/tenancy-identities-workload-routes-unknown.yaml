# expect: value must be one of
# A route that is none of metrics, logs, traces is refused by the schema.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: example-app
      groups: [example:example-app]
      workload: {routes: [alerts]}
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]


victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
