# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}

# `ambient`: no `credentialsSecret` anywhere. Every job's pod — metrics
# AND the log job, left at its chart default `enabled: true`, on purpose,
# to prove this mode is not metrics-only the way `credentialProcess` is —
# runs as the rendered ServiceAccount instead, and each store's own AWS
# SDK resolves credentials from whatever ambient identity that carries:
# EKS Pod Identity (the association itself is made outside this chart)
# or, as here, IRSA via the annotation below.
backup:
  enabled: true
  destination: s3://example-backups/observability
  auth:
    mode: ambient
    serviceAccount:
      name: example-observability-backup
      annotations:
        eks.amazonaws.com/role-arn: "<IAM role ARN for the estate's own account, IRSA-trusted to this SA>"
