            - name: "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET"
              valueFrom:
                secretKeyRef:
                  key: 'client-secret'
                  name: 'grafana-client'
            - name: "GF_DATABASE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  key: 'password'
