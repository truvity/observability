# expect: appears twice in `tenancy.writers`
# Two writers with the same `name` would render two VMUsers with the
# same object name, and the operator drops all but one from vmauth's
# config with no error outside `status.currentSyncError`.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  writers:
  - name: dup
    tokenSecret:
      name: example-writer-token
      key: token
    destinations:
    - metrics
  - name: dup
    tokenSecret:
      name: example-writer-token-2
      key: token
    destinations:
    - logs
