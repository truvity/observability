# Allow-list of every key in charts/observability-stack/values.yaml and
# values.schema.json (restructure R0.5, step 0). Checked by
# tests/stack_keys_freeze_test.go. `values:` paths are mapping keys in
# values.yaml; `schema:` paths are declared properties in the schema
# (`[]` an array item, `*` a map value).
#
# Do not add to `keys`. A fix to the stack that needs a new key goes in
# `fixes` with a reason; see docs/contracts.md, "Adding a fix-key".
fixes:
  - key: "schema:notifications.routeLabels"
    reason: "restructure step 1 (a PLANNED restructure key, not a bug fix; added here because the freeze has no separate lane for planned keys): the ordered label names a route may match on. Source-born alerts (alert-ingress) are routed on `source` instead of a fake k8s_cluster_name. Default equals the previous hard-coded vocabulary."
  - key: "values:notifications.routeLabels"
    reason: "default of notifications.routeLabels"
  - key: "schema:backup.serverSideEncryption"
    reason: "bug fix: rclone (logs/traces backup jobs) trusted the S3 ETag as an MD5 and failed every run against an SSE-KMS bucket. Empty default renders nothing."
  - key: "values:backup.serverSideEncryption"
    reason: "default of backup.serverSideEncryption"
  - key: "schema:backup.sseKmsKeyId"
    reason: "optional key id for backup.serverSideEncryption aws:kms"
  - key: "values:backup.sseKmsKeyId"
    reason: "default of backup.sseKmsKeyId"
  - key: "schema:upstreamRules"
    reason: "restructure step 4 (a PLANNED restructure key, not a bug fix; the freeze has no separate lane for planned keys): who applies the upstream rule sets. The pack that replaces the sync job lives in charts/platform-alerts, which this chart cannot see, so the stack needs one key to know that its sync job is not the source (own Watchdog off, sync job refused while still on). Default `sync-job` renders what the chart always rendered."
  - key: "schema:upstreamRules.source"
    reason: "the enum `sync-job` (default) or `platform-alerts` of upstreamRules"
  - key: "values:upstreamRules"
    reason: "default of upstreamRules"
  - key: "values:upstreamRules.source"
    reason: "default of upstreamRules.source (`sync-job`)"
