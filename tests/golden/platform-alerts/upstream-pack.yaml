apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts-upstream-vm-health
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - name: vm-health
      rules:
      - alert: TooManyRestarts
        annotations:
          description: |
            Job {{ $labels.job }} (instance {{ $labels.instance }}) has restarted more than twice in the last 15 minutes. It might be crashlooping.
          summary: '{{ $labels.job }} too many restarts (instance {{ $labels.instance }})'
        expr: changes(process_start_time_seconds{job=~".*(victoriametrics|vmselect|vminsert|vmstorage|vmagent|vmalert|vmsingle|vmalertmanager|vmauth).*"}[15m])
          > 2
        labels:
          severity: critical
      - alert: UncleanShutdown
        annotations:
          description: |
            The previous process run didn't shut down cleanly. Check the logs for OOM, SIGKILL,
            a host failure, or another unexpected termination. In Kubernetes, a pod may be forcefully
            killed with SIGKILL if the shutdown takes longer than terminationGracePeriodSeconds.
            This alert stops firing 10 minutes after startup.
            See https://github.com/VictoriaMetrics/VictoriaMetrics/issues/8443 for more details.
          summary: '{{ $labels.job }} on instance {{ $labels.instance }} started after an
            unclean shutdown'
        expr: (vm_app_prev_shutdown_unclean == 1) and ((time() - vm_app_start_timestamp)
          < 600)
        labels:
          severity: warning
      - alert: ServiceDown
        annotations:
          description: '{{ $labels.instance }} of job {{ $labels.job }} has been down for
            more than 2 minutes.'
          summary: Service {{ $labels.job }} is down on {{ $labels.instance }}
        expr: up{job=~".*(victoriametrics|vmselect|vminsert|vmstorage|vmagent|vmalert|vmsingle|vmalertmanager|vmauth).*"}
          == 0
        for: 2m
        labels:
          severity: critical
      - alert: ProcessNearFDLimits
        annotations:
          description: |
            Exhausting OS file descriptors limit can cause severe degradation of the process.
            Consider to increase the limit as fast as possible.
          summary: Number of free file descriptors is less than 100 for "{{ $labels.job
            }}"("{{ $labels.instance }}") for the last 5m
        expr: (process_max_fds - process_open_fds) < 100
        for: 5m
        labels:
          severity: critical
      - alert: TooHighMemoryUsage
        annotations:
          description: |
            Too high memory usage may result into multiple issues such as OOMs or degraded performance.
            Consider to either increase available memory or decrease the load on the process.
          summary: It is more than 80% of memory used by "{{ $labels.job }}"("{{ $labels.instance
            }}")
        expr: (min_over_time(process_resident_memory_anon_bytes[10m]) / vm_available_memory_bytes)
          > 0.8
        for: 5m
        labels:
          severity: critical
      - alert: TooHighCPUUsage
        annotations:
          description: |
            Too high CPU usage may be a sign of insufficient resources and make process unstable. Consider to either increase available CPU resources or decrease the load on the process.
          summary: More than 90% of CPU is used by "{{ $labels.job }}"("{{ $labels.instance
            }}") during the last 5m
        expr: (rate(process_cpu_seconds_total[5m]) / process_cpu_cores_available) > 0.9
        for: 5m
        labels:
          severity: critical
      - alert: TooHighGoroutineSchedulingLatency
        annotations:
          description: |
            Go runtime is unable to schedule goroutines execution in acceptable time. This is usually a sign of insufficient CPU resources or CPU throttling. Verify that service has enough CPU resources. Otherwise, the service could work unreliably with delays in processing.
          summary: '"{{ $labels.job }}"("{{ $labels.instance }}") has insufficient CPU resources
            for >15m'
        expr: histogram_quantile(0.99, sum(rate(go_sched_latencies_seconds_bucket{job=~".*(victoriametrics|vmselect|vminsert|vmstorage|vmagent|vmalert|vmsingle|vmalertmanager|vmauth).*"}[5m]))
          by(le,job,instance)) > 0.1
        for: 15m
        labels:
          severity: critical
      - alert: TooManyErrorLogs
        annotations:
          description: |
            The job "{{ $labels.job }}" ({{ $labels.instance }}) generated too many {{ $labels.level }} logs at {{ $labels.location }} for the last 5 minutes.
      
      
            Actions:
            - Check {{ $labels.level }} logs produced by {{ $labels.job }} ({{ $labels.instance }}) component.
            - Use `source_code_url` annotation to check the source code that produced the log message.
      
            NOTE: The metric `vm_log_messages_total` tracks all log messages including those suppressed by `-loggerLevel`. Check the `is_printed` label to see whether the log was actually printed.
          source_code_url: '{{ with printf "last_over_time(vm_log_messages_total{job=%q,instance=%q,location=%q}[6m])"
            $labels.job $labels.instance $labels.location | query }}{{ with index . 0 }}https://l2s.victoriametrics.com/?app_version={{
            .Labels.app_version }}&location={{ $labels.location | urlquery }}{{ end }}{{
            end }}'
          summary: '"{{ $labels.job }}" ({{ $labels.instance }}) generates too many {{ $labels.level
            }} logs at {{ $labels.location }}'
        expr: sum(increase(vm_log_messages_total{level=~"error|fatal|panic"}[1m])) without(app_version,is_printed)
          > 0
        for: 5m
        labels:
          severity: warning
      - alert: TooManyLogs
        annotations:
          description: |
            The job "{{ $labels.job }}" ({{ $labels.instance }}) generated warn logs for the last 15 minutes.
      
            Actions:
            - Check {{ $labels.level }} logs produced by {{ $labels.job }} ({{ $labels.instance }}) component.
            - Query `rate(vm_log_messages_total{job="{{ $labels.job }}",instance="{{ $labels.instance }}",level="warn"}[5m])` to find the source code locations generating the warnings.
      
            NOTE: The metric `vm_log_messages_total` tracks all log messages including those suppressed by `-loggerLevel`. Check the `is_printed` label to see whether the log was actually printed.
          summary: '"{{ $labels.job }}" ({{ $labels.instance }}) generates too many warn
            logs'
        expr: sum(increase(vm_log_messages_total{level="warn"}[5m])) without(app_version,location,is_printed)
          > 0
        for: 15m
        labels:
          severity: warning
      - alert: ConcurrentInsertsHitTheLimit
        annotations:
          description: "The limit of concurrent inserts on instance {{ $labels.instance
            }} depends on the number of CPUs.\nUsually, when component constantly hits the
            limit it is likely the component is overloaded and requires more CPU.\nIn some
            cases for components like vmagent or vminsert the alert might trigger if there
            are too many clients\nmaking write attempts. If vmagent's or vminsert's CPU
            usage and network saturation are at normal level, then \nit might be worth adjusting
            `-maxConcurrentInserts` cmd-line flag.\n"
          summary: '{{ $labels.job }} on instance {{ $labels.instance }} is constantly hitting
            concurrent inserts limit'
        expr: avg_over_time(vm_concurrent_insert_current[1m]) >= vm_concurrent_insert_capacity
        for: 15m
        labels:
          severity: warning
      - alert: TooHighQueryLoad
        annotations:
          description: |
            Instance {{ $labels.instance }} ({{ $labels.job }}) is failing to serve read queries during last 15m.
            Concurrency limit `-search.maxConcurrentRequests` was reached on this instance and extra queries were
            put into the queue for `-search.maxQueueDuration` interval. But even after waiting in the queue these queries weren't served.
            This happens if instance is overloaded with the current workload, or datasource is too slow to respond.
            Possible solutions are the following:
            * reduce the query load;
            * increase compute resources or number of replicas;
            * adjust limits `-search.maxConcurrentRequests` and `-search.maxQueueDuration`.
            See more at https://docs.victoriametrics.com/victoriametrics/troubleshooting/#slow-queries.
          summary: Read queries fail with timeout for {{ $labels.job }} on instance {{ $labels.instance
            }}
        expr: increase(vm_concurrent_select_limit_timeout_total[5m]) > 0
        for: 15m
        labels:
          severity: warning
      - alert: RowsRejectedOnIngestion
        annotations:
          description: 'Ingested rows on instance "{{ $labels.instance }}" are rejected
            due to the following reason: "{{ $labels.reason }}"'
          summary: Some rows are rejected on "{{ $labels.instance }}" on ingestion attempt
        expr: rate(vm_rows_ignored_total[5m]) > 0
        for: 15m
        labels:
          severity: warning

