# Source: observability-stack/templates/vmalertmanager.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: observability-stack
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  replicaCount: 1
  resources:
    limits:
      cpu: "1"
      memory: 256Mi
    requests:
      cpu: "1"
      memory: 256Mi
  selectAllByDefault: false
  volumes:
    - name: notifications-slack
      secret:
        secretName: "example-slack-webhook"
  volumeMounts:
    - name: notifications-slack
      mountPath: /etc/alertmanager/notifications-slack
      readOnly: true
  configRawYaml: |
    route:
      # `notifications-none` is a receiver with no configs: Alertmanager
      # accepts that as a legitimate "do not send" target. It is the root
      # receiver and the catch-all for a severity this chart's routing
      # tree does not know (there is deliberately no `info` route — see
      # docs/notifications.md), never a route somebody forgot to write.
      receiver: notifications-none
      group_by:
        - alertname
        - k8s_cluster_name
        - k8s_namespace_name
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match: {}
          receiver: notifications-none
          continue: true
          routes:
            - match:
                severity: critical
              receiver: slack-alerts-critical
            - match:
                severity: warning
              receiver: slack-alerts
    receivers:
      - name: notifications-none
      - name: slack-alerts
        slack_configs:
          - channel: "#alerts"
            api_url_file: /etc/alertmanager/notifications-slack/url
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ .CommonLabels.k8s_cluster_name }}/{{ .CommonLabels.k8s_namespace_name }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              Grafana: https://grafana.example/?var-cluster={{ .Labels.k8s_cluster_name }}&var-namespace={{ .Labels.k8s_namespace_name }}
              {{ end }}
              Silence: {{ .ExternalURL }}/#/silences/new?filter=%7B{{ range .CommonLabels.SortedPairs }}{{ .Name }}%3D%22{{ .Value }}%22%2C{{ end }}%7D
      - name: slack-alerts-critical
        slack_configs:
          - channel: "#alerts-critical"
            api_url_file: /etc/alertmanager/notifications-slack/url
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ .CommonLabels.k8s_cluster_name }}/{{ .CommonLabels.k8s_namespace_name }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              Grafana: https://grafana.example/?var-cluster={{ .Labels.k8s_cluster_name }}&var-namespace={{ .Labels.k8s_namespace_name }}
              {{ end }}
              Silence: {{ .ExternalURL }}/#/silences/new?filter=%7B{{ range .CommonLabels.SortedPairs }}{{ .Name }}%3D%22{{ .Value }}%22%2C{{ end }}%7D
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
          - k8s_cluster_name =~ ".+"
          - k8s_namespace_name =~ ".+"
        target_matchers:
          - severity = "warning"
        equal:
          - k8s_cluster_name
          - k8s_namespace_name

