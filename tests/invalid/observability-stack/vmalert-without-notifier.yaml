# expect: vmalert would evaluate every rule and send the result nowhere
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# A vmalert with no notifier evaluates every rule and sends the result
# nowhere, which is indistinguishable from an estate with no problems.
alertmanager:
  enabled: false
