# observability-crds — the CustomResourceDefinitions this stack depends on,
# owned as their own release.
#
# The chart exists because Helm never upgrades a CRD it installed from a
# chart's crds/ directory: the first install lays them down and every
# upgrade after that silently leaves them where they are. So the CRDs are
# ordinary templates in a release of their own, applied before the
# controllers that read them and with pruning off, and the controllers are
# told not to manage CRDs themselves. docs/adoption.md has the ordering.
#
# There is almost nothing to configure here on purpose. What is installed
# comes from four pinned upstreams and is regenerated by `hack/crds.sh`;
# the only decision a consumer makes is which of the sets this release
# owns.

# -- Which CRD sets this release installs.
#
# Turn a set off when something else on the cluster already owns those
# objects — most often `prometheusOperator`, on an estate that runs the
# Prometheus Operator itself and lets it manage its own CRDs. Two owners
# applying the same CustomResourceDefinition take turns overwriting each
# other, and the loser is whichever reconciled last.
#
# Turning every set off is refused: a CRD release that installs nothing is a
# Synced application that has done nothing, and the controller behind it
# fails much later with an error about an unknown kind.
#
# `grafanaOperator` is OFF by default, unlike the other two: it is the
# CRD set of the grafana-operator that charts/observability-cluster installs
# on a cluster that opts in, and a cluster that does not opt in has no use
# for thirteen more kinds. Turn it on BEFORE that cluster enables the
# operator (docs/adoption.md). The Grafana kind alone is 345 KB, past the 256 KiB a client-side
# apply can annotate, so this set is applied server-side (Argo CD:
# `ServerSideApply=true`).
#
# `envoyGateway` is OFF by default too, and is not an installation of Envoy
# Gateway: it is ONE kind of its CRDs, the SecurityPolicy that
# charts/observability-stack renders (`tenancy.authz`) to attach the
# external authorisation service to a route. Envoy Gateway's own release
# owns that CRD wherever it runs; turn this on only on a cluster whose Envoy
# Gateway release does not install it, or two owners will take turns
# overwriting it. It is vendored so the repository's schema check can walk
# the SecurityPolicy it renders. Server-side apply, like the set above (the
# kind is about 250 KB).
#
# `externalSecrets` is the same kind of thing: TWO kinds of External Secrets
# Operator's CRDs, the ExternalSecret and the SSHKey generator that
# charts/observability-stack renders (`tenancy.authz.signingKey.source:
# eso`). Off by default; the operator's own release owns them wherever it
# runs.
sets:
  victoriaMetrics: true
  prometheusOperator: true
  grafanaOperator: false
  envoyGateway: false
  externalSecrets: false
