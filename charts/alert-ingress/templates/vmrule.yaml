{{- include "alert-ingress.validate" . -}}
{{- /*
This service's own deadman, rendered by the CHART rather than written by
the estate — the one place docs/alert-ingress.md and docs/doctrine.md
both insist on it. A notification service retries and then gives up
quietly; nothing on the estate's side is otherwise told that a topic
stopped delivering, or that this Deployment itself is gone. The
heartbeat is the one message this service is guaranteed to see on a
schedule, so its own counter's silence is the signal — an estate that
forgot to wire up the scheduled ping gets a firing rule from day one
rather than a false sense that the path works.
*/}}
{{- $window := include "alert-ingress.doubleDuration" .Values.heartbeat.interval -}}
{{- $hb := .Values.rules.heartbeat.enabled -}}
{{- $rej := .Values.rules.rejectedMessages -}}
{{- $sqsFail := .Values.rules.sqsReceiveFailing -}}
{{- $sqsAge := .Values.rules.sqsMessageAge -}}
{{- if or $hb $rej.enabled $sqsFail.enabled $sqsAge.enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "alert-ingress.fullname" . }}
  labels:
    {{- include "alert-ingress.labels" . | nindent 4 }}
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    {{- if $hb }}
    - name: alert-ingress.heartbeat
      # Evaluated far more often than the heartbeat interval itself: the
      # window this rule watches is what makes it tolerant of a single
      # missed or delayed ping, not a slow evaluation cadence.
      interval: 1m
      rules:
        # `absent_over_time` catches the counter (and the series
        # entirely) disappearing — this Deployment gone, or scraping
        # broken. `increase(...) == 0` catches the series still existing
        # but not advancing — the heartbeat recognised once, long ago,
        # and never again. Either half firing alone is the same failure
        # from this rule's point of view: nothing has proven the path is
        # alive in two heartbeat intervals.
        #
        # Summed across the replicas (`without (pod, instance)`): the
        # provider delivers each heartbeat to ONE pod behind the Service, so
        # per pod a quiet replica's counter stands still while the path is
        # perfectly alive. Only the whole Deployment counting nothing is a
        # missing heartbeat.
        - alert: AlertIngressHeartbeatMissing
          expr: >-
            absent_over_time(alert_ingress_messages_total{mapping="heartbeat"}[{{ $window }}])
            or
            sum without (pod, instance) (increase(alert_ingress_messages_total{mapping="heartbeat"}[{{ $window }}])) == 0
          labels:
            severity: critical
          annotations:
            summary: "alert-ingress has not counted its own heartbeat in {{ $window }}"
            description: >-
              No message matching `heartbeat.match` has been recognised in
              {{ $window }} ({{ .Values.heartbeat.interval }} x 2). Either the
              estate's scheduled heartbeat event stopped publishing, the
              cloud provider's own topic stopped delivering, or this
              Deployment is not running at all — from outside, every one
              of those looks like an estate that is simply quiet, which is
              the entire reason this rule exists.
    {{- end }}
    {{- if $rej.enabled }}
    - name: alert-ingress.rejected
      interval: 1m
      rules:
        # Every refusal is counted with its reason (signature, unknown_topic,
        # malformed, confirmation, unsupported_type). A burst of one or two is
        # a scanner finding the public route; a SUSTAINED rate is either an
        # attacker working at it, or the estate's own topic misconfigured
        # (a new topic nobody allow-listed, a changed signing region) so that
        # real alerts are being turned away.
        - alert: AlertIngressMessagesRejected
          expr: >-
            sum by (reason) (rate(alert_ingress_rejected_total[{{ $rej.window }}])) > {{ $rej.ratePerSecond }}
          for: {{ $rej.for }}
          labels:
            severity: warning
          annotations:
            summary: "alert-ingress is rejecting messages ({{ "{{ $labels.reason }}" }})"
            description: >-
              Messages refused with a 403 for reason
              `{{ "{{ $labels.reason }}" }}` at {{ "{{ $value | humanize }}" }}/s,
              above {{ $rej.ratePerSecond }}/s for {{ $rej.for }}. `signature`
              and `malformed` mean something that is not the cloud provider is
              posting to the public route; `unknown_topic` usually means a
              topic that was never added to `topics`, so its real alerts are
              being dropped.
    {{- end }}
{{- if or $sqsFail.enabled $sqsAge.enabled }}
    - name: alert-ingress.sqs
      interval: 1m
      rules:
        {{- if $sqsFail.enabled }}
        # ReceiveMessage failing is the queue input being deaf: nothing is
        # read, so nothing is alerted, and the heartbeat is the only other
        # witness. Summed across the replicas.
        - alert: AlertIngressSQSReceiveFailing
          expr: >-
            sum without (pod, instance) (rate(alert_ingress_sqs_receive_errors_total[{{ $sqsFail.window }}])) > 0
          for: {{ $sqsFail.for }}
          labels:
            severity: warning
          annotations:
            summary: "alert-ingress cannot receive from its SQS queue"
            description: >-
              ReceiveMessage has been failing for {{ $sqsFail.for }}. Check
              the pod's credentials (`sqs:ReceiveMessage` on the queue,
              `kms:Decrypt` for an encrypted queue), the queue URL and
              region, and egress to the SQS endpoint.
        {{- end }}
        {{- if $sqsAge.enabled }}
        # A gauge, not a counter, so it is the MAX across the replicas: a
        # sum would double the age with two pods. A message the consumer
        # keeps failing to deliver, or a consumer that stopped, both show
        # as the oldest message growing; an empty receive resets it to 0.
        - alert: AlertIngressSQSMessageAge
          expr: >-
            max without (pod, instance) (alert_ingress_sqs_oldest_message_age_seconds) > {{ mul ($sqsAge.minutes | int) 60 }}
          for: {{ $sqsAge.for }}
          labels:
            severity: warning
          annotations:
            summary: "alert-ingress has a queue message older than {{ $sqsAge.minutes }}m"
            description: >-
              The oldest message seen on the queue is
              {{ "{{ $value | humanizeDuration }}" }} old, above
              {{ $sqsAge.minutes }}m. Alertmanager may be refusing alerts
              (the message stays until the visibility timeout, then retries
              until the queue's redrive policy moves it to the dead-letter
              queue), or the consumer is not running.
        {{- end }}
{{- end }}
{{- end }}
