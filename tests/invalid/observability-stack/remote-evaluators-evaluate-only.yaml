# expect: `notifications.mode` is `evaluate-only`
# Nobody to notify.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  mode: evaluate-only

alertmanager:
  enabled: false

victoria-metrics-k8s-stack:
  defaultRules:
    sources:
      alertmanager:
        enabled: false

vmalert:
  remoteEvaluators:
    - name: other-store
      datasource:
        url: https://metrics.other-store.example
        auth:
          bearer: {secretName: example-other-store-read, key: token}

