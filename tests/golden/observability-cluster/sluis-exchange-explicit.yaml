---
# Source: observability-cluster/charts/grafana-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-cluster-grafana-operator
  namespace: default
  labels:
    helm.sh/chart: grafana-operator-5.25.0
    app.kubernetes.io/name: grafana-operator
    app.kubernetes.io/instance: observability-cluster
    app.kubernetes.io/version: "v5.25.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: grafana-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-operator
      app.kubernetes.io/instance: observability-cluster
  template:
    metadata:
      labels:
        helm.sh/chart: grafana-operator-5.25.0
        app.kubernetes.io/name: grafana-operator
        app.kubernetes.io/instance: observability-cluster
        app.kubernetes.io/version: "v5.25.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: grafana-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: observability-cluster-grafana-operator
      hostUsers: true
      containers:
        - name: grafana-operator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: "ghcr.io/grafana/grafana-operator:v5.25.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              value: ""
            - name: WATCH_NAMESPACE_SELECTOR
              value: ""
            - name: WATCH_LABEL_SELECTORS
              value: ""
            - name: ENFORCE_CACHE_LABELS
              value: "safe"
            - name: CLUSTER_DOMAIN
              value: ""
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0.0.0.0:9090
            - --pprof-addr=0.0.0.0:8888
            - --zap-encoder=console
            - --zap-log-level=info
            - --zap-time-encoding=rfc3339
            - --default-resync-period=10m
            - --leader-elect
            - --max-concurrent-reconciles=1
            - --gomemlimit-ratio=0.9
          volumeMounts:
            - name: dashboards-dir
              mountPath: /tmp/dashboards
            - name: kubeauth-token-volume
              mountPath: /var/run/secrets/grafana.com/serviceaccount
              readOnly: true
          ports:
            - containerPort: 9090
              name: metrics
              protocol: TCP
            - containerPort: 8888
              name: pprof
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
        - command:
          - sh
          - -c
          - |
            set -u
            dir=/var/run/secrets/grafana.com/serviceaccount
            subject=/var/run/secrets/exchange/token
            log() { printf '%s token-exchange: %s\n' "$(date -u +%FT%TZ)" "$*"; }
            while :; do
              wait=30
              out=$(curl -sS --max-time 20 -w '\n%{http_code}' -u "${CLIENT_ID}:" \
                --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
                --data-urlencode "subject_token@${subject}" \
                --data-urlencode subject_token_type=urn:ietf:params:oauth:token-type:jwt \
                --data-urlencode "audience=${CLIENT_ID}" \
                "${ISSUER_URL%/}/token" 2>&1) || true
              code=$(printf '%s\n' "$out" | tail -n 1)
              token=$(printf '%s\n' "$out" | sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              if [ "$code" = 200 ] && [ -n "$token" ]; then
                printf '%s' "$token" > "$dir/.token.new"
                chmod 0644 "$dir/.token.new"
                mv "$dir/.token.new" "$dir/token"
                log "token written, next refresh in ${REFRESH_SECONDS}s"
                wait=$REFRESH_SECONDS
              else
                # The status only: the body of a failure is nothing to print, and a body may carry a token.
                log "exchange failed (http status ${code:-none}), retrying in ${wait}s"
              fi
              token=
              out=
              sleep "$wait"
            done
          envFrom:
          - configMapRef:
              name: 'observability-cluster-operator-token-exchange'
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          name: token-exchange
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - test -s /var/run/secrets/grafana.com/serviceaccount/token
            periodSeconds: 10
          resources:
            limits:
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - mountPath: /var/run/secrets/grafana.com/serviceaccount
            name: kubeauth-token-volume
          - mountPath: /var/run/secrets/exchange
            name: kubeauth-subject-token
            readOnly: true
      volumes:
        - name: dashboards-dir
          emptyDir:
            {}
        - name: kubeauth-token-volume
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: kubeauth-subject-token
          projected:
            sources:
            - serviceAccountToken:
                audience: issuer.example.org
                expirationSeconds: 3600
                path: token

---
# Source: observability-cluster/templates/grafana.yaml
# The shared Grafana, as this cluster's operator sees it. `spec.external`: the
# operator deploys nothing for it. The credential is a reference to a Secret
# this chart neither creates nor reads.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: default
  labels:
    app.kubernetes.io/name: observability-cluster
    app.kubernetes.io/instance: observability-cluster
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability
    helm.sh/chart: observability-cluster-0.0.0
    observability.truvity.io/grafana: shared
spec:
  client:
    # The token is a file the operator reads again whenever it expires; the
    # token sidecar of the operator pod keeps it fresh.
    useKubeAuth: true
  external:
    url: "https://grafana.example.org"

---
# Source: observability-cluster/templates/grafana.yaml
# This cluster's folder in the shared Grafana. Component dashboards put
# themselves in it by `folderUID`.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: example-cluster
  namespace: default
  labels:
    app.kubernetes.io/name: observability-cluster
    app.kubernetes.io/instance: observability-cluster
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability
    helm.sh/chart: observability-cluster-0.0.0
spec:
  title: "example-cluster"
  uid: "example-cluster"
  instanceSelector:
    matchLabels:
      observability.truvity.io/grafana: shared
