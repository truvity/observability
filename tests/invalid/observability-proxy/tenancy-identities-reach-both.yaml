# expect: sets both `reach.wholeStore` and `reach.clusters`
# A reach that is both whole-store and per-cluster is ambiguous, and an ambiguous grant widens.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  storeClusters: [cluster-a]
  identities:
    - name: viewers
      groups: [example:viewers]
      reach:
        wholeStore: true
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]

victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
