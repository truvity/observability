# platform-alerts — the rules that fire when something has stopped working
# while everything still looks green.
#
# Every rule here was written after an incident, and every threshold is
# stated against a measured healthy range rather than a guess. The comments
# say which incident and which range; docs/safety.md says it at length.
#
# The expressions are MetricsQL and are evaluated by vmalert. Duration
# literals (`26h`) are used in arithmetic, which MetricsQL supports and
# PromQL does not.

# -- Name overrides for the rendered VMRule object.
nameOverride: ""
fullnameOverride: ""

# -- Labels on the VMRule object itself. vmalert selects rule objects by
# these, so an install that runs more than one vmalert puts the selector
# here.
ruleLabels: {}

# -- Labels added to every rule, merged under each rule's own `severity`.
# The Alertmanager routing tree reads these: an estate that routes by
# cluster or environment sets them here, once.
commonLabels: {}

# -- Base URL for the runbook link on every alert. The alert's name is
# appended, so `https://example.com/runbooks` yields
# `https://example.com/runbooks/WritePathDead`. Empty renders no link.
runbookBaseUrl: ""

# -- How often vmalert evaluates these groups.
interval: 1m

# -- The label that names the cluster a series came from, on a metrics
# store that holds several clusters (the shared-store topology: remote
# emitters write with the cluster identity forced, see
# charts/observability-stack `tenancy.clusterLabel`, which this must
# equal). Every join and per-object aggregation in the rules matches on it
# in addition to namespace and object name, because two clusters can share
# a namespace, a Job name or a PVC name; without it those rules fail with
# a duplicate-series error (vmalert health `err`, HTTP 422) and never
# fire. On a single-cluster store, where the label is absent on both sides,
# it still matches (both empty), so the default is safe there too.
# Empty restores the expressions of 0.11.2 byte for byte (a store that
# names its clusters some other way and does not want the label matched).
clusterLabel: k8s_cluster_name

# -- Only consider objects in namespaces matching this regular expression.
# `.*` is every namespace; an estate that runs these rules for the platform
# alone narrows it here.
namespaceSelector: ".*"

# -- The stores these rules watch, one entry per store process.
#
# There is no default list, and a group that needs one refuses to render
# without it. That is deliberate: every store exports its counters under
# its own names, and a guessed metric name is how a rule silently never
# fires — the failure this chart exists to prevent. Name the counters your
# stores actually export.
#
# For the VictoriaMetrics family the shapes are:
#
#   stores:
#     - name: metrics
#       rowsMetric: vm_rows_inserted_total
#       freeSpaceMetric: vm_free_disk_space_bytes
#       freeSpaceLimitMetric: vm_free_disk_space_limit_bytes
#     - name: logs
#       rowsMetric: vl_rows_ingested_total
#
# `name` labels the alert. `rowsMetric` is the counter the write-path
# deadman watches. The two free-space metrics are optional and enable the
# read-only rule for that store; a store that exports no such limit simply
# gets no read-only rule, which is the honest outcome.
stores: []

groups:
  # Backups and scheduled work.
  #
  # The incident: a backup CronJob stopped being scheduled at all and was
  # silent for two days. A job that never runs never produces a failed Job,
  # so "no failures" is not "working" — only the age of the last SUCCESS
  # can see it.
  backups:
    enabled: true
    # -- Age of the last successful run past which a CronJob is considered
    # not to be succeeding: its schedule plus enough slack that a slow run
    # or a retry does not page. 26h suits a daily job.
    maxSuccessAge: 26h
    severity: critical
    # -- A Job that has failed at all. Separate from the age rule because a
    # job that fails loudly and a job that vanishes quietly are different
    # failures and often have different owners.
    failedSeverity: warning
    # -- Skip SUSPENDED CronJobs in both rules (0.11.0). Suspending a
    # CronJob is a decision written into its spec; before this, both
    # rules fired on it for as long as it stayed suspended. The cost: an
    # ACCIDENTAL suspension is no longer caught here — read
    # `kube_cronjob_spec_suspend` in a review or a dashboard instead.
    # Absent that series (an older kube-state-metrics, a trimmed
    # collector list) both rules behave exactly as before, never
    # silently. `false` renders the 0.10.0 expressions byte for byte.
    ignoreSuspended: true

  # The write path.
  #
  # The incident: a metrics store went read-only and served reads happily
  # for twenty minutes with nothing noticing. An alert on the store's own
  # read-only FLAG cannot fire in that case, because the sample carrying it
  # is written INTO the store that is refusing writes. Watching the rows
  # counter stop is the only rule that can see it.
  #
  # Requires `stores` with a `rowsMetric` on each entry.
  writePath:
    enabled: true
    # -- Window over which the ingestion rate is measured.
    window: 5m
    # -- How long the rate must stay at zero before the alert fires. Long
    # enough to ride out a restart, short enough to beat the retention of
    # whatever is buffering upstream.
    for: 10m
    severity: critical

  # Volumes.
  #
  # The incident: a pod reported 1/1 Running while writing to the node's
  # root filesystem, because its real volume was never mounted. A mounted
  # filesystem is always somewhat smaller than the claim that satisfied it
  # (filesystem overhead; measured healthy range here is 0.95–0.99 of the
  # claim), but it is never a fraction of it.
  volumes:
    enabled: true
    # -- Fire when the mounted filesystem is smaller than this fraction of
    # the claim. 0.5 sits roughly 2x below the measured healthy range, so
    # overhead can never reach it and a wrong mount always does.
    minCapacityRatio: 0.5
    severity: critical

  # Store limits.
  #
  # The threshold comes from the store's OWN exported limit, never from a
  # constant written here: a guessed constant is how a rule either never
  # fires or always does. A store that exports no such limit gets no rule.
  #
  # Requires `stores` with `freeSpaceMetric` and `freeSpaceLimitMetric`.
  storeLimits:
    enabled: true
    # -- Fire while free space is still this multiple of the limit at which
    # the store stops accepting writes, so the alert arrives with room to
    # act rather than at the moment writes fail.
    headroomFactor: 2
    severity: warning

  # Kargo promotions.
  #
  # Off by default: not every estate runs Kargo, and a group that watches a
  # CRD nobody installed would just never fire, which is a different
  # honest outcome from the one this chart insists on elsewhere — so it
  # asks rather than assumes, same as `stores` above.
  #
  # The series come from kube-state-metrics' own `customResourceState`
  # feature, configured by the ESTATE, never by this chart — the same
  # boundary `stores` draws: a guessed metric name is how a rule silently
  # never fires. See docs/kube-state-metrics.md for a worked config.
  #
  #   kargo_stage_condition{namespace, stage, type, reason}
  #     A gauge: 1 while the Stage condition named by `type`/`reason` is
  #     True, 0 while it is False or Unknown.
  #   kargo_promotion_phase{namespace, promotion, stage, phase}
  #     A StateSet over Pending, Running, Succeeded, Failed, Errored and
  #     Aborted: 1 on the Promotion's current phase.
  kargo:
    enabled: false
    # -- How long a Stage's Ready condition must read
    # LastPromotionErrored, or a Promotion must sit in the Errored phase
    # with its Stage still unrecovered, before firing. Long enough that a
    # promotion mid-retry does not page.
    for: 15m
    severity: critical
    # -- How long kube-state-metrics can go without exporting either
    # series before the deadman fires. Longer than `for`: a scrape gap
    # that would not yet have tripped the rules above must not trip this
    # one either.
    absentFor: 30m
    # -- Severity of `KargoStateMetricsAbsent`. A blind spot in the
    # `customResourceState` config, not necessarily a stuck promotion —
    # Kargo itself may be healthy underneath it — so it defaults one tier
    # below the rules it is the deadman for.
    absentSeverity: warning
