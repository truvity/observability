    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false

---
# Source: alert-ingress/templates/deployment.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-ingress-cloud-events
  labels:
    app.kubernetes.io/name: cloud-events
    app.kubernetes.io/instance: alert-ingress
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    alertmanager:
      url: "https://vmalertmanager.example.internal:9093"
    topics:
      - <the security-alerts topic ARN>
      - <the budgets topic ARN>
    mappings:
      - alert:
          alertname: CloudSecurityFinding
          annotations:
            runbook: cloud-security-finding
            summary: '{{ .detail.title }}'
          labels:
            k8s_cluster_name: cloud
            source: guardduty
          severity: '{{ if ge .detail.severity 7.0 }}critical{{ else }}warning{{ end }}'
        match:
          detail-type: GuardDuty Finding
        name: guardduty
      - alert:
          alertname: RootConsoleLogin
          labels:
            k8s_cluster_name: cloud
            source: cloudtrail
          severity: critical
        match:
          detail-type: AWS Console Sign In via CloudTrail
          detail.userIdentity.type: Root
        name: root-login
      - alert:
          alertname: BudgetThresholdCrossed
          labels:
            k8s_cluster_name: cloud
            source: budgets
          severity: warning
        match:
          Message.budgetName: '*'
        name: budget
    heartbeat:
      match:
        source: alert-ingress-heartbeat
      interval: "10m"
    resolveAfter: "2h"

