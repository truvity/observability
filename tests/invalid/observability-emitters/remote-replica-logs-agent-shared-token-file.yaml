# expect: the same file as an earlier entry
# Each half of the pair is written with its own credential, on the log agent too.

tenancy:
  cluster: example-cluster
  environment: development

remote:
  name: zone-a
  url: https://write-a.example.private
  tokenSecret: {name: token-a, key: token}
  replicas:
    - name: zone-b
      url: https://write-b.example.private
      tokenSecret: {name: token-b, key: token}
victoria-logs-collector:
  extraVolumes:
    - name: write-token
      secret:
        secretName: example-write-token
  extraVolumeMounts:
    - name: write-token
      mountPath: /etc/observability-write-token
      readOnly: true
  remoteWrite:
    - url: https://write-a.example.private
      bearerTokenFile: /etc/observability-write-token/token
      maxDiskUsagePerURL: 3GB
    - url: https://write-b.example.private
      bearerTokenFile: /etc/observability-write-token/token
      maxDiskUsagePerURL: 3GB
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
