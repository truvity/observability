# Source: observability-alerting/templates/vmalertmanager.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: observability-stack
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  replicaCount: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: "1"
      memory: 256Mi
  selectAllByDefault: false
  disableSelfServiceScrape: true
  volumes:
    - name: notifications-slack-acme
      secret:
        secretName: "example-slack-bot"
  volumeMounts:
    - name: notifications-slack-acme
      mountPath: /etc/alertmanager/notifications-slack-acme
      readOnly: true
  configRawYaml: |
    route:
      # `notifications-none` is a receiver with no configs: Alertmanager
      # accepts that as a legitimate "do not send" target. It is the root
      # receiver and the catch-all for a severity this chart's routing
      # tree does not know (there is deliberately no `info` route — see
      # docs/notifications.md), never a route somebody forgot to write.
      receiver: notifications-none
      group_by:
        - alertname
        - k8s_cluster_name
        - k8s_namespace_name
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # The Slack delivery self-alert, before everything else and with
        # `continue: false`: it says Slack is not delivering, so it must
        # never be routed to Slack, and no route below may claim it.
        # `notifications.slack.failureReceiver` names where it goes; unset,
        # it goes to the null receiver (docs/notifications.md).
        - receiver: notifications-none
          matchers:
            - alertname = "SlackNotificationsFailing"
          continue: false
        # notifications.drop: reaches nobody, by the estate's decision.
        - match:
            alertgroup: general.rules
          receiver: notifications-none
        # notifications.drop: reaches nobody, by the estate's decision.
        - match:
            alertgroup: kubernetes-resources
          receiver: notifications-none
        # notifications.drop: reaches nobody, by the estate's decision.
        - match:
            alertgroup: kubernetes-storage
          receiver: notifications-none
        # notifications.drop: reaches nobody, by the estate's decision.
        - match:
            alertgroup: kubernetes-system
          receiver: notifications-none
        # notifications.drop: reaches nobody, by the estate's decision.
        - match:
            alertgroup: node-network
          receiver: notifications-none
        # notifications.drop: reaches nobody, by the estate's decision.
        - match:
            alertgroup: vm-health
          receiver: notifications-none
        # notifications.drop: reaches nobody, by the estate's decision.
        - match:
            alertgroup: vmoperator
          receiver: notifications-none
        # notifications.drop: reaches nobody, by the estate's decision.
        - match:
            alertgroup: vmsingle
          receiver: notifications-none
        - match: {}
          receiver: notifications-none
          continue: true
          routes:
            - match:
                severity: critical
              receiver: slack-acme--alerts-critical
            - match:
                severity: warning
              receiver: slack-acme--alerts
    receivers:
      - name: notifications-none
      - name: slack-acme--alerts
        slack_configs:
          - channel: "#alerts"
            app_token_file: /etc/alertmanager/notifications-slack-acme/token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://grafana.example/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://grafana.example/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ end }}
      - name: slack-acme--alerts-critical
        slack_configs:
          - channel: "#alerts-critical"
            app_token_file: /etc/alertmanager/notifications-slack-acme/token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://grafana.example/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://grafana.example/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ end }}
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
          - k8s_cluster_name =~ ".+"
          - k8s_namespace_name =~ ".+"
        target_matchers:
          - severity = "warning"
        equal:
          - k8s_cluster_name
          - k8s_namespace_name

