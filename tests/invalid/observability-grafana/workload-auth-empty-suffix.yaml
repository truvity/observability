# expect: at '/global/observabilityGrafana/workloadAuth/noRoleSubjectSuffixes/0'
# An empty suffix matches every subject, which would silently turn the MCP connector into role None.
global:
  observabilityGrafana:
    database:
      host: pg:5432
      secretRef: {name: grafana-pg-app}
    oauth:
      clientId: grafana
      clientSecretRef: {name: grafana-client}
      issuer: https://issuer.example.org
      roleAttributePath: '''Editor'''
    rootUrl: https://grafana.example.org
    secretKeyRef: {name: grafana-secret-key}
    stores:
    - {default: true, name: store-a, url: 'https://a.example.org'}
    workloadAuth: {enabled: true, issuer: 'https://issuer.example.org', jwksUrl: 'https://issuer.example.org/keys', audience: a, noRoleSubjectSuffixes: [""]}
