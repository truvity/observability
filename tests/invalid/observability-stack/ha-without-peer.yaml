# expect: `ha.peer.metrics` is empty
# A primary with no address for the other release has nothing to fail over
# to: the proxy would be given one backend per route and `first_available`
# would be moot.
ha:
  enabled: true
zones:
  - example-1a
  - example-1b
vmauth:
  replicaCount: 2
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true
