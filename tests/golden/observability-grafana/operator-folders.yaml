# Source: observability-grafana/templates/operator-folders.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: observability-grafana-operator-folders
  namespace: default
  labels:
    app.kubernetes.io/name: observability-grafana
    app.kubernetes.io/instance: observability-grafana
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: observability-grafana
            app.kubernetes.io/instance: observability-grafana
            app.kubernetes.io/managed-by: Helm
        spec:
          
          serviceAccountName: observability-grafana-operator-folders
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: "docker.io/curlimages/curl:8.22.0"
              command: ["sh", "/scripts/reconcile.sh"]
              envFrom:
                - configMapRef:
                    name: observability-grafana-operator-folders
              env:
                - name: GRAFANA_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: "grafana-admin"
                      key: "admin-user"
                - name: GRAFANA_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "grafana-admin"
                      key: "admin-password"
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: work, mountPath: /work}
          volumes:
            - name: scripts
              configMap:
                name: observability-grafana-operator-folders
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
