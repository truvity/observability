# expect: `input.sqs.region` is empty and cannot be derived
# A queue URL that is not the AWS shape needs an explicit region.
image:
  repository: ghcr.io/example/alert-ingress
  tag: "1.0.0"
alertmanager:
  url: http://vmalertmanager-observability-stack.observability.svc:9093
topics:
  - "<the security-alerts topic ARN>"
heartbeat:
  match: {"source": "alert-ingress-heartbeat"}
  interval: 15m
networkPolicy:
  alertmanagerPeer:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vmalertmanager
input:
  mode: sqs
  sqs:
    queueURL: http://localhost:4566/ACCOUNT/alerts
