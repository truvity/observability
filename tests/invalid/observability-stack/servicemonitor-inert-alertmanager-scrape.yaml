# expect: Alertmanager's own scrape
#
# Only Alertmanager's own ServiceMonitor is rendered here (the metrics
# self-scrape and the log and trace stores' are off), and the operator's
# Prometheus converter is off: nothing converts the object, so
# `alertmanager_notifications_failed_total` never lands and
# SlackNotificationsFailing could never fire.
metricsSelfScrape:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
victoria-metrics-k8s-stack:
  victoria-metrics-operator:
    operator:
      disable_prometheus_converter: true
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  telegram:
    botTokenSecret: {name: example-telegram-bot, key: bot-token}
    chatId: -1000000000001
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
