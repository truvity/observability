# The platform's own release: the shared Grafana's operator creates a metrics
# and a logs datasource per cluster, each through the proxy with that
# cluster's own token.
cluster: example-platform
externalGrafana:
  enabled: true
  url: http://grafana.example.svc:3000
  credentials:
    secretName: grafana-credentials
folder:
  enabled: false
datasources:
  enabled: true
  proxyUrl: https://telemetry.example.org/
  clusters:
    - name: example-a
      tokenSecret: {name: example-a-datasource-token, key: token}
    - name: example-b
      tokenSecret: {name: example-b-datasource-token, key: token}
