# Source: observability-stack/templates/selfalerts-ha.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: observability-stack-store-alerts
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - name: observability-stack.stores
      interval: 30s
      rules:
        # StoreMemoryNearLimit. The working set of a store container is
        # the number the kernel's OOM killer reads, and a store killed
        # under its limit restarts with a cold cache; on a pair it also
        # leaves a gap the writers' queues have to refill.
        #
        # Healthy range: under 0.8 of the limit. The
        # stores fill the cache they are allowed, so a working set that
        # stays above it is a limit that is too small.
        - alert: StoreMemoryNearLimit
          expr: >-
            max by (k8s_cluster_name, namespace, pod, container) (container_memory_working_set_bytes{namespace="observability", container!="", pod=~"^(vmsingle-observability-stack-victoria-metrics-k8s-stack-.+|observability-stack-victoria-logs-single-server-[0-9]+|observability-stack-vt-single-server-[0-9]+)$"})
            /
            max by (k8s_cluster_name, namespace, pod, container) (kube_pod_container_resource_limits{namespace="observability", resource="memory", pod=~"^(vmsingle-observability-stack-victoria-metrics-k8s-stack-.+|observability-stack-victoria-logs-single-server-[0-9]+|observability-stack-vt-single-server-[0-9]+)$"})
            > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "A store container is above 80% of its memory limit"
            description: >-
              {{ $labels.pod }} ({{ $labels.container }}) has been above
              0.8 of its memory limit for 15m.
              Raise the store's memory request and limit (they are equal), or
              look for a query or a cardinality burst that is holding it.

