# The SCRAPE-DERIVED labels each scrape job's series carry, and the values
# the chart gives the ones it fixes. The sibling of available-metrics.yaml
# (which says which metric NAMES a store holds); this file says which label
# MATCHERS on those names can ever match.
#
# Why it exists: a dashboard whose selector can never match reads "No data"
# with every series in the store. The kubelet dashboard shipped that way:
# every query, and its `cluster` variable, selected on
# `metrics_path="/metrics"`, a label kube-prometheus adds and this chart's
# kubelet and cadvisor jobs did not. A name-only check cannot see that.
#
# Read by tests/dashboard_queries_test.go
# (TestDashboardLabelMatchersCanMatch), over EVERY shipped dashboard.
#
# How a matcher is judged. A query `m{l="v"}` is satisfiable when some job
# below selects `m` (same names/prefixes/deny/keep rules as
# available-metrics.yaml) and either
#   - `l` is not in `scrapeLabels` (a label a series brings itself, in its
#     exposition: `phase`, `condition`, `le`, ... those are not judged), or
#   - `l` is in that job's `labels`, and if the job fixes `values` for `l`,
#     `v` is one of them.
# Only equality matchers (`=`) are judged, and a value that is a Grafana
# variable is not (it is whatever the viewer picks). `!=` and regex
# matchers never make a query unsatisfiable on their own.
#
# Derived from charts/observability-emitters (the two inline node jobs and
# the `tenancy` scrape class every monitor gets) and the live survey; a
# change to those relabel configs and a change here go in the same PR.

# Labels that come from a scrape config, a relabel or the operator, not
# from a series' own exposition. A matcher on one of these must be a label
# the job carries.
scrapeLabels:
  - job
  - instance
  - metrics_path
  - node
  - endpoint
  - service
  - cluster
  - prometheus
  - k8s_cluster_name
  - k8s_namespace_name
  - deployment_environment_name
  - app_kubernetes_io_instance

# Sources a dashboard may depend on that a default install does not run.
# A dashboard that names one under `requires:` in its catalog entry (see
# hack/dashboards/sources.yaml) is checked against the jobs marked
# `onlyWith: <source>` below (and the default jobs) when the source has a job
# here, and is EXEMPT from the label check when it has none, because it is
# then legitimately unsatisfiable until the source ships. Either way it must
# be listed here, so a dashboard cannot opt out by inventing a reason. A
# dashboard that does NOT declare the source never sees its jobs.
optionalSources:
  node-exporter: node-exporter runs only where nodeExporter.enabled (charts/observability-emitters, off by default), so its node_* series are absent from a default install
  alertmanager: Alertmanager is optional; its job and metrics exist only where it is enabled
  acme-issuer: no install issues from an ACME issuer, so certmanager_http_acme_client_* is never created
  envoy-tcp-listeners: envoy_tcp_downstream_* is created only when a TCP listener exists
  envoy-outlier-detection: envoy_cluster_outlier_detection_* is created only when outlier detection is configured
  keycloak-metrics: Keycloak's own /metrics is scraped only where truvity/keycloak's chart turns its ServiceMonitor on, so keycloak_*, agroal_* and the jvm_* of a Keycloak pod are absent from a default install
  cnpg-instance-metrics: the CloudNativePG instance exporter (:9187 on each Postgres pod) is scraped only where the Postgres cluster chart's PodMonitor selects the pods, so cnpg_* and barman_cloud_* are absent from a default install; the operator's own series are not
  openbao-server-metrics: OpenBAO runs only where the secret plane does, and its metrics are scraped only where charts/openbao-ops' serverMetrics PodMonitor is applied, so vault_* is absent from a default install
  external-secrets-metrics: External Secrets Operator's metrics are scraped only where its chart's serviceMonitor.enabled is on, so externalsecret_* is absent from a default install

# The two node jobs (metrics.scrape.kubelet, .cadvisor) are inline scrape
# configs: `job` and `metrics_path` are fixed by the chart. BOTH store
# `job="kubelet"` (0.13.0, the kube-prometheus convention the k8s-stack's
# recording rules select on); the `name:` below is the vmagent scrape name,
# and `metrics_path` is what tells the two apart. The cadvisor scrape gets
# its stored `job` from cadvisorJobLabelRelabelConfig. `node` is
# nodeLabelRelabelConfigs; `k8s_cluster_name` and
# `deployment_environment_name` are tenancy.clusterScopedRelabelConfigs;
# `k8s_namespace_name` is copied from the series' own `namespace` at
# metric-relabel time; `metrics_path` is nodeMetricsPathRelabelConfig.
# `cluster` (the bare label kube-prometheus dashboards default to) is
# carried by nothing; hack/dashboards.py renames it to k8s_cluster_name.
# No `endpoint`/`service`: these targets come from node discovery.
jobs:
  - name: kubelet
    names: [up]
    prefixes: [scrape_, kubelet_, volume_manager_, storage_operation_, rest_client_, go_, process_]
    deny: []
    labels: &nodeLabels [job, instance, metrics_path, node, k8s_cluster_name, k8s_namespace_name, deployment_environment_name]
    values:
      job: [kubelet]
      metrics_path: [/metrics]

  - name: cadvisor
    names: [up]
    prefixes: [scrape_, container_, machine_, go_, process_]
    deny:
      - container_tasks_state
      - container_memory_failures_total
      - container_blkio_device_usage_total
    denySuffixes: [_bucket]
    keep: [go_sched_latencies_seconds_bucket]
    labels: *nodeLabels
    values:
      job: [kubelet]
      metrics_path: [/metrics/cadvisor]

  # node-exporter (nodeExporter.enabled, off by default): a ServiceMonitor
  # from the vendored upstream chart, under the same `tenancy` scrape class.
  # Its endpoint relabelings fix `job` (node-exporter, the kube-prometheus
  # convention) and set `instance` and `node` to the node's name; its metric
  # relabelings drop `k8s_namespace_name`, because a node belongs to no
  # namespace (so no `k8s_namespace_name` matcher can match a node series,
  # the same as the kubelet and cadvisor jobs). The series keep the exporter
  # pod's own `namespace` and `pod` (node.rules joins on them), which are
  # not judged here. The metric names are the same list as the source of the
  # same name in available-metrics.yaml.
  - name: node-exporter
    onlyWith: node-exporter
    names:
      - up
      - node_boot_time_seconds
      - node_context_switches_total
      - node_forks_total
      - node_intr_total
      - node_cpu_seconds_total
      - node_cpu_guest_seconds_total
      - node_load1
      - node_load5
      - node_load15
      - node_time_seconds
      - node_uname_info
      - node_arp_entries
      - node_tcp_connection_states
      - node_exporter_build_info
    prefixes:
      - scrape_
      - go_
      - process_
      - node_memory_
      - node_disk_
      - node_filesystem_
      - node_network_
      - node_netstat_
      - node_sockstat_
      - node_vmstat_
      - node_softnet_
      - node_filefd_
      - node_entropy_
      - node_procs_
      - node_processes_
      - node_timex_
      - node_udp_queues
      - node_scrape_collector_
    labels: [job, instance, node, endpoint, service, k8s_cluster_name, deployment_environment_name, app_kubernetes_io_instance]
    values:
      job: [node-exporter]

  # Everything else is scraped from a PodMonitor or ServiceMonitor, under
  # the `tenancy` scrape class (tenancy.relabelConfigs): the operator sets
  # `job`, `instance`, `namespace`, `pod`, `container`, `endpoint` and
  # `service`; the class adds the three tenancy labels and, when the pod has
  # it, `app_kubernetes_io_instance`. The job NAME depends on the monitor,
  # so it is not pinned. No `node` and no `metrics_path`: nothing sets them.
  - name: kube-state-metrics
    prefixes: [scrape_, kube_, kargo_]
    names: [up]
    # `node` is a label kube-state-metrics' own node and pod series carry.
    labels: [job, instance, endpoint, service, node, k8s_cluster_name, k8s_namespace_name, deployment_environment_name, app_kubernetes_io_instance]

  - name: the stack's own components
    names: [up, ALERTS, ALERTS_FOR_STATE]
    prefixes: [scrape_, vm_, vmagent_, vmalert_, vmauth_, vl_, vt_, vlagent_, operator_, controller_runtime_, workqueue_, otelcol_, go_, process_]
    labels: [job, instance, endpoint, service, k8s_cluster_name, k8s_namespace_name, deployment_environment_name, app_kubernetes_io_instance]

  # -- Platform components (0.13.0). Job names follow the VictoriaMetrics
  # operator's converters (vmscrapes/servicescrape.go, podscrape.go): a
  # ServiceMonitor's job is its Service name; a PodMonitor's job is
  # `<namespace>/<PodMonitor name>`, set as a target label before the scrape
  # class's rules run. The class then adds the tenancy labels and, when the
  # pod has it, `app_kubernetes_io_instance`. The operator also sets
  # `namespace`, `pod`, `container`, `instance`, `endpoint` and `service`.
  #
  # `overrideHonorLabels` forces honor_labels: false, so a series' own label
  # that collides with one of those (ArgoCD's and cert-manager's `namespace`,
  # the Certificate's or Application's) survives only as `exported_<name>`.
  - name: ArgoCD
    names: [up, argocd_app_info, argocd_app_sync_total, argocd_app_reconcile_count, argocd_app_reconcile_bucket, argocd_app_k8s_request_total, argocd_cluster_info, argocd_cluster_api_resources, argocd_cluster_api_resource_objects, argocd_cluster_events_total, argocd_kubectl_exec_pending, argocd_git_request_total, argocd_git_request_duration_seconds_bucket, argocd_redis_request_total, grpc_server_handled_total]
    prefixes: [go_, process_, workqueue_]
    labels: &platformLabels [job, instance, endpoint, service, k8s_cluster_name, k8s_namespace_name, deployment_environment_name, app_kubernetes_io_instance]
    values:
      job: [argocd-application-controller-metrics, argocd-server-metrics, argocd-repo-server-metrics]

  - name: cert-manager
    names: [up, certmanager_certificate_ready_status, certmanager_certificate_expiration_timestamp_seconds, certmanager_controller_sync_call_count]
    prefixes: [go_, process_]
    labels: *platformLabels
    values:
      job: [cert-manager, cainjector, webhook]

  - name: CloudNativePG operator
    names: [up, controller_runtime_reconcile_total, controller_runtime_reconcile_time_seconds_bucket]
    prefixes: [go_, process_, workqueue_]
    labels: *platformLabels
    values:
      job: [cnpg-system/cnpg-cloudnative-pg]

  # The instance exporter (optional source cnpg-instance-metrics). The job is
  # `<namespace>/<PodMonitor name>`, which differs per Postgres cluster, so no
  # `job` value is fixed here. Only cnpg_collector_up and
  # cnpg_collector_postgres_version carry the exporter's own `cluster` label
  # (the Postgres cluster's name, never the install); every other family is
  # selected by `pod`, `namespace` and `container`. The scrape is a PodMonitor,
  # so there is no `service` label.
  - name: CloudNativePG instances (cluster label)
    onlyWith: cnpg-instance-metrics
    names: [up, cnpg_collector_up, cnpg_collector_postgres_version]
    labels: [job, instance, endpoint, cluster, k8s_cluster_name, k8s_namespace_name, deployment_environment_name, app_kubernetes_io_instance]

  - name: CloudNativePG instances
    onlyWith: cnpg-instance-metrics
    names: [up, cnpg_backends_max_tx_duration_seconds, cnpg_backends_total, cnpg_backends_waiting_total, cnpg_collector_collection_duration_seconds, cnpg_collector_first_recoverability_point, cnpg_collector_last_available_backup_timestamp, cnpg_collector_last_collection_error, cnpg_collector_pg_wal, cnpg_collector_pg_wal_archive_status, cnpg_pg_database_size_bytes, cnpg_pg_database_xid_age, cnpg_pg_extensions_update_available, cnpg_pg_postmaster_start_time, cnpg_pg_replication_in_recovery, cnpg_pg_replication_is_wal_receiver_up, cnpg_pg_replication_lag, cnpg_pg_replication_streaming_replicas, cnpg_pg_settings_setting, cnpg_pg_stat_archiver_archived_count, cnpg_pg_stat_archiver_failed_count, cnpg_pg_stat_archiver_seconds_since_last_archival, cnpg_pg_stat_checkpointer_checkpoints_req, cnpg_pg_stat_checkpointer_checkpoints_timed, cnpg_pg_stat_checkpointer_sync_time, cnpg_pg_stat_checkpointer_write_time, cnpg_pg_stat_database_blks_hit, cnpg_pg_stat_database_blks_read, cnpg_pg_stat_database_deadlocks, cnpg_pg_stat_database_temp_bytes, cnpg_pg_stat_database_tup_deleted, cnpg_pg_stat_database_tup_fetched, cnpg_pg_stat_database_tup_inserted, cnpg_pg_stat_database_tup_returned, cnpg_pg_stat_database_tup_updated, cnpg_pg_stat_database_xact_commit, cnpg_pg_stat_database_xact_rollback, cnpg_pg_stat_replication_flush_lag_seconds, cnpg_pg_stat_replication_replay_lag_seconds, cnpg_pg_stat_replication_write_lag_seconds, barman_cloud_cloudnative_pg_io_last_available_backup_timestamp]
    labels: [job, instance, endpoint, k8s_cluster_name, k8s_namespace_name, deployment_environment_name, app_kubernetes_io_instance]

  # Keycloak (optional source keycloak-metrics): a ServiceMonitor on
  # {install}-service, so the job is the Service's name and `service` is set.
  - name: Keycloak
    onlyWith: keycloak-metrics
    names: [up, keycloak_user_events_total, http_server_requests_seconds_count, http_server_requests_seconds_sum, http_server_requests_seconds_bucket, jvm_memory_used_bytes, jvm_memory_max_bytes, jvm_memory_usage_after_gc, agroal_active_count, agroal_available_count, agroal_awaiting_count, vendor_statistics_approximate_entries_unique]
    labels: [job, instance, endpoint, service, k8s_cluster_name, k8s_namespace_name, deployment_environment_name, app_kubernetes_io_instance]

  # NATS series also carry the NATS cluster's own name as `cluster` (plus
  # server_id, server_name, stream_name, consumer_name, account_name and
  # is_meta_leader), so `cluster` is a label of this job. It is never the
  # install: dashboards select the install by k8s_cluster_name, and the
  # imported NATS dashboards use no `cluster` variable.
  - name: NATS
    names: [up, nats_varz_cpu, nats_varz_mem, nats_varz_in_bytes, nats_varz_out_bytes, nats_varz_in_msgs, nats_varz_out_msgs, nats_varz_connections, nats_varz_subscriptions, nats_varz_slow_consumers, nats_varz_jetstream_stats_storage, nats_varz_jetstream_stats_memory, nats_varz_jetstream_config_max_storage, nats_varz_jetstream_config_max_memory, nats_server_jetstream_disabled, nats_server_total_streams, nats_server_total_consumers, nats_stream_total_messages, nats_stream_total_bytes, nats_stream_last_seq, nats_consumer_delivered_consumer_seq, nats_consumer_num_pending, nats_consumer_num_ack_pending]
    labels: [job, instance, endpoint, service, cluster, k8s_cluster_name, k8s_namespace_name, deployment_environment_name, app_kubernetes_io_instance]
    values:
      job: [nats/nats]

  - name: Envoy Gateway controller
    names: [up, watchable_depth, watchable_panics_recovered_total, watchable_subscribe_total, watchable_subscribe_duration_seconds_bucket, watchable_subscribe_duration_seconds_sum, status_update_total, status_update_duration_seconds_bucket, status_update_duration_seconds_sum, status_update_duration_seconds_count, xds_snapshot_create_total, xds_snapshot_update_total, xds_stream_duration_seconds_bucket, xds_stream_duration_seconds_sum, resource_apply_total, resource_apply_duration_seconds_bucket, resource_apply_duration_seconds_sum, resource_apply_duration_seconds_count, resource_delete_total, resource_delete_duration_seconds_bucket, resource_delete_duration_seconds_sum, resource_delete_duration_seconds_count]
    prefixes: [go_, process_, workqueue_, controller_runtime_]
    labels: *platformLabels
    values:
      job: [envoy-gateway-system/envoy-gateway]

  - name: Envoy proxies
    prefixes: [envoy_]
    names: [up]
    labels: *platformLabels
    values:
      job: [envoy-gateway-system/envoy-proxy]

  - name: Kargo controller
    names: [up]
    prefixes: [go_, process_, workqueue_, controller_runtime_]
    labels: *platformLabels
    values:
      job: [kargo-controller-metrics]

  # The OpenBAO server pods (optional source openbao-server-metrics), scraped
  # by a PodMonitor: the job is `<namespace>/<PodMonitor name>`, which the
  # consumer names, so no `job` value is fixed here. `namespace` and `pod` come
  # from the operator and are not judged; OpenBAO's own `namespace` label
  # (token_count, token_creation) survives only as `exported_namespace`.
  - name: OpenBAO server
    onlyWith: openbao-server-metrics
    names: [up, vault_core_unsealed, vault_core_active, vault_core_handle_request, vault_core_handle_request_count, vault_core_handle_login_request, vault_core_handle_login_request_count, vault_autopilot_healthy, vault_autopilot_failure_tolerance, vault_autopilot_node_healthy, vault_raft_storage_stats_commit_index, vault_raft_storage_follower_applied_index_delta, vault_raft_leader_lastContact, vault_raft_state_leader, vault_raft_apply, vault_audit_log_request, vault_audit_log_response, vault_audit_log_request_failure, vault_audit_log_response_failure, vault_token_count, vault_token_creation, vault_expire_num_leases, vault_expire_num_irrevocable_leases]
    labels: [job, instance, endpoint, k8s_cluster_name, k8s_namespace_name, deployment_environment_name, app_kubernetes_io_instance]

  # External Secrets Operator (optional source external-secrets-metrics): three
  # ServiceMonitors, so the job is each Service's name and `service` is set.
  # Its controller-runtime and workqueue series carry `controller` and `name`,
  # the ExternalSecret series `name` and `namespace` of the object (the latter
  # collides with the scrape's and survives as `exported_namespace` under
  # honor_labels: false), none of which are judged here.
  - name: External Secrets Operator
    onlyWith: external-secrets-metrics
    names: [up, externalsecret_status_condition, externalsecret_sync_calls_error, externalsecret_provider_api_calls_count]
    prefixes: [go_, process_, workqueue_, controller_runtime_]
    labels: *platformLabels
    values:
      job: [external-secrets-metrics, external-secrets-webhook-metrics, external-secrets-cert-controller-metrics]
