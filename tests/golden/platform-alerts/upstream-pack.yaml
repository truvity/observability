apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts-upstream-kubernetes-apps
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - name: kubernetes-apps
      rules:
      - alert: KubePodCrashLooping
        annotations:
          description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container
            }}) is in waiting state (reason: "CrashLoopBackOff") on cluster {{ $labels.k8s_cluster_name
            }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodcrashlooping
          summary: Pod is crash looping.
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",job="kube-state-metrics",namespace=~".*"}[5m])
          >= 1
        for: 15m
        labels:
          severity: warning
      - alert: KubePodNotReady
        annotations:
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready
            state for longer than 15 minutes on cluster {{ $labels.k8s_cluster_name }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodnotready
          summary: Pod has been in a non-ready state for more than 15 minutes.
        expr: (sum(max(kube_pod_status_phase{job="kube-state-metrics",phase=~"Pending|Unknown",namespace=~".*"}
          or ((kube_pod_status_phase{job="kube-state-metrics",phase="Running",namespace=~".*"}
          == 1) and on(namespace,pod,k8s_cluster_name) (kube_pod_status_ready{job="kube-state-metrics",condition="true",namespace=~".*"}
          == 0))) by(namespace,pod,job,k8s_cluster_name) * on(namespace,pod,k8s_cluster_name)
          group_left() topk(1, max(kube_pod_owner{owner_kind!="Job"}) by(namespace,pod,owner_kind,k8s_cluster_name))
          by(namespace,pod,k8s_cluster_name)) by(namespace,pod,job,k8s_cluster_name) > 0)
          unless on(namespace,pod,k8s_cluster_name) (kube_pod_status_reason{job="kube-state-metrics",reason="SchedulingGated",namespace=~".*"}
          == 1)
        for: 15m
        labels:
          severity: warning
      - alert: KubeDeploymentGenerationMismatch
        annotations:
          description: Deployment generation for {{ $labels.namespace }}/{{ $labels.deployment
            }} does not match, this indicates that the Deployment has failed but has not
            been rolled back on cluster {{ $labels.k8s_cluster_name }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubedeploymentgenerationmismatch
          summary: Deployment generation mismatch due to possible roll-back
        expr: kube_deployment_status_observed_generation{job="kube-state-metrics",namespace=~".*"}
          != kube_deployment_metadata_generation{job="kube-state-metrics",namespace=~".*"}
        for: 15m
        labels:
          severity: warning
      - alert: KubeDeploymentReplicasMismatch
        annotations:
          description: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not
            matched the expected number of replicas for longer than 15 minutes on cluster
            {{ $labels.k8s_cluster_name }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubedeploymentreplicasmismatch
          summary: Deployment has not matched the expected number of replicas.
        expr: (kube_deployment_spec_replicas{job="kube-state-metrics",namespace=~".*"} >
          kube_deployment_status_replicas_available{job="kube-state-metrics",namespace=~".*"})
          and (changes(kube_deployment_status_replicas_updated{job="kube-state-metrics",namespace=~".*"}[10m])
          == 0)
        for: 15m
        labels:
          severity: warning
      - alert: KubeDeploymentRolloutStuck
        annotations:
          description: Rollout of deployment {{ $labels.namespace }}/{{ $labels.deployment
            }} is not progressing for longer than 15 minutes on cluster {{ $labels.k8s_cluster_name
            }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubedeploymentrolloutstuck
          summary: Deployment rollout is not progressing.
        expr: kube_deployment_status_condition{condition="Progressing",status="false",job="kube-state-metrics",namespace=~".*"}
          != 0
        for: 15m
        labels:
          severity: warning
      - alert: KubeStatefulSetReplicasMismatch
        annotations:
          description: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has
            not matched the expected number of replicas for longer than 15 minutes on cluster
            {{ $labels.k8s_cluster_name }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubestatefulsetreplicasmismatch
          summary: StatefulSet has not matched the expected number of replicas.
        expr: (kube_statefulset_status_replicas_ready{job="kube-state-metrics",namespace=~".*"}
          != kube_statefulset_replicas{job="kube-state-metrics",namespace=~".*"}) and (changes(kube_statefulset_status_replicas_updated{job="kube-state-metrics",namespace=~".*"}[10m])
          == 0)
        for: 15m
        labels:
          severity: warning
      - alert: KubeStatefulSetGenerationMismatch
        annotations:
          description: StatefulSet generation for {{ $labels.namespace }}/{{ $labels.statefulset
            }} does not match, this indicates that the StatefulSet has failed but has not
            been rolled back on cluster {{ $labels.k8s_cluster_name }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubestatefulsetgenerationmismatch
          summary: StatefulSet generation mismatch due to possible roll-back
        expr: kube_statefulset_status_observed_generation{job="kube-state-metrics",namespace=~".*"}
          != kube_statefulset_metadata_generation{job="kube-state-metrics",namespace=~".*"}
        for: 15m
        labels:
          severity: warning
      - alert: KubeStatefulSetUpdateNotRolledOut
        annotations:
          description: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} update
            has not been rolled out on cluster {{ $labels.k8s_cluster_name }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubestatefulsetupdatenotrolledout
          summary: StatefulSet update has not been rolled out.
        expr: (max(kube_statefulset_status_current_revision{job="kube-state-metrics",namespace=~".*"}
          unless kube_statefulset_status_update_revision{job="kube-state-metrics",namespace=~".*"})
          by(namespace,statefulset,job,k8s_cluster_name) * on(namespace,statefulset,job,k8s_cluster_name)
          (kube_statefulset_replicas{job="kube-state-metrics",namespace=~".*"} != kube_statefulset_status_replicas_updated{job="kube-state-metrics",namespace=~".*"}))
          and on(namespace,statefulset,job,k8s_cluster_name) (changes(kube_statefulset_status_replicas_updated{job="kube-state-metrics",namespace=~".*"}[5m])
          == 0)
        for: 15m
        labels:
          severity: warning
      - alert: KubeContainerWaiting
        annotations:
          description: 'pod/{{ $labels.pod }} in namespace {{ $labels.namespace }} on container
            {{ $labels.container}} has been in waiting state for longer than 1 hour. (reason:
            "{{ $labels.reason }}") on cluster {{ $labels.k8s_cluster_name }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecontainerwaiting
          summary: Pod container waiting longer than 1 hour
        expr: kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff",job="kube-state-metrics",namespace=~".*"}
          > 0
        for: 1h
        labels:
          severity: warning
      - alert: KubeDaemonSetNotScheduled
        annotations:
          description: '{{ $value }} Pods of DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset
            }} are not scheduled on cluster {{ $labels.k8s_cluster_name }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubedaemonsetnotscheduled
          summary: DaemonSet pods are not scheduled.
        expr: (kube_daemonset_status_desired_number_scheduled{job="kube-state-metrics",namespace=~".*"}
          - kube_daemonset_status_current_number_scheduled{job="kube-state-metrics",namespace=~".*"})
          > 0
        for: 10m
        labels:
          severity: warning
      - alert: KubeJobNotCompleted
        annotations:
          description: Job {{ $labels.namespace }}/{{ $labels.job_name }} is taking more
            than {{ "43200" | humanizeDuration }} to complete on cluster {{ $labels.k8s_cluster_name
            }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobnotcompleted
          summary: Job did not complete in time
        expr: ((time() - max(kube_job_status_start_time{job="kube-state-metrics",namespace=~".*"}
          and (kube_job_status_active{job="kube-state-metrics",namespace=~".*"} > 0)) by(namespace,job_name,k8s_cluster_name))
          > 43200) unless on(namespace,job_name,k8s_cluster_name) max(kube_job_labels{job="kube-state-metrics",label_excluded_from_alerts="true",namespace=~".*"}
          == 1) by(namespace,job_name,k8s_cluster_name)
        labels:
          severity: warning
      - alert: KubeHpaReplicasMismatch
        annotations:
          description: HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler  }}
            has not matched the desired number of replicas for longer than 15 minutes on
            cluster {{ $labels.k8s_cluster_name }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubehpareplicasmismatch
          summary: HPA has not matched desired number of replicas.
        expr: (((kube_horizontalpodautoscaler_status_desired_replicas{job="kube-state-metrics",namespace=~".*"}
          != kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics",namespace=~".*"})
          and (kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics",namespace=~".*"}
          > kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics",namespace=~".*"}))
          and (kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics",namespace=~".*"}
          < kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics",namespace=~".*"}))
          and (changes(kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics",namespace=~".*"}[15m])
          == 0)
        for: 15m
        labels:
          severity: warning
      - alert: KubeHpaMaxedOut
        annotations:
          description: HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler  }}
            has been running at max replicas for longer than 15 minutes on cluster {{ $labels.k8s_cluster_name
            }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubehpamaxedout
          summary: HPA is running at max replicas
        expr: (kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics",namespace=~".*"}
          == kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics",namespace=~".*"})
          and on(namespace,horizontalpodautoscaler,k8s_cluster_name) (kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics",namespace=~".*"}
          != kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics",namespace=~".*"})
        for: 15m
        labels:
          severity: warning
      - alert: KubePdbNotEnoughHealthyPods
        annotations:
          description: PDB {{ $labels.k8s_cluster_name }}/{{ $labels.namespace }}/{{ $labels.poddisruptionbudget
            }} expects {{ $value }} more healthy pods. The desired number of healthy pods
            has not been met for at least 15m.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepdbnotenoughhealthypods
          summary: PDB does not have enough healthy pods.
        expr: ((kube_poddisruptionbudget_status_desired_healthy{job="kube-state-metrics",namespace=~".*"}
          - kube_poddisruptionbudget_status_current_healthy{job="kube-state-metrics",namespace=~".*"})
          > 0) and (kube_poddisruptionbudget_status_expected_pods{job="kube-state-metrics",namespace=~".*"}
          > 0)
        for: 15m
        labels:
          severity: warning

