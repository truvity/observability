# expect: does not match pattern
# The schema refuses it before any template runs; the render-time check behind it is the same rule.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: viewers
      groups: [example:viewers]
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: ["example-app|.*"]

victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
