apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts-upstream-k8s-rules-container-cpu-usage-seconds
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: recording
spec:
  groups:
    - name: k8s.rules.container_cpu_usage_seconds_total
      rules:
      - expr: sum(rate(container_cpu_usage_seconds_total{job="kubelet",metrics_path="/metrics/cadvisor",image!=""}[5m]))
          by(k8s_cluster_name,namespace,pod,container) * on(k8s_cluster_name,namespace,pod)
          group_left(node) topk(1, max(kube_pod_info{node!=""}) by(k8s_cluster_name,namespace,pod,node))
          by(k8s_cluster_name,namespace,pod)
        record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m
      - expr: sum(irate(container_cpu_usage_seconds_total{job="kubelet",metrics_path="/metrics/cadvisor",image!=""}[5m]))
          by(k8s_cluster_name,namespace,pod,container) * on(k8s_cluster_name,namespace,pod)
          group_left(node) topk(1, max(kube_pod_info{node!=""}) by(k8s_cluster_name,namespace,pod,node))
          by(k8s_cluster_name,namespace,pod)
        record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate

