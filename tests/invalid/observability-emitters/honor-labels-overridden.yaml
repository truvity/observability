# expect: a label a target exports itself WINS over the label this agent stamps
# THE security refusal. With honor labels not overridden, a label a
# target exports itself wins over the label the agent stamps — so any
# workload that exposes its own `k8s_namespace_name` or `k8s_cluster_name`
# label chooses where its series are filed. It can write into another
# team's data or hide its own, and the render, the sync and the dashboards
# all look correct.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
  spec:
    overrideHonorLabels: false
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
    streamFields:
    - kubernetes.container_name
    - kubernetes.pod_name
    - kubernetes.pod_namespace
    - k8s.cluster.name
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
