apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: observability-emitters-victoria-logs-collector
  namespace: observability
  labels: 
    app.kubernetes.io/instance: observability-emitters
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-logs-collector
    app.kubernetes.io/version: v1.52.0
    helm.sh/chart: victoria-logs-collector-0.3.7
spec:
  selector:
    matchLabels: 
      app.kubernetes.io/instance: observability-emitters
      app.kubernetes.io/name: victoria-logs-collector
  template:
    metadata:
      labels: 
        app.kubernetes.io/instance: observability-emitters
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-logs-collector
    spec:
      serviceAccountName: observability-emitters-victoria-logs-collector
      securityContext: 
        {}
      containers:
        - name: vlagent
          image: victoriametrics/vlagent:v1.52.0
          imagePullPolicy: IfNotPresent
          securityContext: 
            {}
          resources: 
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: "2"
              memory: 1Gi
          ports:
            - name: http
              containerPort: 9429
              protocol: TCP
          args:
          - --envflag.enable
          - --envflag.prefix=VL_
          - --kubernetesCollector
          - --kubernetesCollector.extraFields={"k8s.cluster.name":"other-cluster","deployment.environment.name":"staging"}
          - --kubernetesCollector.includeNodeAnnotations=false
          - --kubernetesCollector.includeNodeLabels=false
          - --kubernetesCollector.includePodAnnotations=false
          - --kubernetesCollector.includePodLabels
          - --kubernetesCollector.msgField=message,msg,log
          - --kubernetesCollector.streamFields=kubernetes.container_name,kubernetes.pod_name,kubernetes.pod_namespace,k8s.cluster.name,deployment.environment.name
          - --kubernetesCollector.timeField=time,ts,timestamp
          - --loggerFormat=json
          - --remoteWrite.bearerTokenFile=/etc/observability-write-token/bearer
          - --remoteWrite.headers="AccountID:0^^ProjectID:0"
          - --remoteWrite.maxDiskUsagePerURL=20GB
          - --remoteWrite.url=https://logs.example/insert/native
          - --tmpDataPath=/var/lib/vl-collector
          volumeMounts:
            - mountPath: /etc/observability-write-token
              name: write-token
              readOnly: true
            - mountPath: /var/log
              name: varlog
              readOnly: true
            - mountPath: /var/lib
              name: varlib
              readOnly: true
            - name: vl-collector-data
              mountPath: /var/lib/vl-collector
            
      volumes:
        - name: write-token
          secret:
            secretName: example-write-token
        - hostPath:
            path: /var/log
          name: varlog
        - hostPath:
            path: /var/lib
          name: varlib
        - name: vl-collector-data
          hostPath:
            path: /var/lib/vl-collector
        

