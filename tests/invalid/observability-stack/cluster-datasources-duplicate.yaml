# expect: appears twice in `tenancy.clusterDatasources`
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  clusterDatasources:
    - {cluster: example-a, tokenSecret: {name: t, key: token}}
    - {cluster: example-a, tokenSecret: {name: u, key: token}}

# The minimum receiver and trace opt-in so no earlier refusal preempts this one.
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
