# expect: at '/notifications/groupByRoutes/0/match'
# An empty match would claim, and regroup, every alert.
stackReleaseName: observability-stack
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
  groupByRoutes:
  - match: {}
    groupBy: [alertname, target]
