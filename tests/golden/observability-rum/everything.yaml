# Source: observability-rum/templates/dashboards.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-rum-frontend-issues
  namespace: rum
  labels:
    app.kubernetes.io/name: observability-rum
    app.kubernetes.io/instance: observability-rum
    app.kubernetes.io/managed-by: Helm
    grafana_dashboard: "1"
  annotations:
    # The k8s-sidecar folder convention; inert unless that Grafana sets
    # `sidecar.dashboards.folderAnnotation` (see charts/observability-dashboards).
    k8s-sidecar-target-directory: "Web"
data:
  frontend-issues.json: |
    {
      "uid": "observability-rum-issues",
      "title": "Frontend Issues ($cluster)",
      "description": "Browser exceptions grouped by error fingerprint (charts/observability-rum): what is new, how big, since when, in which release, and the raw events behind each.",
      "tags": [
        "observability-frontend",
        "frontend-issues"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "links": [
        {
          "title": "Frontend",
          "type": "dashboards",
          "tags": [
            "observability-frontend"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "datasource",
            "type": "datasource",
            "query": "victoriametrics-logs-datasource",
            "current": {
              "selected": false,
              "text": "logs-main",
              "value": "logs-main"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": ""
          },
          {
            "name": "cluster",
            "label": "cluster",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "$datasource"
            },
            "query": {
              "type": "fieldValue",
              "field": "k8s.cluster.name",
              "query": "telemetry.source:faro",
              "limit": 100
            },
            "definition": "field values of k8s.cluster.name",
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 2,
            "regex": "",
            "sort": 1
          },
          {
            "name": "app",
            "label": "app",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "$datasource"
            },
            "query": {
              "type": "fieldValue",
              "field": "app",
              "query": "telemetry.source:faro k8s.cluster.name:\"$cluster\"",
              "limit": 100
            },
            "definition": "field values of app",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "includeAll": true,
            "allValue": "*",
            "multi": false,
            "options": [],
            "refresh": 2,
            "regex": "",
            "sort": 1
          },
          {
            "name": "fingerprint",
            "label": "fingerprint",
            "type": "textbox",
            "query": "*",
            "current": {
              "selected": false,
              "text": "*",
              "value": "*"
            },
            "options": [
              {
                "selected": true,
                "text": "*",
                "value": "*"
              }
            ],
