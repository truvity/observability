# expect: at '/notifications/severities/critical/channel'
# A Slack destination with an empty channel: Slack refuses every message
# and the route looks wired up.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - name: acme
        appTokenSecret: {name: example-acme-slack-bot, key: token}
  severities:
    critical: {receiver: slack, channel: ""}
    warning: {receiver: slack, channel: "#alerts"}
