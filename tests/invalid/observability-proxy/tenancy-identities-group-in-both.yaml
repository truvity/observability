# expect: is in tenancy.identities[0] ("viewers") and also in `tenancy.principals`
# The same group written under both keys: the second entry could never be selected.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  principals:
    - group: example:viewers
      grants:
        - cluster: cluster-a
          namespaces: [example-app]
  identities:
    - name: viewers
      groups: [example:viewers]
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]

victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
