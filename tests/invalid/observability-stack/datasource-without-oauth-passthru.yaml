# expect: does not set `jsonData.oauthPassThru: true`
tenancy:
  # The trace store is enabled by default and `tenancy.principals` is
  # set below, so without this the trace-tenancy refusal fires first
  # (see docs/safety.md). Not the fixture's own check.
  allowUnfilteredTraceReads: true
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# A datasource without oauthPassThru queries as GRAFANA's identity rather
# than the signed-in person's, so the proxy scopes nothing and a viewer
# sees every namespace on every cluster. It looks exactly like a working dashboard.
#
# The logs and traces datasources below are otherwise complete (own
# `jsonData.oauthPassThru` and `version`): leaving them out entirely
# would trip the "store without a datasource" refusal on the logs store
# before this fixture's own check ever ran (see docs/safety.md). Only
# the metrics datasource — first in the list, so it is the one checked
# first — is missing what this fixture is about.
grafana:
  enabled: true
  admin:
    existingSecret: example-grafana
  envValueFrom:
    GF_SECURITY_SECRET_KEY:
      secretKeyRef:
        name: example-grafana
        key: secret_key
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          uid: victoriametrics
          version: 1
          url: http://vmauth-observability-stack:8427/prometheus
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          uid: victorialogs
          version: 1
          url: http://vmauth-observability-stack:8427
          jsonData:
            oauthPassThru: true
        - name: VictoriaTraces
          type: jaeger
          access: proxy
          uid: victoriatraces
          version: 1
          url: http://vmauth-observability-stack:8427/select/jaeger
          jsonData:
            oauthPassThru: true

notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
