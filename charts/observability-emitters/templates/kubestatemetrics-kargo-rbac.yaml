{{- /*
The two extra verbs `kubeStateMetrics.customResources.kargo` needs,
granted through a ClusterRole of THIS chart's own rather than
`kube-state-metrics.rbac.extraRules` — a subchart value this chart
cannot compute from the flag (Helm coalesces a subchart's values before
any template runs). Bound to kube-state-metrics' own ServiceAccount, so
the net grant is identical to writing the same two rules into
`rbac.extraRules` by hand: nothing broader than
get/list/watch on the two Kargo kinds the ConfigMap beside this file
reads.
*/ -}}
{{- if and .Values.kubeStateMetrics.enabled (.Values.kubeStateMetrics.customResources.kargo).enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-kargo" (include "observability-emitters.kubeStateMetrics.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages", "promotions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-kargo" (include "observability-emitters.kubeStateMetrics.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-kargo" (include "observability-emitters.kubeStateMetrics.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "observability-emitters.kubeStateMetrics.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
