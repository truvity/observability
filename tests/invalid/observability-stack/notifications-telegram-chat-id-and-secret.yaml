# expect: at '/notifications/telegram'
# `chatId` and `chatIdSecret` together: two defaults for one chat, and
# nothing says which one wins. Exactly one of them.

notifications:
  externalUrl: https://grafana.example
  telegram:
    botTokenSecret: {name: example-telegram-bot, key: token}
    chatId: -1000000000001
    chatIdSecret: {name: example-telegram-bot, key: chat_id}
  severities:
    critical: {receiver: telegram}
    warning: {receiver: telegram}
