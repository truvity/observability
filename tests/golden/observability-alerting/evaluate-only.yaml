---
# Source: observability-alerting/templates/vmalert.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: observability-stack-metrics
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.rule-type: prometheus
spec:
  replicaCount: 1
  evaluationInterval: 30s
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  ruleSelector:
    matchExpressions:
      - key: observability.truvity.io/evaluator
        operator: NotIn
        values:
          - "logs"
      - key: observability.rule-type
        operator: NotIn
        values:
          - vlogs
  ruleNamespaceSelector: {}
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 512Mi
  datasource:
    url: "http://vmsingle-observability-stack-victoria-metrics-k8s-stack.default.svc:8428"
    basicAuth:
      username:
        name: "observability-store-credentials"
        key: "username"
      password:
        name: "observability-store-credentials"
        key: "password"
  remoteWrite:
    url: "http://vmsingle-observability-stack-victoria-metrics-k8s-stack.default.svc:8428"
    basicAuth:
      username:
        name: "observability-store-credentials"
        key: "username"
      password:
        name: "observability-store-credentials"
        key: "password"
  remoteRead:
    url: "http://vmsingle-observability-stack-victoria-metrics-k8s-stack.default.svc:8428"
    basicAuth:
      username:
        name: "observability-store-credentials"
        key: "username"
      password:
        name: "observability-store-credentials"
        key: "password"
  extraArgs:
    external.url: https://grafana.example
    notifier.blackhole: "true"

