# The alerting plane of tests/cases/observability-stack/alertmanager-pair: that case's values
# (presets merged) kept to the keys this chart declares. tests/alerting_chart_test.go
# derives the same file for every stack case and holds the objects byte-identical.
stackReleaseName: observability-stack
tenancy: {}
vmalert:
  externalUrl: https://grafana.example
notifications:
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-acme-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
alertmanager:
  replicaCount: 2
karma:
  enabled: true
  authentication:
    none: true
