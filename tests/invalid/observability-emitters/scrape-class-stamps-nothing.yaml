# `mergeOverwrite` replaces a list wholesale, so a caller who adds one
# scrape class of their own replaces the stamping one. A replacement that
# is still the default class but carries no relabel rules stamps neither
# half of the scoping key: every series from every scrape object this
# chart does not own matches no grant.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
  spec:
    scrapeClasses:
    - default: true
      name: tenancy
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
    streamFields:
    - kubernetes.container_name
    - kubernetes.pod_name
    - kubernetes.pod_namespace
    - k8s.cluster.name
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
