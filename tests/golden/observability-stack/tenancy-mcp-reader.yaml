# Source: observability-stack/templates/watchdog.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: observability-stack-watchdog
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  groups:
    - name: observability-stack.watchdog
      interval: 30s
      rules:
        - alert: Watchdog
          expr: vector(1)
          labels:
            severity: none
          annotations:
            summary: "This alert is always firing; its absence is the signal"
            description: >-
              The heartbeat of this observability stack. Something outside the
              cluster watches for it — pushed through Alertmanager, or pulled
              directly off vmalert's own read API — and pages when it stops
              arriving: an alerting path that has died cannot report that it
              has died.

