{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $fullname := include "observability-proxy.fullname" . }}
{{- /*
The proxy's network policy, as the stack renders it (templates/networkpolicy.yaml
there holds the stores', vmalert's and karma's, which stay with the stack).
A NetworkPolicy that selects a pod is a default-deny for that pod, which is
the point. Ingress only: an egress policy naming every DNS server and issuer
is one more thing to break when either moves.
*/}}
{{- $scrapeDefault := list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "vmagent"))) -}}
---
{{- /*
The proxy's own ingress. Empty `proxyFrom` means the release's namespace
and nothing else — the smallest rule that leaves a working install, and
the one an estate whose Grafana lives elsewhere has to widen on purpose.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-proxy
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmauth
      app.kubernetes.io/instance: {{ $fullname }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.proxyFrom }}
        {{- toYaml .Values.networkPolicy.proxyFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8427
    {{- /*
    The operator's own config-reloader sidecar, injected into this same
    pod to watch the Secret it generates for VMAuth and signal a reload —
    a second container, a second endpoint, `reloader-http`, on the
    VMServiceScrape the operator renders alongside this chart's own
    objects. This policy selected the pod and admitted only 8427, so the
    reload endpoint scraped fine at the socket and lost every sample at
    admission: `up=0` for the job, `TargetDown`/`ServiceDown` firing
    forever, on a pod that is otherwise perfectly healthy — the same
    shape docs/safety.md, "A store whose own policy hides it from the
    scraper" describes for the stores, one port later.

    The peers are `networkPolicy.scrapeFrom` (defaulting to the same
    metrics agent as the three store policies above), not `proxyFrom`:
    this is a scrape, not a read through the proxy, and the two lists
    answer different questions.
    */}}
    - from:
        {{- toYaml ($root.Values.networkPolicy.scrapeFrom | default $scrapeDefault) | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8435
{{- end }}
