apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-stack-metrics-store
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: observability-stack-victoria-metrics-k8s-stack
      app.kubernetes.io/name: vmsingle
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: observability-stack
              app.kubernetes.io/name: vmauth
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: observability-stack
              app.kubernetes.io/part-of: observability-stack
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: observability-stack
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 8428
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: example-prober
      ports:
        - protocol: TCP
          port: 8428
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: example-collectors
          podSelector:
            matchLabels:
              app.kubernetes.io/name: example-collector
      ports:
        - protocol: TCP
          port: 8428

