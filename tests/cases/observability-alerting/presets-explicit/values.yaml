# The same values as the `presets-preset` case, written out in full: the golden of
# this case must equal that case's (tests/presets_test.go).
selfAlerts:
  ingest:
    metric: vm_rows_ignored_total
  cardinality:
    hourlyCurrentSeriesMetric: vm_hourly_series_limit_current_series
    hourlyMaxSeriesMetric: vm_hourly_series_limit_max_series
    dailyCurrentSeriesMetric: vm_daily_series_limit_current_series
    dailyMaxSeriesMetric: vm_daily_series_limit_max_series
  logStore:
    metric: vl_rows_dropped_total
  traceStore:
    metric: vt_rows_dropped_total
  logStreamChurn:
    streamsCreatedMetric: vl_streams_created_total
  traceStreamChurn:
    streamsCreatedMetric: vt_streams_created_total
  writer:
    bufferMetric: vmagent_remotewrite_pending_data_bytes
    droppedPacketsMetric: vmagent_remotewrite_packets_dropped_total
    bufferMetricsExtra:
    - vlagent_remotewrite_pending_data_bytes
    droppedPacketsMetricsExtra:
    - vlagent_remotewrite_packets_dropped_total
  gateway:
    queueSizeMetric: otelcol_exporter_queue_size
    queueCapacityMetric: otelcol_exporter_queue_capacity
  proxyConcurrency:
    limitedRequestsMetric: vmauth_concurrent_requests_limit_reached_total
  diskGuard:
    metrics:
      freeSpaceMetric: vm_free_disk_space_bytes
      freeSpaceLimitMetric: vm_free_disk_space_limit_bytes
notifications:
  drop:
  - alertgroup: general.rules
  - alertgroup: kubernetes-resources
  - alertgroup: kubernetes-storage
  - alertgroup: kubernetes-system
  - alertgroup: node-network
  - alertgroup: vm-health
  - alertgroup: vmoperator
  - alertgroup: vmsingle
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
upstreamRules:
  source: platform-alerts
victoria-metrics-k8s-stack:
  defaultRules:
    enabled: false
    create: false
stackReleaseName: observability-stack
tenancy: {}
