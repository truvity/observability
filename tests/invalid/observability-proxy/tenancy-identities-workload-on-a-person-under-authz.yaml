# expect: sets `routes`, `metricsQueryOnly` or `vmalertAPI`
# Under tenancy-authz a person gets one minted claim and one set of routes: an identity on a person audience may not narrow.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    securityPolicy:
      targetRefs:
        - kind: HTTPRoute
          name: observability-read
    networkPolicy:
      gatewayFrom:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: envoy}
  identities:
    - name: example-app
      groups: [example:example-app]
      workload: {routes: [metrics]}
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]

vmalert:
  enabled: false

victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
