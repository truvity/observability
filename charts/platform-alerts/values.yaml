# platform-alerts — the rules that fire when something has stopped working
# while everything still looks green.
#
# Every rule here was written after an incident, and every threshold is
# stated against a measured healthy range rather than a guess. The comments
# say which incident and which range; docs/safety.md says it at length.
#
# The expressions are MetricsQL and are evaluated by vmalert. Duration
# literals (`26h`) are used in arithmetic, which MetricsQL supports and
# PromQL does not.

# -- Name overrides for the rendered VMRule object.
nameOverride: ""
fullnameOverride: ""

# -- Labels on the VMRule object itself. vmalert selects rule objects by
# these, so an install that runs more than one vmalert puts the selector
# here.
ruleLabels: {}

# -- Labels added to every rule, merged under each rule's own `severity`.
# The Alertmanager routing tree reads these: an estate that routes by
# cluster or environment sets them here, once.
commonLabels: {}

# -- Base URL for the runbook link on every alert. The alert's name is
# appended, so `https://example.com/runbooks` yields
# `https://example.com/runbooks/WritePathDead`. Empty renders no link.
runbookBaseUrl: ""

# -- How often vmalert evaluates these groups.
interval: 1m

# -- The label that names the cluster a series came from, on a metrics
# store that holds several clusters (the shared-store topology: remote
# emitters write with the cluster identity forced, see
# charts/observability-stack `tenancy.clusterLabel`, which this must
# equal). Every join and per-object aggregation in the rules matches on it
# in addition to namespace and object name, because two clusters can share
# a namespace, a Job name or a PVC name; without it those rules fail with
# a duplicate-series error (vmalert health `err`, HTTP 422) and never
# fire. On a single-cluster store, where the label is absent on both sides,
# it still matches (both empty), so the default is safe there too.
# Empty restores the expressions of 0.11.2 byte for byte (a store that
# names its clusters some other way and does not want the label matched).
clusterLabel: k8s_cluster_name

# -- How far back an "absent" guard (every `*Absent` alert: Kargo state and
# controller, probes, NodeClaims, NATS, Argo CD, External Secrets, ACK)
# looks for a series that is no longer there. A store can hold several
# clusters' series, and a bare `absent()` is true only when the series is
# missing from EVERY cluster; with a `clusterLabel` each guard instead fires
# for a cluster (and, for ACK and probes, a namespace or probe) that HAD the
# series within this window and does not now, alongside the whole-store
# `absent()` that catches "never existed / everything gone". A cluster or
# controller removed on purpose therefore stops alerting once the window has
# passed.
absentLookback: 1d

# -- OPT-IN (empty, the default, changes nothing): the label that names the
# company that owns a workload, as stamped by `observability-emitters`
# `tenancy.owners` (`owner`). A rule that aggregates (`max by (...)`) keeps
# only the labels it lists, so without this the alert would reach
# Alertmanager without the label a route on `owner` needs. Set, it joins
# the `by (...)` of every aggregating rule that is about a namespaced
# object (CronJobNotSucceeding, BackupJobFailed, PodUnschedulable) and of
# NodeClaimNotReady (whose series carry only the default owner). Rules
# that do not aggregate (the kube_* comparisons, the Kargo rules) already
# keep every label of their left side. The store rules (WritePathDead,
# StoreApproachingReadOnly) are about a store, not a namespace, and carry
# no owner: put `owner` in `commonLabels` for them if the estate wants one.
ownerLabel: ""

# -- Only consider objects in namespaces matching this regular expression.
# `.*` is every namespace; an estate that runs these rules for the platform
# alone narrows it here.
namespaceSelector: ".*"

# -- The stores these rules watch, one entry per store process.
#
# There is no default list, and a group that needs one refuses to render
# without it. That is deliberate: every store exports its counters under
# its own names, and a guessed metric name is how a rule silently never
# fires — the failure this chart exists to prevent. Name the counters your
# stores actually export.
#
# For the VictoriaMetrics family the shapes are:
#
#   stores:
#     - name: metrics
#       rowsMetric: vm_rows_inserted_total
#       freeSpaceMetric: vm_free_disk_space_bytes
#       freeSpaceLimitMetric: vm_free_disk_space_limit_bytes
#     - name: logs
#       rowsMetric: vl_rows_ingested_total
#
# `name` labels the alert. `rowsMetric` is the counter the write-path
# deadman watches. The two free-space metrics are optional and enable the
# read-only rule for that store; a store that exports no such limit simply
# gets no read-only rule, which is the honest outcome.
stores: []

groups:
  # Backups and scheduled work.
  #
  # The incident: a backup CronJob stopped being scheduled at all and was
  # silent for two days. A job that never runs never produces a failed Job,
  # so "no failures" is not "working" — only the age of the last SUCCESS
  # can see it.
  backups:
    enabled: true
    # -- Age of the last successful run past which a CronJob is considered
    # not to be succeeding: its schedule plus enough slack that a slow run
    # or a retry does not page. 26h suits a daily job.
    maxSuccessAge: 26h
    severity: critical
    # -- A Job that has failed at all. Separate from the age rule because a
    # job that fails loudly and a job that vanishes quietly are different
    # failures and often have different owners.
    failedSeverity: warning
    # -- Skip SUSPENDED CronJobs in both rules (0.11.0). Suspending a
    # CronJob is a decision written into its spec; before this, both
    # rules fired on it for as long as it stayed suspended. The cost: an
    # ACCIDENTAL suspension is no longer caught here — read
    # `kube_cronjob_spec_suspend` in a review or a dashboard instead.
    # Absent that series (an older kube-state-metrics, a trimmed
    # collector list) both rules behave exactly as before, never
    # silently. `false` renders the 0.10.0 expressions byte for byte.
    ignoreSuspended: true
    # -- Namespaces both backup rules watch, instead of the top-level
    # `namespaceSelector`. Empty inherits it. Lets an estate that narrows the
    # top-level selector for the volume rules still watch the CronJobs of
    # product namespaces.
    namespaceSelector: ""
    # -- Keep the series' own `clusterLabel` on both alerts (see
    # `pendingPods.keepClusterLabel`). Default false: unchanged render.
    keepClusterLabel: false

  # The write path.
  #
  # The incident: a metrics store went read-only and served reads happily
  # for twenty minutes with nothing noticing. An alert on the store's own
  # read-only FLAG cannot fire in that case, because the sample carrying it
  # is written INTO the store that is refusing writes. Watching the rows
  # counter stop is the only rule that can see it.
  #
  # Requires `stores` with a `rowsMetric` on each entry.
  writePath:
    enabled: true
    # -- Window over which the ingestion rate is measured.
    window: 5m
    # -- How long the rate must stay at zero before the alert fires. Long
    # enough to ride out a restart, short enough to beat the retention of
    # whatever is buffering upstream.
    for: 10m
    severity: critical

  # Volumes.
  #
  # The incident: a pod reported 1/1 Running while writing to the node's
  # root filesystem, because its real volume was never mounted. A mounted
  # filesystem is always somewhat smaller than the claim that satisfied it
  # (filesystem overhead; measured healthy range here is 0.95–0.99 of the
  # claim), but it is never a fraction of it.
  volumes:
    enabled: true
    # -- Fire when the mounted filesystem is smaller than this fraction of
    # the claim. 0.5 sits roughly 2x below the measured healthy range, so
    # overhead can never reach it and a wrong mount always does.
    minCapacityRatio: 0.5
    severity: critical

  # Store limits.
  #
  # The threshold comes from the store's OWN exported limit, never from a
  # constant written here: a guessed constant is how a rule either never
  # fires or always does. A store that exports no such limit gets no rule.
  #
  # Requires `stores` with `freeSpaceMetric` and `freeSpaceLimitMetric`.
  storeLimits:
    enabled: true
    # -- Fire while free space is still this multiple of the limit at which
    # the store stops accepting writes, so the alert arrives with room to
    # act rather than at the moment writes fail.
    headroomFactor: 2
    severity: warning

  # Kargo promotions.
  #
  # Off by default: not every estate runs Kargo, and a group that watches a
  # CRD nobody installed would just never fire, which is a different
  # honest outcome from the one this chart insists on elsewhere — so it
  # asks rather than assumes, same as `stores` above.
  #
  # The series come from kube-state-metrics' own `customResourceState`
  # feature, configured by the ESTATE, never by this chart — the same
  # boundary `stores` draws: a guessed metric name is how a rule silently
  # never fires. See docs/kube-state-metrics.md for a worked config.
  #
  #   kargo_stage_condition{namespace, stage, type, reason}
  #     A gauge: 1 while the Stage condition named by `type`/`reason` is
  #     True, 0 while it is False or Unknown.
  #   kargo_promotion_phase{namespace, promotion, stage, phase}
  #     A StateSet over Pending, Running, Succeeded, Failed, Errored and
  #     Aborted: 1 on the Promotion's current phase.
  kargo:
    enabled: false
    # -- How long a Stage's Ready condition must read
    # LastPromotionErrored, or a Promotion must sit in the Errored phase
    # with its Stage still unrecovered, before firing. Long enough that a
    # promotion mid-retry does not page.
    for: 15m
    severity: critical
    # -- How long kube-state-metrics can go without exporting either
    # series before the deadman fires. Longer than `for`: a scrape gap
    # that would not yet have tripped the rules above must not trip this
    # one either.
    absentFor: 30m
    # -- Severity of `KargoStateMetricsAbsent`. A blind spot in the
    # `customResourceState` config, not necessarily a stuck promotion —
    # Kargo itself may be healthy underneath it — so it defaults one tier
    # below the rules it is the deadman for.
    absentSeverity: warning
    # -- Keep the series' own `clusterLabel` on the controller alerts below
    # (see `pendingPods.keepClusterLabel`). The two rules above do not
    # aggregate and always keep it.
    keepClusterLabel: false
    # -- The scrape job of the Kargo controller's own metrics (the
    # controller's ServiceMonitor: the job is the Service's name). The three
    # rules below read it; each is its own switch and OFF by default, so a
    # group that was already on renders exactly what it did.
    controllerJob: kargo-controller-metrics
    # -- No controller answers its scrape: nothing promotes while it is down,
    # and the kube-state-metrics series above stay green.
    controllerAbsent:
      enabled: false
      for: 5m
      severity: critical
    # -- Reconciles that end in an error, per controller loop
    # (`KargoControllerReconcileErrors`). `for` equal to `window` means one
    # isolated error never fires: errors must keep arriving.
    reconcileErrors:
      enabled: false
      window: 15m
      for: 15m
      severity: warning
    # -- A work queue that holds items for the whole `for`
    # (`KargoControllerWorkqueueStuck`).
    workqueueDepth:
      enabled: false
      for: 30m
      severity: warning

  # HTTP probes (charts/observability-emitters `metrics.scrape.probes`).
  #
  # Off by default: it reads `probe_success`, the blackbox exporter's
  # series, which exists only where that emitter value lists a probe. One alert per probe, stamped
  # with this cluster's identity like every other group. `alertName`
  # exists so an estate that probes exactly one thing can name the alert
  # after it; every probe selected by `probe` shares that name.
  probes:
    enabled: false
    # -- The alert's name.
    alertName: HTTPProbeDown
    # -- A regular expression over the probe's `probe` label (its name in
    # `metrics.scrape.probes`). Anchored by the matcher itself.
    probe: ".+"
    # -- Plain text that replaces the alert's `summary` / `description`
    # (no template braces: rendered literally). For an estate whose probe
    # leaves through a third party and wants the alert to say so. Empty
    # keeps the generated text.
    summary: ""
    description: ""
    # -- How long a probe must read `probe_success == 0` before firing. The agent
    # scrapes once a minute by default; several misses in a row is a real
    # outage, one is a blip.
    for: 5m
    severity: warning
    # -- The deadman, `<alertName>Absent`: fires when no `probe_success`
    # series matching `probe` has been seen for this long. The rule above
    # is silent when its series is missing (`== 0` has nothing to compare),
    # which is the case where a probe is not working at all.
    absentFor: 15m
    # -- Severity of the deadman. Empty (default) takes `severity`, the
    # probe rule's own.
    absentSeverity: ""
    # -- A second, optional alert on the TLS certificate a probe saw
    # (`probe_ssl_earliest_cert_expiry`, https targets only), for the same
    # probes selected by `probe`. Off by default.
    certExpiry:
      enabled: false
      alertName: HTTPProbeCertExpiring
      # -- Fires when the earliest certificate expires within this many days.
      withinDays: 14
      for: 1h
      severity: warning

  # Pods the scheduler cannot place.
  #
  # The incident class: on a cluster whose nodes are provisioned on demand
  # (Karpenter, including EKS Auto Mode), "requests exceed allocatable" is
  # the normal, transient state, so an alert on overcommitted requests
  # (upstream's KubeCPUOvercommit / KubeMemoryOvercommit) fires constantly
  # and means nothing. What FAILS when provisioning stops working is a pod
  # that stays unschedulable, and that is what this watches.
  #
  # Off by default: a cluster with fixed-size nodes is better served by the
  # overcommit alerts and has no provisioner to fail.
  #
  # Reads `kube_pod_status_unschedulable` (kube-state-metrics' `pods`
  # collector, which charts/observability-emitters' default list already
  # carries): 1 while the pod's PodScheduled condition is False with reason
  # Unschedulable, and no series otherwise. A pod that is Pending for some
  # other reason (an image pull, a volume attach) is NOT this alert's; the
  # vendored KubePodNotReady covers non-Job pods at 15m. This one is the
  # scheduler's own verdict, so it also sees Job-owned pods, which
  # KubePodNotReady leaves out.
  #
  # One alert per pod, not per namespace: a namespace whose pods are
  # replaced every few minutes would keep a per-namespace count above zero
  # for ever without any single pod waiting as long as `for`.
  pendingPods:
    enabled: false
    # -- How long a pod must stay unschedulable before firing. A node is
    # normally provisioned in a minute or two, so 10m is several failed
    # attempts, not one slow one.
    for: 10m
    severity: warning
    # -- Namespaces this group watches, instead of the top-level
    # `namespaceSelector`. Empty inherits it. A pod that cannot be placed is
    # a cluster-wide concern, and the top-level selector is often narrowed
    # for the backup and volume rules to the namespaces that hold CronJobs.
    namespaceSelector: ""
    # -- Keep the series' own `clusterLabel` on the alert instead of letting
    # `commonLabels` overwrite it (a rule's static labels win over the
    # series'). Set it on a store that holds several clusters, where
    # `commonLabels` names the cluster the RULES run on and the pod belongs
    # to another: without it the alert names the wrong cluster. Ignored
    # when `clusterLabel` is empty.
    keepClusterLabel: false

  # Karpenter NodeClaims that do not come up.
  #
  # The incident class: on a cluster whose nodes Karpenter provisions
  # (including EKS Auto Mode, where Karpenter's own metrics are not
  # scrapeable but its NodeClaim objects are readable), a NodeClaim that
  # never launches, never registers as a node or never initializes is a
  # provisioning failure that may not yet show as a stuck pod, or whose
  # cause `pendingPods` cannot name. Karpenter deletes a claim that has not
  # registered after 15 minutes (its registration TTL) and then tries
  # again, so the wait here is shorter than that: the claim is still there
  # to be seen.
  #
  # Off by default. Reads
  #   nodeclaim_status_condition{nodeclaim, nodepool, type, reason}
  # from kube-state-metrics' `customResourceState`, produced by
  # charts/observability-emitters' `kubeStateMetrics.customResources.
  # nodeClaims` (a guessed metric name is how a rule silently never fires,
  # so the series and the deadman below are named, not assumed).
  #
  # NodeClaims are cluster-scoped: no namespace filter applies.
  nodeClaims:
    enabled: false
    # -- How long a NodeClaim's Launched, Registered or Initialized condition
    # must stay not-True before firing. A normal launch-to-initialized takes
    # a few minutes; 10m is well past it and inside the 15m registration TTL.
    for: 10m
    severity: warning
    # -- How long the series can be absent before `NodeClaimMetricsAbsent`
    # fires. Longer than `for`. Note it cannot tell "no NodeClaims right
    # now" from "not exported" on its own, so it is only meaningful on a
    # cluster that always has at least one claim (Auto Mode always does).
    absentFor: 30m
    absentSeverity: warning
    # -- Keep the series' own `clusterLabel` on the alert (see
    # `pendingPods.keepClusterLabel`).
    keepClusterLabel: false

  # NATS and JetStream (the upstream nats Helm chart with its
  # prometheus-nats-exporter sidecar and PodMonitor).
  #
  # Off by default: it reads series that exist only where that chart runs.
  # Every metric name was read off a live store scraping the exporter with
  # `-varz -connz -routez -jsz` (v0.20.x), never guessed:
  #   up{job}                                  the scrape itself
  #   nats_varz_routes / _cluster_pool_size    varz: route connections, pool
  #   nats_varz_jetstream_meta_cluster_size    varz: JetStream meta group size
  #   nats_varz_jetstream_meta_leader{value}   varz: leader name in `value`
  #   nats_server_total_streams{meta_leader}   jsz: server labels
  #   nats_stream_total_messages{stream_leader} jsz: stream labels
  #   nats_consumer_num_pending                jsz: consumer backlog
  #   nats_varz_slow_consumers                 varz: cumulative count
  #   nats_varz_jetstream_stats_storage / _config_max_storage   varz
  # Memory has no metric of the broker's own and is computed from cadvisor
  # and kube-state-metrics. There is no authorization-error metric in the
  # exporter, so no rule for it.
  nats:
    enabled: false
    # -- The scrape job of the exporter: `<namespace>/<podmonitor>`.
    job: nats/nats
    # -- Severity of the rules that mean the broker set is down or
    # JetStream cannot serve (NATSBrokerDown, the two no-leader rules).
    severity: critical
    # -- Severity of the rest: degradation that is not yet an outage.
    warningSeverity: warning
    # -- How long an exporter must stay down before NATSBrokerDown fires.
    brokerDownFor: 5m
    # -- How long a broker must see too few routes. Covers a rolling
    # restart of a peer.
    routesFor: 10m
    # -- How long the meta group or a stream may have no leader. An
    # election takes seconds; 5m is a lost quorum.
    leaderFor: 5m
    backlog:
      # -- Window over which the backlog must stay above `minPending` and
      # grow.
      window: 15m
      # -- Backlog (messages) that must never be dropped under during the
      # window, so a trickle of a few pending messages never alerts.
      minPending: 100
      for: 5m
    slowConsumers:
      window: 10m
      for: 5m
    storage:
      # -- Fraction of the configured JetStream store.
      ratio: 0.8
      for: 15m
    memory:
      # -- Where the brokers run and what their container is called, to
      # select cadvisor and kube-state-metrics series.
      namespace: nats
      container: nats
      # -- Fraction of the container's memory limit.
      ratio: 0.9
      for: 10m
    # -- How long no exporter series can exist before NATSMetricsAbsent.
    absentFor: 30m
    # -- Keep the series' own `clusterLabel` on the alert (see
    # `pendingPods.keepClusterLabel`). Not applied to NATSMetricsAbsent,
    # which always keeps its own cluster label (`absentLookback`).
    keepClusterLabel: false

  # Argo CD (the application controller's, repo server's and API server's
  # ServiceMonitors, job `argocd-*-metrics`).
  #
  # Off by default: it reads series that exist only where Argo CD runs and is
  # scraped. The names are the ones the upstream chart's metrics endpoints
  # export:
  #   argocd_app_sync_total{name, project, dest_server, phase}
  #   argocd_app_info{name, project, dest_server, health_status, sync_status}
  #   argocd_cluster_connection_status{server}
  #   argocd_git_fetch_fail_total{repo}
  # The rules are this chart's own; the community mixin carries no licence and
  # was only read for the names of what is worth watching.
  argocd:
    enabled: false
    # -- A regular expression over the `job` of Argo CD's metrics endpoints.
    job: argocd-.*-metrics
    # -- Severity of `ArgoCDClusterConnectionLost`: with the connection down
    # every application on that cluster is stale.
    severity: critical
    # -- Severity of the application-level alerts and the Git alert.
    warningSeverity: warning
    syncFailed:
      # -- How far back a Failed or Error sync stays visible.
      window: 10m
      for: 1m
    # -- How long an application must be Degraded, Missing or Unknown.
    # Progressing is not counted: a rollout is Progressing.
    unhealthyFor: 15m
    outOfSync:
      # -- `false` drops `ArgoCDAppOutOfSync`, for an estate where applications
      # are OutOfSync by design (no self-heal, no prune).
      enabled: true
      for: 30m
    # -- How long a destination cluster must be unreachable.
    clusterLostFor: 5m
    gitFetch:
      window: 10m
      # -- Failed fetches of one repository within `window` that count. One
      # dropped connection does not.
      minFailures: 3
      for: 5m
    # -- How long no application can be reported before `ArgoCDMetricsAbsent`.
    absentFor: 15m
    # -- Severity of the deadman.
    absentSeverity: warning
    # -- Keep the series' own `clusterLabel` on the alerts (see
    # `pendingPods.keepClusterLabel`). Not applied to the deadman, which always keeps its own cluster label
    # (`absentLookback`).
    keepClusterLabel: false

  # External Secrets Operator (the chart's `serviceMonitor.enabled`: three
  # ServiceMonitors, one per Deployment).
  #
  # Off by default. Metric names are the operator's own (docs/api/metrics.md
  # in its repository) plus controller-runtime's:
  #   externalsecret_status_condition{name, namespace, condition, status}
  #   secretstore_status_condition, clustersecretstore_status_condition
  #   externalsecret_provider_api_calls_count{provider, call, status}
  #   controller_runtime_reconcile_errors_total{controller}
  #   workqueue_depth{name}
  # An object's own `namespace` collides with the scrape's and survives as
  # `exported_namespace` under `honor_labels: false`, which this chart's
  # emitters force.
  eso:
    enabled: false
    # -- Where the operator runs. Selects the target's own `namespace`, which
    # is what keeps another controller's workqueue and reconcile series out.
    namespace: external-secrets
    # -- A regular expression over the webhook's `job` (the Service name its
    # ServiceMonitor scrapes through).
    webhookJob: external-secrets-webhook.*
    # -- Severity of the webhook alerts: both webhooks fail closed, so while
    # it is down every write of an ExternalSecret or a store is refused.
    severity: critical
    # -- Severity of everything else in the group.
    warningSeverity: warning
    webhookDownFor: 5m
    notReadyFor: 15m
    storeNotReadyFor: 10m
    reconcileErrors:
      window: 15m
      for: 15m
    providerErrors:
      window: 10m
      for: 10m
    workqueueFor: 30m
    # -- How long nothing in the namespace can be scraped before
    # `ESOMetricsAbsent`.
    absentFor: 15m
    # -- Keep the series' own `clusterLabel` on the alerts (see
    # `pendingPods.keepClusterLabel`). Not applied to the `absent` alerts, which always keep their own cluster
    # label (`absentLookback`).
    keepClusterLabel: false

  # AWS Controllers for Kubernetes (one controller Deployment per AWS
  # service, each in its own namespace, scraped by a PodMonitor).
  #
  # Off by default. The controllers expose controller-runtime's metrics only:
  #   up, controller_runtime_reconcile_errors_total{controller},
  #   controller_runtime_terminal_reconcile_errors_total{controller},
  #   controller_runtime_reconcile_panics_total{controller}
  # `ack_outbound_api_requests_total` has no result label, so AWS throttling
  # cannot be alerted on from it.
  ack:
    enabled: false
    # -- A regular expression over the controllers' namespaces.
    namespace: ack-.*
    # -- Namespaces that MUST report: one `absent` per entry, so a missing
    # controller among several is seen. Empty (the default) renders one
    # `absent` over `namespace`, which only sees all of them gone.
    expectedNamespaces: []
    # -- Severity of a controller that is down or missing: AWS resources it
    # owns stop converging, silently.
    severity: critical
    # -- Severity of the error and panic alerts.
    warningSeverity: warning
    downFor: 5m
    absentFor: 10m
    reconcileErrors:
      window: 15m
      for: 15m
    terminalErrors:
      # -- A terminal error is counted once, when found, so the alert lasts
      # `window` after it.
      window: 1h
      for: 1m
    panics:
      window: 15m
      for: 1m
    # -- Keep the series' own `clusterLabel` on the alerts (see
    # `pendingPods.keepClusterLabel`). Not applied to the `absent` alert, which always keeps its own cluster
    # label (`absentLookback`).
    keepClusterLabel: false

  # Pod Security admission rejections.
  #
  # The incident class: `enforce` on a namespace refuses a controller's pod
  # create, the ReplicaSet / StatefulSet / Job / DaemonSet records a
  # `FailedCreate` Event "violates PodSecurity ...", and the workload simply
  # does not start. No pod exists, so no metric records it.
  #
  # Off by default, and the only LogsQL group: it needs the Kubernetes
  # Events in the log store (`observability-emitters` `otlp.events`, on by
  # default), a logs vmalert (`observability-stack` `vmalert` logs flavour),
  # and renders a VMRule of its own marked `observability.rule-type: vlogs`
  # (`<release>-platform-alerts-logs`). Events carry the involved object, so
  # the alert is per cluster, namespace and owning controller.
  podSecurity:
    enabled: false
    # -- Look-back of the query. Longer than the evaluation interval on
    # purpose: a controller's Events are rate-limited once it backs off, so
    # a still-failing workload emits roughly one every five minutes.
    window: 15m
    # -- 0s: a rejection repeats on retry and is never transient noise.
    for: 0s
    # -- Warning: one workload is down, not the platform. Raise it where a
    # namespace holds only things that must run.
    severity: warning
    # -- Keep each Event's own cluster label on the alert (see
    # `pendingPods.keepClusterLabel`). Set it on a log store that holds
    # several clusters (the vmalert evaluating it names only its own).
    keepClusterLabel: false

  # Per-route Envoy 5xx ratio and p99 latency.
  #
  # Off by default: it reads the Envoy Gateway data plane's own metrics. Names
  # read off a live store scraping `envoy-gateway-system/envoy-proxy`:
  #   envoy_cluster_upstream_rq_xx{envoy_cluster_name, envoy_response_code_class}
  #   envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name, le}  (ms)
  # Envoy Gateway names one Envoy cluster per HTTPRoute rule,
  # `httproute/<namespace>/<route>/rule/<n>`, so `envoy_cluster_name` is the
  # per-route label. Not namespaced: a route's namespace is in its name, so
  # select routes with `routeSelector`.
  envoyRoutes:
    enabled: false
    # -- A regular expression over the `job` of the Envoy proxies' metrics.
    job: envoy-gateway-system/envoy-proxy
    # -- A regular expression over `envoy_cluster_name`. Anchored by the
    # matcher itself. Narrow it to `httproute/(ns1|ns2)/.*` for product routes.
    routeSelector: "httproute/.*"
    window: 5m
    for: 10m
    # -- Share of upstream responses that are 5xx.
    warningRatio: 0.05
    criticalRatio: 0.25
    # -- p99 upstream response time, milliseconds.
    warningLatencyMs: 2000
    criticalLatencyMs: 10000
    # -- Traffic guard: a route below this rate (requests per second over
    # `window`) never alerts, so a route that sees a request an hour cannot
    # page on one failure.
    minRequestsPerSecond: 0.1
    warningSeverity: warning
    criticalSeverity: critical
    # -- Keep the series' own `clusterLabel` (see `pendingPods.keepClusterLabel`).
    keepClusterLabel: false

  # cert-manager Certificates: expiry and readiness.
  #
  # Off by default. Reads, from cert-manager's controller metrics:
  #   certmanager_certificate_expiration_timestamp_seconds{name, exported_namespace}
  #   certmanager_certificate_ready_status{name, exported_namespace, condition}
  certificates:
    enabled: false
    # -- A regular expression over the Certificate's namespace
    # (`exported_namespace`). Empty inherits the top-level `namespaceSelector`.
    namespaceSelector: ""
    warningDays: 14
    criticalDays: 3
    notReadyFor: 15m
    warningSeverity: warning
    criticalSeverity: critical
    keepClusterLabel: false

  # OOM kills and restart rate (kube-state-metrics' `pods` collector).
  #
  # Off by default. Reads
  #   kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
  #   kube_pod_container_status_restarts_total
  restarts:
    enabled: false
    namespaceSelector: ""
    # -- An OOM-killed container counts while it has restarted within this
    # window.
    window: 15m
    oomSeverity: warning
    restartWindow: 1h
    # -- Restarts within `restartWindow` above which the second alert fires.
    maxRestarts: 5
    restartSeverity: warning
    # -- The slow crash loop alert (`ContainerRestartingSlowly`): more than
    # `slowMaxRestarts` restarts within `slowRestartWindow`, for
    # `slowRestartFor`. Catches a container that dies every hour or two,
    # which resets the back-off each time and so never trips a crash-loop
    # alert.
    slowRestartWindow: 6h
    slowMaxRestarts: 3
    slowRestartFor: 15m
    slowRestartSeverity: warning
    # -- A regular expression (fully anchored, like every PromQL matcher)
    # over namespaces the slow alert skips, on top of `namespaceSelector`:
    # CI runner namespaces restart pods by design. Empty excludes nothing.
    slowRestartExcludeNamespaces: "arc-.*|ci-.*"
    keepClusterLabel: false

  # Deployments with nothing running.
  #
  # Off by default. Reads kube_deployment_status_replicas_available and
  # kube_deployment_spec_replicas. Scope it with `namespaceSelector`.
  workloadAbsent:
    enabled: false
    namespaceSelector: ""
    for: 10m
    severity: critical
    keepClusterLabel: false
