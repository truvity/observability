{{- range $p := (.Values.metrics.scrape.probes | default list) }}
{{- if and $.Values.metrics.enabled $.Values.blackboxExporter.enabled }}
{{- /*
One HTTP probe: a VMProbe the metrics agent turns into a scrape of the
blackbox exporter's `/probe?module=<module>&target=<url>`. The series are
the exporter's own `probe_*` ones, so the target's body is never parsed.
`probe` carries the name and `job` is `http-probe` for every probe.

The cluster's identity is stamped HERE, as the probe's own target
relabeling, and not left to the agent's default scrape class: the operator
does not apply a scrape class to a VMProbe unless it names one, so the
series of a probe that relied on the default arrived with no
`k8s_cluster_name` at all, were stored, and were invisible to every reader
scoped by that label. The rules are the cluster-scoped stamp (cluster and
tier) plus the namespace of this release, which is where the exporter runs
and what the owner rules key on.
*/}}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: {{ printf "%s-%s" (include "observability-emitters.fullname" $) $p.name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability-emitters.labels" $ | nindent 4 }}
spec:
  jobName: http-probe
  module: {{ default "http_2xx" $p.module | quote }}
  {{- with $p.interval }}
  interval: {{ . }}
  {{- end }}
  vmProberSpec:
    url: {{ printf "%s.%s.svc:%d" (include "observability-emitters.blackbox.fullname" $) $.Release.Namespace (int $.Values.blackboxExporter.port) | quote }}
    scheme: http
    path: /probe
  targets:
    staticConfig:
      targets:
        - {{ $p.url | quote }}
      labels:
        probe: {{ $p.name | quote }}
      relabelingConfigs:
        {{- include "observability-emitters.tenancy.clusterScopedRelabelConfigs" $ | nindent 8 }}
        - target_label: k8s_namespace_name
          replacement: {{ $.Release.Namespace | quote }}
{{- end }}
{{- end }}
