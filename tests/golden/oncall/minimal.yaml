# Source: oncall/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oncall-goalert
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: goalert
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oncall
      app.kubernetes.io/instance: oncall
      app.kubernetes.io/component: goalert
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # People (through the gateway) and Alertmanager, on the HTTP port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 8081
    # The metrics port.
    - ports:
        - protocol: TCP
          port: 2112
  egress:
    # PostgreSQL.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: oncall-pg
      ports:
        - protocol: TCP
          port: 5432
    # The relay: a user's Webhook contact method points at it.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oncall
              app.kubernetes.io/instance: oncall
              app.kubernetes.io/component: telegram-relay
      ports:
        - protocol: TCP
          port: 8080
    # DNS. With no `networkPolicy.dns`, port 53 to any destination.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The OIDC issuer and any HTTPS webhook. A NetworkPolicy cannot pin a
    # hostname, so this is HTTPS to anywhere, stated as that.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

---
# Source: oncall/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oncall-telegram-relay
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: telegram-relay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oncall
      app.kubernetes.io/instance: oncall
      app.kubernetes.io/component: telegram-relay
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # GoAlert only: the relay is no one else's webhook.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oncall
              app.kubernetes.io/instance: oncall
              app.kubernetes.io/component: goalert
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 9090
  egress:
    # DNS. With no `networkPolicy.dns`, port 53 to any destination.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The Telegram Bot API, HTTPS to anywhere: its addresses are not a
    # CIDR anyone publishes as stable.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443


