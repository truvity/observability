{{- if .Values.networkPolicy.enabled }}
{{- /*
Ingress only (docs/frontend.md says why not egress). The first policy that
selects a pod default-denies it, so `ingressFrom` is the whole allow-list;
empty is refused in _validate.tpl.
*/ -}}
{{- $full := include "observability-rum.fullname" . -}}
{{- $apps := include "observability-rum.apps" . | fromYamlArray -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-rum.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "observability-rum.alloySelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        {{- range $a := $apps }}
        - protocol: TCP
          port: {{ $a.port }}
        {{- end }}
    {{- if .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 12345
    {{- end }}
{{- end }}
