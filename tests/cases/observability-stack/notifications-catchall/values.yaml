# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# The deadman receiver IS configured here, so `Watchdog` keeps its own
# route and the catch-all never sees it (compare `small-estate`, which
# has none and renders a null route for it instead).
alertmanager:
  watchdog:
    secretName: example-watchdog-receiver
    key: url

# `catchAll` on Slack, beside a project route: an `info` alert — or one
# with no severity — in the project's namespace lands in the catch-all
# channel too, because the catch-all is the fallback of EVERY node in the
# primary tree, not only the last one. `warning` is deliberately not a
# tier here: with a catch-all set it is no longer refused, and warnings
# land in the catch-all channel. Inhibition is switched off, and grouping
# is by every label.
notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  groupBy: ["..."]
  inhibit:
    enabled: false
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
  catchAll: {receiver: slack, channel: "#alerts-everything-else"}
  routes:
    - match: {k8s_namespace_name: example-app}
      critical: "#example-app-critical"
