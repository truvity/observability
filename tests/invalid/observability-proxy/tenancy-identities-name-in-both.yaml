# expect: is in `tenancy.identities` and also in `tenancy.principals`
# The same principal name written under both keys: one VMUser name, two grants, one silently not applied.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  principals:
    - name: viewers
      groups: [example:other]
      grants:
        - cluster: cluster-a
          namespaces: [example-app]
  identities:
    - name: viewers
      groups: [example:viewers]
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]

victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
