---
# Source: platform-alerts/templates/vmrule.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - name: platform-alerts.cnpg
      interval: 1m
      rules:
        # A CloudNativePG Cluster whose Ready condition is not True for `for`.
        #
        # `cnpg_cluster_status_condition` is a gauge kube-state-metrics'
        # customResourceState exports from each Cluster's
        # `.status.conditions`: 1 while the condition is True, 0 while it is
        # False or Unknown, and `phase` is the Cluster's `.status.phase`.
        # The per-instance exporter (`cnpg_collector_*`) cannot see this: a
        # Cluster can sit at Ready=False in "Switchover in progress" with
        # every instance up.
        - alert: CNPGClusterNotReady
          expr: >-
            max by (k8s_cluster_name, namespace, cluster, phase) (
              cnpg_cluster_status_condition{type="Ready"} == 0
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CloudNativePG Cluster {{ $labels.namespace }}/{{ $labels.cluster }} has not been Ready for 15m (phase: {{ $labels.phase }})"
            description: >-
              The Cluster object's Ready condition has been False or Unknown
              for 15m, in phase "{{ $labels.phase }}"{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }}.
              The instances can all be up and serving while this holds, so the
              database may look healthy. First look:
              `kubectl -n {{ $labels.namespace }} get cluster.postgresql.cnpg.io {{ $labels.cluster }} -o yaml`
              (status.phase, status.phaseReason, status.conditions), then the
              CloudNativePG operator's logs for this Cluster.
        # The upstream CloudNativePG bug where a primary change leaves the
        # operator's config reload lost: `status.phase` stays at "Switchover
        # in progress" or "Waiting for the instances to become active"
        # indefinitely while every instance is ready. A phase that is not
        # healthy with ready instances equal to the desired ones is that
        # signature; a genuinely degraded Cluster has fewer ready and is
        # CNPGClusterNotReady's. The phase is dropped from the match, so the
        # `for` clock does not restart when the stuck phase changes its text.
        - alert: CNPGClusterPhaseStuck
          expr: >-
            count by (k8s_cluster_name, namespace, cluster) (
              cnpg_cluster_status_condition{type="Ready", phase!="Cluster in healthy state"}
            )
            and on (k8s_cluster_name, namespace, cluster) (
              max by (k8s_cluster_name, namespace, cluster) (cnpg_cluster_ready_instances)
              == max by (k8s_cluster_name, namespace, cluster) (cnpg_cluster_instances)
            )
            and on (k8s_cluster_name, namespace, cluster) (
              max by (k8s_cluster_name, namespace, cluster) (cnpg_cluster_instances) > 0
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CloudNativePG Cluster {{ $labels.namespace }}/{{ $labels.cluster }} phase is stuck for 10m with every instance ready"
            description: >-
              The Cluster's status.phase has not been "Cluster in healthy
              state" for 10m{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }} although its ready
              instances equal the desired ones: the operator lost a config
              reload after a primary change (upstream cloudnative-pg #11627).
              Run `SELECT pg_reload_conf()` on every instance of the Cluster;
              restarting the operator or the pods does not help. Check the pod
              roles first (`kubectl -n {{ $labels.namespace }} get pods -l cnpg.io/cluster={{ $labels.cluster }} -L role`).
              A stuck Cluster also blocks the Argo CD sync that owns it.
        # The deadman for the rules above: the series not being exported at
        # all (the preset never applied, or the scrape is dark) reads as
        # healthy to a rule that compares its values.
        - alert: CNPGMetricsAbsent
          expr: >-
            (group by (k8s_cluster_name) (max_over_time(cnpg_cluster_status_condition{type="Ready", k8s_cluster_name!=""}[1d])) unless group by (k8s_cluster_name) (cnpg_cluster_status_condition{type="Ready", k8s_cluster_name!=""})) or (absent(cnpg_cluster_status_condition{type="Ready"}) unless on() group(max_over_time(cnpg_cluster_status_condition{type="Ready"}[1d])))
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "kube-state-metrics has not exported CloudNativePG Cluster conditions for 30m{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }}"
            description: >-
              cnpg_cluster_status_condition{type="Ready"} has not been seen in
              30m{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }}, so CNPGClusterNotReady cannot fire even if
              a Cluster is stuck. Check that
              `kubeStateMetrics.customResources.cnpg` is on in
              observability-emitters and that the scrape is up.
        # A cluster's newest failed Backup is newer than its newest completed
        # one, or it has none completed: the last backup attempt failed and
        # nothing has succeeded since. `cnpg_backup_created_timestamp_seconds`
        # is kube-state-metrics' (the `customResources.cnpg` preset): per
        # (namespace, cluster, phase) the creation time of the NEWEST Backup in
        # that phase, with no Backup name label (Backups accumulate, one per
        # scheduled run). An old failure followed by a success does not fire.
        - alert: CNPGBackupFailed
          expr: >-
            (
              max by (k8s_cluster_name, namespace, cluster) (cnpg_backup_created_timestamp_seconds{phase=~"failed|walArchivingFailing"})
              > on (k8s_cluster_name, namespace, cluster)
              max by (k8s_cluster_name, namespace, cluster) (cnpg_backup_created_timestamp_seconds{phase="completed"})
            )
            or
            (
              max by (k8s_cluster_name, namespace, cluster) (cnpg_backup_created_timestamp_seconds{phase=~"failed|walArchivingFailing"})
              unless on (k8s_cluster_name, namespace, cluster)
              cnpg_backup_created_timestamp_seconds{phase="completed"}
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The last backup of CloudNativePG Cluster {{ $labels.namespace }}/{{ $labels.cluster }} failed"
            description: >-
              The newest Backup of the Cluster{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }} is in phase
              failed (or walArchivingFailing) and no Backup has completed
              since. Point-in-time recovery still reaches back to the last
              good base backup as long as WAL archiving works, but that
              window only ages from here. First look:
              `kubectl -n {{ $labels.namespace }} get backups.postgresql.cnpg.io --sort-by=.metadata.creationTimestamp`
              (status.error of the newest one), then the plugin-barman-cloud
              sidecar's log on the instance that ran it.
            runbook_url: "https://github.com/truvity/cnpg/blob/master/docs/runbooks.md#cnpgbackupfailed"
        # A cluster's newest unfinished Backup (no phase yet, pending,
        # started, running, finalizing) was created more than
        # backupStuckSeconds ago: a backup that hangs blocks the ones after
        # it, so the newest one ageing past the threshold means none has
        # finished for that long.
        - alert: CNPGBackupStuck
          expr: >-
            time() - max by (k8s_cluster_name, namespace, cluster) (
              cnpg_backup_created_timestamp_seconds{phase=~"|pending|started|running|finalizing"}
            ) > 7200
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "A backup of CloudNativePG Cluster {{ $labels.namespace }}/{{ $labels.cluster }} has not finished in 120 minutes"
            description: >-
              The Cluster's newest Backup{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }} was created
              {{ $value | humanizeDuration }} ago and is still pending,
              started, running or finalizing (or has no phase: the operator
              never picked it up). First look:
              `kubectl -n {{ $labels.namespace }} get backups.postgresql.cnpg.io --sort-by=.metadata.creationTimestamp`
              and the Cluster's status; a Backup whose Cluster no longer
              exists stays unfinished for good and should be deleted.
            runbook_url: "https://github.com/truvity/cnpg/blob/master/docs/runbooks.md#cnpgbackupstuck"
        # A CloudNativePG instance pod on a node Karpenter is draining
        # (taint karpenter.sh/disrupted). The instance's PodDisruptionBudget
        # (and, on a prod cluster, karpenter.sh/do-not-disrupt) keeps it
        # there; the node is stuck half-drained until the node pool's
        # termination grace period evicts the pod by force, a primary
        # included. Instance pods are owned by their Cluster
        # (kube_pod_info created_by_kind="Cluster"); the join with
        # cnpg_cluster_instances keeps another operator's "Cluster" kind out.
        - alert: CNPGInstanceOnDisruptedNode
          expr: >-
            label_replace(
              (
                max by (k8s_cluster_name, namespace, created_by_name, pod, node) (
                  kube_pod_info{created_by_kind="Cluster", node!=""}
                )
                * on (k8s_cluster_name, node) group_left()
                max by (k8s_cluster_name, node) (kube_node_spec_taint{key="karpenter.sh/disrupted"})
              )
              and on (k8s_cluster_name, namespace, created_by_name)
              label_replace(
                max by (k8s_cluster_name, namespace, cluster) (cnpg_cluster_instances),
                "created_by_name", "$1", "cluster", "(.+)"
              ),
              "cluster", "$1", "created_by_name", "(.+)"
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "CloudNativePG instance {{ $labels.namespace }}/{{ $labels.pod }} is on node {{ $labels.node }}, which is being disrupted"
            description: >-
              The node{{ with $labels.k8s_cluster_name }} on cluster {{ . }}{{ end }} has carried the
              karpenter.sh/disrupted taint for 30m and still
              runs this database instance: the drain waits on the Cluster's
              PodDisruptionBudget. Move the instance on your terms before the
              node pool's termination grace period evicts it: for a replica,
              delete the pod (the operator recreates it elsewhere); for the
              primary, switch over first
              (`kubectl cnpg promote {{ $labels.cluster }} <replica> -n {{ $labels.namespace }}`).
            runbook_url: "https://github.com/truvity/cnpg/blob/master/docs/runbooks.md#cnpginstanceondisruptednode"
