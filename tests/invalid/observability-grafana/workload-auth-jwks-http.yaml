# expect: at '/global/observabilityGrafana/workloadAuth/jwksUrl'
# Grafana refuses a plain-http JWKS URL and would not start; the schema refuses it first.
global:
  observabilityGrafana:
    database:
      host: pg:5432
      secretRef: {name: grafana-pg-app}
    oauth:
      clientId: grafana
      clientSecretRef: {name: grafana-client}
      issuer: https://issuer.example.org
      roleAttributePath: '''Editor'''
    rootUrl: https://grafana.example.org
    secretKeyRef: {name: grafana-secret-key}
    stores:
    - {default: true, name: store-a, url: 'https://a.example.org'}
    workloadAuth: {enabled: true, issuer: 'https://issuer.example.org', jwksUrl: 'http://issuer.example.org/keys', audience: grafana-workload}
