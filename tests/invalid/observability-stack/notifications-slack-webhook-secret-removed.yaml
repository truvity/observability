# expect: `notifications.slack.webhookSecret` was removed
# A leftover `slack.webhookSecret`: one incoming webhook ignores `channel`,
# so the chart refuses it and says what replaced it.

notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
