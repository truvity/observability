# expect: `tenancy.authz.securityPolicy.targetRefs` is empty
# The route is rendered outside this chart; the policy cannot guess which one.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    securityPolicy:
      enabled: true
    networkPolicy:
      gatewayFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: envoy
  identities:
  - groups:
    - example:example-app:deployer
    reach:
      clusters:
      - cluster: cluster-a
        namespaces:
        - example-app
victoria-traces-single:
  enabled: false
