# Source: observability-proxy/templates/vmusers.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: observability-proxy-stack-example-k8s-viewers
  labels:
    app.kubernetes.io/name: stack
    app.kubernetes.io/instance: observability-proxy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.role: reader
spec:
  name: "example.k8s.viewers"
  disable_secret_creation: true
  jwt:
    oidc:
      issuer: "https://issuer.example"
    matchClaims:
      entitlements: "^(example\\.k8s\\.viewers)$"
      aud: "^(example-client\\.example@example-project)$"
    defaultVMAccessClaim:
      metricsExtraFilters:
        - '{cell="example-cluster"}'
        - '{cell="other-cluster",ns=~"^(example-app|other-app)$"}'
      logsExtraStreamFilters:
        - _stream:{"k8s.cell"="example-cluster" or "k8s.cell"="other-cluster","kubernetes.namespace_name"=~"^(example-app|other-app)$"}
  load_balancing_policy: first_available
  retry_status_codes: 
    - 500
    - 502
    - 503
  targetRefs:
    - static:
        url: "http://vmsingle-observability-proxy-victoria-metrics-k8s-stack.default.svc:8428"
      paths:
        - /prometheus/api/v1/query
        - /prometheus/api/v1/query_range
        - /prometheus/api/v1/series
        - /prometheus/api/v1/labels
        - /prometheus/api/v1/label/[^/]+/values
        - /prometheus/api/v1/status/tsdb
        - /prometheus/api/v1/status/buildinfo
        - /prometheus/api/v1/rules
        - /prometheus/api/v1/query_exemplars
        - /prometheus/api/v1/format_query
        - /prometheus/vmui.*
        - /prometheus/api/v1/metadata
      query_args:
        - name: extra_filters
          values:
            - "{{.MetricsExtraFilters}}"
        - name: extra_filters[]
          values:
            - "{{.MetricsExtraFilters}}"
      targetRefBasicAuth:
        username:
          name: "example-store-credentials"
          key: "user"
        password:
          name: "example-store-credentials"
          key: "pass"
    - static:
        url: "http://observability-proxy-victoria-logs-single-server.default.svc:9428"
      paths:
        - /select/logsql/.*
        - /select/vmui.*
      query_args:
        - name: extra_stream_filters
          values:
            - "{{.LogsExtraStreamFilters}}"
      targetRefBasicAuth:
        username:
          name: "example-store-credentials"
          key: "user"
        password:
          name: "example-store-credentials"
          key: "pass"

