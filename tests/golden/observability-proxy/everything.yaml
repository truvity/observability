---
# Source: observability-proxy/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-proxy-stack-proxy
  labels:
    app.kubernetes.io/name: stack
    app.kubernetes.io/instance: observability-proxy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmauth
      app.kubernetes.io/instance: observability-proxy-stack
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: example-console
      ports:
        - protocol: TCP
          port: 8427
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8435

---
# Source: observability-proxy/templates/vmauth.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: observability-proxy-stack
  labels:
    app.kubernetes.io/name: stack
    app.kubernetes.io/instance: observability-proxy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  image:
    repository: victoriametrics/vmauth
    tag: v1.153.0
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: vmauth
          app.kubernetes.io/instance: observability-proxy-stack
  podDisruptionBudget:
    maxUnavailable: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      cpu: "2"
      memory: 1Gi
    requests:
      cpu: "2"
      memory: 1Gi
  selectAllByDefault: false
  userSelector:
    matchLabels:
      app.kubernetes.io/part-of: observability-stack
      app.kubernetes.io/instance: observability-proxy
  userNamespaceSelector: {}
  extraArgs:
    logInvalidAuthTokens: "true"
    maxConcurrentRequests: "500"

