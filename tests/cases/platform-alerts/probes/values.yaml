# The probes group, on, with the alert named for what it watches.
groups:
  backups:
    enabled: false
  writePath:
    enabled: false
  volumes:
    enabled: false
  storeLimits:
    enabled: false
  kargo:
    enabled: false
  probes:
    enabled: true
    alertName: ExampleStatusDown
    probe: example-status
    severity: critical
    summary: The example page or its CDN is unreachable from this cluster
    description: The probe has read up == 0; either the page or the third party in front of it is down.
    certExpiry:
      enabled: true
      withinDays: 21
