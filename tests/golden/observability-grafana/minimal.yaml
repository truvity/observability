# Source: observability-grafana/templates/datasources.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-grafana-datasources-e8186081
  namespace: default
  labels:
    app.kubernetes.io/name: observability-grafana
    app.kubernetes.io/instance: observability-grafana
    app.kubernetes.io/managed-by: Helm
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      jsonData:
        oauthPassThru: true
      name: Metrics (store-a)
      type: victoriametrics-metrics-datasource
      uid: store-a-metrics
      url: https://store-a.example.org/prometheus
    - access: proxy
      isDefault: true
      jsonData:
        httpMethod: POST
        oauthPassThru: true
        prometheusType: Prometheus
      name: Prometheus (store-a)
      type: prometheus
      uid: store-a-prom
      url: https://store-a.example.org/prometheus
    - access: proxy
      jsonData:
        derivedFields:
        - datasourceUid: store-a-traces
          matcherRegex: trace_id
          matcherType: label
          name: TraceID
          url: $${__value.raw}
          urlDisplayLabel: Open trace
        oauthPassThru: true
      name: Logs (store-a)
      type: victoriametrics-logs-datasource
      uid: store-a-logs
      url: https://store-a.example.org
    - access: proxy
      jsonData:
        oauthPassThru: true
        tracesToLogsV2:
          customQuery: true
          datasourceUid: store-a-logs
          filterBySpanID: false
          filterByTraceID: false
          query: trace_id:"$${__trace.traceId}"
          spanEndTimeShift: 5m
          spanStartTimeShift: -5m
      name: Traces (store-a)
      type: jaeger
      uid: store-a-traces
      url: https://store-a.example.org/select/jaeger
    - access: proxy
      jsonData:
        oauthPassThru: true
      name: Metrics (store-b)
      type: victoriametrics-metrics-datasource
      uid: store-b-metrics
      url: https://store-b.example.org/prometheus
    - access: proxy
      jsonData:
        httpMethod: POST
        oauthPassThru: true
        prometheusType: Prometheus
      name: Prometheus (store-b)
      type: prometheus
      uid: store-b-prom
      url: https://store-b.example.org/prometheus
    - access: proxy
      jsonData:
        derivedFields:
        - datasourceUid: store-b-traces
          matcherRegex: trace_id
          matcherType: label
          name: TraceID
          url: $${__value.raw}
          urlDisplayLabel: Open trace
        oauthPassThru: true
      name: Logs (store-b)
      type: victoriametrics-logs-datasource
      uid: store-b-logs
      url: https://store-b.example.org
    - access: proxy
      jsonData:
        oauthPassThru: true
        tracesToLogsV2:
          customQuery: true
          datasourceUid: store-b-logs
          filterBySpanID: false
          filterByTraceID: false
          query: trace_id:"$${__trace.traceId}"
          spanEndTimeShift: 5m
          spanStartTimeShift: -5m
      name: Traces (store-b)
      type: jaeger
      uid: store-b-traces
      url: https://store-b.example.org/select/jaeger

