# `notifications.alertmanagerUrl` set: the VMAlertmanager `externalURL` is
# rendered from it (and not from `vmalert.externalUrl`, which is the
# Grafana base), and every message carries a `Silence:` line built on it.
# Every other notifications case leaves it unset and so renders no
# `Silence:` line at all.
# The cluster's DNS suffix is a neutral placeholder: a golden render is a
# tracked file in a public repository.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

vmalert:
  externalUrl: https://grafana.example

notifications:
  alertmanagerUrl: https://alertmanager.example
  slack:
    workspaces:
      - name: acme
        appTokenSecret: {name: example-acme-slack-bot, key: token}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
