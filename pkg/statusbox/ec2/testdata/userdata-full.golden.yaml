  - path: /opt/asg/ssh/setup.sh
    owner: root:root
    permissions: "0700"
    content: |
      #!/bin/bash
      # Rendered by github.com/truvity/asg/modules/ssh. Every step is fail-safe.
      dnf install -y checkpolicy || echo "asg ssh: package install failed"
      # Host key: restore the one fixed key from SSM before sshd is restarted. Fail-safe.
      (
        set -euo pipefail
        umask 077
        tok="$(curl -sf -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)"
        region="$(curl -sf -H "X-aws-ec2-metadata-token: $tok" http://169.254.169.254/latest/meta-data/placement/region)"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        aws ssm get-parameter --name /acme/status/ssh-host-key --with-decryption --query Parameter.Value --output text --region "$region" >"$tmp/key"
        ssh-keygen -y -f "$tmp/key" >"$tmp/key.pub"
        install -m 0600 -o root -g root "$tmp/key" /etc/ssh/ssh_host_ed25519_key
        install -m 0644 -o root -g root "$tmp/key.pub" /etc/ssh/ssh_host_ed25519_key.pub
        printf 'HostKey /etc/ssh/ssh_host_ed25519_key\n' >/etc/ssh/sshd_config.d/05-asg-hostkey.conf
        if sshd -t; then systemctl restart sshd; else rm -f /etc/ssh/sshd_config.d/05-asg-hostkey.conf; exit 1; fi
      ) || echo "asg ssh: host key restore failed; sshd keeps its generated key"
      # Key exchange: prefer the standardised ML-KEM hybrid, then the sntrup hybrid, then sshd's defaults. Fail-safe.
      (
        set -euo pipefail
        printf 'KexAlgorithms ^mlkem768x25519-sha256,sntrup761x25519-sha512@openssh.com\n' >/etc/ssh/sshd_config.d/06-asg-kex.conf
        if sshd -t; then systemctl restart sshd; else rm -f /etc/ssh/sshd_config.d/06-asg-kex.conf; exit 1; fi
      ) || { rm -f /etc/ssh/sshd_config.d/06-asg-kex.conf; echo "asg ssh: post-quantum key exchange not enabled; sshd keeps its defaults"; }
      curl -fsSL -o /usr/local/sbin/hostaccess-setup.sh "https://github.com/truvity/tailscale/releases/download/v1.24.2/hostaccess-setup-v1.24.2.sh" && echo "5bad9c99a3d626b1fec81e335ef84ceee40cbaf8b18981a22162e8fddecf7872  /usr/local/sbin/hostaccess-setup.sh" | sha256sum -c - && chmod 0755 /usr/local/sbin/hostaccess-setup.sh && /usr/local/sbin/hostaccess-setup.sh || echo "hostaccess-setup fail"
  - path: /usr/local/lib/asg/in-service.d/00-statusbox.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/bash
      # in-service step: statusbox
