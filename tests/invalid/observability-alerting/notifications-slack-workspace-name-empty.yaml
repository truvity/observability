# expect: at '/notifications/slack/workspaces/0/name'
# A workspace with an empty name.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: ''
      appTokenSecret:
        name: example-acme-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
