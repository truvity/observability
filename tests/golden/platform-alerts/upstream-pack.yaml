apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts-upstream-vmalert
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - interval: 30s
      name: vmalert
      rules:
      - alert: ConfigurationReloadFailure
        annotations:
          description: Configuration hot-reload failed for vmalert on instance {{ $labels.instance
            }}. Check vmalert's logs for detailed error message.
          summary: Configuration reload failed for vmalert instance {{ $labels.instance
            }}
        expr: vmalert_config_last_reload_successful != 1
        labels:
          severity: warning
      - alert: AlertingRulesError
        annotations:
          dashboard: '{{ $externalURL }}/d/LzldHAVnz?viewPanel=13&var-instance={{ $labels.instance
            }}&var-file={{ $labels.file }}&var-group={{ $labels.group }}'
          description: Alerting rules execution is failing for "{{ $labels.alertname }}"
            from group "{{ $labels.group }}" in file "{{ $labels.file }}". Check vmalert's
            logs for detailed error message.
          summary: Alerting rules are failing for vmalert instance {{ $labels.instance }}
        expr: sum(increase(vmalert_alerting_rules_errors_total[5m])) without(id) > 0
        for: 5m
        labels:
          severity: warning
      - alert: RecordingRulesError
        annotations:
          dashboard: '{{ $externalURL }}/d/LzldHAVnz?viewPanel=30&var-instance={{ $labels.instance
            }}&var-file={{ $labels.file }}&var-group={{ $labels.group }}'
          description: Recording rules execution is failing for "{{ $labels.recording }}"
            from group "{{ $labels.group }}" in file "{{ $labels.file }}". Check vmalert's
            logs for detailed error message.
          summary: Recording rules are failing for vmalert instance {{ $labels.instance
            }}
        expr: sum(increase(vmalert_recording_rules_errors_total[5m])) without(id) > 0
        for: 5m
        labels:
          severity: warning
      - alert: RecordingRulesNoData
        annotations:
          dashboard: '{{ $externalURL }}/d/LzldHAVnz?viewPanel=33&var-file={{ $labels.file
            }}&var-group={{ $labels.group }}'
          description: Recording rule "{{ $labels.recording }}" from group "{{ $labels.group
            }} in file "{{ $labels.file }}" produces 0 samples over the last 30min. It might
            be caused by a misconfiguration or incorrect query expression.
          summary: Recording rule {{ $labels.recording }} ({{ $labels.group }}) produces
            no data
        expr: sum(vmalert_recording_rules_last_evaluation_samples{recording!~"count:up0"})
          without(id) < 1
        for: 30m
        labels:
          severity: info
      - alert: TooManyMissedIterations
        annotations:
          description: vmalert instance {{ $labels.instance }} is missing rules evaluations
            for group "{{ $labels.group }}" in file "{{ $labels.file }}". The group evaluation
            time takes longer than the configured evaluation interval. This may result in
            missed alerting notifications or recording rules samples. Try increasing evaluation
            interval or concurrency of group "{{ $labels.group }}". See https://docs.victoriametrics.com/victoriametrics/vmalert/#groups.
            If rule expressions are taking longer than expected, please see https://docs.victoriametrics.com/victoriametrics/troubleshooting/#slow-queries.
          summary: vmalert instance {{ $labels.instance }} is missing rules evaluations
        expr: increase(vmalert_iteration_missed_total[5m]) > 0
        for: 15m
        labels:
          severity: warning
      - alert: GroupIterationReset
        annotations:
          description: Evaluation iteration for group "{{ $labels.group }}" in file "{{
            $labels.file }}" is reset on vmalert instance {{ $labels.instance }}. This can
            be caused by irregular delays during evaluation or by the system wall clock
            being moved backward. If it is caused by host clock changes, vmalert could generate
            duplicate results for the group rules since some evaluations could be repeated.
            Check host clock time synchronization configurations if this happens frequently.
          summary: Evaluation iteration for group {{ $labels.group }} in file {{ $labels.file
            }} is reset
        expr: increase(vmalert_iteration_reset_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
      - alert: RemoteWriteErrors
        annotations:
          description: vmalert instance {{ $labels.instance }} is failing to push metrics
            generated via alerting or recording rules to the configured remote write URL.
            Check vmalert's logs for detailed error message.
          summary: vmalert instance {{ $labels.instance }} is failing to push metrics to
            remote write URL
        expr: increase(vmalert_remotewrite_errors_total[5m]) > 0
        for: 15m
        labels:
          severity: warning
      - alert: RemoteWriteDroppingData
        annotations:
          description: vmalert instance {{ $labels.instance }} is failing to send results
            of alerting or recording rules to the configured remote write URL. This may
            result into gaps in recording rules or alerts state. Check vmalert's logs for
            detailed error message.
          summary: vmalert instance {{ $labels.instance }} is dropping data sent to remote
            write URL
        expr: increase(vmalert_remotewrite_dropped_rows_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
      - alert: RemoteWriteQueueHighUsage
        annotations:
          description: 'The remote write queue on vmalert instance {{ $labels.instance }}
            has consistently high utilization. The queue acts as a buffer between rules
            generating series and remote-write client consuming and pushing these series.
            When queue overflows, vmalert will start dropping newly generated series. Queue
            may overflow due to multiple reasons: 1. Some bad rules produce too many series
            at once. This can be limited using the global `-rule.resultsLimit` flag or `limit`
            param at the rule group level. 2. Remote write connection is slow.  Increase
            `-remoteWrite.concurrency`,  so vmalert could establish more concurrent connections.
            3. The queue size is too small. Increase `-remoteWrite.maxQueueSize` to extend
            the buffer size. Note that a larger queue will result in higher memory consumption
            when the queue is full.'
          summary: Remote write queue capacity on the vmalert instance {{ $labels.instance
            }} has exceeded 80% utilization
        expr: (histogram_quantile(0.99, sum(increase(vmalert_remotewrite_queue_size_bucket[5m]))
          by(job,instance,vmrange)) / vmalert_remotewrite_queue_capacity) > 0.8
        for: 15m
        labels:
          severity: warning
      - alert: AlertmanagerErrors
        annotations:
          description: vmalert instance {{ $labels.instance }} is failing to send alert
            notifications to "{{ $labels.addr }}". Check vmalert's logs for detailed error
            message.
          summary: vmalert instance {{ $labels.instance }} is failing to send notifications
            to Alertmanager
        expr: increase(vmalert_alerts_send_errors_total[5m]) > 0
        for: 15m
        labels:
          severity: warning
      - alert: AlertingRuleResultsApproachingLimit
        annotations:
          description: Alerting rule "{{ $labels.alertname }}" from group "{{ $labels.group
            }}" in file "{{ $labels.file }}" produced {{ $value }} samples in last evaluation,
            which approaches the configured results limit. If the produced results exceed
            the limit, the rule will be marked with an error and all its results will be
            discarded. Try increasing the results limit for the group or reducing the number
            of series produced by the rule. See https://docs.victoriametrics.com/victoriametrics/vmalert/#groups.
          summary: Alerting rule {{ $labels.alertname }} in group {{ $labels.group }} is
            approaching the configured results limit
        expr: (vmalert_alerting_rules_last_evaluation_samples > on(group,file) group_left()
          min(vmalert_group_rule_results_limit * 0.9) by(group,file)) and on(group,file)
          (min(vmalert_group_rule_results_limit) by(group,file) > 0)
        for: 5m
        labels:
          severity: warning
      - alert: RecordingRuleResultsApproachingLimit
        annotations:
          description: Recording rule "{{ $labels.recording }}" from group "{{ $labels.group
            }}" in file "{{ $labels.file }}" produced {{ $value }} samples in last evaluation,
            which approaches the configured results limit. If the produced results exceed
            the limit, the rule will be marked with an error and all its results will be
            discarded. Try increasing the results limit for the group or reducing the number
            of series produced by the rule. See https://docs.victoriametrics.com/victoriametrics/vmalert/#groups.
          summary: Recording rule {{ $labels.recording }} in group {{ $labels.group }} is
            approaching the configured results limit
        expr: (vmalert_recording_rules_last_evaluation_samples > on(group,file) group_left()
          min(vmalert_group_rule_results_limit * 0.9) by(group,file)) and on(group,file)
          (min(vmalert_group_rule_results_limit) by(group,file) > 0)
        for: 5m
        labels:
          severity: warning

