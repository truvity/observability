# expect: its URL is not https
# The same refusal for the Grafana connector.
issuerURL: https://issuer.example.com
proxy:
  image:
    tag: v0.0.1
grafana:
  enabled: true
  resourceURL: https://mcp.example.com/grafana
  url: http://grafana.monitoring.svc:80
  caBundle:
    secret: {name: ca, key: ca.crt}
  outbound: {tokenEndpoint: "https://issuer.example.com/token", clientId: observability-mcp-grafana, audience: grafana-workload}
networkPolicy:
  ingressFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateway}}
  egress:
    issuer: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: issuer}}}]
    vmauth: [{podSelector: {matchLabels: {app.kubernetes.io/name: vmauth}}}]
    grafana: [{podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}}]
