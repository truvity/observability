# Source: observability-alerting/templates/vmalert.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: observability-stack-logs
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.rule-type: vlogs
spec:
  replicaCount: 1
  evaluationInterval: 30s
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  ruleSelector:
    matchLabels:
      observability.rule-type: vlogs
    matchExpressions:
      - key: observability.truvity.io/evaluator
        operator: NotIn
        values:
          - "metrics"
  ruleNamespaceSelector: {}
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 512Mi
  datasource:
    url: "http://observability-stack-victoria-logs-single-server.default.svc:9428"
    basicAuth:
      username:
        name: "observability-store-credentials"
        key: "username"
      password:
        name: "observability-store-credentials"
        key: "password"
  remoteWrite:
    url: "http://vmsingle-observability-stack-victoria-metrics-k8s-stack.default.svc:8428"
    basicAuth:
      username:
        name: "observability-store-credentials"
        key: "username"
      password:
        name: "observability-store-credentials"
        key: "password"
  remoteRead:
    url: "http://vmsingle-observability-stack-victoria-metrics-k8s-stack.default.svc:8428"
    basicAuth:
      username:
        name: "observability-store-credentials"
        key: "username"
      password:
        name: "observability-store-credentials"
        key: "password"
  extraArgs:
    external.url: https://grafana.example
    notifier.blackhole: "true"
    rule.defaultRuleType: vlogs
    rule.evalDelay: 5s
