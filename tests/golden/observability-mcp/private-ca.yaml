# Source: observability-mcp/templates/mcp.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-mcp-grafana
  labels:
    app.kubernetes.io/name: observability-mcp
    app.kubernetes.io/instance: observability-mcp
    app.kubernetes.io/component: grafana
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # A rollout never takes a pod away before its replacement is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-mcp
      app.kubernetes.io/instance: observability-mcp
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-mcp
        app.kubernetes.io/instance: observability-mcp
        app.kubernetes.io/component: grafana
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: observability-mcp-grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The stock mcp-grafana, dashboards only, read only. Loopback only,
        # no container port. It is given Grafana's address as the proxy's
        # outbound listener and NO token: the proxy's outbound side adds the
        # workload token Grafana accepts. `--allowed-hosts` names the public
        # host the proxy forwards (and its own loopback address): the server
        # refuses any other Host header.
        - name: upstream
          image: "docker.io/grafana/mcp-grafana:1.6.3@sha256:0479c026fd40a95e6a176855b8570e06845790f8a45de2f9c1ec8ba3ba06a8bf"
          imagePullPolicy: IfNotPresent
          args:
            - --transport=streamable-http
            - --address=127.0.0.1:8081
            - --enabled-tools=search,dashboard
            - --disable-write
            - --allowed-hosts=mcp.example.com,127.0.0.1:8081
            - --usage-stats=disabled
            - --log-level=info
          env:
            - name: GRAFANA_URL
              value: "http://127.0.0.1:8429"
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # The resource-proxy. The pod's only MCP port. Its probes are the
        # pod's for the proxy container: the stock servers listen on
        # loopback, which the kubelet cannot reach.
        - name: proxy
          image: "ghcr.io/truvity/access-roster/resource-proxy:v0.0.1"
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN
              value: ":8080"
            - name: UPSTREAM
              value: "http://127.0.0.1:8081/mcp"
            - name: ISSUER_URL
              value: "https://issuer.example.com"
            - name: RESOURCE_URL
              value: "https://mcp.example.com/grafana"
            - name: SCOPE
              value: "openid"
            - name: OUTBOUND_LISTEN
              value: "127.0.0.1:8429"
            - name: OUTBOUND_TARGET
              value: "https://grafana.monitoring.svc:80"
            - name: OUTBOUND_SA_TOKEN_FILE
              value: "/var/run/observability-mcp/sa-token"
            - name: OUTBOUND_TOKEN_ENDPOINT
              value: "https://issuer.example.com/token"
            - name: OUTBOUND_CLIENT_ID
              value: "observability-mcp-grafana"
            - name: OUTBOUND_AUDIENCE
              value: "grafana-workload"
            - name: OUTBOUND_CA_FILE
              value: "/etc/observability-mcp/outbound-ca/ca.pem"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/observability-mcp
              readOnly: true
            - name: outbound-ca
              mountPath: /etc/observability-mcp/outbound-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "access-issuer"
                  expirationSeconds: 600
                  path: sa-token
        - name: outbound-ca
          secret:
            secretName: "grafana-ca"
            items:
              - key: "tls.crt"
                path: ca.pem
