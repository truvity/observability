# Queue input: SNS topics publish to one SQS queue and alert-ingress polls it
# (input.mode sqs). Credentials come from the default AWS chain; the SQS
# alert rules are on.
alertmanager:
  url: http://vmalertmanager-observability-stack.observability.svc:9093

topics:
  - "<the security-alerts topic ARN>"

heartbeat:
  match: {"source": "alert-ingress-heartbeat"}
  interval: 15m

input:
  mode: sqs
  sqs:
    queueURL: https://sqs.eu-west-1.amazonaws.com/ACCOUNT/alerts
    concurrency: 2

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "<the IRSA role ARN>"

rules:
  sqsReceiveFailing:
    enabled: true
  sqsMessageAge:
    enabled: true
    minutes: 10

networkPolicy:
  # The SQS endpoint through a VPC endpoint's subnet instead of 443 to anywhere.
  allowCloudHTTPS: false
  egress:
    sqs:
      - ipBlock:
          cidr: 10.0.0.0/24
  alertmanagerPeer:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vmalertmanager

mappings:
  - name: guardduty
    match: {"detail-type": "GuardDuty Finding"}
    alert:
      alertname: CloudSecurityFinding
      severity: critical
