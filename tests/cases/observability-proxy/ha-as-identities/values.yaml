# The case `ha` with every principal of `tenancy.principals` rewritten as an
# identity of `tenancy.identities` (docs/tenancy-authz.md has the mapping).
# tests/identities_test.go holds that it renders byte for byte what `ha` does.
# Do not edit by hand: change `ha` and rewrite.
stackReleaseName: observability-stack
ha:
  enabled: true
  peer: {metrics: 'http://vmsingle-replica-victoria-metrics-k8s-stack.observability.svc:8428', logs: 'http://replica-victoria-logs-single-server.observability.svc:9428',
    traces: 'http://replica-vt-single-server.observability.svc:10428'}
vmauth: {replicaCount: 2}
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  allowUnfilteredAlertReads: true
  writers:
  - name: metrics-agent
    tokenSecret: {name: example-writer-token, key: token}
    destinations: [metrics, logs, traces]
  alertReaders:
  - name: status
    tokenSecret: {name: example-alerts-token, key: token}
  identities:
  - groups: ['example:k8s:viewer']
    workload: {vmalertAPI: true}
    reach:
      clusters:
      - {cluster: example-cluster, allNamespaces: true}
victoria-metrics-k8s-stack:
  vmsingle:
    spec:
      podMetadata:
        labels: {observability.pair: observability-metrics}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: {observability.pair: observability-metrics}
victoria-logs-single:
  server:
    podLabels: {observability.pair: observability-logs}
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels: {observability.pair: observability-logs}
    serviceMonitor:
      relabelings:
      - {action: replace, targetLabel: observability_replica, replacement: a}
victoria-traces-single:
  server:
    podLabels: {observability.pair: observability-traces}
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels: {observability.pair: observability-traces}
    serviceMonitor:
      relabelings:
      - {action: replace, targetLabel: observability_replica, replacement: a}
