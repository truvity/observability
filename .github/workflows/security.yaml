name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # Deliberately NOT in ci.yaml's recipe list, and deliberately not a
  # required context. A standard-library advisory with no released fix
  # would otherwise wedge every pull request on a finding nobody can act
  # on.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@5ff46bfd30c34513f84942911f35e1d302036239 # v3.13.1
    with:
      recipes: '["vuln"]'
