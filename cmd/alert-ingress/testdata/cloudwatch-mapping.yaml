# The CloudWatch alarm mapping docs/alert-ingress.md ("CloudWatch alarms")
# shows, kept as a file so the test and the page cannot drift apart.
mappings:
  - name: cloudwatch-alarm
    match: {"AlarmName": "*", "NewStateValue": "*", "AlarmArn": "*"}
    # An alarm sends ONE message per state change, then nothing for as long
    # as the state holds, so the alert must outlive the 1h default; the OK
    # message is what normally ends it.
    resolveAfter: 24h
    alert:
      alertname: '{{ .AlarmName }}'
      severity: '{{ $s := "" }}{{ with .AlarmDescription }}{{ $s = reFind "severity=(critical|warning|info)" . }}{{ end }}{{ or $s "warning" }}'
      resolved: '{{ eq .NewStateValue "OK" }}'
      labels:
        source: cloudwatch
        k8s_cluster_name: cloud-security
        account: '{{ .AWSAccountId }}'
        region: '{{ reFind "^arn:[a-z-]+:cloudwatch:([a-z0-9-]+):" .AlarmArn }}'
      annotations:
        summary: '{{ .AlarmName }} is {{ .NewStateValue }}'
        # The state reason, then the alarm's own description without a
        # trailing `severity=` token (that one is for the severity above).
        description: |-
          {{ .NewStateReason }}{{ with .AlarmDescription }}{{ with reFind "(?s)^\\s*(.*?)\\s*(?:severity=(?:critical|warning|info))?\\s*$" . }}
          {{ . }}{{ end }}{{ end }}
        link: '{{ with reFind "^arn:[a-z-]+:cloudwatch:([a-z0-9-]+):" .AlarmArn }}https://{{ . }}.console.aws.amazon.com/cloudwatch/home?region={{ . }}#alarmsV2:alarm/{{ urlquery $.AlarmName }}{{ end }}'
        link_name: Alarm
        reason: '{{ .NewStateReason }}'
        state: '{{ .NewStateValue }}'
        previous_state: '{{ .OldStateValue }}'
        metric: '{{ with .Trigger }}{{ .Namespace }}/{{ .MetricName }}{{ end }}'
