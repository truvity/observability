# observability-dashboards — dashboards shipped to Grafana as their own
# artifact, because the sidecar that collects them reads the cluster
# Grafana runs on, not the cluster an install lives on. Install this
# chart INTO Grafana's own namespace (`--namespace <grafana's>`); every
# ConfigMap it renders is labelled for that Grafana's sidecar.
#
# Every dashboard here — shipped and extra alike — is held to the same
# six-rule lint docs/dashboards.md defines and `just dashboard-lint`
# runs: a `datasource` variable every panel uses, a `cluster` variable
# chained off it, `$cluster` in the title, and the rest. The rule that
# earns its own comment in the lint's own source: a panel pinned to one
# datasource UID is how a fleet dashboard silently becomes a one-install
# dashboard.

# -- Name overrides for rendered object names.
nameOverride: ""
fullnameOverride: ""

# -- The datasource UIDs this Grafana was provisioned with — a dashboard
# names its datasource by UID, and the estate chose these when it set
# Grafana up (see charts/observability-stack's own `grafana.datasources`,
# whose defaults match). Every shipped dashboard here queries metrics, so
# only `metrics` is required; `logs` and `traces` exist for
# `extraDashboards` that query those stores instead, and the chart never
# reads them itself.
datasources:
  metrics: victoriametrics
  logs: victorialogs
  traces: victoriatraces

# -- Display names for the folders the shipped set files into.
# `fleet` holds the home page (Fleet overview); `kubernetes` the cluster,
# namespace and pod drill-down views; `platform` the platform components
# (ArgoCD, cert-manager, CloudNativePG, NATS, Envoy Gateway, Kargo).
# Infrastructure dashboards are keyed
# by cluster, in one folder: the same components run on every cluster and
# the question is always "which one". Store dashboards are the stack's own
# health. A project's
# `extraDashboards` get their own folder, named on the entry itself —
# see below.
#
# THESE TAKE EFFECT ONLY IF THE GRAFANA THIS INSTALLS BESIDE IS SET UP
# FOR IT. Every ConfigMap here carries a `k8s-sidecar-target-directory`
# annotation naming its folder, but the sidecar ignores that annotation —
# and Grafana ignores the subfolder it would have created — unless that
# Grafana's own chart sets BOTH, by their exact upstream keys:
#
#   sidecar.dashboards.folderAnnotation: k8s-sidecar-target-directory
#   sidecar.dashboards.provider.foldersFromFilesStructure: true
#
# `folderAnnotation` is what makes the sidecar read the annotation at
# all and file the dashboard into a subdirectory on disk; without it the
# annotation is inert. `foldersFromFilesStructure` is what makes
# Grafana's own file provider turn that subdirectory into a folder in
# the UI; without it the sidecar's directory layout is invisible to
# Grafana. Neither alone is enough. As of this chart's first release,
# `charts/observability-stack`'s own `grafana.sidecar.dashboards` block
# sets neither — every dashboard lands in Grafana's default folder until
# that changes, and this chart renders cleanly either way, which is
# exactly why this is written down rather than left to be discovered by
# looking for a dashboard that never showed up where it was filed.
folders:
  fleet: Fleet
  kubernetes: Kubernetes
  infrastructure: Infrastructure
  stores: Observability
  platform: Platform

# -- The dashboard designated as the estate's home page: the name of one
# ENABLED shipped dashboard, or "" for none. The chart annotates that
# dashboard's ConfigMap `observability-dashboards/home: "true"` and refuses
# a name that is not an enabled shipped dashboard. It does not configure
# Grafana; point Grafana at it in one of two ways:
#
#   1. as a file, in Grafana's own chart values
#        grafana.ini:
#          dashboards:
#            default_home_dashboard_path: <sidecar folder>/<folders.fleet>/fleet-overview.json
#      where <sidecar folder> is `sidecar.dashboards.folder` (the chart
#      default is /tmp/dashboards) and the sub-folder is this chart's
#      `folders.<the dashboard's folder key>` value, which the sidecar
#      creates from the ConfigMap's k8s-sidecar-target-directory annotation
#      (see `folders` above for the two settings that needs). The file name
#      is the ConfigMap's data key, `<home>.json`. So with the defaults:
#        /tmp/dashboards/Fleet/fleet-overview.json
#   2. or through Grafana's preferences API / UI (Administration > Default
#      preferences > Home Dashboard), by the dashboard's stable uid,
#      truvity-obs-<home>.
home: fleet-overview

# -- One key per shipped dashboard. `enabled: false` drops it from the
# render; nothing here is required beyond the key existing, so trimming
# the set is a one-line diff per dashboard.
dashboards:
  # The operational views (this order is the hierarchy: home, then the
  # Kubernetes drill-down, cluster -> namespace -> pod). Additive and on
  # by default; every one reads only series a store holds today
  # (hack/dashboards/available-metrics.yaml). The home page links into the
  # Kubernetes views and the store dashboards, so disabling one leaves a
  # link that opens "not found".
  fleet-overview:
    enabled: true
  k8s-views-global:
    enabled: true
  k8s-views-namespaces:
    enabled: true
  k8s-views-pods:
    enabled: true
  # -- OFF by default: it reads node-exporter, which
  # charts/observability-emitters runs only where `nodeExporter.enabled`
  # (off by default), so on a cluster without it every panel is empty. Turn
  # it on together with node-exporter, as `node-exporter-full` below is.
  # It is the Kubernetes drill-down's fourth level: one node's CPU, memory,
  # disk, network and pods.
  k8s-views-nodes:
    enabled: false
  victoriametrics-single:
    enabled: true
  victoriametrics-vmagent:
    enabled: true
  victoriametrics-vmalert:
    enabled: true
  victoriametrics-operator:
    enabled: true
  victorialogs-single:
    enabled: true
  victorialogs-vlagent:
    enabled: true
  victoriatraces-single:
    enabled: true
  alertmanager:
    enabled: true
  node-exporter-full:
    enabled: true
  kubelet:
    enabled: true
  # The platform components. Each reads only series the component's scrape
  # produces (hack/dashboards/available-metrics.yaml), so a component an
  # install does not run leaves its dashboard empty, never wrong; turn it off
  # to drop it. The Fleet overview's platform tiles link to argocd,
  # cert-manager, nats-jetstream, envoy-proxy and cnpg-operator, so
  # disabling one of those leaves a link that opens "not found".
  argocd:
    enabled: true
  cert-manager:
    enabled: true
  cnpg-operator:
    enabled: true
  # -- OFF by default: it reads the CloudNativePG INSTANCE exporter (the
  # :9187 endpoint of each Postgres pod), an optional metric source that is
  # scraped only where the Postgres cluster chart's PodMonitor selects the
  # pods. Without it every panel is empty and the first one says so ("no
  # data: instance metrics not scraped"). Turn it on together with that
  # PodMonitor. The Fleet overview's four Postgres tiles read the same source
  # and show n/a until it is scraped; their link opens this dashboard.
  cnpg-cluster:
    enabled: false
  nats-server:
    enabled: true
  nats-jetstream:
    enabled: true
  envoy-gateway:
    enabled: true
  envoy-proxy:
    enabled: true
  envoy-clusters:
    enabled: true
  kargo:
    enabled: true
  # -- OFF by default: it reads Keycloak's own metrics, an optional source
  # (`keycloak-metrics`) scraped only where truvity/keycloak's chart turns
  # its `serviceMonitor` on (and `metrics.httpHistograms` for the latency
  # panels). Without it every panel is empty and the first says "n/a". Turn
  # it on together with that ServiceMonitor.
  keycloak:
    enabled: false

# -- The estate's own dashboards, held to the same lint as the shipped
# set. Each entry is rendered as its own ConfigMap, unmodified except for
# the sidecar's labels — this chart does not rewrite `extraDashboards`
# the way hack/dashboards.sh rewrites the upstream set, so an entry must
# already carry its own `datasource`/`cluster` variables.
#
#   extraDashboards:
#     - name: example-app
#       folder: Products
#       json: |
#         { "title": "example-app ($cluster)", ... }
#
# `folder` is required: an entry with none renders at the root, mixed in
# beside the shipped set, which is why the chart refuses it rather than
# defaulting one.
extraDashboards: []
