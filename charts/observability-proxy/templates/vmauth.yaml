{{- $observabilityStackEffective := include "observability-proxy.effectiveEnabled" . | fromYaml }}
{{- if $observabilityStackEffective.vmauth }}
{{- /*
The proxy. Every read goes through it, and it is the only thing in the
namespace that may reach a store on a read path.

`userSelector` rather than `selectAllByDefault: true`: with neither a
selector nor that flag the operator treats the VMAuth as UNMANAGED and
generates a configuration with no users at all — a proxy that admits
nobody, installed successfully. With `selectAllByDefault: true` it picks
up every VMUser in the namespace, including ones another release owns.
Naming this release's own label is the only option that means what it
says.
*/}}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: {{ include "observability-proxy.fullname" . }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
spec:
  image:
    repository: {{ .Values.vmauth.image.repository }}
    tag: {{ .Values.vmauth.image.tag }}
  replicaCount: {{ .Values.vmauth.replicaCount }}
  {{- if or (include "observability-proxy.ha.primary" .) (ge (int .Values.vmauth.replicaCount) 2) }}
  {{- /*
  Two or more replicas (`vmauth.replicaCount`; `ha` refuses fewer than
  two): the proxy is the one component every reader and every
  cross-cluster writer goes through, so it must not share a fate with a
  node or a zone. Spread over zones SOFTLY by default -- the proxy is
  stateless and a zone loss must leave a pod schedulable in the surviving
  zone, which a hard constraint with `maxSkew: 1` would refuse -- and a
  PodDisruptionBudget so a node drain takes one at a time. A soft spread
  never makes a node autoscaler add a node in an empty zone, so where the
  proxy's nodes do not already span every zone,
  `vmauth.topologySpread.whenUnsatisfiable: DoNotSchedule` makes it one
  pod per zone (a zone loss then leaves that zone's pod Pending while the
  others serve). Rendered
  whenever there are two or more replicas, `ha` or not; one replica gets
  neither (a budget of `maxUnavailable: 1` on a single pod would not
  protect it, and a spread has nothing to spread).
  */}}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: {{ .Values.vmauth.topologySpread.whenUnsatisfiable }}
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: vmauth
          app.kubernetes.io/instance: {{ include "observability-proxy.fullname" . }}
      {{- /*
      Count only the pods of the CURRENT ReplicaSet: during a rolling update
      the old pods still match the labels above, so new pods were placed
      against zones the old ones were about to leave, and the rollout ended
      with two replicas in one zone and none in another.
      */}}
      matchLabelKeys:
        - pod-template-hash
  podDisruptionBudget:
    maxUnavailable: 1
  {{- end }}
  {{- with .Values.vmauth.service.trafficDistribution }}
  {{- /*
  `useAsDefault: true` makes the operator patch ITS OWN default Service
  with this spec instead of creating a second, additional one, so the
  address everything already uses stays the same and gains the field.
  */}}
  serviceSpec:
    useAsDefault: true
    spec:
      trafficDistribution: {{ . }}
  {{- end }}
  securityContext:
    {{- include "observability-proxy.restrictedSecurityContext" . | nindent 4 }}
  resources:
    {{- include "observability-proxy.resources" .Values.vmauth.resources | nindent 4 }}
  selectAllByDefault: false
  userSelector:
    matchLabels:
      app.kubernetes.io/part-of: observability-stack
      app.kubernetes.io/instance: {{ (include "observability-proxy.release" .) }}
  userNamespaceSelector: {}
  {{- /*
  No unauthorized user, on purpose — and the way to say that is to write
  NOTHING here.

  From v1.147.0 a token that verifies but carries no `vm_access` claim
  falls THROUGH to the unauthorized user rather than being rejected. If
  an unauthorized section exists with any route at all, such a token
  quietly gets the anonymous one instead of a 401 — so there is none, and
  the answer is 401. Every VMUser here also carries a
  `defaultVMAccessClaim`, which is the other half of the same defence.

  An ABSENT `unauthorizedUserAccessSpec` is what produces that, and it is
  the only thing that does. The operator emits the `unauthorized_user`
  section of vmauth's configuration only when this field is set (or the
  deprecated `unauthorizedAccessConfig` is); with neither, its builder
  returns nothing and the key is never written. Nothing defaults the
  field, so absence survives the round trip.

  There is deliberately no `disabled: true` here, and nothing else that
  spells the intent out in the object. The field takes no such switch: the
  operator refuses a section that routes nowhere — `at least one of
  url_map, url_prefix or targetRefs must be defined` — so the only shapes
  it accepts are shapes that SERVE, and a served unauthorized user is the
  bypass above. A key this schema does not have is not an error either: the
  API server prunes it on the way in, the object stores an empty section,
  and the operator then rejects the VMAuth and builds no Deployment at all.
  Both halves of that are invisible in a rendered manifest, which is why
  tests/pruned/ and TestRenderedObjectsSurviveTheCRDs exist.
  */}}
  extraArgs:
    {{- toYaml .Values.vmauth.extraArgs | nindent 4 }}
{{- end }}
