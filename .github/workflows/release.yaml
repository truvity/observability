# Tag-triggered release — the shared implementation.
#
# The caller grants the permissions because a reusable workflow can narrow
# them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse than
# a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@a4784bc59078d44bd746f7eb8a49b4d8a03e66c5 # v3.1.0
    with:
      # Chart-only for now: goreleaser runs with a builds-skip config (it
      # cuts the GitHub release + changelog); the artifacts are the charts,
      # pushed as oci://ghcr.io/truvity/charts/<name>.
      charts: '["observability-crds", "observability-emitters", "observability-stack", "platform-alerts"]'
