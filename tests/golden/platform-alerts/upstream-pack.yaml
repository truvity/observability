apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts-upstream-kubernetes-system
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - name: kubernetes-system
      rules:
      - alert: KubeVersionMismatch
        annotations:
          description: There are {{ $value }} different semantic versions of Kubernetes
            components running on cluster {{ $labels.k8s_cluster_name }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeversionmismatch
          summary: Different semantic versions of Kubernetes components running.
        expr: count(count(label_replace(kubernetes_build_info{job!~"kube-dns|coredns"},
          "git_version", "$1", "git_version", "(v[0-9]*.[0-9]*).*")) by(git_version,k8s_cluster_name))
          by(k8s_cluster_name) > 1
        for: 15m
        labels:
          severity: warning
      - alert: KubeClientErrors
        annotations:
          description: Kubernetes API server client '{{ $labels.job }}/{{ $labels.instance
            }}' is experiencing {{ $value | humanizePercentage }} errors on cluster {{ $labels.k8s_cluster_name
            }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeclienterrors
          summary: Kubernetes API server client is experiencing errors.
        expr: (sum(rate(rest_client_requests_total{job="apiserver",code=~"5.."}[5m])) by(k8s_cluster_name,instance,job,namespace)
          / sum(rate(rest_client_requests_total{job="apiserver"}[5m])) by(k8s_cluster_name,instance,job,namespace))
          > 0.01
        for: 15m
        labels:
          severity: warning

