# expect: but `tenancy.storeClusters` is empty
# Whole-store reach expands to the store's clusters; with none listed it would grant nothing while reading as everything.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: viewers
      groups: [example:viewers]
      reach:
        wholeStore: true

victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
