# expect: is "telegram" and it also sets `channel`
# A Slack channel on a tier that goes to Telegram: read by nothing.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  telegram:
    botTokenSecret:
      name: example-telegram-bot
      key: token
    chatId: -1000000000001
  severities:
    critical:
      receiver: telegram
      channel: '#alerts-critical'
    warning:
      receiver: telegram
