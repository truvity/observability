{{- if .Values.cloudwatchLogs.enabled }}
{{- $full := include "observability-emitters.cloudwatch.fullname" . }}
{{- $config := include "observability-emitters.cloudwatch.config" . }}
{{- $c := .Values.cloudwatchLogs }}
{{- /*
The CloudWatch Logs reader (`cloudwatchLogs`).

A StatefulSet of exactly one replica, for two reasons that are the same
reason as the gateway's shape: the receiver's read position and the
exporters' send queue are on a volume that must outlive the pod, and the
receiver has no leader election, so a second replica would read and write
every event twice. One pod, one volume; a rollout is a gap of seconds that
the saved position closes on the next poll.

No ClusterRole and no Secret access: it reads AWS, not the Kubernetes API,
and the write token is an environment variable exactly as in the gateway.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "observability-emitters.cloudwatch.serviceAccountName" . }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
  {{- with $c.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-headless" $full | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "observability-emitters.cloudwatch.selectorLabels" . | nindent 4 }}
  ports:
    - name: telemetry
      port: 8888
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ printf "%s-headless" $full | trunc 63 | trimSuffix "-" }}
  selector:
    matchLabels:
      {{- include "observability-emitters.cloudwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability-emitters.cloudwatch.labels" . | nindent 8 }}
      annotations:
        observability-emitters/config-checksum: {{ $config | sha256sum }}
    spec:
      serviceAccountName: {{ include "observability-emitters.cloudwatch.serviceAccountName" . }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: {{ printf "%s:%s" $c.image.repository $c.image.tag | quote }}
          {{- with $c.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: telemetry
              containerPort: 8888
              protocol: TCP
          env:
            {{- $writeCredentials := include "observability-emitters.effectiveWriteCredentials" . | fromYaml }}
            - name: OBSERVABILITY_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $writeCredentials.secretName | quote }}
                  key: {{ $writeCredentials.key | quote }}
            {{- $root := . }}
            {{- range $d := (include "observability-emitters.effectiveOtlpDestinations" (dict "root" $root "signal" "logs") | fromYamlArray) }}
            {{- if $d.tokenSecret }}
            - name: {{ include "observability-emitters.otlp.tokenEnv" (dict "signal" "logs" "d" $d) }}
              valueFrom:
                secretKeyRef:
                  name: {{ $d.tokenSecret.name | quote }}
                  key: {{ $d.tokenSecret.key | default "token" | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol
            {{- with (include "observability-emitters.otlp.caVolumeMounts" .) }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $full }}
        {{- with (include "observability-emitters.otlp.caVolumes" .) }}
        {{- . | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
    {{- /* apiVersion and kind spelled out: see the gateway's volumeClaimTemplates. */}}
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: queue
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with $c.queue.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $c.queue.size }}
{{- if $c.podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $full }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
    {{- with $c.podMonitor.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "observability-emitters.cloudwatch.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: telemetry
      path: /metrics
      interval: {{ .Values.interval }}
{{- end }}
{{- end }}
