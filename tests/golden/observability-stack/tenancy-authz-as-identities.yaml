apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-stack-tenancy-authz
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    app.kubernetes.io/component: tenancy-authz
data:
  config.yaml: |
    authz:
      issuerURL: http://observability-stack-tenancy-authz.default.svc:8080
      mintedAudience: vmauth
      personAudiences:
      - example-observability-client
      signingKey:
        file: /etc/tenancy-authz/signing/privateKey
      tokenTTL: 5m
      traceClusters:
      - cluster-a
      - cluster-b
      upstreamIssuer: https://issuer.example
    claimName: groups
    clusterLabel: k8s_cluster_name
    logsClusterField: k8s.cluster.name
    logsNamespaceField: kubernetes.pod_namespace
    namespaceLabel: k8s_namespace_name
    principals:
    - grants:
      - allNamespaces: true
        cluster: cluster-a
      - allNamespaces: true
        cluster: cluster-b
      groups:
      - cluster-a:k8s:viewer
      - cluster-b:k8s:viewer
      name: k8s:viewer
    - grants:
      - cluster: cluster-a
        namespaces:
        - example-app
        - other-app
      group: example:example-app:deployer

