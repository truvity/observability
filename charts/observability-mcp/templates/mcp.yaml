{{- include "observability-mcp.validate" . -}}
{{- range $key := (list "metrics" "logs" "traces" "dashboards") }}
{{- $s := index $.Values.servers $key }}
{{- if $s.enabled }}
{{- $ctx := dict "root" $ "key" $key "s" $s }}
{{- $full := include "observability-mcp.fullname" $ctx }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}
  labels:
    {{- include "observability-mcp.labels" $ctx | nindent 4 }}
# The pod gets the ONE token it needs, projected below with its own
# audience; the default-audience token is never mounted.
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  labels:
    {{- include "observability-mcp.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "observability-mcp.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ include "observability-mcp.proxyPort" $ctx }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  labels:
    {{- include "observability-mcp.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $s.replicaCount }}
  selector:
    matchLabels:
      {{- include "observability-mcp.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability-mcp.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ $full }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The stock server. Loopback only, no container port, no credential:
        # the only thing that can reach it is the proxy next to it.
        - name: upstream
          image: {{ include "observability-mcp.image" $s.image | quote }}
          imagePullPolicy: {{ $s.image.pullPolicy }}
          env:
            {{- include (printf "observability-mcp.upstreamEnv.%s" $key) $ctx | nindent 12 }}
          securityContext:
            runAsUser: {{ $s.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # The resource-proxy. The pod's only port. Its probes are the pod's:
        # the upstream listens on loopback, which the kubelet cannot reach.
        - name: proxy
          image: {{ include "observability-mcp.image" $.Values.proxy.image | quote }}
          imagePullPolicy: {{ $.Values.proxy.image.pullPolicy }}
          env:
            {{- include "observability-mcp.proxyEnv" $ctx | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ include "observability-mcp.proxyPort" $ctx }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            runAsUser: {{ $.Values.proxy.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $.Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/observability-mcp
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ $.Values.serviceAccountToken.audience | quote }}
                  expirationSeconds: {{ $.Values.serviceAccountToken.expirationSeconds }}
                  path: sa-token
{{- if $.Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}
  labels:
    {{- include "observability-mcp.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "observability-mcp.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The gateway, on the proxy's one port.
    - from:
        {{- toYaml $.Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "observability-mcp.proxyPort" $ctx }}
  egress:
    # 1. The issuer: signing keys, and the token exchange.
    - to:
        {{- toYaml $.Values.networkPolicy.egress.issuer | nindent 8 }}
      ports:
        {{- $issuerPorts := uniq (list (include "observability-mcp.urlPort" $.Values.issuerURL) (include "observability-mcp.urlPort" $s.outbound.tokenEndpoint)) }}
        {{- range $p := $issuerPorts }}
        - protocol: TCP
          port: {{ $p }}
        {{- end }}
    # 2. The store's proxy.
    - to:
        {{- toYaml $.Values.networkPolicy.egress.vmauth | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "observability-mcp.urlPort" $s.outbound.target }}
    # 3. Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- if $.Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}
  labels:
    {{- include "observability-mcp.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "observability-mcp.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
