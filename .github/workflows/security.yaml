name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # Deliberately NOT in ci.yaml's recipe list, and deliberately not a
  # required context. A standard-library advisory with no released fix
  # would otherwise wedge every pull request on a finding nobody can act
  # on.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@36c39b754e9a3ab7e6594d19fe9222b66da1586f # v3.12.2
    with:
      recipes: '["vuln"]'
