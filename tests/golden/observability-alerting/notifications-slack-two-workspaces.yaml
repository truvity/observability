# Source: observability-alerting/templates/vmalertmanager.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: observability-stack
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  replicaCount: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: "1"
      memory: 256Mi
  selectAllByDefault: false
  disableSelfServiceScrape: true
  volumes:
    - name: notifications-slack-acme
      secret:
        secretName: "example-acme-slack-bot"
    - name: notifications-slack-globex
      secret:
        secretName: "example-globex-slack-bot"
    - name: notifications-telegram
      secret:
        secretName: "example-telegram-bot"
  volumeMounts:
    - name: notifications-slack-acme
      mountPath: /etc/alertmanager/notifications-slack-acme
      readOnly: true
    - name: notifications-slack-globex
      mountPath: /etc/alertmanager/notifications-slack-globex
      readOnly: true
    - name: notifications-telegram
      mountPath: /etc/alertmanager/notifications-telegram
      readOnly: true
  configRawYaml: |
    route:
      # `notifications-none` is a receiver with no configs: Alertmanager
      # accepts that as a legitimate "do not send" target. It is the root
      # receiver and the catch-all for a severity this chart's routing
      # tree does not know (there is deliberately no `info` route — see
      # docs/notifications.md), never a route somebody forgot to write.
      receiver: notifications-none
      group_by:
        - alertname
        - k8s_cluster_name
        - k8s_namespace_name
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # The Slack delivery self-alert, before everything else and with
        # `continue: false`: it says Slack is not delivering, so it must
        # never be routed to Slack, and no route below may claim it.
        # `notifications.slack.failureReceiver` names where it goes; unset,
        # it goes to the null receiver (docs/notifications.md).
        - receiver: telegram-n1000000000001
          matchers:
            - alertname = "SlackNotificationsFailing"
          continue: false
        # No deadman receiver, and a catch-all that would otherwise take
        # the always-firing heartbeat every repeat_interval.
        - receiver: notifications-none
          matchers:
            - alertname = "Watchdog"
        - match: {}
          receiver: slack-acme--alerts-everything-else
          continue: true
          routes:
            - match:
                k8s_namespace_name: example-partner
              receiver: slack-acme--alerts-everything-else
              routes:
                - match:
                    severity: critical
                  receiver: slack-globex--partner-critical
                - match:
                    severity: warning
                  receiver: slack-acme--alerts
            - match:
                severity: critical
              receiver: slack-acme--alerts-critical
            - match:
                severity: warning
              receiver: slack-acme--alerts
    receivers:
      - name: notifications-none
      - name: slack-acme--alerts
        slack_configs:
          - channel: "#alerts"
            app_token_file: /etc/alertmanager/notifications-slack-acme/token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://grafana.example/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://grafana.example/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ end }}
      - name: slack-acme--alerts-critical
        slack_configs:
          - channel: "#alerts-critical"
            app_token_file: /etc/alertmanager/notifications-slack-acme/token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://grafana.example/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://grafana.example/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ end }}
      - name: slack-acme--alerts-everything-else
        slack_configs:
          - channel: "#alerts-everything-else"
            app_token_file: /etc/alertmanager/notifications-slack-acme/token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://grafana.example/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://grafana.example/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ end }}
      - name: slack-globex--partner-critical
        slack_configs:
          - channel: "#partner-critical"
            app_token_file: /etc/alertmanager/notifications-slack-globex/bot-token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://grafana.example/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://grafana.example/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ end }}
      - name: telegram-n1000000000001
        telegram_configs:
          - bot_token_file: /etc/alertmanager/notifications-telegram/bot-token
            chat_id: -1000000000001
            parse_mode: "HTML"
            send_resolved: true
            message: |-
              <b>{{ .Status | toUpper }}</b> {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}
              {{ range .Alerts }}
              {{ .Annotations.summary }}
              Grafana: https://grafana.example/?var-cluster={{ .Labels.k8s_cluster_name }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name }}{{ end }}
              {{ end }}
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
          - k8s_cluster_name =~ ".+"
          - k8s_namespace_name =~ ".+"
        target_matchers:
          - severity = "warning"
        equal:
          - k8s_cluster_name
          - k8s_namespace_name

