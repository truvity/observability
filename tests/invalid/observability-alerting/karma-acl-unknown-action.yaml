# expect: karma knows allow, block and requireMatcher
# An ACL action karma does not know.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
karma:
  enabled: true
  authentication:
    header:
      name: X-Auth-Request-Email
  acl:
    silences:
    - action: permit
      reason: nope
