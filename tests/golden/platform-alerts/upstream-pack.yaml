          * on(k8s_cluster_name,namespace,job_name) group_left() group(kube_job_owner{job="kube-state-metrics",owner_kind=~"Pod|"})
          by(k8s_cluster_name,namespace,job_name), "workload", "", "owner_name")) by(k8s_cluster_name,namespace,workload,pod)
        labels:
