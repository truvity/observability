# expect: is in tenancy.identities[1] ("other") and also in tenancy.identities[0] ("viewers")
# The same group written under two entries: the second could never be selected.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: viewers
      groups: [example:viewers]
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]
    - name: other
      groups: [example:viewers]
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [other-app]

victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
