# Source: observability-stack/charts/victoria-logs-single/templates/server.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: observability-stack-victoria-logs-single-server
  namespace: observability
  labels: 
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-logs-single
    app.kubernetes.io/version: v1.52.0
    helm.sh/chart: victoria-logs-single-0.13.9
spec:
  podManagementPolicy: OrderedReady
  updateStrategy: {}
  replicas: 1
  serviceName: observability-stack-victoria-logs-single-server
  selector:
    matchLabels: 
      app: server
      app.kubernetes.io/instance: observability-stack
      app.kubernetes.io/name: victoria-logs-single
  template:
    metadata:
      labels: 
        app: server
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: observability-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-logs-single
        observability.pair: observability-logs
    spec:
      securityContext: 
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vlogs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: victoriametrics/victoria-logs:v1.52.0
          imagePullPolicy: IfNotPresent
          args: 
            - --envflag.enable
            - --envflag.prefix=VM_
            - --http.shutdownDelay=15s
            - --httpListenAddr=:9428
            - --loggerFormat=json
            - --retention.maxDiskUsagePercent=80
            - --retentionPeriod=90d
            - --storage.minFreeDiskSpaceBytes=10GiB
            - --storageDataPath=/storage
          env: 
            - name: VM_httpAuth_username
              valueFrom:
                secretKeyRef:
                  key: username
                  name: observability-store-credentials
            - name: VM_httpAuth_password
              valueFrom:
                secretKeyRef:
                  key: password
                  name: observability-store-credentials
          ports:
            - name: http
              containerPort: 9428
          readinessProbe: 
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe: 
            failureThreshold: 10
            initialDelaySeconds: 30
            periodSeconds: 30
            tcpSocket:
              port: http
            timeoutSeconds: 5
          resources: 
            limits:
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 4Gi
          volumeMounts:
            - name: server-volume
              mountPath: /storage
            
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              observability.pair: observability-logs
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
      terminationGracePeriodSeconds: 60
      volumes:
        
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: server-volume
      spec:
        accessModes: 
          - ReadWriteOnce
        resources:
          requests:
            storage: 200Gi

