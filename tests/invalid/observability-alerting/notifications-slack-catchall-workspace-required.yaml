# expect: notifications.catchAll sends to Slack without a `workspace`
# The catch-all is a Slack destination like any other: with two
# workspaces declared it must name one.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-acme-slack-bot
        key: token
    - name: globex
      appTokenSecret:
        name: example-globex-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
      workspace: acme
    warning:
      receiver: slack
      channel: '#alerts'
      workspace: acme
  catchAll:
    receiver: slack
    channel: '#alerts-everything-else'
