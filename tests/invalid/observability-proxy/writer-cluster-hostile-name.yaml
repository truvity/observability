# expect: at '/tenancy/writers/0/cluster'
# `cluster` is interpolated into the write-side query argument the same
# way a reader's grant is interpolated into a read-side filter, so it is
# held to the same plain-name shape at the schema, before any template
# ever runs.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  writers:
  - name: hostile
    tokenSecret:
      name: example-writer-token
      key: token
    destinations:
    - metrics
    cluster: stage|prod
