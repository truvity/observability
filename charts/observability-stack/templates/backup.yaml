{{- if .Values.backup.enabled }}
{{- $root := . }}
{{- $fullname := include "observability-stack.fullname" . }}
{{- $authMode := .Values.backup.auth.mode | default "secret" }}
{{- $saName := .Values.backup.auth.serviceAccount.name | default (printf "%s-backup" $fullname | trunc 63) }}
{{- $ambientOrProcess := ne $authMode "secret" }}
{{- if not .Values.backup.destination }}
{{- fail "observability-stack: `backup.enabled` is true but `backup.destination` is empty. A backup job with no destination runs, finds nothing to do and exits zero — the exact shape of failure this repository exists to catch." }}
{{- end }}
{{- if and .Values.backup.sseKmsKeyId (ne (.Values.backup.serverSideEncryption | default "") "aws:kms") }}
{{- fail "observability-stack: `backup.sseKmsKeyId` is set but `backup.serverSideEncryption` is not `aws:kms`. A KMS key id means nothing to any other encryption mode, and rclone would silently ignore it; set `backup.serverSideEncryption: aws:kms` or drop the key id." }}
{{- end }}
{{- if eq $authMode "secret" }}
{{- if not .Values.backup.credentialsSecret }}
{{- fail "observability-stack: `backup.enabled` is true but `backup.credentialsSecret` is empty. The object store's credentials are the estate's; this chart takes the NAME of a Secret and never a value. Set `backup.auth.mode: ambient` or `credentialProcess` for a backup with no static key at all." }}
{{- end }}
{{- else if .Values.backup.credentialsSecret }}
{{- fail (printf "observability-stack: `backup.auth.mode` is %q but `backup.credentialsSecret` is also set. `ambient` and `credentialProcess` exist so no long-lived object-store key is ever mounted into a backup job; leave `credentialsSecret` empty, or set `backup.auth.mode: secret` to use it." $authMode) }}
{{- end }}
{{- if eq $authMode "credentialProcess" }}
{{- if not .Values.backup.auth.credentialProcess.command }}
{{- fail "observability-stack: `backup.auth.mode` is `credentialProcess` but `backup.auth.credentialProcess.command` is empty. This is the command vmbackup's AWS SDK runs to obtain temporary credentials — a credential-broker CLI, typically — and with nothing to run there is nothing to authenticate with." }}
{{- end }}
{{- if or (not .Values.backup.auth.credentialProcess.toolsImage.repository) (not .Values.backup.auth.credentialProcess.toolsImage.tag) }}
{{- fail "observability-stack: `backup.auth.mode` is `credentialProcess` but `backup.auth.credentialProcess.toolsImage.repository`/`.tag` is empty. vmbackup's own image is minimal and may have no shell or package manager, so `command`'s binary has to come from somewhere else — this is the image an initContainer copies it out of." }}
{{- end }}
{{- if or .Values.backup.logs.enabled .Values.backup.traces.enabled }}
{{- fail "observability-stack: `backup.auth.mode` is `credentialProcess` but `backup.logs.enabled` or `backup.traces.enabled` is also true. The AWS config file and the tools volume this mode renders are wired into the metrics job's vmbackup container only — the log and trace jobs run rclone against `backup.credentialsSecret`/ambient credentials instead, and `credentialProcess` gives them neither. Turn both off explicitly, or pick `secret`/`ambient` instead." }}
{{- end }}
{{- end }}
{{- /*
Per-store ServiceAccounts (0.10.0): `backup.<store>.serviceAccount`,
for an estate that gives each store's backup its own least-privilege
role (IRSA or EKS Pod Identity, both keyed on the ServiceAccount). A
store is on its own SA when `create` is true or `name` is set; every
other store stays on the release-wide `$saName`, so a values file that
sets none of this renders exactly as before.

`$storeSA` maps each ENABLED store to the SA its pods run as;
`$storeSACreate` maps the ones this chart renders to their annotations.
The release-wide SA is still rendered while any enabled store uses it,
or when no store overrides at all (today's render); once every enabled
store has its own, it would carry a role nothing assumes, and is not.
*/}}
{{- $storeSA := dict }}
{{- $storeSACreate := dict }}
{{- $usesShared := false }}
{{- $anyOverride := false }}
{{- range $store := list "metrics" "logs" "traces" }}
{{- $cfg := index $root.Values.backup $store }}
{{- $sa := $cfg.serviceAccount | default dict }}
{{- $own := or $sa.create $sa.name }}
{{- if and $own (not $ambientOrProcess) }}
{{- fail (printf "observability-stack: `backup.%s.serviceAccount` is set but `backup.auth.mode` is `secret`. Under `secret` no backup pod runs as a chosen ServiceAccount at all — the credentials come from `backup.credentialsSecret` — so a per-store ServiceAccount would be rendered for nothing to assume. Set `backup.auth.mode: ambient`, or remove it." $store) }}
{{- end }}
{{- if and (not $sa.create) (not $sa.name) $sa.annotations }}
{{- fail (printf "observability-stack: `backup.%s.serviceAccount.annotations` is set but neither `create` nor `name` is. Annotations only reach a ServiceAccount this chart renders: set `create: true` to render `<fullname>-backup-%s` with them, or put them on `backup.auth.serviceAccount` if this store should keep sharing the release-wide one." $store $store) }}
{{- end }}
{{- if and (not $sa.create) $sa.name $sa.annotations }}
{{- fail (printf "observability-stack: `backup.%s.serviceAccount` names an existing ServiceAccount (`create: false`) and also sets `annotations`. This chart does not render that ServiceAccount, so the annotations would be read by nothing; put them on the ServiceAccount itself, or set `create: true`." $store) }}
{{- end }}
{{- if $cfg.enabled }}
{{- if $own }}
{{- $anyOverride = true }}
{{- $name := $sa.name | default (printf "%s-backup-%s" $fullname $store | trunc 63) }}
{{- $_ := set $storeSA $store $name }}
{{- if $sa.create }}
{{- if hasKey $storeSACreate $name }}
{{- fail (printf "observability-stack: two backup stores both `create` a ServiceAccount named %q. One name is one object; set `create: true` on one store and point the other at it with `name` and `create: false`, or give each its own name." $name) }}
{{- end }}
{{- $_ := set $storeSACreate $name ($sa.annotations | default dict) }}
{{- end }}
{{- else }}
{{- $usesShared = true }}
{{- $_ := set $storeSA $store $saName }}
{{- end }}
{{- end }}
{{- end }}
{{- $renderShared := and $ambientOrProcess (or $usesShared (not $anyOverride)) }}
{{- if and $renderShared (hasKey $storeSACreate $saName) }}
{{- fail (printf "observability-stack: a backup store's `serviceAccount` creates %q, which is also the release-wide backup ServiceAccount (`backup.auth.serviceAccount.name`, or its derived default). One name is one object; give the store's its own name, or drop `create` and let the store share the release-wide one." $saName) }}
{{- end }}
{{- /*
Backups. Three stores, three mechanisms, and they are not
interchangeable.

Every job here refuses an EMPTY SOURCE before it copies anything. That
is the rule the whole file exists for: `rclone sync` from an empty source
deletes the destination and exits zero, so a backup that finds nothing
reports success and destroys the copy you had. A job that cannot find its
data must fail loudly, and loudly means a non-zero exit that
`charts/platform-alerts`' CronJobNotSucceeding can see.

All three mount the store's own volume. That is not an implementation
detail to work around: vmbackup reads the snapshot from the filesystem,
and a snapshot of a log or trace partition is a directory of hardlinks
inside the data directory. A ReadWriteOnce volume can only be mounted by
pods on ONE node, so each job carries a pod affinity onto its store's
node. Without it the job stays Pending, which the same alert sees.

Authentication (`backup.auth.mode`) is the fourth axis, orthogonal to
which store: `secret` (default) envFrom's `backup.credentialsSecret`
into every job unconditionally, same as always. `ambient` and
`credentialProcess` both suppress that envFrom and instead run every
job's pod as a ServiceAccount (`$saName`, or the store's own from
`backup.<store>.serviceAccount`, see above) — `ambient` stops there, and
leaves the object store's own AWS SDK to resolve ambient credentials
(EKS Pod Identity or IRSA); `credentialProcess` (metrics only — see the
refusal above) additionally renders an AWS config file, a tools
emptyDir and an initContainer to populate it, and an optional projected
ServiceAccount token, all wired into the vmbackup container specifically.
*/}}
{{- if $renderShared }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName | quote }}
  labels:
    {{- include "observability-stack.labels" $root | nindent 4 }}
  {{- with .Values.backup.auth.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- $renderedSA := dict }}
{{- range $store := list "metrics" "logs" "traces" }}
{{- $name := index $storeSA $store | default "" }}
{{- $cfgSA := (index $root.Values.backup $store).serviceAccount | default dict }}
{{- if and $name $cfgSA.create (not (hasKey $renderedSA $name)) }}
{{- $_ := set $renderedSA $name true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "observability-stack.labels" $root | nindent 4 }}
    observability.backup: {{ $store }}
  {{- with index $storeSACreate $name }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- if eq $authMode "credentialProcess" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-backup-aws-config" $fullname | trunc 63 }}
  labels:
    {{- include "observability-stack.labels" $root | nindent 4 }}
data:
  # vmbackup's AWS SDK loads this via `AWS_CONFIG_FILE` (set on the
  # container below) whether or not a profile is named, the same as the
  # AWS CLI's own config file — no `-configFilePath` flag needed. See
  # docs/reference.md, "`backup.auth`", for the SDK source this is
  # confirmed against.
  config: |
    [default]
    credential_process = {{ .Values.backup.auth.credentialProcess.command }}
{{- end }}
{{- $affinity := dict }}
{{- if .Values.backup.metrics.enabled }}
{{- range $variant := list "incremental" "full" }}
{{- $full := eq $variant "full" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-backup-metrics-%s" $fullname $variant | trunc 52 }}
  labels:
    {{- include "observability-stack.labels" $root | nindent 4 }}
    observability.backup: metrics
spec:
  schedule: {{ ternary $root.Values.backup.metrics.fullSchedule $root.Values.backup.metrics.schedule $full | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $root.Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $root.Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $root.Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "observability-stack.labels" $root | nindent 12 }}
            observability.backup: metrics
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
            {{- if $root.Values.backup.seLinuxLevel }}
            # Same MCS categories as the store this job reads a snapshot
            # from — see `backup.seLinuxLevel`'s own doc comment in
            # values.yaml. A mismatch here is a "permission denied" reading
            # a snapshot that vmbackup/rclone already proved it could
            # create.
            seLinuxOptions:
              level: {{ $root.Values.backup.seLinuxLevel | quote }}
            {{- end }}
          {{- if $ambientOrProcess }}
          serviceAccountName: {{ index $storeSA "metrics" | quote }}
          {{- end }}
          {{- if $root.Values.backup.affinity }}
          affinity:
            {{- merge (dict "podAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "vmsingle" "app.kubernetes.io/instance" (include "observability-stack.vmks.fullname" $root))))))) $root.Values.backup.affinity | toYaml | nindent 12 }}
          {{- else }}
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: vmsingle
                      app.kubernetes.io/instance: {{ include "observability-stack.vmks.fullname" $root }}
          {{- end }}
          {{- with $root.Values.backup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.backup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq $authMode "credentialProcess" }}
          initContainers:
            - name: backup-tools
              image: {{ printf "%s:%s" $root.Values.backup.auth.credentialProcess.toolsImage.repository $root.Values.backup.auth.credentialProcess.toolsImage.tag | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -euc
                - |
                  mkdir -p /var/run/backup-tools
                  # -R, not -a: the copy runs as a non-root user, which cannot preserve ownership.
                  cp -R {{ $root.Values.backup.auth.credentialProcess.toolsImage.sourcePath }}/. /var/run/backup-tools/
              volumeMounts:
                - name: backup-tools
                  mountPath: /var/run/backup-tools
          {{- end }}
          containers:
            - name: vmbackup
              image: {{ printf "%s:%s" $root.Values.backup.metrics.image.repository $root.Values.backup.metrics.image.tag | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              args:
                # vmbackup takes an instant snapshot through the store's
                # own API and uploads it. It is incremental BY
                # CONSTRUCTION: a destination that already holds a backup
                # gets only what changed, and there is no flag for it.
                - -storageDataPath=/vm-data
                - -snapshot.createURL=$(SNAPSHOT_CREATE_URL)
                {{- if $root.Values.backup.metrics.s3CustomEndpoint }}
                - -customS3Endpoint={{ $root.Values.backup.metrics.s3CustomEndpoint }}
                {{- end }}
                {{- if ne $root.Values.backup.metrics.s3ForcePathStyle "" }}
                - -s3ForcePathStyle={{ $root.Values.backup.metrics.s3ForcePathStyle }}
                {{- end }}
                {{- if $full }}
                # The weekly full names the existing backup as `-origin`,
                # so everything unchanged is copied INSIDE the object
                # store rather than pulled down and pushed back up. It is
                # the same backup either way; this is what it costs.
                - -origin={{ $root.Values.backup.destination }}/{{ $root.Values.backup.metrics.prefix }}
                - -dst={{ $root.Values.backup.destination }}/{{ $root.Values.backup.metrics.fullPrefix }}
                {{- else }}
                - -dst={{ $root.Values.backup.destination }}/{{ $root.Values.backup.metrics.prefix }}
                {{- end }}
              env:
                - name: VM_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.storeCredentials.secretName | quote }}
                      key: {{ $root.Values.storeCredentials.usernameKey | quote }}
                - name: VM_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.storeCredentials.secretName | quote }}
                      key: {{ $root.Values.storeCredentials.passwordKey | quote }}
                # The snapshot endpoint is behind the store's own
                # `-httpAuth.*`, and deliberately not behind a
                # `-snapshotAuthKey`: an authKey REPLACES basic auth for
                # that endpoint rather than adding to it, and it travels
                # in the query string.
                - name: SNAPSHOT_CREATE_URL
                  value: {{ printf "http://$(VM_USERNAME):$(VM_PASSWORD)@%s/snapshot/create" (trimPrefix "http://" (include "observability-stack.metrics.url" $root)) | quote }}
                {{- if eq $authMode "credentialProcess" }}
                - name: AWS_CONFIG_FILE
                  value: /etc/aws/config
                - name: AWS_SDK_LOAD_CONFIG
                  value: "true"
                {{- end }}
              {{- if eq $authMode "secret" }}
              envFrom:
                - secretRef:
                    name: {{ $root.Values.backup.credentialsSecret | quote }}
              {{- end }}
              {{- with $root.Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: store
                  mountPath: /vm-data
                  readOnly: true
                {{- if eq $authMode "credentialProcess" }}
                - name: backup-tools
                  mountPath: /var/run/backup-tools
                  readOnly: true
                - name: aws-config
                  mountPath: /etc/aws
                  readOnly: true
                {{- with $root.Values.backup.auth.credentialProcess.serviceAccountToken }}
                {{- if .audience }}
                - name: backup-token
                  mountPath: /var/run/backup-token
                  readOnly: true
                {{- end }}
                {{- end }}
                {{- end }}
          volumes:
            - name: store
              persistentVolumeClaim:
                claimName: {{ $root.Values.backup.metrics.claimName | default (printf "vmsingle-%s" (include "observability-stack.vmks.fullname" $root)) | quote }}
                readOnly: true
            {{- if eq $authMode "credentialProcess" }}
            - name: backup-tools
              emptyDir: {}
            - name: aws-config
              configMap:
                name: {{ printf "%s-backup-aws-config" $fullname | trunc 63 }}
            {{- with $root.Values.backup.auth.credentialProcess.serviceAccountToken }}
            {{- if .audience }}
            - name: backup-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: {{ .audience | quote }}
                      path: {{ .path | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
{{- end }}
{{- end }}
{{- range $store := list "logs" "traces" }}
{{- $cfg := index $root.Values.backup $store }}
{{- if $cfg.enabled }}
{{- $isLogs := eq $store "logs" }}
{{- $url := ternary (include "observability-stack.logs.url" $root) (include "observability-stack.traces.url" $root) $isLogs }}
{{- $sts := ternary (include "observability-stack.logs.fullname" $root) (include "observability-stack.traces.fullname" $root) $isLogs }}
{{- $name := ternary (default "victoria-logs-single" ((index $root.Values "victoria-logs-single").nameOverride)) (default "vt-single" ((index $root.Values "victoria-traces-single").nameOverride)) $isLogs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-backup-%s" $fullname $store | trunc 52 }}
  labels:
    {{- include "observability-stack.labels" $root | nindent 4 }}
    observability.backup: {{ $store }}
spec:
  schedule: {{ $cfg.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $root.Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $root.Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $root.Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "observability-stack.labels" $root | nindent 12 }}
            observability.backup: {{ $store }}
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
            {{- if $root.Values.backup.seLinuxLevel }}
            # Same MCS categories as the store this job reads a snapshot
            # from — see `backup.seLinuxLevel`'s own doc comment in
            # values.yaml.
            seLinuxOptions:
              level: {{ $root.Values.backup.seLinuxLevel | quote }}
            {{- end }}
          {{- if $ambientOrProcess }}
          serviceAccountName: {{ index $storeSA $store | quote }}
          {{- end }}
          {{- if $root.Values.backup.affinity }}
          affinity:
            {{- merge (dict "podAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" (dict "app" "server" "app.kubernetes.io/name" $name "app.kubernetes.io/instance" $root.Release.Name)))))) $root.Values.backup.affinity | toYaml | nindent 12 }}
          {{- else }}
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: server
                      app.kubernetes.io/name: {{ $name }}
                      app.kubernetes.io/instance: {{ $root.Release.Name }}
          {{- end }}
          {{- with $root.Values.backup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.backup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: {{ printf "%s:%s" $root.Values.backup.image.repository $root.Values.backup.image.tag | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: STORE_URL
                  value: {{ $url | quote }}
                - name: DESTINATION
                  value: {{ printf "%s/%s" (include "observability-stack.backup.rcloneDestination" $root.Values.backup.destination) (index $root.Values.backup $store).prefix | quote }}
                {{- with $root.Values.backup.serverSideEncryption }}
                # rclone reads these as its S3 backend options. With
                # `aws:kms` it knows the ETag is not an MD5 and verifies
                # `--checksum` against the MD5 it stores in the object's
                # metadata, so the check stays on (see values.yaml).
                - name: RCLONE_S3_SERVER_SIDE_ENCRYPTION
                  value: {{ . | quote }}
                {{- end }}
                {{- with $root.Values.backup.sseKmsKeyId }}
                - name: RCLONE_S3_SSE_KMS_KEY_ID
                  value: {{ . | quote }}
                {{- end }}
                - name: VM_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.storeCredentials.secretName | quote }}
                      key: {{ $root.Values.storeCredentials.usernameKey | quote }}
                - name: VM_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.storeCredentials.secretName | quote }}
                      key: {{ $root.Values.storeCredentials.passwordKey | quote }}
              {{- if eq $authMode "secret" }}
              envFrom:
                - secretRef:
                    name: {{ $root.Values.backup.credentialsSecret | quote }}
              {{- end }}
              {{- with $root.Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: store
                  mountPath: /storage
                  readOnly: true
              command:
                - /bin/sh
                - -euc
                - |
                  {{- if $isLogs }}
                  # The log store's partitions are per-day directories.
                  # A snapshot is a directory of HARDLINKS inside the data
                  # directory: cheap to make, and it pins every part it
                  # references, so one left behind grows the store's disk
                  # usage with nothing pointing at why. The binary expires
                  # them after -snapshotsMaxAge (3 days), which is a
                  # backstop, not a plan — this job deletes its own.
                  #
                  # `backup.image` is busybox's wget (see its own doc
                  # comment), which has no `--user`/`--password` at all —
                  # confirmed against the pinned rclone/rclone:1.73.0,
                  # 2026-09-29: it rejects them outright
                  # ("unrecognized option"), so store auth being ON (it
                  # is mandatory) failed this job before it ever reached
                  # rclone. `--header` IS one of the handful of long
                  # options busybox wget implements, so basic auth is
                  # built by hand instead: RFC 7617's own construction,
                  # base64 of `user:pass`, on the SAME header a real
                  # client would send. `base64 -w0` (also busybox, also
                  # confirmed against this image) disables the 76-column
                  # line wrap coreutils' `base64` defaults to — a
                  # wrapped value breaks the header the moment a
                  # generated credential is longer than one line's worth.
                  auth="Authorization: Basic $(printf '%s:%s' "$VM_USERNAME" "$VM_PASSWORD" | base64 -w0)"
                  created=$(wget -q -O- --header="$auth" --post-data='' \
                    "$STORE_URL/internal/partition/snapshot/create")
                  echo "snapshots: $created"
                  # REFUSE AN EMPTY SOURCE. A store with no partitions is
                  # a store with no data, and `rclone sync` from an empty
                  # source DELETES the destination and exits zero.
                  case "$created" in
                    ''|'[]') echo "no snapshot was created: the store has no partitions, or the API refused" >&2; exit 1 ;;
                  esac
                  for path in $(echo "$created" | tr -d '[]"' | tr ',' ' '); do
                    test -d "$path" || { echo "snapshot $path is not on this volume" >&2; exit 1; }
                    test -n "$(ls -A "$path")" || { echo "snapshot $path is empty" >&2; exit 1; }
                    rclone sync "$path" "$DESTINATION/$(basename "$path")" --checksum
                    wget -q -O- --header="$auth" --post-data='' \
                      "$STORE_URL/internal/partition/snapshot/delete?path=$path"
                  done
                  {{- else }}
                  # The trace store has no snapshot API this chart will
                  # rely on, so the vendor's documented procedure it is:
                  # sync, detach, sync, attach. The second pass exists
                  # because the data files are immutable but the small
                  # metadata files beside them are not, and the first pass
                  # takes long enough for them to change.
                  #
                  # See the logs branch above for why this is a `--header`
                  # basic-auth value and not `--user`/`--password`:
                  # busybox wget (this image) has no such flags.
                  auth="Authorization: Basic $(printf '%s:%s' "$VM_USERNAME" "$VM_PASSWORD" | base64 -w0)"
                  test -d /storage/partitions || { echo "no partitions directory: this is not a trace store's volume" >&2; exit 1; }
                  # REFUSE AN EMPTY SOURCE, before anything is deleted at
                  # the destination.
                  test -n "$(ls -A /storage/partitions)" || { echo "the trace store has no partitions; refusing to sync an empty source over the backup" >&2; exit 1; }
                  rclone sync /storage/partitions "$DESTINATION" --checksum
                  for p in $(ls /storage/partitions); do
                    wget -q -O- --header="$auth" --post-data='' "$STORE_URL/internal/partition/detach?name=$p"
                  done
                  rclone sync /storage/partitions "$DESTINATION" --checksum
                  for p in $(ls /storage/partitions); do
                    wget -q -O- --header="$auth" --post-data='' "$STORE_URL/internal/partition/attach?name=$p"
                  done
                  {{- end }}
          volumes:
            - name: store
              persistentVolumeClaim:
                claimName: {{ printf "server-volume-%s-0" $sts | quote }}
                readOnly: true
{{- end }}
{{- end }}
{{- end }}
