# expect: carries no `labeldrop` of `k8s_namespace_name` before it
# With only the replace step and no leading labeldrop, a cluster-scoped
# series with no namespace label (nodes, among the enabled collectors)
# keeps the scrape class's target-level stamp -- this release's own
# namespace -- instead of carrying none at all.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  prometheus:
    monitor:
      http:
        metricRelabelings:
        - sourceLabels: [namespace]
          regex: (.+)
          targetLabel: k8s_namespace_name
