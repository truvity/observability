# expect: carries a user name or password
# notifications.ownerFill refused: see templates/_validate.tpl `validate.ownerFill`.
stackReleaseName: observability-stack
tenancy: {}
alertmanager:
  notifierUrl: "http://user:pw@alertmanager.example:9093"
notifications:
  ownerLabel: owner
  ownerFill:
    enabled: true
    default: platform
  slack:
    workspaces:
      - name: acme
        appTokenSecret: {name: example-acme-slack-bot, key: token}
  severities:
    critical: {receiver: slack, channel: "#a"}
    warning: {receiver: slack, channel: "#a"}
  externalUrl: https://grafana.example
