# expect: `backup.metrics.serviceAccount.annotations` is set but neither `create` nor `name` is
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# Annotations on a per-store ServiceAccount the chart is not asked to
# render: the role they name would be assumed by nothing, and the store
# would silently keep the shared role.
backup:
  enabled: true
  destination: s3://example-backups/observability
  auth:
    mode: ambient
  metrics:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "<placeholder>"

notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
