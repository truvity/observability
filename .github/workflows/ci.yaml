# CI calls the shared workflow (truvity/ci-workflows), which fans the
# Justfile recipes out into PARALLEL jobs — one per recipe, each reporting
# under its own name. The recipe list is this repository's own `check`
# recipe plus `apply`, so CI and a laptop run the same thing except for the
# one job that needs a container runtime: `apply` stands up a kind cluster
# and requires a real API server to accept every golden. It is a CI job
# rather than part of `check` because `check` must stay runnable in seconds
# on a laptop, and a job rather than nothing because the two defects it
# generalises both reached a cluster before anything here noticed.
#
# Pinned by COMMIT SHA, never by tag or branch: tags move, and every
# repository in both organizations runs that code.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@a4784bc59078d44bd746f7eb8a49b4d8a03e66c5 # v3.1.0
    with:
      recipes: '["lint", "test", "leak-canary", "apply"]'

  # Stable name for branch protection: the matrix reports as
  # "recipes / lint" and so on, so a required context naming them would
  # break the moment a recipe is added or renamed.
  check:
    needs: recipes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.recipes.result }}" = "success" ]'
