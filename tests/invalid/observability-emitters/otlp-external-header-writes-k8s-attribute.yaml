# expect: Everything under `k8s.` / `kubernetes.` is the scoping key
# A header that could set k8s.namespace.name files a caller's data under another namespace.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
otlp:
  external:
    enabled: true
    headers:
      x-roster-subject: enduser.id
      x-roster-namespace: k8s.namespace.name
    networkPolicy:
      ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: example-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
    streamFields:
    - kubernetes.container_name
    - kubernetes.pod_name
    - kubernetes.pod_namespace
    - k8s.cluster.name
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
