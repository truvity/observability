# The case `everything` with every principal of `tenancy.principals` rewritten as an
# identity of `tenancy.identities` (docs/tenancy-authz.md has the mapping).
# tests/identities_test.go holds that it renders byte for byte what `everything` does.
# Do not edit by hand: change `everything` and rewrite.
global:
  cluster: {dnsDomain: cluster.example.}
nameOverride: stack
ha: true
zones: [example-1a, example-1b]
interval: 15s
vmauth:
  image: {repository: victoriametrics/vmauth, tag: v1.153.0}
  replicaCount: 2
  resources:
    requests: {cpu: '2', memory: 1Gi}
    limits: {cpu: '2', memory: 1Gi}
  extraArgs: {logInvalidAuthTokens: 'true', maxConcurrentRequests: '500'}
  loadBalancingPolicy: first_available
  retryStatusCodes: [500, 502, 503]
tenancy:
  issuerUrl: https://issuer.example
  audience: example-client.example@example-project
  claimName: entitlements
  allowUnfilteredMetricMetadata: true
  clusterLabel: cell
  namespaceLabel: ns
  logsClusterField: k8s.cell
  logsNamespaceField: kubernetes.namespace_name
  writers:
  - name: otel-collector
    tokenSecret: {name: example-writer-token, key: token}
    destinations: [metrics, logs, traces]
  allowUnfilteredAlertReads: true
  alertReaders:
  - name: statusbox
    tokenSecret: {name: example-alerts-read-token, key: token}
  identities:
  - groups: [example.k8s.viewers]
    reach:
      clusters:
      - cluster: other-cluster
        namespaces: [example-app, other-app]
      - {cluster: example-cluster, allNamespaces: true}
storeCredentials: {secretName: example-store-credentials, usernameKey: user, passwordKey: pass}
vmalert:
  externalUrl: https://alerts.example.com
  externalLabels: {cluster: example}
  logs: {enabled: true}
  resources:
    requests: {cpu: '2', memory: 1Gi}
    limits: {cpu: '2', memory: 1Gi}
alertmanager:
  replicaCount: 2
  watchdog: {secretName: example-watchdog-receiver, key: url, repeatInterval: 2m, timeout: 10m}
  resources:
    requests: {cpu: '2', memory: 512Mi}
    limits: {cpu: '2', memory: 512Mi}
notifications:
  externalUrl: https://alerts.example.com
  runbookBaseUrl: https://runbooks.example/
  groupWait: 10s
  groupInterval: 2m
  repeatInterval: 2h
  slack:
    workspaces:
    - name: acme
      appTokenSecret: {name: example-slack-bot, key: token}
  webhook:
  - name: status-page
    urlSecret: {name: example-status-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: '#alerts-critical'}
    warning: {receiver: slack, channel: '#alerts'}
  routes:
  - match: {k8s_cluster_name: example-cluster}
    critical: '#alerts-example-cluster'
    warning: '#alerts-example-cluster'
  - match: {k8s_namespace_name: example-app}
    critical: '#example-app'
  also:
  - receiver: status-page
    match: {severity: critical, customer_facing: 'true'}
networkPolicy:
  enabled: true
  proxyFrom:
  - namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: example-console}
  writersFrom:
  - namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: example-collectors}
backup:
  enabled: true
  destination: s3://example-backups/observability
  credentialsSecret: example-backup-credentials
  activeDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  image: {repository: example.com/mirror/rclone, tag: 1.73.0}
  metrics:
    enabled: true
    schedule: 0 * * * *
    fullSchedule: 0 2 * * 0
    claimName: example-metrics-claim
    image: {repository: example.com/mirror/vmbackup, tag: v1.152.0}
  logs: {enabled: true, schedule: 20 * * * *}
  traces: {enabled: true, schedule: 40 * * * *}
selfAlerts:
  enabled: true
  ingest: {metric: example_vm_rows_ignored_total, window: 2m, for: 2m, severity: critical}
  cardinality: {hourlyCurrentSeriesMetric: example_vm_hourly_series_limit_current_series, hourlyMaxSeriesMetric: example_vm_hourly_series_limit_max_series,
    dailyCurrentSeriesMetric: example_vm_daily_series_limit_current_series, dailyMaxSeriesMetric: example_vm_daily_series_limit_max_series,
    ratio: 0.85, for: 3m, severity: warning}
  logStore: {metric: example_vl_rows_dropped_total, window: 2m, for: 2m, severity: critical}
  traceStore: {metric: example_vt_rows_dropped_total, window: 2m, for: 2m, severity: critical}
  gateway: {queueSizeMetric: example_otelcol_exporter_queue_size, queueCapacityMetric: example_otelcol_exporter_queue_capacity,
    queueRatio: 0.75, queueFor: 5m, queueSeverity: warning, exportFailedMetricPrefix: example_otelcol_exporter,
    exportFailWindow: 2m, exportFailFor: 2m, exportFailSeverity: critical, enqueueFailedMetricPrefix: example_otelcol_exporter,
    enqueueFailWindow: 2m, enqueueFailFor: 2m, enqueueFailSeverity: critical}
  diskGuard:
    headroomFactor: 3
    for: 8m
    severity: warning
    metrics: {freeSpaceMetric: example_vm_free_disk_space_bytes, freeSpaceLimitMetric: example_vm_free_disk_space_limit_bytes}
    logs: {freeSpaceMetric: example_vl_free_disk_space_bytes, freeSpaceLimitMetric: example_vl_free_disk_space_limit_bytes}
    traces: {freeSpaceMetric: example_vt_free_disk_space_bytes, freeSpaceLimitMetric: example_vt_free_disk_space_limit_bytes}
  snapshotAge:
    for: 20m
    severity: critical
    metrics: {maxAge: 3h}
    logs: {maxAge: 90m}
    traces: {maxAge: 90m}
  logStreamChurn: {streamsCreatedMetric: example_vl_streams_created_total, perSecond: 2, for: 30m, severity: warning}
  traceStreamChurn: {streamsCreatedMetric: example_vt_streams_created_total, perSecond: 2, for: 30m, severity: warning}
  writer:
    bufferMetric: example_vmalert_remotewrite_pending_data_bytes
    bufferMetricsExtra: [example_vlagent_remotewrite_pending_data_bytes]
    for: 15m
    droppedPacketsMetric: example_vmalert_remotewrite_packets_dropped_total
    droppedPacketsMetricsExtra: [example_vlagent_remotewrite_packets_dropped_total]
    severity: critical
  proxyConcurrency: {limitedRequestsMetric: example_vmauth_concurrent_requests_limit_reached_total, window: 2m,
    for: 2m, severity: warning}
victoria-metrics-k8s-stack:
  global: {clusterLabel: cell}
  vmsingle: {enabled: false}
  defaultDashboards:
    enabled: true
    dashboards:
      grafana-overview: {enabled: true}
victoria-logs-single: {enabled: false}
victoria-traces-single: {enabled: false}
grafana:
  enabled: true
  replicas: 2
  admin: {existingSecret: example-grafana, userKey: admin-user, passwordKey: admin-password}
  envValueFrom:
    GF_SECURITY_SECRET_KEY:
      secretKeyRef: {name: example-grafana, key: secret_key}
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef: {name: example-grafana, key: client_id}
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef: {name: example-grafana, key: client_secret}
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        uid: victoriametrics
        isDefault: true
        version: 2
        url: http://vmauth-observability-stack-stack:8427/prometheus
        jsonData: {oauthPassThru: true}
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        uid: victorialogs
        version: 2
        url: http://vmauth-observability-stack-stack:8427
        jsonData: {oauthPassThru: true}
      - name: VictoriaTraces
        type: jaeger
        access: proxy
        uid: victoriatraces
        version: 2
        url: http://vmauth-observability-stack-stack:8427/select/jaeger
        jsonData: {oauthPassThru: true}
  grafana.ini:
    analytics: {check_for_updates: false, reporting_enabled: false}
    database: {type: postgres, host: 'example-pg-rw:5432', name: grafana, locking_attempt_timeout_sec: 300}
    auth.generic_oauth: {enabled: true, name: SSO, allow_sign_up: true, use_refresh_token: true, role_attribute_strict: true,
      scopes: openid profile email groups offline_access, auth_url: 'https://issuer.example/authorize',
      token_url: 'https://issuer.example/token', api_url: 'https://issuer.example/userinfo'}
    unified_alerting: {enabled: false}
    alerting: {enabled: false}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      provider: {name: sidecar, orgid: 1, updateIntervalSeconds: 60}
  resources:
    requests: {cpu: '2', memory: 1Gi}
    limits: {cpu: '2', memory: 1Gi}
