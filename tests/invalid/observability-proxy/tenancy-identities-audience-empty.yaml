# expect: which is not an identifier
# An audience that is present and says nothing is refused, as for a principal.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: example-app
      groups: [example:example-app]
      audience: ""
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]


victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
