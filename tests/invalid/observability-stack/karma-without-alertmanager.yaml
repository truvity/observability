# expect: karma has no Alertmanager to read
# alertmanager.enabled false and no extra servers: nothing for karma to show.

alertmanager:
  enabled: false
  notifierUrl: http://alertmanager.example.svc:9093
# MIRROR of alertmanager.enabled above, see
# observability-stack.validate.vendoredSyncSources' own doc comment.
victoria-metrics-k8s-stack:
  defaultRules:
    sources:
      alertmanager:
        enabled: false

karma:
  enabled: true
  authentication:
    header:
      name: X-Auth-Request-Email
