global:
  cluster:
    dnsDomain: cluster.example.

# tenancy-authz with a signing key somebody else owns, mounted from a
# Secret: no SSHKey generator and no ExternalSecret. The audiences and the upstream issuer are stated rather
# than defaulted, and the Gateway policy is left to the consumer.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    replicas: 3
    upstreamIssuer: https://idp.example:8443
    personAudiences: [grafana, example-observability-client]
    mintedAudience: example-vmauth
    tokenTTL: 2m
    # Stated rather than derived from the principals' grants.
    traceClusters: [cluster-a]
    signingKey:
      source: existingSecret
      existingSecret: example-authz-signing
    securityPolicy:
      enabled: false
    networkPolicy:
      gatewayFrom:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: envoy}
  principals:
    - group: example:example-app:deployer
      grants:
        - cluster: cluster-a
          namespaces: [example-app]

vmalert:
  enabled: false
alertmanager:
  enabled: false
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
