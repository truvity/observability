# Tag-triggered release through truvity/ci-workflows release-public.yaml,
# which runs goreleaser and then pushes every chart under charts/ to
# ghcr.io/truvity/charts at the tag's version.
#
# No binaries: this repository ships Helm charts (and, from the release
# that adds it, a Go library, which needs no build step) — goreleaser's
# job here is the GitHub Release with the changelog, nothing else.
# `skip: true` is its documented shape for library projects.
version: 2

builds:
  - skip: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

release:
  github: {}
  # setup.sh is a release asset, not a build output: a box's cloud-init
  # (rendered by pkg/statusbox.CloudInit) downloads THIS exact file from
  # THIS release. It has to be attached here, and it has to be in
  # checksum's own extra_files below too, or checksums.txt — the thing
  # CloudInit fetches at deploy time to bake a sha256 into every box's
  # user-data — would carry no entry for it, and CloudInit refuses to
  # render rather than boot a box that trusts an unverified script. See
  # docs/statusbox.md ("Checksum at deploy, verify at boot").
  extra_files:
    - glob: ./setup.sh

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./setup.sh
