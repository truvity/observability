# Every optional piece on: the public route, declarative configuration,
# a verified database certificate from a ConfigMap, a pinned digest, two
# replicas, narrowed DNS and metrics sources, and the relay's own alert
# routed at another severity.
goalert:
  image:
    digest: sha256:f090a90538d7e61446aad245c21a7a1694d36d7b4f6c56fc55e9cc7405d9c03f
  replicaCount: 2
  publicURL: https://oncall.example
  dataEncryptionKeySecret:
    name: oncall-goalert-key
    key: data-encryption-key
  database:
    host: oncall-pg-rw.oncall.svc
    passwordSecret:
      name: oncall-pg-app
    ca:
      configMap: example-private-ca
      key: ca-certificates.crt
  config:
    values:
      General:
        ApplicationName: On call
      OIDC:
        Enable: true
        NewUsers: true
        IssuerURL: https://issuer.example
        ClientID: oncall
        ClientSecret: $(OIDC_CLIENT_SECRET)
      Webhook:
        Enable: true
        AllowedURLs:
          - http://oncall-telegram-relay.oncall.svc:8080/v1/notify/
    secretEnv:
      - name: OIDC_CLIENT_SECRET
        secretKeyRef:
          name: oncall-client
          key: client-secret
  extraEnv:
    - name: GOALERT_KUBERNETES_COOLDOWN
      value: 5s
  tolerations:
    - key: arch
      operator: Exists
  serviceAccount:
    annotations:
      example.com/owner: oncall

relay:
  image:
    tag: "1.2.3"
  secret:
    name: oncall-telegram-relay
  sendTimeout: 2s

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: oncall
      namespace: gateway
  hostnames:
    - oncall.example

networkPolicy:
  goalertFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vmalertmanager
  databasePeers:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: oncall-pg
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
  dns:
    - ipBlock:
        cidr: 10.100.0.0/16

rules:
  deliveryFailing:
    severity: critical
    window: 30m
  alertmanagerDeliveryFailing:
    enabled: true
    receiverName: goalert
