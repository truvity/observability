# Source: observability-stack/charts/grafana/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-stack-grafana
  namespace: observability
  labels:
    helm.sh/chart: grafana-12.7.3
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/version: "13.1.1"
data:
  
  grafana.ini: |
    [alerting]
    enabled = false
    [analytics]
    check_for_updates = false
    reporting_enabled = false
    [auth]
    disable_login_form = true
    oauth_auto_login = true
    [auth.generic_oauth]
    allow_sign_up = true
    api_url = 
    auth_url = 
    enabled = true
    name = SSO
    role_attribute_path = 'Viewer'
    role_attribute_strict = true
    scopes = openid profile email groups offline_access
    token_url = 
    use_refresh_token = true
    [database]
    locking_attempt_timeout_sec = 120
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = ''
    [unified_alerting]
    enabled = false
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
    [users]
    auto_assign_org = true
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      basicAuth: true
      basicAuthUser: ${STORE_USERNAME}
      isDefault: true
      name: VictoriaMetrics
      secureJsonData:
        basicAuthPassword: ${STORE_PASSWORD}
      type: prometheus
      uid: victoriametrics
      url: http://vmsingle-observability-stack-victoria-metrics-k8s-stack:8428/prometheus
      version: 1
    - access: proxy
      basicAuth: true
      basicAuthUser: ${STORE_USERNAME}
      name: VictoriaLogs
      secureJsonData:
        basicAuthPassword: ${STORE_PASSWORD}
      type: victoriametrics-logs-datasource
      uid: victorialogs
      url: http://observability-stack-victoria-logs-single-server:9428
      version: 1
    - access: proxy
      basicAuth: true
      basicAuthUser: $__env{STORE_USERNAME}
      name: VictoriaTraces
      secureJsonData:
        basicAuthPassword: $__env{STORE_PASSWORD}
      type: jaeger
      uid: victoriatraces
      url: http://observability-stack-vt-single-server:10428/select/jaeger
      version: 1

