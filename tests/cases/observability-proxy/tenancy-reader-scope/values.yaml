# A Door case for charts/observability-proxy. It began as the Door half of the
# stack case of the same name, from the release in which the stack stopped
# rendering the Door: the stack's values kept to the keys this chart declares,
# with `stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
  - groups:
    - example:k8s:viewer
    reach:
      clusters:
      - cluster: example-cluster
        allNamespaces: true
  - groups:
    - example:example-app:metrics-gate
    audience: metrics-gate.example|other(prod)
    workload:
      routes:
      - metrics
      metricsQueryOnly: true
    reach:
      clusters:
      - cluster: example-cluster
        namespaces:
        - example-app
vmalert:
  enabled: false
alertmanager:
  enabled: false
networkPolicy:
  enabled: false
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
