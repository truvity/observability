{{- /*
Refusals first: a chart that renders nothing, or renders a rule whose
expression names a metric nobody exports, is worse than one that fails —
it reports success and then never fires. Both are caught here, at render
time, with a fixture under tests/invalid for each.
*/ -}}

{{- $enabled := list -}}
{{- range $name, $group := .Values.groups -}}
{{- if $group.enabled -}}{{- $enabled = append $enabled $name -}}{{- end -}}
{{- end -}}
{{- if not $enabled -}}
{{- fail "platform-alerts: every group is disabled, so this release would render no rules at all. Enable at least one group, or do not install the chart." -}}
{{- end -}}

{{- $storeGroups := include "platform-alerts.storeGroups" . -}}
{{- if and $storeGroups (not .Values.stores) -}}
{{- fail (printf "platform-alerts: groups %s watch the stores' own counters, but `stores` is empty. Name the counters your stores export (see values.yaml); a guessed metric name is how a rule silently never fires." $storeGroups) -}}
{{- end -}}

{{- if .Values.groups.writePath.enabled -}}
{{- range .Values.stores -}}
{{- if not .rowsMetric -}}
{{- fail (printf "platform-alerts: store %q has no `rowsMetric`, so the write-path deadman cannot watch it. Every store the deadman covers must name its rows counter." .name) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- $ns := .Values.namespaceSelector -}}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "platform-alerts.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.ruleLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- if .Values.groups.backups.enabled }}
    {{- $g := .Values.groups.backups }}
    - name: platform-alerts.backups
      interval: {{ .Values.interval }}
      rules:
        # A CronJob that has not SUCCEEDED within its schedule plus slack.
        # This is the rule that matters: a CronJob which stops being
        # scheduled at all never produces a failed Job, so a rule watching
        # failures reports healthy while nothing runs. Measured healthy
        # range for a daily job: age resets below 24h on every run.
        - alert: CronJobNotSucceeding
          expr: >-
            time() - max by (namespace, cronjob) (
              kube_cronjob_status_last_successful_time{namespace=~"{{ $ns }}"}
            ) > {{ $g.maxSuccessAge }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "CronJob {{`{{ $labels.namespace }}`}}/{{`{{ $labels.cronjob }}`}} has not succeeded within {{ $g.maxSuccessAge }}"
            description: >-
              No successful run in {{ $g.maxSuccessAge }}. A job that has stopped being
              scheduled produces no failures at all, so this is the only rule that
              can see it. Check that the CronJob exists, is not suspended, and that
              its last Job completed.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "CronJobNotSucceeding")) }}{{ . | nindent 12 }}{{- end }}
        # A Job that failed outright. Separate from the age rule because a
        # job that fails loudly and one that vanishes quietly are different
        # failures, often with different owners.
        - alert: BackupJobFailed
          expr: >-
            max by (namespace, job_name) (
              kube_job_status_failed{namespace=~"{{ $ns }}"}
            ) > 0
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.failedSeverity) | nindent 12 }}
          annotations:
            summary: "Job {{`{{ $labels.namespace }}`}}/{{`{{ $labels.job_name }}`}} failed"
            description: >-
              The Job reported a failed pod. If it is a backup, treat the last
              successful run as the real recovery point until this is resolved.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "BackupJobFailed")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.writePath.enabled }}
    {{- $g := .Values.groups.writePath }}
    - name: platform-alerts.write-path
      interval: {{ .Values.interval }}
      rules:
        {{- range $store := .Values.stores }}
        # The write-path deadman for {{ $store.name }}.
        #
        # An alert on a store's read-only FLAG cannot fire in its own
        # headline case: that sample is written INTO the store that is
        # refusing writes. Reads keep working when writes do not, so
        # watching the rows counter stop is the only rule that sees it.
        #
        # `or vector(0)` makes the rule fire for both shapes of the
        # failure: the counter stops moving, and the counter disappears
        # because the store is gone.
        - alert: WritePathDead
          expr: >-
            (sum(rate({{ $store.rowsMetric }}[{{ $g.window }}])) or vector(0)) == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
            store: {{ $store.name | quote }}
          annotations:
            summary: "No rows written to the {{ $store.name }} store for {{ $g.for }}"
            description: >-
              {{ $store.rowsMetric }} has not advanced in {{ $g.for }}. The store may be
              read-only, out of disk, or gone; reads can keep working throughout, so
              nothing else will report this.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "WritePathDead")) }}{{ . | nindent 12 }}{{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.groups.volumes.enabled }}
    {{- $g := .Values.groups.volumes }}
    - name: platform-alerts.volumes
      interval: {{ .Values.interval }}
      rules:
        # A mounted filesystem far smaller than the claim that satisfied it
        # cannot legitimately happen: it means the real volume is not
        # mounted and the pod is writing to the node's root filesystem
        # while reporting 1/1 Running. Measured healthy range is 0.95-0.99
        # of the claim (filesystem overhead); the threshold sits well below
        # it so overhead can never reach it and a wrong mount always does.
        - alert: VolumeSmallerThanClaimed
          expr: >-
            kubelet_volume_stats_capacity_bytes{namespace=~"{{ $ns }}"}
            / on (namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~"{{ $ns }}"}
            < {{ $g.minCapacityRatio }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "PVC {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim }}`}} is mounted on a filesystem far smaller than it claimed"
            description: >-
              The mounted filesystem is under {{ $g.minCapacityRatio }} of the claim. The
              volume is probably not mounted at all and the pod is writing to the
              node's root filesystem. Data written since it started is not on the
              volume.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "VolumeSmallerThanClaimed")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.storeLimits.enabled }}
    {{- $g := .Values.groups.storeLimits }}
    {{- $rules := list }}
    {{- range $store := .Values.stores }}
    {{- if and $store.freeSpaceMetric $store.freeSpaceLimitMetric }}
    {{- $rules = append $rules $store }}
    {{- end }}
    {{- end }}
    {{- if $rules }}
    - name: platform-alerts.store-limits
      interval: {{ .Values.interval }}
      rules:
        {{- range $store := $rules }}
        # Read from the store's OWN exported limit, never a constant
        # written here: a guessed constant is how a rule never fires or
        # always does. Fires while there is still headroom to act.
        - alert: StoreApproachingReadOnly
          expr: >-
            {{ $store.freeSpaceMetric }} / {{ $store.freeSpaceLimitMetric }} < {{ $g.headroomFactor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
            store: {{ $store.name | quote }}
          annotations:
            summary: "The {{ $store.name }} store is approaching its read-only limit"
            description: >-
              Free space is under {{ $g.headroomFactor }}x the limit at which this store stops
              accepting writes. It is still serving reads and will keep doing so
              after it stops writing, so nothing else will report this.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "StoreApproachingReadOnly")) }}{{ . | nindent 12 }}{{- end }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.groups.kargo.enabled }}
    {{- $g := .Values.groups.kargo }}
    - name: platform-alerts.kargo
      interval: {{ .Values.interval }}
      rules:
        # A Kargo Stage stuck on a promotion error.
        #
        # `kargo_stage_condition` is a gauge kube-state-metrics' own
        # customResourceState feature exports from the Stage's own
        # `.status.conditions`: 1 while the condition named by `type` and
        # `reason` is True, 0 while it is False or Unknown. This chart
        # does not configure that feature — see docs/kube-state-metrics.md
        # for the config that produces it.
        - alert: KargoStagePromotionErrored
          expr: >-
            kargo_stage_condition{type="Ready", reason="LastPromotionErrored"} == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "Kargo Stage {{`{{ $labels.namespace }}`}}/{{`{{ $labels.stage }}`}} has not recovered from a promotion error"
            description: >-
              The Stage's Ready condition has read LastPromotionErrored for {{ $g.for }}.
              Re-promote the Freight from the Kargo UI or CLI once the underlying
              failure is fixed; the Stage will not retry itself.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoStagePromotionErrored")) }}{{ . | nindent 12 }}{{- end }}
        # The same failure, corroborated by the Promotion object itself.
        #
        # `kargo_promotion_phase` is a StateSet over Pending, Running,
        # Succeeded, Failed, Errored and Aborted: 1 on the Promotion's
        # current phase, 0 on every other. Joining on (namespace, stage)
        # against the Stage condition above is what tells an Errored
        # promotion whose Stage has already recovered (a retry that
        # succeeded since) apart from one still stuck.
        - alert: KargoPromotionErrored
          expr: >-
            kargo_promotion_phase{phase="Errored"} == 1
            and on (namespace, stage) kargo_stage_condition{type="Ready", reason="LastPromotionErrored"} == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "Kargo Promotion {{`{{ $labels.namespace }}`}}/{{`{{ $labels.promotion }}`}} errored and its Stage has not recovered"
            description: >-
              The Promotion has sat in the Errored phase for {{ $g.for }} and its
              Stage still reads LastPromotionErrored. Re-promote the Freight from
              the Kargo UI or CLI once the underlying failure is fixed.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoPromotionErrored")) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for the two rules above.
        #
        # Same shape as the write-path deadman: a rule that reads
        # `kargo_stage_condition` or `kargo_promotion_phase` cannot itself
        # notice those series going away, because it evaluates to nothing
        # rather than to a value it could compare. Either kube-state-metrics'
        # `customResourceState` config for Kargo's CRDs was never applied,
        # was edited away, or the whole scrape went dark — every case the
        # two rules above go silent right along with it.
        - alert: KargoStateMetricsAbsent
          expr: >-
            absent(kargo_stage_condition{type="Ready"}) or absent(kargo_promotion_phase)
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.absentSeverity) | nindent 12 }}
          annotations:
            summary: "kube-state-metrics has not exported Kargo's own Stage/Promotion metrics for {{ $g.absentFor }}"
            description: >-
              Neither kargo_stage_condition{type="Ready"} nor
              kargo_promotion_phase has been seen in {{ $g.absentFor }}, so
              KargoStagePromotionErrored and KargoPromotionErrored cannot fire
              even if a promotion is stuck. Check kube-state-metrics'
              customResourceState config against docs/kube-state-metrics.md, and
              that the scrape itself is still up.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoStateMetricsAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
