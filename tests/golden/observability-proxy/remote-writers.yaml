---
# Source: observability-proxy/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-stack-proxy
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmauth
      app.kubernetes.io/instance: observability-stack
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8427
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8435

---
# Source: observability-proxy/templates/vmauth.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: observability-stack
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  image:
    repository: victoriametrics/vmauth
    tag: v1.152.0
  replicaCount: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 512Mi
  selectAllByDefault: false
  userSelector:
    matchLabels:
      app.kubernetes.io/part-of: observability-stack
      app.kubernetes.io/instance: observability-stack
  userNamespaceSelector: {}
  extraArgs:
    logInvalidAuthTokens: "true"

---
# Source: observability-proxy/templates/vmusers.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: observability-stack-writer-local-emitters
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.role: writer
spec:
  name: "local-emitters"
  disable_secret_creation: true
  tokenRef:
    name: "local-writer-token"
    key: "token"
  load_balancing_policy: first_available
  retry_status_codes: 
    - 500
    - 502
    - 503
  targetRefs:
    - static:
        url: "http://vmsingle-observability-stack-victoria-metrics-k8s-stack.observability.svc:8428"
      paths:
        - /prometheus/api/v1/write
        - /api/v1/write
        - /opentelemetry/v1/metrics
      targetRefBasicAuth:
        username:
          name: "observability-store-credentials"
          key: "username"
        password:
          name: "observability-store-credentials"
          key: "password"
    - static:
        url: "http://observability-stack-victoria-logs-single-server.observability.svc:9428"
      paths:
        - /insert/datadog/api/v2/logs
        - /insert/elasticsearch/_bulk
        - /insert/journald/upload
        - /insert/jsonline
        - /insert/loki/api/v1/push
        - /insert/native
        - /insert/opentelemetry/v1/logs
        - /insert/splunk
      targetRefBasicAuth:
        username:
          name: "observability-store-credentials"
          key: "username"
        password:
          name: "observability-store-credentials"
          key: "password"
    - static:
        url: "http://observability-stack-vt-single-server.observability.svc:10428"
      paths:
        - /insert/opentelemetry/v1/traces
      targetRefBasicAuth:
        username:
          name: "observability-store-credentials"
          key: "username"
        password:
          name: "observability-store-credentials"
          key: "password"

