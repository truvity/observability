# A Door case for charts/observability-proxy. It began as the Door half of the
# stack case of the same name, from the release in which the stack stopped
# rendering the Door: the stack's values kept to the keys this chart declares,
# with `stackReleaseName` set to the stack's release name, so the render
# carries the names the stack's Door objects always had. Every principal is an
# entry of `tenancy.identities`.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    securityPolicy:
      targetRefs:
      - kind: HTTPRoute
        name: observability-read
    networkPolicy:
      gatewayFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: example-gateway
        podSelector:
          matchLabels:
            app.kubernetes.io/name: envoy
  identities:
  - name: k8s:viewer
    groups:
    - cluster-a:k8s:viewer
    - cluster-b:k8s:viewer
    reach:
      clusters:
      - cluster: cluster-a
        allNamespaces: true
      - cluster: cluster-b
        allNamespaces: true
  - groups:
    - example:example-app:deployer
    reach:
      clusters:
      - cluster: cluster-a
        namespaces:
        - example-app
        - other-app
  - groups:
    - cluster-a:example-app:reader
    audience: reader
    workload:
      routes:
      - metrics
      metricsQueryOnly: true
    reach:
      clusters:
      - cluster: cluster-a
        namespaces:
        - example-app
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
