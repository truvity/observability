# expect: which is neither "slack", "telegram" (with notifications.telegram configured) nor the name of an entry in notifications.webhook
# `severities.critical.receiver` names a receiver kind this chart never
# configured. Alertmanager's route to it exists in the rendered
# manifest and looks like a route; it reaches nobody.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-slack-bot
        key: token
  severities:
    critical:
      receiver: pagerduty
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
