# When renovate's automerged bumps have moved master past the latest
# release, the shared workflow cuts the next patch tag. DOUBLY GUARDED,
# off by default: the issuer must be configured for the organisation AND
# vars.AUTO_RELEASE must be "true" — flipping it is the deliberate policy
# act. It only ever cuts patches; minors, majors and the first release are
# manual tags.
#
# NO APP KEY HERE. The job exchanges its own GitHub identity token at the
# access-roster issuer for an installation token of the catalogue App,
# narrowed to this repository. Nothing to rotate, nothing to leak.
name: Auto Release

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  # Security lane: a push whose merged PR carries renovate's `security`
  # label releases immediately; every other push exits quietly in the
  # shared workflow, and the weekly schedule stays the lane for ordinary
  # bumps.
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write # the token exchange, in the shared workflow's job

jobs:
  tag:
    if: vars.AUTO_RELEASE == 'true' && vars.ACCESS_ROSTER_ISSUER != ''
    uses: truvity/ci-workflows/.github/workflows/auto-release.yaml@a4784bc59078d44bd746f7eb8a49b4d8a03e66c5 # v3.1.0
    with:
      token-source: access-roster
      access-roster-issuer: ${{ vars.ACCESS_ROSTER_ISSUER }}
      github-app: truvity-ci-automation
