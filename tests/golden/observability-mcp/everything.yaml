---
# Source: observability-mcp/templates/mcp.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-mcp-metrics
  labels:
    app.kubernetes.io/name: observability-mcp
    app.kubernetes.io/instance: observability-mcp
    app.kubernetes.io/component: metrics
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: observability-mcp
      app.kubernetes.io/instance: observability-mcp
      app.kubernetes.io/component: metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The gateway, on the proxy's one port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # 1. The issuer: signing keys, and the token exchange.
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - protocol: TCP
          port: 8443
    # 2. The store's proxy.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
      ports:
        - protocol: TCP
          port: 8427
    # 3. Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

