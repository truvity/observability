apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts-upstream-k8s-rules-container-cpu-limits
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: recording
spec:
  groups:
    - name: k8s.rules.container_cpu_limits
      rules:
      - expr: kube_pod_container_resource_limits{resource="cpu",job="kube-state-metrics"}
          * on(namespace,pod,k8s_cluster_name) group_left() max(kube_pod_status_phase{phase=~"Pending|Running"}
          == 1) by(namespace,pod,k8s_cluster_name)
        record: cluster:namespace:pod_cpu:active:kube_pod_container_resource_limits
      - expr: sum(sum(max(kube_pod_container_resource_limits{resource="cpu",job="kube-state-metrics"})
          by(namespace,pod,container,k8s_cluster_name) * on(namespace,pod,k8s_cluster_name)
          group_left() max(kube_pod_status_phase{phase=~"Pending|Running"} == 1) by(namespace,pod,k8s_cluster_name))
          by(namespace,pod,k8s_cluster_name)) by(namespace,k8s_cluster_name)
        record: namespace_cpu:kube_pod_container_resource_limits:sum

