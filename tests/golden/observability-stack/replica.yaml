# Source: observability-stack/charts/victoria-metrics-k8s-stack/templates/victoria-metrics-operator/vmsingle/vmsingle.yml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: observability-stack-victoria-metrics-k8s-stack
  namespace: observability
  labels: 
    app.kubernetes.io/component: vmsingle
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-k8s-stack
    app.kubernetes.io/version: v1.152.0
    helm.sh/chart: victoria-metrics-k8s-stack-0.93.0
spec: 
  disableSelfServiceScrape: true
  extraArgs:
    dedup.minScrapeInterval: 30s
    envflag.enable: "true"
    envflag.prefix: VM_
    storage.maxDailySeries: "0"
    storage.maxHourlySeries: "0"
    storage.minFreeDiskSpaceBytes: 10GiB
  extraEnvs:
  - name: VM_httpAuth_username
    valueFrom:
      secretKeyRef:
        key: username
        name: observability-store-credentials
  - name: VM_httpAuth_password
    valueFrom:
      secretKeyRef:
        key: password
        name: observability-store-credentials
  image:
    tag: v1.152.0
  podMetadata:
    labels:
      observability.pair: observability-metrics
  port: "8428"
  replicaCount: 1
  resources:
    limits:
      memory: 8Gi
    requests:
      cpu: 500m
      memory: 8Gi
  retentionPeriod: 90d
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  storage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 100Gi
  topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        observability.pair: observability-metrics
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
