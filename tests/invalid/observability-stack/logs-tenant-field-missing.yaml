# The log path has to be named.
#
# vlagent can rename no field, so the tenant reaches VictoriaLogs as
# `kubernetes.namespace_labels.<key>` and a stream filter naming `tenant`
# selects a field the streams do not have. That is not an error anywhere:
# it is an empty result, and the person who gets it reads it as "my
# service logged nothing". So there is no default, and a principal
# without the field name refuses to render.
tenancy:
  issuerUrl: https://issuer.example
  logsEnvField: env
  principals:
    - group: example:k8s:viewer
      grants:
        - env: devel
          allTenants: true
