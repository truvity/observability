# expect: /mention': value must be one of 'here', 'channel'
# A route override's object form takes the same enum.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - name: acme
        appTokenSecret: {name: example-acme-slack-bot, key: token}
  telegram:
    botTokenSecret: {name: example-telegram-bot, key: bot-token}
    chatId: -1000000000001
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
  routes:
    - match: {k8s_namespace_name: example-app}
      critical: {channel: "#example-app", mention: everyone}
