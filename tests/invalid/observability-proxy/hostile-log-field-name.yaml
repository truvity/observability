# expect: at '/tenancy/logsNamespaceField'
# A log field name is interpolated into the stream filter, exactly as a
# namespace name is. This one closes the quoted field name, ends the
# alternative and opens a second one that matches every namespace — it
# would not look odd in the rendered filter, it would be a grant nobody
# wrote. Such a name is refused, never escaped.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  logsNamespaceField: ns"=~"^(.*)$" or {"k8s.cluster.name
  identities:
  - groups:
    - example:app:deployer
    reach:
      clusters:
      - cluster: example-cluster
        namespaces:
        - example-app
