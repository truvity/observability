# expect: /servers/metrics/resourceURL': 'http://mcp.example.com/metrics' does not match
# An http resource identifier is not one a client will send a token to.
issuerURL: https://issuer.example.com
proxy:
  image:
    tag: v0.0.1
servers:
  metrics:
    enabled: true
    resourceURL: http://mcp.example.com/metrics
    outbound:
      target: http://vmauth.observability.svc:8427
      tokenEndpoint: https://issuer.example.com/token
      clientId: observability-mcp
      audience: store-proxy
networkPolicy:
  ingressFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateway}}
  egress:
    issuer: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: issuer}}}]
    vmauth: [{podSelector: {matchLabels: {app.kubernetes.io/name: vmauth}}}]
