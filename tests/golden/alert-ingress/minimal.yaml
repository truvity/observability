---
# Source: alert-ingress/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-ingress
  labels:
    app.kubernetes.io/name: alert-ingress
    app.kubernetes.io/instance: alert-ingress
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-ingress
      app.kubernetes.io/instance: alert-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-ingress
        app.kubernetes.io/instance: alert-ingress
        app.kubernetes.io/managed-by: Helm
      annotations:
        # The configuration's own checksum, so a change to `topics`,
        # `mappings` or `heartbeat` restarts the pods. Without it a
        # ConfigMap edit lands on disk and the running process keeps the
        # configuration it read at startup — a values change that
        # applied, synced, and did nothing.
        alert-ingress/config-checksum: 2c08e880737f3985314a55b8e4bfa7c9631feb5018fb29fbf98b984f5551c3ad
    spec:
      serviceAccountName: alert-ingress
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-ingress
          image: "ghcr.io/example/alert-ingress:1.0.0"
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/alert-ingress/config.yaml
            - "--listen-addr=:8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # A static binary FROM SCRATCH has no shell for exec probes and
          # needs none: /healthz answers before the configuration is even
          # re-read, so a probe here can only ever report "the process is
          # up", which is exactly what a liveness/readiness probe is for.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alert-ingress
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alert-ingress

