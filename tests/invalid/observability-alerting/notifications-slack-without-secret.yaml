# expect: at '/notifications/slack/workspaces/0/appTokenSecret/name'
# A workspace with an empty bot token Secret name. A receiver that cannot
# send is worse than no receiver: the manifest, the route and the schema
# would all agree it exists, and it would never deliver anything.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: ''
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
