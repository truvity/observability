# Source: observability-stack/templates/vmalertmanager.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: observability-stack
  labels:
    app.kubernetes.io/name: stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  replicaCount: 2
  resources:
    limits:
      cpu: "2"
      memory: 512Mi
    requests:
      cpu: "2"
      memory: 512Mi
  selectAllByDefault: false
  externalURL: "https://alerts.example.com"
  volumes:
    - name: watchdog
      secret:
        secretName: "example-watchdog-receiver"
    - name: notifications-slack
      secret:
        secretName: "example-slack-webhook"
    - name: notifications-webhook-status-page
      secret:
        secretName: "example-status-webhook"
  volumeMounts:
    - name: watchdog
      mountPath: /etc/alertmanager/watchdog
      readOnly: true
    - name: notifications-slack
      mountPath: /etc/alertmanager/notifications-slack
      readOnly: true
    - name: notifications-webhook-status-page
      mountPath: /etc/alertmanager/notifications-webhook-status-page
      readOnly: true
  configRawYaml: |
    route:
      # `notifications-none` is a receiver with no configs: Alertmanager
      # accepts that as a legitimate "do not send" target. It is the root
      # receiver and the catch-all for a severity this chart's routing
      # tree does not know (there is deliberately no `info` route — see
      # docs/notifications.md), never a route somebody forgot to write.
      receiver: notifications-none
      group_by:
        - alertname
        - k8s_cluster_name
        - k8s_namespace_name
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 2h
      routes:
        # The heartbeat, first and matched on its own: it must never be
        # grouped with anything, never inhibited and never silenced by a
        # rule written for a real alert.
        - receiver: watchdog
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 2m
        - match: {}
          receiver: notifications-none
          continue: true
          routes:
            - match:
                k8s_cluster_name: example-cluster
              receiver: notifications-none
              routes:
                - match:
                    severity: critical
                  receiver: slack-alerts-example-cluster
                - match:
                    severity: warning
                  receiver: slack-alerts-example-cluster
            - match:
                k8s_namespace_name: example-app
              receiver: notifications-none
              routes:
                - match:
                    severity: critical
                  receiver: slack-example-app
                - match:
                    severity: warning
                  receiver: slack-alerts
            - match:
                severity: critical
              receiver: slack-alerts-critical
            - match:
                severity: warning
              receiver: slack-alerts
        - match:
            customer_facing: "true"
            severity: critical
          receiver: status-page
    receivers:
      - name: notifications-none
      - name: slack-alerts
        slack_configs:
          - channel: "#alerts"
            api_url_file: /etc/alertmanager/notifications-slack/url
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ .CommonLabels.k8s_cluster_name }}/{{ .CommonLabels.k8s_namespace_name }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ if .Annotations.runbook }}Runbook: https://runbooks.example/{{ .Annotations.runbook }}
              {{ end }}
              Grafana: https://alerts.example.com/?var-cluster={{ .Labels.k8s_cluster_name }}&var-namespace={{ .Labels.k8s_namespace_name }}
              {{ end }}
              Silence: {{ .ExternalURL }}/#/silences/new?filter=%7B{{ range .CommonLabels.SortedPairs }}{{ .Name }}%3D%22{{ .Value }}%22%2C{{ end }}%7D
      - name: slack-alerts-critical
        slack_configs:
          - channel: "#alerts-critical"
            api_url_file: /etc/alertmanager/notifications-slack/url
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ .CommonLabels.k8s_cluster_name }}/{{ .CommonLabels.k8s_namespace_name }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ if .Annotations.runbook }}Runbook: https://runbooks.example/{{ .Annotations.runbook }}
              {{ end }}
              Grafana: https://alerts.example.com/?var-cluster={{ .Labels.k8s_cluster_name }}&var-namespace={{ .Labels.k8s_namespace_name }}
              {{ end }}
              Silence: {{ .ExternalURL }}/#/silences/new?filter=%7B{{ range .CommonLabels.SortedPairs }}{{ .Name }}%3D%22{{ .Value }}%22%2C{{ end }}%7D
      - name: slack-alerts-example-cluster
        slack_configs:
          - channel: "#alerts-example-cluster"
            api_url_file: /etc/alertmanager/notifications-slack/url
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ .CommonLabels.k8s_cluster_name }}/{{ .CommonLabels.k8s_namespace_name }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ if .Annotations.runbook }}Runbook: https://runbooks.example/{{ .Annotations.runbook }}
              {{ end }}
              Grafana: https://alerts.example.com/?var-cluster={{ .Labels.k8s_cluster_name }}&var-namespace={{ .Labels.k8s_namespace_name }}
              {{ end }}
              Silence: {{ .ExternalURL }}/#/silences/new?filter=%7B{{ range .CommonLabels.SortedPairs }}{{ .Name }}%3D%22{{ .Value }}%22%2C{{ end }}%7D
      - name: slack-example-app
        slack_configs:
          - channel: "#example-app"
            api_url_file: /etc/alertmanager/notifications-slack/url
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ .CommonLabels.k8s_cluster_name }}/{{ .CommonLabels.k8s_namespace_name }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ if .Annotations.runbook }}Runbook: https://runbooks.example/{{ .Annotations.runbook }}
              {{ end }}
              Grafana: https://alerts.example.com/?var-cluster={{ .Labels.k8s_cluster_name }}&var-namespace={{ .Labels.k8s_namespace_name }}
              {{ end }}
              Silence: {{ .ExternalURL }}/#/silences/new?filter=%7B{{ range .CommonLabels.SortedPairs }}{{ .Name }}%3D%22{{ .Value }}%22%2C{{ end }}%7D
      - name: status-page
        webhook_configs:
          - url_file: /etc/alertmanager/notifications-webhook-status-page/url
            send_resolved: true
      - name: watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/watchdog/url
            send_resolved: false
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal:
          - k8s_cluster_name
          - k8s_namespace_name

