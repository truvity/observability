# The metrics a store ACTUALLY holds today, by the scrape target that
# produces them. Derived from a live survey of two real installs, then
# checked against what charts/observability-emitters and
# charts/observability-stack configure (their values are the source of
# truth for the allow-lists and the drops below).
#
# Read by two things, and by nothing else:
#   - hack/dashboards.py, which drops any panel query in an imported
#     dashboard that reads a metric not listed here (a panel that can only
#     ever be empty is not shipped);
#   - tests/dashboard_queries_test.go, which fails any dashboard flagged
#     `queryCheck` in hack/dashboards/sources.yaml that queries a metric not
#     listed here.
#
# So a dashboard that needs the CloudNativePG instance metrics, Karpenter or
# any other series a scrape does not produce FAILS the test until the metric
# source ships AND its family is added here, in the same change. (ArgoCD, cert-manager, the CloudNativePG operator, NATS and Envoy
# Gateway are scraped since 0.13.0 and listed below by exact name.)
# Do not add a family speculatively: an entry here is a claim that a store
# holds the series.
#
# A source marked `onlyWith: <name>` is held only where that optional
# component runs (node-exporter, `nodeExporter.enabled`, off by default). It
# counts for a dashboard whose catalog entry says `requires: [<name>]` (see
# hack/dashboards/sources.yaml) and for nobody else: a dashboard that does
# not declare the dependency is still held to the default install, where the
# series are absent, so a node_* query in it fails.
#
# Every series also carries `k8s_cluster_name`; many clusters share a store.
#
# Matching, per source: a metric is available when it is in `names`, or
# starts with one of `prefixes`, and is not in `deny`, and does not end in
# one of `denySuffixes` unless it is in `keep`.
sources:
  - name: every scrape target
    note: synthetic series vmagent writes for every target
    names: [up]
    prefixes: [scrape_]

  - name: kubelet and cadvisor (charts/observability-emitters, metrics.scrape.kubelet and .cadvisor)
    prefixes:
      # kubelet
      - kubelet_
      - volume_manager_
      - storage_operation_
      - rest_client_
      - go_
      - process_
      # cadvisor
      - container_
      - machine_
    # metrics.scrape.cadvisorDrop (0.9.1): what the churn drop removes, and
    # every cadvisor `_bucket` except the one it keeps.
    deny:
      - container_tasks_state
      - container_memory_failures_total
      - container_blkio_device_usage_total
    denySuffixes: [_bucket]
    keep: [go_sched_latencies_seconds_bucket]

  - name: kube-state-metrics (charts/observability-emitters, kube-state-metrics.collectors)
    note: >-
      exactly the 11 collectors of the allow-list: cronjobs, jobs, pods,
      nodes, deployments, replicasets, statefulsets, daemonsets, namespaces,
      persistentvolumeclaims, horizontalpodautoscalers. Not configmaps,
      secrets, services, endpoints, ingresses, networkpolicies or
      persistentvolumes.
    prefixes:
      - kube_cronjob_
      - kube_job_
      - kube_pod_
      - kube_node_
      - kube_deployment_
      - kube_replicaset_
      - kube_statefulset_
      - kube_daemonset_
      - kube_namespace_
      - kube_persistentvolumeclaim_

  - name: kube-state-metrics HorizontalPodAutoscaler collector (kube-state-metrics.collectors)
    note: >-
      the collector is on, but kube-state-metrics writes nothing for a kind
      the cluster holds no objects of: a store whose clusters run no
      HorizontalPodAutoscaler has none of these series. Dashboards must
      tolerate absence. (kube-state-metrics' own `kube_state_metrics_*`
      self-telemetry is NOT listed: it is served on the telemetry port, which
      no scrape reads, since `kube-state-metrics.selfMonitor` is off.)
    optional: true
    prefixes:
      - kube_horizontalpodautoscaler_

  - name: kube-state-metrics Kargo preset (kubeStateMetrics.customResources.kargo)
    note: only on installs that turn the preset on; dashboards must tolerate absence
    optional: true
    names:
      - kargo_stage_condition
      - kargo_promotion_phase

  - name: the stack's own components
    note: >-
      vmsingle, vmagent, vmalert, vmauth, victoria-logs, victoria-traces, the
      operator, the OTLP gateway and the log collector
    prefixes:
      - vm_
      - vmagent_
      - vmalert_
      - vmauth_
      - vl_
      - vt_
      - vlagent_
      - operator_
      - controller_runtime_
      - workqueue_
      - otelcol_

  - name: node-exporter (charts/observability-emitters, nodeExporter.enabled)
    onlyWith: node-exporter
    note: >-
      only where nodeExporter.enabled. The families of the collectors that
      series-exist on every Linux node: cpu, meminfo, loadavg, stat, vmstat,
      diskstats, filesystem, netdev, netclass, netstat, sockstat, tcpstat,
      udp_queues, softnet, arp, filefd, entropy, processes, time, timex,
      uname. NOT claimed although the collector runs, because the series
      exist only on some kernels or hardware: hwmon (sensors), pressure (PSI
      kernels), conntrack (nf_conntrack loaded), schedstat, cpu throttles,
      cpu frequency scaling. NOT collected at all: interrupts, systemd,
      cpufreq, thermal_zone, power_supply, cooling_device, textfile.
    names:
      - node_boot_time_seconds
      - node_context_switches_total
      - node_forks_total
      - node_intr_total
      - node_cpu_seconds_total
      - node_cpu_guest_seconds_total
      - node_load1
      - node_load5
      - node_load15
      - node_time_seconds
      - node_uname_info
      - node_arp_entries
      - node_tcp_connection_states
      - node_exporter_build_info
    prefixes:
      - node_memory_
      - node_disk_
      - node_filesystem_
      - node_network_
      - node_netstat_
      - node_sockstat_
      - node_vmstat_
      - node_softnet_
      - node_filefd_
      - node_entropy_
      - node_procs_
      - node_processes_
      - node_timex_
      - node_udp_queues
      - node_scrape_collector_

  - name: vmalert write-back
    names: [ALERTS, ALERTS_FOR_STATE]

  # -- Platform components (charts/observability-dashboards 0.13.0). Unlike the
  # families above these are listed by exact NAME, not by prefix: each entry is
  # a claim that a scrape produces the series, and a prefix such as `argocd_`
  # would claim every name upstream ever adds. The names are the ones the
  # pinned upstream dashboards read (hack/dashboards/sources.yaml) and the
  # exporter documents at that version; add a name when a dashboard reads it.
  - name: ArgoCD (ServiceMonitors argocd-application-controller-metrics, argocd-server-metrics, argocd-repo-server-metrics)
    note: >-
      from argo-cd v3.5.3 examples/dashboard.json and its operator manual's
      metrics page. The ApplicationSet controller is not scraped, so none of its
      series are listed. The go_, process_ and workqueue_ series of these jobs
      are covered by the prefixes above.
    names:
      - argocd_app_info
      - argocd_app_sync_total
      - argocd_app_reconcile_count
      - argocd_app_reconcile_bucket
      - argocd_app_k8s_request_total
      - argocd_cluster_info
      - argocd_cluster_api_resources
      - argocd_cluster_api_resource_objects
      - argocd_cluster_events_total
      - argocd_kubectl_exec_pending
      - argocd_git_request_total
      - argocd_git_request_duration_seconds_bucket
      - argocd_redis_request_total
      - grpc_server_handled_total

  - name: cert-manager (ServiceMonitor, jobs cert-manager, cainjector, webhook)
    note: >-
      the controller's certificate and ACME client series, as read by the
      cert-manager mixin v1.6.0 overview and documented in cert-manager's
      metrics reference. The ACME client families
      (certmanager_http_acme_client_*) exist only once an ACME issuer is
      used, so they are not listed; that is `acme-issuer` in
      available-labels.yaml. `certmanager_certificate_ready_status` and
      `..._expiration_timestamp_seconds` carry the Certificate's own namespace
      as `exported_namespace`, the scraped `namespace` being cert-manager's.
    names:
      - certmanager_certificate_ready_status
      - certmanager_certificate_expiration_timestamp_seconds
      - certmanager_controller_sync_call_count

  - name: CloudNativePG instances (PodMonitor on the Postgres pods, :9187)
    onlyWith: cnpg-instance-metrics
    note: >-
      the optional source `cnpg-instance-metrics` (available-labels.yaml): the
      instance exporter of each Postgres pod, scraped only where the Postgres
      cluster chart's PodMonitor selects the pods. Exactly the families the
      `cnpg-cluster` dashboard and the Fleet overview's Postgres tiles read,
      each seen on a live scrape; the exporter publishes about fifty more that
      no dashboard reads, and none of them is claimed. `cnpg_pg_settings_setting`
      is kept for eight `name`s only (block_size, effective_cache_size,
      maintenance_work_mem, max_connections, random_page_cost, seq_page_cost,
      shared_buffers, work_mem): a panel may select no other. The backup
      family is the barman-cloud plugin's.
    names:
      - cnpg_backends_max_tx_duration_seconds
      - cnpg_backends_total
      - cnpg_backends_waiting_total
      - cnpg_collector_collection_duration_seconds
      - cnpg_collector_first_recoverability_point
      - cnpg_collector_last_available_backup_timestamp
      - cnpg_collector_last_collection_error
      - cnpg_collector_pg_wal
      - cnpg_collector_pg_wal_archive_status
      - cnpg_collector_postgres_version
      - cnpg_collector_up
      - cnpg_pg_database_size_bytes
      - cnpg_pg_database_xid_age
      - cnpg_pg_extensions_update_available
      - cnpg_pg_postmaster_start_time
      - cnpg_pg_replication_in_recovery
      - cnpg_pg_replication_is_wal_receiver_up
      - cnpg_pg_replication_lag
      - cnpg_pg_replication_streaming_replicas
      - cnpg_pg_settings_setting
      - cnpg_pg_stat_archiver_archived_count
      - cnpg_pg_stat_archiver_failed_count
      - cnpg_pg_stat_archiver_seconds_since_last_archival
      - cnpg_pg_stat_checkpointer_checkpoints_req
      - cnpg_pg_stat_checkpointer_checkpoints_timed
      - cnpg_pg_stat_checkpointer_sync_time
      - cnpg_pg_stat_checkpointer_write_time
      - cnpg_pg_stat_database_blks_hit
      - cnpg_pg_stat_database_blks_read
      - cnpg_pg_stat_database_deadlocks
      - cnpg_pg_stat_database_temp_bytes
      - cnpg_pg_stat_database_tup_deleted
      - cnpg_pg_stat_database_tup_fetched
      - cnpg_pg_stat_database_tup_inserted
      - cnpg_pg_stat_database_tup_returned
      - cnpg_pg_stat_database_tup_updated
      - cnpg_pg_stat_database_xact_commit
      - cnpg_pg_stat_database_xact_rollback
      - cnpg_pg_stat_replication_flush_lag_seconds
      - cnpg_pg_stat_replication_replay_lag_seconds
      - cnpg_pg_stat_replication_write_lag_seconds
      - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp

  - name: CloudNativePG operator (PodMonitor, job cnpg-system/cnpg-cloudnative-pg)
    note: >-
      the operator's controller-runtime series only (covered by the
      controller_runtime_ and workqueue_ prefixes above). The cnpg_* families
      come from each Postgres instance's exporter, an optional source: see
      `cnpg-instance-metrics` below and in available-labels.yaml.
    names:
      - controller_runtime_reconcile_total
      - controller_runtime_reconcile_time_seconds_bucket

  - name: NATS (prometheus-nats-exporter sidecar, PodMonitor job nats/nats)
    note: >-
      -varz and -jsz=all of prometheus-nats-exporter v0.20.2, run by the NATS
      chart with metric prefix `nats` (the exporter's default is `gnatsd`, so
      the imported dashboards are rewritten: `metricPrefixRewrite` in
      sources.yaml). Every name below was checked against a live store's
      names on the job. varz series are
      the server's /varz numbers under `nats_varz_`; jsz series are named in
      the exporter's collector/jsz.go (`nats_server_`, `nats_stream_`,
      `nats_consumer_`). -connz, -routez and -subz are scraped too, but no
      dashboard reads them.
    names:
      - nats_varz_cpu
      - nats_varz_mem
      - nats_varz_in_bytes
      - nats_varz_out_bytes
      - nats_varz_in_msgs
      - nats_varz_out_msgs
      - nats_varz_connections
      - nats_varz_subscriptions
      - nats_varz_slow_consumers
      - nats_varz_jetstream_stats_storage
      - nats_varz_jetstream_stats_memory
      - nats_varz_jetstream_config_max_storage
      - nats_varz_jetstream_config_max_memory
      - nats_server_jetstream_disabled
      - nats_server_total_streams
      - nats_server_total_consumers
      - nats_stream_total_messages
      - nats_stream_total_bytes
      - nats_stream_last_seq
      - nats_consumer_delivered_consumer_seq
      - nats_consumer_num_pending
      - nats_consumer_num_ack_pending

  - name: Envoy Gateway controller (PodMonitor, job envoy-gateway-system/envoy-gateway, /metrics)
    note: >-
      the controller families envoyproxy/gateway v1.9.2's
      envoy-gateway-global.json reads, less the wasm_* ones (not confirmed on a
      default install).
      `watchable_panics_recovered_total` is a counter created on the first
      panic, so a healthy store does not hold it: it is listed under
      `absentOk` and its one panel is written `... or vector(0)`, so absence
      reads as 0. `absentOk` names are allowed to be missing from a live store
      (hack/dashboards/verify-live.sh skips them); nothing else is.
    absentOk:
      - watchable_panics_recovered_total
    names:
      - watchable_depth
      - watchable_panics_recovered_total
      - watchable_subscribe_total
      - watchable_subscribe_duration_seconds_bucket
      - watchable_subscribe_duration_seconds_sum
      - status_update_total
      - status_update_duration_seconds_bucket
      - status_update_duration_seconds_sum
      - status_update_duration_seconds_count
      - xds_snapshot_create_total
      - xds_snapshot_update_total
      - xds_stream_duration_seconds_bucket
      - xds_stream_duration_seconds_sum
      - resource_apply_total
      - resource_apply_duration_seconds_bucket
      - resource_apply_duration_seconds_sum
      - resource_apply_duration_seconds_count
      - resource_delete_total
      - resource_delete_duration_seconds_bucket
      - resource_delete_duration_seconds_sum
      - resource_delete_duration_seconds_count

  - name: Envoy proxies (PodMonitor, job envoy-gateway-system/envoy-proxy, /stats/prometheus)
    note: >-
      exactly the proxies' `keep` list: the families read by envoyproxy/gateway
      v1.9.2's envoy-proxy-global.json and envoy-clusters.json, plus
      envoy_http_downstream_rq_xx (the Fleet overview's 5xx tile), less the
      families Envoy creates only when the feature is used
      (envoy_tcp_downstream_*: `envoy-tcp-listeners`;
      envoy_cluster_outlier_detection_*: `envoy-outlier-detection`).
    names:
      - envoy_server_live
      - envoy_server_uptime
      - envoy_server_memory_allocated
      - envoy_server_memory_heap_size
      - envoy_http_downstream_rq_total
      - envoy_http_downstream_rq_xx
      - envoy_http_downstream_rq_time_bucket
      - envoy_http_downstream_cx_total
      - envoy_http_downstream_cx_rx_bytes_total
      - envoy_http_downstream_cx_tx_bytes_total
      - envoy_listener_downstream_cx_active
      - envoy_listener_ssl_certificate_expiration_unix_time_seconds
      - envoy_cluster_upstream_rq_total
      - envoy_cluster_upstream_rq_xx
      - envoy_cluster_upstream_rq_time_bucket
      - envoy_cluster_upstream_cx_total
      - envoy_cluster_upstream_cx_active
      - envoy_cluster_upstream_cx_rx_bytes_total
      - envoy_cluster_upstream_cx_tx_bytes_total
      - envoy_cluster_membership_total
      - envoy_cluster_membership_healthy
      - envoy_cluster_membership_degraded
      - envoy_cluster_membership_excluded

# Families that do NOT exist yet and must not be queried by a shipped
# dashboard. Not read by the code; here so a reviewer sees the boundary.
absent:
  - node-exporter (node_*) on an install that leaves `nodeExporter.enabled` off, and, even where it is on, the families its source above does not claim
  - CloudNativePG instance metrics (cnpg_*, barman_cloud_*) on an install that does not scrape the instances, and, even where it does, the families its source above does not claim
  - NATS exporter families other than varz and jsz (nats_connz_*, nats_routez_*, nats_subz_* are scraped but no dashboard reads them; nats_healthz_* needs -healthz, not enabled)
  - Envoy families outside the proxies' scrape keep list
  - Karpenter (karpenter_*)
  - Kargo's own promotion and stage series (kargo_promotions_*, kargo_stages_by_ready_reason: v1.12 and later)
  - kube-state-metrics kinds outside the 11 collectors (kube_configmap_*, kube_secret_*, kube_service_*, kube_endpoint_*, kube_ingress_*, kube_networkpolicy_*)
