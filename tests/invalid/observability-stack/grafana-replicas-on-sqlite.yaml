# expect: SQLite is a file on one pod
tenancy:
  # The trace store is enabled by default and `tenancy.principals` is
  # set below, so without this the trace-tenancy refusal fires first
  # (see docs/safety.md). Not the fixture's own check.
  allowUnfilteredTraceReads: true
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# Two replicas on Grafana's default database, which is a SQLite file on
# the pod. Either each replica holds its own dashboards, or they share
# one ReadWriteOnce volume and collide: the console answers 500
# `database is locked` on whichever request loses, while the rest of the
# UI keeps working.
grafana:
  enabled: true
  replicas: 2
  admin:
    existingSecret: example-grafana
  grafana.ini:
    database:
      locking_attempt_timeout_sec: 120

# `alertmanager.enabled` defaults to true, and with no `notifications`
# receiver configured that refusal fires before this fixture ever
# reaches its own check (see docs/safety.md). This is the minimum
# receiver that satisfies it, so the fixture is preempted no further.
notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
