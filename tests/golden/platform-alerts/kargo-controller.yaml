---
# Source: platform-alerts/templates/vmrule.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: platform-alerts.kargo
      interval: 1m
      rules:
        # A Kargo Stage stuck on a promotion error.
        #
        # `kargo_stage_condition` is a gauge kube-state-metrics' own
        # customResourceState feature exports from the Stage's own
        # `.status.conditions`: 1 while the condition named by `type` and
        # `reason` is True, 0 while it is False or Unknown. This chart
        # does not configure that feature — see docs/kube-state-metrics.md
        # for the config that produces it.
        - alert: KargoStagePromotionErrored
          expr: >-
            kargo_stage_condition{type="Ready", reason="LastPromotionErrored"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Kargo Stage {{ $labels.namespace }}/{{ $labels.stage }} has not recovered from a promotion error"
            description: >-
              The Stage's Ready condition has read LastPromotionErrored for 15m.
              Re-promote the Freight from the Kargo UI or CLI once the underlying
              failure is fixed; the Stage will not retry itself.
            runbook_url: "https://runbooks.example.com/KargoStagePromotionErrored"
        # The same failure, corroborated by the Promotion object itself.
        #
        # `kargo_promotion_phase` is a StateSet over Pending, Running,
        # Succeeded, Failed, Errored and Aborted: 1 on the Promotion's
        # current phase, 0 on every other. Joining on (namespace, stage)
        # against the Stage condition above is what tells an Errored
        # promotion whose Stage has already recovered (a retry that
        # succeeded since) apart from one still stuck.
        - alert: KargoPromotionErrored
          expr: >-
            kargo_promotion_phase{phase="Errored"} == 1
            and on (k8s_cluster_name, namespace, stage) kargo_stage_condition{type="Ready", reason="LastPromotionErrored"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Kargo Promotion {{ $labels.namespace }}/{{ $labels.promotion }} errored and its Stage has not recovered"
            description: >-
              The Promotion has sat in the Errored phase for 15m and its
              Stage still reads LastPromotionErrored. Re-promote the Freight from
              the Kargo UI or CLI once the underlying failure is fixed.
            runbook_url: "https://runbooks.example.com/KargoPromotionErrored"
        # The deadman for the two rules above.
        #
        # Same shape as the write-path deadman: a rule that reads
        # `kargo_stage_condition` or `kargo_promotion_phase` cannot itself
        # notice those series going away, because it evaluates to nothing
        # rather than to a value it could compare. Either kube-state-metrics'
        # `customResourceState` config for Kargo's CRDs was never applied,
        # was edited away, or the whole scrape went dark — every case the
        # two rules above go silent right along with it.
        - alert: KargoStateMetricsAbsent
          expr: >-
            absent(kargo_stage_condition{type="Ready"}) or absent(kargo_promotion_phase)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "kube-state-metrics has not exported Kargo's own Stage/Promotion metrics for 30m"
            description: >-
              Neither kargo_stage_condition{type="Ready"} nor
              kargo_promotion_phase has been seen in 30m, so
              KargoStagePromotionErrored and KargoPromotionErrored cannot fire
              even if a promotion is stuck. Check kube-state-metrics'
              customResourceState config against docs/kube-state-metrics.md, and
              that the scrape itself is still up.
            runbook_url: "https://runbooks.example.com/KargoStateMetricsAbsent"
        # No Kargo controller is reporting.
        #
        # Nothing promotes while the controller is down, and the Stage and
        # Promotion series above are written by kube-state-metrics from the
        # objects, so they stay green. `absent(up == 1)` covers both a
        # controller whose scrape reads 0 and one that is not scraped at
        # all.
        - alert: KargoControllerAbsent
          expr: >-
            absent(up{job="kargo-controller-metrics"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No Kargo controller has answered its metrics scrape for 5m"
            description: >-
              up{job="kargo-controller-metrics"} has not been 1 in 5m: the Kargo
              controller is down, crash-looping or no longer scraped, so no
              Promotion is being executed. Check the controller's pod and its
              ServiceMonitor.
            runbook_url: "https://runbooks.example.com/KargoControllerAbsent"
        # Reconciles that ended in an error, per controller loop.
        #
        # `controller_runtime_reconcile_errors_total` is pre-initialised at 0
        # for every loop, so `increase` sees the first error too. `for` equal
        # to the window means one isolated error never fires: errors must keep
        # arriving.
        - alert: KargoControllerReconcileErrors
          expr: >-
            sum by (k8s_cluster_name, controller) (
              increase(controller_runtime_reconcile_errors_total{job="kargo-controller-metrics"}[15m])
            ) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Kargo controller loop {{ $labels.controller }} keeps failing to reconcile"
            description: >-
              The {{ $labels.controller }} loop of the Kargo controller has
              recorded reconcile errors for 15m. The objects it
              owns are not converging: read the controller's log for the
              resource and the error.
            runbook_url: "https://runbooks.example.com/KargoControllerReconcileErrors"
        # A work queue that does not drain.
        #
        # `workqueue_depth` is the items waiting. A queue is rarely empty
        # for an instant, so only depth above zero for the whole `for` counts:
        # the controller is slower than the changes arriving, or stuck.
        - alert: KargoControllerWorkqueueStuck
          expr: >-
            max by (k8s_cluster_name, name) (workqueue_depth{job="kargo-controller-metrics"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Kargo work queue {{ $labels.name }} has not drained for 30m"
            description: >-
              The work queue {{ $labels.name }} of the Kargo controller has
              held items for 30m: reconciles are slower than changes
              arrive, or a worker is stuck. Compare with the controller's CPU
              and its reconcile errors.
            runbook_url: "https://runbooks.example.com/KargoControllerWorkqueueStuck"
