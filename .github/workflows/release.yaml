# Tag-triggered release — the shared implementation.
#
# The caller grants the permissions because a reusable workflow can narrow
# them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse than
# a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@30b989fdd77b99af4be1a4b04e6353aa58aa3923 # v3.21.0
    with:
      # goreleaser builds cmd/alert-ingress's and cmd/mcp-aggregator's images
      # (see .goreleaser.yaml) and cuts the GitHub release + changelog; every chart below is then
      # packaged at the tag's version and pushed to
      # oci://ghcr.io/truvity/charts/<name>.
      charts: '["observability-crds", "observability-emitters", "observability-stack", "platform-alerts", "alert-ingress", "observability-dashboards", "observability-grafana", "observability-mcp", "observability-rum"]'
      # ko names each image after its cmd directory
      # (base_import_paths in .goreleaser.yaml), so this nests them as
      # ghcr.io/truvity/observability/alert-ingress and
      # .../mcp-aggregator — the repositories charts/alert-ingress and
      # charts/observability-mcp default to.
      ko-docker-repo: ghcr.io/truvity/observability
