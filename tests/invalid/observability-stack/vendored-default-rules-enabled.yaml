# expect: defaultRules.enabled: false
# The vendored sync job's rule sources, turned back on.
#
# `create: false` alone never disabled them: the sync job's own gate is
# `defaultRules.enabled` OR `defaultRules.create`, and with `enabled`
# explicitly true here (or merely left at upstream's own default), every
# rule source with no per-source override is fetched and applied
# directly to the cluster — including kube-prometheus's own combined
# rule manifest, whose `general.rules` group carries a `Watchdog` alert
# duplicating this chart's own. This chart ships `enabled: false`
# itself; this fixture is what happens when an install overrides it back.
victoria-metrics-k8s-stack:
  defaultRules:
    enabled: true
