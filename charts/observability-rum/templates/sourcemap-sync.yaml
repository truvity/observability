{{- $c := .Values.global.observabilityRum -}}
{{- $s := $c.sourcemaps.sync -}}
{{- if $s.enabled }}
{{- /*
A read-only copy of one object-store prefix, served to Alloy over HTTP
inside the cluster. Why a Deployment of its own and not a sidecar of the
Alloy pod: the Alloy subchart cannot be given a per-release container (its
pod spec takes no templates), and a mount per app would mean the estate
writing the volumes this chart exists to write. Alloy's `location` accepts a
base URL as well as a directory, so the receivers read these maps over the
Service below.

Credentials: none in this chart. The pod's ServiceAccount carries the cloud
identity (Pod Identity binds by the ServiceAccount's name; IRSA by the
annotation under `sync.serviceAccount.annotations`), and the role it maps to
needs read on the prefix and nothing else. The sync only ever reads.

Layout in the bucket: <prefix>/<app>/<release>/<path>.map .
*/ -}}
{{- $full := include "observability-rum.fullname" . -}}
{{- $src := printf "s3://%s%s" $s.bucket (ternary (printf "/%s" $s.prefix) "" (ne ($s.prefix | default "") "")) -}}
{{- $labels := include "observability-rum.labels" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-sourcemaps
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with $s.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-sourcemaps
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-sourcemaps
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-sourcemaps
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: {{ $s.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-sourcemaps
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-sourcemaps
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $full }}-sourcemaps
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Copies the prefix into the shared volume, forever, `--delete` so a
        # removed object disappears. It only reads from the bucket.
        - name: sync
          image: {{ $s.syncImage.repository }}:{{ $s.syncImage.tag }}{{ with $s.syncImage.digest }}@{{ . }}{{ end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                aws s3 sync "{{ $src }}" /maps --delete --only-show-errors{{ with $s.endpointUrl }} --endpoint-url "{{ . }}"{{ end }} || echo "sync failed; retrying in {{ $s.interval }}" >&2
                sleep {{ $s.interval }}
              done
          env:
            - name: HOME
              value: /tmp
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            {{- with $s.region }}
            - name: AWS_REGION
              value: {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - name: maps
              mountPath: /maps
            - name: tmp
              mountPath: /tmp
        # Serves the volume to Alloy, read-only, on the pod network only.
        - name: serve
          image: {{ $s.serveImage.repository }}:{{ $s.serveImage.tag }}{{ with $s.serveImage.digest }}@{{ . }}{{ end }}
          command: ["httpd", "-f", "-p", "8080", "-h", "/maps"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - name: maps
              mountPath: /maps
              readOnly: true
      volumes:
        - name: maps
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# Only the Alloy pods may read the maps.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-sourcemaps
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-sourcemaps
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "observability-rum.alloySelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
