# expect: there is nothing for it to narrow
# metricsQueryOnly narrows the metrics route; with routes excluding metrics it means nothing.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: example-app
      groups: [example:example-app]
      workload: {routes: [logs], metricsQueryOnly: true}
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]


victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
