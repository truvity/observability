# expect: has neither `reach.wholeStore: true` nor `reach.clusters`
# An empty reach is refused, never read as everything or as nothing.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: viewers
      groups: [example:viewers]
      reach: {}

victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
