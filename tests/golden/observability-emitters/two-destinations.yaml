apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: observability-emitters
  labels:
    app.kubernetes.io/name: observability-emitters
    app.kubernetes.io/instance: observability-emitters
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-emitters
spec:
  disableSelfServiceScrape: true
  globalScrapeMetricRelabelConfigs:
  - action: labeldrop
    regex: exported_(tenant|env)
  image:
    repository: victoriametrics/vmagent
    tag: v1.152.0
  inlineScrapeConfig: |
    - job_name: kubelet
      scheme: https
      honor_labels: false
      kubernetes_sd_configs:
        - role: node
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: env
          replacement: "example"
        - target_label: tenant
          replacement: "infra"
    - job_name: cadvisor
      scheme: https
      honor_labels: false
      metrics_path: /metrics/cadvisor
      kubernetes_sd_configs:
        - role: node
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: env
          replacement: "example"
        - target_label: tenant
          replacement: "infra"
  overrideHonorLabels: true
  remoteWrite:
  - bearerTokenSecret:
      key: token
      name: example-write-token
    url: https://metrics-a.example/api/v1/write
  - bearerTokenSecret:
      key: token
      name: example-write-token
    url: https://metrics-b.example/api/v1/write
  replicaCount: 1
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "1"
      memory: 1Gi
  scrapeClasses:
  - attachMetadata:
      namespace: true
    default: true
    name: tenancy
    relabelConfigs:
    - replacement: example
      target_label: env
    - replacement: infra
      target_label: tenant
    - regex: (.+)
      replacement: $1
      source_labels:
      - __meta_kubernetes_namespace_label_tenancy_example_com_layer
      target_label: tenant
    - regex: (.+)
      replacement: $1
      source_labels:
      - __meta_kubernetes_namespace_label_tenancy_example_com_project
      target_label: tenant
  scrapeInterval: 30s
  selectAllByDefault: true
  statefulMode: true
