# expect: contradict
# `none: true` beside a header name.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
karma:
  enabled: true
  authentication:
    none: true
    header:
      name: X-Auth-Request-Email
