# expect: `backup.logs.enabled` or `backup.traces.enabled` is also true
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# `backup.logs.enabled` defaults to `true` and is NOT turned off here —
# the exact silent trap this fixture is named for: `credentialProcess`
# is wired into the metrics job's vmbackup container only.
backup:
  enabled: true
  destination: s3://example-backups/observability
  auth:
    mode: credentialProcess
    credentialProcess:
      command: /var/run/backup-tools/broker exchange
      toolsImage:
        repository: example.com/mirror/broker
        tag: "1.0.0"

notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
