apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts-upstream-node-rules
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: recording
spec:
  groups:
    - name: node.rules
      rules:
      - expr: topk(1, max(label_replace(kube_pod_info{job="kube-state-metrics",node!=""},
          "pod", "$1", "pod", "(.*)")) by(k8s_cluster_name,node,namespace,pod)) by(k8s_cluster_name,namespace,pod)
        record: 'node_namespace_pod:kube_pod_info:'
      - expr: count(node_cpu_seconds_total{mode="idle",job="node-exporter"} * on(k8s_cluster_name,namespace,pod)
          group_left(node) topk(1, node_namespace_pod:kube_pod_info:) by(k8s_cluster_name,namespace,pod))
          by(k8s_cluster_name,node)
        record: node:node_num_cpu:sum
      - expr: sum(node_memory_MemAvailable_bytes{job="node-exporter"} or (((node_memory_Buffers_bytes{job="node-exporter"}
          + node_memory_Cached_bytes{job="node-exporter"}) + node_memory_MemFree_bytes{job="node-exporter"})
          + node_memory_Slab_bytes{job="node-exporter"})) by(k8s_cluster_name)
        record: :node_memory_MemAvailable_bytes:sum
      - expr: avg(sum(rate(node_cpu_seconds_total{mode!="idle",mode!="iowait",mode!="steal",job="node-exporter"}[5m]))
          without(mode)) by(k8s_cluster_name,node)
        record: node:node_cpu_utilization:ratio_rate5m
      - expr: avg(node:node_cpu_utilization:ratio_rate5m) by(k8s_cluster_name)
        record: cluster:node_cpu:ratio_rate5m

