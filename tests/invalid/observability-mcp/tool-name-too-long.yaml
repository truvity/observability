# expect: a tool name must match
# An exposed name past 64 characters is dropped by clients.
issuerURL: https://issuer.example.com
proxy:
  image:
    tag: v0.0.1
upstreams:
  victoriametrics:
    tools: [query, this_tool_name_is_far_too_long_to_be_exposed_with_a_prefix_in_front_of_it]
stores:
  - name: primary
    resourceURL: https://mcp.example.com/victoria/primary
    vmauth: {url: "http://vmauth.monitoring.svc:8427"}
    outbound:
      tokenEndpoint: https://issuer.example.com/token
      clientId: observability-mcp-primary
      audience: primary-store
networkPolicy:
  ingressFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateway}}
  egress:
    issuer: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: issuer}}}]
    vmauth: [{podSelector: {matchLabels: {app.kubernetes.io/name: vmauth}}}]
    grafana: [{podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}}]
