# Source: observability-alerting/templates/vmalertmanager.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: observability-stack
  labels:
    app.kubernetes.io/name: stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  replicaCount: 2
  podDisruptionBudget:
    maxUnavailable: 1
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: observability-stack
                app.kubernetes.io/name: vmalertmanager
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: observability-stack
          app.kubernetes.io/name: vmalertmanager
  extraArgs:
    cluster.reconnect-timeout: "5m"
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      cpu: "2"
      memory: 512Mi
    requests:
      cpu: "2"
      memory: 512Mi
  selectAllByDefault: false
  disableSelfServiceScrape: true
  volumes:
    - name: watchdog
      secret:
        secretName: "example-watchdog-receiver"
    - name: notifications-slack-acme
      secret:
        secretName: "example-slack-bot"
    - name: notifications-webhook-status-page
      secret:
        secretName: "example-status-webhook"
  volumeMounts:
    - name: watchdog
      mountPath: /etc/alertmanager/watchdog
      readOnly: true
    - name: notifications-slack-acme
      mountPath: /etc/alertmanager/notifications-slack-acme
      readOnly: true
    - name: notifications-webhook-status-page
      mountPath: /etc/alertmanager/notifications-webhook-status-page
      readOnly: true
  configRawYaml: |
    route:
      # `notifications-none` is a receiver with no configs: Alertmanager
      # accepts that as a legitimate "do not send" target. It is the root
      # receiver and the catch-all for a severity this chart's routing
      # tree does not know (there is deliberately no `info` route — see
      # docs/notifications.md), never a route somebody forgot to write.
      receiver: notifications-none
      group_by:
        - alertname
        - k8s_cluster_name
        - k8s_namespace_name
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 2h
      routes:
        # The Slack delivery self-alert, before everything else and with
        # `continue: false`: it says Slack is not delivering, so it must
        # never be routed to Slack, and no route below may claim it.
        # `notifications.slack.failureReceiver` names where it goes; unset,
        # it goes to the null receiver (docs/notifications.md).
        - receiver: notifications-none
          matchers:
            - alertname = "SlackNotificationsFailing"
          continue: false
        # The heartbeat, first and matched on its own: it must never be
        # grouped with anything, never inhibited and never silenced by a
        # rule written for a real alert.
        - receiver: watchdog
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 2m
        - match: {}
          receiver: notifications-none
          continue: true
          routes:
            - match:
                k8s_cluster_name: example-cluster
              receiver: notifications-none
              routes:
                - match:
                    severity: critical
                  receiver: slack-acme--alerts-example-cluster
                - match:
                    severity: warning
                  receiver: slack-acme--alerts-example-cluster
            - match:
                k8s_namespace_name: example-app
              receiver: notifications-none
              routes:
                - match:
                    severity: critical
                  receiver: slack-acme--example-app
                - match:
                    severity: warning
                  receiver: slack-acme--alerts
            - match:
                severity: critical
              receiver: slack-acme--alerts-critical
            - match:
                severity: warning
              receiver: slack-acme--alerts
        - match:
            customer_facing: "true"
            severity: critical
          receiver: status-page
          continue: true
    receivers:
      - name: notifications-none
      - name: slack-acme--alerts
        slack_configs:
          - channel: "#alerts"
            app_token_file: /etc/alertmanager/notifications-slack-acme/token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://alerts.example.com/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://alerts.example.com/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ if .Annotations.runbook }}Runbook: https://runbooks.example/{{ .Annotations.runbook }}
              {{ end }}
              {{ end }}
      - name: slack-acme--alerts-critical
        slack_configs:
          - channel: "#alerts-critical"
            app_token_file: /etc/alertmanager/notifications-slack-acme/token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://alerts.example.com/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://alerts.example.com/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ if .Annotations.runbook }}Runbook: https://runbooks.example/{{ .Annotations.runbook }}
              {{ end }}
              {{ end }}
      - name: slack-acme--alerts-example-cluster
        slack_configs:
          - channel: "#alerts-example-cluster"
            app_token_file: /etc/alertmanager/notifications-slack-acme/token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://alerts.example.com/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://alerts.example.com/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ if .Annotations.runbook }}Runbook: https://runbooks.example/{{ .Annotations.runbook }}
              {{ end }}
              {{ end }}
      - name: slack-acme--example-app
        slack_configs:
          - channel: "#example-app"
            app_token_file: /etc/alertmanager/notifications-slack-acme/token
            send_resolved: true
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }} on {{ or .CommonLabels.k8s_cluster_name .CommonLabels.source }}{{ if .CommonLabels.k8s_namespace_name }}/{{ .CommonLabels.k8s_namespace_name }}{{ end }}'
            title_link: 'https://alerts.example.com/?var-cluster={{ .CommonLabels.k8s_cluster_name | urlquery }}{{ if .CommonLabels.k8s_namespace_name }}&var-namespace={{ .CommonLabels.k8s_namespace_name | urlquery }}{{ end }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }} · <https://alerts.example.com/?var-cluster={{ .Labels.k8s_cluster_name | urlquery }}{{ if .Labels.k8s_namespace_name }}&amp;var-namespace={{ .Labels.k8s_namespace_name | urlquery }}{{ end }}|Grafana>
              {{ if .Annotations.runbook }}Runbook: https://runbooks.example/{{ .Annotations.runbook }}
              {{ end }}
              {{ end }}
      - name: status-page
        webhook_configs:
          - url_file: /etc/alertmanager/notifications-webhook-status-page/url
            send_resolved: true
      - name: watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/watchdog/url
            send_resolved: false
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
          - k8s_cluster_name =~ ".+"
          - k8s_namespace_name =~ ".+"
        target_matchers:
          - severity = "warning"
        equal:
          - k8s_cluster_name
          - k8s_namespace_name

