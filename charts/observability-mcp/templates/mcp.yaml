{{- include "observability-mcp.validate" . -}}
{{- range $s := .Values.stores }}
{{- $ctx := dict "root" $ "name" $s.name "kind" "store" "s" $s
      "resourceURL" $s.resourceURL "scope" ($s.scope | default "openid")
      "target" $s.vmauth.url
      "tokenEndpoint" $s.outbound.tokenEndpoint "clientId" $s.outbound.clientId "audience" $s.outbound.audience
      "replicaCount" ($s.replicaCount | default 1) }}
{{ include "observability-mcp.connector" $ctx }}
{{- end }}
{{- if .Values.grafana.enabled }}
{{- $g := .Values.grafana }}
{{- $ctx := dict "root" $ "name" "grafana" "kind" "grafana" "s" $g
      "resourceURL" $g.resourceURL "scope" ($g.scope | default "openid")
      "target" $g.url
      "tokenEndpoint" $g.outbound.tokenEndpoint "clientId" $g.outbound.clientId "audience" $g.outbound.audience
      "replicaCount" ($g.replicaCount | default 1) }}
{{ include "observability-mcp.connector" $ctx }}
{{- end }}
