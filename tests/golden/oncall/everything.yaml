# Source: oncall/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oncall-telegram-relay
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: telegram-relay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oncall
      app.kubernetes.io/instance: oncall
      app.kubernetes.io/component: telegram-relay
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # GoAlert only: the relay is no one else's webhook.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oncall
              app.kubernetes.io/instance: oncall
              app.kubernetes.io/component: goalert
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 9090
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
  egress:
    # DNS. With no `networkPolicy.dns`, port 53 to any destination.
    - to:
        - ipBlock:
            cidr: 10.100.0.0/16
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The Telegram Bot API, HTTPS to anywhere: its addresses are not a
    # CIDR anyone publishes as stable.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443


