# expect: `vmalertAPI: true` but its `routes`
# vmalertAPI on a principal with no metrics route.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  allowUnfilteredAlertReads: true
  identities:
  - groups:
    - example:observability-mcp:reader
    audience: example-mcp-reader
    workload:
      routes:
      - logs
      vmalertAPI: true
    reach:
      clusters:
      - cluster: example-cluster
        allNamespaces: true
  - groups:
    - example:k8s:viewer
    workload:
      routes:
      - metrics
    reach:
      clusters:
      - cluster: example-cluster
        namespaces:
        - example-app
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
