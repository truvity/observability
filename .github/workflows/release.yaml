# Tag-triggered release — the shared implementation.
#
# The caller grants the permissions because a reusable workflow can narrow
# them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse than
# a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@b38472fac2bff567c7b138654cebc7da485170ca # v3.26.1
    with:
      # goreleaser also builds the Lambda layer zips (cmd/otlp-lambda), attached to
      # the release beside checksums.txt.
      # goreleaser builds cmd/alert-ingress's, cmd/mcp-aggregator's and cmd/tenancy-authz's images
      # (see .goreleaser.yaml) and cuts the GitHub release + changelog; every chart below is then
      # packaged at the tag's version and pushed to
      # oci://ghcr.io/truvity/charts/<name>.
      # Keep observability-cluster LAST. Kargo's Warehouse watches that chart, and the
      # shared publish-charts action pushes in list order, so the Freight appears only
      # once every chart is published. tests/release_chart_order_test.go enforces it.
      charts: '["observability-crds", "observability-emitters", "observability-stack", "platform-alerts", "alert-ingress", "observability-dashboards", "observability-grafana", "observability-mcp", "observability-rum", "observability-projects", "observability-portal", "observability-alerting", "observability-cluster"]'
      # ko names each image after its cmd directory
      # (base_import_paths in .goreleaser.yaml), so this nests them as
      # ghcr.io/truvity/observability/alert-ingress and
      # .../mcp-aggregator and .../tenancy-authz — the repositories
      # charts/alert-ingress, charts/observability-mcp and
      # charts/observability-stack default to.
      ko-docker-repo: ghcr.io/truvity/observability
      # .goreleaser.yaml's dockers_v2 also builds the portal's nginx image
      # (apps/portal) with a Dockerfile, to .../portal at the same tag.
