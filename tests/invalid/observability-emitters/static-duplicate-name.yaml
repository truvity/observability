# expect: has two entries named
# Two static targets with one name would be one VMStaticScrape and one `job` label.


global:
  cluster:
    dnsDomain: cluster.example.
metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
  scrape:
    static:
    - name: example-watcher
      targets:
      - watcher.example.private:80
    - name: example-watcher
      targets:
      - other.example.private:80
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
