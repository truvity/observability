# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
# It also proves the chart renders on a cluster that does not use the
# default — an estate on the default sees exactly this one difference.
global:
  cluster:
    dnsDomain: cluster.example.

# Every value set away from its default, so a change to any one of them
# shows up in the golden diff.
nameOverride: stack
ha: true
zones:
  - example-1a
  - example-1b
interval: 15s

vmauth:
  image:
    repository: victoriametrics/vmauth
    tag: v1.153.0
  replicaCount: 2
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi
  extraArgs:
    logInvalidAuthTokens: "true"
    maxConcurrentRequests: "500"
  loadBalancingPolicy: first_available
  retryStatusCodes: [500, 502, 503]

tenancy:
  issuerUrl: https://issuer.example
  # Deliberately a client id with a dot and an `@` in it, and not the
  # value the other cases use. Two things are proved in the render
  # beside this file: that the pin is an input rather than a constant in
  # the template, and that a client id an issuer assigned is ESCAPED
  # into the pin — `.` is a wildcard to the regular-expression engine
  # vmauth compiles that value with, and it appears in the output as
  # `\.`, matching itself and nothing else.
  audience: example-client.example@example-project
  claimName: entitlements
  # On: this case is the one that sets everything, and it is where the
  # golden proves the metric-metadata route is admitted only on the
  # READER rows and never on the writer's. Every other case leaves it
  # off, which is where the golden proves the route is absent by default.
  allowUnfilteredMetricMetadata: true
  # Deliberately none of the defaults, on both paths: the keys are inputs
  # for an estate whose collectors were not built here, and this case
  # exists to prove they reach the rendered filter rather than being a
  # constant somewhere in the template.
  clusterLabel: cell
  namespaceLabel: ns
  logsClusterField: k8s.cell
  logsNamespaceField: kubernetes.namespace_name
  principals:
    # A group with dots in it, for the same reason: identity providers
    # name populations with dots and this is where the render is checked
    # for the escaping that makes such a name match only itself.
    - group: example.k8s.viewers
      grants:
        - cluster: other-cluster
          namespaces: [example-app, other-app]
        - cluster: example-cluster
          allNamespaces: true
  writers:
    - name: otel-collector
      tokenSecret:
        name: example-writer-token
        key: token
      destinations: [metrics, logs, traces]

storeCredentials:
  secretName: example-store-credentials
  usernameKey: user
  passwordKey: pass

vmalert:
  externalUrl: https://alerts.example.com
  externalLabels:
    cluster: example
  logs:
    enabled: true
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi

alertmanager:
  replicaCount: 2
  watchdog:
    secretName: example-watchdog-receiver
    key: url
    repeatInterval: 2m
    # The far end (docs/statusbox.md's gatus-ops) is configured with a
    # longer heartbeat.interval than this; stating it here is what lets
    # the chart refuse a repeatInterval that would not land inside it.
    timeout: 10m
  resources:
    requests:
      cpu: "2"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 512Mi

# Every receiver kind, a project that names both severities, a project
# that names only `critical` (proving its warnings fall back to
# `severities.warning`), and the webhook bridge — the shape golden proves
# every field in docs/notifications.md against.
#
# `externalUrl` is set here to the SAME value as `vmalert.externalUrl`
# above — the chart refuses if the two disagree, and this case is where
# the golden proves it renders cleanly when a consumer states the one
# fact in both places and gets it right. `single` proves the default.
notifications:
  externalUrl: https://alerts.example.com
  runbookBaseUrl: https://runbooks.example/
  groupWait: 10s
  groupInterval: 2m
  repeatInterval: 2h
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  webhook:
    - name: status-page
      urlSecret: {name: example-status-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
  routes:
    - match: {k8s_cluster_name: example-cluster}
      critical: "#alerts-example-cluster"
      warning: "#alerts-example-cluster"
    - match: {k8s_namespace_name: example-app}
      critical: "#example-app"
  also:
    - receiver: status-page
      match: {severity: critical, customer_facing: "true"}

networkPolicy:
  enabled: true
  proxyFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: example-console
  writersFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: example-collectors

backup:
  enabled: true
  destination: ":s3,env_auth=true:example-backups/observability"
  credentialsSecret: example-backup-credentials
  activeDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  image:
    repository: example.com/mirror/rclone
    tag: "1.73.0"
  metrics:
    enabled: true
    schedule: "0 * * * *"
    fullSchedule: "0 2 * * 0"
    claimName: example-metrics-claim
    image:
      repository: example.com/mirror/vmbackup
      tag: v1.152.0
  logs:
    enabled: true
    schedule: "20 * * * *"
  traces:
    enabled: true
    schedule: "40 * * * *"

# Every one of the twelve rules populated — the shape golden proves every
# field in docs/notifications.md's "Store self-alerts" against, and the
# one case where every metric name below is fictional on purpose: none
# of these `example_*` names is a claim about what a real store exports.
# See values.yaml's own comment on `selfAlerts` for why none of them
# ships as a default.
selfAlerts:
  enabled: true
  ingest:
    metric: example_vm_rows_ignored_total
    window: 2m
    for: 2m
    severity: critical
  cardinality:
    hourlyCurrentSeriesMetric: example_vm_hourly_series_limit_current_series
    hourlyMaxSeriesMetric: example_vm_hourly_series_limit_max_series
    dailyCurrentSeriesMetric: example_vm_daily_series_limit_current_series
    dailyMaxSeriesMetric: example_vm_daily_series_limit_max_series
    ratio: 0.85
    severity: warning
  logStore:
    metric: example_vl_rows_dropped_total
    window: 2m
    for: 2m
    severity: critical
  traceStore:
    metric: example_vt_rows_dropped_total
    window: 2m
    for: 2m
    severity: critical
  gateway:
    queueSizeMetric: example_otelcol_exporter_queue_size
    queueCapacityMetric: example_otelcol_exporter_queue_capacity
    queueRatio: 0.75
    queueFor: 5m
    queueSeverity: warning
    exportFailedMetricPrefix: example_otelcol_exporter
    exportFailWindow: 2m
    exportFailFor: 2m
    exportFailSeverity: critical
  diskGuard:
    headroomFactor: 3
    severity: warning
    metrics:
      freeSpaceMetric: example_vm_free_disk_space_bytes
      freeSpaceLimitMetric: example_vm_free_disk_space_limit_bytes
    logs:
      freeSpaceMetric: example_vl_free_disk_space_bytes
      freeSpaceLimitMetric: example_vl_free_disk_space_limit_bytes
    traces:
      freeSpaceMetric: example_vt_free_disk_space_bytes
      freeSpaceLimitMetric: example_vt_free_disk_space_limit_bytes
  snapshotAge:
    severity: critical
    metrics:
      maxAge: 3h
    logs:
      maxAge: 90m
    traces:
      maxAge: 90m
  logStreamChurn:
    streamsCreatedMetric: example_vl_streams_created_total
    window: 10m
    maxCreatedPerWindow: 500
    severity: warning
  writer:
    bufferMetric: example_vmalert_remotewrite_pending_data_bytes
    maxBufferBytes: 104857600
    for: 15m
    droppedPacketsMetric: example_vmalert_remotewrite_packets_dropped_total
    severity: critical
  proxyConcurrency:
    limitedRequestsMetric: example_vmauth_concurrent_requests_limit_reached_total
    window: 2m
    for: 2m
    severity: warning

# Only the operator, so the golden stays about this chart. The stores'
# own renders are exercised by the `single` case.
victoria-metrics-k8s-stack:
  vmsingle:
    enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false

grafana:
  enabled: true
  replicas: 2
  admin:
    existingSecret: example-grafana
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_SECURITY_SECRET_KEY:
      secretKeyRef:
        name: example-grafana
        key: secret_key
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: example-grafana
        key: client_id
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: example-grafana
        key: client_secret
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          uid: victoriametrics
          isDefault: true
          version: 2
          url: http://vmauth-observability-stack-stack:8427/prometheus
          jsonData:
            oauthPassThru: true
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          uid: victorialogs
          version: 2
          url: http://vmauth-observability-stack-stack:8427
          jsonData:
            oauthPassThru: true
        - name: VictoriaTraces
          type: jaeger
          access: proxy
          uid: victoriatraces
          version: 2
          url: http://vmauth-observability-stack-stack:8427/select/jaeger
          jsonData:
            oauthPassThru: true
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    database:
      # Two replicas, so a database two replicas can share. On SQLite
      # this fixture describes an install that answers 500 `database is
      # locked` on whichever request loses.
      type: postgres
      host: example-pg-rw:5432
      name: grafana
      locking_attempt_timeout_sec: 300
    auth.generic_oauth:
      enabled: true
      name: SSO
      allow_sign_up: true
      use_refresh_token: true
      role_attribute_strict: true
      scopes: "openid profile email groups offline_access"
      auth_url: https://issuer.example/authorize
      token_url: https://issuer.example/token
      api_url: https://issuer.example/userinfo
    unified_alerting:
      enabled: false
    alerting:
      enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      provider:
        name: sidecar
        orgid: 1
        updateIntervalSeconds: 60
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi
