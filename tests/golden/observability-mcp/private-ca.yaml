# Source: observability-mcp/templates/mcp.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-mcp-private
  labels:
    app.kubernetes.io/name: observability-mcp
    app.kubernetes.io/instance: observability-mcp
    app.kubernetes.io/component: private
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # A rollout never takes a pod away before its replacement is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-mcp
      app.kubernetes.io/instance: observability-mcp
      app.kubernetes.io/component: private
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-mcp
        app.kubernetes.io/instance: observability-mcp
        app.kubernetes.io/component: private
        app.kubernetes.io/managed-by: Helm
      annotations:
        # The aggregator reads its file once at start.
        checksum/aggregator-config: b8662150a56a7d848edc2de0e4acae745637c6e57911571ab475db8f5530688e
    spec:
      serviceAccountName: observability-mcp-private
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The aggregator: one MCP server over the stock servers below. It
        # listens on loopback; its admin port serves /healthz, /readyz and
        # /metrics and nothing of the MCP surface. It is ready only when
        # every allowlisted tool was found, which makes the pod's readiness
        # that too.
        - name: aggregator
          image: "ghcr.io/truvity/observability/mcp-aggregator:0.0.0"
          imagePullPolicy: IfNotPresent
          args: ["-config=/etc/mcp-aggregator/config.yaml"]
          ports:
            - name: admin
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: aggregator-config
              mountPath: /etc/mcp-aggregator
              readOnly: true
        # The stock metrics server. Loopback only, no container port, no
        # credential: the only thing that can reach it is the aggregator.
        - name: upstream-metrics
          image: "ghcr.io/victoriametrics/mcp-victoriametrics:v1.20.2@sha256:bcbf84f945d6efb03fb8b2d2ccc3294420dccdc0b445752dce96f02619416dfe"
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_SERVER_MODE
              value: http
            - name: MCP_LISTEN_ADDR
              value: "127.0.0.1:8082"
            - name: VM_INSTANCE_TYPE
              value: single
            - name: VM_INSTANCE_ENTRYPOINT
              value: "http://127.0.0.1:8429/prometheus"
            - name: MCP_DISABLED_TOOLS
              value: "export,flags,metric_relabel_debug,downsampling_filters_debug,retention_filters_debug,test_rules,metric_statistics,active_queries,top_queries,tenants,documentation,prettify_query,metrics_metadata,deployments,cloud_providers,regions,tiers,access_tokens,rule_filenames,rule_file"
            - name: MCP_DISABLE_RESOURCES
              value: "true"
            - name: MCP_LOG_FORMAT
              value: json
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # The stock logs server. Loopback only, no container port, no
        # credential: the only thing that can reach it is the aggregator.
        - name: upstream-logs
          image: "ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0@sha256:753bb4fbe402ca1a782842f44636830f9895736f11d7fe783b924f8a0daf083d"
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_SERVER_MODE
              value: http
            - name: MCP_LISTEN_ADDR
              value: "127.0.0.1:8083"
            - name: VL_INSTANCE_ENTRYPOINT
              value: "http://127.0.0.1:8429"
            - name: MCP_DISABLED_TOOLS
              value: "documentation,flags"
            - name: MCP_LOG_FORMAT
              value: json
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # The stock traces server. Loopback only, no container port, no
        # credential: the only thing that can reach it is the aggregator.
        - name: upstream-traces
          image: "ghcr.io/victoriametrics-community/mcp-victoriatraces:v1.5.0@sha256:72b3227c03856048e0adcbf5d247e3ae0b6cf8ab1bc27df6fe10ed0cacdcd07c"
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_SERVER_MODE
              value: http
            - name: MCP_LISTEN_ADDR
              value: "127.0.0.1:8084"
            - name: VT_INSTANCE_ENTRYPOINT
              value: "http://127.0.0.1:8429"
            - name: MCP_DISABLED_TOOLS
              value: "documentation"
            - name: MCP_LOG_FORMAT
              value: json
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # The resource-proxy. The pod's only MCP port. Its probes are the
        # pod's for the proxy container: the stock servers listen on
        # loopback, which the kubelet cannot reach.
        - name: proxy
          image: "ghcr.io/truvity/access-roster/resource-proxy:v0.0.1"
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN
              value: ":8080"
            - name: UPSTREAM
              value: "http://127.0.0.1:8081/mcp"
            - name: ISSUER_URL
              value: "https://issuer.example.com"
            - name: RESOURCE_URL
              value: "https://mcp.example.com/victoria/private"
            - name: SCOPE
              value: "openid"
            - name: OUTBOUND_LISTEN
              value: "127.0.0.1:8429"
            - name: OUTBOUND_TARGET
              value: "https://vmauth.monitoring.svc:8427"
            - name: OUTBOUND_SA_TOKEN_FILE
              value: "/var/run/observability-mcp/sa-token"
            - name: OUTBOUND_TOKEN_ENDPOINT
              value: "https://issuer.example.com/token"
            - name: OUTBOUND_CLIENT_ID
              value: "observability-mcp-private"
            - name: OUTBOUND_AUDIENCE
              value: "private-store"
            - name: OUTBOUND_CA_FILE
              value: "/etc/observability-mcp/outbound-ca/ca.pem"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/observability-mcp
              readOnly: true
            - name: outbound-ca
              mountPath: /etc/observability-mcp/outbound-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: aggregator-config
          configMap:
            name: observability-mcp-private-aggregator
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "access-issuer"
                  expirationSeconds: 600
                  path: sa-token
        - name: outbound-ca
          configMap:
            name: "private-ca"
            items:
              - key: "ca.crt"
                path: ca.pem

