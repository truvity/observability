# expect: at '/notifications/telegram/botTokenSecret/name'
# A bot token Secret reference with an empty name: present in the values,
# mounted from nothing.

notifications:
  externalUrl: https://grafana.example
  telegram:
    botTokenSecret: {name: "", key: token}
    chatId: -1000000000001
  severities:
    critical: {receiver: telegram}
    warning: {receiver: telegram}
