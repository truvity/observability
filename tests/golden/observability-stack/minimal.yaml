apiVersion: batch/v1
kind: Job
metadata:
  name: observability-stack-victoria-metrics-k8s-stack-sync-job
  namespace: observability
  labels: 
    app.kubernetes.io/component: syncJob
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-k8s-stack
    app.kubernetes.io/version: v0.0.17
    helm.sh/chart: victoria-metrics-k8s-stack-0.93.0
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels: 
        app.kubernetes.io/component: syncJob
        app.kubernetes.io/instance: observability-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-k8s-stack
        app.kubernetes.io/version: v0.0.17
        helm.sh/chart: victoria-metrics-k8s-stack-0.93.0
    spec:
      serviceAccountName: observability-stack-victoria-metrics-k8s-stack-sync-job
      restartPolicy: OnFailure
      containers:
        - name: sync-job
          image: "ghcr.io/victoriametrics/sync-job:v0.0.17"
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE
              value: "observability-stack"
            - name: RESOURCE_PREFIX
              value: "observability-stack-victoria-metrics-k8s-stack"
            - name: PRUNE
              value: "true"
            - name: OWNER_REFERENCES
              value: "true"
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-stack-victoria-metrics-k8s-stack-sync-job-config
