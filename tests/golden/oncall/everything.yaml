# Source: oncall/templates/goalert.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-goalert
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: goalert
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oncall
      app.kubernetes.io/instance: oncall
      app.kubernetes.io/component: goalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oncall
        app.kubernetes.io/instance: oncall
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: oncall
        app.kubernetes.io/component: goalert
      annotations:
        # set-config runs at pod start only: a change to the configuration
        # in values must roll the pods to be applied.
        oncall/config-checksum: 2bfe228d3e502b3249e7f3598c88311a4ec640fca155a89d2963ba3003f76b94
    spec:
      serviceAccountName: oncall-goalert
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Declarative configuration: migrate first (set-config needs the
      # schema), then replace GoAlert's stored configuration with the
      # Secret's JSON. Every rollout re-applies it, so an edit made on the
      # admin page lasts only until the next one.
      initContainers:
        - name: migrate
          image: "docker.io/goalert/goalert@sha256:f090a90538d7e61446aad245c21a7a1694d36d7b4f6c56fc55e9cc7405d9c03f"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/goalert", "migrate"]
          env:
            - name: GOALERT_DB_URL
              value: "postgres://goalert@oncall-pg-rw.oncall.svc:5432/goalert?sslmode=verify-full&sslrootcert=/etc/oncall/db-ca/ca-certificates.crt"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "oncall-pg-app"
                  key: "password"
            - name: GOALERT_DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: "oncall-goalert-key"
                  key: "data-encryption-key"
            - name: GOALERT_JSON
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: db-ca
              mountPath: /etc/oncall/db-ca
              readOnly: true
        - name: set-config
          image: "docker.io/goalert/goalert@sha256:f090a90538d7e61446aad245c21a7a1694d36d7b4f6c56fc55e9cc7405d9c03f"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/goalert", "set-config"]
          env:
            - name: GOALERT_DB_URL
              value: "postgres://goalert@oncall-pg-rw.oncall.svc:5432/goalert?sslmode=verify-full&sslrootcert=/etc/oncall/db-ca/ca-certificates.crt"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "oncall-pg-app"
                  key: "password"
            - name: GOALERT_DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: "oncall-goalert-key"
                  key: "data-encryption-key"
            - name: GOALERT_JSON
              value: "true"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "oncall-client"
                  key: "client-secret"
            # set-config reads --data from GOALERT_DATA. `$(NAME)` in it is
            # expanded by Kubernetes from the variables above.
            - name: GOALERT_DATA
              value: "{\"General\":{\"ApplicationName\":\"On call\"},\"OIDC\":{\"ClientID\":\"oncall\",\"ClientSecret\":\"$(OIDC_CLIENT_SECRET)\",\"Enable\":true,\"IssuerURL\":\"https://issuer.example\",\"NewUsers\":true},\"Webhook\":{\"AllowedURLs\":[\"http://oncall-telegram-relay.oncall.svc:8080/v1/notify/\"],\"Enable\":true}}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: db-ca
              mountPath: /etc/oncall/db-ca
              readOnly: true
      containers:
        - name: goalert
          image: "docker.io/goalert/goalert@sha256:f090a90538d7e61446aad245c21a7a1694d36d7b4f6c56fc55e9cc7405d9c03f"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/goalert"]
          env:
            - name: GOALERT_DB_URL
              value: "postgres://goalert@oncall-pg-rw.oncall.svc:5432/goalert?sslmode=verify-full&sslrootcert=/etc/oncall/db-ca/ca-certificates.crt"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "oncall-pg-app"
                  key: "password"
            - name: GOALERT_DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: "oncall-goalert-key"
                  key: "data-encryption-key"
            - name: GOALERT_JSON
              value: "true"
            - name: GOALERT_LISTEN
              value: ":8081"
            - name: GOALERT_LISTEN_PROMETHEUS
              value: ":2112"
            - name: GOALERT_PUBLIC_URL
              value: "https://oncall.example"
            - name: GOALERT_KUBERNETES_COOLDOWN
              value: 5s
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 2112
              protocol: TCP
          # /health answers 500 while GoAlert is starting (migrations run
          # at start) or shutting down, 200 otherwise.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/oncall/db-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db-ca
          configMap:
            name: "example-private-ca"
      tolerations:
        - key: arch
          operator: Exists

