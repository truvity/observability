# The alerting plane handed to charts/observability-alerting (docs/adoption.md, 0.71.0):
# the same values as alertmanager-pair, with the switch on. The golden renders
# the stack WITHOUT the vmalerts, the VMAlertmanager, karma, the Watchdog
# rule, the store self-alerts and the Alertmanager ServiceMonitor; the
# `observability-alerting` case of the same name renders exactly those.
# An Alertmanager PAIR: replicaCount 2 renders the PodDisruptionBudget,
# the default hostname anti-affinity and zone spread on the VMAlertmanager,
# one vmalert notifier per replica (both vmalerts), and one karma server
# per replica sharing a `cluster` value.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

vmalert:
  externalUrl: https://grafana.example

notifications:
  slack:
    workspaces:
      - name: acme
        appTokenSecret: {name: example-acme-slack-bot, key: token}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}

alertmanager:
  replicaCount: 2

karma:
  enabled: true
  authentication:
    none: true

alerting:
  source: chart
