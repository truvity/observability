# expect: `vmalertAPI: true` but `vmalert.enabled` is false
# vmalertAPI with no vmalert to serve it.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  allowUnfilteredAlertReads: true
  identities:
    - name: example-app
      groups: [example:example-app]
      workload: {routes: [metrics], vmalertAPI: true}
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]

vmalert:
  enabled: false

# `alertmanager.enabled` defaults to true, and with no `notifications`
# receiver configured that refusal fires before this fixture ever reaches its
# own check (see docs/safety.md). This is the minimum receiver that satisfies it.
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
alertmanager:
  enabled: false
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
