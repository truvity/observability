{{- if .Values.tenancy.authz.enabled }}
{{- /*
tenancy-authz (`tenancy.authz`, opt-in): the Envoy external authorisation
service that unions a person's groups into one `vm_access` token. See
values.yaml and docs/tenancy-authz.md. Every refusal about it lives in
`observability-proxy.validate.tenancyAuthz`.

One component, one of each: a ServiceAccount, a ConfigMap, a Deployment, a
Service, a PodDisruptionBudget, a ServiceMonitor, the gateway's
SecurityPolicy and a NetworkPolicy; and, with `signingKey.source: eso`, the
SSHKey generator and ExternalSecret that make the signing key. No Role: the
service only reads a mounted Secret.
*/}}
{{- $root := . }}
{{- $a := .Values.tenancy.authz }}
{{- $name := include "observability-proxy.authz.name" . }}
{{- $configYaml := include "observability-proxy.authz.config" . }}
{{- $eso := eq $a.signingKey.source "eso" }}
{{- $secretName := include "observability-proxy.authz.signingSecretName" . }}
{{- $podLabels := dict
    "app.kubernetes.io/name" "tenancy-authz"
    "app.kubernetes.io/instance" (include "observability-proxy.release" .)
    "app.kubernetes.io/component" "tenancy-authz" }}
{{- $image := printf "%s:%s" $a.image.repository ($a.image.tag | default .Chart.AppVersion) }}
{{- if $a.image.digest }}{{- $image = printf "%s@%s" $image $a.image.digest }}{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
{{- /*
No API token: the service reads its key from a mounted file and talks to
the cluster API never. It holds no credential to the cluster.
*/}}
automountServiceAccountToken: false
{{- if $eso }}
---
{{- /*
The signing key, generated by External Secrets Operator: an ECDSA P-256 key
(SSHKey generator: keyType ecdsa, keySize 256; outputs `privateKey` and
`publicKey`), and an ExternalSecret that turns it into a Secret ONCE
(`refreshPolicy: CreatedOnce`) and never again, so the key does not change
unless the Secret is deleted. Deleting it is the rotation.
*/}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: SSHKey
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
spec:
  keyType: ecdsa
  keySize: 256
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: SSHKey
          name: {{ $secretName }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
data:
  config.yaml: |
    {{- $configYaml | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
spec:
  selector:
    {{- toYaml $podLabels | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
spec:
  replicas: {{ $a.replicas }}
  selector:
    matchLabels:
      {{- toYaml $podLabels | nindent 6 }}
  template:
    metadata:
      {{- /*
      The pod does NOT carry `app.kubernetes.io/part-of`: the store
      policies admit every pod of this release with that label, and this
      service reads no store.
      */}}
      labels:
        {{- toYaml $podLabels | nindent 8 }}
      annotations:
        checksum/config: {{ $configYaml | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with $a.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        {{- /* The key is mounted 0440 root:<fsGroup>: without a group the non-root user cannot read it. */}}
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- toYaml $podLabels | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- toYaml $podLabels | nindent 14 }}
      containers:
        - name: tenancy-authz
          image: {{ $image | quote }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          args:
            - -config=/etc/tenancy-authz/config.yaml
            - -listen=:8080
            - -admin-listen=:9090
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- include "observability-proxy.resources" $a.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/tenancy-authz/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- /*
            A directory mount, not a subPath: the kubelet refreshes a
            directory mount when the Secret changes, which is how a rotation
            reaches the service without a restart.
            */}}
            - name: signing-key
              mountPath: /etc/tenancy-authz/signing
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: signing-key
          secret:
            secretName: {{ $secretName | quote }}
            defaultMode: 0440
      {{- with $a.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if gt (int $a.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- toYaml $podLabels | nindent 6 }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/component: tenancy-authz
      app.kubernetes.io/instance: {{ (include "observability-proxy.release" .) }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.interval }}
{{- if $a.securityPolicy.enabled }}
---
{{- /*
Attaches the service to the read route. `extAuth.http.path` is a PREFIX: a
request to /api/v1/query is checked at /check/api/v1/query, with its own
method. `headersToBackend` lists the response headers Envoy copies onto the
request it forwards, and a header listed there REPLACES the client's own
(Envoy's `allowed_upstream_headers`): that is how the person's token is
swapped for the minted one. `failOpen: false` is the point of the whole
arrangement — an unreachable service is a refused request, never a request
that reaches vmauth carrying the person's own token.

The same fail-closed makes the ORDER matter: a policy that applies before the
Deployment is Ready (the ExternalSecret must first make the key Secret) refuses
every read through the route until it is. `securityPolicy.annotations`
defaults to an Argo CD sync wave after the rest of this component, which
Argo CD waits to be healthy. Helm has no such ordering; apply this chart in
two steps there (see docs/tenancy-authz.md).
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
  {{- with $a.securityPolicy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    {{- range $ref := $a.securityPolicy.targetRefs }}
    - group: gateway.networking.k8s.io
      kind: {{ $ref.kind }}
      name: {{ $ref.name | quote }}
    {{- end }}
  extAuth:
    failOpen: false
    headersToExtAuth:
      - authorization
    http:
      {{- /*
      group, kind and weight are the API server's defaults, written out so
      Argo CD's diff against the live object settles instead of showing them
      as drift forever.
      */}}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $name }}
          port: 8080
          weight: 1
      path: /check
      headersToBackend:
        - authorization
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
{{- /*
Ingress: the gateway (the check), vmauth (discovery and keys, to verify the
minted token) and the metrics agent (the scrape). Egress: DNS and the upstream
issuer's port. A NetworkPolicy cannot name an external issuer by selector,
so it is by port. The service reaches no cluster API.
*/}}
{{- $issuerHost := (urlParse ($a.upstreamIssuer | default .Values.tenancy.issuerUrl)).host }}
{{- $issuerPort := default (ternary "443" "80" (hasPrefix "https://" ($a.upstreamIssuer | default .Values.tenancy.issuerUrl))) (regexFind ":[0-9]+$" $issuerHost | trimPrefix ":") }}
{{- $scrapeDefault := list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "vmagent"))) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenancy-authz
spec:
  podSelector:
    matchLabels:
      {{- toYaml $podLabels | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml $a.networkPolicy.gatewayFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
              app.kubernetes.io/instance: {{ include "observability-proxy.fullname" . }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        {{- toYaml (.Values.networkPolicy.scrapeFrom | default $scrapeDefault) | nindent 8 }}
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: {{ $issuerPort | int }}
{{- end }}
{{- end }}
