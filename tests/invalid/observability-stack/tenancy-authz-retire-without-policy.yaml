# expect: `tenancy.authz.retireGroupReaders` is set but `tenancy.authz.securityPolicy.enabled` is not
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    retireGroupReaders: true
    securityPolicy:
      enabled: false
    networkPolicy:
      gatewayFrom:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: envoy}
  principals:
    - group: example:example-app:deployer
      grants:
        - cluster: cluster-a
          namespaces: [example-app]
victoria-traces-single:
  enabled: false
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
