# expect: notifications.consoleUrl is empty
# console: karma needs karma's external base URL.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
  console: karma
karma:
  enabled: true
  authentication:
    header:
      name: X-Auth-Request-Email
