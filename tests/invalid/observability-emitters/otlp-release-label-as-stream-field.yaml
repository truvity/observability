# expect: "k8s.pod.labels.app.kubernetes.io/instance", which is not one of the attributes that are constant
# The Helm release is navigation, not a key, and never a stream: it is
# constant per pod, but a stream field is a cardinality decision made at
# collection time, and the allow-list is the chart's. The attribute the
# gateway extracts it under is refused here.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
  streamFields:
  - k8s.cluster.name
  - kubernetes.pod_namespace
  - k8s.pod.labels.app.kubernetes.io/instance
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
    streamFields:
    - kubernetes.container_name
    - kubernetes.pod_name
    - kubernetes.pod_namespace
    - k8s.cluster.name
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
