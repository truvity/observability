# Source: observability-emitters/templates/vmagent.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: observability-emitters
  labels:
    app.kubernetes.io/name: emitters
    app.kubernetes.io/instance: observability-emitters
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-emitters
spec:
  disableSelfServiceScrape: true
  externalLabels:
    region: example
  extraArgs:
    promscrape.suppressScrapeErrors: "true"
  globalScrapeMetricRelabelConfigs:
  - action: labeldrop
    regex: exported_(k8s_cluster_name|k8s_namespace_name|deployment_environment_name)
  image:
    repository: victoriametrics/vmagent
    tag: v1.152.0
  inlineScrapeConfig: |
    - job_name: kubelet
      scheme: https
      honor_labels: false
      kubernetes_sd_configs:
        - role: node
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
        - source_labels: [__meta_kubernetes_node_label_topology_kubernetes_io_zone]
          target_label: topology_kubernetes_io_zone
        - source_labels: [__meta_kubernetes_node_label_node_kubernetes_io_instance_type]
          target_label: node_kubernetes_io_instance_type
        - target_label: k8s_cluster_name
          replacement: "other-cluster"
        - target_label: deployment_environment_name
          replacement: "staging"
      metric_relabel_configs:
        - source_labels: [namespace]
          regex: (.+)
          target_label: k8s_namespace_name
  overrideHonorLabels: true
  remoteWrite:
  - bearerTokenSecret:
      key: bearer
      name: example-write-token
    url: https://metrics.example/api/v1/write
  replicaCount: 2
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "2"
      memory: 2Gi
  scrapeClasses:
  - default: true
    name: tenancy
    relabelConfigs:
    - replacement: other-cluster
      target_label: k8s_cluster_name
    - replacement: staging
      target_label: deployment_environment_name
    - source_labels:
      - __meta_kubernetes_namespace
      target_label: k8s_namespace_name
    - regex: (.+)
      source_labels:
      - __meta_kubernetes_pod_label_app_kubernetes_io_instance
      target_label: app_kubernetes_io_instance
  scrapeInterval: 60s
  selectAllByDefault: true
  statefulMode: true
  statefulStorage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: example-ssd
