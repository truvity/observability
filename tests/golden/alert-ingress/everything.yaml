# Source: alert-ingress/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-ingress-cloud-events
  labels:
    app.kubernetes.io/name: cloud-events
    app.kubernetes.io/instance: alert-ingress
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloud-events
      app.kubernetes.io/instance: alert-ingress
  policyTypes:
    - Egress
  egress:
    # 1. Alertmanager. The one thing this service is FOR reaching.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalertmanager
      ports:
        - protocol: TCP
          port: 443
    # 2. DNS, or rule 1 above cannot even be resolved. With no
    # `networkPolicy.egress.dns` this is port 53 to ANY destination (no `to`):
    # the cluster resolver is not a kube-system pod on every cluster.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 3. The cloud provider itself, for signature verification and
    # subscription confirmation. See the comment above this block.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

