apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-rum
  namespace: rum
  labels:
    app.kubernetes.io/name: observability-rum
    app.kubernetes.io/instance: observability-rum
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: observability-rum
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
      ports:
        - protocol: TCP
          port: 12400
        - protocol: TCP
          port: 12500
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 12345

