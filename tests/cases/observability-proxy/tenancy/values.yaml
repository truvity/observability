# The Door half of the stack case of the same name (tests/cases/observability-stack/tenancy):
# its values kept to the keys charts/observability-proxy declares, with
# `stackReleaseName` set to the stack's release name, so the render carries the
# names the stack's does.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  principals:
  - group: example:k8s:viewer
    grants:
    - cluster: example-cluster
      allNamespaces: true
  - group: example:example-app:deployer
    grants:
    - cluster: example-cluster
      namespaces:
      - example-app
networkPolicy:
  enabled: false
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
