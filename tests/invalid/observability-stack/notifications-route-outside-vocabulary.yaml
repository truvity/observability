# expect: stamp exactly two dimensions on every alert
# A route matching on `tenant`, which no collector this chart's rules
# run against stamps on an alert. The vocabulary is cluster ×
# namespace; a route on anything else matches nothing a rule actually
# carries and pages nobody while looking exactly like a route that
# works.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
  routes:
    - match: {tenant: example-tenant}
      critical: "#alerts-example-tenant"
