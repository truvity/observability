{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $fullname := include "observability-stack.fullname" . }}
{{- /*
The stores talk to nothing and are talked to by four things: the proxy,
the two vmalerts, the backup jobs, and whatever scrapes each store's own
metrics port.

A NetworkPolicy that selects a pod is a default-deny for that pod, which
is the point: `-httpAuth` on the stores is a rule about who may read, and
this is a rule about who may connect. Both, because each is a different
mistake — a leaked credential defeats the first, a missing credential
check defeats the second, and an estate only ever notices one of them.

The fourth peer was missing for as long as this file existed: the stores
admitted the proxy, vmalert and their own pods, and nothing else, so the
metrics agent charts/observability-emitters renders —
`app.kubernetes.io/instance: observability-emitters`, `name: vmagent` —
matched none of them. Measured on a live install: `up=0` for every
store's own scrape job, no `scrape_samples_scraped` series for it at all,
and every rule in charts/platform-alerts naming a store's own counter,
plus this chart's own `selfAlerts`, unable to fire. `networkPolicy.
scrapeFrom` below closes it, on by default rather than left for an
estate to discover the same way this one did — see docs/safety.md, "A
store nobody can alert on".

Egress is deliberately not restricted here. An egress policy that names
every DNS server, every object store endpoint and every issuer is a
policy that breaks the first time one of them moves, and the failure mode
is a backup that stops silently — which is the failure this repository
exists to catch, not to cause.
*/}}
{{- $scrapeDefault := list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "vmagent"))) -}}
{{- $peers := concat
    (list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "vmauth" "app.kubernetes.io/instance" $fullname))))
    (list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "vmalert"))))
    (list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/part-of" "observability-stack" "app.kubernetes.io/instance" $root.Release.Name))))
    ($root.Values.networkPolicy.scrapeFrom | default $scrapeDefault)
    ($root.Values.networkPolicy.writersFrom | default list)
}}
{{- $stores := list
    (dict "name" "metrics" "port" 8428 "selector" (dict "app.kubernetes.io/name" "vmsingle" "app.kubernetes.io/instance" (include "observability-stack.vmks.fullname" $root)))
    (dict "name" "logs" "port" 9428 "selector" (dict "app" "server" "app.kubernetes.io/name" (default "victoria-logs-single" ((index $root.Values "victoria-logs-single").nameOverride)) "app.kubernetes.io/instance" $root.Release.Name))
}}
{{- if include "observability-stack.tracesEnabled" . }}
{{- $stores = append $stores (dict "name" "traces" "port" 10428 "selector" (dict "app" "server" "app.kubernetes.io/name" (default "vt-single" ((index $root.Values "victoria-traces-single").nameOverride)) "app.kubernetes.io/instance" $root.Release.Name)) }}
{{- end }}
{{- range $store := $stores }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-%s-store" $fullname $store.name }}
  labels:
    {{- include "observability-stack.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $store.selector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml $peers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $store.port }}
{{- end }}
---
{{- /*
The proxy's own ingress. Empty `proxyFrom` means the release's namespace
and nothing else — the smallest rule that leaves a working install, and
the one an estate whose Grafana lives elsewhere has to widen on purpose.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-proxy
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmauth
      app.kubernetes.io/instance: {{ $fullname }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.proxyFrom }}
        {{- toYaml .Values.networkPolicy.proxyFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8427
    {{- /*
    The operator's own config-reloader sidecar, injected into this same
    pod to watch the Secret it generates for VMAuth and signal a reload —
    a second container, a second endpoint, `reloader-http`, on the
    VMServiceScrape the operator renders alongside this chart's own
    objects. This policy selected the pod and admitted only 8427, so the
    reload endpoint scraped fine at the socket and lost every sample at
    admission: `up=0` for the job, `TargetDown`/`ServiceDown` firing
    forever, on a pod that is otherwise perfectly healthy — the same
    shape docs/safety.md, "A store whose own policy hides it from the
    scraper" describes for the stores, one port later.

    The peers are `networkPolicy.scrapeFrom` (defaulting to the same
    metrics agent as the three store policies above), not `proxyFrom`:
    this is a scrape, not a read through the proxy, and the two lists
    answer different questions.
    */}}
    - from:
        {{- toYaml ($root.Values.networkPolicy.scrapeFrom | default $scrapeDefault) | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8435
{{- end }}
