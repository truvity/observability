{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $fullname := include "observability-stack.fullname" . }}
{{- /*
The stores talk to nothing and are talked to by four things: the proxy,
the two vmalerts, the backup jobs, and whatever scrapes each store's own
metrics port.

A NetworkPolicy that selects a pod is a default-deny for that pod, which
is the point: `-httpAuth` on the stores is a rule about who may read, and
this is a rule about who may connect. Both, because each is a different
mistake — a leaked credential defeats the first, a missing credential
check defeats the second, and an estate only ever notices one of them.

The fourth peer was missing for as long as this file existed: the stores
admitted the proxy, vmalert and their own pods, and nothing else, so the
metrics agent charts/observability-emitters renders —
`app.kubernetes.io/instance: observability-emitters`, `name: vmagent` —
matched none of them. Measured on a live install: `up=0` for every
store's own scrape job, no `scrape_samples_scraped` series for it at all,
and every rule in charts/platform-alerts naming a store's own counter,
plus this chart's own `selfAlerts`, unable to fire. `networkPolicy.
scrapeFrom` below closes it, on by default rather than left for an
estate to discover the same way this one did — see docs/safety.md, "A
store nobody can alert on".

Egress is deliberately not restricted here. An egress policy that names
every DNS server, every object store endpoint and every issuer is a
policy that breaks the first time one of them moves, and the failure mode
is a backup that stops silently — which is the failure this repository
exists to catch, not to cause.
*/}}
{{- $scrapeDefault := list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "vmagent"))) -}}
{{- $observabilityStackEffective := include "observability-stack.effectiveEnabled" $root | fromYaml }}
{{- /*
Grafana reaches the stores itself only when there is no proxy for it to
go through (`vmauth` off; its datasources then use `storeCredentials`,
see `observability-stack.validate.grafana`) — and only then is it
admitted here, by the labels the Grafana chart gives its own pods.
*/}}
{{- $grafanaDirect := list }}
{{- if and (not $observabilityStackEffective.vmauth) ($root.Values.grafana).enabled }}
{{- $grafanaDirect = list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (($root.Values.grafana).nameOverride | default "grafana") "app.kubernetes.io/instance" $root.Release.Name))) }}
{{- end }}
{{- $peers := concat
    (list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "vmauth" "app.kubernetes.io/instance" $fullname))))
    (list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "vmalert"))))
    (list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/part-of" "observability-stack" "app.kubernetes.io/instance" $root.Release.Name))))
    ($root.Values.networkPolicy.scrapeFrom | default $scrapeDefault)
    ($root.Values.networkPolicy.writersFrom | default list)
    $grafanaDirect
}}
{{- $stores := list
    (dict "name" "metrics" "port" 8428 "selector" (dict "app.kubernetes.io/name" "vmsingle" "app.kubernetes.io/instance" (include "observability-stack.vmks.fullname" $root)))
    (dict "name" "logs" "port" 9428 "selector" (dict "app" "server" "app.kubernetes.io/name" (default "victoria-logs-single" ((index $root.Values "victoria-logs-single").nameOverride)) "app.kubernetes.io/instance" $root.Release.Name))
}}
{{- if include "observability-stack.tracesEnabled" . }}
{{- $stores = append $stores (dict "name" "traces" "port" 10428 "selector" (dict "app" "server" "app.kubernetes.io/name" (default "vt-single" ((index $root.Values "victoria-traces-single").nameOverride)) "app.kubernetes.io/instance" $root.Release.Name)) }}
{{- end }}
{{- range $store := $stores }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-%s-store" $fullname $store.name }}
  labels:
    {{- include "observability-stack.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $store.selector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml $peers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $store.port }}
    {{- /*
    `networkPolicy.clientsFrom`: clients this chart does not know about,
    each on the stores it names and no others — one rule per entry, so
    `kubectl describe` shows which client a rule is for.
    */}}
    {{- range $c := ($root.Values.networkPolicy.clientsFrom | default list) }}
    {{- if has $store.name ($c.stores | default (list "metrics" "logs" "traces")) }}
    - from:
        {{- toYaml $c.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $store.port }}
    {{- end }}
    {{- end }}
{{- end }}
---
{{- /*
vmalert's own ingress, the same belt-and-braces the stores get: nothing
selected vmalert's pods before `tenancy.alertReaders` existed, because
nothing outside this namespace read from it directly -- every consumer
either fed it rules or was fed BY it (`remoteWrite`/`remoteRead` against
the metrics store, which the store's own policy already gates). Now that
the proxy forwards a bearer-token reader straight to it
(`tenancy.alertReaders`, vmusers.yaml), it is exactly the kind of "a rule
engine nobody else can reach" gap docs/safety.md's store section warns
about, one port later -- so it gets the same default-deny-then-admit
shape as a store, unconditionally, the moment vmalert is enabled: an
install that never sets `tenancy.alertReaders` pays nothing for it, and
one that does is not the first to discover the gap by tripping over it.

Selector is name-only, matching every vmalert pod this namespace runs
(both alerters), the same way `$peers` above already admits vmalert
into the STORES by name alone rather than by the operator's own
per-CR instance label.

Unconditional the moment `vmalert.enabled` is true — not gated on
`tenancy.alertReaders` being non-empty — the same choice the three
store policies already make: an estate that never configures an
external reader pays nothing for a rule that admits vmauth and the
scrape peer and nothing else, and one that adds `alertReaders` later
is not the first to find the gap by tripping over it. Consumer-visible
either way: this policy is new on any install with `vmalert.enabled`
(the default) and `networkPolicy.enabled` (also the default) — see
CHANGELOG.

Three ports, not two: vmalert's own API and `/metrics` on 8080 (to
vmauth, for `tenancy.alertReaders`, and to the scrape peer, for
`selfAlerts` and everything in `charts/platform-alerts` that watches
this job's own health) — and the operator's config-reloader sidecar,
injected into this pod the same way it is into the proxy's, on
`reloader-http` (8435), to the scrape peer only. Getting this one
wrong is the exact failure `templates/networkpolicy.yaml`'s own proxy
policy was fixed for one port over (see docs/safety.md, "A store whose
own policy hides it from the scraper"): a policy that selects the pod
and admits only 8080 still lets 8435 answer at the socket and drops
every sample at admission, `up=0` and TargetDown/ServiceDown firing
forever on a pod that is otherwise perfectly healthy. The peer here is
`networkPolicy.scrapeFrom` (falling back to `$scrapeDefault`, the same
Go-template variable the store and proxy policies above already read),
never a second, separately-hardcoded default: an estate that overrides
`scrapeFrom` must not lose the reloader scrape the way it would not
lose the store or proxy one.
*/}}
{{- if $observabilityStackEffective.vmalert }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-vmalert
  labels:
    {{- include "observability-stack.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
              app.kubernetes.io/instance: {{ $fullname }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        {{- toYaml ($root.Values.networkPolicy.scrapeFrom | default $scrapeDefault) | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        {{- toYaml ($root.Values.networkPolicy.scrapeFrom | default $scrapeDefault) | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8435
{{- end }}
---
{{- /*
The proxy's own ingress. Empty `proxyFrom` means the release's namespace
and nothing else — the smallest rule that leaves a working install, and
the one an estate whose Grafana lives elsewhere has to widen on purpose.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-proxy
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmauth
      app.kubernetes.io/instance: {{ $fullname }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.proxyFrom }}
        {{- toYaml .Values.networkPolicy.proxyFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8427
    {{- /*
    The operator's own config-reloader sidecar, injected into this same
    pod to watch the Secret it generates for VMAuth and signal a reload —
    a second container, a second endpoint, `reloader-http`, on the
    VMServiceScrape the operator renders alongside this chart's own
    objects. This policy selected the pod and admitted only 8427, so the
    reload endpoint scraped fine at the socket and lost every sample at
    admission: `up=0` for the job, `TargetDown`/`ServiceDown` firing
    forever, on a pod that is otherwise perfectly healthy — the same
    shape docs/safety.md, "A store whose own policy hides it from the
    scraper" describes for the stores, one port later.

    The peers are `networkPolicy.scrapeFrom` (defaulting to the same
    metrics agent as the three store policies above), not `proxyFrom`:
    this is a scrape, not a read through the proxy, and the two lists
    answer different questions.
    */}}
    - from:
        {{- toYaml ($root.Values.networkPolicy.scrapeFrom | default $scrapeDefault) | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8435
{{- end }}
