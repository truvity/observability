# expect: Jaeger and Tempo select APIs accept NO query argument to substitute it into
# A trace store with principals, and no statement that trace reads are
# unscoped.
#
# The proxy enforces a grant by substituting the principal's filter into
# the route it forwards on. VictoriaTraces' Jaeger and Tempo select APIs
# accept no query argument to substitute it into: their handlers take a
# tenant id from headers, `hidden_fields_filters` (which hides fields
# from a result, not rows) and `allow_partial_response`, and nothing
# else. So a reader given those paths reads every namespace's spans, while
# the `defaultVMAccessClaim` beside the route still states the grant.
#
# Rendering it anyway — because it looks exactly like the metrics and
# logs routes on either side of it — is the defect this refusal exists
# to prevent. `tenancy.allowUnfilteredTraceReads` is how an estate says
# it accepts that, and its absence is how this fixture fails.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

victoria-traces-single:
  enabled: true

# `alertmanager.enabled` defaults to true, and with no `notifications`
# receiver configured that refusal fires before this fixture ever
# reaches its own check (see docs/safety.md). This is the minimum
# receiver that satisfies it, so the fixture is preempted no further.
notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
