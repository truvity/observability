---
# Source: oncall/templates/goalert.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oncall-goalert
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: goalert
# GoAlert never calls the Kubernetes API.
automountServiceAccountToken: false

---
# Source: oncall/templates/goalert.yaml
apiVersion: v1
kind: Service
metadata:
  name: oncall-goalert
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: goalert
spec:
  selector:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
