# expect: with neither `namespaces` nor `allNamespaces: true`
# A cluster entry that names no namespaces and not allNamespaces is refused, never read as everything.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: example-app
      groups: [example:example-app]
      reach:
        clusters:
          - cluster: cluster-a
            allNamespaces: false


victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
