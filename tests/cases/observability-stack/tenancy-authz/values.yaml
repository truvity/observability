# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
global:
  cluster:
    dnsDomain: cluster.example.

# tenancy-authz: the Envoy external authorisation service that unions a
# person's groups into one vm_access token for the vm_access reader. The
# signing key is generated by External Secrets Operator (the default), and the
# service attaches to one HTTPRoute the consumer names.
#
# The principals are the multi-group case's, plus a workload principal on
# its own audience: it is NOT in the service's configuration (a token for
# it is passed through to vmauth untouched), and its VMUser is unchanged.
# tests/tenancy_authz_test.go holds both, and that the service's principals
# are exactly the people's VMUsers' grants.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    securityPolicy:
      targetRefs:
        - kind: HTTPRoute
          name: observability-read
    networkPolicy:
      gatewayFrom:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: example-gateway}
          podSelector:
            matchLabels: {app.kubernetes.io/name: envoy}
  principals:
    - name: k8s:viewer
      groups:
        - cluster-a:k8s:viewer
        - cluster-b:k8s:viewer
      grants:
        - cluster: cluster-a
          allNamespaces: true
        - cluster: cluster-b
          allNamespaces: true
    - group: example:example-app:deployer
      grants:
        - cluster: cluster-a
          namespaces: [example-app, other-app]
    # A workload's own audience: not a person's, so not the service's.
    - group: cluster-a:example-app:reader
      audience: reader
      routes: [metrics]
      metricsQueryOnly: true
      grants:
        - cluster: cluster-a
          namespaces: [example-app]

# Off, so the render is the tenancy and nothing else.
vmalert:
  enabled: false
alertmanager:
  enabled: false
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
