# expect: only `auth.mode: ecr` uses
global:
  observabilityRum:
    otlp:
      endpoint: "http://otlp-gateway.example.svc:4318"
    sourcemaps:
      smctl:
        enabled: true
        repositoryTemplate: ghcr.io/example/sourcemaps/{app}
        serviceAccount:
          annotations:
            example.com/role: reader
    apps:
      - name: shop
        apiKeySecret:
          name: shop-rum-key
          key: key
        allowedOrigins:
          - https://shop.example
