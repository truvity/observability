# A Door case for charts/observability-proxy. It began as the Door half of the
# stack case of the same name, from the release in which the stack stopped
# rendering the Door: the stack's values kept to the keys this chart declares,
# with `stackReleaseName` set to the stack's release name, so the render
# carries the names the stack's Door objects always had. Every principal is an
# entry of `tenancy.identities`.
stackReleaseName: observability-stack
ha:
  enabled: false
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  allowUnfilteredTraceReads: true
  allowUnfilteredAlertReads: true
  alertReaders:
  - name: example-reader
    tokenSecret:
      name: example-alerts-read-token
      key: token
    alertmanager: true
  writers:
  - name: metrics-agent
    tokenSecret:
      name: example-writer-token
      key: token
    destinations:
    - metrics
  - name: log-agent
    tokenSecret:
      name: example-writer-token
      key: token
    destinations:
    - logs
  identities:
  - groups:
    - example:k8s:viewer
    reach:
      clusters:
      - cluster: example-cluster
        allNamespaces: true
victoria-traces-single:
  server:
    extraArgs:
      servicegraph.enableTask: 'true'
