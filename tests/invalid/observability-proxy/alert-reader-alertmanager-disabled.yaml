# expect: sets `alertmanager: true` but `alertmanager.enabled` is false
# An Alertmanager route for a reader, with no Alertmanager to read.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  allowUnfilteredAlertReads: true
  alertReaders:
  - name: example-reader
    tokenSecret:
      name: example-alerts-read-token
      key: token
    alertmanager: true
  identities:
  - groups:
    - example:k8s:viewer
    reach:
      clusters:
      - cluster: example-cluster
        allNamespaces: true
alertmanager:
  enabled: false
victoria-metrics-k8s-stack:
  defaultRules:
    sources:
      alertmanager:
        enabled: false
