# expect: `backup.logs.serviceAccount` is set but `backup.auth.mode` is `secret`
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# A per-store ServiceAccount under `secret` auth: no backup pod runs as a
# chosen ServiceAccount in that mode, so it would be rendered for nothing.
backup:
  enabled: true
  destination: s3://example-backups/observability
  credentialsSecret: example-backup-credentials
  logs:
    serviceAccount:
      create: true

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
