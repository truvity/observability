global:
  cluster:
    dnsDomain: cluster.example.

# The CloudWatch reader (`cloudwatchLogs`) reading the audit AND the
# authenticator log of an EKS control plane: the Pod Security audit
# violations (`match`), the requests the API server answered 401 or 403,
# and the authenticator's refusals (`matchers`), written to the same log
# destination as the gateway. Written the way a central-install cluster
# writes (`remote`), since that is where an estate's second and third
# clusters are.
tenancy:
  cluster: example-cluster
  environment: production

remote:
  url: https://observability-write.example.private
  tokenSecret: {name: example-write-token, key: token}
  caSecret: {name: example-private-ca, key: ca.crt}
  name: central

cloudwatchLogs:
  enabled: true
  region: eu-central-1
  logGroup: /aws/eks/example-cluster/cluster
  streamPrefixes:
    - kube-apiserver-audit-
    - authenticator-
  matchers:
    - streamPrefix: authenticator-
      anyOf: [" level=warning ", "msg=\"access denied\""]
    - streamPrefix: kube-apiserver-audit-
      json: {path: responseStatus.code, anyOf: [401, 403]}
  serviceAccount:
    name: observability-cloudwatch

victoria-logs-collector:
  extraVolumes:
    - name: remote-write-tls
      projected:
        sources:
          - secret:
              name: example-private-ca
              items: [{key: ca.crt, path: ca.crt}]
          - secret:
              name: example-write-token
              items: [{key: token, path: token}]
  extraVolumeMounts:
    - name: remote-write-tls
      mountPath: /etc/observability-emitters/tls
      readOnly: true
  remoteWrite:
    - url: https://observability-write.example.private
      tlsCAFile: /etc/observability-emitters/tls/ca.crt
      bearerTokenFile: /etc/observability-emitters/tls/token
      maxDiskUsagePerURL: 5GB
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"production"}'
