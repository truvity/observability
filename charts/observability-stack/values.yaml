# observability-stack — one install of the store, behind a proxy that
# scopes every query to the caller's own clusters and namespaces.
#
# This chart wraps the upstream charts rather than replacing them: the
# stores, the operator and Grafana come from the vendor, pinned to exact
# versions in Chart.yaml. What this chart adds is everything an install is
# judged on when it fails — the proxy in front of reads, the second
# vmalert, the deadman's route out of the cluster, the network policies
# and the backups — plus a refusal for every setting whose wrong value is
# silent.
#
# Two things to know before reading further.
#
# FIRST: every default here is the COMMUNITY edition. The chart refuses an
# image tag containing `enterprise` and never renders a `-license` flag,
# because an Enterprise binary without a key is a licence breach that runs
# perfectly. See docs/doctrine.md.
#
# SECOND: Helm evaluates a subchart's values before any template runs, so
# a parent chart cannot compute them. Where one value has to reach an
# upstream chart, it is written twice — once here as the value this chart
# reasons about, once in the subchart's own key — and the chart REFUSES TO
# RENDER when the two disagree. That is the whole of the duplication below,
# it is marked `# MIRROR:` at every site, and it is a refusal rather than a
# comment because two numbers that are supposed to be equal stop being
# equal the first time somebody changes one of them.

# -- Name overrides for the objects this chart renders itself.
nameOverride: ""
fullnameOverride: ""

# -- Zone-redundant mode.
#
# No store here replicates across a zone in a way that survives one, so
# high availability means two independent installs with the writers
# holding the redundancy (docs/doctrine.md). This flag is the switch for
# that shape; it is accepted today and the behaviour lands in a later
# release. It refuses to render with fewer than two zones, because a
# "highly available" install with one zone is the single-zone install with
# a label that stops anyone looking.
ha: false

# -- The zones this install spans. Names only — they are labels, not
# addresses, and they are matched against whatever the estate's nodes
# carry. Required, with at least two entries, when `ha` is true.
zones: []

# -- The one interval.
#
# It is the scrape interval of this stack's own components, the
# `-dedup.minScrapeInterval` of the metrics store, and the evaluation
# interval of both vmalerts. These three must agree: deduplication keeps
# one sample per interval, so a dedup window wider than the scrape
# interval silently discards good samples, and a vmalert evaluating faster
# than data arrives re-reads the same points and holds `for:` timers open.
# One value, mirrored where an upstream chart needs it, and the render
# refuses when a mirror disagrees.
interval: 30s

# The authorising proxy: vmauth, in front of every read.
#
# Nothing else in this namespace may reach a store, which is why the
# stores themselves run with `-httpAuth.*` (see `storeCredentials` below)
# and why the network policies exist. The proxy verifies the caller's JWT
# against the issuer's OIDC discovery document and injects the filters
# that token is entitled to.
vmauth:
  enabled: true
  image:
    repository: victoriametrics/vmauth
    # -- The floor is v1.152.0, and the chart refuses an older tag.
    #
    # Two reasons, and the second is the one that matters.
    # `default_vm_access_claim` arrived in v1.147.0: without it a token
    # that verifies but carries no `vm_access` claim falls through to the
    # unauthorized user and is rejected, with no way to say what it may
    # read. And in v1.147.0 through v1.151.x the values in `match_claims`
    # were matched UNANCHORED (GHSA-f99m-22fh-qw96): a claim value of
    # `admin` also matched `not-admin-really`, which is an authorisation
    # bypass in exactly the mechanism this chart uses to select a user.
    # v1.152.0 anchors them.
    #
    # The operator's own default image tag is older than both, so this is
    # set explicitly rather than left to it.
    tag: v1.152.0
  replicaCount: 1
  # -- Requests equal limits, integer CPU. See `resources` on each store
  # below for why.
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # -- Extra flags for vmauth. `logInvalidAuthTokens` is on by default: a
  # rejected token that logs nothing is an access problem nobody can
  # diagnose, and the log line carries no token material.
  extraArgs:
    logInvalidAuthTokens: "true"
  # -- Paths the proxy must never forward, as regular expressions matched
  # against the request path.
  #
  # `/internal/*` carries the partition and snapshot APIs, and those
  # endpoints have their OWN query-string auth keys
  # (`-partitionManageAuthKey`, `-snapshotAuthKey`) which OVERRIDE
  # `-httpAuth.*` entirely: with such a key set, basic auth is not
  # consulted at all. A route through this proxy would therefore be a
  # route around the stores' own authentication, so there is no route.
  # The chart refuses to render if any user's paths would reach them.
  deniedPaths:
    - "/internal/.*"
    - "/-/reload"
  # -- Read load balancing. `first_available` sends every read to the first
  # healthy backend rather than spreading them: with a redundant pair, a
  # query balanced onto the replica that is still replaying its buffer
  # after a restart returns a gap, and a gap in a dashboard is read as an
  # outage. The retry codes are the ones a backend returns while it is
  # coming back.
  loadBalancingPolicy: first_available
  retryStatusCodes: [500, 502, 503]

# Who may read what.
#
# `pkg/tenancy` in this repository renders the same principals into the
# `vm_access` claim an issuer mints. The two shapes must agree, so the
# `tenancy` golden case is exactly what `RenderVMAuth` produces for the
# principals in the repository's README, and a Go test compares them.
tenancy:
  # -- The issuer this proxy verifies tokens against. vmauth fetches the
  # OIDC discovery document and the keys from it. Required whenever
  # `principals` is non-empty: without an issuer nothing verifies a
  # signature, and a proxy that trusts an unverified token is worse than
  # no proxy.
  issuerUrl: ""
  # -- The client id this proxy's own tokens are minted under, pinned
  # into every reader's `matchClaims` as `aud`. Required whenever
  # `principals` is non-empty.
  #
  # vmauth validates a token's expiry and, under OIDC discovery, its
  # issuer. It has no audience option and never inspects `aud` on its
  # own. So without this pin each reader below is selected by its group
  # alone, and every unexpired token the issuer minted is admitted
  # whatever client it was minted for: a token the same person holds for
  # another application of the same issuer reads their namespaces here,
  # and nothing reports it, because the token verifies and the filters
  # apply.
  #
  # The claim name is `aud` and is not a value: it is the name OpenID
  # Connect gives the claim, and a second spelling of it is a way to pin
  # nothing while the configuration reads as though something were
  # pinned.
  #
  # The value is whatever the issuer registered this proxy's client
  # under. vmauth compiles every `matchClaims` value as a REGULAR
  # EXPRESSION, so the chart escapes it and anchors it: a client id
  # carrying `.`, `|` or `@` pins itself and nothing else. It is escaped
  # rather than refused — unlike a cluster or namespace name, which this
  # chart holds to a narrow shape — because the issuer chooses a client
  # id and this chart does not, and a shape refusal here would lock out
  # an estate whose issuer mints ids with dots in them. What is still
  # refused is a value no issuer mints: one carrying whitespace or a
  # newline.
  #
  # It works whether the issuer mints `aud` as a string or as a list:
  # vmauth matches a `matchClaims` entry against an array claim element
  # by element.
  audience: ""
  # -- The token claim carrying the caller's groups. It may not be `aud`,
  # which the audience above is pinned under: both are entries in one
  # `matchClaims` map, and one would overwrite the other.
  claimName: groups
  # -- The keys the filters select on, per signal.
  #
  # The scoping key is the CLUSTER and the NAMESPACE, under OpenTelemetry's
  # names spelled the way each store can carry them: on metrics a label
  # cannot hold a dot, and on logs the namespace key is the container-log
  # agent's own native field, because that agent cannot rename a field and
  # the gateway can — so the gateway yields and writes the same spelling.
  # These defaults are what charts/observability-emitters stamps and what
  # `pkg/tenancy` defaults to; `tests/agreement_test.go` reads them back
  # out of that chart's rendered manifest and fails on any drift. They are
  # values so an estate whose collectors were not built here can state
  # what its telemetry actually carries — a filter selecting on one name
  # against telemetry labelled with another returns an empty result rather
  # than an error, which reads as "no data" rather than as a mistake.
  #
  # The environment tier (`deployment_environment_name`) is deliberately
  # not among them: two clusters can share a tier, so a filter on it would
  # select both. It rides on every signal for dashboards and is never a key.
  clusterLabel: k8s_cluster_name
  namespaceLabel: k8s_namespace_name
  logsClusterField: k8s.cluster.name
  logsNamespaceField: kubernetes.pod_namespace
  # -- Admit the trace read route although nothing can scope it.
  #
  # The proxy enforces a grant by substituting the principal's filter
  # into the route it forwards on. VictoriaTraces' Jaeger and Tempo
  # select APIs accept no query argument to substitute it into: their
  # handlers take a tenant id from headers, `hidden_fields_filters`
  # (which hides FIELDS from a result, not rows) and
  # `allow_partial_response`, and nothing else. There is therefore no
  # way, through this proxy, to give one principal a narrower view of
  # traces than another.
  #
  # So with a trace store and `principals` both set, the chart refuses
  # to render until this is `true`. Setting it says, in a place people
  # read: **every principal who can reach the proxy reads every
  # namespace's spans on every cluster.** Metrics and logs are unaffected by it; it admits
  # the trace route and nothing else.
  #
  # The alternative — rendering the trace route anyway, because it looks
  # like the other two — is the failure this value exists to prevent: a
  # route that carries a grant nobody applies is indistinguishable, from
  # the outside, from one that does.
  allowUnfilteredTraceReads: false
  # -- Admit `/api/v1/metadata` on the metrics read route.
  #
  # The endpoint returns every metric NAME in this store with its type
  # and help string, and no filter reaches it -- measured against the
  # store, an `extra_filters` naming a namespace that matches nothing
  # returns the same body as no filter at all. So with this on, every
  # principal learns which metrics exist, whatever their grant says. On
  # an install whose grants are all `allNamespaces` that is nothing they
  # could not already query; on one with per-namespace grants it is a
  # list of the components and products another tenant runs.
  #
  # Its three siblings are admitted by nothing, because what they leak is
  # per-principal rather than bounded: `/status/active_queries` and
  # `/status/top_queries` return other principals' query TEXT, and
  # `/status/metric_names_stats` returns names with per-tenant counts.
  #
  # Off by default, and the cost of off is visible rather than hidden:
  # Grafana's Prometheus-family datasources ask for this endpoint to put
  # descriptions on metric names, and write a 401 into their own logs
  # when the proxy does not route it. The query builder keeps working --
  # metric names come from `/label/__name__/values`, which IS filtered --
  # and only the descriptions are missing. An operator reading that 401
  # should find this value rather than a mystery.
  allowUnfilteredMetricMetadata: false
  # -- One entry per named population. Each renders one vmauth user,
  # selected by `group` matched against `claimName`.
  #
  #   principals:
  #     - group: example:k8s:viewer
  #       grants:
  #         - cluster: example-cluster
  #           allNamespaces: true
  #     - group: example:example-app:deployer
  #       grants:
  #         - cluster: example-cluster
  #           namespaces: [example-app]
  #
  # A grant is namespaces ON a cluster. A project, a team or a product is
  # not a label anywhere in the telemetry: it is a derivation from a name
  # to a list of namespaces that lives with whoever writes these grants,
  # so adding a namespace to a project is a visible edit here rather than
  # a label somebody forgets. `namespaces` and `allNamespaces` are
  # mutually exclusive and one is required: an empty list is refused
  # rather than read as "everything", because a project that expands to
  # no namespaces is the likeliest way a grant widens by accident. Names
  # must match the plain-name shape `^[a-z0-9]([a-z0-9-]*[a-z0-9])?$` —
  # they are interpolated into a filter expression, so a name carrying
  # `|` or `.*` would widen the grant it appears in, and such a name is
  # refused rather than escaped.
  principals: []
  # -- The writers: collectors and agents that push, authenticated by a
  # bearer token rather than by a person's identity.
  #
  #   writers:
  #     - name: metrics-agent
  #       tokenSecret:
  #         name: example-writer-token
  #         key: token
  #       destinations: [metrics]
  #
  # The token is the caller's: this chart takes the NAME of a Secret and
  # never a value. A writer may not read — its paths are the write paths
  # of the destinations it names, and nothing else.
  writers: []

# -- The credentials the stores themselves demand.
#
# Every store runs with `-httpAuth.username` and `-httpAuth.password` so
# that nothing inside the cluster can reach one around the proxy. A
# network policy stops the traffic; this stops the traffic that a policy
# was not written for.
#
# The values arrive as the name of a Secret the estate created, with the
# keys it chose. The chart mounts nothing and stores nothing.
#
# The credentials reach the store as environment variables (the stores
# read `-envflag.enable`), not as command-line flags, because a flag value
# is visible in every `kubectl describe` and in the process table. The
# cost is that rotating the Secret needs a restart: the password flag
# alone would support `file://` and reload itself, but the username flag
# does not, and one mechanism that is always true beats two that differ.
storeCredentials:
  # -- Name of the Secret. It must exist in the release's namespace before
  # the stores start; the chart neither creates it nor reads it.
  #
  # The default is a conventional name rather than an empty string, so the
  # mirrors below (`MIRROR: storeCredentials.secretName`) agree out of the
  # box. Change it and the chart will tell you which other keys to change
  # with it.
  secretName: observability-store-credentials
  usernameKey: username
  passwordKey: password

# -- Where the stores are.
#
# Empty means "derive it from the upstream chart's own naming rules",
# which is what an install of this chart wants. Set one when a store runs
# outside this release — an estate keeping the log store in another
# namespace points at it here rather than running a second one.
stores:
  metrics:
    url: ""
  logs:
    url: ""
  traces:
    url: ""

# Alerting.
#
# Two vmalerts, because one cannot do both jobs: rules over metrics and
# rules over logs are different rule types, selected by
# `-rule.defaultRuleType`, and a single process has one default.
vmalert:
  enabled: true
  # -- The rules over logs. Renders a second vmalert with
  # `-rule.defaultRuleType=vlogs` and the log store as its datasource.
  logs:
    enabled: true
    # -- `-rule.evalDelay`. vmalert's own default is 30s, chosen to match
    # VictoriaMetrics' `-search.latencyOffset` — a flag that exists
    # because vmselect deliberately withholds the newest samples of a
    # query, since they may still be incomplete. VictoriaLogs has no such
    # flag and no such withholding, so the logs alerter inheriting that
    # default holds every log-based alert back by 30 seconds it never
    # needed and nothing says why.
    evalDelay: 5s
  # -- Where a person lands from an alert's source link. vmalert defaults
  # `-external.url` to its own pod hostname, which makes every alert's
  # link dead the moment it leaves the cluster. Empty renders no flag and
  # keeps the broken default, so set it.
  #
  # `notifications.externalUrl` (below) is the SAME fact for the Slack
  # template's Grafana link, and defaults to this value — set this one
  # and both work. This one has to keep existing on its own regardless,
  # because an install with `alertmanager.enabled: false` renders no
  # `notifications` block at all and still needs its source links to
  # resolve.
  externalUrl: ""
  # -- Labels on every alert and recording rule these vmalerts produce.
  externalLabels: {}
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 512Mi

alertmanager:
  enabled: true
  replicaCount: 1
  # -- An Alertmanager the estate already runs, when `enabled` is false.
  # A vmalert with no notifier evaluates every rule and sends the result
  # nowhere, which is indistinguishable from an estate with no problems,
  # so the chart refuses that combination.
  notifierUrl: ""
  # -- The deadman's route out of the cluster.
  #
  # A Watchdog alert fires continuously while the stack is healthy, and
  # something OUTSIDE the cluster pages when it stops arriving. That
  # receiver's URL is a credential (it is a capability to page), so it
  # arrives as the name of a Secret and is read by Alertmanager from the
  # mounted file with `url_file` — never interpolated into the rendered
  # config, where it would sit in the release's manifest.
  #
  # With no Watchdog receiver configured the chart renders no Watchdog
  # route at all rather than a route to nowhere.
  watchdog:
    secretName: ""
    key: url
    # -- How often the heartbeat repeats. The outside watcher's own
    # timeout must be comfortably longer than this.
    repeatInterval: 5m
    # -- The far end's own timeout for a missing heartbeat, stated here
    # rather than read from it, so the chart can refuse a
    # `repeatInterval` that would not land comfortably inside it. Unset,
    # the chart trusts whoever set `repeatInterval` to have set it
    # sanely — which is what it always did before this existed.
    # timeout: 15m
  resources:
    requests:
      cpu: "1"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 256Mi

# The one router. See docs/notifications.md for the design this
# implements.
#
# `alertmanager.config` used to be a free-form object in Alertmanager's
# own syntax, filled in by the consumer. That shape could not be refused:
# an install with `alertmanager.enabled` and nothing else got a route to
# a receiver named `blackhole`, rules evaluated into nothing, and nothing
# about it looked unhealthy — the most expensive shape a monitoring
# system can have, because it looks exactly like a quiet estate. It also
# meant every consumer hand-wrote the same routing tree and copied the
# message template — cluster in the title, runbook link, Grafana link —
# rather than getting it shipped.
#
# So this chart now renders the routing tree FROM this block, and refuses
# to render `alertmanager.enabled` with none of it configured. What stays
# the consumer's: the channel names, the webhook, the route list, the
# external URL, and the policy of what severity a rule carries.
notifications:
  # -- `route` (the default, today's behaviour) or `evaluate-only`: the
  # explicit, named opt-out for a consumer with no Slack or webhook
  # credential YET. `route` requires a working receiver the moment
  # `alertmanager.enabled` is true, same as always. `evaluate-only` keeps
  # vmalert evaluating every rule — visible in its own UI and API — and
  # renders `-notifier.blackhole` instead of pointing it at an
  # Alertmanager; Alertmanager itself is not rendered in this mode, and
  # is refused if `alertmanager.enabled` is left or set to `true`, so the
  # opt-out stays visible in the values file rather than a state two
  # unrelated toggles happen to reach together. Never combine with a
  # receiver kind, a route, a severity, or `alertmanager.notifierUrl` —
  # each is refused: a channel configured beside a mode that mutes
  # vmalert looks wired up and is never reached. See docs/notifications.md,
  # "Evaluate, notify nobody yet".
  mode: route
  # -- The base of the Grafana link this chart puts in every Slack
  # message. Without it, every link a person clicks from an alert lands
  # nowhere — the same failure `vmalert.externalUrl` exists to prevent
  # for the alert's own source link, for a different link and a
  # different reader.
  #
  # Both settings are the SAME fact — the base URL a link leaving the
  # cluster should point at — and this chart refuses to render if they
  # disagree, so this one defaults to `vmalert.externalUrl` and is worth
  # setting on its own only when it needs to differ. The pair exists
  # because `vmalert.externalUrl` has to keep working by itself: an
  # install with `alertmanager.enabled: false` — an estate pointing
  # vmalert at an Alertmanager it already runs — has no `notifications`
  # block at all, and still needs its alerts' source links to resolve.
  externalUrl: ""
  # -- Prefixed to a firing alert's `runbook` annotation to build the
  # runbook link. Left empty, the message carries no runbook line at all
  # — never a link to a base URL with nothing after it, which reads as a
  # broken link rather than an absent one.
  runbookBaseUrl: ""
  groupWait: 30s
  groupInterval: 5m
  repeatInterval: 4h
  # -- Receiver kinds. Each is a mechanism — how the secret is mounted,
  # what the message looks like — and none carries a value: `slack` is a
  # single webhook shared by every channel, so the channel a message
  # lands in is chosen by `severities` and `routes` below, never here.
  # Unset by default: a `slack.webhookSecret` with an empty name is
  # refused by the schema rather than accepted and silently unreachable.
  # slack:
  #   webhookSecret: {name: "", key: url}
  # -- Named webhook receivers, for `also` below. One URL each; there is
  # no per-alert channel concept for a webhook the way there is for
  # Slack.
  webhook: []
  # - name: ""
  #   urlSecret: {name: "", key: url}
  # -- Severity tiers, and where each lands when no route says otherwise.
  # `receiver` names a configured kind above (`slack`, or an entry in
  # `webhook`); `channel` is the Slack channel — or, for a webhook
  # receiver, an identifying label only, since one webhook has one URL.
  #
  # This chart's rules carry only `critical` and `warning`: `critical`
  # means a person should look now, `warning` means a person should look
  # today. There is no `info` tier here on purpose — an alert that pages
  # nobody is a dashboard, not a notification, and a rule that wants one
  # belongs in Grafana, not in this routing tree. A consumer's own rules
  # may carry whatever severity the consumer gives them; this chart only
  # ships a route for the two above.
  severities: {}
  # critical: {receiver: slack, channel: ""}
  # warning:  {receiver: slack, channel: ""}
  # -- Routes, in order. The first entry whose `match` is satisfied wins,
  # per severity; an entry naming only `critical` sends its warnings to
  # `severities.warning`. `match` keys are the vocabulary the collectors
  # stamp on every alert — `k8s_cluster_name` and `k8s_namespace_name` —
  # and nothing else, because a route on a label no rule carries matches
  # nothing and pages nobody while looking exactly like a route that
  # works. The estate renders this list from wherever it derives projects
  # from namespaces.
  routes: []
  # - match: {k8s_cluster_name: ""}
  #   critical: ""
  #   warning: ""
  # -- Which alerts ALSO reach a webhook receiver, beside their normal
  # route — the status-page bridge. Matchers, not channels: an entry adds
  # a delivery, it never replaces the one `severities`/`routes` already
  # picked.
  also: []
  # - receiver: ""
  #   match: {severity: critical}

# Network policies.
#
# The proxy is the only way in, and the stores talk to nothing. A policy
# that is present but empty is not a smaller policy — it is a default-deny
# for the pods it selects, which is the point.
networkPolicy:
  enabled: true
  # -- Who may reach the proxy. Empty means every pod in the release's own
  # namespace, which is the smallest useful default; an estate whose
  # Grafana or console lives elsewhere adds its namespace here.
  #
  # Entries are Kubernetes `NetworkPolicyPeer` objects and pass through
  # untouched.
  proxyFrom: []
  # -- Who may write to the stores directly, bypassing the proxy. The
  # collectors need this; nothing else does.
  writersFrom: []
  # -- Who may scrape a store's metrics port directly, bypassing the
  # proxy — never the proxy address; see docs/doctrine.md. Empty means
  # the metrics agent charts/observability-emitters renders,
  # `app.kubernetes.io/name: vmagent`, in the release's own namespace:
  # the shape that was missing and left every store in this stack
  # unmonitored, measured on a live install as `up=0` for each store's
  # own scrape job.
  #
  # Entries are Kubernetes `NetworkPolicyPeer` objects and pass through
  # untouched, and — the same trap as `proxyFrom` above — a non-empty
  # list REPLACES the default rather than adding to it. An estate
  # renaming the agent, or running it in another namespace, has to
  # re-state the default peer alongside whatever it adds, or its store
  # goes dark the same way this default exists to prevent.
  scrapeFrom: []

# Backups.
#
# Each store has its own mechanism and they are not interchangeable:
#
#   metrics  vmbackup against an instant snapshot. Incremental by
#            construction — a backup whose `-dst` already holds data
#            uploads only what changed — with a weekly full that uses
#            `-origin` so the unchanged parts are copied server-side
#            rather than pulled through the pod.
#   logs     the partition snapshot API: create, copy, delete. A snapshot
#            lives INSIDE the data directory and pins the parts it
#            references, so one left behind grows the store's disk usage
#            silently; the binary expires them after `-snapshotsMaxAge`
#            (3 days by default), which is a backstop and not a plan.
#   traces   rsync, detach, rsync, attach — the vendor's documented
#            procedure. The second pass exists because small metadata
#            files change while the first one runs.
#
# Every job refuses an EMPTY SOURCE. `rclone sync` from an empty source
# deletes the destination and exits zero: a backup that finds nothing
# reports success and destroys the copy you had.
#
# `vmbackupmanager` is Enterprise and is not wrapped here, in this release
# or any other.
backup:
  enabled: false
  # -- Where backups go, as a URL without credentials: `s3://bucket/path`,
  # `gs://bucket/path`, or `fs:///mnt/path`. The bucket is the estate's.
  destination: ""
  # -- The Secret holding the object-store credentials, mounted into the
  # job as environment variables. The chart never reads it.
  credentialsSecret: ""
  metrics:
    enabled: true
    # -- Hourly, because the incremental upload is proportional to what
    # changed and an hour of metrics is the recovery point this buys.
    schedule: "17 * * * *"
    # -- The weekly full. `-origin` points it at the existing backup so
    # the shared data is copied inside the object store.
    fullSchedule: "17 3 * * 0"
    image:
      repository: victoriametrics/vmbackup
      tag: v1.152.0
    # -- The metrics store's volume, mounted read-only so vmbackup can
    # read the snapshot it asked the store to take. Empty derives the
    # operator's own name for it.
    claimName: ""
  logs:
    enabled: true
    schedule: "37 * * * *"
  traces:
    enabled: false
    schedule: "57 * * * *"
  # -- The image the log and trace jobs run: it needs a shell, `curl` and
  # `rclone`. Named rather than built here, so the estate can mirror it.
  image:
    repository: rclone/rclone
    tag: "1.73.0"
  # -- Give up rather than overlap. A backup job that is still running an
  # hour later is a backup that is not keeping up, and two of them racing
  # on one snapshot directory is worse than a missed run.
  activeDeadlineSeconds: 3000
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Store self-alerts.
#
# See docs/notifications.md, "Store self-alerts". These nineteen rules
# are not like `charts/platform-alerts`: that chart is generic across
# estates and refuses to guess a metric name, because it cannot know
# what a consumer's stores are called. This chart is not generic — it
# vendors the stores, the proxy, both vmalerts and the backup CronJobs
# itself — but "vendors the component" turned out NOT to mean "knows
# what it exports": measured against a live install, ten of the eleven
# `vm_`/`vl_`/`vt_`/`otelcol_`/`vmagent_`-family counters this design
# names — including `vm_rows_ignored_total`, the counter the incident
# below is about — are simply ABSENT from this chart's own metrics
# store. Not wrong values: no series under those names at all. See
# docs/safety.md, "The self-alerts, and the two incidents behind them",
# for the measurement and why (the log store, the trace store and the
# sibling chart's OpenTelemetry gateway have NOTHING scraping them into
# this store at all — a coverage gap, not a spelling one — and even
# `vm_rows_ignored_total`, on the ONE component that IS scraped, may be
# a counter VictoriaMetrics only registers once a row has actually been
# ignored, so its absence on a healthy install may be the correct,
# healthy shape rather than evidence of a wrong name; this session could
# not tell the two apart without causing the failure on purpose).
#
# So EVERY metric name below is a VALUE WITH NO DEFAULT, the same shape
# `charts/platform-alerts` already uses for its own `stores` list and
# for exactly the same reason: a name this chart has not seen accepted
# by a real /metrics response is a guess, and a guessed name renders
# cleanly and never fires, which is the one failure this whole
# repository exists to prevent. `selfAlerts.enabled` therefore defaults
# to FALSE — an install that turned it on today would get a `VMRule`
# with an empty rule list, which looks like coverage and is not. Turn it
# on once at least one rule below has a metric name confirmed against
# your own store's `/metrics`; each rule then renders independently and
# the rest stay silently absent, which is the honest outcome.
#
# All nineteen are MetricsQL, evaluated by the METRICS vmalert. Every
# counter here lives on a component's own /metrics endpoint next to
# every other Prometheus-style metric that component exports — none of
# it is read out of the log or trace store's DATA — so none carries
# `observability.rule-type: vlogs`.
#
# Rules are named per store (`MetricStore`/`LogStore`/`TraceStore`)
# wherever the failure is one specific store's; three stores exist, and
# a rule named just "Store..." does not say which one paged you. A rule
# stays generic (`WriterBufferGrowing`, `WriterDroppingPackets`,
# `ProxyAtConcurrencyLimit`) only where it genuinely is not about any one
# store.
#
# This release closes part of the coverage gap directly: see
# `victoria-logs-single.server.serviceMonitor` and
# `victoria-traces-single.server.serviceMonitor` below, which give the
# log and trace stores — components THIS chart itself renders — a
# `ServiceMonitor` for the first time. It does not close the gap for
# `charts/observability-emitters`' vmagent, vlagent or OpenTelemetry
# gateway; that chart's scrape coverage is its own to fix.
selfAlerts:
  enabled: false

  # MetricStoreIgnoringRows.
  #
  # THE INCIDENT: a series pushed past the metrics store's per-day label
  # limit is discarded WHILE THE WRITE STILL ANSWERS 200 — a collector
  # reported 888k rows written with zero errors while the store held
  # none of them, and `vm_rows_ignored_total` sat at 9,748,387 with
  # nothing else showing it. This is the rule that would have caught it.
  #
  # NOT DEFAULTED. `vm_` names ARE scraped into this store's vmsingle (63
  # of them, measured), but this exact one was not among them on a
  # healthy live install — plausibly because VictoriaMetrics registers a
  # reason-labelled counter like this one lazily, only once a row has
  # actually been ignored, which is indistinguishable from a wrong name
  # without causing the failure on purpose. Confirm it exists before
  # relying on it.
  #
  # Healthy range: 0. The counter only advances when a sample is refused
  # for exceeding a configured limit; a write path that is not hitting
  # one never touches it, so `for:` exists to ride out a single scrape
  # gap rather than to tolerate a nonzero baseline.
  ingest:
    metric: ""
    window: 5m
    for: 5m
    severity: critical

  # MetricStoreCardinalityNearLimit, MetricStoreDailyCardinalityNearLimit.
  #
  # VictoriaMetrics' hourly/daily series limiter (`storage.maxHourlySeries`
  # / `storage.maxDailySeries` above, both off by default) is believed to
  # expose a current/max gauge pair per window when a cap is set. NOT
  # DEFAULTED: the exact metric names for the vmsingle version this
  # chart's `victoria-metrics-k8s-stack` pin (0.93.0) brings in were not
  # confirmed this session. Confirm against your own store's `/metrics`
  # before setting a pair; each renders independently of the other, and
  # neither renders while unset — which is the honest outcome, the same
  # one platform-alerts' storeLimits gives a store with no free-space
  # metric. Two separate alerts, not one alert with an hourly/daily
  # label: different windows, different meanings, and a name that says
  # which one fired.
  cardinality:
    hourlyCurrentSeriesMetric: ""
    hourlyMaxSeriesMetric: ""
    dailyCurrentSeriesMetric: ""
    dailyMaxSeriesMetric: ""
    # -- Fire at this fraction of the limit — docs/notifications.md's own
    # "90% of the limit". The same headroom idea as platform-alerts'
    # storeLimits `headroomFactor`, read the other way round: arrive
    # before the cap silently starts dropping new series, not after.
    ratio: 0.9
    # -- The most spike-prone rule in this file: it is a RATIO, and a
    # series burst that the store absorbs on its own pushes the ratio up
    # and back down within minutes. 5m is short enough that a real climb
    # toward either limit is still caught with margin before it bites —
    # the hourly window itself is only 12x this long — and long enough
    # that a burst which resolves itself does not page anyone.
    for: 5m
    severity: warning

  # LogStoreDroppingRows, TraceStoreDroppingRows.
  #
  # `vl_rows_dropped_total` and `vt_rows_dropped_total` are named in
  # docs/notifications.md, but NOT DEFAULTED here regardless: measured
  # against a live install, `vl_` and `vt_` have ZERO metric names in
  # this store at all — nothing scrapes either store into it, so no
  # name under either prefix could possibly be confirmed yet. This
  # release adds `victoria-logs-single.server.serviceMonitor` and
  # `victoria-traces-single.server.serviceMonitor` below, which should
  # close that; once it does, confirm the name and set it here.
  #
  # Healthy range, once confirmed: 0 — a store that is not refusing rows
  # never touches its counter. Safe to leave on with a store disabled:
  # `rate()` of a counter with no matching series returns no data, not
  # zero, so an absent store never fires this.
  logStore:
    metric: ""
    window: 5m
    for: 5m
    severity: critical
  traceStore:
    metric: ""
    window: 5m
    for: 5m
    severity: critical

  # GatewayQueueFilling, GatewayExportFailing, GatewayEnqueueFailing.
  #
  # THE INCIDENT (this week): a network policy change cut
  # `charts/observability-emitters`' OpenTelemetry gateway off from its
  # own proxy, and "sending queue is full" ran for hours with every pod
  # Running and nothing reporting it. `otelcol_exporter_queue_size` /
  # `_capacity`, `otelcol_exporter_send_failed_*` and
  # `_enqueue_failed_*` are named in the incident report and in
  # docs/reference.md's own `otlp.podMonitor` entry, which already calls
  # out the failed/enqueue-failed pair by name — but NOT DEFAULTED
  # regardless: measured against a live install, `otelcol_` has ZERO
  # metric names in this store. The gateway is a component of the
  # SIBLING chart, and unlike the log and trace stores this release does
  # not add scrape coverage for it — that chart's coverage is its own to
  # fix (see docs/safety.md). Once it is scraped into this store, its
  # metrics reach vmalert here directly, the same way this chart's own
  # stores' counters do, and never through the proxy.
  #
  # Export failure and enqueue failure are different losses — one is the
  # DESTINATION refusing a batch the gateway already accepted, the other
  # is the gateway's own QUEUE refusing at the door — so they are two
  # rules, not one: a single rule cannot tell an operator which one
  # paged them. `_send_failed_` and `_enqueue_failed_` both carry a
  # per-signal suffix (spans, metric_points, log_records) this session
  # did not enumerate with confidence; both `*MetricPrefix` values below
  # are matched by `__name__` PREFIX rather than an enumerated suffix, so
  # confirming either does not also require enumerating every signal
  # this gateway exports for.
  gateway:
    queueSizeMetric: ""
    queueCapacityMetric: ""
    # -- Healthy range: comfortably under 1, since a queue that is never
    # exercised sits near 0. 0.8 is the "queue above 80%" the incident
    # report gives — headroom before the queue is full and the collector
    # starts blocking or dropping.
    queueRatio: 0.8
    queueFor: 10m
    queueSeverity: warning
    exportFailedMetricPrefix: ""
    # -- Healthy range: 0. A send failure is not something a healthy
    # exporter path produces at any rate.
    exportFailWindow: 5m
    exportFailFor: 5m
    exportFailSeverity: critical
    enqueueFailedMetricPrefix: ""
    # -- Healthy range: 0, same reasoning as the export-fail window
    # above — an enqueue failure is not something a healthy exporter
    # path produces at any rate either.
    enqueueFailWindow: 5m
    enqueueFailFor: 5m
    enqueueFailSeverity: critical

  # MetricStoreDiskNearGuard, LogStoreDiskNearGuard, TraceStoreDiskNearGuard.
  #
  # `vm_free_disk_space_bytes` / `vm_free_disk_space_limit_bytes` is the
  # exact pair `charts/platform-alerts`' own `stores` example already
  # documents for the metrics store — but NOT DEFAULTED here either:
  # measured against a live install, `vm_free_disk_space_bytes` is
  # absent from vmsingle's own 63 scraped `vm_` names, despite
  # `storage.minFreeDiskSpaceBytes` being set above. Unlike
  # `vm_rows_ignored_total`, a free-space GAUGE has no obvious reason to
  # be registered lazily, so this is a real open question rather than an
  # expected absence — see docs/safety.md.
  #
  # All three stores are symmetric and equally unconfirmed:
  # `headroomFactor` mirrors platform-alerts' `storeLimits` value and
  # default (2), comfortably above the 1x at which a store already
  # stopped accepting writes. Each store's rule renders only once its
  # pair is set, under its own per-store alert name — a logs or traces
  # store that fills its disk switches to read-only and does not drop
  # data to recover, so this covers all three stores, not only the
  # metrics one.
  diskGuard:
    headroomFactor: 2
    # -- Free space falls MONOTONICALLY under normal operation — nothing
    # gives space back to a store between writes — so a single reading
    # under the guard is a measurement artefact (a stale scrape, a
    # momentary read against a filesystem mid-flush), not a trend.
    # Minutes, not seconds: long enough to ride out one bad reading,
    # short enough that a real approach to the guard is still caught
    # with the headroom above to act in.
    for: 10m
    severity: warning
    metrics:
      freeSpaceMetric: ""
      freeSpaceLimitMetric: ""
    logs:
      freeSpaceMetric: ""
      freeSpaceLimitMetric: ""
    traces:
      freeSpaceMetric: ""
      freeSpaceLimitMetric: ""

  # MetricStoreSnapshotOlderThanWindow, LogStoreSnapshotOlderThanWindow,
  # TraceStoreSnapshotOlderThanWindow.
  #
  # Not a store-exported counter: the newest-snapshot age this rule
  # watches is the age of the last SUCCESSFUL run of the backup CronJobs
  # `templates/backup.yaml` itself renders in this release, read from
  # `kube_cronjob_status_last_successful_time` — the exact metric
  # `charts/platform-alerts`' own CronJobNotSucceeding rule already
  # relies on, and NOT a name this session is unsure of: kube-state-
  # metrics' CronJob metrics are among the most standard in the
  # ecosystem. What IS unconfirmed is coverage rather than spelling:
  # `kube-state-metrics.enabled: false` above is deliberate — this
  # release's own store is not meant to duplicate an estate's shared
  # kube-state-metrics — so whether THIS store carries the metric at all
  # depends on whether the estate's shared collection layer remote-writes
  # kube-state-metrics data into it, which this session could not check.
  # Confirm before relying on it the same as any other rule here; unlike
  # the rest, the fix if it is missing is a scrape-coverage decision for
  # the estate, not a name this chart could guess differently.
  #
  # Not gated behind `metric` the way the others are, because the name
  # itself is not in question — but each store's rule still renders only
  # while `backup.enabled` and `backup.<store>.enabled` are both true,
  # since a CronJob that does not exist has nothing to watch. Named per
  # store, the same as `diskGuard` above, rather than one alert
  # distinguished only by a label.
  #
  # Each `maxAge` is the store's own schedule plus slack, the same
  # doctrine as platform-alerts' `groups.backups.maxSuccessAge`: change
  # `backup.<store>.schedule` above and update the matching `maxAge`
  # with it, since the two are not derived from one another. The
  # defaults below suit the hourly schedules `backup.yaml` ships by
  # default (2x the schedule plus a little).
  snapshotAge:
    # -- The condition itself is slow-moving — a snapshot is hours old or
    # it is not — but the signal behind it is a live CronJob status field,
    # and `kube_cronjob_status_last_successful_time` can be briefly
    # absent from a scrape while a job is actively running and the
    # controller has not yet written its result. Long enough that a job
    # in flight does not page; short against each `maxAge` below, which
    # is already hours, so a real stale snapshot is not meaningfully
    # delayed.
    for: 30m
    severity: critical
    metrics:
      maxAge: 150m
    logs:
      maxAge: 2h
    traces:
      maxAge: 2h

  # LogStoreStreamsChurning, TraceStoreStreamsChurning: unconfirmed in
  # BOTH spelling and coverage. VictoriaLogs and VictoriaTraces are each
  # believed to export a counter of streams created, for exactly this
  # failure (a non-constant stream field), but this session found no
  # name for either to confirm — not in docs/notifications.md, not in
  # `charts/platform-alerts`, not in the vendored chart archives — and,
  # like *StoreDroppingRows above, nothing scrapes either store into
  # this release's metrics store yet regardless. Two rules, not one:
  # different stores key streams differently (the trace store on
  # `service.name` AND the span name), so the usual cause differs too.
  #
  # `perSecond` and `for` ARE defaulted, unlike every metric name in this
  # file: a healthy install creates roughly a stream per pod per day, so
  # 1 stream/second averaged over an hour is already two orders of
  # magnitude above that baseline — a real, defensible number rather
  # than a guessed metric name, the same distinction `diskGuard`'s
  # `headroomFactor` and `cardinality`'s `ratio` already draw.
  logStreamChurn:
    streamsCreatedMetric: ""
    perSecond: 1
    for: 1h
    severity: warning
  traceStreamChurn:
    streamsCreatedMetric: ""
    perSecond: 1
    for: 1h
    severity: warning

  # WriterBufferGrowing, WriterDroppingPackets: read as vmalert's own
  # `remoteWrite` path (`templates/vmalert.yaml` sets `remoteWrite` on
  # both alerters, against the metrics store) — vmalert shares its
  # remote-write client with vmagent, but whether it exports that
  # client's metrics under the SAME names was not confirmed this
  # session, and the measured live store had zero `vmagent_`-prefixed
  # names to check either binary's family against. Generic across
  # writers on purpose: whichever remote-write agent's buffer the
  # confirmed name belongs to, growing or dropping is the same failure.
  #
  # `WriterBufferGrowing` fires on the buffer's own rate of change
  # (`deriv(...) > 0`) rather than a fixed byte threshold: there is no
  # size this chart could state generically, and a buffer that is
  # GROWING AT ALL is already the failure worth looking at, the same
  # "above zero" reasoning `ingest` above uses.
  #
  # `ProxyAtConcurrencyLimit`: vmauth's `VMAuth` CR accepts a concurrency
  # cap (see the `everything` test case's `maxConcurrentRequests`).
  # UNLIKE every other rule in this file, a live measurement (see
  # docs/safety.md) found `vmauth_concurrent_requests_limit_reached_total`
  # PRESENT on the store — the one counter with actual evidence behind
  # it rather than a guess. It is still not written in below: this chart
  # holds every metric name to the same "no default" rule rather than
  # carving out an exception for the one that happened to be confirmed
  # by someone else's measurement instead of this session's own reading
  # of an upstream doc or source file. Set it here once you have read it
  # back the same way.
  #
  # Each renders only once its metric name is supplied — never before.
  writer:
    bufferMetric: ""
    droppedPacketsMetric: ""
    for: 10m
    severity: critical
  proxyConcurrency:
    limitedRequestsMetric: ""
    window: 5m
    for: 5m
    severity: warning

###############################################################################
# Upstream charts.
#
# Everything below is the vendor's own values shape, set to what this
# stack needs. The comments say which failure each setting prevents; the
# refusals in templates/_validate.tpl enforce the ones that are silent.
###############################################################################

# -- victoria-metrics-k8s-stack: the operator, and the metrics store it
# reconciles.
victoria-metrics-k8s-stack:
  enabled: true

  victoria-metrics-operator:
    # -- The CRDs are NOT this chart's to install.
    #
    # They are cluster-scoped and shared by every release in the cluster,
    # so a chart that owns them deletes them for everybody when that one
    # release is uninstalled, taking every VMSingle, VMRule and VMUser
    # object with them. `charts/observability-crds` owns them and is
    # applied first (docs/adoption.md).
    #
    # Both keys are needed: upstream disables CRD creation only when
    # `enabled: false` AND `plain: false`, because a Helm dependency
    # condition cannot gate a `crds/` directory. `plain: true` with
    # `enabled: false` still installs them.
    crds:
      enabled: false
      plain: false
      cleanup:
        # -- The cleanup Job deletes every VictoriaMetrics object in the
        # namespace on uninstall. Off: an uninstall is not a request to
        # delete the data, and a helm rollback that runs it is a very bad
        # afternoon.
        enabled: false
    admissionWebhooks:
      # -- `Ignore` so an install does not race the operator's own webhook
      # server on the first pass. Tighten to `Fail` once the operator is
      # in steady state.
      policy: Ignore
      # -- The webhook's certificate comes from cert-manager, which is why
      # cert-manager is a prerequisite (docs/adoption.md).
      #
      # The alternative is upstream's default: the chart GENERATES a
      # self-signed CA at render time. That is a new certificate on every
      # `helm upgrade` — a webhook restart each time, a render that is not
      # a function of its inputs, and a golden file that can never match
      # its own regeneration. A chart whose output changes when nothing
      # changed is one whose diffs nobody reads.
      certManager:
        enabled: true
    operator:
      # -- The prometheus-operator converter watches ServiceMonitors and
      # turns them into VMServiceScrapes. Off: this stack is not the
      # estate's Prometheus, and converting objects somebody else owns is
      # how two controllers end up fighting over one scrape.
      disable_prometheus_converter: true
    resources:
      requests:
        cpu: "1"
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 512Mi

  # The metrics store.
  vmsingle:
    enabled: true
    spec:
      # -- Retention ALWAYS carries a unit. VictoriaMetrics reads a bare
      # number as MONTHS (`-retentionPeriod=90` is seven and a half
      # years), and the month suffix is a capital `M` — a lowercase `m`
      # is rejected at startup. The chart refuses a value without a unit
      # rather than letting the default meaning apply.
      retentionPeriod: 90d
      replicaCount: 1
      extraArgs:
        # -- MIRROR: `interval`. The dedup window keeps one sample per
        # interval, so it must equal the scrape interval exactly.
        dedup.minScrapeInterval: 30s
        # -- The metrics store has NO `-retention.maxDiskUsagePercent` and
        # no `-retention.maxDiskSpaceUsageBytes`; those exist only on the
        # log and trace stores. Its only disk guard is this one, and
        # upstream's default is 100MB — small enough that the store goes
        # read-only with the disk already full, which is the state that
        # takes an outage to get out of. GiB-scale, so there is room to
        # act.
        storage.minFreeDiskSpaceBytes: "10GiB"
        # -- Cardinality caps. Both default to 0, which is OFF, and this
        # chart leaves them off: a cap is a number about one estate's
        # traffic, and a guessed one either never binds or silently drops
        # every NEW series while the old ones keep ingesting — a failure
        # that looks exactly like "the exporter stopped exporting". Set
        # them from the measured active-series count, with headroom, and
        # alert on `vm_hourly_series_limit_current_series` approaching
        # them.
        storage.maxHourlySeries: "0"
        storage.maxDailySeries: "0"
        # -- Credentials from the caller's Secret, as environment
        # variables rather than flags.
        envflag.enable: "true"
        envflag.prefix: VM_
      # -- MIRROR: `storeCredentials`. The store's own basic auth, so that
      # nothing in the cluster can reach it around the proxy.
      extraEnvs:
        - name: VM_httpAuth_username
          valueFrom:
            secretKeyRef:
              name: observability-store-credentials
              key: username
        - name: VM_httpAuth_password
          valueFrom:
            secretKeyRef:
              name: observability-store-credentials
              key: password
      # -- Requests EQUAL limits, and the CPU is an INTEGER.
      #
      # Both halves matter. VictoriaMetrics sizes its thread pool from the
      # cgroup CPU quota and rounds DOWN, so `1500m` buys exactly one
      # thread and the other 500m is paid for and unused. And a store
      # whose requests are below its limits is evicted first under node
      # pressure, which is the moment it is most needed.
      #
      # Setting this at all is not optional: with `resources` unset the
      # operator applies its own defaults (1500Mi / 1200m for VMSingle),
      # and 1200m is a fractional CPU, so an unset value is the rounding
      # failure by default.
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "2"
          memory: 8Gi
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi

  # -- vmalert comes from this chart, not from upstream: there are two of
  # them and they differ by rule type, which upstream's single `vmalert`
  # section cannot express.
  vmalert:
    enabled: false
  # -- Alertmanager likewise: the Watchdog receiver reads its URL from a
  # mounted Secret, which means the chart has to own the config and the
  # mount.
  alertmanager:
    enabled: false
  # -- Collection belongs to `charts/observability-emitters`: an agent
  # that runs next to the store, scraping only what is in this namespace,
  # is not the estate's metrics pipeline and quietly becomes one.
  vmagent:
    enabled: false
  # -- The rules are `charts/platform-alerts`, where each one carries the
  # incident that earned it and a fixture that must fail.
  defaultRules:
    create: false
  defaultDashboards:
    enabled: false
  # -- Grafana is a direct dependency of this chart (see `grafana` below),
  # so the copy bundled inside this one stays dormant.
  grafana:
    enabled: false
    forceDeployDatasource: false
  # -- kube-state-metrics and node-exporter are the cluster's, not this
  # release's. Two installs of kube-state-metrics export the same series
  # twice and every rate() over them is wrong.
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  # -- Control-plane scrapes belong to whatever collects them today.
  kubelet:
    enabled: false
  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeDns:
    enabled: false
  coreDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false

# -- victoria-logs-single: the log store.
victoria-logs-single:
  enabled: true
  server:
    # -- WITH A UNIT, always: VictoriaLogs reads a bare number as months
    # too, and its own default is 7d — three months of logs is not what
    # an estate that wrote `90` expects, and neither is a week.
    retentionPeriod: 90d
    # -- The disk guard. `-retention.maxDiskUsagePercent` and
    # `-retention.maxDiskSpaceUsageBytes` are MUTUALLY EXCLUSIVE: the
    # binary refuses to start when both are set, which turns a values
    # typo into a store that never comes back. The chart refuses that
    # combination at render time instead.
    #
    # Retention applies INDEPENDENTLY of this: whichever bites first wins,
    # and a disk guard does not extend `retentionPeriod`.
    retentionMaxDiskUsagePercent: 80
    retentionDiskSpaceUsage: ""
    replicaCount: 1
    extraArgs:
      envflag.enable: true
      envflag.prefix: VM_
      loggerFormat: json
      http.shutdownDelay: 15s
      # -- Upstream's default here is 10MB, which is not a guard, it is a
      # rounding error: the store goes read-only with the volume already
      # full.
      storage.minFreeDiskSpaceBytes: 10GiB
    # -- MIRROR: `storeCredentials`.
    env:
      - name: VM_httpAuth_username
        valueFrom:
          secretKeyRef:
            name: observability-store-credentials
            key: username
      - name: VM_httpAuth_password
        valueFrom:
          secretKeyRef:
            name: observability-store-credentials
            key: password
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 4Gi
    persistentVolume:
      enabled: true
      size: 200Gi
    statefulSet:
      enabled: true
    # -- The log store's OWN scrape object, added because measured
    # against a live install nothing scraped this store at all: `vl_`
    # had zero metric names in the metrics store, which is why every
    # `selfAlerts` rule that watches this store has no default metric
    # name to offer either. A `ServiceMonitor`, never a `VMServiceScrape`
    # — docs/safety.md, "Scrape objects are always the Prometheus
    # Operator kinds" — because that is the one shape this repository's
    # collection layer is guaranteed to read regardless of which agent
    # or Target Allocator is doing the actual scraping underneath.
    #
    # `basicAuth` is MIRROR: `storeCredentials` — the same credential
    # pair `env` above already mounts into the store, read back by
    # whatever scrapes it, since `-httpAuth.*` above refuses every
    # unauthenticated request including this one.
    serviceMonitor:
      enabled: true
      basicAuth:
        username:
          name: observability-store-credentials
          key: username
        password:
          name: observability-store-credentials
          key: password

# -- victoria-traces-single: the trace store.
victoria-traces-single:
  enabled: true
  server:
    # -- Traces are the shortest-lived of the three: they answer "what
    # happened in that request", which is a question people ask within
    # days, and they are the largest per unit of value.
    retentionPeriod: 30d
    retentionDiskSpaceUsage: ""
    replicaCount: 1
    extraArgs:
      envflag.enable: true
      envflag.prefix: VM_
      loggerFormat: json
      http.shutdownDelay: 15s
      # -- The percentage guard has no value of its own in this chart, so
      # it goes here. Setting `retentionDiskSpaceUsage` as well is the
      # mutually-exclusive pair the chart refuses.
      retention.maxDiskUsagePercent: 80
      storage.minFreeDiskSpaceBytes: 10GiB
      # -- The Jaeger dependency graph — Grafana's "Node Graph" / service
      # map over `api/dependencies` — is computed by a background task
      # that upstream ships disabled. Off is written out here, not left
      # to upstream's own default, because off LOOKS like a bug: the
      # endpoint answers `200` with `{"data":[],"total":0}` rather than
      # an error, so a consumer sees an empty panel with nothing naming
      # the cause, even on an install where context propagation and the
      # trace reads both work.
      #
      # This is upstream-experimental. Whether the graph it computes is
      # written back into the store — and so costs retention headroom
      # and write throughput the way a trace itself does — is inferred
      # from the endpoint existing at all, not measured here.
      #
      # The companion flags, all with the same prefix, for whoever turns
      # this on: `taskInterval` (how often it runs), `taskLookbehind`
      # (the window each run covers), `taskLimit` (max service-graph
      # relations per tenant per run), `taskTimeout`, and
      # `databaseTaskLimit` (max service-database relations per tenant;
      # `0` turns the database graph off on its own).
      #
      # Only supported on a single-node or vtstorage deployment — this
      # chart's shape, not a cluster one.
      servicegraph.enableTask: "false"
    # -- MIRROR: `storeCredentials`.
    env:
      - name: VM_httpAuth_username
        valueFrom:
          secretKeyRef:
            name: observability-store-credentials
            key: username
      - name: VM_httpAuth_password
        valueFrom:
          secretKeyRef:
            name: observability-store-credentials
            key: password
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi
    persistentVolume:
      enabled: true
      size: 100Gi
    # -- The trace store's own scrape object. Same reasoning as the log
    # store's above: measured against a live install `vt_` also had zero
    # metric names in the metrics store. `basicAuth` is MIRROR:
    # `storeCredentials`.
    serviceMonitor:
      enabled: true
      basicAuth:
        username:
          name: observability-store-credentials
          key: username
        password:
          name: observability-store-credentials
          key: password

# -- Grafana. Off by default: an estate that already runs one points it at
# this stack's proxy instead, and two Grafanas over one store is two sets
# of dashboards that drift.
#
# Every value here is upstream's own shape. What matters is which ones are
# NOT at their upstream defaults, and why.
grafana:
  enabled: false
  replicas: 1
  # -- The admin credentials, from a Secret the estate created.
  #
  # Left empty, the Grafana chart GENERATES a random password into a
  # Secret of its own — a new one on every render, so every `helm upgrade`
  # rotates the admin password and the only person who can still log in is
  # whoever wrote down the last one. It also makes the release's manifest
  # differ from itself when nothing changed, which is how a diff stops
  # being read. The chart refuses an enabled Grafana without one.
  admin:
    existingSecret: ""
    userKey: admin-user
    passwordKey: admin-password
  # -- Datasources, provisioned.
  #
  # Each one points at the PROXY, never at a store, and carries
  # `oauthPassThru: true` so the signed-in person's own token travels with
  # the query and the proxy scopes it to their clusters and namespaces. Without it every
  # query arrives as Grafana's own identity, and a viewer sees everything
  # Grafana can see — the chart refuses a datasource without it.
  #
  # `version` is the caller's to bump. With more than one replica Grafana
  # only updates a provisioned datasource whose version is greater than or
  # equal to the stored one, so a datasource edited without a bump is an
  # edit that lands on a fresh install and nowhere else.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          uid: victoriametrics
          isDefault: true
          version: 1
          url: http://vmauth-observability-stack:8427/prometheus
          jsonData:
            oauthPassThru: true
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          uid: victorialogs
          version: 1
          url: http://vmauth-observability-stack:8427
          jsonData:
            oauthPassThru: true
        # The trace store, through the same proxy. `jaeger` rather than a
        # VictoriaTraces plugin: the store serves the Jaeger select API
        # and Grafana ships that datasource in core, so there is no
        # plugin to install.
        #
        # `jaeger` rather than `tempo` is also not arbitrary. The store
        # answers both dialects and implements neither completely, and an
        # endpoint it does not implement returns 400, which a datasource
        # reports as a failed query rather than as a missing feature.
        # Grafana's Jaeger datasource happens to call only endpoints the
        # store has; its Tempo datasource calls `api/status/buildinfo` to
        # decide which features the backend supports, and that one is
        # unsupported. docs/safety.md has the measured table, and
        # hack/trace-api.sh re-measures it.
        #
        # Three stores, three URL SHAPES, and they do not resemble each
        # other. The metrics datasource takes a `/prometheus` base and
        # appends `/api/v1/...`; the logs plugin takes the ROOT and
        # appends `/select/logsql/query` itself; this one takes
        # `/select/jaeger`. Naming the logs plugin's query path here is
        # the mistake that reads back as
        # `/select/logsql/select/logsql/query` and
        # `unsupported path requested`.
        - name: VictoriaTraces
          type: jaeger
          access: proxy
          uid: victoriatraces
          version: 1
          url: http://vmauth-observability-stack:8427/select/jaeger
          jsonData:
            oauthPassThru: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      provider:
        name: sidecar
        orgid: 1
        # -- Above 10 on purpose. At 10 or below Grafana watches the
        # filesystem for changes instead of polling, and a Kubernetes
        # ConfigMap projection is a symlink swap that fires no watch
        # event — so dashboards never update, and nothing reports an
        # error. The chart refuses 10 or less.
        updateIntervalSeconds: 30
        disableDelete: false
        allowUiUpdates: false
    datasources:
      enabled: false
  # -- The signing key for session cookies, identical across replicas.
  # Grafana generates one per pod when it is unset, so with two replicas
  # every other request lands on the pod that cannot read the cookie and
  # the user is signed out at random. From the caller's Secret.
  envValueFrom:
    GF_SECURITY_SECRET_KEY:
      secretKeyRef:
        name: ""
        key: secret_key
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: ""
        key: client_id
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: ""
        key: client_secret
  grafana.ini:
    analytics:
      # -- Off: a monitoring system that phones home from inside a private
      # estate is a data-egress question nobody asked for.
      check_for_updates: false
      reporting_enabled: false
    users:
      auto_assign_org: true
    database:
      # -- Grafana takes a database lock through its schema migration at
      # startup. The default of 0 means "do not wait", so the second
      # replica of a rolling update finds the lock held and crash-loops
      # through the migration. 60-300 is a value that waits.
      locking_attempt_timeout_sec: 120
    auth:
      disable_login_form: true
      oauth_auto_login: true
    auth.generic_oauth:
      enabled: true
      name: SSO
      allow_sign_up: true
      # -- TRUE, against Grafana's own default of false.
      #
      # Without it the session outlives the access token: Grafana keeps
      # the person signed in for up to 30 days while forwarding an access
      # token that expired an hour ago. The UI works, every query 401s,
      # and the person's own reflex — sign out and back in — fixes it
      # just long enough to make the report unreproducible.
      use_refresh_token: true
      # -- A person whose claims map to no role is refused, rather than
      # silently given the default one. An unmapped viewer is a support
      # ticket; an unmapped editor is an incident.
      role_attribute_strict: true
      role_attribute_path: "contains(groups[*], 'example:grafana:admin') && 'Admin' || contains(groups[*], 'example:grafana:editor') && 'Editor' || 'Viewer'"
      scopes: "openid profile email groups offline_access"
      auth_url: ""
      token_url: ""
      api_url: ""
    unified_alerting:
      # -- OFF, and the chart refuses it on. Alerting in this stack is
      # vmalert and Alertmanager: rules live in `platform-alerts` where
      # each one carries the incident that earned it, and a second
      # alerting engine with its own rules, its own silences and its own
      # notification policies is a second place to look at three in the
      # morning.
      enabled: false
    alerting:
      enabled: false
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 512Mi
