# expect: carries no `labeldrop` of `k8s_namespace_name`
# With the whole chain removed, every kube_* series on the whole cluster
# is stamped with THIS RELEASE's own namespace (the kube-state-metrics
# pod's own) rather than the namespace of the object each series
# describes.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  prometheus:
    monitor:
      http:
        metricRelabelings: []
