# The generic dashboard set, fetched by hack/dashboards.sh.
#
# Every URL here is one already named in the upstream store chart's own
# `defaultDashboards.sources` list (see
# charts/observability-stack/charts/victoria-metrics-k8s-stack-*.tgz,
# values.yaml) — never invented — with `master`/`main` replaced by a
# pinned ref so a bump is a deliberate, reviewable diff rather than
# whatever upstream's default branch holds on render day.
#
# `seedQuery` is the label-values selector the generated `cluster`
# variable queries — reused from each dashboard's own pre-existing `job`
# variable, so the cluster list comes from the same metric the dashboard
# already trusts to exist.
dashboards:
  - name: victoriametrics-single
    upstream: victoriametrics
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/{ref}/dashboards/victoriametrics.json
    ref: v1.152.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"victoria-metrics-.*"}'

  - name: victoriametrics-vmagent
    upstream: victoriametrics
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/{ref}/dashboards/vmagent.json
    ref: v1.152.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"^vmagent.*"}'

  - name: victoriametrics-vmalert
    upstream: victoriametrics
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/{ref}/dashboards/vmalert.json
    ref: v1.152.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"^vmalert.*"}'

  - name: victoriametrics-operator
    upstream: victoriametrics
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/{ref}/dashboards/operator.json
    ref: v1.152.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'operator_log_messages_total'

  - name: victorialogs-single
    upstream: victorialogs
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/{ref}/dashboards/victorialogs.json
    ref: v1.121.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"victoria-logs-.*"}'

  - name: victorialogs-vlagent
    upstream: victorialogs
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/{ref}/dashboards/vlagent.json
    ref: v1.121.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"^vlagent.*"}'

  - name: victoriatraces-single
    upstream: victoriatraces
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaTraces/{ref}/dashboards/victoriatraces.json
    ref: v0.11.1
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"victoria-traces-.*"}'

  # Alertmanager and kubelet are not standalone URLs in
  # defaultDashboards.sources: both come bundled inside the
  # kube-prometheus mixin's single dashboard-definitions manifest, which
  # upstream's own `kube-prometheus` source entry points at. Each is one
  # ConfigMap's `data` key inside that manifest's `items` list.
  - name: alertmanager
    upstream: kube-prometheus
    bundle: kube-prometheus
    bundleKey: alertmanager-overview.json
    folder: stores
    tags: [observability-stores]
    seedQuery: 'alertmanager_alerts'
    namespaceScoped: true
    # Alertmanager is optional; where it is not enabled every panel is
    # empty by construction, not by a wrong selector.
    requires: [alertmanager]

  - name: kubelet
    upstream: kube-prometheus
    bundle: kube-prometheus
    bundleKey: kubelet.json
    folder: infrastructure
    tags: [observability-kubernetes]
    # kubelet.json already ships its own cluster variable and filters
    # every query by a bare `cluster` label — upstream's own multi-cluster
    # convention. This repo's collectors stamp `k8s_cluster_name`
    # instead (see README's "The model"), so the fetch step RENAMES the
    # label rather than adding a second, always-empty filter beside it —
    # left alone, `cluster="$cluster"` would match nothing, because
    # nothing here ever sets a bare `cluster` label.
    preRenamed: true

  # node-exporter-full has no seedQuery: it is rewritten by the generic
  # rule (every panel already keys off `job`/`nodename`, no dashboard
  # here needs a second seed).
  - name: node-exporter-full
    upstream: rfmoz
    url: https://raw.githubusercontent.com/rfmoz/grafana-dashboards/{ref}/prometheus/node-exporter-full.json
    # rfmoz/grafana-dashboards tags no releases; pinned by commit.
    ref: 99a25cc154c21c4fcbae1aa24352bf1b6764d847
    folder: infrastructure
    tags: [observability-kubernetes]
    seedQuery: 'node_uname_info'
    # No install runs node-exporter yet.
    requires: [node-exporter]

  # -- Operational views (charts/observability-dashboards 0.12.0). Held to
  # tests/dashboard_queries_test.go (`queryCheck`): every query must parse
  # on the pinned VictoriaMetrics and read only metrics listed in
  # hack/dashboards/available-metrics.yaml.

  # The home page. Authored here (hack/dashboards/fleet_overview.py), not
  # fetched: nothing upstream answers "is anything wrong, and where?" for a
  # store with these sources.
  - name: fleet-overview
    authored: true
    generator: hack/dashboards/fleet_overview.py
    folder: fleet
    tags: [observability-fleet]
    queryCheck: true

  # dotdc/grafana-dashboards-kubernetes, adapted (hack/dashboards.py,
  # adapt_k8s_views): the `cluster` label becomes `k8s_cluster_name`, and
  # every query on a metric the store does not hold is replaced or dropped.
  # k8s-views-nodes is NOT imported: it is built on node-exporter, which no
  # install runs yet. Add it, with node-exporter's metric family in
  # available-metrics.yaml, when that source ships.
  - name: k8s-views-global
    upstream: dotdc
    url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/{ref}/dashboards/k8s-views-global.json
    ref: v3.0.8
    adapt: k8s-views
    folder: kubernetes
    tags: [observability-kubernetes, kubernetes]
    queryCheck: true

  - name: k8s-views-namespaces
    upstream: dotdc
    url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/{ref}/dashboards/k8s-views-namespaces.json
    ref: v3.0.8
    adapt: k8s-views
    folder: kubernetes
    tags: [observability-kubernetes, kubernetes]
    queryCheck: true

  - name: k8s-views-pods
    upstream: dotdc
    url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/{ref}/dashboards/k8s-views-pods.json
    ref: v3.0.8
    adapt: k8s-views
    folder: kubernetes
    tags: [observability-kubernetes, kubernetes]
    queryCheck: true

# Third-party provenance. Every fetched dashboard names its `upstream`
# here; hack/dashboards.py renders THIRD_PARTY_NOTICES.md from this and the
# per-dashboard `url`/`ref`, and tests/third_party_notices_test.go fails a
# catalog entry with no notice. `copyright` is the line the upstream
# LICENSE file states at the pinned ref, verbatim; "none stated" where the
# file is the unfilled Apache-2.0 appendix template. None of the upstreams
# ships a NOTICE file (checked at each pinned ref); if one does after a bump,
# carry its text into `notice` here.
upstreams:
  victoriametrics:
    project: VictoriaMetrics
    url: https://github.com/VictoriaMetrics/VictoriaMetrics
    license: Apache-2.0
    copyright: Copyright 2019-2026 VictoriaMetrics, Inc.
  victorialogs:
    project: VictoriaLogs
    url: https://github.com/VictoriaMetrics/VictoriaLogs
    license: Apache-2.0
    copyright: Copyright 2019-2025 VictoriaMetrics, Inc.
  victoriatraces:
    project: VictoriaTraces
    url: https://github.com/VictoriaMetrics/VictoriaTraces
    license: Apache-2.0
    copyright: Copyright 2019-2025 VictoriaMetrics, Inc.
  kube-prometheus:
    project: kube-prometheus (bundling the kubernetes-mixin dashboards)
    url: https://github.com/prometheus-operator/kube-prometheus
    license: Apache-2.0
    copyright: none stated (the LICENSE file is the unfilled Apache-2.0 template)
  rfmoz:
    project: rfmoz/grafana-dashboards
    url: https://github.com/rfmoz/grafana-dashboards
    license: Apache-2.0
    copyright: none stated (the LICENSE file is the unfilled Apache-2.0 template)
  dotdc:
    project: dotdc/grafana-dashboards-kubernetes
    url: https://github.com/dotdc/grafana-dashboards-kubernetes
    license: Apache-2.0
    copyright: Copyright 2020 David Calvert

bundles:
  kube-prometheus:
    url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/{ref}/manifests/grafana-dashboardDefinitions.yaml
    ref: v0.19.0
