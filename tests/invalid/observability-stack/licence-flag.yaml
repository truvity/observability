# expect: is an Enterprise flag, and this chart never renders one

# A licence flag is only useful to an Enterprise binary. Rendering one is
# how a chart that claims to wrap the community edition quietly stops
# doing so.
victoria-metrics-k8s-stack:
  vmsingle:
    spec:
      extraArgs:
        dedup.minScrapeInterval: 30s
        license: example-licence-key
