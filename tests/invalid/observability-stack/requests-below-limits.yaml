# expect: They must be equal, for the same reason the CPUs must
# The guaranteed rule, chosen rather than the default: every component
# carries an explicit requests == limits shape, and only the one this case
# names breaks it.
resources:
  policy: guaranteed
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
  - group: example:k8s:viewer
    grants:
    - cluster: example-cluster
      allNamespaces: true
victoria-traces-single:
  server:
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '1'
        memory: 2Gi
vmauth:
  resources:
    requests:
      cpu: '1'
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 512Mi
vmalert:
  resources:
    requests:
      cpu: '1'
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 512Mi
alertmanager:
  resources:
    requests:
      cpu: '1'
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 256Mi
victoria-metrics-k8s-stack:
  vmsingle:
    spec:
      resources:
        requests:
          cpu: '2'
          memory: 8Gi
        limits:
          cpu: '2'
          memory: 8Gi
  victoria-metrics-operator:
    resources:
      requests:
        cpu: '1'
        memory: 512Mi
      limits:
        cpu: '1'
        memory: 512Mi
victoria-logs-single:
  server:
    resources:
      requests:
        cpu: '2'
        memory: 4Gi
      limits:
        cpu: '2'
        memory: 4Gi
grafana:
  resources:
    requests:
      cpu: '1'
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 512Mi
