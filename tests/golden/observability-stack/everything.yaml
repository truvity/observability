# Source: observability-stack/templates/vmalertmanager.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: observability-stack
  labels:
    app.kubernetes.io/name: stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  replicaCount: 2
  resources:
    limits:
      cpu: "2"
      memory: 512Mi
    requests:
      cpu: "2"
      memory: 512Mi
  selectAllByDefault: false
  externalURL: "https://alerts.example.com"
  volumes:
    - name: watchdog
      secret:
        secretName: "example-watchdog-receiver"
  volumeMounts:
    - name: watchdog
      mountPath: /etc/alertmanager/watchdog
      readOnly: true
  configRawYaml: |
    route:
      receiver: "default"
      group_by: 
        - alertname
        - owner
        - stage
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 2h
      routes:
        # The heartbeat, first and matched on its own: it must never be
        # grouped with anything, never inhibited and never silenced by a
        # rule written for a real alert.
        - receiver: watchdog
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 2m
      - matchers:
        - severity = "critical"
        receiver: default
    receivers:
      - name: default
      - name: watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/watchdog/url
            send_resolved: false
    inhibit_rules:
      - equal:
        - alertname
        sourceMatchers:
        - severity = "critical"
        targetMatchers:
        - severity = "warning"

