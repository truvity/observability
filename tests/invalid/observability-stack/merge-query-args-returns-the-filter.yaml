# expect: vmselect treats each `extra_filters` as an ALTERNATIVE and ORs them
# The flag that hands a principal's own filter back to them.
#
# vmauth drops a client query argument that clashes with one the route
# already set, and that drop is the only thing stopping a reader sending
# its own `extra_filters` beside the enforced one.
# `-mergeQueryArgs` exempts an argument from the rule entirely.
#
# On the metrics path that is a full bypass rather than a narrowing:
# vmselect treats each `extra_filters` as an ALTERNATIVE and ORs them, so
# a caller adding an empty one reads every cluster and namespace — while the claim, the
# route and the rendered filter all stay exactly right.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

vmauth:
  extraArgs:
    logInvalidAuthTokens: "true"
    mergeQueryArgs: extra_filters

# `alertmanager.enabled` defaults to true, and with no `notifications`
# receiver configured that refusal fires before this fixture ever
# reaches its own check (see docs/safety.md). This is the minimum
# receiver that satisfies it, so the fixture is preempted no further.
notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
