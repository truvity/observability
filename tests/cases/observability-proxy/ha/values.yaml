# A Door case for charts/observability-proxy. It began as the Door half of the
# stack case of the same name, from the release in which the stack stopped
# rendering the Door: the stack's values kept to the keys this chart declares,
# with `stackReleaseName` set to the stack's release name, so the render
# carries the names the stack's Door objects always had. Every principal is an
# entry of `tenancy.identities`.
stackReleaseName: observability-stack
ha:
  enabled: true
  peer:
    metrics: http://vmsingle-replica-victoria-metrics-k8s-stack.observability.svc:8428
    logs: http://replica-victoria-logs-single-server.observability.svc:9428
    traces: http://replica-vt-single-server.observability.svc:10428
vmauth:
  replicaCount: 2
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  allowUnfilteredAlertReads: true
  writers:
  - name: metrics-agent
    tokenSecret:
      name: example-writer-token
      key: token
    destinations:
    - metrics
    - logs
    - traces
  alertReaders:
  - name: status
    tokenSecret:
      name: example-alerts-token
      key: token
  identities:
  - groups:
    - example:k8s:viewer
    workload:
      vmalertAPI: true
    reach:
      clusters:
      - cluster: example-cluster
        allNamespaces: true
victoria-metrics-k8s-stack:
  vmsingle:
    spec:
      podMetadata:
        labels:
          observability.pair: observability-metrics
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            observability.pair: observability-metrics
victoria-logs-single:
  server:
    podLabels:
      observability.pair: observability-logs
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          observability.pair: observability-logs
    serviceMonitor:
      relabelings:
      - action: replace
        targetLabel: observability_replica
        replacement: a
victoria-traces-single:
  server:
    podLabels:
      observability.pair: observability-traces
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          observability.pair: observability-traces
    serviceMonitor:
      relabelings:
      - action: replace
        targetLabel: observability_replica
        replacement: a
