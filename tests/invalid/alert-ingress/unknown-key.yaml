# A typo in an alerting path is a rule that never fires, so an unknown
# key must fail the render rather than be silently ignored.
image:
  repository: ghcr.io/example/alert-ingress
  tag: "1.0.0"
alertmanager:
  url: http://vmalertmanager-observability-stack.observability.svc:9093
topics:
  - "<the security-alerts topic ARN>"
heartbeat:
  match: {"source": "alert-ingress-heartbeat"}
  interval: 15m
networkPolicy:
  alertmanagerPeer:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vmalertmanager
toppics:
  - a typo, not a value this chart reads
