# Source: observability-emitters/templates/gateway.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-emitters-gateway
  labels:
    app.kubernetes.io/name: observability-emitters
    app.kubernetes.io/instance: observability-emitters
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-emitters
data:
  config.yaml: |
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
        # The collector is killed with a queue on disk often enough that a
        # corrupt database has to be survivable: without this the process
        # crash-loops on the file it cannot open, and the only way out is
        # deleting the volume — which is the data it was holding.
        recreate: true
        compaction:
          on_start: true
          directory: /var/lib/otelcol/queue
      k8s_leader_elector:
        auth_type: serviceAccount
        lease_name: observability-emitters-gateway
        lease_namespace: observability
    
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Kubernetes Events are not container logs and do not come from the log
      # agent: they are an API object, read here. Only the lease holder reads,
      # or every replica ingests every Event.
      k8s_events:
        auth_type: serviceAccount
        k8s_leader_elector: k8s_leader_elector
    
    processors:
      # Two processors, in this order, and the order is the security property.
      #
      # k8sattributes resolves the sending pod and copies the NAMESPACE's own
      # labels onto the resource, under names of this chart's choosing rather
      # than the estate's. Nothing is decided here.
      #
      # transform/tenancy then writes `tenant` and `env` from
      # those, unconditionally, with `set` — which overwrites whatever an SDK
      # put there. It finishes by deleting the intermediate attributes, so the
      # namespace's raw labels do not reach the store as a second vocabulary.
      #
      # Doing it the obvious way — letting k8sattributes write `tenant`
      # directly — is what this avoids: that processor leaves an attribute that
      # is already present alone, so an SDK that set its own tenant would keep
      # it, and the label would be the application's claim about itself.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
          labels:
            - tag_name: observability.tenancy.layer
              key: "tenancy.example.com/layer"
              from: namespace
            - tag_name: observability.tenancy.project
              key: "tenancy.example.com/project"
              from: namespace
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      transform/tenancy:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["env"], "example")
              - set(attributes["tenant"], "infra")
              - set(attributes["tenant"], attributes["observability.tenancy.layer"]) where attributes["observability.tenancy.layer"] != nil
              - set(attributes["tenant"], attributes["observability.tenancy.project"]) where attributes["observability.tenancy.project"] != nil
              - delete_key(attributes, "observability.tenancy.layer")
              - delete_key(attributes, "observability.tenancy.project")
        log_statements:
          - context: resource
            statements:
              - set(attributes["env"], "example")
              - set(attributes["tenant"], "infra")
              - set(attributes["tenant"], attributes["observability.tenancy.layer"]) where attributes["observability.tenancy.layer"] != nil
              - set(attributes["tenant"], attributes["observability.tenancy.project"]) where attributes["observability.tenancy.project"] != nil
              - delete_key(attributes, "observability.tenancy.layer")
              - delete_key(attributes, "observability.tenancy.project")
        trace_statements:
          - context: resource
            statements:
              - set(attributes["env"], "example")
              - set(attributes["tenant"], "infra")
              - set(attributes["tenant"], attributes["observability.tenancy.layer"]) where attributes["observability.tenancy.layer"] != nil
              - set(attributes["tenant"], attributes["observability.tenancy.project"]) where attributes["observability.tenancy.project"] != nil
              - delete_key(attributes, "observability.tenancy.layer")
              - delete_key(attributes, "observability.tenancy.project")
      # Delta metrics and deduplication do not mix: the store keeps one sample
      # per interval, and dropping one sample of a delta series loses the
      # increment it carried rather than a repetition of a total. An SDK's
      # default temporality is the caller's business, so the conversion happens
      # here and is not configurable.
      deltatocumulative: {}
      batch: {}
    
    exporters:
      # No `sending_queue` here, and it is not an omission: the Prometheus
      # remote-write exporter does not have one. Its durability is a
      # write-ahead log, per exporter, on the same volume the others queue on.
      prometheusremotewrite/zone-a:
        endpoint: "https://metrics-a.example/api/v1/write"
        wal:
          directory: /var/lib/otelcol/wal/zone-a
        headers:
          Authorization: "Bearer ${env:OBSERVABILITY_WRITE_TOKEN}"
      # No `sending_queue` here, and it is not an omission: the Prometheus
      # remote-write exporter does not have one. Its durability is a
      # write-ahead log, per exporter, on the same volume the others queue on.
      prometheusremotewrite/zone-b:
        endpoint: "https://metrics-b.example/api/v1/write"
        wal:
          directory: /var/lib/otelcol/wal/zone-b
        headers:
          Authorization: "Bearer ${env:OBSERVABILITY_WRITE_TOKEN}"
      otlphttp/logs-zone-a:
        logs_endpoint: "https://logs-a.example/insert/opentelemetry/v1/logs"
        headers:
          Authorization: "Bearer ${env:OBSERVABILITY_WRITE_TOKEN}"
          # Without this header every resource attribute becomes a stream
          # field, and an SDK's resource carries the pod's UID and start time —
          # so every restart mints a stream the store never reuses.
          VL-Stream-Fields: "tenant,env,service.name"
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true
      otlphttp/logs-zone-b:
        logs_endpoint: "https://logs-b.example/insert/opentelemetry/v1/logs"
        headers:
          Authorization: "Bearer ${env:OBSERVABILITY_WRITE_TOKEN}"
          # Without this header every resource attribute becomes a stream
          # field, and an SDK's resource carries the pod's UID and start time —
          # so every restart mints a stream the store never reuses.
          VL-Stream-Fields: "tenant,env,service.name"
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true
      otlphttp/traces-zone-a:
        traces_endpoint: "https://traces-a.example/insert/opentelemetry/v1/traces"
        headers:
          Authorization: "Bearer ${env:OBSERVABILITY_WRITE_TOKEN}"
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true
      otlphttp/traces-zone-b:
        traces_endpoint: "https://traces-b.example/insert/opentelemetry/v1/traces"
        headers:
          Authorization: "Bearer ${env:OBSERVABILITY_WRITE_TOKEN}"
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true
    
    service:
      extensions:
        - file_storage
        - k8s_leader_elector
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, transform/tenancy, deltatocumulative, batch]
          exporters: [prometheusremotewrite/zone-a, prometheusremotewrite/zone-b]
        logs:
          receivers: [otlp, k8s_events]
          processors: [k8sattributes, transform/tenancy, batch]
          exporters: [otlphttp/logs-zone-a, otlphttp/logs-zone-b]
        traces:
          receivers: [otlp]
          processors: [k8sattributes, transform/tenancy, batch]
          exporters: [otlphttp/traces-zone-a, otlphttp/traces-zone-b]

