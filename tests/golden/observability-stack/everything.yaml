# Source: observability-stack/charts/grafana/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-stack-grafana
  namespace: observability
  labels:
    helm.sh/chart: grafana-12.7.3
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/version: "13.1.1"
data:
  
  grafana.ini: |
    [alerting]
    enabled = false
    [analytics]
    check_for_updates = false
    reporting_enabled = false
    [auth]
    disable_login_form = true
    oauth_auto_login = true
    [auth.generic_oauth]
    allow_sign_up = true
    api_url = https://issuer.example/userinfo
    auth_url = https://issuer.example/authorize
    enabled = true
    name = SSO
    role_attribute_path = contains(groups[*], 'example:grafana:admin') && 'Admin' || contains(groups[*], 'example:grafana:editor') && 'Editor' || 'Viewer'
    role_attribute_strict = true
    scopes = openid profile email groups offline_access
    token_url = https://issuer.example/token
    use_refresh_token = true
    [database]
    host = example-pg-rw:5432
    locking_attempt_timeout_sec = 300
    name = grafana
    type = postgres
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = ''
    [unified_alerting]
    enabled = false
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
    [users]
    auto_assign_org = true
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      isDefault: true
      jsonData:
        oauthPassThru: true
      name: VictoriaMetrics
      type: prometheus
      uid: victoriametrics
      url: http://vmauth-observability-stack-stack:8427/prometheus
      version: 2
    - access: proxy
      jsonData:
        oauthPassThru: true
      name: VictoriaLogs
      type: victoriametrics-logs-datasource
      uid: victorialogs
      url: http://vmauth-observability-stack-stack:8427
      version: 2
    - access: proxy
      jsonData:
        oauthPassThru: true
      name: VictoriaTraces
      type: jaeger
      uid: victoriatraces
      url: http://vmauth-observability-stack-stack:8427/select/jaeger
      version: 2

