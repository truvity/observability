# A stream field that changes per request creates a new stream for every
# value it takes. It is the documented way to wreck this store, it fails
# slowly, and it does not recover on its own.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
  streamFields:
  - k8s.cluster.name
  - kubernetes.pod_namespace
  - http.request.header.x-forwarded-for
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
    streamFields:
    - kubernetes.container_name
    - kubernetes.pod_name
    - kubernetes.pod_namespace
    - k8s.cluster.name
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
