# Source: observability-rum/templates/dashboards.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-rum-frontend-overview
  namespace: rum
  labels:
    app.kubernetes.io/name: observability-rum
    app.kubernetes.io/instance: observability-rum
    app.kubernetes.io/managed-by: Helm
    grafana_dashboard: "1"
  annotations:
    # The k8s-sidecar folder convention; inert unless that Grafana sets
    # `sidecar.dashboards.folderAnnotation` (see charts/observability-dashboards).
    k8s-sidecar-target-directory: "Web"
data:
  frontend-overview.json: |
    {
      "uid": "observability-rum-overview",
      "title": "Frontend Overview ($cluster)",
      "description": "Browser health per app (charts/observability-rum): sessions, exceptions per session, Core Web Vitals (LCP, INP, CLS) at the 75th percentile, and the pages behind them.",
      "tags": [
        "observability-frontend",
        "frontend-overview"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "links": [
        {
          "title": "Frontend",
          "type": "dashboards",
          "tags": [
            "observability-frontend"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "datasource",
            "type": "datasource",
            "query": "victoriametrics-logs-datasource",
            "current": {
              "selected": false,
              "text": "logs-main",
              "value": "logs-main"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": ""
          },
          {
            "name": "cluster",
            "label": "cluster",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "$datasource"
            },
            "query": {
              "type": "fieldValue",
              "field": "k8s.cluster.name",
              "query": "telemetry.source:faro",
              "limit": 100
            },
            "definition": "field values of k8s.cluster.name",
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 2,
            "regex": "",
            "sort": 1
          },
          {
            "name": "app",
            "label": "app",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "$datasource"
            },
            "query": {
              "type": "fieldValue",
              "field": "app",
              "query": "telemetry.source:faro k8s.cluster.name:\"$cluster\"",
              "limit": 100
            },
            "definition": "field values of app",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "includeAll": true,
            "allValue": "*",
            "multi": false,
            "options": [],
            "refresh": 2,
            "regex": "",
            "sort": 1
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Health",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Sessions",
          "description": "Distinct anonymous browser sessions with any event in the range, for the chosen app.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "$datasource"
              },
              "expr": "telemetry.source:faro k8s.cluster.name:\"$cluster\" app:$app | stats count_uniq(session_id) as n",
              "queryType": "stats",
              "editorMode": "code"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Exceptions",
          "description": "Exceptions reported in the range. The Frontend Issues dashboard has them by fingerprint.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "$datasource"
              },
              "expr": "telemetry.source:faro k8s.cluster.name:\"$cluster\" app:$app kind:exception | stats count() as n",
              "queryType": "stats",
              "editorMode": "code"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Exceptions per session",
          "description": "Exceptions divided by sessions in the range: the number the FrontendErrorRateHigh alert watches. Zero is quiet, above one means a typical session raises an error.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "decimals": 2
            },
            "overrides": []
          },
