# Tag-triggered release through truvity/ci-workflows release-public.yaml,
# which runs goreleaser (the alert-ingress binary, archive and image) and
# then pushes every chart under charts/ to ghcr.io/truvity/charts at the
# tag's version.
#
# alert-ingress (cmd/alert-ingress, charts/alert-ingress) and mcp-aggregator
# (cmd/mcp-aggregator, charts/observability-mcp) are Kubernetes-only HTTP
# services — no laptop CLI use case, so linux/amd64 and linux/arm64 only,
# unlike a credential helper such as cloudflare's r2broker or
# access-roster's accessctl, which also build darwin/windows for a
# person's own machine.
version: 2

# The portal's page is built before anything else: its image is assembled
# from apps/portal/dist (see dockers_v2 below). The release job runs this
# under devbox, which supplies node and yarn at the versions devbox.json pins.
before:
  hooks:
    - yarn --cwd apps/portal install --immutable
    - yarn --cwd apps/portal build
    # The Gatus binaries the EC2 status box installs, built from the upstream
    # tag setup.sh pins: build/gatus/gatus_<tag>_linux_<arch>, attached below.
    - hack/build-gatus.sh

builds:
  - id: alert-ingress
    main: ./cmd/alert-ingress
    binary: alert-ingress
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

  - id: mcp-aggregator
    main: ./cmd/mcp-aggregator
    binary: mcp-aggregator
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # The Lambda extension: a layer's zip root is /opt, so the binary is built
  # as extensions/otlp-lambda (the file name is the extension's name to the
  # Lambda platform). Linux only, both Lambda architectures (amd64 is
  # x86_64). Not an image.
  - id: otlp-lambda
    main: ./cmd/otlp-lambda
    binary: extensions/otlp-lambda
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w

archives:
  # What an operator pulls to run the service outside a container —
  # access-roster's own "binaries" archive is the same shape for its
  # access-issuer service.
  - id: alert-ingress
    ids: [alert-ingress]
    formats: [tar.gz]
    name_template: "alert-ingress_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: mcp-aggregator
    ids: [mcp-aggregator]
    formats: [tar.gz]
    name_template: "mcp-aggregator_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The layer zip, one per architecture (a layer is published with its
  # compatible architectures and the binary is arch-specific). The zip root
  # is the layer root: extensions/otlp-lambda. docs/integrations/aws-lambda.md.
  - id: otlp-lambda-layer
    ids: [otlp-lambda]
    formats: [zip]
    wrap_in_directory: false
    # Nothing but the extension: the zip root IS /opt in the function, and a
    # README or LICENSE there is clutter in somebody else's layer.
    files: ["none*"]
    name_template: "otlp-lambda-layer_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

kos:
  # base_import_paths appends the cmd directory's basename, so with the
  # release workflow's ko-docker-repo ghcr.io/truvity/observability the
  # published slug is ghcr.io/truvity/observability/alert-ingress — see
  # charts/alert-ingress/values.yaml's image.repository default.
  - id: alert-ingress
    build: alert-ingress
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: alert-ingress
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/observability

  # The aggregator's image: ghcr.io/truvity/observability/mcp-aggregator, what
  # charts/observability-mcp's `aggregator.image.repository` names. Its tag
  # is the release version, which the chart's appVersion is stamped with.
  - id: mcp-aggregator
    build: mcp-aggregator
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: mcp-aggregator
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/observability

# The portal: a built single-page app behind an unprivileged nginx, not a Go
# binary, so it has a Dockerfile rather than a ko entry. `extra_files` stages
# each path into the build context KEEPING it, which is why the Dockerfile's
# COPY lines start at the repository root. Published to
# ghcr.io/truvity/observability/portal, what charts/observability-portal's
# `image.repository` defaults to (hack/check-image-refs.py compares the two).
dockers_v2:
  - id: portal
    images: ["ghcr.io/truvity/observability/portal"]
    dockerfile: apps/portal/Dockerfile
    platforms: [linux/amd64, linux/arm64]
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    extra_files:
      - apps/portal/dist
      - apps/portal/server/default.conf
    labels:
      org.opencontainers.image.version: "{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

release:
  github: {}
  header: |
    ## truvity/observability {{ .Tag }}

    | | |
    |---|---|
    | alert-ingress image | `ghcr.io/truvity/observability/alert-ingress:{{ .Version }}` |
    | alert-ingress chart | `oci://ghcr.io/truvity/charts/alert-ingress:{{ .Version }}` (image.tag defaults to it) |
    | mcp-aggregator image | `ghcr.io/truvity/observability/mcp-aggregator:{{ .Version }}` |
    | observability-mcp chart | `oci://ghcr.io/truvity/charts/observability-mcp:{{ .Version }}` (`aggregator.image.tag` defaults to it) |
    | portal image | `ghcr.io/truvity/observability/portal:{{ .Version }}` |
    | observability-portal chart | `oci://ghcr.io/truvity/charts/observability-portal:{{ .Version }}` (`image.tag` defaults to it) |
    | Lambda extension layer | `otlp-lambda-layer_{{ .Version }}_linux_{{ "{amd64,arm64}" }}.zip`, verified by `checksums.txt` ([docs/integrations/aws-lambda.md](https://github.com/truvity/observability/blob/master/docs/integrations/aws-lambda.md)) |
    | Gatus binaries (EC2 status box) | `gatus_<tag>_linux_{amd64,arm64}`, built from the upstream tag `setup.sh` pins and verified by `checksums.txt` ([docs/statusbox.md](https://github.com/truvity/observability/blob/master/docs/statusbox.md)) |
    | Go | `go get github.com/truvity/observability@{{ .Tag }}` |
  # setup.sh is a release asset, not a build output: a box's cloud-init
  # (rendered by pkg/statusbox.CloudInit) downloads THIS exact file from
  # THIS release. It has to be attached here, and it has to be in
  # checksum's own extra_files below too, or checksums.txt — the thing
  # CloudInit fetches at deploy time to bake a sha256 into every box's
  # user-data — would carry no entry for it, and CloudInit refuses to
  # render rather than boot a box that trusts an unverified script. See
  # docs/statusbox.md ("Checksum at deploy, verify at boot").
  #
  # The Gatus binaries (hack/build-gatus.sh) are attached the same way and for
  # the same reason: pkg/statusbox/ec2 reads their sha256 from checksums.txt at
  # deploy time and the instance verifies the download against it.
  extra_files:
    - glob: ./setup.sh
    - glob: ./build/gatus/gatus_*_linux_*

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./setup.sh
    - glob: ./build/gatus/gatus_*_linux_*
