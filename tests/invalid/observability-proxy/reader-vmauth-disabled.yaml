# expect: renders no vmauth
# vmauth off: the bearer token has no proxy to authenticate against.
stackReleaseName: observability-stack
vmauth:
  enabled: false
tenancy:
  readers:
  - name: edge-evaluator
    tokenSecret:
      name: example-read-token
      key: token
    grants:
    - cluster: example-edge
      allNamespaces: true
