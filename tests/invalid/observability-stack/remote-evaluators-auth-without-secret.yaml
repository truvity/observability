# expect: must set both `secretName` and `key`
# A bearer that names no Secret.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

vmalert:
  remoteEvaluators:
    - name: other-store
      datasource:
        url: https://metrics.other-store.example
        auth:
          bearer: {key: token}
