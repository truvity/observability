---
# Source: alert-ingress/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-ingress-cloud-events
  labels:
    app.kubernetes.io/name: cloud-events
    app.kubernetes.io/instance: alert-ingress
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-events
      app.kubernetes.io/instance: alert-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-events
        app.kubernetes.io/instance: alert-ingress
        app.kubernetes.io/managed-by: Helm
      annotations:
        # The configuration's own checksum, so a change to `topics`,
        # `mappings` or `heartbeat` restarts the pods. Without it a
        # ConfigMap edit lands on disk and the running process keeps the
        # configuration it read at startup — a values change that
        # applied, synced, and did nothing.
        alert-ingress/config-checksum: d3c12b9116e199b767f8cbdc556d1de7a4411d4151876b94526b49ea2bb03a05
    spec:
      serviceAccountName: alert-ingress-cloud-events
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-ingress
          image: "ghcr.io/example/alert-ingress:1.4.2"
          imagePullPolicy: Always
          args:
            - --config=/etc/alert-ingress/config.yaml
            - "--listen-addr=:9090"
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          # A static binary FROM SCRATCH has no shell for exec probes and
          # needs none: /healthz answers before the configuration is even
          # re-read, so a probe here can only ever report "the process is
          # up", which is exactly what a liveness/readiness probe is for.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alert-ingress
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alert-ingress-cloud-events

---
# Source: alert-ingress/templates/vmrule.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: alert-ingress-cloud-events
  labels:
    app.kubernetes.io/name: cloud-events
    app.kubernetes.io/instance: alert-ingress
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: alert-ingress.heartbeat
      # Evaluated far more often than the heartbeat interval itself: the
      # window this rule watches is what makes it tolerant of a single
      # missed or delayed ping, not a slow evaluation cadence.
      interval: 1m
      rules:
        # `absent_over_time` catches the counter (and the series
        # entirely) disappearing — this Deployment gone, or scraping
        # broken. `increase(...) == 0` catches the series still existing
        # but not advancing — the heartbeat recognised once, long ago,
        # and never again. Either half firing alone is the same failure
        # from this rule's point of view: nothing has proven the path is
        # alive in two heartbeat intervals.
        - alert: AlertIngressHeartbeatMissing
          expr: >-
            absent_over_time(alert_ingress_messages_total{mapping="heartbeat"}[20m])
            or
            increase(alert_ingress_messages_total{mapping="heartbeat"}[20m]) == 0
          labels:
            severity: critical
          annotations:
            summary: "alert-ingress has not counted its own heartbeat in 20m"
            description: >-
              No message matching `heartbeat.match` has been recognised in
              20m (10m x 2). Either the
              estate's scheduled heartbeat event stopped publishing, the
              cloud provider's own topic stopped delivering, or this
              Deployment is not running at all — from outside, every one
              of those looks like an estate that is simply quiet, which is
              the entire reason this rule exists.
