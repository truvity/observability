# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}


# `ambient` with ONE ServiceAccount PER STORE: the least-privilege shape,
# where each store's backup assumes its own role and can reach only its
# own prefix. Every enabled store sets `backup.<store>.serviceAccount`,
# so the release-wide ServiceAccount would carry a role nothing assumes
# and is not rendered. metrics and logs derive their names
# (`<fullname>-backup-<store>`); traces names its own. The role values
# are placeholders — a real role ARN is an estate's particular.
backup:
  enabled: true
  destination: s3://example-backups/observability
  auth:
    mode: ambient
  metrics:
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: "<IAM role for the metrics backup only>"
  logs:
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: "<IAM role for the logs backup only>"
  traces:
    enabled: true
    serviceAccount:
      create: true
      name: example-traces-backup
      annotations:
        eks.amazonaws.com/role-arn: "<IAM role for the traces backup only>"
