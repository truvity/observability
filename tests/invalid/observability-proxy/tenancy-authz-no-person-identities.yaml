# expect: is a person's identity
# Every identity is on a workload audience, so the service would have nothing to grant.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    securityPolicy:
      targetRefs:
        - kind: HTTPRoute
          name: observability-read
    networkPolicy:
      gatewayFrom:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: envoy}
  identities:
    - groups: [cluster-a:example-app:reader]
      audience: reader
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]
victoria-traces-single:
  enabled: false
