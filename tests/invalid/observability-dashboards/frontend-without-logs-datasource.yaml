# expect: dashboards for a log store nobody can point at
# Refusal: a Frontend dashboard enabled with `datasources.logs` empty. The
# dashboard's datasource picker would default to nothing.
datasources:
  metrics: ""
  logs: ""
dashboards:
  fleet-overview: {enabled: false}
  k8s-views-global: {enabled: false}
  k8s-views-namespaces: {enabled: false}
  k8s-views-pods: {enabled: false}
  victoriametrics-single: {enabled: false}
  victoriametrics-vmagent: {enabled: false}
  victoriametrics-vmalert: {enabled: false}
  victoriametrics-operator: {enabled: false}
  victorialogs-single: {enabled: false}
  victorialogs-vlagent: {enabled: false}
  victoriatraces-single: {enabled: false}
  alertmanager: {enabled: false}
  node-exporter-full: {enabled: false}
  kubelet: {enabled: false}
  argocd: {enabled: false}
  cert-manager: {enabled: false}
  cnpg-operator: {enabled: false}
  nats-server: {enabled: false}
  nats-jetstream: {enabled: false}
  envoy-gateway: {enabled: false}
  envoy-proxy: {enabled: false}
  envoy-clusters: {enabled: false}
  kargo: {enabled: false}
  frontend-issues: {enabled: true}
home: ""
