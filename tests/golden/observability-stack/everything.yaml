# Source: observability-stack/templates/backup.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: observability-stack-backup-logs
  labels:
    app.kubernetes.io/name: stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.backup: logs
spec:
  schedule: "20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stack
            app.kubernetes.io/instance: observability-stack
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/part-of: observability-stack
            observability.backup: logs
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: server
                      app.kubernetes.io/name: victoria-logs-single
                      app.kubernetes.io/instance: observability-stack
          containers:
            - name: backup
              image: "example.com/mirror/rclone:1.73.0"
              env:
                - name: STORE_URL
                  value: "http://observability-stack-victoria-logs-single-server.observability.svc:9428"
                - name: DESTINATION
                  value: ":s3,env_auth=true:example-backups/observability/logs"
                - name: VM_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: "example-store-credentials"
                      key: "user"
                - name: VM_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "example-store-credentials"
                      key: "pass"
              envFrom:
                - secretRef:
                    name: "example-backup-credentials"
              volumeMounts:
                - name: store
                  mountPath: /storage
                  readOnly: true
              command:
                - /bin/sh
                - -euc
                - |
                  # The log store's partitions are per-day directories.
                  # A snapshot is a directory of HARDLINKS inside the data
                  # directory: cheap to make, and it pins every part it
                  # references, so one left behind grows the store's disk
                  # usage with nothing pointing at why. The binary expires
                  # them after -snapshotsMaxAge (3 days), which is a
                  # backstop, not a plan — this job deletes its own.
                  auth="--user=$VM_USERNAME --password=$VM_PASSWORD"
                  created=$(wget -q -O- $auth --post-data='' \
                    "$STORE_URL/internal/partition/snapshot/create")
                  echo "snapshots: $created"
                  # REFUSE AN EMPTY SOURCE. A store with no partitions is
                  # a store with no data, and `rclone sync` from an empty
                  # source DELETES the destination and exits zero.
                  case "$created" in
                    ''|'[]') echo "no snapshot was created: the store has no partitions, or the API refused" >&2; exit 1 ;;
                  esac
                  for path in $(echo "$created" | tr -d '[]"' | tr ',' ' '); do
                    test -d "$path" || { echo "snapshot $path is not on this volume" >&2; exit 1; }
                    test -n "$(ls -A "$path")" || { echo "snapshot $path is empty" >&2; exit 1; }
                    rclone sync "$path" "$DESTINATION/$(basename "$path")" --checksum
                    wget -q -O- $auth --post-data='' \
                      "$STORE_URL/internal/partition/snapshot/delete?path=$path"
                  done
          volumes:
            - name: store
              persistentVolumeClaim:
