name: k8s.rules.container_cpu_usage_seconds_total
rules:
- expr: sum(rate(container_cpu_usage_seconds_total{job="kubelet",metrics_path="/metrics/cadvisor",image!=""}[5m])) by(__CLUSTER_LABEL__,namespace,pod,container) * on(__CLUSTER_LABEL__,namespace,pod) group_left(node) topk(1, max(kube_pod_info{node!=""}) by(__CLUSTER_LABEL__,namespace,pod,node)) by(__CLUSTER_LABEL__,namespace,pod)
  record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m
- expr: sum(irate(container_cpu_usage_seconds_total{job="kubelet",metrics_path="/metrics/cadvisor",image!=""}[5m])) by(__CLUSTER_LABEL__,namespace,pod,container) * on(__CLUSTER_LABEL__,namespace,pod) group_left(node) topk(1, max(kube_pod_info{node!=""}) by(__CLUSTER_LABEL__,namespace,pod,node)) by(__CLUSTER_LABEL__,namespace,pod)
  record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
