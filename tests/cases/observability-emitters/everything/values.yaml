global:
  cluster:
    dnsDomain: cluster.example.

# Every value this chart has, set to something other than its default.
#
# Two things this case is here to prove, beyond "it renders":
#
#   - the cluster and the tier are PLUMBED. Neither is the minimal case's
#     value here, and the golden has to carry these two at every stamping
#     site: the agent's relabel rules for both scrape classes, the
#     gateway's OTTL statements, and the log agent's static fields. A value
#     that reaches one site and not another is a signal filed under the
#     wrong cluster.
#   - the escape hatch is merged, not ignored. `metrics.spec` sets values
#     the chart does not otherwise render, and leaves every guarded one
#     alone.
nameOverride: emitters
interval: 60s

tenancy:
  cluster: other-cluster
  environment: staging

writeCredentials:
  secretName: example-write-token
  key: bearer

metrics:
  enabled: true
  destinations:
    - name: primary
      url: https://metrics.example/api/v1/write
  image:
    repository: victoriametrics/vmagent
    tag: v1.152.0
  replicaCount: 2
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi
  queue:
    size: 20Gi
    storageClassName: example-ssd
  scrape:
    kubelet: true
    cadvisor: false
    # Named, and therefore countable. The blanket labelmap this replaced
    # put every node series past the store's label ceiling.
    nodeLabels:
      - topology.kubernetes.io/zone
      - node.kubernetes.io/instance-type
  spec:
    scrapeInterval: 60s
    externalLabels:
      region: example
    extraArgs:
      promscrape.suppressScrapeErrors: "true"

logs:
  enabled: true

otlp:
  # Placed, rather than left to the scheduler: on a cluster where every
  # node a workload should use is tainted, the gateway otherwise lands on
  # whatever is left.
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations:
    - key: arch
      operator: Equal
      value: arm64
      effect: NoSchedule
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.161.0
  replicaCount: 3
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi
  queue:
    size: 20Gi
    storageClassName: example-ssd
  destinations:
    metrics:
      - name: primary
        url: https://metrics.example
    logs:
      - name: primary
        url: https://logs.example
    traces:
      - name: primary
        url: https://traces.example
  streamFields:
    - k8s.cluster.name
    - kubernetes.pod_namespace
    - deployment.environment.name
    - service.name
    - service.namespace
  events:
    enabled: true
  service:
    grpcPort: 14317
    httpPort: 14318
  podMonitor:
    enabled: true
    extraLabels:
      example.com/scraped-by: example

selfMonitor:
  enabled: true
  extraLabels:
    example.com/scraped-by: example

victoria-logs-collector:
  extraVolumes:
    - name: write-token
      secret:
        secretName: example-write-token
  extraVolumeMounts:
    - name: write-token
      mountPath: /etc/observability-write-token
      readOnly: true
  remoteWrite:
    - url: https://logs.example
      bearerTokenFile: /etc/observability-write-token/bearer
      maxDiskUsagePerURL: 20GB
  collector:
    streamFields:
      - kubernetes.container_name
      - kubernetes.pod_name
      - kubernetes.pod_namespace
      - k8s.cluster.name
      - deployment.environment.name
    extraFields: '{"k8s.cluster.name":"other-cluster","deployment.environment.name":"staging"}'
    includePodLabels: true
    includePodAnnotations: false
    includeNodeLabels: false
    includeNodeAnnotations: false
  extraArgs:
    envflag.enable: true
    envflag.prefix: VL_
    loggerFormat: json
    tmpDataPath: /var/lib/vl-collector
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi
  podMonitor:
    enabled: true
    vm: false
