# Source: oncall/templates/goalert.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-goalert
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: goalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oncall
      app.kubernetes.io/instance: oncall
      app.kubernetes.io/component: goalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oncall
        app.kubernetes.io/instance: oncall
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: oncall
        app.kubernetes.io/component: goalert
    spec:
      serviceAccountName: oncall-goalert
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goalert
          image: "docker.io/goalert/goalert:v0.35.0"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/goalert"]
          env:
            - name: GOALERT_DB_URL
              value: "postgres://goalert@oncall-pg-rw.oncall.svc:5432/goalert?sslmode=verify-full"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "oncall-pg-app"
                  key: "password"
            - name: GOALERT_DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: "oncall-goalert-key"
                  key: "key"
            - name: GOALERT_JSON
              value: "true"
            - name: GOALERT_LISTEN
              value: ":8081"
            - name: GOALERT_LISTEN_PROMETHEUS
              value: ":2112"
            - name: GOALERT_PUBLIC_URL
              value: "https://oncall.example"
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 2112
              protocol: TCP
          # /health answers 500 while GoAlert is starting (migrations run
          # at start) or shutting down, 200 otherwise.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
# Source: oncall/templates/relay.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-telegram-relay
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: telegram-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oncall
      app.kubernetes.io/instance: oncall
      app.kubernetes.io/component: telegram-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oncall
        app.kubernetes.io/instance: oncall
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: oncall
        app.kubernetes.io/component: telegram-relay
    spec:
      serviceAccountName: oncall-telegram-relay
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telegram-relay
          image: "ghcr.io/truvity/observability/telegram-relay:0.0.0"
          imagePullPolicy: IfNotPresent
          args:
            - "--listen=:8080"
            - "--admin-listen=:9090"
            - "--bot-token-file=/etc/telegram-relay/bot-token"
            - "--shared-secret-file=/etc/telegram-relay/shared-secret"
            - "--recipients-file=/etc/telegram-relay/recipients.yaml"
            - "--telegram-api-url=https://api.telegram.org"
            - "--send-timeout=2500ms"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # Not in the Service: nothing routed to the webhook port can
            # reach /metrics.
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          # Ready only while the three mounted files read and parse: a
          # Secret that never arrived keeps the pod out of the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: secret
              mountPath: /etc/telegram-relay
              readOnly: true
      volumes:
        - name: secret
          secret:
            secretName: "oncall-telegram-relay"
            defaultMode: 0440

