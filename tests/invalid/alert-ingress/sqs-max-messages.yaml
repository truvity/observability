# expect: /input/sqs/maxMessages
# SQS returns at most 10 messages per receive.
image:
  repository: ghcr.io/example/alert-ingress
  tag: "1.0.0"
alertmanager:
  url: http://vmalertmanager-observability-stack.observability.svc:9093
topics:
  - "<the security-alerts topic ARN>"
heartbeat:
  match: {"source": "alert-ingress-heartbeat"}
  interval: 15m
networkPolicy:
  alertmanagerPeer:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vmalertmanager
input:
  mode: both
  sqs:
    queueURL: https://sqs.eu-west-1.amazonaws.com/ACCOUNT/alerts
    maxMessages: 11
