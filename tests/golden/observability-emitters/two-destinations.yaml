# Source: observability-emitters/templates/gateway.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: observability-emitters-gateway
  labels:
    app.kubernetes.io/name: observability-emitters
    app.kubernetes.io/instance: observability-emitters
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-emitters
spec:
  replicas: 2
  serviceName: observability-emitters-gateway-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-emitters-gateway
      app.kubernetes.io/instance: observability-emitters
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-emitters-gateway
        app.kubernetes.io/instance: observability-emitters
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: observability-emitters
      annotations:
        observability-emitters/config-checksum: b0fce72d854ebceb8579458038298b01c0f364647cc0c00a7d2395f1f19df9dd
    spec:
      serviceAccountName: observability-emitters-gateway
      containers:
        - name: collector
          image: "otel/opentelemetry-collector-contrib:0.161.0"
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: telemetry
              containerPort: 8888
              protocol: TCP
          env:
            - name: OBSERVABILITY_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "example-write-token"
                  key: "token"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol
      volumes:
        - name: config
          configMap:
            name: observability-emitters-gateway
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

