# CI calls the shared workflow (truvity/ci-workflows), which fans the
# Justfile recipes out into PARALLEL jobs — one per recipe, each reporting
# under its own name. The recipe list is this repository's own `check`
# recipe plus `apply`, `reconcile` and `statusbox-ec2`, so CI and a laptop run
# the same thing except for the jobs that need a container runtime: `apply`
# stands up a kind cluster and requires a real API server to accept every
# golden, `reconcile` requires the operator to accept the release, and
# `statusbox-ec2` runs the EC2 status box's setup script inside an
# amazonlinux:2023 container (see hack/statusbox-ec2-ci.sh). Each is a CI job
# rather than part of `check` because `check` must stay runnable in
# seconds on a laptop with nothing destructive in it, and a job rather
# than nothing because each one catches a class of defect that reached
# further than anything upstream of it noticed.
#
# Pinned by COMMIT SHA, never by tag or branch: tags move, and every
# repository in both organizations runs that code.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@b38472fac2bff567c7b138654cebc7da485170ca # v3.26.1
    with:
      # Required: the component contract (C1-C13) is judged, shown in the
      # job summary, and fails this job when a rule fails.
      policy-conformance: true
      policy-conformance-strict: true
      recipes: '["lint", "test", "portal", "leak-canary", "dashboard-lint", "rulecheck", "apply", "reconcile", "statusbox-ec2"]'

  # The per-cluster coverage report (the commands of `just rulecheck-coverage`, run directly so the job installs no `just`): which rule
  # groups and rules each rendered configuration leaves off. Its own job
  # because the shared recipe runner uploads no artifacts; it reads the
  # goldens, so it needs Go and nothing else (no parser binaries, no
  # network beyond the module proxy). The report is also in the job summary.
  rulecheck-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          mkdir -p rulecheck-coverage
          go run ./cmd/rulecheck coverage -format json -o rulecheck-coverage/coverage.json tests/golden
          go run ./cmd/rulecheck coverage -format markdown -o rulecheck-coverage/coverage.md tests/golden
          head -c 900000 rulecheck-coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rulecheck-coverage
          path: rulecheck-coverage/

  # Pull-request only: a change to an existing golden is a default-render
  # change and must be declared in CHANGELOG.md. See
  # hack/default-change-guard.sh. Needs history, which the shared recipe
  # runner does not fetch, so it is its own job.
  default-change-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: hack/default-change-guard.sh "origin/${{ github.base_ref }}"

  # Stable name for branch protection: the matrix reports as
  # "recipes / lint" and so on, so a required context naming them would
  # break the moment a recipe is added or renamed.
  check:
    needs: [recipes, default-change-guard, rulecheck-coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.recipes.result }}" = "success" ]'
      # Skipped on a push; anything but success or skipped is a failure.
      - run: '[ "${{ needs.default-change-guard.result }}" != "failure" ] && [ "${{ needs.default-change-guard.result }}" != "cancelled" ]'
