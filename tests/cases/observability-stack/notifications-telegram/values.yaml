# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
# It also proves the chart renders on a cluster that does not use the
# default — an estate on the default sees exactly this one difference.
global:
  cluster:
    dnsDomain: cluster.example.

# The smallest shape that keeps `alertmanager.enabled`'s default from

# Telegram as the ONLY receiver kind — no Slack, no webhook — which is
# enough on its own to satisfy "at least one receiver". Both tiers go to
# one chat; the warning tier to a forum topic in it, so the render shows
# one receiver per (chat, thread) pair. The chat id and the Secret are
# placeholders: a real chat id is an estate's particular.
notifications:
  externalUrl: https://grafana.example
  runbookBaseUrl: https://runbooks.example/
  telegram:
    botTokenSecret: {name: example-telegram-bot, key: token}
    chatId: -1000000000001
  severities:
    critical: {receiver: telegram}
    warning: {receiver: telegram, messageThreadId: 42}
