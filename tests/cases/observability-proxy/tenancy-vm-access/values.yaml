# The Door half of the stack case of the same name (tests/cases/observability-stack/tenancy-vm-access):
# its values kept to the keys charts/observability-proxy declares, with
# `stackReleaseName` set to the stack's release name, so the render carries the
# names the stack's does.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  principals:
  - name: k8s:viewer
    groups:
    - cluster-a:k8s:viewer
    - cluster-b:k8s:viewer
    - cluster-c:k8s:viewer
    grants:
    - cluster: cluster-a
      allNamespaces: true
    - cluster: cluster-b
      allNamespaces: true
    - cluster: cluster-c
      allNamespaces: true
  - group: example:example-app:deployer
    grants:
    - cluster: cluster-a
      namespaces:
      - example-app
networkPolicy:
  enabled: false
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
