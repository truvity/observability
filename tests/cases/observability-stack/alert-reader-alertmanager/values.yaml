# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
# It also proves the chart renders on a cluster that does not use the
# default — an estate on the default sees exactly this one difference.
global:
  cluster:
    dnsDomain: cluster.example.

# The single-replica install, written out: one of each store, two
# vmalerts, Alertmanager with the heartbeat leaving the cluster, the
# network policies and the backups.
#
# This is the shape docs/adoption.md walks through, and the one this
# release supports. `ha` is false, which is not a lesser mode: no store
# here replicates across a zone, so redundancy is two of these with the
# writers sending to both.
ha: false

vmalert:
  externalUrl: https://alerts.example.com

alertmanager:
  watchdog:
    secretName: example-watchdog-receiver
    key: url

# `notifications.externalUrl` is deliberately left unset here: it
# defaults to `vmalert.externalUrl` above, and this case is where the
# golden proves that default renders a working Grafana link without a
# consumer having to set the same fact twice.
notifications:
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}

backup:
  enabled: true
  destination: "s3://example-backups/observability"
  credentialsSecret: example-backup-credentials

# This is the golden that exercises the trace store's own render (the
# `everything` case turns the store subcharts off so their render stays
# `single`'s job — see the comment there), so it is also where the
# service-graph task's opt-in path gets exercised.
victoria-traces-single:
  server:
    extraArgs:
      servicegraph.enableTask: "true"
