# expect: neither `tenancy.vmAccessReader.audience` nor `tenancy.audience` is
# vmauth never inspects `aud`: without the pin any token of the issuer that carries a claim would be admitted.
tenancy:
  issuerUrl: https://issuer.example
  vmAccessReader:
    enabled: true

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
