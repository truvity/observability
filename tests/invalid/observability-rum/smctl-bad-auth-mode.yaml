# expect: value must be one of 'anonymous'
global:
  observabilityRum:
    otlp:
      endpoint: "http://otlp-gateway.example.svc:4318"
    sourcemaps:
      smctl:
        enabled: true
        repositoryTemplate: ghcr.io/example/sourcemaps/{app}
        auth:
          mode: static
    apps:
      - name: shop
        apiKeySecret:
          name: shop-rum-key
          key: key
        allowedOrigins:
          - https://shop.example
