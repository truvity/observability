    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-grafana
        app.kubernetes.io/instance: observability-grafana
        app.kubernetes.io/managed-by: Helm
    spec:
      
      serviceAccountName: observability-grafana-operator-folders
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile
          image: "docker.io/curlimages/curl:8.22.0"
          command: ["sh", "/scripts/reconcile.sh"]
          envFrom:
            - configMapRef:
                name: observability-grafana-operator-folders
          env:
            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: "grafana-admin"
                  key: "admin-user"
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "grafana-admin"
                  key: "admin-password"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: scripts
          configMap:
            name: observability-grafana-operator-folders
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
