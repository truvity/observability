# expect: They must be equal, for the same reason the CPUs must
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# Requests below limits put a store in the Burstable class, so it is
# evicted before a Guaranteed pod — at the moment of node pressure, which
# is the moment the store matters most.
victoria-traces-single:
  server:
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
