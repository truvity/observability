# Helm evaluates a subchart's values before any template runs, so this
# field cannot be computed and has to be written twice. Two numbers that
# are supposed to be equal stop being equal the first time somebody
# changes one of them.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
tenancy:
  env: example
  fallbackTenant: infra
  namespaceLabels:
    layer: tenancy.example.com/layer
    project: tenancy.example.com/project
victoria-logs-collector:
  collector:
    extraFields: '{"env":"example-two"}'
    streamFields:
    - kubernetes.container_name
    - kubernetes.pod_name
    - kubernetes.pod_namespace
    - env
    - kubernetes.namespace_labels.tenancy.example.com/project
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
