tenancy:
  issuerUrl: https://issuer.example
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# With no Secret named, the Grafana chart generates a random admin
# password on every render: `helm upgrade` rotates it silently, and the
# release's manifest differs from itself when nothing has changed.
grafana:
  enabled: true
  grafana.ini:
    database:
      locking_attempt_timeout_sec: 120
