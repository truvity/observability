# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
# It also proves the chart renders on a cluster that does not use the
# default — an estate on the default sees exactly this one difference.
global:
  cluster:
    dnsDomain: cluster.example.

# The smallest shape that keeps `alertmanager.enabled`'s default from

# Telegram beside Slack and a webhook — the combination an estate moving
# a hand-made stack onto this chart arrives with: critical to Slack (and
# a project route overriding its channel), warning to a Telegram chat of
# its own with a non-default parse mode and its own message, resolved
# notifications off, and the status-page webhook bridged by `also`.
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  telegram:
    botTokenSecret: {name: example-telegram-bot, key: bot-token}
    chatId: -1000000000001
    parseMode: MarkdownV2
    sendResolved: false
    message: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
  webhook:
    - name: status-page
      urlSecret: {name: example-status-webhook, key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: telegram, chatId: -1000000000002}
  routes:
    - match: {k8s_namespace_name: example-app}
      critical: "#example-app"
  also:
    - receiver: status-page
      match: {severity: critical}
