{{- /*
The one extra grant `kubeStateMetrics.customResources.cnpg` needs:
get/list/watch on `clusters.postgresql.cnpg.io` and
`backups.postgresql.cnpg.io`, nothing else. Same mechanism
as the kargo grant beside it (a ClusterRole of this chart's own, bound to
kube-state-metrics' ServiceAccount, because a subchart's `rbac.extraRules`
cannot be computed from this flag).
*/ -}}
{{- if and .Values.kubeStateMetrics.enabled (.Values.kubeStateMetrics.customResources.cnpg).enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-cnpg" (include "observability-emitters.kubeStateMetrics.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-cnpg" (include "observability-emitters.kubeStateMetrics.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-cnpg" (include "observability-emitters.kubeStateMetrics.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "observability-emitters.kubeStateMetrics.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
