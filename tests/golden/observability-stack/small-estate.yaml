apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-stack-victoria-metrics-operator
  namespace: observability
  labels: 
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-operator
    app.kubernetes.io/version: v0.74.1
    helm.sh/chart: victoria-metrics-operator-0.67.3
spec:
  replicas: 1
  selector:
    matchLabels: 
      app.kubernetes.io/instance: observability-stack
      app.kubernetes.io/name: victoria-metrics-operator
  strategy: 
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels: 
        app.kubernetes.io/instance: observability-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-operator
    spec:
      automountServiceAccountToken: true
      securityContext: 
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: observability-stack-victoria-metrics-operator
      containers:
        - name: operator
          image: victoriametrics/operator:v0.74.1
          imagePullPolicy: IfNotPresent
          env:
            - name: VM_ANOMALY_VERSION
              value: "v1.30.4"
            - name: VM_LOGS_VERSION
              value: "v1.52.0"
            - name: VM_METRICS_VERSION
              value: "v1.152.0"
            - name: VM_TRACES_VERSION
              value: "v0.10.0"
            - name: VM_VMALERTMANAGER_ALERTMANAGERVERSION
              value: "v0.34.0"
            - name: VM_ENABLEDPROMETHEUSCONVERTER_PROBE
              value: "false"
            - name: VM_ENABLEDPROMETHEUSCONVERTER_SCRAPECONFIG
              value: "false"
            - name: VM_ENABLEDPROMETHEUSCONVERTER_PROMETHEUSRULE
              value: "false"
            - name: VM_ENABLEDPROMETHEUSCONVERTER_ALERTMANAGERCONFIG
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: victoria-metrics-operator
            - name: VM_ENABLEDPROMETHEUSCONVERTEROWNERREFERENCES
              value: "false"
          args:
            - --zap-log-level=info
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --webhook.enable=true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: probe
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          readinessProbe: 
            failureThreshold: 3
            httpGet:
              path: /health
              port: probe
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe: 
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 15
            tcpSocket:
              port: probe
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
          resources: 
            limits:
              cpu: "2"
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 256Mi
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: observability-stack-victoria-metrics-operator-validation

