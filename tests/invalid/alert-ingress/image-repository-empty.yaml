# expect: at '/image/repository'
# image.repository does default (to the published alert-ingress image —
# see values.yaml), but an explicit empty override must still refuse: it
# would render cleanly and pull nothing, silently discarding the default
# rather than using it.
image:
  repository: ""
  tag: "1.0.0"
alertmanager:
  url: http://vmalertmanager-observability-stack.observability.svc:9093
topics:
  - "<the security-alerts topic ARN>"
heartbeat:
  match: {"source": "alert-ingress-heartbeat"}
  interval: 15m
networkPolicy:
  alertmanagerPeer:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vmalertmanager
