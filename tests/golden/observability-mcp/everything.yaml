---
# Source: observability-mcp/templates/mcp.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-mcp-primary
  labels:
    app.kubernetes.io/name: observability-mcp
    app.kubernetes.io/instance: observability-mcp
    app.kubernetes.io/component: primary
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: observability-mcp
      app.kubernetes.io/instance: observability-mcp
      app.kubernetes.io/component: primary
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The gateway, on the proxy's one MCP port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 8080
    # Whatever scrapes the aggregator's metrics, on the admin port only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # 1. The issuer: signing keys, and the token exchange.
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - protocol: TCP
          port: 8443
    # 2. The store's vmauth.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
      ports:
        - protocol: TCP
          port: 8427
    # 3. DNS. With no `networkPolicy.egress.dns` peers this is port 53 to ANY
    # destination (no `to`): the cluster resolver is not a kube-system pod on
    # every cluster, and a rule naming one namespace blocks DNS where it is not.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

