# The generic dashboard set, fetched by hack/dashboards.sh.
#
# Every URL here is one already named in the upstream store chart's own
# `defaultDashboards.sources` list (see
# charts/observability-stack/charts/victoria-metrics-k8s-stack-*.tgz,
# values.yaml) — never invented — with `master`/`main` replaced by a
# pinned ref so a bump is a deliberate, reviewable diff rather than
# whatever upstream's default branch holds on render day.
#
# `seedQuery` is the label-values selector the generated `cluster`
# variable queries — reused from each dashboard's own pre-existing `job`
# variable, so the cluster list comes from the same metric the dashboard
# already trusts to exist.
dashboards:
  - name: victoriametrics-single
    upstream: victoriametrics
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/{ref}/dashboards/victoriametrics.json
    ref: v1.152.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"victoria-metrics-.*"}'

  - name: victoriametrics-vmagent
    upstream: victoriametrics
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/{ref}/dashboards/vmagent.json
    ref: v1.152.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"^vmagent.*"}'
    tweaks:
      dropPanels:
        # The series-limit gauges exist only when -remoteWrite.maxHourlySeries
        # or maxDailySeries is set, and the limit is enforced on the store.
        - {title: Hourly series limit, row: Remote write, reason: "vmagent_hourly_series_limit_* exist only when the agent's own series limit is set; the limit is enforced on the store"}
        - {title: Daily series limit, row: Remote write, reason: "vmagent_daily_series_limit_* exist only when the agent's own series limit is set; the limit is enforced on the store"}
        # No stream aggregation is configured; only the idle labels compressor
        # gauges are exported, and the panel on them stays.
        - {title: "Matched samples ($instance)", row: Streaming aggregation, reason: "vm_streamaggr_* are exported only when stream aggregation is configured"}
        - {title: "Dropped samples ($instance)", row: Streaming aggregation, reason: "vm_streamaggr_* are exported only when stream aggregation is configured"}
        - {title: "Produced samples ($instance)", row: Streaming aggregation, reason: "vm_streamaggr_* are exported only when stream aggregation is configured"}
        - {title: "Flush timeouts ($instance)", row: Streaming aggregation, reason: "vm_streamaggr_* are exported only when stream aggregation is configured"}
        - {title: "Samples lag 0.99 quantile ($instance)", row: Streaming aggregation, reason: "vm_streamaggr_* are exported only when stream aggregation is configured"}
        - {title: "Dedup flush duration 0.99 quantile ($instance)", row: Streaming aggregation, reason: "vm_streamaggr_* are exported only when stream aggregation is configured"}
        # Kafka is an enterprise feature none of the agents here use.
        - {title: "Traffic (bytes)", row: "Kafka (Enterprise)", reason: "vmagent_*kafka_* are exported only by the enterprise Kafka integration"}
        - {title: "Messages in / out", row: "Kafka (Enterprise)", reason: "vmagent_*kafka_* are exported only by the enterprise Kafka integration"}
        - {title: Producer errors, row: "Kafka (Enterprise)", reason: "vmagent_*kafka_* are exported only by the enterprise Kafka integration"}
        - {title: Consumer errors, row: "Kafka (Enterprise)", reason: "vmagent_*kafka_* are exported only by the enterprise Kafka integration"}

  - name: victoriametrics-vmalert
    upstream: victoriametrics
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/{ref}/dashboards/vmalert.json
    ref: v1.152.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"^vmalert.*"}'

  - name: victoriametrics-operator
    upstream: victoriametrics
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/{ref}/dashboards/operator.json
    ref: v1.152.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'operator_log_messages_total'
    tweaks:
      dropPanels:
        - {title: Prometheus Converter Watch events, reason: "operator_prometheus_converter_watch_events_total is not exported by the pinned operator; only operator_prometheus_converter_active_watchers is, and the Prometheus Objects watchers stat reads it"}

  - name: victorialogs-single
    upstream: victorialogs
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/{ref}/dashboards/victorialogs.json
    ref: v1.121.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"victoria-logs-.*"}'
    tweaks:
      replace:
        # VictoriaLogs exports no vm_cache_size_bytes, and a sum of nothing
        # made both series of the panel empty.
        - from: ' + sum(vm_cache_size_bytes{k8s_cluster_name=~"$cluster",job=~"$job", instance=~"$instance"})'
          to: ''

  - name: victorialogs-vlagent
    upstream: victorialogs
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/{ref}/dashboards/vlagent.json
    ref: v1.121.0
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"^vlagent.*"}'

  - name: victoriatraces-single
    upstream: victoriatraces
    url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaTraces/{ref}/dashboards/victoriatraces.json
    ref: v0.11.1
    folder: stores
    tags: [observability-stores]
    seedQuery: 'vm_app_version{version=~"victoria-traces-.*"}'

  # Alertmanager and kubelet are not standalone URLs in
  # defaultDashboards.sources: both come bundled inside the
  # kube-prometheus mixin's single dashboard-definitions manifest, which
  # upstream's own `kube-prometheus` source entry points at. Each is one
  # ConfigMap's `data` key inside that manifest's `items` list.
  - name: alertmanager
    upstream: kube-prometheus
    bundle: kube-prometheus
    bundleKey: alertmanager-overview.json
    folder: stores
    tags: [observability-stores]
    seedQuery: 'alertmanager_alerts'
    namespaceScoped: true
    # Alertmanager is optional; where it is not enabled every panel is
    # empty by construction, not by a wrong selector.
    requires: [alertmanager]

  - name: kubelet
    upstream: kube-prometheus
    bundle: kube-prometheus
    bundleKey: kubelet.json
    folder: infrastructure
    tags: [observability-kubernetes]
    # kubelet.json already ships its own cluster variable and filters
    # every query by a bare `cluster` label — upstream's own multi-cluster
    # convention. This repo's collectors stamp `k8s_cluster_name`
    # instead (see README's "The model"), so the fetch step RENAMES the
    # label rather than adding a second, always-empty filter beside it —
    # left alone, `cluster="$cluster"` would match nothing, because
    # nothing here ever sets a bare `cluster` label.
    preRenamed: true
    tweaks:
      dropPanels:
        - {title: Config Error Count, reason: "kubelet_node_config_error came from dynamic kubelet configuration, removed from Kubernetes years ago, so the panel can never have data"}

  # node-exporter-full has no seedQuery: it is rewritten by the generic
  # rule (every panel already keys off `job`/`nodename`, no dashboard
  # here needs a second seed).
  - name: node-exporter-full
    upstream: rfmoz
    url: https://raw.githubusercontent.com/rfmoz/grafana-dashboards/{ref}/prometheus/node-exporter-full.json
    # rfmoz/grafana-dashboards tags no releases; pinned by commit.
    ref: 99a25cc154c21c4fcbae1aa24352bf1b6764d847
    folder: infrastructure
    tags: [observability-kubernetes]
    seedQuery: 'node_uname_info'
    tweaks:
      dropPanels:
        - {title: Hardware Temperature Monitor, reason: "node_hwmon_* needs a hardware monitor, which a virtual machine has none of"}
        - {title: Hardware Fan Speed, reason: "node_hwmon_* needs a hardware monitor, which a virtual machine has none of"}
        - {title: Cooling Device Utilization, reason: "node_cooling_device_* needs a cooling device, which a virtual machine has none of"}
        - {title: Power Supply, reason: "node_power_supply_* needs a power supply, which a virtual machine has none of"}
        - {title: CPU Frequency Scaling, reason: "node_cpu_scaling_frequency_* is not exposed on a virtual machine's cpufreq"}
        - {title: Systemd Units State, reason: "node_systemd_* needs --collector.systemd, which is not enabled"}
        - {title: Systemd Sockets Current, reason: "node_systemd_* needs --collector.systemd, which is not enabled"}
        - {title: Systemd Sockets Accepted, reason: "node_systemd_* needs --collector.systemd, which is not enabled"}
        - {title: Systemd Sockets Refused, reason: "node_systemd_* needs --collector.systemd, which is not enabled"}
        - {title: Processes Detailed States, reason: "node_processes_* needs --collector.processes, which is not enabled"}
        - {title: PIDs Number and Limit, reason: "node_processes_* needs --collector.processes, which is not enabled"}
        - {title: Threads Number and Limit, reason: "node_processes_* needs --collector.processes, which is not enabled"}
        - {title: IRQ Detail, reason: "node_interrupts_total needs --collector.interrupts, which is not enabled"}
        - {title: Network Saturation, row: "CPU / Memory / Net / Disk", reason: "node_network_speed_bytes is not reported by virtual network interfaces"}
        - {title: Speed, row: Network Traffic, reason: "node_network_speed_bytes is not reported by virtual network interfaces"}
    # node-exporter is off by default (`nodeExporter.enabled`, 0.15.0), so
    # this dashboard is empty until it is on; a consumer hides it until then.
    requires: [node-exporter]

  # -- Operational views (charts/observability-dashboards 0.12.0). Held to
  # tests/dashboard_queries_test.go (`queryCheck`): every query must parse
  # on the pinned VictoriaMetrics and read only metrics listed in
  # hack/dashboards/available-metrics.yaml.

  # The home page. Authored here (hack/dashboards/fleet_overview.py), not
  # fetched: nothing upstream answers "is anything wrong, and where?" for a
  # store with these sources.
  - name: fleet-overview
    authored: true
    generator: hack/dashboards/fleet_overview.py
    folder: fleet
    tags: [observability-fleet]
    queryCheck: true
    # Four CloudNativePG instance tiles read the optional instance exporter;
    # they read n/a where it is not scraped.
    requires: [cnpg-instance-metrics]

  # dotdc/grafana-dashboards-kubernetes, adapted (hack/dashboards.py,
  # adapt_k8s_views): the `cluster` label becomes `k8s_cluster_name`, and
  # every query on a metric the store does not hold is replaced or dropped.
  # k8s-views-nodes is built on node-exporter, an optional source
  # (`nodeExporter.enabled`, 0.15.0), so it `requires:` it: its node_*
  # queries are read against the node-exporter source of
  # available-metrics.yaml, and a panel on a family that source does not
  # claim (conntrack, CPU throttles) is dropped at import. Off by default in
  # the chart's values, like the source it needs.
  - name: k8s-views-global
    upstream: dotdc
    url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/{ref}/dashboards/k8s-views-global.json
    ref: v3.0.8
    adapt: k8s-views
    folder: kubernetes
    tags: [observability-kubernetes, kubernetes]
    queryCheck: true
    # kube-state-metrics writes no kube_*_labels series while its label
    # allow-list is empty (the default), so a count over them was empty; the
    # *_created series of the same kind is written for every object.
    tweaks:
      replace:
        - {from: 'sum(kube_namespace_labels{', to: 'count(kube_namespace_created{'}
        - {from: 'sum(kube_deployment_labels{', to: 'count(kube_deployment_created{'}
        - {from: 'sum(kube_statefulset_labels{', to: 'count(kube_statefulset_created{'}
        - {from: 'sum(kube_daemonset_labels{', to: 'count(kube_daemonset_created{'}

  - name: k8s-views-namespaces
    upstream: dotdc
    url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/{ref}/dashboards/k8s-views-namespaces.json
    ref: v3.0.8
    adapt: k8s-views
    folder: kubernetes
    tags: [observability-kubernetes, kubernetes]
    queryCheck: true
    # kube-state-metrics writes no kube_*_labels series while its label
    # allow-list is empty (the default), so a count over them was empty; the
    # *_created series of the same kind is written for every object.
    tweaks:
      replace:
        - {from: 'sum(kube_deployment_labels{', to: 'count(kube_deployment_created{'}
        - {from: 'sum(kube_statefulset_labels{', to: 'count(kube_statefulset_created{'}
        - {from: 'sum(kube_daemonset_labels{', to: 'count(kube_daemonset_created{'}

  - name: k8s-views-nodes
    upstream: dotdc
    url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/{ref}/dashboards/k8s-views-nodes.json
    ref: v3.0.8
    adapt: k8s-views
    folder: kubernetes
    tags: [observability-kubernetes, kubernetes]
    queryCheck: true
    requires: [node-exporter]

  - name: k8s-views-pods
    upstream: dotdc
    url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/{ref}/dashboards/k8s-views-pods.json
    ref: v3.0.8
    adapt: k8s-views
    folder: kubernetes
    tags: [observability-kubernetes, kubernetes]
    queryCheck: true

  # -- Platform components (charts/observability-dashboards 0.13.0). The same
  # contract and the same query check as the operational views, plus the
  # absent-metric rule: a panel reads only metrics and labels in
  # available-metrics.yaml and available-labels.yaml, so a panel whose series
  # no scrape produces is dropped here and listed in the PR, never shipped
  # empty. Rewritten by hack/dashboards/platform_adapt.py from each source's
  # `platform:` block. Job names follow the converters: a ServiceMonitor's
  # job is its Service name, a PodMonitor's is `<namespace>/<podmonitor name>`.

  # argo-cd's own example dashboard. Upstream's `cluster` picker is an
  # application's DESTINATION cluster, so it is renamed `destination` and the
  # contract's `cluster` (the install) is added; its `interval` picker becomes
  # `resolution` so a range vector built from it is a duration in every query
  # tool; its namespace picker lists the namespaces that hold applications.
  - name: argocd
    upstream: argo-cd
    url: https://raw.githubusercontent.com/argoproj/argo-cd/{ref}/examples/dashboard.json
    ref: v3.5.3
    adapt: platform
    folder: platform
    tags: [observability-platform, argocd]
    queryCheck: true
    platform:
      anchor: 'argocd_app_info'
      renameVars:
        cluster: {name: destination, label: destination cluster}
        interval: {name: resolution, label: interval}
      varOverrides:
        namespace:
          query: 'label_values(argocd_app_info, namespace)'
          regex: ''
      varOptionsDrop:
        # `namespace` on an ArgoCD series is the namespace of the pod that
        # exposes it, not the application's: grouping by it says nothing.
        grouping: [namespace]
      dropRows:
        - title: AppSet Controller Telemetry
          reason: the ApplicationSet controller's metrics are not scraped (no argocd-applicationset-controller-metrics job)
      retitle:
        - {type: graph, from: Applications, to: Applications over time}
        # Upstream files these two pairs under the other component's row; the
        # titles follow the `job` each panel actually queries.
        - {row: Repo Server Stats, from: Memory Used, to: API server memory used}
        - {row: Repo Server Stats, from: Goroutines, to: API server goroutines}
        - {row: Server Stats, from: Memory Used, to: Repo server memory used}
        - {row: Server Stats, from: Goroutines, to: Repo server goroutines}
        - {row: Controller Telemetry, from: Memory Usage, to: Controller memory usage}
        - {row: Controller Telemetry, from: CPU Usage, to: Controller CPU usage}
        - {row: Controller Telemetry, from: Goroutines, to: Controller goroutines}
      units:
        Uptime: s
        Controller memory usage: bytes
        Repo server memory used: bytes
        API server memory used: bytes
        Controller CPU usage: percentunit

  # The cert-manager mixin's overview, rendered with the mixin's own
  # single-cluster defaults (its dashboard is a jsonnet file one substitution
  # from JSON). It names the deprecated `kube_pod_container_resource_*_cores`
  # series; those become the current kube-state-metrics names.
  - name: cert-manager
    upstream: cert-manager-mixin
    url: https://raw.githubusercontent.com/imusmanmalik/cert-manager-mixin/{ref}/dashboards/cert-manager-overview.json
    ref: v1.6.0
    adapt: platform
    folder: platform
    tags: [observability-platform, cert-manager]
    queryCheck: true
    deferred: [acme-issuer]
    mixinDefaults:
      containerCPUUsageSecondsTotalSelector: 'container=~"cert-manager.*",namespace=~"$namespace"'
      kubePodContainerResourceLimitsCpuCoresSelector: 'container=~"cert-manager.*",namespace=~"$namespace"'
      kubePodContainerResourceRequestsCpuCoresSelector: 'container=~"cert-manager.*",namespace=~"$namespace"'
      containerCpuCfsThrottledPeriodsTotalSelector: 'container=~"cert-manager.*",namespace=~"$namespace"'
      containerCpuCfsPeriodsTotalSelector: 'container=~"cert-manager.*",namespace=~"$namespace"'
      containerMemoryUsageBytesSelector: 'container=~"cert-manager.*",namespace=~"$namespace"'
      kubePodContainerResourceLimitsMemoryBytesSelector: 'container=~"cert-manager.*",namespace=~"$namespace"'
      kubePodContainerResourceRequestsMemoryBytesSelector: 'container=~"cert-manager.*",namespace=~"$namespace"'
      containerNetworkReceiveBytesTotalSelector: 'namespace=~"$namespace"'
      containerNetworkTransmitBytesTotalSelector: 'namespace=~"$namespace"'
    platform:
      anchor: 'certmanager_certificate_ready_status'
      dropVars: ['']
      dropPanels:
        - {title: ACME HTTP Requests/sec, reason: certmanager_http_acme_client_request_count is created only when an ACME issuer is used; requires acme-issuer}
        - {title: ACME HTTP Request avg duration, reason: certmanager_http_acme_client_request_duration_seconds_* are created only when an ACME issuer is used; requires acme-issuer}
      addVars:
        - name: namespace
          label: cert-manager namespace
          query: 'label_values(up{job="cert-manager"}, namespace)'
      replace:
        - {from: 'kube_pod_container_resource_limits_cpu_cores{', to: 'kube_pod_container_resource_limits{resource="cpu",'}
        - {from: 'kube_pod_container_resource_requests_cpu_cores{', to: 'kube_pod_container_resource_requests{resource="cpu",'}
        - {from: 'kube_pod_container_resource_limits_memory_bytes{', to: 'kube_pod_container_resource_limits{resource="memory",'}
        - {from: 'kube_pod_container_resource_requests_memory_bytes{', to: 'kube_pod_container_resource_requests{resource="memory",'}

  # cloudnative-pg/grafana-dashboards' cluster dashboard reads two kinds of
  # series: the operator's own controller-runtime series, and cnpg_* series
  # from each Postgres pod's :9187 exporter. The exporter is an optional
  # source (`cnpg-instance-metrics`: scraped only where the Postgres cluster
  # chart's PodMonitor selects the instance pods), so the one upstream
  # dashboard is imported twice: `cnpg-operator` keeps the Operator row and
  # is on by default; `cnpg-cluster` keeps every other row, requires the
  # optional source, and is off by default.
  - name: cnpg-operator
    upstream: cloudnative-pg
    url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/{ref}/charts/cluster/grafana-dashboard.json
    ref: cluster-v0.0.5
    adapt: platform
    folder: platform
    tags: [observability-platform, cnpg]
    queryCheck: true
    tweaks:
      title: 'CloudNativePG / Operator ($cluster)'
    platform:
      anchor: 'controller_runtime_reconcile_total{job="cnpg-system/cnpg-cloudnative-pg"}'
      keepOnlyRows: [Operator]
      keepOnlyReason: reads the instance exporter's series (cnpg_*), an optional source; those rows are the cnpg-cluster dashboard
      dropVars: [namespace, cluster, instances]
      renameVars:
        operatorNamespace: {name: namespace, label: operator namespace}
      varOverrides:
        namespace:
          query: 'label_values(controller_runtime_reconcile_total{job="cnpg-system/cnpg-cloudnative-pg"}, namespace)'
      dropPanels:
        - {row: Operator, type: stat, reason: duplicates the time series of the same name below it}
      retitle:
        - {from: Ready Operator Pods, to: Operator pods up}
      setExpr:
        - {title: Operator pods up, expr: 'count(up{job="cnpg-system/cnpg-cloudnative-pg",namespace=~"$namespace"} == 1)', unit: short}
      replace:
        - {from: 'controller_runtime_reconcile_total{namespace', to: 'controller_runtime_reconcile_total{job="cnpg-system/cnpg-cloudnative-pg", namespace'}
      units:
        Cluster Reconcile Errors: short
        Backup Reconcile Errors: short
        Scheduled Backup Reconcile Errors: short
        Pooler Reconcile Errors: short

  - name: cnpg-cluster
    upstream: cloudnative-pg
    url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/{ref}/charts/cluster/grafana-dashboard.json
    ref: cluster-v0.0.5
    adapt: platform
    folder: platform
    tags: [observability-platform, cnpg]
    queryCheck: true
    requires: [cnpg-instance-metrics]
    tweaks:
      title: 'CloudNativePG / Clusters ($cluster)'
    platform:
      anchor: 'cnpg_collector_up'
      dropRows:
        - {title: Operator, reason: the operator's own series are the cnpg-operator dashboard}
      # Upstream's own `cluster` is the Postgres cluster, which the
      # instance series carry as `cluster`; the contract's `cluster` is the
      # install (`k8s_cluster_name`), so upstream's is renamed.
      dropVars: [operatorNamespace]
      dropPanelsReading:
        - {contains: '$operatorNamespace', reason: the operator's own panels are the cnpg-operator dashboard}
        - {contains: kube_node_labels, reason: 'reads the node zone through kube_node_labels, whose topology label is not known to be exported by the kube-state-metrics label allow-list'}
      dropUntitled:
        - {row: top of dashboard, reason: 'a status light whose label was a text panel upstream; the titled panels beside it read the same series'}
      retitleByQuery:
        - {startswith: 'min(kube_pod_container_status_ready{container="postgres"', to: Instance ready}
        - {startswith: '1 - cnpg_pg_replication_in_recovery{', to: Replication status}
        - {startswith: 'cnpg_pg_replication_streaming_replicas{', to: Streaming replicas}
        - {startswith: 'sum by (pod) (cnpg_backends_total{', to: Connections}
        - {startswith: '100 * sum by (pod) (cnpg_backends_total{', to: Connections used of the maximum}
        - {startswith: 'max by (pod) (cnpg_pg_database_xid_age{', to: Transaction ID age}
        - {startswith: 'cnpg_pg_postmaster_start_time{', to: Started}
        - {startswith: 'cnpg_collector_postgres_version{', to: Postgres version}
        - {startswith: 'cnpg_pg_settings_setting{name="max_connections"', to: Max connections}
        - {startswith: 'max by (pod) (cnpg_pg_settings_setting{name="shared_buffers"', to: Shared buffers}
        - {startswith: 'max by (pod) (cnpg_pg_settings_setting{name="effective_cache_size"', to: Effective cache size}
        - {startswith: 'cnpg_pg_settings_setting{name="work_mem"', to: Work mem}
        - {startswith: 'cnpg_pg_settings_setting{name="maintenance_work_mem"', to: Maintenance work mem}
        - {startswith: 'cnpg_pg_settings_setting{name="random_page_cost"', to: Random page cost}
        - {startswith: 'cnpg_pg_settings_setting{name="seq_page_cost"', to: Sequential page cost}
      dropPanels:
        - {title: Configurations, reason: 'lists every pg_settings row, and only 8 settings are kept (block_size, effective_cache_size, maintenance_work_mem, max_connections, random_page_cost, seq_page_cost, shared_buffers, work_mem), so the table would read as the whole configuration'}
        - {title: CPU Utilisation, reason: reads a node_namespace_pod_container recording rule no store holds}
        - {title: CPU Usage, reason: reads a node_namespace_pod_container recording rule no store holds}
      replace:
        # PostgreSQL 17 moved these counters from pg_stat_bgwriter to
        # pg_stat_checkpointer; the exporter publishes the new names.
        - {from: '{__name__=~"cnpg_pg_stat_(bgwriter|checkpointer)_checkpoints_req",', to: 'cnpg_pg_stat_checkpointer_checkpoints_req{'}
        - {from: '{__name__=~"cnpg_pg_stat_(bgwriter|checkpointer)_checkpoints_timed",', to: 'cnpg_pg_stat_checkpointer_checkpoints_timed{'}
        - {from: '{__name__=~"cnpg_pg_stat_(bgwriter_checkpoint|checkpointer)_write_time",', to: 'cnpg_pg_stat_checkpointer_write_time{'}
        - {from: '{__name__=~"cnpg_pg_stat_(bgwriter_checkpoint|checkpointer)_sync_time",', to: 'cnpg_pg_stat_checkpointer_sync_time{'}
      renameVars:
        cluster: {name: pgcluster, label: postgres cluster}
      varOverrides:
        namespace:
          query: 'label_values(cnpg_collector_up, namespace)'
        pgcluster:
          query: 'label_values(cnpg_collector_up{namespace=~"$namespace"}, cluster)'
        instances:
          query: 'label_values(cnpg_collector_up{namespace=~"$namespace",cluster=~"$pgcluster"}, pod)'
      regexMatchVars: [namespace]
      guardPanel: true
      grids:
        top of dashboard:
          - {h: 3, titles: [Postgres instances reporting]}
          - {h: 4, titles: [Last failover, TPS, Replication Lag, Write Lag, Flush Lag, Replay Lag]}
          - {h: 5, titles: [Memory Utilisation, Volume Space Usage, Last Base Backup, Last archived WAL]}
          - {h: 3, titles: [Version, Database Size, First Recoverability Point]}
        Server Health:
          - {h: 3, titles: [Instance ready, Replication status, Streaming replicas, Started, Postgres version]}
          - {h: 6, titles: [Connections, Connections used of the maximum, Transaction ID age]}
        Configuration:
          - {h: 3, titles: [Max connections, Shared buffers, Effective cache size, Work mem]}
          - {h: 3, titles: [Maintenance work mem, Random page cost, Sequential page cost]}

  # The prometheus-nats-exporter walkthrough dashboards, served by the
  # sidecar with -connz -routez -subz -varz -jsz=all. The cumulative varz
  # counters (bytes and messages in and out) are shown as rates.
  - name: nats-server
    upstream: nats-exporter
    url: https://raw.githubusercontent.com/nats-io/prometheus-nats-exporter/{ref}/walkthrough/grafana-nats-dash.json
    ref: v0.20.2
    adapt: platform
    folder: platform
    tags: [observability-platform, nats]
    queryCheck: true
    platform:
      anchor: 'nats_varz_connections'
      datasourcePlaceholder: '${DS__NATS-PROMETHEUS}'
      metricPrefixRewrite: &natsPrefix
        # The NATS chart runs the exporter with prefix `nats`; the walkthrough
        # dashboards were drawn for the exporter's default names.
        gnatsd_: nats_
        jetstream_server_: nats_server_
        jetstream_stream_: nats_stream_
        jetstream_consumer_: nats_consumer_
      replace:
        - {from: 'nats_varz_in_bytes', to: 'rate(nats_varz_in_bytes[$__rate_interval])'}
        - {from: 'nats_varz_out_bytes', to: 'rate(nats_varz_out_bytes[$__rate_interval])'}
        - {from: 'nats_varz_in_msgs', to: 'rate(nats_varz_in_msgs[$__rate_interval])'}
        - {from: 'nats_varz_out_msgs', to: 'rate(nats_varz_out_msgs[$__rate_interval])'}
      units:
        Server CPU: percent
        Server Memory: bytes
        Bytes In: Bps
        Bytes Out: Bps
        NATS Msgs In: ops
        NATS Msgs Out: ops

  - name: nats-jetstream
    upstream: nats-exporter
    url: https://raw.githubusercontent.com/nats-io/prometheus-nats-exporter/{ref}/walkthrough/grafana-jetstream-dash.json
    ref: v0.20.2
    adapt: platform
    folder: platform
    tags: [observability-platform, nats]
    queryCheck: true
    platform:
      anchor: 'nats_server_total_streams'
      datasourcePlaceholder: '${DS__NATS-PROMETHEUS}'
      metricPrefixRewrite: *natsPrefix

  # envoyproxy/gateway's addons dashboards. The proxies' scrape keeps only the
  # families envoy-proxy-global.json and envoy-clusters.json read (plus
  # envoy_http_downstream_rq_xx for the Fleet overview), so exactly those
  # panels work. Upstream's `Namespace` picker is the namespace of the pod,
  # renamed to the contract's `namespace`; envoy-clusters' own `cluster` and
  # `namespace` pickers are an Envoy cluster and a route namespace, renamed
  # so the contract's names keep their meaning.
  - name: envoy-gateway
    upstream: envoy-gateway
    url: https://raw.githubusercontent.com/envoyproxy/gateway/{ref}/charts/gateway-addons-helm/dashboards/envoy-gateway-global.json
    ref: v1.9.2
    adapt: platform
    folder: platform
    tags: [observability-platform, envoy]
    queryCheck: true
    platform:
      anchor: 'watchable_depth'
      renameVars:
        Namespace: {name: namespace, label: namespace}
      regexMatchVars: [namespace, Runner]
      replace:
        # A counter created on the first panic: no series is the healthy state.
        - {from: 'sum(watchable_panics_recovered_total{namespace="$namespace"})', to: 'sum(watchable_panics_recovered_total{namespace="$namespace"}) or vector(0)'}
      dropRows:
        - title: Wasm
          reason: wasm_* series exist only once a Wasm extension is configured, and export on a default install is not confirmed

  - name: envoy-proxy
    upstream: envoy-gateway
    url: https://raw.githubusercontent.com/envoyproxy/gateway/{ref}/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
    ref: v1.9.2
    adapt: platform
    folder: platform
    tags: [observability-platform, envoy]
    queryCheck: true
    deferred: [envoy-tcp-listeners]
    platform:
      anchor: 'envoy_server_live'
      renameVars:
        Namespace: {name: namespace, label: namespace}
      regexMatchVars: [namespace]
      dropPanels:
        - {title: TCP Downstream CPS, reason: envoy_tcp_downstream_* exist only when a TCP listener is configured; requires envoy-tcp-listeners}
        - {title: TCP Downstream Bytes Rx/second, reason: envoy_tcp_downstream_* exist only when a TCP listener is configured; requires envoy-tcp-listeners}
        - {title: TCP Downstream Bytes Tx/Second, reason: envoy_tcp_downstream_* exist only when a TCP listener is configured; requires envoy-tcp-listeners}
      units:
        Downstream RPS: reqps
        Downstream CPS: cps
        TCP Downstream CPS: cps
        TCP Downstream Bytes Rx/second: Bps
        TCP Downstream Bytes Tx/Second: Bps
        Upstream RPS: reqps
        Upstream CPS: cps
        Upstream Bytes Rx/Second: Bps
        Upstream Bytes Tx/Second: Bps
        Upstream 2xx Responses: reqps
        Upstream 3xx Responses: reqps
        Upstream 4xx Responses: reqps
        Upstream 5xx Responses: reqps

  - name: envoy-clusters
    upstream: envoy-gateway
    url: https://raw.githubusercontent.com/envoyproxy/gateway/{ref}/charts/gateway-addons-helm/dashboards/envoy-clusters.json
    ref: v1.9.2
    adapt: platform
    folder: platform
    tags: [observability-platform, envoy]
    queryCheck: true
    deferred: [envoy-outlier-detection]
    platform:
      anchor: 'envoy_server_live'
      varAnchor: 'envoy_cluster_membership_total'
      replace:
        # The HTTP listener's connection-manager prefix is `http` or `https`
        # plus the port; the anchored `http-.*` never matched `https-<port>`.
        - {from: 'envoy_http_conn_manager_prefix=~"http-.*"', to: 'envoy_http_conn_manager_prefix=~"https?-.*"'}
      renameVars:
        cluster: {name: envoy_cluster, label: envoy cluster}
        namespace: {name: route_namespace, label: route namespace}
      dropPanels:
        - {title: Outlier ejected, reason: envoy_cluster_outlier_detection_* exist only when outlier detection is configured; requires envoy-outlier-detection}
      units:
        Total requests: reqps

  # External Secrets Operator's own dashboard (docs/snippets/dashboard.json in
  # the project, the file its chart ships as `grafanaDashboard`), pinned to the
  # release tag of the chart in use. The operator is an optional source here:
  # its metrics are scraped only where the chart's `serviceMonitor.enabled` is
  # on, so the dashboard requires `external-secrets-metrics` and is off by
  # default. Upstream selects on `service`; the converters' job is the Service
  # name (`external-secrets-metrics`, `external-secrets-webhook-metrics`,
  # `external-secrets-cert-controller-metrics`), so the selectors become a `job`
  # match, which the available-labels list can judge.
  - name: external-secrets
    upstream: external-secrets
    url: https://raw.githubusercontent.com/external-secrets/external-secrets/{ref}/docs/snippets/dashboard.json
    ref: v2.10.0
    adapt: platform
    folder: platform
    tags: [observability-platform, external-secrets]
    queryCheck: true
    requires: [external-secrets-metrics]
    platform:
      anchor: 'externalsecret_status_condition'
      regexMatchVars: [controller]
      replace:
        - {from: 'service=~".*external-secrets.*"', to: 'job=~"external-secrets.*"'}
        - {from: 'service=~"external-secrets.*"', to: 'job=~"external-secrets.*"'}
      # An ExternalSecret's own `namespace` label collides with the scrape's and
      # survives as `exported_namespace` (honor_labels: false), so grouping by
      # `namespace` would name the operator's namespace on every row.
      setExpr:
        - {title: 'Not Ready ExternalSecrets  [15m]', expr: 'sum(externalsecret_status_condition{condition="Ready",status="False"}) by (exported_namespace, name) == 1'}
        - {title: 'ExternalSecret sync call errors [15m]', expr: 'sum(increase(externalsecret_sync_calls_error[15m])) by (name, exported_namespace)', legend: '{{exported_namespace}}/{{name}}'}
    tweaks:
      dropPanels:
        - {title: "Webhook latency [5m]", reason: "controller_runtime_webhook_latency_seconds_bucket is not exported by any External Secrets Operator version in use, so the panel can never have data"}
        - {title: "webhook latency", reason: "controller_runtime_webhook_latency_seconds_bucket is not exported by any External Secrets Operator version in use, so the panel can never have data"}

  # Authored: no upstream project ships a Kargo dashboard
  # (hack/dashboards/kargo.py).
  - name: kargo
    authored: true
    generator: hack/dashboards/kargo.py
    folder: platform
    tags: [observability-platform, kargo]
    queryCheck: true

  # Authored: no upstream project ships a Keycloak dashboard
  # (hack/dashboards/keycloak.py). Reads the optional source
  # `keycloak-metrics`: the install's own /metrics, scraped only where
  # truvity/keycloak's chart turns its ServiceMonitor on. Off by default.
  - name: keycloak
    authored: true
    generator: hack/dashboards/keycloak.py
    folder: platform
    tags: [observability-platform, keycloak]
    queryCheck: true
    requires: [keycloak-metrics]
  # Authored: no upstream project ships an OpenBAO dashboard for the series
  # the server exposes (hack/dashboards/openbao.py). OpenBAO runs where the
  # secret plane does and its metrics are scraped only where charts/openbao-ops'
  # serverMetrics is on, so it is an optional source: off by default.
  - name: openbao
    authored: true
    generator: hack/dashboards/openbao.py
    folder: platform
    tags: [observability-platform, openbao]
    queryCheck: true
    requires: [openbao-server-metrics]

# Third-party provenance. Every fetched dashboard names its `upstream`
