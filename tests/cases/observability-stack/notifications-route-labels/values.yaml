# Routing an alert that is born outside a cluster: alert-ingress mappings
# set `source` on it, and `routeLabels` lists `source`, so a route matches
# `source: aws-guardduty` and `source: aws-cost` without a made-up
# k8s_cluster_name. A route on the cluster still works beside them.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  routeLabels: [k8s_cluster_name, k8s_namespace_name, source]
  slack:
    workspaces:
      - name: acme
        appTokenSecret: {name: example-acme-slack-bot, key: token}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical", workspace: acme}
    warning: {receiver: slack, channel: "#alerts", workspace: acme}
  routes:
    - match: {source: aws-guardduty}
      critical: "#alerts-security"
      warning: "#alerts-security"
    - match: {source: aws-cost}
      warning: "#alerts-cost"
    - match: {k8s_cluster_name: example-cluster, k8s_namespace_name: example}
      critical: "#alerts-example"
