# Source: oncall/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oncall-goalert
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: goalert
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oncall
      app.kubernetes.io/instance: oncall
      app.kubernetes.io/component: goalert
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # People (through the gateway) and Alertmanager, on the HTTP port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalertmanager
      ports:
        - protocol: TCP
          port: 8081
    # The metrics port.
    - ports:
        - protocol: TCP
          port: 2112
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
  egress:
    # PostgreSQL.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: oncall-pg
      ports:
        - protocol: TCP
          port: 5432
    # The relay: a user's Webhook contact method points at it.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oncall
              app.kubernetes.io/instance: oncall
              app.kubernetes.io/component: telegram-relay
      ports:
        - protocol: TCP
          port: 8080
    # DNS. With no `networkPolicy.dns`, port 53 to any destination.
    - to:
        - ipBlock:
            cidr: 10.100.0.0/16
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The OIDC issuer and any HTTPS webhook. A NetworkPolicy cannot pin a
    # hostname, so this is HTTPS to anywhere, stated as that.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

