# observability-mcp: read-only Model Context Protocol connectors over the
# observability stores and Grafana.
#
# The chart knows two kinds of thing, and nothing about an estate's
# topology:
#
#   stores    each a Victoria store (VictoriaMetrics, VictoriaLogs and
#             VictoriaTraces behind ONE vmauth). One entry renders ONE
#             connector: one OAuth resource, one Deployment serving the
#             store's tools for every signal, grouped by prefix
#             (`metrics_`, `logs_`, `traces_`). Which stores exist, what
#             they are called and which clusters each holds is the
#             consumer's.
#   grafana   one optional connector over a Grafana (dashboards, read
#             only).
#
# A store's pod has these containers, all on loopback except the proxy:
#
#   proxy        truvity/access-roster's resource-proxy, the pod's only
#                MCP port. INBOUND it validates the caller's access token
#                (signature against the issuer's JWKS, `iss`, `aud` equal
#                to the connector's resource URL), serves the protected
#                resource metadata and strips the caller's token.
#                OUTBOUND it listens on loopback and forwards to the
#                store's vmauth, injecting a token it exchanged for the
#                pod's own ServiceAccount token. The caller's token is
#                never forwarded.
#   aggregator   this repository's cmd/mcp-aggregator: one MCP server over
#                the three below, tools only, allowlisted, prefixed.
#   metrics / logs / traces
#                the stock VictoriaMetrics-Community MCP servers, pinned,
#                holding no credential, declaring no container port.
#
# A Grafana pod is the proxy and the stock mcp-grafana.
#
# Who may reach a connector is decided by the issuer's own policy for the
# resource URL, not by anything here. See docs/mcp.md.
#
# Every refusal is in templates/_validate.tpl; every one has a fixture under
# tests/invalid/observability-mcp/.

# -- The access-token issuer the proxy trusts (its `iss`, and where it finds
# the signing keys). Required while anything is enabled.
issuerURL: ""

# -- What the store's data says about where it came from. They are the
# stack's `tenancy.clusterLabel` (metrics) and `tenancy.logsClusterField`
# (logs and traces), and only fill in the connector's instructions text;
# set them if the stack's are not the defaults.
clusterLabel: k8s_cluster_name
logsClusterField: k8s.cluster.name

# -- The resource-proxy sidecar, shared by every connector.
proxy:
  image:
    repository: ghcr.io/truvity/access-roster/resource-proxy
    # -- NO default: the image is built by a different repository's release,
    # so a default here would be a version this chart's own tag cannot know
    # is right. Required (refused empty) while anything is enabled.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # -- The numeric uid the image runs as. `runAsNonRoot` cannot verify a
  # named user, so the uid is stated.
  runAsUser: 65532
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

# -- The aggregator: one MCP server over a store's three stock servers
# (cmd/mcp-aggregator in this repository, released with this chart).
aggregator:
  image:
    repository: ghcr.io/truvity/observability/mcp-aggregator
    # -- Empty: this chart's own appVersion, the release that built both.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  runAsUser: 65532
  # -- How long one tool call may run, end to end, before the caller gets
  # an error naming the backend. A Go duration.
  callTimeout: 60s
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# -- The projected ServiceAccount token the proxy exchanges at the issuer.
# Audience and lifetime are the issuer's to set; the kubelet refreshes the
# file, the proxy reads it fresh each time.
serviceAccountToken:
  audience: access-issuer
  # -- Seconds. The kubelet minimum is 600.
  expirationSeconds: 600

# -- The stock servers, pinned by tag AND digest, and the read-only tool
# allowlists the aggregator exposes from them. The allowlists are the
# verified set (docs/mcp.md has the path of every tool through the store's
# proxy); a tool that is not listed is never exposed, and a listed tool the
# server does not offer keeps the pod from becoming ready, so a server
# upgrade cannot silently change the surface.
#
# No CPU limits anywhere (a throttled query tool is a slow one); a memory
# limit each. `disabledTools` is defence in depth on the server itself
# (MCP_DISABLED_TOOLS replaces the server's own default list, so it names
# that list too).
upstreams:
  victoriametrics:
    image:
      repository: ghcr.io/victoriametrics/mcp-victoriametrics
      tag: v1.20.2
      digest: "sha256:bcbf84f945d6efb03fb8b2d2ccc3294420dccdc0b445752dce96f02619416dfe"
      pullPolicy: IfNotPresent
    # -- The uid of the `mcp` user in these images.
    runAsUser: 1000
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
    # -- The prefix and the path the server appends to the proxy's loopback
    # listener: the store's vmauth serves the Prometheus API under it.
    prefix: metrics
    entrypointPath: /prometheus
    # -- Read tools that work through the stack's read routes. Not here, on
    # purpose: `prettify_query` (its upstream code calls a path no read route
    # admits, so it fails by design on a valid query) and `metrics_metadata`
    # (only a store that sets `tenancy.allowUnfilteredMetricMetadata` serves
    # it; turn it on per store with `metricsMetadata: true`).
    tools:
      - query
      - query_range
      - metrics
      - labels
      - label_values
      - series
      - rules
      - alerts
      - tsdb_status
      - explain_query
    disabledTools:
      - export
      - flags
      - metric_relabel_debug
      - downsampling_filters_debug
      - retention_filters_debug
      - test_rules
      - metric_statistics
      - active_queries
      - top_queries
      - tenants
      - documentation
      - prettify_query
      - metrics_metadata
      - deployments
      - cloud_providers
      - regions
      - tiers
      - access_tokens
      - rule_filenames
      - rule_file
  victorialogs:
    image:
      repository: ghcr.io/victoriametrics/mcp-victorialogs
      tag: v1.9.0
      digest: "sha256:753bb4fbe402ca1a782842f44636830f9895736f11d7fe783b924f8a0daf083d"
      pullPolicy: IfNotPresent
    runAsUser: 1000
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
    prefix: logs
    # -- Empty: the store's vmauth serves `/select/logsql/*` at its root and
    # the server adds that path itself. `flags` is left out (an admin path
    # no read route admits) and so is `documentation`.
    entrypointPath: ""
    tools:
      - hits
      - facets
      - stats_query
      - stats_query_range
      - field_names
      - field_values
      - stream_field_names
      - stream_field_values
      - stream_ids
      - streams
      - query
    disabledTools:
      - documentation
      - flags
  victoriatraces:
    image:
      repository: ghcr.io/victoriametrics-community/mcp-victoriatraces
      tag: v1.5.0
      digest: "sha256:72b3227c03856048e0adcbf5d247e3ae0b6cf8ab1bc27df6fe10ed0cacdcd07c"
      pullPolicy: IfNotPresent
    runAsUser: 1000
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
    prefix: traces
    # -- Empty: the server adds `/select/jaeger/api`, which the store's
    # vmauth serves (only for a principal the stack admits to unfiltered
    # trace reads).
    entrypointPath: ""
    tools:
      - traces
      - trace
      - services
      - service_operations
      - dependencies
    disabledTools:
      - documentation
  grafana:
    image:
      repository: docker.io/grafana/mcp-grafana
      # Docker Hub's tags carry no `v`.
      tag: 1.6.3
      digest: "sha256:0479c026fd40a95e6a176855b8570e06845790f8a45de2f9c1ec8ba3ba06a8bf"
      pullPolicy: IfNotPresent
    # -- The uid of the `mcp-grafana` user in that image.
    runAsUser: 1000
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
    # -- Read-only, by construction: only these tool categories, and
    # `--disable-write` on top (which leaves out `update_dashboard`).
    enabledTools: [search, dashboard]

# -- The Victoria stores. One connector each. Every entry:
#
#   name          required. A lowercase slug; objects are named
#                 `observability-mcp-<name>`. It never changes once people
#                 rely on it. `grafana` is reserved for the Grafana
#                 connector.
#   resourceURL   required. The connector's RFC 8707 resource identifier:
#                 the exact URL a client connects to and the `aud` the
#                 proxy requires. https, no fragment.
#   scope         optional. The scope the 401 challenge advertises
#                 (default `openid`).
#   vmauth        required: {url}. The store's vmauth BASE URL, scheme and
#                 host, no path; the proxy's outbound side forwards there.
#                 `metricsPath` overrides `upstreams.victoriametrics.
#                 entrypointPath` (the stack's `/prometheus`).
#   outbound      required: {tokenEndpoint, clientId, audience}. How this
#                 workload gets the token the store's vmauth accepts: an
#                 RFC 8693 exchange of the pod's ServiceAccount token at
#                 `tokenEndpoint` as client `clientId`, for `audience`.
#   clusters      optional list of the cluster-label values the store
#                 holds. Only used to write the connector's instructions.
#   signals       optional {metrics, logs, traces}, each default true.
#                 At least one stays on.
#   metricsMetadata  optional bool (default false). Adds the
#                 `metrics_metadata` tool: the store's vmauth serves it
#                 only when the stack sets
#                 `tenancy.allowUnfilteredMetricMetadata`.
#   instructions  optional text appended to the generated instructions.
#   replicaCount  optional (default 1).
#
# What the store's vmauth must admit for the connector's principal, and
# which tools need what, is in docs/mcp.md.
#
#   stores:
#     - name: primary
#       resourceURL: https://mcp.example.com/victoria/primary
#       clusters: [alpha, beta]
#       vmauth: {url: http://vmauth.monitoring.svc:8427}
#       outbound:
#         tokenEndpoint: https://issuer.example.com/token
#         clientId: observability-mcp-primary
#         audience: primary-store
stores: []

# -- The Grafana connector: mcp-grafana, dashboards only, read only,
# authenticating to Grafana with an access-issuer WORKLOAD token (the
# proxy's outbound side), never a stored secret. Grafana must accept that
# token: `global.observabilityGrafana.workloadAuth` in charts/
# observability-grafana, whose `audience` is this connector's
# `outbound.audience`. See docs/mcp.md.
grafana:
  enabled: false
  # -- https, no fragment. Required while enabled.
  resourceURL: ""
  scope: openid
  replicaCount: 1
  # -- Grafana's URL as the pod reaches it: scheme and host, no path. The
  # proxy's outbound side forwards there. Required while enabled.
  url: ""
  # -- Required while enabled. `audience` is what Grafana's `workloadAuth`
  # expects; it must not be the audience of any human sign-in client.
  outbound:
    tokenEndpoint: ""
    clientId: ""
    audience: ""

networkPolicy:
  enabled: true
  # -- NetworkPolicy peers allowed to reach the proxy's one MCP port: the
  # gateway that fronts these connectors. Required while `enabled`; an empty
  # list would render an ingress rule that admits nobody.
  #
  #   ingressFrom:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: <gateway namespace>
  ingressFrom: []
  # -- Optional. Peers allowed to scrape the aggregator's `/metrics` on its
  # admin port (9090). Empty: nothing may (the kubelet's probes are not
  # subject to it).
  metricsFrom: []
  # -- Where the pods may connect: the issuer, the store's vmauth (and
  # Grafana), and cluster DNS. Nothing else. Both lists required while
  # `enabled`.
  egress:
    # -- Peers the issuer (JWKS and token endpoint) is reached at. The ports
    # come from `issuerURL` and each connector's `outbound.tokenEndpoint`.
    issuer: []
    # -- Peers the stores' vmauth are reached at. The port comes from each
    # store's `vmauth.url`.
    vmauth: []
    # -- Peers Grafana is reached at. Required while the Grafana connector is
    # enabled. The port comes from `grafana.url`.
    grafana: []

# -- Optional. Refused with fewer than two replicas: a budget of one
# available on a single replica blocks every node drain.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
