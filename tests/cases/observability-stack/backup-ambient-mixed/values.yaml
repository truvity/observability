# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}


# `ambient`, mixed: the metrics backup on its own ServiceAccount (its own
# role), the log and trace backups still sharing the release-wide one
# from `backup.auth.serviceAccount` — the step an estate takes first,
# splitting off the store whose data is most sensitive.
backup:
  enabled: true
  destination: s3://example-backups/observability
  auth:
    mode: ambient
    serviceAccount:
      name: example-observability-backup
      annotations:
        eks.amazonaws.com/role-arn: "<IAM role shared by the logs and traces backups>"
  metrics:
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: "<IAM role for the metrics backup only>"
  traces:
    enabled: true
