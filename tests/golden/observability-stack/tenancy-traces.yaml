# Source: observability-stack/charts/victoria-traces-single/templates/server.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: observability-stack-vt-single-server
  namespace: observability
  labels: 
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vt-single
    app.kubernetes.io/version: v0.11.0
    helm.sh/chart: victoria-traces-single-0.1.11
spec:
  podManagementPolicy: OrderedReady
  updateStrategy: {}
  replicas: 1
  serviceName: observability-stack-vt-single-server
  selector:
    matchLabels: 
      app: server
      app.kubernetes.io/instance: observability-stack
      app.kubernetes.io/name: vt-single
  template:
    metadata:
      labels: 
        app: server
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: observability-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: vt-single
    spec:
      securityContext: 
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: vtraces
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: victoriametrics/victoria-traces:v0.11.0
          imagePullPolicy: IfNotPresent
          args: 
            - --envflag.enable
            - --envflag.prefix=VM_
            - --http.shutdownDelay=15s
            - --httpListenAddr=:10428
            - --loggerFormat=json
            - --retention.maxDiskUsagePercent=80
            - --retentionPeriod=30d
            - --servicegraph.enableTask=false
            - --storage.minFreeDiskSpaceBytes=10GiB
            - --storageDataPath=/storage
          env: 
            - name: VM_httpAuth_username
              valueFrom:
                secretKeyRef:
                  key: username
                  name: observability-store-credentials
            - name: VM_httpAuth_password
              valueFrom:
                secretKeyRef:
                  key: password
                  name: observability-store-credentials
          ports:
            - name: http
              containerPort: 10428
          readinessProbe: 
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe: 
            failureThreshold: 10
            initialDelaySeconds: 30
            periodSeconds: 30
            tcpSocket:
              port: http
            timeoutSeconds: 5
          resources: 
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: server-volume
              mountPath: /storage
      terminationGracePeriodSeconds: 60
      volumes:
        - name: server-volume
          emptyDir: 
            {}

