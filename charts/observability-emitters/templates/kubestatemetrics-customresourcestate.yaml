{{- /*
The ConfigMap `kube-state-metrics.customResourceState.name` points at
(values.yaml pins `customResourceState.enabled: true` / `create: false`
unconditionally whenever `kubeStateMetrics.enabled` is — see that
value's own comment). It renders WHENEVER kube-state-metrics does,
never only when a preset below is on: the subchart's Deployment mounts
this ConfigMap by name regardless, so an install with every preset off
still needs it to exist, just empty.

`resources: []` is a valid, inert CustomResourceStateMetrics document —
kube-state-metrics starts, watches nothing extra, and exports nothing
extra. Each preset below appends its own `groupVersionKind` entry rather
than replacing the list, so two presets on at once compose rather than
one silently discarding the other's.

The `kargo` preset below is verified against kube-state-metrics 7.5.3's
own Go schema (pkg/customresourcestate/config.go,
pkg/customresourcestate/registry_factory.go), not upstream's own
documentation example, which is out of date for this shape (it shows
`value:` where the struct field is `valueFrom`).

`kargo_stage_condition`: a Gauge over status.conditions[] (a k8s
metav1.Condition list) — one series per condition CURRENTLY on the
object. `type`/`reason` are read per-element via `each.gauge.
labelsFromPath`, resolved against the array element, not the whole
object. `valueFrom: [status]` reads the condition's own `status`
("True"/"False"/"Unknown") through kube-state-metrics' `toFloat64`,
which special-cases exactly this shape: "true" -> 1, "false"/"unknown"
-> 0.

`kargo_promotion_phase`: a StateSet over status.phase — one of Kargo's
own six (Pending, Running, Succeeded, Failed, Errored, Aborted) — SIX
series per Promotion object, 1 on the current phase and 0 on the other
five. It carries NO per-Promotion name label (`namespace`, `stage` and
`phase` only): Kargo keeps finished Promotions, one new name per
promotion, so a name label made the metric grow without bound (15k
series on a measured estate). Without it the Promotions of one Stage
emit the same label set, and the store keeps the LARGEST value per
sample time (`-dedup.minScrapeInterval`, which this chart's store sets
to the scrape interval), so a series reads 1 while ANY Promotion of that
Stage is in that phase. Every reader here asks that question (is a
Promotion of the Stage Errored, Running, Failed), never which one.

`nodeclaim_status_condition` (the `nodeClaims` preset): the same Gauge
shape over a Karpenter NodeClaim's status.conditions (Launched, Registered,
Initialized, Ready, ConsistentStateFound, Consolidatable: six series per
claim, a NodeClaim being one per provisioned node). NodeClaims are
cluster-scoped, so there is no namespace label; `nodepool` is read from the
`karpenter.sh/nodepool` label Karpenter sets on every claim.

`cnpg_cluster_status_condition` (the `cnpg` preset): the same Gauge shape
over a CloudNativePG Cluster's status.conditions (Ready, ContinuousArchiving,
...), plus `phase`, read from status.phase (free text such as "Cluster in
healthy state" or "Switchover in progress"), as a label of every series. A
phase is a label and not a StateSet because CloudNativePG's phases are an open
set of strings, not an enum. A phase change replaces the series, which is
what a "Ready=False in phase X for 15m" rule wants.
`cnpg_cluster_instances` (spec.instances) and `cnpg_cluster_ready_instances`
(status.readyInstances) come with it, same labels: a Cluster whose phase is
not healthy while the two are equal is the stuck-reconcile signature
`CNPGClusterPhaseStuck` reads, a degraded one has fewer ready than desired. One series per condition
per Cluster object: a handful per database, no unbounded name label.

`metricNamePrefix: ""` on all of them, explicit: unset, kube-state-metrics'
own default prefixes every name with `kube_customresource_`; the empty
string is what yields the plain names `charts/platform-alerts`'
`groups.kargo` reads.
*/ -}}
{{- if .Values.kubeStateMetrics.enabled }}
{{- $customResources := .Values.kubeStateMetrics.customResources | default dict }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability-emitters.kubeStateMetrics.crsConfigMapName" . }}
  labels:
    {{- include "observability-emitters.labels" . | nindent 4 }}
data:
  config.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
{{- if or (($customResources.kargo).enabled) (($customResources.nodeClaims).enabled) (($customResources.cnpg).enabled) }}
{{- if ($customResources.kargo).enabled }}
        - groupVersionKind:
            group: kargo.akuity.io
            version: v1alpha1
            kind: Stage
          metricNamePrefix: ""
          labelsFromPath:
            namespace: [metadata, namespace]
            stage: [metadata, name]
          metrics:
            - name: kargo_stage_condition
              help: >-
                Kargo Stage status condition, from status.conditions: 1
                if the condition's own status is True, 0 if False or
                Unknown.
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    type: ["type"]
                    reason: ["reason"]
                  valueFrom: ["status"]
        - groupVersionKind:
            group: kargo.akuity.io
            version: v1alpha1
            kind: Promotion
          metricNamePrefix: ""
          labelsFromPath:
            namespace: [metadata, namespace]
            stage: [spec, stage]
          metrics:
            - name: kargo_promotion_phase
              help: >-
                Kargo Promotion phase, from status.phase, as a StateSet:
                1 for the Promotion's current phase, 0 for the other
                five. One series per (namespace, stage, phase): the
                Promotions of a Stage share series, and the store keeps the
                largest value, so 1 means at least one Promotion of the
                Stage is in that phase.
              each:
                type: StateSet
                stateSet:
                  path: [status, phase]
                  labelName: phase
                  list: [Pending, Running, Succeeded, Failed, Errored, Aborted]
{{- end }}
{{- if ($customResources.nodeClaims).enabled }}
        - groupVersionKind:
            group: karpenter.sh
            version: v1
            kind: NodeClaim
          metricNamePrefix: ""
          labelsFromPath:
            nodeclaim: [metadata, name]
            nodepool: [metadata, labels, karpenter.sh/nodepool]
          metrics:
            - name: nodeclaim_status_condition
              help: >-
                Karpenter NodeClaim status condition, from
                status.conditions: 1 if the condition's own status is True,
                0 if False or Unknown.
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    type: ["type"]
                    reason: ["reason"]
                  valueFrom: ["status"]
{{- end }}
{{- if ($customResources.cnpg).enabled }}
        - groupVersionKind:
            group: postgresql.cnpg.io
            version: v1
            kind: Cluster
          metricNamePrefix: ""
          labelsFromPath:
            namespace: [metadata, namespace]
            cluster: [metadata, name]
            phase: [status, phase]
          metrics:
            - name: cnpg_cluster_status_condition
              help: >-
                CloudNativePG Cluster status condition, from
                status.conditions: 1 if the condition's own status is True,
                0 if False or Unknown. Every series carries the Cluster's
                current status.phase.
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    type: ["type"]
                    reason: ["reason"]
                  valueFrom: ["status"]
            - name: cnpg_cluster_instances
              help: >-
                CloudNativePG Cluster desired instances, from spec.instances.
                Every series carries the Cluster's current status.phase.
              each:
                type: Gauge
                gauge:
                  path: [spec, instances]
            - name: cnpg_cluster_ready_instances
              help: >-
                CloudNativePG Cluster instances the operator counts as ready,
                from status.readyInstances (absent while the field is unset,
                that is 0 ready in the status). Every series carries the
                Cluster's current status.phase.
              each:
                type: Gauge
                gauge:
                  path: [status, readyInstances]
{{- end }}
{{- else }}
        []
{{- end }}
{{- end }}
