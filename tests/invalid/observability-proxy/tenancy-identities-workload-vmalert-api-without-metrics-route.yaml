# expect: `vmalertAPI: true` but its `routes`
# vmalertAPI belongs to a metrics reader.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  allowUnfilteredAlertReads: true
  identities:
    - name: example-app
      groups: [example:example-app]
      workload: {routes: [logs], vmalertAPI: true}
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]


victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
