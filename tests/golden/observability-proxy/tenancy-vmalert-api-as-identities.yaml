---
# Source: observability-proxy/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-stack-proxy
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmauth
      app.kubernetes.io/instance: observability-stack
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8427
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8435

---
# Source: observability-proxy/templates/vmauth.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: observability-stack
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  image:
    repository: victoriametrics/vmauth
    tag: v1.152.0
  replicaCount: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 512Mi
  selectAllByDefault: false
  userSelector:
    matchLabels:
      app.kubernetes.io/part-of: observability-stack
      app.kubernetes.io/instance: observability-stack
  userNamespaceSelector: {}
  extraArgs:
    logInvalidAuthTokens: "true"

---
# Source: observability-proxy/templates/vmusers.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: observability-stack-example-observability-mcp-reader
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.role: reader
spec:
  name: "example:observability-mcp:reader"
  disable_secret_creation: true
  jwt:
    oidc:
      issuer: "https://issuer.example"
    matchClaims:
      groups: "^(example:observability-mcp:reader)$"
      aud: "^(example-mcp-reader)$"
    defaultVMAccessClaim:
      metricsExtraFilters:
        - '{k8s_cluster_name="example-cluster"}'
      logsExtraStreamFilters:
        - _stream:{"k8s.cluster.name"="example-cluster"}
  load_balancing_policy: first_available
  retry_status_codes: 
    - 500
    - 502
    - 503
  targetRefs:
    - static:
        url: "http://vmsingle-observability-stack-victoria-metrics-k8s-stack.default.svc:8428"
      paths:
        - /prometheus/api/v1/query
        - /prometheus/api/v1/query_range
        - /prometheus/api/v1/series
        - /prometheus/api/v1/labels
        - /prometheus/api/v1/label/[^/]+/values
        - /prometheus/api/v1/status/tsdb
        - /prometheus/api/v1/status/buildinfo
        - /prometheus/api/v1/rules
        - /prometheus/api/v1/query_exemplars
        - /prometheus/api/v1/format_query
        - /prometheus/vmui.*
      query_args:
        - name: extra_filters
          values:
            - "{{.MetricsExtraFilters}}"
        - name: extra_filters[]
          values:
            - "{{.MetricsExtraFilters}}"
      targetRefBasicAuth:
        username:
          name: "observability-store-credentials"
          key: "username"
        password:
          name: "observability-store-credentials"
          key: "password"
    - static:
        url: "http://vmalert-observability-stack-metrics.default.svc:8080"
      paths:
        - /prometheus/vmalert/api/v1/alerts
        - /prometheus/vmalert/api/v1/rules
      drop_src_path_prefix_parts: 1

