# expect: write whole seconds, minutes or hours
# A TTL Go's duration parser would accept differently from this chart.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    securityPolicy:
      targetRefs:
      - kind: HTTPRoute
        name: observability-read
    networkPolicy:
      gatewayFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: envoy
    tokenTTL: 1d
  identities:
  - groups:
    - example:example-app:deployer
    reach:
      clusters:
      - cluster: cluster-a
        namespaces:
        - example-app
victoria-traces-single:
  enabled: false
