# Source: observability-stack/templates/vmalertmanager.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: observability-stack
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
spec:
  replicaCount: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 64Mi
  selectAllByDefault: false
  disableSelfServiceScrape: true
  volumes:
    - name: notifications-telegram
      secret:
        secretName: "example-telegram-bot"
    - name: notifications-telegram-chat
      secret:
        secretName: "example-telegram-bot"
  volumeMounts:
    - name: notifications-telegram
      mountPath: /etc/alertmanager/notifications-telegram
      readOnly: true
    - name: notifications-telegram-chat
      mountPath: /etc/alertmanager/notifications-telegram-chat
      readOnly: true
  configRawYaml: |
    route:
      # `notifications-none` is a receiver with no configs: Alertmanager
      # accepts that as a legitimate "do not send" target. It is the root
      # receiver and the catch-all for a severity this chart's routing
      # tree does not know (there is deliberately no `info` route — see
      # docs/notifications.md), never a route somebody forgot to write.
      receiver: notifications-none
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # No deadman receiver, and a catch-all that would otherwise take
        # the always-firing heartbeat every repeat_interval.
        - receiver: notifications-none
          matchers:
            - alertname = "Watchdog"
        # notifications.drop: reaches nobody, by the estate's decision.
        - match:
            alertname: InfoInhibitor
          receiver: notifications-none
        - match: {}
          receiver: telegram-chatfile
          continue: true
          routes:
            - match:
                severity: critical
              receiver: telegram-chatfile
            - match:
                severity: warning
              receiver: telegram-chatfile-7
    receivers:
      - name: notifications-none
      - name: telegram-chatfile
        telegram_configs:
