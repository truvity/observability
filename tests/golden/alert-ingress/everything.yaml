# Source: alert-ingress/templates/deployment.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-ingress-cloud-events
  labels:
    app.kubernetes.io/name: cloud-events
    app.kubernetes.io/instance: alert-ingress
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    alertmanager:
      url: "https://vmalertmanager.example.internal:9093"
    topics:
      - <the security-alerts topic ARN>
      - <the budgets topic ARN>
    mappings:
      - alert:
          alertname: CloudSecurityFinding
          annotations:
            runbook: cloud-security-finding
            summary: '{{ .detail.title }}'
          labels:
            account: '{{ .account }}'
            finding_id: '{{ .detail.id }}'
            finding_type: '{{ .detail.type }}'
            k8s_cluster_name: cloud
            region: '{{ .region }}'
            source: guardduty
          severity: '{{ if atLeast .detail.severity 7 }}critical{{ else }}warning{{ end
            }}'
        match:
          detail-type: GuardDuty Finding
        name: guardduty
      - alert:
          alertname: RootConsoleLogin
          labels:
            k8s_cluster_name: cloud
            source: cloudtrail
          severity: critical
        match:
          detail-type: AWS Console Sign In via CloudTrail
          detail.userIdentity.type: Root
        name: root-login
      - alert:
          alertname: BudgetThresholdCrossed
          annotations:
            summary: '{{ ._sns.Subject }}'
          labels:
            k8s_cluster_name: cloud
            source: budgets
          severity: warning
        match:
          _sns.TopicArn: arn:aws:sns:eu-west-1:111122223333:example-budgets
        matchRegex:
          _sns.Message: 'Budget Name: '
        name: budget
    heartbeat:
      match:
        source: alert-ingress-heartbeat
      interval: "10m"
    resolveAfter: "2h"

