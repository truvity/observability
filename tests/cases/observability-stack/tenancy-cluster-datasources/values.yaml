# Per-cluster datasource users: one bearer token per cluster the shared
# Grafana shows, the cluster forced on the metrics and the logs route.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true
  clusterDatasources:
    - cluster: example-a
      tokenSecret: {name: example-a-datasource-token, key: token}
    - cluster: example-b
      tokenSecret: {name: example-b-datasource-token, key: token}

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
