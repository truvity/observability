{{- /*
Refusals first: a chart that renders nothing, or renders a rule whose
expression names a metric nobody exports, is worse than one that fails —
it reports success and then never fires. Both are caught here, at render
time, with a fixture under tests/invalid for each.
*/ -}}

{{- $enabled := list -}}
{{- range $name, $group := .Values.groups -}}
{{- if $group.enabled -}}{{- $enabled = append $enabled $name -}}{{- end -}}
{{- end -}}
{{- if not $enabled -}}
{{- fail "platform-alerts: every group is disabled, so this release would render no rules at all. Enable at least one group, or do not install the chart." -}}
{{- end -}}

{{- $storeGroups := include "platform-alerts.storeGroups" . -}}
{{- if and $storeGroups (not .Values.stores) -}}
{{- fail (printf "platform-alerts: groups %s watch the stores' own counters, but `stores` is empty. Name the counters your stores export (see values.yaml); a guessed metric name is how a rule silently never fires." $storeGroups) -}}
{{- end -}}

{{- if .Values.groups.writePath.enabled -}}
{{- range .Values.stores -}}
{{- if not .rowsMetric -}}
{{- fail (printf "platform-alerts: store %q has no `rowsMetric`, so the write-path deadman cannot watch it. Every store the deadman covers must name its rows counter." .name) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- $ns := .Values.namespaceSelector -}}
{{- /*
The cluster label, as a prefix for every `on (...)` / `by (...)` list below.
One metrics store can hold several clusters' series, told apart only by
this label, and two clusters can share a namespace, a Job name or a PVC
name. A join or aggregation that leaves it out matches series from both:
`on (...)` with `group_left` fails the whole query (duplicate series, HTTP
422 from vmalert, so the rule is dead and says nothing), and `and` /
`unless` / `max by` silently pair or merge across clusters. Where the label
is absent on both sides (a single-cluster store) it matches on empty, so
the rules are unchanged there. Empty `clusterLabel` renders the previous
expressions byte for byte.
*/ -}}
{{- $c := "" -}}
{{- if .Values.clusterLabel -}}{{- $c = printf "%s, " .Values.clusterLabel -}}{{- end -}}
{{- /*
`ownerLabel` (opt-in, empty renders the previous expressions byte for
byte): an aggregation keeps only the labels in its `by (...)`, so a rule
that aggregates drops the `owner` label the alert would be routed on.
`$b` is `$c` plus that label, and is used in the aggregating `by (...)`
lists only; the `on (...)` matches keep `$c`, because both sides of a join
carry the same owner (it is derived from the same namespace) and matching
on it would add nothing but a way to fail.
*/ -}}
{{- $b := $c -}}
{{- if .Values.ownerLabel -}}{{- $b = printf "%s%s, " $c .Values.ownerLabel -}}{{- end -}}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "platform-alerts.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.ruleLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- if .Values.groups.backups.enabled }}
    {{- $g := .Values.groups.backups }}
    {{- /*
    A SUSPENDED CronJob is skipped by both rules below
    (`ignoreSuspended`, default true since 0.11.0): suspending one is a
    decision someone wrote into its spec, and before this both rules
    fired on it for as long as it stayed suspended — the age of its last
    success grows forever, and its last failed Job is its newest forever.

    `unless ... == 1`, never `and ... == 0`: if kube_cronjob_spec_suspend
    is absent (an older kube-state-metrics, a trimmed collector list) the
    rules behave exactly as before instead of going silent. A rule that
    stops firing because a series is missing is the failure this chart
    exists to prevent.
    */}}
    {{- $ignoreSuspended := ternary $g.ignoreSuspended true (hasKey $g "ignoreSuspended") }}
    - name: platform-alerts.backups
      interval: {{ .Values.interval }}
      rules:
        # A CronJob that has not SUCCEEDED within its schedule plus slack.
        # This is the rule that matters: a CronJob which stops being
        # scheduled at all never produces a failed Job, so a rule watching
        # failures reports healthy while nothing runs. Measured healthy
        # range for a daily job: age resets below 24h on every run.
        - alert: CronJobNotSucceeding
          expr: >-
            time() - max by ({{ $b }}namespace, cronjob) (
              kube_cronjob_status_last_successful_time{namespace=~"{{ $ns }}"}
            ) > {{ $g.maxSuccessAge }}
            {{- if $ignoreSuspended }}
            unless on ({{ $c }}namespace, cronjob)
              kube_cronjob_spec_suspend{namespace=~"{{ $ns }}"} == 1
            {{- end }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "CronJob {{`{{ $labels.namespace }}`}}/{{`{{ $labels.cronjob }}`}} has not succeeded within {{ $g.maxSuccessAge }}"
            description: >-
              No successful run in {{ $g.maxSuccessAge }}. A job that has stopped being
              scheduled produces no failures at all, so this is the only rule that
              can see it. Check that the CronJob exists, is not suspended, and that
              its last Job completed.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "CronJobNotSucceeding")) }}{{ . | nindent 12 }}{{- end }}
        # A Job that failed outright — but only the NEWEST Job of each
        # CronJob. `failedJobsHistoryLimit` keeps failed Job objects
        # around long after a later run of the same CronJob has
        # succeeded, and `kube_job_status_failed` never expires that
        # memory on its own: reading it directly fires forever on a
        # failure a later run already fixed. "Newest" is decided by
        # `kube_job_created` — every Job object carries it from the
        # instant it exists, unlike `kube_job_status_start_time`, which
        # stays unset until a pod actually runs and so cannot outrank an
        # older failure while the new run is merely pending. See
        # docs/safety.md.
        #
        # Scoped to Jobs owned by a CronJob
        # (`kube_job_owner{owner_kind="CronJob"}`): a standalone Job has
        # no schedule and so no later run to supersede it, and this
        # rule's whole intent — see its name — is backup CronJobs. A
        # standalone Job that fails no longer raises THIS alert.
        - alert: BackupJobFailed
          expr: >-
            WITH (
              cronjob_jobs = (
                kube_job_created{namespace=~"{{ $ns }}"}
                * on ({{ $c }}namespace, job_name) group_left(owner_name)
                kube_job_owner{namespace=~"{{ $ns }}", owner_kind="CronJob"}
              ),
              newest_per_cronjob = max by ({{ $c }}namespace, owner_name) (cronjob_jobs)
              {{- if $ignoreSuspended }},
              suspended_cronjobs = label_replace(
                kube_cronjob_spec_suspend{namespace=~"{{ $ns }}"} == 1,
                "owner_name", "$1", "cronjob", "(.+)"
              )
              {{- end }}
            )
            max by ({{ $b }}namespace, job_name) (
              kube_job_status_failed{namespace=~"{{ $ns }}"}
              and on ({{ $c }}namespace, job_name) (
                cronjob_jobs == on ({{ $c }}namespace, owner_name) group_left() newest_per_cronjob
                {{- if $ignoreSuspended }}
                unless on ({{ $c }}namespace, owner_name) suspended_cronjobs
                {{- end }}
              )
            ) > 0
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.failedSeverity) | nindent 12 }}
          annotations:
            summary: "Job {{`{{ $labels.namespace }}`}}/{{`{{ $labels.job_name }}`}} failed"
            description: >-
              The Job reported a failed pod. If it is a backup, treat the last
              successful run as the real recovery point until this is resolved.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "BackupJobFailed")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.writePath.enabled }}
    {{- $g := .Values.groups.writePath }}
    - name: platform-alerts.write-path
      interval: {{ .Values.interval }}
      rules:
        {{- range $store := .Values.stores }}
        # The write-path deadman for {{ $store.name }}.
        #
        # An alert on a store's read-only FLAG cannot fire in its own
        # headline case: that sample is written INTO the store that is
        # refusing writes. Reads keep working when writes do not, so
        # watching the rows counter stop is the only rule that sees it.
        #
        # `or vector(0)` makes the rule fire for both shapes of the
        # failure: the counter stops moving, and the counter disappears
        # because the store is gone.
        - alert: WritePathDead
          expr: >-
            (sum(rate({{ $store.rowsMetric }}[{{ $g.window }}])) or vector(0)) == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
            store: {{ $store.name | quote }}
          annotations:
            summary: "No rows written to the {{ $store.name }} store for {{ $g.for }}"
            description: >-
              {{ $store.rowsMetric }} has not advanced in {{ $g.for }}. The store may be
              read-only, out of disk, or gone; reads can keep working throughout, so
              nothing else will report this.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "WritePathDead")) }}{{ . | nindent 12 }}{{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.groups.volumes.enabled }}
    {{- $g := .Values.groups.volumes }}
    - name: platform-alerts.volumes
      interval: {{ .Values.interval }}
      rules:
        # A mounted filesystem far smaller than the claim that satisfied it
        # cannot legitimately happen: it means the real volume is not
        # mounted and the pod is writing to the node's root filesystem
        # while reporting 1/1 Running. Measured healthy range is 0.95-0.99
        # of the claim (filesystem overhead); the threshold sits well below
        # it so overhead can never reach it and a wrong mount always does.
        - alert: VolumeSmallerThanClaimed
          expr: >-
            kubelet_volume_stats_capacity_bytes{namespace=~"{{ $ns }}"}
            / on ({{ $c }}namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~"{{ $ns }}"}
            < {{ $g.minCapacityRatio }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "PVC {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim }}`}} is mounted on a filesystem far smaller than it claimed"
            description: >-
              The mounted filesystem is under {{ $g.minCapacityRatio }} of the claim. The
              volume is probably not mounted at all and the pod is writing to the
              node's root filesystem. Data written since it started is not on the
              volume.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "VolumeSmallerThanClaimed")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.storeLimits.enabled }}
    {{- $g := .Values.groups.storeLimits }}
    {{- $rules := list }}
    {{- range $store := .Values.stores }}
    {{- if and $store.freeSpaceMetric $store.freeSpaceLimitMetric }}
    {{- $rules = append $rules $store }}
    {{- end }}
    {{- end }}
    {{- if $rules }}
    - name: platform-alerts.store-limits
      interval: {{ .Values.interval }}
      rules:
        {{- range $store := $rules }}
        # Read from the store's OWN exported limit, never a constant
        # written here: a guessed constant is how a rule never fires or
        # always does. Fires while there is still headroom to act.
        - alert: StoreApproachingReadOnly
          expr: >-
            {{ $store.freeSpaceMetric }} / {{ $store.freeSpaceLimitMetric }} < {{ $g.headroomFactor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
            store: {{ $store.name | quote }}
          annotations:
            summary: "The {{ $store.name }} store is approaching its read-only limit"
            description: >-
              Free space is under {{ $g.headroomFactor }}x the limit at which this store stops
              accepting writes. It is still serving reads and will keep doing so
              after it stops writing, so nothing else will report this.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "StoreApproachingReadOnly")) }}{{ . | nindent 12 }}{{- end }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.groups.kargo.enabled }}
    {{- $g := .Values.groups.kargo }}
    - name: platform-alerts.kargo
      interval: {{ .Values.interval }}
      rules:
        # A Kargo Stage stuck on a promotion error.
        #
        # `kargo_stage_condition` is a gauge kube-state-metrics' own
        # customResourceState feature exports from the Stage's own
        # `.status.conditions`: 1 while the condition named by `type` and
        # `reason` is True, 0 while it is False or Unknown. This chart
        # does not configure that feature — see docs/kube-state-metrics.md
        # for the config that produces it.
        - alert: KargoStagePromotionErrored
          expr: >-
            kargo_stage_condition{type="Ready", reason="LastPromotionErrored"} == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "Kargo Stage {{`{{ $labels.namespace }}`}}/{{`{{ $labels.stage }}`}} has not recovered from a promotion error"
            description: >-
              The Stage's Ready condition has read LastPromotionErrored for {{ $g.for }}.
              Re-promote the Freight from the Kargo UI or CLI once the underlying
              failure is fixed; the Stage will not retry itself.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoStagePromotionErrored")) }}{{ . | nindent 12 }}{{- end }}
        # The same failure, corroborated by the Promotion object itself.
        #
        # `kargo_promotion_phase` is a StateSet over Pending, Running,
        # Succeeded, Failed, Errored and Aborted: 1 on the Promotion's
        # current phase, 0 on every other. Joining on (namespace, stage)
        # against the Stage condition above is what tells an Errored
        # promotion whose Stage has already recovered (a retry that
        # succeeded since) apart from one still stuck.
        - alert: KargoPromotionErrored
          expr: >-
            kargo_promotion_phase{phase="Errored"} == 1
            and on ({{ $c }}namespace, stage) kargo_stage_condition{type="Ready", reason="LastPromotionErrored"} == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "Kargo Promotion {{`{{ $labels.namespace }}`}}/{{`{{ $labels.promotion }}`}} errored and its Stage has not recovered"
            description: >-
              The Promotion has sat in the Errored phase for {{ $g.for }} and its
              Stage still reads LastPromotionErrored. Re-promote the Freight from
              the Kargo UI or CLI once the underlying failure is fixed.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoPromotionErrored")) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for the two rules above.
        #
        # Same shape as the write-path deadman: a rule that reads
        # `kargo_stage_condition` or `kargo_promotion_phase` cannot itself
        # notice those series going away, because it evaluates to nothing
        # rather than to a value it could compare. Either kube-state-metrics'
        # `customResourceState` config for Kargo's CRDs was never applied,
        # was edited away, or the whole scrape went dark — every case the
        # two rules above go silent right along with it.
        - alert: KargoStateMetricsAbsent
          expr: >-
            absent(kargo_stage_condition{type="Ready"}) or absent(kargo_promotion_phase)
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.absentSeverity) | nindent 12 }}
          annotations:
            summary: "kube-state-metrics has not exported Kargo's own Stage/Promotion metrics for {{ $g.absentFor }}"
            description: >-
              Neither kargo_stage_condition{type="Ready"} nor
              kargo_promotion_phase has been seen in {{ $g.absentFor }}, so
              KargoStagePromotionErrored and KargoPromotionErrored cannot fire
              even if a promotion is stuck. Check kube-state-metrics'
              customResourceState config against docs/kube-state-metrics.md, and
              that the scrape itself is still up.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoStateMetricsAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.probes.enabled }}
    {{- $g := .Values.groups.probes }}
    - name: platform-alerts.probes
      interval: {{ .Values.interval }}
      rules:
        # An HTTP probe that is not answering 2xx from this cluster.
        #
        # `probe_success` is the blackbox exporter's own series for a probe
        # of `observability-emitters` (`metrics.scrape.probes`): 1 while the
        # URL answers as the module accepts (any 2xx by default), 0 for a
        # refused connection, a TLS failure or any other status. `max by
        # (probe)` so a probe that resolves to several targets is down only
        # when all are.
        - alert: {{ $g.alertName }}
          expr: >-
            max by ({{ $b }}probe) (probe_success{probe=~"{{ $g.probe }}"}) == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            {{- if $g.summary }}
            summary: {{ $g.summary | quote }}
            {{- else }}
            summary: "HTTP probe {{`{{ $labels.probe }}`}} has not answered 2xx for {{ $g.for }}"
            {{- end }}
            {{- if $g.description }}
            description: {{ $g.description | quote }}
            {{- else }}
            description: >-
              The probe {{`{{ $labels.probe }}`}} (charts/observability-emitters
              `metrics.scrape.probes`) has read probe_success == 0 for {{ $g.for }}: the URL
              refused the connection, failed TLS or answered something the
              probe's module does not accept (any 2xx, by default) from this
              cluster's own egress.
            {{- end }}
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" $g.alertName)) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for the rule above.
        #
        # `probe_success == 0` evaluates to nothing, not to a value, when
        # the series does not exist: a probe whose series never reached the
        # store (the exporter down, the VMProbe not selected, the series
        # filed under labels the store's readers do not see) makes
        # {{ $g.alertName }} silent while the probe is not working at all.
        # `absent()` is true exactly then. With the default selector it
        # fires only when NO probe reports; name a probe (`probe`) to watch
        # one, which is what a single-probe estate wants.
        - alert: {{ $g.alertName }}Absent
          expr: >-
            absent(probe_success{probe=~"{{ $g.probe }}"})
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" (default $g.severity $g.absentSeverity)) | nindent 12 }}
          annotations:
            summary: "No probe_success series for {{ $g.probe }} for {{ $g.absentFor }}"
            description: >-
              probe_success{probe=~"{{ $g.probe }}"} has not been seen in
              {{ $g.absentFor }}, so {{ $g.alertName }} cannot fire even if the
              URL is down. Check the blackbox exporter and the VMProbe
              (charts/observability-emitters `metrics.scrape.probes`), that the
              agent's scrape of the probe is up, and that its series carry the
              cluster's tenancy labels.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" (printf "%sAbsent" $g.alertName))) }}{{ . | nindent 12 }}{{- end }}
        {{- if $g.certExpiry.enabled }}
        # The TLS certificate a probe saw expires within `withinDays`.
        # `probe_ssl_earliest_cert_expiry` is a Unix time and exists only
        # for an https target; the earliest certificate of the chain.
        - alert: {{ $g.certExpiry.alertName }}
          expr: >-
            min by ({{ $b }}probe) (probe_ssl_earliest_cert_expiry{probe=~"{{ $g.probe }}"}) - time() < {{ mul (int $g.certExpiry.withinDays) 86400 }}
          for: {{ $g.certExpiry.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.certExpiry.severity) | nindent 12 }}
          annotations:
            summary: "The TLS certificate seen by probe {{`{{ $labels.probe }}`}} expires within {{ $g.certExpiry.withinDays }} days"
            description: >-
              The earliest certificate in the chain the probe
              {{`{{ $labels.probe }}`}} (charts/observability-emitters
              `metrics.scrape.probes`) was shown expires in less than
              {{ $g.certExpiry.withinDays }} days.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" $g.certExpiry.alertName)) }}{{ . | nindent 12 }}{{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.groups.pendingPods.enabled }}
    {{- $g := .Values.groups.pendingPods }}
    {{- $pns := default $ns $g.namespaceSelector }}
    - name: platform-alerts.pending-pods
      interval: {{ .Values.interval }}
      rules:
        # A pod the scheduler has declared unschedulable for `for`.
        #
        # `kube_pod_status_unschedulable` is 1 while the pod's PodScheduled
        # condition is False with reason Unschedulable and has no series
        # otherwise, so `== 1` only states what the series already means
        # (it keeps the rule right if a kube-state-metrics version emits 0
        # instead of omitting). On a cluster that adds nodes on demand this
        # is the signal that provisioning did not happen: the pod is what
        # the provisioner reacts to, and it is still waiting.
        - alert: PodUnschedulable
          expr: >-
            max by ({{ $b }}namespace, pod) (
              kube_pod_status_unschedulable{namespace=~"{{ $pns }}"} == 1
            )
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" (ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")))) | nindent 12 }}
          annotations:
            summary: "Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} has been unschedulable for {{ $g.for }}"
            description: >-
              The scheduler has not been able to place this pod for {{ $g.for }}.
              On a cluster that provisions nodes on demand that means no node was
              added for it (a provisioning failure, a quota or capacity limit, or
              a request no node type can satisfy); on any cluster it can also be
              an affinity, taint or quota the pod can never meet. The pod's
              events name the scheduler's reason.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "PodUnschedulable")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.nodeClaims.enabled }}
    {{- $g := .Values.groups.nodeClaims }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    - name: platform-alerts.node-claims
      interval: {{ .Values.interval }}
      rules:
        # A NodeClaim whose Launched, Registered or Initialized condition is
        # not True for `for`.
        #
        # `nodeclaim_status_condition` is a gauge kube-state-metrics'
        # customResourceState exports from each NodeClaim's
        # `.status.conditions`: 1 while the condition is True, 0 while it is
        # False or Unknown. A claim that is still being created has no
        # condition yet and so no series: the rule sees it only once
        # Karpenter has written the condition, which is when it starts to
        # count as not-True. Ready is left out on purpose: it is the
        # conjunction of these three, so it would only repeat them.
        - alert: NodeClaimNotReady
          expr: >-
            max by ({{ $b }}nodeclaim, nodepool, type) (
              nodeclaim_status_condition{type=~"Launched|Registered|Initialized"} == 0
            )
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NodeClaim {{`{{ $labels.nodeclaim }}`}} ({{`{{ $labels.nodepool }}`}}) has not reached {{`{{ $labels.type }}`}} for {{ $g.for }}"
            description: >-
              Karpenter created this NodeClaim but its {{`{{ $labels.type }}`}}
              condition has not become True in {{ $g.for }}. Launched means the
              instance was created, Registered that it joined the cluster as a
              node, Initialized that it is ready for pods. Karpenter deletes a
              claim that has not registered after 15 minutes and tries again, so
              an alert that clears by itself is a retry. `kubectl describe
              nodeclaim` shows the condition's reason and message.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NodeClaimNotReady")) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for the rule above: the series not being exported at
        # all (the preset never applied, or the scrape is dark) reads as
        # healthy to a rule that compares its values.
        - alert: NodeClaimMetricsAbsent
          expr: >-
            absent(nodeclaim_status_condition{type="Launched"})
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.absentSeverity) | nindent 12 }}
          annotations:
            summary: "kube-state-metrics has not exported NodeClaim conditions for {{ $g.absentFor }}"
            description: >-
              nodeclaim_status_condition{type="Launched"} has not been seen in
              {{ $g.absentFor }}, so NodeClaimNotReady cannot fire even if a
              node is failing to come up. Check that
              `kubeStateMetrics.customResources.nodeClaims` is on in
              observability-emitters and that the scrape is up. On a cluster
              that can have no NodeClaims at all this alert is expected.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NodeClaimMetricsAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.nats.enabled }}
    {{- $g := .Values.groups.nats }}
    {{- $job := $g.job }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    - name: platform-alerts.nats
      interval: {{ .Values.interval }}
      rules:
        # A broker whose exporter is not being scraped.
        #
        # `up` is the scrape's own series for the PodMonitor job the NATS
        # chart ships (`{{ $job }}`): 0 when the prometheus-nats-exporter
        # sidecar does not answer, which is a broker down, a broker not
        # ready, or the sidecar itself dead. `max by (pod)` so a pod whose
        # address changed on restart reads as one broker, not two.
        - alert: NATSBrokerDown
          expr: >-
            max by ({{ $b }}pod) (up{job="{{ $job }}"}) == 0
          for: {{ $g.brokerDownFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} has not answered its metrics scrape for {{ $g.brokerDownFor }}"
            description: >-
              The exporter of NATS broker {{`{{ $labels.pod }}`}} (job {{ $job }}) has
              been down for {{ $g.brokerDownFor }}. With three brokers the cluster and JetStream
              keep a quorum through one loss, but not two. Check
              `kubectl -n <namespace> get pods` and the pod's events and logs.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSBrokerDown")) }}{{ . | nindent 12 }}{{- end }}
        # A broker that sees fewer cluster routes than its peers need.
        #
        # `nats_varz_routes` is the number of route connections the broker
        # holds. Every peer is reached over `cluster.pool_size` pooled
        # routes (`nats_varz_cluster_pool_size`, 3 by default), plus one
        # per pinned account, so a healthy 3-broker cluster reads 8, not 2.
        # The floor is therefore peers x pool size, with peers read from the
        # JetStream meta group size (`nats_varz_jetstream_meta_cluster_size`
        # less this broker): a peer that is wholly unreachable drops the
        # count well below it, while a single re-dialled route does not.
        - alert: NATSClusterRoutesMissing
          expr: >-
            max by ({{ $b }}pod) (nats_varz_routes{job="{{ $job }}"})
            <
            (
              max by ({{ $b }}pod) (nats_varz_jetstream_meta_cluster_size{job="{{ $job }}"} - 1)
              *
              max by ({{ $b }}pod) (nats_varz_cluster_pool_size{job="{{ $job }}"})
            )
          for: {{ $g.routesFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} sees too few cluster routes ({{`{{ $value }}`}})"
            description: >-
              Broker {{`{{ $labels.pod }}`}} holds fewer route connections than one
              pooled set per peer, for {{ $g.routesFor }}: it has lost a
              peer (a restart, a NetworkPolicy, a DNS or node problem), so
              the cluster is partitioned or degraded. Check the other
              brokers' own routes and `nats server report connections`.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSClusterRoutesMissing")) }}{{ . | nindent 12 }}{{- end }}
        # JetStream's meta group has no leader.
        #
        # `meta_leader` is a label of the jsz-derived series (the leader the
        # reporting broker sees, empty while there is none) and
        # `nats_varz_jetstream_meta_leader` carries the same name in its
        # `value` label. Without a meta leader no stream or consumer can be
        # created or changed, and JetStream API calls fail.
        - alert: NATSJetStreamNoMetaLeader
          expr: >-
            max by ({{ $b }}pod) (nats_server_total_streams{job="{{ $job }}", meta_leader=""})
            or
            max by ({{ $b }}pod) (nats_varz_jetstream_meta_leader{job="{{ $job }}", value=""})
          for: {{ $g.leaderFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS JetStream has no meta leader, as seen by {{`{{ $labels.pod }}`}}"
            description: >-
              Broker {{`{{ $labels.pod }}`}} reports no JetStream meta leader for
              {{ $g.leaderFor }}. The meta group needs a majority of brokers
              to elect one: check how many brokers are up and routed
              (NATSBrokerDown, NATSClusterRoutesMissing) and the brokers'
              logs for raft errors.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSJetStreamNoMetaLeader")) }}{{ . | nindent 12 }}{{- end }}
        # A stream with no leader.
        #
        # Every `nats_stream_*` series carries `stream_leader`, the leader
        # the reporting broker sees; empty while the stream's raft group
        # has none. A stream without a leader accepts no publishes and
        # serves no consumers.
        - alert: NATSStreamNoLeader
          expr: >-
            max by ({{ $b }}account, stream_name) (nats_stream_total_messages{job="{{ $job }}", stream_leader=""})
          for: {{ $g.leaderFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS stream {{`{{ $labels.account }}`}}/{{`{{ $labels.stream_name }}`}} has no leader"
            description: >-
              The stream {{`{{ $labels.stream_name }}`}} of account {{`{{ $labels.account }}`}}
              has had no leader for {{ $g.leaderFor }}, so it takes no publishes
              and serves no consumers. Usually a majority of its replicas is
              down or unrouted; `nats stream info` and the brokers' logs say
              which.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSStreamNoLeader")) }}{{ . | nindent 12 }}{{- end }}
        # A consumer whose backlog has not drained for the whole window and
        # has grown over it.
        #
        # `nats_consumer_num_pending` is the messages not yet delivered to
        # the consumer; every broker holding a replica reports it, hence the
        # `max by`. The backlog must have stayed above `minPending` for the
        # entire window (so a burst that drained does not count) and be
        # higher at the end than at the start.
        - alert: NATSConsumerBacklogGrowing
          expr: >-
            max by ({{ $b }}account, stream_name, consumer_name) (
              (delta(nats_consumer_num_pending{job="{{ $job }}"}[{{ $g.backlog.window }}]) > 0)
              and
              (min_over_time(nats_consumer_num_pending{job="{{ $job }}"}[{{ $g.backlog.window }}]) > {{ $g.backlog.minPending }})
            )
          for: {{ $g.backlog.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS consumer {{`{{ $labels.stream_name }}`}}/{{`{{ $labels.consumer_name }}`}} backlog keeps growing"
            description: >-
              The backlog of consumer {{`{{ $labels.consumer_name }}`}} on stream
              {{`{{ $labels.stream_name }}`}} (account {{`{{ $labels.account }}`}}) has stayed
              above {{ $g.backlog.minPending }} messages for {{ $g.backlog.window }} and is larger than at the
              start of that window: the consumer is slower than the
              producers or has stopped. Check the consuming service and
              `nats consumer info`.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSConsumerBacklogGrowing")) }}{{ . | nindent 12 }}{{- end }}
        # Slow consumers: the broker dropped or throttled a client that
        # could not keep up. `nats_varz_slow_consumers` is a cumulative
        # count since the broker started, so only its increase means
        # anything (`increase` also rides out a restart's reset).
        - alert: NATSSlowConsumers
          expr: >-
            max by ({{ $b }}pod) (increase(nats_varz_slow_consumers{job="{{ $job }}"}[{{ $g.slowConsumers.window }}])) > 0
          for: {{ $g.slowConsumers.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} is cutting off slow consumers"
            description: >-
              The slow-consumer count of broker {{`{{ $labels.pod }}`}} rose within the
              last {{ $g.slowConsumers.window }}: a client is not reading
              fast enough and the broker is dropping its messages or its
              connection. `nats server report connections --sort pending`
              names the client.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSSlowConsumers")) }}{{ . | nindent 12 }}{{- end }}
        # JetStream's file store filling up.
        #
        # `nats_varz_jetstream_stats_storage` is the bytes the broker's
        # JetStream holds on disk, `nats_varz_jetstream_config_max_storage`
        # the store size it was configured with (the limit it enforces).
        # A zero limit is filtered out rather than divided by.
        - alert: NATSJetStreamStorageHigh
          expr: >-
            max by ({{ $b }}pod) (nats_varz_jetstream_stats_storage{job="{{ $job }}"})
            /
            (max by ({{ $b }}pod) (nats_varz_jetstream_config_max_storage{job="{{ $job }}"}) > 0)
            > {{ $g.storage.ratio }}
          for: {{ $g.storage.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} JetStream storage is above {{ round (mulf $g.storage.ratio 100) 0 }}%"
            description: >-
              JetStream on broker {{`{{ $labels.pod }}`}} uses more than
              {{ round (mulf $g.storage.ratio 100) 0 }}% of its configured file store for {{ $g.storage.for }}. At the
              limit publishes to streams that do not discard old messages
              are refused. Check stream sizes and retention with `nats
              stream report`, or grow the store.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSJetStreamStorageHigh")) }}{{ . | nindent 12 }}{{- end }}
        # Broker memory near the container's limit.
        #
        # The broker exports no limit of its own (`go_gc_gomemlimit_bytes`
        # is unset), so it is the container's working set (cadvisor) over
        # the pod's memory limit (kube-state-metrics). A container without
        # a limit has no `kube_pod_container_resource_limits` series and so
        # is never alerted on.
        - alert: NATSMemoryNearLimit
          expr: >-
            max by ({{ $b }}pod) (container_memory_working_set_bytes{namespace="{{ $g.memory.namespace }}", container="{{ $g.memory.container }}"})
            /
            max by ({{ $b }}pod) (kube_pod_container_resource_limits{namespace="{{ $g.memory.namespace }}", container="{{ $g.memory.container }}", resource="memory"})
            > {{ $g.memory.ratio }}
          for: {{ $g.memory.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} memory is above {{ round (mulf $g.memory.ratio 100) 0 }}% of its limit"
            description: >-
              The working set of broker {{`{{ $labels.pod }}`}} has been above
              {{ round (mulf $g.memory.ratio 100) 0 }}% of its memory limit for {{ $g.memory.for }}; at the limit the
              kernel kills it. Look for a connection or subscription surge
              (`nats server report connections`) or raise the limit.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSMemoryNearLimit")) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for every rule above: no NATS exporter series at all
        # (the PodMonitor gone, the scrape blocked, the chart not installed)
        # reads as healthy to rules that compare values.
        - alert: NATSMetricsAbsent
          expr: >-
            absent(up{job="{{ $job }}"})
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity) | nindent 12 }}
          annotations:
            summary: "No NATS exporter has been scraped for {{ $g.absentFor }}"
            description: >-
              up{job="{{ $job }}"} has not been seen in {{ $g.absentFor }}, so none of the
              NATS rules can fire. Check that the NATS chart's PodMonitor is
              applied and the brokers' metrics port is reachable from the
              agent.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSMetricsAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
