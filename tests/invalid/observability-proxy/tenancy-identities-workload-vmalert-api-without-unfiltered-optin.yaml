# expect: `vmalertAPI: true` but `tenancy.allowUnfilteredAlertReads` is not
# vmalertAPI without acknowledging the routes are unscoped.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: example-app
      groups: [example:example-app]
      workload: {routes: [metrics], vmalertAPI: true}
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]


victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
