# expect: `selectAllByDefault: false`, which — with no selectors set — means it selects NO scrape objects at all
# With selectAllByDefault false and no selectors set, the agent selects
# NO scrape objects — not a narrower set, none. A component whose
# PodMonitor is ignored looks exactly like a component with nothing
# wrong.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
  spec:
    selectAllByDefault: false
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
    streamFields:
    - kubernetes.container_name
    - kubernetes.pod_name
    - kubernetes.pod_namespace
    - k8s.cluster.name
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
