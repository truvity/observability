# expect: `backup.credentialsSecret` is also set
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# `ambient` exists so no static key is ever mounted into a backup job —
# leaving `credentialsSecret` set alongside it is the exact silent trap
# the refusal exists to catch.
backup:
  enabled: true
  destination: s3://example-backups/observability
  credentialsSecret: example-backup-credentials
  auth:
    mode: ambient

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
