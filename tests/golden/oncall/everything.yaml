# Source: oncall/templates/relay.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-telegram-relay
  labels:
    app.kubernetes.io/name: oncall
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oncall
    app.kubernetes.io/component: telegram-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oncall
      app.kubernetes.io/instance: oncall
      app.kubernetes.io/component: telegram-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oncall
        app.kubernetes.io/instance: oncall
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: oncall
        app.kubernetes.io/component: telegram-relay
    spec:
      serviceAccountName: oncall-telegram-relay
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telegram-relay
          image: "ghcr.io/truvity/observability/telegram-relay:1.2.3"
          imagePullPolicy: IfNotPresent
          args:
            - "--listen=:8080"
            - "--admin-listen=:9090"
            - "--bot-token-file=/etc/telegram-relay/bot-token"
            - "--shared-secret-file=/etc/telegram-relay/shared-secret"
            - "--recipients-file=/etc/telegram-relay/recipients.yaml"
            - "--telegram-api-url=https://api.telegram.org"
            - "--send-timeout=2s"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # Not in the Service: nothing routed to the webhook port can
            # reach /metrics.
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          # Ready only while the three mounted files read and parse: a
          # Secret that never arrived keeps the pod out of the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: secret
              mountPath: /etc/telegram-relay
              readOnly: true
      volumes:
        - name: secret
          secret:
            secretName: "oncall-telegram-relay"
            defaultMode: 0440

