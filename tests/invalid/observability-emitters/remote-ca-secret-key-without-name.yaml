# expect: `remote.caSecret.key` is set but `remote.caSecret.name` is empty
global:
  cluster:
    dnsDomain: cluster.example.
tenancy:
  cluster: example-cluster
  environment: development
logs:
  enabled: false
otlp:
  enabled: false
remote:
  url: https://observability-write.example.private
  tokenSecret: {name: example-write-token, key: token}
  caSecret: {key: ca.crt}
  signals: [metrics]
