# expect: role_attribute_strict` false
# Unmapped people would get the default role.
global:
  observabilityGrafana:
    database:
      host: pg:5432
      secretRef: {name: grafana-pg-app}
    oauth:
      clientId: grafana
      clientSecretRef: {name: grafana-client}
      issuer: https://issuer.example.org
      roleAttributePath: '''Editor'''
    rootUrl: https://grafana.example.org
    secretKeyRef: {name: grafana-secret-key}
    stores:
    - {default: true, name: store-a, url: 'https://store-a.example.org'}
grafana:
  grafana.ini:
    auth.generic_oauth: {role_attribute_strict: false}
