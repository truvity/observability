# expect: at '/notifications/telegram': missing property 'botTokenSecret'
# `notifications.telegram` with a chat and no bot token Secret. Refused by
# the schema: a Telegram receiver with nothing to authenticate as cannot
# send, and a token written inline would be a credential in values.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  telegram:
    chatId: -1000000000001
  severities:
    critical: {receiver: telegram}
    warning: {receiver: telegram}
