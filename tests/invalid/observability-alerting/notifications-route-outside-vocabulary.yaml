# expect: may match only on a label in
# A route matching on `tenant`, which no collector this chart's rules
# run against stamps on an alert. The vocabulary is cluster ×
# namespace; a route on anything else matches nothing a rule actually
# carries and pages nobody while looking exactly like a route that
# works.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
  routes:
  - match:
      tenant: example-tenant
    critical: '#alerts-example-tenant'
