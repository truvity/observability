# The Door half of the stack case of the same name (tests/cases/observability-stack/tenancy-authz):
# its values kept to the keys charts/observability-proxy declares, with
# `stackReleaseName` set to the stack's release name, so the render carries the
# names the stack's does.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    securityPolicy:
      targetRefs:
      - kind: HTTPRoute
        name: observability-read
    networkPolicy:
      gatewayFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: example-gateway
        podSelector:
          matchLabels:
            app.kubernetes.io/name: envoy
  principals:
  - name: k8s:viewer
    groups:
    - cluster-a:k8s:viewer
    - cluster-b:k8s:viewer
    grants:
    - cluster: cluster-a
      allNamespaces: true
    - cluster: cluster-b
      allNamespaces: true
  - group: example:example-app:deployer
    grants:
    - cluster: cluster-a
      namespaces:
      - example-app
      - other-app
  - group: cluster-a:example-app:reader
    audience: reader
    routes:
    - metrics
    metricsQueryOnly: true
    grants:
    - cluster: cluster-a
      namespaces:
      - example-app
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
