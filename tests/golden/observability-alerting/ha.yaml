# Source: observability-alerting/templates/selfalerts-ha.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: observability-stack-store-alerts
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - name: observability-stack.stores
      interval: 30s
      rules:
        # StoreMemoryNearLimit. The working set of a store container is
        # the number the kernel's OOM killer reads, and a store killed
        # under its limit restarts with a cold cache; on a pair it also
        # leaves a gap the writers' queues have to refill.
        #
        # Healthy range: under 0.8 of the limit. The
        # stores fill the cache they are allowed, so a working set that
        # stays above it is a limit that is too small.
        - alert: StoreMemoryNearLimit
          expr: >-
            max by (k8s_cluster_name, namespace, pod, container) (container_memory_working_set_bytes{namespace="default", container!="", pod=~"^(vmsingle-observability-stack-victoria-metrics-k8s-stack-.+|observability-stack-victoria-logs-single-server-[0-9]+|observability-stack-vt-single-server-[0-9]+)$"})
            /
            max by (k8s_cluster_name, namespace, pod, container) (kube_pod_container_resource_limits{namespace="default", resource="memory", pod=~"^(vmsingle-observability-stack-victoria-metrics-k8s-stack-.+|observability-stack-victoria-logs-single-server-[0-9]+|observability-stack-vt-single-server-[0-9]+)$"})
            > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "A store container is above 80% of its memory limit"
            description: >-
              {{ $labels.pod }} ({{ $labels.container }}) has been above
              0.8 of its memory limit for 15m.
              Raise the store's memory request and limit (they are equal), or
              look for a query or a cardinality burst that is holding it.
        # MetricStoreReplicaDivergence. The two metrics stores of the
        # pair take the same writes, so over 1h the rows each ingested
        # are the same up to the writers' queue skew. This fires when the
        # ratio of replica "a" to replica "b" leaves 1 +/- 0.25: a
        # tolerance, not an equality. A replica that is down has no series
        # and fires nothing here (that is `up == 0`'s job); a writer that
        # lost one destination, or a replica that dropped rows, does.
        #
        # MEASURE A WEEK FIRST: 0.25 is a conservative starting value, not
        # a measured one. Healthy range: the ratio sits near 1, with
        # excursions while a recovered replica's writers drain their queues.
        - alert: MetricStoreReplicaDivergence
          expr: >-
            abs(
              1 -
              sum by (k8s_cluster_name)(rate(vm_rows_inserted_total{observability_replica="a", type="promremotewrite"}[1h]))
              /
              sum by (k8s_cluster_name)(rate(vm_rows_inserted_total{observability_replica="b", type="promremotewrite"}[1h]))
            ) > 0.25
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The two metrics stores of the pair are ingesting different amounts"
            description: >-
              vm_rows_inserted_total over 1h differs between replica
              "a" and replica "b" by more than 0.25 of the other.
              One of them is not receiving what the writers send it (a lost
              writer destination, a full queue, a store refusing rows) or
              is still catching up after a restart. A recovered replica
              lies until its writers' queues drain: reads stay on the
              primary (`first_available`) meanwhile. docs/high-availability.md.
        # LogStoreReplicaDivergence. The two log stores of the
        # pair take the same writes, so over 1h the rows each ingested
        # are the same up to the writers' queue skew. This fires when the
        # ratio of replica "a" to replica "b" leaves 1 +/- 0.25: a
        # tolerance, not an equality. A replica that is down has no series
        # and fires nothing here (that is `up == 0`'s job); a writer that
        # lost one destination, or a replica that dropped rows, does.
        #
        # MEASURE A WEEK FIRST: 0.25 is a conservative starting value, not
        # a measured one. Healthy range: the ratio sits near 1, with
        # excursions while a recovered replica's writers drain their queues.
        - alert: LogStoreReplicaDivergence
          expr: >-
            abs(
              1 -
              sum by (k8s_cluster_name)(rate(vl_rows_ingested_total{observability_replica="a"}[1h]))
              /
              sum by (k8s_cluster_name)(rate(vl_rows_ingested_total{observability_replica="b"}[1h]))
            ) > 0.25
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The two log stores of the pair are ingesting different amounts"
            description: >-
              vl_rows_ingested_total over 1h differs between replica
              "a" and replica "b" by more than 0.25 of the other.
              One of them is not receiving what the writers send it (a lost
              writer destination, a full queue, a store refusing rows) or
              is still catching up after a restart. A recovered replica
              lies until its writers' queues drain: reads stay on the
              primary (`first_available`) meanwhile. docs/high-availability.md.
        # TraceStoreReplicaDivergence. The two trace stores of the
        # pair take the same writes, so over 1h the rows each ingested
        # are the same up to the writers' queue skew. This fires when the
        # ratio of replica "a" to replica "b" leaves 1 +/- 0.25: a
        # tolerance, not an equality. A replica that is down has no series
        # and fires nothing here (that is `up == 0`'s job); a writer that
        # lost one destination, or a replica that dropped rows, does.
        #
        # MEASURE A WEEK FIRST: 0.25 is a conservative starting value, not
        # a measured one. Healthy range: the ratio sits near 1, with
        # excursions while a recovered replica's writers drain their queues.
        - alert: TraceStoreReplicaDivergence
          expr: >-
            abs(
              1 -
              sum by (k8s_cluster_name)(rate(vt_rows_ingested_total{observability_replica="a"}[1h]))
              /
              sum by (k8s_cluster_name)(rate(vt_rows_ingested_total{observability_replica="b"}[1h]))
            ) > 0.25
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The two trace stores of the pair are ingesting different amounts"
            description: >-
              vt_rows_ingested_total over 1h differs between replica
              "a" and replica "b" by more than 0.25 of the other.
              One of them is not receiving what the writers send it (a lost
              writer destination, a full queue, a store refusing rows) or
              is still catching up after a restart. A recovered replica
              lies until its writers' queues drain: reads stay on the
              primary (`first_available`) meanwhile. docs/high-availability.md.

