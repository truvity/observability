{{- /*
Refusals first: a chart that renders nothing, or renders a rule whose
expression names a metric nobody exports, is worse than one that fails —
it reports success and then never fires. Both are caught here, at render
time, with a fixture under tests/invalid for each.
*/ -}}

{{- $enabled := list -}}
{{- range $name, $group := .Values.groups -}}
{{- if $group.enabled -}}{{- $enabled = append $enabled $name -}}{{- end -}}
{{- end -}}
{{- if not $enabled -}}
{{- fail "platform-alerts: every group is disabled, so this release would render no rules at all. Enable at least one group, or do not install the chart." -}}
{{- end -}}

{{- $storeGroups := include "platform-alerts.storeGroups" . -}}
{{- if and $storeGroups (not .Values.stores) -}}
{{- fail (printf "platform-alerts: groups %s watch the stores' own counters, but `stores` is empty. Name the counters your stores export (see values.yaml); a guessed metric name is how a rule silently never fires." $storeGroups) -}}
{{- end -}}

{{- if .Values.groups.writePath.enabled -}}
{{- range .Values.stores -}}
{{- if not .rowsMetric -}}
{{- fail (printf "platform-alerts: store %q has no `rowsMetric`, so the write-path deadman cannot watch it. Every store the deadman covers must name its rows counter." .name) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- $ns := .Values.namespaceSelector -}}
{{- /*
The cluster label, as a prefix for every `on (...)` / `by (...)` list below.
One metrics store can hold several clusters' series, told apart only by
this label, and two clusters can share a namespace, a Job name or a PVC
name. A join or aggregation that leaves it out matches series from both:
`on (...)` with `group_left` fails the whole query (duplicate series, HTTP
422 from vmalert, so the rule is dead and says nothing), and `and` /
`unless` / `max by` silently pair or merge across clusters. Where the label
is absent on both sides (a single-cluster store) it matches on empty, so
the rules are unchanged there. Empty `clusterLabel` renders the previous
expressions byte for byte.
*/ -}}
{{- $c := "" -}}
{{- if .Values.clusterLabel -}}{{- $c = printf "%s, " .Values.clusterLabel -}}{{- end -}}
{{- /*
`ownerLabel` (opt-in, empty renders the previous expressions byte for
byte): an aggregation keeps only the labels in its `by (...)`, so a rule
that aggregates drops the `owner` label the alert would be routed on.
`$b` is `$c` plus that label, and is used in the aggregating `by (...)`
lists only; the `on (...)` matches keep `$c`, because both sides of a join
carry the same owner (it is derived from the same namespace) and matching
on it would add nothing but a way to fail.
*/ -}}
{{- $b := $c -}}
{{- if .Values.ownerLabel -}}{{- $b = printf "%s%s, " $c .Values.ownerLabel -}}{{- end -}}
{{- /*
The metrics VMRule renders when at least one group other than `podSecurity`
is on. `podSecurity` and `podSecurityAudit` are LogsQL and have an object of their own below: one
VMRule cannot serve both alerters, because the metrics vmalert takes every
rule NOT marked `observability.rule-type: vlogs` and the logs one only
those that are.
*/ -}}
{{- $metricsGroups := without $enabled "podSecurity" "podSecurityAudit" -}}
{{- if $metricsGroups }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "platform-alerts.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.ruleLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- if .Values.groups.backups.enabled }}
    {{- $g := .Values.groups.backups }}
    {{- /*
    A SUSPENDED CronJob is skipped by both rules below
    (`ignoreSuspended`, default true since 0.11.0): suspending one is a
    decision someone wrote into its spec, and before this both rules
    fired on it for as long as it stayed suspended — the age of its last
    success grows forever, and its last failed Job is its newest forever.

    `unless ... == 1`, never `and ... == 0`: if kube_cronjob_spec_suspend
    is absent (an older kube-state-metrics, a trimmed collector list) the
    rules behave exactly as before instead of going silent. A rule that
    stops firing because a series is missing is the failure this chart
    exists to prevent.
    */}}
    {{- $ignoreSuspended := ternary $g.ignoreSuspended true (hasKey $g "ignoreSuspended") }}
    {{- $bns := default $ns $g.namespaceSelector }}
    {{- $bomit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    - name: platform-alerts.backups
      interval: {{ .Values.interval }}
      rules:
        # A CronJob that has not SUCCEEDED within its schedule plus slack.
        # This is the rule that matters: a CronJob which stops being
        # scheduled at all never produces a failed Job, so a rule watching
        # failures reports healthy while nothing runs. Measured healthy
        # range for a daily job: age resets below 24h on every run.
        - alert: CronJobNotSucceeding
          expr: >-
            time() - max by ({{ $b }}namespace, cronjob) (
              kube_cronjob_status_last_successful_time{namespace=~"{{ $bns }}"}
            ) > {{ $g.maxSuccessAge }}
            {{- if $ignoreSuspended }}
            unless on ({{ $c }}namespace, cronjob)
              kube_cronjob_spec_suspend{namespace=~"{{ $bns }}"} == 1
            {{- end }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $bomit) | nindent 12 }}
          annotations:
            summary: "CronJob {{`{{ $labels.namespace }}`}}/{{`{{ $labels.cronjob }}`}} has not succeeded within {{ $g.maxSuccessAge }}"
            description: >-
              No successful run in {{ $g.maxSuccessAge }}. A job that has stopped being
              scheduled produces no failures at all, so this is the only rule that
              can see it. Check that the CronJob exists, is not suspended, and that
              its last Job completed.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "CronJobNotSucceeding")) }}{{ . | nindent 12 }}{{- end }}
        # A Job that failed outright — but only the NEWEST Job of each
        # CronJob. `failedJobsHistoryLimit` keeps failed Job objects
        # around long after a later run of the same CronJob has
        # succeeded, and `kube_job_status_failed` never expires that
        # memory on its own: reading it directly fires forever on a
        # failure a later run already fixed. "Newest" is decided by
        # `kube_job_created` — every Job object carries it from the
        # instant it exists, unlike `kube_job_status_start_time`, which
        # stays unset until a pod actually runs and so cannot outrank an
        # older failure while the new run is merely pending. See
        # docs/safety.md.
        #
        # Scoped to Jobs owned by a CronJob
        # (`kube_job_owner{owner_kind="CronJob"}`): a standalone Job has
        # no schedule and so no later run to supersede it, and this
        # rule's whole intent — see its name — is backup CronJobs. A
        # standalone Job that fails no longer raises THIS alert.
        - alert: BackupJobFailed
          expr: >-
            WITH (
              cronjob_jobs = (
                kube_job_created{namespace=~"{{ $bns }}"}
                * on ({{ $c }}namespace, job_name) group_left(owner_name)
                kube_job_owner{namespace=~"{{ $bns }}", owner_kind="CronJob"}
              ),
              newest_per_cronjob = max by ({{ $c }}namespace, owner_name) (cronjob_jobs)
              {{- if $ignoreSuspended }},
              suspended_cronjobs = label_replace(
                kube_cronjob_spec_suspend{namespace=~"{{ $bns }}"} == 1,
                "owner_name", "$1", "cronjob", "(.+)"
              )
              {{- end }}
            )
            max by ({{ $b }}namespace, job_name) (
              kube_job_status_failed{namespace=~"{{ $bns }}"}
              and on ({{ $c }}namespace, job_name) (
                cronjob_jobs == on ({{ $c }}namespace, owner_name) group_left() newest_per_cronjob
                {{- if $ignoreSuspended }}
                unless on ({{ $c }}namespace, owner_name) suspended_cronjobs
                {{- end }}
              )
            ) > 0
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.failedSeverity "omit" $bomit) | nindent 12 }}
          annotations:
            summary: "Job {{`{{ $labels.namespace }}`}}/{{`{{ $labels.job_name }}`}} failed"
            description: >-
              The Job reported a failed pod. If it is a backup, treat the last
              successful run as the real recovery point until this is resolved.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "BackupJobFailed")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.writePath.enabled }}
    {{- $g := .Values.groups.writePath }}
    - name: platform-alerts.write-path
      interval: {{ .Values.interval }}
      rules:
        {{- range $store := .Values.stores }}
        # The write-path deadman for {{ $store.name }}.
        #
        # An alert on a store's read-only FLAG cannot fire in its own
        # headline case: that sample is written INTO the store that is
        # refusing writes. Reads keep working when writes do not, so
        # watching the rows counter stop is the only rule that sees it.
        #
        # `or vector(0)` makes the rule fire for both shapes of the
        # failure: the counter stops moving, and the counter disappears
        # because the store is gone.
        - alert: WritePathDead
          expr: >-
            (sum(rate({{ $store.rowsMetric }}[{{ $g.window }}])) or vector(0)) == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
            store: {{ $store.name | quote }}
          annotations:
            summary: "No rows written to the {{ $store.name }} store for {{ $g.for }}"
            description: >-
              {{ $store.rowsMetric }} has not advanced in {{ $g.for }}. The store may be
              read-only, out of disk, or gone; reads can keep working throughout, so
              nothing else will report this.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "WritePathDead")) }}{{ . | nindent 12 }}{{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.groups.volumes.enabled }}
    {{- $g := .Values.groups.volumes }}
    - name: platform-alerts.volumes
      interval: {{ .Values.interval }}
      rules:
        # A mounted filesystem far smaller than the claim that satisfied it
        # cannot legitimately happen: it means the real volume is not
        # mounted and the pod is writing to the node's root filesystem
        # while reporting 1/1 Running. Measured healthy range is 0.95-0.99
        # of the claim (filesystem overhead); the threshold sits well below
        # it so overhead can never reach it and a wrong mount always does.
        - alert: VolumeSmallerThanClaimed
          expr: >-
            kubelet_volume_stats_capacity_bytes{namespace=~"{{ $ns }}"}
            / on ({{ $c }}namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~"{{ $ns }}"}
            < {{ $g.minCapacityRatio }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "PVC {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim }}`}} is mounted on a filesystem far smaller than it claimed"
            description: >-
              The mounted filesystem is under {{ $g.minCapacityRatio }} of the claim. The
              volume is probably not mounted at all and the pod is writing to the
              node's root filesystem. Data written since it started is not on the
              volume.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "VolumeSmallerThanClaimed")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.storeLimits.enabled }}
    {{- $g := .Values.groups.storeLimits }}
    {{- $rules := list }}
    {{- range $store := .Values.stores }}
    {{- if and $store.freeSpaceMetric $store.freeSpaceLimitMetric }}
    {{- $rules = append $rules $store }}
    {{- end }}
    {{- end }}
    {{- if $rules }}
    - name: platform-alerts.store-limits
      interval: {{ .Values.interval }}
      rules:
        {{- range $store := $rules }}
        # Read from the store's OWN exported limit, never a constant
        # written here: a guessed constant is how a rule never fires or
        # always does. Fires while there is still headroom to act.
        - alert: StoreApproachingReadOnly
          expr: >-
            {{ $store.freeSpaceMetric }} / {{ $store.freeSpaceLimitMetric }} < {{ $g.headroomFactor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
            store: {{ $store.name | quote }}
          annotations:
            summary: "The {{ $store.name }} store is approaching its read-only limit"
            description: >-
              Free space is under {{ $g.headroomFactor }}x the limit at which this store stops
              accepting writes. It is still serving reads and will keep doing so
              after it stops writing, so nothing else will report this.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "StoreApproachingReadOnly")) }}{{ . | nindent 12 }}{{- end }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.groups.kargo.enabled }}
    {{- $g := .Values.groups.kargo }}
    - name: platform-alerts.kargo
      interval: {{ .Values.interval }}
      rules:
        # A Kargo Stage stuck on a promotion error.
        #
        # `kargo_stage_condition` is a gauge kube-state-metrics' own
        # customResourceState feature exports from the Stage's own
        # `.status.conditions`: 1 while the condition named by `type` and
        # `reason` is True, 0 while it is False or Unknown. This chart
        # does not configure that feature — see docs/kube-state-metrics.md
        # for the config that produces it.
        - alert: KargoStagePromotionErrored
          expr: >-
            kargo_stage_condition{type="Ready", reason="LastPromotionErrored"} == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "Kargo Stage {{`{{ $labels.namespace }}`}}/{{`{{ $labels.stage }}`}} has not recovered from a promotion error"
            description: >-
              The Stage's Ready condition has read LastPromotionErrored for {{ $g.for }}.
              Re-promote the Freight from the Kargo UI or CLI once the underlying
              failure is fixed; the Stage will not retry itself.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoStagePromotionErrored")) }}{{ . | nindent 12 }}{{- end }}
        # The same failure, corroborated by the Promotion object itself.
        #
        # `kargo_promotion_phase` is a StateSet over Pending, Running,
        # Succeeded, Failed, Errored and Aborted: 1 on the Promotion's
        # current phase, 0 on every other. Joining on (namespace, stage)
        # against the Stage condition above is what tells an Errored
        # promotion whose Stage has already recovered (a retry that
        # succeeded since) apart from one still stuck.
        - alert: KargoPromotionErrored
          expr: >-
            kargo_promotion_phase{phase="Errored"} == 1
            and on ({{ $c }}namespace, stage) kargo_stage_condition{type="Ready", reason="LastPromotionErrored"} == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            summary: "Kargo Promotion {{`{{ $labels.namespace }}`}}/{{`{{ $labels.promotion }}`}} errored and its Stage has not recovered"
            description: >-
              The Promotion has sat in the Errored phase for {{ $g.for }} and its
              Stage still reads LastPromotionErrored. Re-promote the Freight from
              the Kargo UI or CLI once the underlying failure is fixed.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoPromotionErrored")) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for the two rules above.
        #
        # Same shape as the write-path deadman: a rule that reads
        # `kargo_stage_condition` or `kargo_promotion_phase` cannot itself
        # notice those series going away, because it evaluates to nothing
        # rather than to a value it could compare. Either kube-state-metrics'
        # `customResourceState` config for Kargo's CRDs was never applied,
        # was edited away, or the whole scrape went dark — every case the
        # two rules above go silent right along with it.
        - alert: KargoStateMetricsAbsent
          expr: >-
            {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" `kargo_stage_condition{type="Ready"}`) }} or {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" `kargo_promotion_phase`) }}
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.absentSeverity "omit" $.Values.clusterLabel) | nindent 12 }}
          annotations:
            summary: "kube-state-metrics has not exported Kargo's own Stage/Promotion metrics for {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}"
            description: >-
              kargo_stage_condition{type="Ready"} or
              kargo_promotion_phase has not been seen in {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}, so
              KargoStagePromotionErrored and KargoPromotionErrored cannot fire
              even if a promotion is stuck. Check kube-state-metrics'
              customResourceState config against docs/kube-state-metrics.md, and
              that the scrape itself is still up.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoStateMetricsAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- /*
    The controller's own series (the controller's ServiceMonitor, job
    `controllerJob`), as opposed to the kube-state-metrics Stage and Promotion
    series above. Each rule is its own switch and is off by default, so a
    consumer that already turned the group on renders exactly what it did.
    */}}
    {{- $kc := $g.controllerAbsent }}
    {{- $kr := $g.reconcileErrors }}
    {{- $kq := $g.workqueueDepth }}
    {{- $kjob := $g.controllerJob }}
    {{- $komit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    {{- if $kc.enabled }}
        # No Kargo controller is reporting.
        #
        # Nothing promotes while the controller is down, and the Stage and
        # Promotion series above are written by kube-state-metrics from the
        # objects, so they stay green. `absent(up == 1)` covers both a
        # controller whose scrape reads 0 and one that is not scraped at
        # all.
        - alert: KargoControllerAbsent
          expr: >-
            {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" (printf `up{job="%s"}` $kjob) "cur" " == 1") }}
          for: {{ $kc.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $kc.severity "omit" $.Values.clusterLabel) | nindent 12 }}
          annotations:
            summary: "No Kargo controller has answered its metrics scrape for {{ $kc.for }}{{ include "platform-alerts.onCluster" $ }}"
            description: >-
              up{job="{{ $kjob }}"} has not been 1 in {{ $kc.for }}{{ include "platform-alerts.onCluster" $ }}: the Kargo
              controller is down, crash-looping or no longer scraped, so no
              Promotion is being executed. Check the controller's pod and its
              ServiceMonitor.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoControllerAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if $kr.enabled }}
        # Reconciles that ended in an error, per controller loop.
        #
        # `controller_runtime_reconcile_errors_total` is pre-initialised at 0
        # for every loop, so `increase` sees the first error too. `for` equal
        # to the window means one isolated error never fires: errors must keep
        # arriving.
        - alert: KargoControllerReconcileErrors
          expr: >-
            sum by ({{ $b }}controller) (
              increase(controller_runtime_reconcile_errors_total{job="{{ $kjob }}"}[{{ $kr.window }}])
            ) > 0
          for: {{ $kr.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $kr.severity "omit" $komit) | nindent 12 }}
          annotations:
            summary: "Kargo controller loop {{`{{ $labels.controller }}`}} keeps failing to reconcile"
            description: >-
              The {{`{{ $labels.controller }}`}} loop of the Kargo controller has
              recorded reconcile errors for {{ $kr.for }}. The objects it
              owns are not converging: read the controller's log for the
              resource and the error.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoControllerReconcileErrors")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if $kq.enabled }}
        # A work queue that does not drain.
        #
        # `workqueue_depth` is the items waiting. A queue is rarely empty
        # for an instant, so only depth above zero for the whole `for` counts:
        # the controller is slower than the changes arriving, or stuck.
        - alert: KargoControllerWorkqueueStuck
          expr: >-
            max by ({{ $b }}name) (workqueue_depth{job="{{ $kjob }}"}) > 0
          for: {{ $kq.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $kq.severity "omit" $komit) | nindent 12 }}
          annotations:
            summary: "Kargo work queue {{`{{ $labels.name }}`}} has not drained for {{ $kq.for }}"
            description: >-
              The work queue {{`{{ $labels.name }}`}} of the Kargo controller has
              held items for {{ $kq.for }}: reconciles are slower than changes
              arrive, or a worker is stuck. Compare with the controller's CPU
              and its reconcile errors.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "KargoControllerWorkqueueStuck")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.groups.probes.enabled }}
    {{- $g := .Values.groups.probes }}
    - name: platform-alerts.probes
      interval: {{ .Values.interval }}
      rules:
        # An HTTP probe that is not answering 2xx from this cluster.
        #
        # `probe_success` is the blackbox exporter's own series for a probe
        # of `observability-emitters` (`metrics.scrape.probes`): 1 while the
        # URL answers as the module accepts (any 2xx by default), 0 for a
        # refused connection, a TLS failure or any other status. `max by
        # (probe)` so a probe that resolves to several targets is down only
        # when all are.
        - alert: {{ $g.alertName }}
          expr: >-
            max by ({{ $b }}probe) (probe_success{probe=~"{{ $g.probe }}"}) == 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity) | nindent 12 }}
          annotations:
            {{- if $g.summary }}
            summary: {{ $g.summary | quote }}
            {{- else }}
            summary: "HTTP probe {{`{{ $labels.probe }}`}} has not answered 2xx for {{ $g.for }}"
            {{- end }}
            {{- if $g.description }}
            description: {{ $g.description | quote }}
            {{- else }}
            description: >-
              The probe {{`{{ $labels.probe }}`}} (charts/observability-emitters
              `metrics.scrape.probes`) has read probe_success == 0 for {{ $g.for }}: the URL
              refused the connection, failed TLS or answered something the
              probe's module does not accept (any 2xx, by default) from this
              cluster's own egress.
            {{- end }}
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" $g.alertName)) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for the rule above.
        #
        # `probe_success == 0` evaluates to nothing, not to a value, when
        # the series does not exist: a probe whose series never reached the
        # store (the exporter down, the VMProbe not selected, the series
        # filed under labels the store's readers do not see) makes
        # {{ $g.alertName }} silent while the probe is not working at all.
        # `absent()` is true exactly then. With the default selector it
        # fires only when NO probe reports; name a probe (`probe`) to watch
        # one, which is what a single-probe estate wants.
        - alert: {{ $g.alertName }}Absent
          expr: >-
            {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" (printf `probe_success{probe=~"%s"}` $g.probe) "by" (list "probe")) }}
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" (default $g.severity $g.absentSeverity) "omit" $.Values.clusterLabel) | nindent 12 }}
          annotations:
            summary: "No probe_success series for {{ $g.probe }} for {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}"
            description: >-
              probe_success{probe=~"{{ $g.probe }}"} has not been seen in
              {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}, so {{ $g.alertName }} cannot fire even if the
              URL is down. Check the blackbox exporter and the VMProbe
              (charts/observability-emitters `metrics.scrape.probes`), that the
              agent's scrape of the probe is up, and that its series carry the
              cluster's tenancy labels.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" (printf "%sAbsent" $g.alertName))) }}{{ . | nindent 12 }}{{- end }}
        {{- if $g.certExpiry.enabled }}
        # The TLS certificate a probe saw expires within `withinDays`.
        # `probe_ssl_earliest_cert_expiry` is a Unix time and exists only
        # for an https target; the earliest certificate of the chain.
        - alert: {{ $g.certExpiry.alertName }}
          expr: >-
            min by ({{ $b }}probe) (probe_ssl_earliest_cert_expiry{probe=~"{{ $g.probe }}"}) - time() < {{ mul (int $g.certExpiry.withinDays) 86400 }}
          for: {{ $g.certExpiry.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.certExpiry.severity) | nindent 12 }}
          annotations:
            summary: "The TLS certificate seen by probe {{`{{ $labels.probe }}`}} expires within {{ $g.certExpiry.withinDays }} days"
            description: >-
              The earliest certificate in the chain the probe
              {{`{{ $labels.probe }}`}} (charts/observability-emitters
              `metrics.scrape.probes`) was shown expires in less than
              {{ $g.certExpiry.withinDays }} days.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" $g.certExpiry.alertName)) }}{{ . | nindent 12 }}{{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.groups.pendingPods.enabled }}
    {{- $g := .Values.groups.pendingPods }}
    {{- $pns := default $ns $g.namespaceSelector }}
    - name: platform-alerts.pending-pods
      interval: {{ .Values.interval }}
      rules:
        # A pod the scheduler has declared unschedulable for `for`.
        #
        # `kube_pod_status_unschedulable` is 1 while the pod's PodScheduled
        # condition is False with reason Unschedulable and has no series
        # otherwise, so `== 1` only states what the series already means
        # (it keeps the rule right if a kube-state-metrics version emits 0
        # instead of omitting). On a cluster that adds nodes on demand this
        # is the signal that provisioning did not happen: the pod is what
        # the provisioner reacts to, and it is still waiting.
        - alert: PodUnschedulable
          expr: >-
            max by ({{ $b }}namespace, pod) (
              kube_pod_status_unschedulable{namespace=~"{{ $pns }}"} == 1
            )
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" (ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")))) | nindent 12 }}
          annotations:
            summary: "Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} has been unschedulable for {{ $g.for }}"
            description: >-
              The scheduler has not been able to place this pod for {{ $g.for }}.
              On a cluster that provisions nodes on demand that means no node was
              added for it (a provisioning failure, a quota or capacity limit, or
              a request no node type can satisfy); on any cluster it can also be
              an affinity, taint or quota the pod can never meet. The pod's
              events name the scheduler's reason.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "PodUnschedulable")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.nodeClaims.enabled }}
    {{- $g := .Values.groups.nodeClaims }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    - name: platform-alerts.node-claims
      interval: {{ .Values.interval }}
      rules:
        # A NodeClaim whose Launched, Registered or Initialized condition is
        # not True for `for`.
        #
        # `nodeclaim_status_condition` is a gauge kube-state-metrics'
        # customResourceState exports from each NodeClaim's
        # `.status.conditions`: 1 while the condition is True, 0 while it is
        # False or Unknown. A claim that is still being created has no
        # condition yet and so no series: the rule sees it only once
        # Karpenter has written the condition, which is when it starts to
        # count as not-True. Ready is left out on purpose: it is the
        # conjunction of these three, so it would only repeat them.
        - alert: NodeClaimNotReady
          expr: >-
            max by ({{ $b }}nodeclaim, nodepool, type) (
              nodeclaim_status_condition{type=~"Launched|Registered|Initialized"} == 0
            )
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NodeClaim {{`{{ $labels.nodeclaim }}`}} ({{`{{ $labels.nodepool }}`}}) has not reached {{`{{ $labels.type }}`}} for {{ $g.for }}"
            description: >-
              Karpenter created this NodeClaim but its {{`{{ $labels.type }}`}}
              condition has not become True in {{ $g.for }}. Launched means the
              instance was created, Registered that it joined the cluster as a
              node, Initialized that it is ready for pods. Karpenter deletes a
              claim that has not registered after 15 minutes and tries again, so
              an alert that clears by itself is a retry. `kubectl describe
              nodeclaim` shows the condition's reason and message.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NodeClaimNotReady")) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for the rule above: the series not being exported at
        # all (the preset never applied, or the scrape is dark) reads as
        # healthy to a rule that compares its values.
        - alert: NodeClaimMetricsAbsent
          expr: >-
            {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" `nodeclaim_status_condition{type="Launched"}`) }}
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.absentSeverity "omit" $.Values.clusterLabel) | nindent 12 }}
          annotations:
            summary: "kube-state-metrics has not exported NodeClaim conditions for {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}"
            description: >-
              nodeclaim_status_condition{type="Launched"} has not been seen in
              {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}, so NodeClaimNotReady cannot fire even if a
              node is failing to come up. Check that
              `kubeStateMetrics.customResources.nodeClaims` is on in
              observability-emitters and that the scrape is up. On a cluster
              that can have no NodeClaims at all this alert is expected.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NodeClaimMetricsAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.nats.enabled }}
    {{- $g := .Values.groups.nats }}
    {{- $job := $g.job }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    - name: platform-alerts.nats
      interval: {{ .Values.interval }}
      rules:
        # A broker whose exporter is not being scraped.
        #
        # `up` is the scrape's own series for the PodMonitor job the NATS
        # chart ships (`{{ $job }}`): 0 when the prometheus-nats-exporter
        # sidecar does not answer, which is a broker down, a broker not
        # ready, or the sidecar itself dead. `max by (pod)` so a pod whose
        # address changed on restart reads as one broker, not two.
        - alert: NATSBrokerDown
          expr: >-
            max by ({{ $b }}pod) (up{job="{{ $job }}"}) == 0
          for: {{ $g.brokerDownFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} has not answered its metrics scrape for {{ $g.brokerDownFor }}"
            description: >-
              The exporter of NATS broker {{`{{ $labels.pod }}`}} (job {{ $job }}) has
              been down for {{ $g.brokerDownFor }}. With three brokers the cluster and JetStream
              keep a quorum through one loss, but not two. Check
              `kubectl -n <namespace> get pods` and the pod's events and logs.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSBrokerDown")) }}{{ . | nindent 12 }}{{- end }}
        # A broker that sees fewer cluster routes than its peers need.
        #
        # `nats_varz_routes` is the number of route connections the broker
        # holds. Every peer is reached over `cluster.pool_size` pooled
        # routes (`nats_varz_cluster_pool_size`, 3 by default), plus one
        # per pinned account, so a healthy 3-broker cluster reads 8, not 2.
        # The floor is therefore peers x pool size, with peers read from the
        # JetStream meta group size (`nats_varz_jetstream_meta_cluster_size`
        # less this broker): a peer that is wholly unreachable drops the
        # count well below it, while a single re-dialled route does not.
        - alert: NATSClusterRoutesMissing
          expr: >-
            max by ({{ $b }}pod) (nats_varz_routes{job="{{ $job }}"})
            <
            (
              max by ({{ $b }}pod) (nats_varz_jetstream_meta_cluster_size{job="{{ $job }}"} - 1)
              *
              max by ({{ $b }}pod) (nats_varz_cluster_pool_size{job="{{ $job }}"})
            )
          for: {{ $g.routesFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} sees too few cluster routes ({{`{{ $value }}`}})"
            description: >-
              Broker {{`{{ $labels.pod }}`}} holds fewer route connections than one
              pooled set per peer, for {{ $g.routesFor }}: it has lost a
              peer (a restart, a NetworkPolicy, a DNS or node problem), so
              the cluster is partitioned or degraded. Check the other
              brokers' own routes and `nats server report connections`.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSClusterRoutesMissing")) }}{{ . | nindent 12 }}{{- end }}
        # JetStream's meta group has no leader.
        #
        # `meta_leader` is a label of the jsz-derived series (the leader the
        # reporting broker sees, empty while there is none) and
        # `nats_varz_jetstream_meta_leader` carries the same name in its
        # `value` label. Without a meta leader no stream or consumer can be
        # created or changed, and JetStream API calls fail.
        - alert: NATSJetStreamNoMetaLeader
          expr: >-
            max by ({{ $b }}pod) (nats_server_total_streams{job="{{ $job }}", meta_leader=""})
            or
            max by ({{ $b }}pod) (nats_varz_jetstream_meta_leader{job="{{ $job }}", value=""})
          for: {{ $g.leaderFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS JetStream has no meta leader, as seen by {{`{{ $labels.pod }}`}}"
            description: >-
              Broker {{`{{ $labels.pod }}`}} reports no JetStream meta leader for
              {{ $g.leaderFor }}. The meta group needs a majority of brokers
              to elect one: check how many brokers are up and routed
              (NATSBrokerDown, NATSClusterRoutesMissing) and the brokers'
              logs for raft errors.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSJetStreamNoMetaLeader")) }}{{ . | nindent 12 }}{{- end }}
        # A stream with no leader.
        #
        # Every `nats_stream_*` series carries `stream_leader`, the leader
        # the reporting broker sees; empty while the stream's raft group
        # has none. A stream without a leader accepts no publishes and
        # serves no consumers.
        - alert: NATSStreamNoLeader
          expr: >-
            max by ({{ $b }}account, stream_name) (nats_stream_total_messages{job="{{ $job }}", stream_leader=""})
          for: {{ $g.leaderFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS stream {{`{{ $labels.account }}`}}/{{`{{ $labels.stream_name }}`}} has no leader"
            description: >-
              The stream {{`{{ $labels.stream_name }}`}} of account {{`{{ $labels.account }}`}}
              has had no leader for {{ $g.leaderFor }}, so it takes no publishes
              and serves no consumers. Usually a majority of its replicas is
              down or unrouted; `nats stream info` and the brokers' logs say
              which.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSStreamNoLeader")) }}{{ . | nindent 12 }}{{- end }}
        # A consumer whose backlog has not drained for the whole window and
        # has grown over it.
        #
        # `nats_consumer_num_pending` is the messages not yet delivered to
        # the consumer; every broker holding a replica reports it, hence the
        # `max by`. The backlog must have stayed above `minPending` for the
        # entire window (so a burst that drained does not count) and be
        # higher at the end than at the start.
        - alert: NATSConsumerBacklogGrowing
          expr: >-
            max by ({{ $b }}account, stream_name, consumer_name) (
              (delta(nats_consumer_num_pending{job="{{ $job }}"}[{{ $g.backlog.window }}]) > 0)
              and
              (min_over_time(nats_consumer_num_pending{job="{{ $job }}"}[{{ $g.backlog.window }}]) > {{ $g.backlog.minPending }})
            )
          for: {{ $g.backlog.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS consumer {{`{{ $labels.stream_name }}`}}/{{`{{ $labels.consumer_name }}`}} backlog keeps growing"
            description: >-
              The backlog of consumer {{`{{ $labels.consumer_name }}`}} on stream
              {{`{{ $labels.stream_name }}`}} (account {{`{{ $labels.account }}`}}) has stayed
              above {{ $g.backlog.minPending }} messages for {{ $g.backlog.window }} and is larger than at the
              start of that window: the consumer is slower than the
              producers or has stopped. Check the consuming service and
              `nats consumer info`.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSConsumerBacklogGrowing")) }}{{ . | nindent 12 }}{{- end }}
        # Slow consumers: the broker dropped or throttled a client that
        # could not keep up. `nats_varz_slow_consumers` is a cumulative
        # count since the broker started, so only its increase means
        # anything (`increase` also rides out a restart's reset).
        - alert: NATSSlowConsumers
          expr: >-
            max by ({{ $b }}pod) (increase(nats_varz_slow_consumers{job="{{ $job }}"}[{{ $g.slowConsumers.window }}])) > 0
          for: {{ $g.slowConsumers.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} is cutting off slow consumers"
            description: >-
              The slow-consumer count of broker {{`{{ $labels.pod }}`}} rose within the
              last {{ $g.slowConsumers.window }}: a client is not reading
              fast enough and the broker is dropping its messages or its
              connection. `nats server report connections --sort pending`
              names the client.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSSlowConsumers")) }}{{ . | nindent 12 }}{{- end }}
        # JetStream's file store filling up.
        #
        # `nats_varz_jetstream_stats_storage` is the bytes the broker's
        # JetStream holds on disk, `nats_varz_jetstream_config_max_storage`
        # the store size it was configured with (the limit it enforces).
        # A zero limit is filtered out rather than divided by.
        - alert: NATSJetStreamStorageHigh
          expr: >-
            max by ({{ $b }}pod) (nats_varz_jetstream_stats_storage{job="{{ $job }}"})
            /
            (max by ({{ $b }}pod) (nats_varz_jetstream_config_max_storage{job="{{ $job }}"}) > 0)
            > {{ $g.storage.ratio }}
          for: {{ $g.storage.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} JetStream storage is above {{ round (mulf $g.storage.ratio 100) 0 }}%"
            description: >-
              JetStream on broker {{`{{ $labels.pod }}`}} uses more than
              {{ round (mulf $g.storage.ratio 100) 0 }}% of its configured file store for {{ $g.storage.for }}. At the
              limit publishes to streams that do not discard old messages
              are refused. Check stream sizes and retention with `nats
              stream report`, or grow the store.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSJetStreamStorageHigh")) }}{{ . | nindent 12 }}{{- end }}
        # Broker memory near the container's limit.
        #
        # The broker exports no limit of its own (`go_gc_gomemlimit_bytes`
        # is unset), so it is the container's working set (cadvisor) over
        # the pod's memory limit (kube-state-metrics). A container without
        # a limit has no `kube_pod_container_resource_limits` series and so
        # is never alerted on.
        - alert: NATSMemoryNearLimit
          expr: >-
            max by ({{ $b }}pod) (container_memory_working_set_bytes{namespace="{{ $g.memory.namespace }}", container="{{ $g.memory.container }}"})
            /
            max by ({{ $b }}pod) (kube_pod_container_resource_limits{namespace="{{ $g.memory.namespace }}", container="{{ $g.memory.container }}", resource="memory"})
            > {{ $g.memory.ratio }}
          for: {{ $g.memory.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "NATS broker {{`{{ $labels.pod }}`}} memory is above {{ round (mulf $g.memory.ratio 100) 0 }}% of its limit"
            description: >-
              The working set of broker {{`{{ $labels.pod }}`}} has been above
              {{ round (mulf $g.memory.ratio 100) 0 }}% of its memory limit for {{ $g.memory.for }}; at the limit the
              kernel kills it. Look for a connection or subscription surge
              (`nats server report connections`) or raise the limit.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSMemoryNearLimit")) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for every rule above: no NATS exporter series at all
        # (the PodMonitor gone, the scrape blocked, the chart not installed)
        # reads as healthy to rules that compare values.
        - alert: NATSMetricsAbsent
          expr: >-
            {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" (printf `up{job="%s"}` $job)) }}
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $.Values.clusterLabel) | nindent 12 }}
          annotations:
            summary: "No NATS exporter has been scraped for {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}"
            description: >-
              up{job="{{ $job }}"} has not been seen in {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}, so none of the
              NATS rules can fire. Check that the NATS chart's PodMonitor is
              applied and the brokers' metrics port is reachable from the
              agent.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "NATSMetricsAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.argocd.enabled }}
    {{- $g := .Values.groups.argocd }}
    {{- $job := $g.job }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    - name: platform-alerts.argocd
      interval: {{ .Values.interval }}
      rules:
        # An Application whose sync ended in Failed or Error.
        #
        # `argocd_app_sync_total` is a counter per Application and phase. The
        # Failed series of an Application that never failed does not exist
        # until its first failure, and plain `increase` skips a series' first
        # sample, so the first failure would go unseen: `increase_pure`
        # counts from zero. It stays true for `syncFailed.window` after the
        # last failure.
        - alert: ArgoCDAppSyncFailed
          expr: >-
            sum by ({{ $b }}name, project, dest_server, phase) (
              increase_pure(argocd_app_sync_total{job=~"{{ $job }}", phase=~"Failed|Error"}[{{ $g.syncFailed.window }}])
            ) > 0
          for: {{ $g.syncFailed.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Argo CD application {{`{{ $labels.name }}`}} ended a sync as {{`{{ $labels.phase }}`}}"
            description: >-
              A sync of application {{`{{ $labels.name }}`}} (project
              {{`{{ $labels.project }}`}}, destination {{`{{ $labels.dest_server }}`}})
              ended in {{`{{ $labels.phase }}`}} within the last
              {{ $g.syncFailed.window }}. Open the application and read the
              sync result: a manifest the cluster refused, a hook that
              failed, or a resource that never became healthy.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ArgoCDAppSyncFailed")) }}{{ . | nindent 12 }}{{- end }}
        # An Application whose health is Degraded, Missing or Unknown.
        #
        # `argocd_app_info` is a gauge of 1 per Application, carrying its
        # health in `health_status`. Progressing is left out on purpose: a
        # rollout is Progressing, and one that never finishes is caught by
        # Degraded when its resources time out.
        - alert: ArgoCDAppUnhealthy
          expr: >-
            max by ({{ $b }}name, project, dest_server, health_status) (
              argocd_app_info{job=~"{{ $job }}", health_status=~"Degraded|Missing|Unknown"}
            )
          for: {{ $g.unhealthyFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Argo CD application {{`{{ $labels.name }}`}} has been {{`{{ $labels.health_status }}`}} for {{ $g.unhealthyFor }}"
            description: >-
              Application {{`{{ $labels.name }}`}} (project {{`{{ $labels.project }}`}},
              destination {{`{{ $labels.dest_server }}`}}) reports health
              {{`{{ $labels.health_status }}`}}. Open it and read the resource that
              is not healthy: a crash-looping workload, a missing object, or a
              cluster Argo CD cannot read (see ArgoCDClusterConnectionLost).
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ArgoCDAppUnhealthy")) }}{{ . | nindent 12 }}{{- end }}
        # An Application whose live state has differed from Git for too long.
        #
        # An application that does not self-heal and does not prune is
        # OutOfSync by design (a resource kept on purpose): leave `outOfSyncFor`
        # long, or switch the rule off with `outOfSync.enabled: false`.
        {{- if $g.outOfSync.enabled }}
        - alert: ArgoCDAppOutOfSync
          expr: >-
            max by ({{ $b }}name, project, dest_server) (
              argocd_app_info{job=~"{{ $job }}", sync_status="OutOfSync"}
            )
          for: {{ $g.outOfSync.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Argo CD application {{`{{ $labels.name }}`}} has been OutOfSync for {{ $g.outOfSync.for }}"
            description: >-
              Application {{`{{ $labels.name }}`}} (project {{`{{ $labels.project }}`}},
              destination {{`{{ $labels.dest_server }}`}}) differs from Git and
              nothing has reconciled it for {{ $g.outOfSync.for }}. Check that
              automated sync is on, or sync it by hand, and read the diff.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ArgoCDAppOutOfSync")) }}{{ . | nindent 12 }}{{- end }}
        {{- end }}
        # A destination cluster the application controller cannot reach.
        #
        # `argocd_cluster_connection_status` is 1 while the controller's
        # connection to the cluster works and 0 while it does not. With the
        # connection down every application on that cluster is stale, and
        # none of the app-level alerts can say so.
        - alert: ArgoCDClusterConnectionLost
          expr: >-
            min by ({{ $b }}server) (argocd_cluster_connection_status{job=~"{{ $job }}"}) < 1
          for: {{ $g.clusterLostFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Argo CD cannot reach the cluster {{`{{ $labels.server }}`}}"
            description: >-
              The application controller has had no working connection to
              {{`{{ $labels.server }}`}} for {{ $g.clusterLostFor }}: its
              applications are no longer reconciled. Check the cluster's API
              endpoint, the credentials Argo CD holds for it, and the network
              path from the controller.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ArgoCDClusterConnectionLost")) }}{{ . | nindent 12 }}{{- end }}
        # The repo server failing to fetch from Git.
        #
        # `argocd_git_fetch_fail_total` is born at the first failure of a
        # repository, hence `increase_pure`. At least `gitFetch.minFailures`
        # within the window, so one dropped connection does not fire: Argo CD
        # retries every few minutes, and a repository that is really
        # unreachable fails on every attempt.
        - alert: ArgoCDGitFetchFailing
          expr: >-
            sum by ({{ $b }}repo) (
              increase_pure(argocd_git_fetch_fail_total{job=~"{{ $job }}"}[{{ $g.gitFetch.window }}])
            ) >= {{ $g.gitFetch.minFailures }}
          for: {{ $g.gitFetch.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "The Argo CD repo server cannot fetch {{`{{ $labels.repo }}`}}"
            description: >-
              At least {{ $g.gitFetch.minFailures }} Git fetches of
              {{`{{ $labels.repo }}`}} failed within {{ $g.gitFetch.window }}, for
              {{ $g.gitFetch.for }}. Applications that track it cannot see new
              commits or render manifests. Check the repository's address and
              credentials, the Git host, and the repo server's log.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ArgoCDGitFetchFailing")) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for every rule above: no Application is reported at all
        # (the application controller down, its ServiceMonitor gone, the
        # scrape blocked) reads as healthy to rules that compare values.
        - alert: ArgoCDMetricsAbsent
          expr: >-
            {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" (printf `argocd_app_info{job=~"%s"}` $job)) }}
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.absentSeverity "omit" $.Values.clusterLabel) | nindent 12 }}
          annotations:
            summary: "Argo CD has reported no applications for {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}"
            description: >-
              argocd_app_info{job=~"{{ $job }}"} has not been seen in
              {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}, so none of the Argo CD rules can fire. The
              application controller is down or its metrics endpoint is not
              scraped: check its pod and the ServiceMonitor the chart renders
              (`controller.metrics.serviceMonitor.enabled`).
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ArgoCDMetricsAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.eso.enabled }}
    {{- $g := .Values.groups.eso }}
    {{- $gns := $g.namespace }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    - name: platform-alerts.eso
      interval: {{ .Values.interval }}
      rules:
        # The admission webhook is down.
        #
        # Both validating webhooks of External Secrets Operator
        # (ExternalSecret and SecretStore validation) fail closed
        # (`failurePolicy: Fail`): while the webhook pod does not answer,
        # the API server refuses every create and update of an ExternalSecret,
        # SecretStore and ClusterSecretStore, which blocks every deploy that
        # carries one. Highest severity in the group.
        - alert: ESOWebhookDown
          expr: >-
            max by ({{ $b }}pod) (up{namespace="{{ $gns }}", job=~"{{ $g.webhookJob }}"}) == 0
          for: {{ $g.webhookDownFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "The External Secrets webhook {{`{{ $labels.pod }}`}} has not answered its scrape for {{ $g.webhookDownFor }}"
            description: >-
              The webhook pod {{`{{ $labels.pod }}`}} does not answer. The
              webhooks fail closed, so writes of ExternalSecrets, SecretStores
              and ClusterSecretStores are being refused cluster-wide. Check the
              pod in namespace {{ $gns }}, its events and its log; as a last
              resort the webhook configurations can be set to ignore failures.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ESOWebhookDown")) }}{{ . | nindent 12 }}{{- end }}
        # No webhook is reporting at all: the pod is gone or no longer scraped.
        # The same outage as above, which `== 0` cannot see once the series is
        # stale.
        - alert: ESOWebhookAbsent
          expr: >-
            {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" (printf `up{namespace="%s", job=~"%s"}` $gns $g.webhookJob)) }}
          for: {{ $g.webhookDownFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $.Values.clusterLabel) | nindent 12 }}
          annotations:
            summary: "No External Secrets webhook has been scraped for {{ $g.webhookDownFor }}{{ include "platform-alerts.onCluster" $ }}"
            description: >-
              up{namespace="{{ $gns }}", job=~"{{ $g.webhookJob }}"} has not
              been seen in {{ $g.webhookDownFor }}{{ include "platform-alerts.onCluster" $ }}: the webhook Deployment is
              gone or not scraped. If it is gone the webhooks fail closed and
              writes of ExternalSecrets and SecretStores are refused.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ESOWebhookAbsent")) }}{{ . | nindent 12 }}{{- end }}
        # An ExternalSecret that is not Ready.
        #
        # `externalsecret_status_condition` is 1 on the series of the
        # condition the ExternalSecret currently has. The series' own
        # `namespace` is the ExternalSecret's, which collides with the scrape's
        # and survives as `exported_namespace` under `honor_labels: false`,
        # which is how this chart's emitters scrape.
        - alert: ESOExternalSecretNotReady
          expr: >-
            max by ({{ $b }}exported_namespace, name) (
              externalsecret_status_condition{condition="Ready", status="False"}
            ) == 1
          for: {{ $g.notReadyFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "ExternalSecret {{`{{ $labels.exported_namespace }}`}}/{{`{{ $labels.name }}`}} has not been Ready for {{ $g.notReadyFor }}"
            description: >-
              The ExternalSecret is not syncing: the Kubernetes Secret it
              owns is stale or was never created. `kubectl describe
              externalsecret` shows the reason: a missing remote key, a store
              that denies the read, or a template that does not render.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ESOExternalSecretNotReady")) }}{{ . | nindent 12 }}{{- end }}
        # A SecretStore that is not Ready.
        #
        # A store that cannot validate its provider silently stales every
        # ExternalSecret that reads it.
        - alert: ESOSecretStoreNotReady
          expr: >-
            max by ({{ $b }}exported_namespace, name) (
              secretstore_status_condition{condition="Ready", status="False"}
            ) == 1
          for: {{ $g.storeNotReadyFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "SecretStore {{`{{ $labels.exported_namespace }}`}}/{{`{{ $labels.name }}`}} has not been Ready for {{ $g.storeNotReadyFor }}"
            description: >-
              The store cannot validate its provider, so every ExternalSecret
              that reads it goes stale. `kubectl describe secretstore` shows
              why: unreachable provider, rejected credentials or a bad
              configuration.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ESOSecretStoreNotReady")) }}{{ . | nindent 12 }}{{- end }}
        # A ClusterSecretStore that is not Ready.
        - alert: ESOClusterSecretStoreNotReady
          expr: >-
            max by ({{ $b }}name) (
              clustersecretstore_status_condition{condition="Ready", status="False"}
            ) == 1
          for: {{ $g.storeNotReadyFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "ClusterSecretStore {{`{{ $labels.name }}`}} has not been Ready for {{ $g.storeNotReadyFor }}"
            description: >-
              The cluster-wide store cannot validate its provider, so every
              ExternalSecret that reads it, in any namespace, goes stale.
              `kubectl describe clustersecretstore` shows why.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ESOClusterSecretStoreNotReady")) }}{{ . | nindent 12 }}{{- end }}
        # Reconciles that ended in an error, per controller.
        #
        # controller-runtime pre-initialises the counter at 0 for every
        # controller, so `increase` sees the first error. `for` equal to the
        # window means one isolated error never fires: errors must keep
        # arriving.
        - alert: ESOReconcileErrors
          expr: >-
            sum by ({{ $b }}controller) (
              increase(controller_runtime_reconcile_errors_total{namespace="{{ $gns }}"}[{{ $g.reconcileErrors.window }}])
            ) > 0
          for: {{ $g.reconcileErrors.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "External Secrets controller {{`{{ $labels.controller }}`}} keeps failing to reconcile"
            description: >-
              The {{`{{ $labels.controller }}`}} controller has recorded reconcile
              errors for {{ $g.reconcileErrors.for }}. Read the operator's log
              for the object and the error; the not-Ready alerts name the
              objects that are affected.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ESOReconcileErrors")) }}{{ . | nindent 12 }}{{- end }}
        # Calls to the secret provider's API that fail.
        #
        # `externalsecret_provider_api_calls_count` carries `provider`, `call`
        # and `status` (`success` or `error`). Same shape as the rule above:
        # the errors must keep arriving for `for`.
        - alert: ESOProviderAPIErrors
          expr: >-
            sum by ({{ $b }}provider) (
              increase(externalsecret_provider_api_calls_count{status="error"}[{{ $g.providerErrors.window }}])
            ) > 0
          for: {{ $g.providerErrors.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Calls to the {{`{{ $labels.provider }}`}} secret provider keep failing"
            description: >-
              API calls to the provider {{`{{ $labels.provider }}`}} have kept
              failing for {{ $g.providerErrors.for }}: the provider is
              unreachable or throttling, or has rejected the operator's
              credentials. ExternalSecrets that read from it go stale.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ESOProviderAPIErrors")) }}{{ . | nindent 12 }}{{- end }}
        # A work queue that does not drain.
        - alert: ESOWorkqueueStuck
          expr: >-
            max by ({{ $b }}name) (workqueue_depth{namespace="{{ $gns }}"}) > 0
          for: {{ $g.workqueueFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "External Secrets work queue {{`{{ $labels.name }}`}} has not drained for {{ $g.workqueueFor }}"
            description: >-
              The queue {{`{{ $labels.name }}`}} has held items for
              {{ $g.workqueueFor }}: secret delivery is delayed. The operator is
              slower than the changes arriving, or a worker is stuck.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ESOWorkqueueStuck")) }}{{ . | nindent 12 }}{{- end }}
        # The deadman for the rules above: nothing in the operator's
        # namespace is scraped (the chart's `serviceMonitor.enabled` is off,
        # the pods are gone, the scrape is blocked).
        - alert: ESOMetricsAbsent
          expr: >-
            {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" (printf `up{namespace="%s"}` $gns)) }}
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $.Values.clusterLabel) | nindent 12 }}
          annotations:
            summary: "No External Secrets target has been scraped for {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}"
            description: >-
              up{namespace="{{ $gns }}"} has not been seen in {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }},
              so none of the External Secrets rules can fire. Check that the
              operator chart's `serviceMonitor.enabled` is on and the pods are
              running.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ESOMetricsAbsent")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.ack.enabled }}
    {{- $g := .Values.groups.ack }}
    {{- $gns := $g.namespace }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    - name: platform-alerts.ack
      interval: {{ .Values.interval }}
      rules:
        # An AWS Controllers for Kubernetes controller that does not answer.
        #
        # ACK controllers are what makes AWS resources converge on their
        # Kubernetes objects, and a down controller is silent otherwise: the
        # objects stay as they were.
        - alert: ACKControllerDown
          expr: >-
            max by ({{ $b }}namespace, pod) (up{namespace=~"{{ $gns }}"}) == 0
          for: {{ $g.downFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "The ACK controller {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} has not answered its scrape for {{ $g.downFor }}"
            description: >-
              The controller does not answer its metrics scrape: it is down,
              crash-looping or not ready. AWS resources it owns are not being
              created, updated or deleted. Check the pod in
              {{`{{ $labels.namespace }}`}}, its events and its log.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ACKControllerDown")) }}{{ . | nindent 12 }}{{- end }}
        # A controller that is not reporting at all.
        {{- if $g.expectedNamespaces }}
        #
        # One clause per controller namespace named in `expectedNamespaces`.
        # With a `clusterLabel`, a cluster that reported ANY of the listed
        # namespaces within `absentLookback` must report every one: the
        # alert is per cluster and per missing controller (`namespace` is the
        # missing one), so one cluster losing a controller is not hidden by
        # the same controller running on another. A listed namespace that
        # nothing reports at all, and that no cluster reported within the
        # lookback, still fires on its own (the whole-store `absent()`).
        - alert: ACKControllerAbsent
          expr: >-
            {{- $union := join "|" $g.expectedNamespaces }}
            {{- range $i, $n := $g.expectedNamespaces }}
            {{- if $i }}
            or
            {{- end }}
            {{- if $.Values.clusterLabel }}
            (label_replace(group by ({{ $.Values.clusterLabel }}) (max_over_time(up{namespace=~"{{ $union }}", {{ $.Values.clusterLabel }}!=""}[{{ $.Values.absentLookback }}])), "namespace", "{{ $n }}", "", "") unless group by ({{ $.Values.clusterLabel }}, namespace) (up{namespace="{{ $n }}", {{ $.Values.clusterLabel }}!=""})) or (absent(up{namespace="{{ $n }}"}) unless on() group(max_over_time(up{namespace=~"{{ $union }}"}[{{ $.Values.absentLookback }}])))
            {{- else }}
            absent(up{namespace="{{ $n }}"})
            {{- end }}
            {{- end }}
        {{- else }}
        #
        # With no `expectedNamespaces`, a controller that reported within
        # `absentLookback` and no longer does fires per cluster and per
        # namespace; "no ACK controller reports at all" fires through the
        # whole-store `absent()`. Name the controllers' namespaces
        # (`expectedNamespaces`) to also catch one that never came up.
        - alert: ACKControllerAbsent
          expr: >-
            {{ include "platform-alerts.absentGuard" (dict "root" $ "sel" (printf `up{namespace=~"%s"}` $gns) "by" (list "namespace")) }}
        {{- end }}
          for: {{ $g.absentFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $.Values.clusterLabel) | nindent 12 }}
          annotations:
            summary: "An ACK controller has not been scraped for {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}"
            description: >-
              No `up` series has been seen for an ACK controller in
              {{ $g.absentFor }}{{ include "platform-alerts.onCluster" $ }}: its Deployment is gone, its pod is not
              scheduled, or the PodMonitor is no longer applied. AWS resources
              it owns are not being reconciled.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ACKControllerAbsent")) }}{{ . | nindent 12 }}{{- end }}
        # Reconciles that ended in an error and will be retried.
        #
        # controller-runtime pre-initialises the counter at 0 for every
        # controller, so `increase` sees the first error. `for` equal to the
        # window means one isolated error never fires: errors must keep
        # arriving.
        - alert: ACKReconcileErrors
          expr: >-
            sum by ({{ $b }}namespace, controller) (
              increase(controller_runtime_reconcile_errors_total{namespace=~"{{ $gns }}"}[{{ $g.reconcileErrors.window }}])
            ) > 0
          for: {{ $g.reconcileErrors.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "ACK controller {{`{{ $labels.namespace }}`}} keeps failing to reconcile {{`{{ $labels.controller }}`}}"
            description: >-
              The controller in {{`{{ $labels.namespace }}`}} has recorded reconcile
              errors on {{`{{ $labels.controller }}`}} for {{ $g.reconcileErrors.for }}.
              The resources are retried and may be failing on AWS permissions,
              throttling or a bad spec: the controller's log names the
              resource.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ACKReconcileErrors")) }}{{ . | nindent 12 }}{{- end }}
        # Terminal reconcile errors: a resource that needs a human.
        #
        # A terminal error is one the controller will not retry (an invalid
        # spec, a name that is taken). The counter only moves when the error
        # is first found, so the alert lasts `window` and then clears with the
        # resource still broken: the Terminal condition on the object is what
        # stays.
        - alert: ACKTerminalReconcileErrors
          expr: >-
            sum by ({{ $b }}namespace, controller) (
              increase(controller_runtime_terminal_reconcile_errors_total{namespace=~"{{ $gns }}"}[{{ $g.terminalErrors.window }}])
            ) > 0
          for: {{ $g.terminalErrors.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "ACK controller {{`{{ $labels.namespace }}`}} hit a terminal error on {{`{{ $labels.controller }}`}}"
            description: >-
              A resource of kind {{`{{ $labels.controller }}`}} reached a terminal
              error in {{`{{ $labels.namespace }}`}} within the last
              {{ $g.terminalErrors.window }}. The controller will not retry it:
              `kubectl get` the resources of that kind and read the
              `ACK.Terminal` condition's message.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ACKTerminalReconcileErrors")) }}{{ . | nindent 12 }}{{- end }}
        # A controller that panicked in a reconcile.
        #
        # controller-runtime recovers the panic and counts it; the object is
        # retried, and the bug is the controller's.
        - alert: ACKReconcilePanics
          expr: >-
            sum by ({{ $b }}namespace, controller) (
              increase(controller_runtime_reconcile_panics_total{namespace=~"{{ $gns }}"}[{{ $g.panics.window }}])
            ) > 0
          for: {{ $g.panics.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "ACK controller {{`{{ $labels.namespace }}`}} panicked while reconciling {{`{{ $labels.controller }}`}}"
            description: >-
              The controller in {{`{{ $labels.namespace }}`}} recovered from a
              panic reconciling {{`{{ $labels.controller }}`}} within the last
              {{ $g.panics.window }}. It is a defect in that controller version:
              find the resource in the log and check for a newer release.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ACKReconcilePanics")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.envoyRoutes.enabled }}
    {{- $g := .Values.groups.envoyRoutes }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    {{- $sel := printf `job=~"%s", envoy_cluster_name=~"%s"` $g.job $g.routeSelector }}
    {{- $w := $g.window }}
    {{- $traffic := printf "sum by (%senvoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{%s}[%s]))" $b $sel $w }}
    - name: platform-alerts.envoy-routes
      interval: {{ .Values.interval }}
      rules:
        # The share of a route's upstream responses that are 5xx.
        #
        # Envoy Gateway names one Envoy cluster per HTTPRoute rule
        # (`httproute/<namespace>/<route>/rule/<n>`), so `envoy_cluster_name`
        # IS the per-route label, and `envoy_response_code_class` is the
        # class digit. Both thresholds read the same ratio; the traffic
        # guard keeps a route that sees a request an hour from paging on one
        # failed request. A route with no 5xx series has an empty numerator
        # and stays silent, which is the healthy case.
        - alert: EnvoyRoute5xxRatioHigh
          expr: >-
            sum by ({{ $b }}envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{ {{- $sel }}, envoy_response_code_class="5"}[{{ $w }}]))
            / {{ $traffic }} > {{ $g.warningRatio }}
            and on ({{ $c }}envoy_cluster_name) {{ $traffic }} >= {{ $g.minRequestsPerSecond }}
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Route {{`{{ $labels.envoy_cluster_name }}`}} returns more than {{ $g.warningRatio }} 5xx"
            description: >-
              More than {{ $g.warningRatio }} of the upstream responses of this route were
              5xx over {{ $w }}, at a rate above {{ $g.minRequestsPerSecond }} requests per
              second. The name is `httproute/<namespace>/<route>/rule/<n>`: the
              route's backend is failing or refusing connections.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "EnvoyRoute5xxRatioHigh")) }}{{ . | nindent 12 }}{{- end }}
        - alert: EnvoyRoute5xxRatioCritical
          expr: >-
            sum by ({{ $b }}envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{ {{- $sel }}, envoy_response_code_class="5"}[{{ $w }}]))
            / {{ $traffic }} > {{ $g.criticalRatio }}
            and on ({{ $c }}envoy_cluster_name) {{ $traffic }} >= {{ $g.minRequestsPerSecond }}
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.criticalSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Route {{`{{ $labels.envoy_cluster_name }}`}} returns more than {{ $g.criticalRatio }} 5xx"
            description: >-
              More than {{ $g.criticalRatio }} of the upstream responses of this route were
              5xx over {{ $w }}: the route is effectively down.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "EnvoyRoute5xxRatioCritical")) }}{{ . | nindent 12 }}{{- end }}
        # p99 of the upstream response time per route. Envoy's histogram is
        # in milliseconds.
        - alert: EnvoyRouteP99LatencyHigh
          expr: >-
            histogram_quantile(0.99, sum by ({{ $b }}envoy_cluster_name, le) (rate(envoy_cluster_upstream_rq_time_bucket{ {{- $sel }}}[{{ $w }}]))) > {{ $g.warningLatencyMs }}
            and on ({{ $c }}envoy_cluster_name) {{ $traffic }} >= {{ $g.minRequestsPerSecond }}
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Route {{`{{ $labels.envoy_cluster_name }}`}} p99 latency is above {{ $g.warningLatencyMs }}ms"
            description: >-
              The 99th percentile of upstream response time for this route is above
              {{ $g.warningLatencyMs }}ms over {{ $w }}.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "EnvoyRouteP99LatencyHigh")) }}{{ . | nindent 12 }}{{- end }}
        - alert: EnvoyRouteP99LatencyCritical
          expr: >-
            histogram_quantile(0.99, sum by ({{ $b }}envoy_cluster_name, le) (rate(envoy_cluster_upstream_rq_time_bucket{ {{- $sel }}}[{{ $w }}]))) > {{ $g.criticalLatencyMs }}
            and on ({{ $c }}envoy_cluster_name) {{ $traffic }} >= {{ $g.minRequestsPerSecond }}
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.criticalSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Route {{`{{ $labels.envoy_cluster_name }}`}} p99 latency is above {{ $g.criticalLatencyMs }}ms"
            description: >-
              The 99th percentile of upstream response time for this route is above
              {{ $g.criticalLatencyMs }}ms over {{ $w }}.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "EnvoyRouteP99LatencyCritical")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.certificates.enabled }}
    {{- $g := .Values.groups.certificates }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    {{- $cns := default $ns $g.namespaceSelector }}
    - name: platform-alerts.certificates
      interval: {{ .Values.interval }}
      rules:
        # cert-manager's own series. A Certificate's namespace is the
        # `exported_namespace` label (the scrape's own `namespace` is
        # cert-manager's), which the emitters keep under honor_labels: false.
        # `> 0` skips a Certificate that has not been issued yet (0 means no
        # expiry known; NotReady below covers it).
        - alert: CertificateExpiringSoon
          expr: >-
            max by ({{ $b }}exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds{exported_namespace=~"{{ $cns }}"} > 0)
            - time() < {{ $g.warningDays }} * 86400
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Certificate {{`{{ $labels.exported_namespace }}`}}/{{`{{ $labels.name }}`}} expires in under {{ $g.warningDays }} days"
            description: >-
              cert-manager renews well before expiry, so a certificate this close has
              not been renewed: check the Certificate's conditions and its issuer.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "CertificateExpiringSoon")) }}{{ . | nindent 12 }}{{- end }}
        - alert: CertificateExpiryCritical
          expr: >-
            max by ({{ $b }}exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds{exported_namespace=~"{{ $cns }}"} > 0)
            - time() < {{ $g.criticalDays }} * 86400
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.criticalSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Certificate {{`{{ $labels.exported_namespace }}`}}/{{`{{ $labels.name }}`}} expires in under {{ $g.criticalDays }} days"
            description: >-
              The certificate is about to expire (or has). Whatever serves it will
              start failing TLS handshakes.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "CertificateExpiryCritical")) }}{{ . | nindent 12 }}{{- end }}
        - alert: CertificateNotReady
          expr: >-
            max by ({{ $b }}exported_namespace, name) (certmanager_certificate_ready_status{exported_namespace=~"{{ $cns }}", condition="True"}) == 0
          for: {{ $g.notReadyFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.warningSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Certificate {{`{{ $labels.exported_namespace }}`}}/{{`{{ $labels.name }}`}} has not been Ready for {{ $g.notReadyFor }}"
            description: >-
              The Certificate's Ready condition is not True. `kubectl describe
              certificate` and its CertificateRequest name the reason.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "CertificateNotReady")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.restarts.enabled }}
    {{- $g := .Values.groups.restarts }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    {{- $rns := default $ns $g.namespaceSelector }}
    - name: platform-alerts.restarts
      interval: {{ .Values.interval }}
      rules:
        # A container whose last termination was an OOM kill AND that has
        # restarted within `window`. `last_terminated_reason` keeps reading
        # OOMKilled for as long as the pod lives, so on its own it would
        # fire forever on a container that was killed once last week.
        - alert: ContainerOOMKilled
          expr: >-
            max by ({{ $b }}namespace, pod, container) (kube_pod_container_status_last_terminated_reason{namespace=~"{{ $rns }}", reason="OOMKilled"} == 1)
            and on ({{ $c }}namespace, pod, container)
            max by ({{ $c }}namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~"{{ $rns }}"}[{{ $g.window }}])) > 0
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.oomSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Container {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}}/{{`{{ $labels.container }}`}} was OOM-killed"
            description: >-
              The container restarted within the last {{ $g.window }} and its last
              termination reason is OOMKilled: its memory limit is too low or it leaks.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ContainerOOMKilled")) }}{{ . | nindent 12 }}{{- end }}
        - alert: ContainerRestartingOften
          expr: >-
            max by ({{ $b }}namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~"{{ $rns }}"}[{{ $g.restartWindow }}])) > {{ $g.maxRestarts }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.restartSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Container {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}}/{{`{{ $labels.container }}`}} restarted more than {{ $g.maxRestarts }} times in {{ $g.restartWindow }}"
            description: >-
              A restart rate this high that is not a crash loop yet (the upstream
              crash-loop alert needs the container to be waiting in back-off at the
              moment it evaluates) still means the container cannot stay up.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ContainerRestartingOften")) }}{{ . | nindent 12 }}{{- end }}
        # A crash loop too slow for the one above and for the upstream
        # KubePodCrashLooping: a container that dies every hour or two
        # restarts successfully each time, so it is never waiting in
        # back-off at the moment a rule looks and the back-off resets.
        # Only the restart counter over a long window sees it. Namespaces
        # matching `slowRestartExcludeNamespaces` (CI runners restart pods
        # by design) are left out; an empty value excludes nothing.
        - alert: ContainerRestartingSlowly
          expr: >-
            max by ({{ $b }}namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~"{{ $rns }}"{{ if $g.slowRestartExcludeNamespaces }}, namespace!~"{{ $g.slowRestartExcludeNamespaces }}"{{ end }}}[{{ $g.slowRestartWindow }}])) > {{ $g.slowMaxRestarts }}
          for: {{ $g.slowRestartFor }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.slowRestartSeverity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Container {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}}/{{`{{ $labels.container }}`}} restarted more than {{ $g.slowMaxRestarts }} times in {{ $g.slowRestartWindow }}"
            description: >-
              The container keeps dying and coming back, slowly enough that the
              crash-loop alerts never fire. Check `kubectl logs --previous` and
              the last termination reason and exit code of the container.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "ContainerRestartingSlowly")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
    {{- if .Values.groups.workloadAbsent.enabled }}
    {{- $g := .Values.groups.workloadAbsent }}
    {{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
    {{- $wns := default $ns $g.namespaceSelector }}
    - name: platform-alerts.workload-absent
      interval: {{ .Values.interval }}
      rules:
        # A Deployment that is supposed to run (spec replicas above zero)
        # and has none available. The upstream replicas-mismatch alert needs
        # the Deployment to have SOME replicas missing; this is the whole
        # workload gone, from a failed rollout, a quota, or a scale-down.
        - alert: DeploymentNoAvailableReplicas
          expr: >-
            max by ({{ $b }}namespace, deployment) (kube_deployment_status_replicas_available{namespace=~"{{ $wns }}"}) == 0
            and on ({{ $c }}namespace, deployment)
            max by ({{ $c }}namespace, deployment) (kube_deployment_spec_replicas{namespace=~"{{ $wns }}"}) > 0
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Deployment {{`{{ $labels.namespace }}`}}/{{`{{ $labels.deployment }}`}} has no available replicas for {{ $g.for }}"
            description: >-
              The Deployment wants replicas and none is available: the workload is
              down. Its pods' events and the ReplicaSet's conditions name why.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "DeploymentNoAvailableReplicas")) }}{{ . | nindent 12 }}{{- end }}
    {{- end }}
{{- end }}
{{- if or .Values.groups.podSecurity.enabled .Values.groups.podSecurityAudit.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ printf "%s-logs" (include "platform-alerts.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- toYaml (merge (dict "observability.rule-type" "vlogs") .Values.ruleLabels) | nindent 4 }}
spec:
  groups:
{{- if .Values.groups.podSecurity.enabled }}
{{- $g := .Values.groups.podSecurity }}
{{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
{{- $by := list }}
{{- if .Values.clusterLabel }}{{- $by = append $by .Values.clusterLabel }}{{- end }}
{{- $by = concat $by (list "namespace" "owner_kind" "owner_name") }}
{{- if .Values.ownerLabel }}{{- $by = append $by .Values.ownerLabel }}{{- end }}
{{- $renames := list }}
{{- if .Values.clusterLabel }}{{- $renames = append $renames (printf "k8s.cluster.name as %s" .Values.clusterLabel) }}{{- end }}
{{- $renames = concat $renames (list "k8s.namespace.name as namespace" "k8s.object.kind as owner_kind" "k8s.object.name as owner_name") }}
    - name: platform-alerts.pod-security
      type: vlogs
      interval: {{ .Values.interval }}
      rules:
        # A controller (ReplicaSet, StatefulSet, Job, DaemonSet) whose pod
        # create was refused by Pod Security admission.
        #
        # Evidence is the Kubernetes Event the controller records, which
        # `observability-emitters` ships to the log store (`otlp.events`,
        # the `k8s_events` receiver; fields `k8s.event.reason`,
        # `k8s.namespace.name`, `k8s.object.kind` / `.name` are the involved
        # object, here the controller). It is the only trace of the
        # rejection: kube-state-metrics exports no Event series, and the
        # Pod never exists, so nothing metric-shaped can see it. A bare Pod
        # create gets the error straight back and leaves no Event, so this
        # covers controllers, which is where it matters.
        #
        # `warn`-mode violations ("would violate") are not Events and are
        # not matched: only `enforce` makes the message "violates
        # PodSecurity". The window is longer than an eval because the
        # controller's Events are rate-limited on retry (about one per five
        # minutes once it backs off) and a rejection must not blink out
        # between two of them.
        - alert: PodSecurityAdmissionRejected
          expr: >-
            _time:{{ $g.window }} k8s.event.reason:="FailedCreate" "violates PodSecurity"
            | rename {{ join ", " $renames }}
            | stats by ({{ join ", " $by }}) count() as rejections
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Pod Security admission rejected pods of {{`{{ $labels.owner_kind }}`}} {{`{{ $labels.namespace }}`}}/{{`{{ $labels.owner_name }}`}}"
            description: >-
              {{`{{ $labels.owner_kind }}`}} {{`{{ $labels.namespace }}`}}/{{`{{ $labels.owner_name }}`}}
              could not create a pod in the last {{ $g.window }}: the namespace
              enforces a Pod Security level the pod template does not meet, so
              the workload is not running (or not at full strength). The Event's
              message names every violated control; `kubectl -n {{`{{ $labels.namespace }}`}}
              describe {{`{{ $labels.owner_kind }}`}} {{`{{ $labels.owner_name }}`}}` shows it
              ("violates PodSecurity ...: <control> (<container> must set ...)").
              Fix it in the workload by giving it a restricted securityContext
              (runAsNonRoot, allowPrivilegeEscalation=false, capabilities
              drop ALL, seccompProfile RuntimeDefault), or, if the workload
              needs more, give the namespace a reasoned, lower level in the
              cluster configuration. Clears by itself {{ $g.window }} after
              the last rejection.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "PodSecurityAdmissionRejected")) }}{{ . | nindent 12 }}{{- end }}
{{- end }}
{{- if .Values.groups.podSecurityAudit.enabled }}
{{- $g := .Values.groups.podSecurityAudit }}
{{- $omit := ternary $.Values.clusterLabel "" (and $g.keepClusterLabel (ne $.Values.clusterLabel "")) }}
{{- $by := list }}
{{- if .Values.clusterLabel }}{{- $by = append $by .Values.clusterLabel }}{{- end }}
{{- $by = append $by "namespace" }}
{{- $renames := list }}
{{- if .Values.clusterLabel }}{{- $renames = append $renames (printf "k8s.cluster.name as %s" .Values.clusterLabel) }}{{- end }}
{{- $renames = append $renames "audit.namespace as namespace" }}
    - name: platform-alerts.pod-security-audit
      type: vlogs
      interval: {{ .Values.interval }}
      rules:
        # Requests that Pod Security `audit` mode says would be refused at
        # `enforce`: the evidence to read BEFORE a namespace is switched.
        #
        # Evidence is the Kubernetes API server's audit log, which carries
        # the annotation `pod-security.kubernetes.io/audit-violations` on
        # the request that would have been refused. EKS offers no way out of
        # CloudWatch for it, so `observability-emitters` `cloudwatchLogs`
        # reads the audit stream, keeps only the events with that annotation
        # and lifts the event's own namespace into `audit.namespace` (the
        # record itself is filed under a platform namespace, never the
        # tenant's). The annotation text (which control, which container) is
        # in `audit.violations` and in the body.
        #
        # The filter is the FIELD `audit.violations:*` (set only by the
        # reader's `transform/audit`, and only when the event carries the
        # annotation), never the phrase: a free-text match also counts any
        # log line that merely mentions the annotation, such as the reader's
        # own startup log of its OTTL config.
        - alert: PodSecurityAuditViolations
          expr: >-
            _time:{{ $g.window }} audit.violations:*
            | rename {{ join ", " $renames }}
            | stats by ({{ join ", " $by }}) count() as violations
          for: {{ $g.for }}
          labels:
            {{- include "platform-alerts.labels" (dict "root" $ "severity" $g.severity "omit" $omit) | nindent 12 }}
          annotations:
            summary: "Pod Security audit violations in {{`{{ $labels.namespace }}`}}"
            description: >-
              Requests in namespace {{`{{ $labels.namespace }}`}} would be refused
              if the namespace's Pod Security level were `enforce`: {{`{{ $value }}`}}
              audited in the last {{ $g.window }}. Nothing is broken yet. The
              annotation names every violated control and the container: search
              the log store for `audit.namespace:"{{`{{ $labels.namespace }}`}}"` and
              read `audit.violations`. Fix the workload before the namespace
              switches to `enforce` (runAsNonRoot, allowPrivilegeEscalation=false,
              capabilities drop ALL, seccompProfile RuntimeDefault). Clears by
              itself {{ $g.window }} after the last violation.
            {{- with (include "platform-alerts.runbook" (dict "root" $ "alert" "PodSecurityAuditViolations")) }}{{ . | nindent 12 }}{{- end }}
{{- end }}
{{- end }}
