# The case `tenancy-authz` with every principal of `tenancy.principals` rewritten as an
# identity of `tenancy.identities` (docs/tenancy-authz.md has the mapping).
# tests/identities_test.go holds that it renders byte for byte what `tenancy-authz` does.
# Do not edit by hand: change `tenancy-authz` and rewrite.
global:
  cluster: {dnsDomain: cluster.example.}
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader: {enabled: true}
  authz:
    enabled: true
    securityPolicy:
      targetRefs:
      - {kind: HTTPRoute, name: observability-read}
    networkPolicy:
      gatewayFrom:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: example-gateway}
        podSelector:
          matchLabels: {app.kubernetes.io/name: envoy}
  identities:
  - name: k8s:viewer
    groups: ['cluster-a:k8s:viewer', 'cluster-b:k8s:viewer']
    reach:
      clusters:
      - {cluster: cluster-a, allNamespaces: true}
      - {cluster: cluster-b, allNamespaces: true}
  - groups: ['example:example-app:deployer']
    reach:
      clusters:
      - cluster: cluster-a
        namespaces: [example-app, other-app]
  - groups: ['cluster-a:example-app:reader']
    audience: reader
    workload:
      routes: [metrics]
      metricsQueryOnly: true
    reach:
      clusters:
      - cluster: cluster-a
        namespaces: [example-app]
vmalert: {enabled: false}
alertmanager: {enabled: false}
victoria-metrics-k8s-stack: {enabled: false}
victoria-logs-single: {enabled: false}
victoria-traces-single: {enabled: false}
