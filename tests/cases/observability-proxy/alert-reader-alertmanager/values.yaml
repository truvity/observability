# The Door half of the stack case of the same name (tests/cases/observability-stack/alert-reader-alertmanager):
# its values kept to the keys charts/observability-proxy declares, with
# `stackReleaseName` set to the stack's release name, so the render carries the
# names the stack's does.
stackReleaseName: observability-stack
ha: false
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  allowUnfilteredTraceReads: true
  allowUnfilteredAlertReads: true
  alertReaders:
  - name: example-reader
    tokenSecret:
      name: example-alerts-read-token
      key: token
    alertmanager: true
  principals:
  - group: example:k8s:viewer
    grants:
    - cluster: example-cluster
      allNamespaces: true
  writers:
  - name: metrics-agent
    tokenSecret:
      name: example-writer-token
      key: token
    destinations:
    - metrics
  - name: log-agent
    tokenSecret:
      name: example-writer-token
      key: token
    destinations:
    - logs
victoria-traces-single:
  server:
    extraArgs:
      servicegraph.enableTask: 'true'
