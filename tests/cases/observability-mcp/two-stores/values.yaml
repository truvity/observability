# Two stores and a Grafana in one install: each store is its own connector
# and its own pod. The second store reads only metrics and logs, holds one
# cluster, and lives behind a vmauth on another address.
issuerURL: https://issuer.example.com
proxy:
  image:
    tag: v0.0.1
stores:
  - name: primary
    resourceURL: https://mcp.example.com/victoria/primary
    clusters: [alpha, beta, gamma]
    vmauth: {url: "http://vmauth.monitoring.svc:8427"}
    outbound:
      tokenEndpoint: https://issuer.example.com/token
      clientId: observability-mcp-primary
      audience: primary-store
  - name: staging
    resourceURL: https://mcp.example.com/victoria/staging
    clusters: [delta]
    signals: {traces: false}
    vmauth: {url: "https://vmauth.staging.example.net:8427"}
    outbound:
      tokenEndpoint: https://issuer.example.com/token
      clientId: observability-mcp-staging
      audience: staging-store
grafana:
  enabled: true
  resourceURL: https://mcp.example.com/grafana
  url: http://grafana.monitoring.svc:80
  outbound:
    tokenEndpoint: https://issuer.example.com/token
    clientId: observability-mcp-grafana
    audience: grafana-workload
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway
  egress:
    issuer:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: issuer
    vmauth:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: vmauth
      - ipBlock:
          cidr: 198.51.100.0/24
    grafana:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
