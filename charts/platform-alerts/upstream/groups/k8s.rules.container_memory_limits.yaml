name: k8s.rules.container_memory_limits
rules:
- expr: kube_pod_container_resource_limits{resource="memory",job="kube-state-metrics"} * on(namespace,pod,__CLUSTER_LABEL__) group_left() max(kube_pod_status_phase{phase=~"Pending|Running"} == 1) by(namespace,pod,__CLUSTER_LABEL__)
  record: cluster:namespace:pod_memory:active:kube_pod_container_resource_limits
- expr: sum(sum(max(kube_pod_container_resource_limits{resource="memory",job="kube-state-metrics"}) by(namespace,pod,container,__CLUSTER_LABEL__) * on(namespace,pod,__CLUSTER_LABEL__) group_left() max(kube_pod_status_phase{phase=~"Pending|Running"} == 1) by(namespace,pod,__CLUSTER_LABEL__)) by(namespace,pod,__CLUSTER_LABEL__)) by(namespace,__CLUSTER_LABEL__)
  record: namespace_memory:kube_pod_container_resource_limits:sum
