name: k8s.rules.container_memory_rss
rules:
- expr: container_memory_rss{job="kubelet",metrics_path="/metrics/cadvisor",image!=""} * on(__CLUSTER_LABEL__,namespace,pod) group_left(node) topk(1, max(kube_pod_info{node!=""}) by(__CLUSTER_LABEL__,namespace,pod,node)) by(__CLUSTER_LABEL__,namespace,pod)
  record: node_namespace_pod_container:container_memory_rss
