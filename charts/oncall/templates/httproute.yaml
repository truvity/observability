{{- if .Values.httpRoute.enabled }}
{{- include "oncall.validate" . -}}
{{- /*
GoAlert's UI, API and integrations at `goalert.publicURL`. The relay is
never routed: only GoAlert calls it. GoAlert authenticates every request
itself (a session for people, an integration key for Alertmanager and
the other integrations), so the route needs no sign-in of its own.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "oncall.goalertName" . }}
  labels:
    {{- include "oncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: goalert
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "oncall.goalertName" . }}
          port: {{ .Values.service.port }}
{{- end }}
