apiVersion: v2
name: observability-mcp
description: >-
  Read-only Model Context Protocol connectors over the observability stores
  and Grafana: one Deployment per Victoria store (an aggregator over the
  stock metrics, logs and traces MCP servers) and one for Grafana's
  dashboards, each behind a resource-proxy that validates the caller's
  access token and holds the only credential downstream.
type: application
# Stamped from the tag by the release workflow; never moved by hand.
version: 0.0.0
appVersion: "0.0.0"
keywords:
  - mcp
  - observability
  - victoriametrics
  - kubernetes
home: https://github.com/truvity/observability
sources:
  - https://github.com/truvity/observability
