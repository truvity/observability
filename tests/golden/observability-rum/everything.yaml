            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Exceptions",
          "description": "Exceptions the browsers reported in the selected range, for the chosen app. A rise after a release is the first thing to read the table below for.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
