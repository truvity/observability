# expect: has no exact `telemetry_source=
# A match without a telemetry_source matcher aggregates arbitrary series.
global:
  cluster:
    dnsDomain: cluster.example.

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}

victoria-metrics-k8s-stack:
  vmsingle:
    spec:
      streamAggrConfig:
        rules:
          - match: '{__name__=~".+_total"}'
            interval: 1m
            outputs: [total]
            without: [instance]
