# `severities.critical.receiver` names a receiver kind this chart never
# configured. Alertmanager's route to it exists in the rendered
# manifest and looks like a route; it reaches nobody.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: example-slack-webhook, key: url}
  severities:
    critical: {receiver: pagerduty, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
