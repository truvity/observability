---
# Source: alert-ingress/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-ingress
  labels:
    app.kubernetes.io/name: alert-ingress
    app.kubernetes.io/instance: alert-ingress
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alert-ingress
      app.kubernetes.io/instance: alert-ingress
  policyTypes:
    - Egress
  egress:
    # 1. Alertmanager. The one thing this service is FOR reaching.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalertmanager
      ports:
        - protocol: TCP
          port: 80
    # 2. Cluster DNS, or rule 1 above cannot even be resolved.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 3. The cloud provider itself, for signature verification and
    # subscription confirmation. See the comment above this block.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

