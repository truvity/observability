apiVersion: batch/v1
kind: CronJob
metadata:
  name: observability-stack-backup-metrics-incremental
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    observability.backup: metrics
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: observability-stack
            app.kubernetes.io/instance: observability-stack
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/part-of: observability-stack
            observability.backup: metrics
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: vmsingle
                      app.kubernetes.io/instance: observability-stack-victoria-metrics-k8s-stack
          containers:
            - name: vmbackup
              image: "victoriametrics/vmbackup:v1.152.0"
              args:
                # vmbackup takes an instant snapshot through the store's
                # own API and uploads it. It is incremental BY
                # CONSTRUCTION: a destination that already holds a backup
                # gets only what changed, and there is no flag for it.
                - -storageDataPath=/vm-data
                - -snapshot.createURL=$(SNAPSHOT_CREATE_URL)
                - -dst=:s3,env_auth=true:example-backups/observability/metrics
              env:
                - name: VM_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: "observability-store-credentials"
                      key: "username"
                - name: VM_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "observability-store-credentials"
                      key: "password"
                # The snapshot endpoint is behind the store's own
                # `-httpAuth.*`, and deliberately not behind a
                # `-snapshotAuthKey`: an authKey REPLACES basic auth for
                # that endpoint rather than adding to it, and it travels
                # in the query string.
                - name: SNAPSHOT_CREATE_URL
                  value: "http://$(VM_USERNAME):$(VM_PASSWORD)@vmsingle-observability-stack-victoria-metrics-k8s-stack.observability.svc:8428/snapshot/create"
              envFrom:
                - secretRef:
                    name: "example-backup-credentials"
              volumeMounts:
                - name: store
                  mountPath: /vm-data
                  readOnly: true
          volumes:
            - name: store
              persistentVolumeClaim:
                claimName: "vmsingle-observability-stack-victoria-metrics-k8s-stack"
                readOnly: true

