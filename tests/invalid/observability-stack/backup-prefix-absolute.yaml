# expect: at '/backup/logs/prefix'
# A prefix is relative to `backup.destination`: a leading `/` would put a
# double slash into the URL, and the object key it names is not the one
# an object-store policy granted.

# The minimum receiver that keeps the "no receiver configured" refusal
# (Alertmanager is on by default) from preempting this fixture's own.
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}

backup:
  enabled: true
  destination: s3://example-backups/observability
  credentialsSecret: example-backup-credentials
  logs:
    prefix: /logs
