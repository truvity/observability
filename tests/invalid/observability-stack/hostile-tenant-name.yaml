tenancy:
  issuerUrl: https://issuer.example
  logsTenantField: kubernetes.namespace_labels.tenancy.example.com/project
  logsEnvField: env
  principals:
    - group: example:k8s:viewer
      grants:
        - env: devel
          allTenants: true

# A tenant name is interpolated into a filter expression. `dms|prod`
# would not look odd in the rendered filter — it would grant a second
# tenant. Such a name is refused, never escaped.
tenancy:
  issuerUrl: https://issuer.example
  logsTenantField: kubernetes.namespace_labels.tenancy.example.com/project
  logsEnvField: env
  principals:
    - group: example:dms:deployer
      grants:
        - env: devel
          tenants: ["dms|prod"]
