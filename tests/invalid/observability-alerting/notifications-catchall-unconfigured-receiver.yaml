# expect: notifications.catchAll.receiver is "pager", which is neither
# A catch-all naming a receiver that does not exist is a route to nowhere
# for every alert no tier claimed.
# No proxy: no principals to admit, so none of the tenancy refusals
# apply and none can preempt this fixture's own.
stackReleaseName: observability-stack
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
  catchAll:
    receiver: pager
    channel: '#all'
