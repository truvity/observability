# The `everything` case plus `ownerLabel`: the aggregating rules keep `owner`
# in their by (...) so an alert can be routed on it.
nameOverride: alerts
ruleLabels:
  vmalert: platform
commonLabels:
  tenant: example
  env: example
runbookBaseUrl: https://runbooks.example.com/
interval: 30s
namespaceSelector: "example-.*"

stores:
  - name: metrics
    rowsMetric: example_rows_inserted_total
    freeSpaceMetric: example_free_disk_space_bytes
    freeSpaceLimitMetric: example_free_disk_space_limit_bytes
  - name: logs
    rowsMetric: example_log_rows_ingested_total

groups:
  backups:
    enabled: true
    maxSuccessAge: 50h
    severity: warning
    failedSeverity: info
  writePath:
    enabled: true
    window: 10m
    for: 20m
    severity: warning
  volumes:
    enabled: true
    minCapacityRatio: 0.25
    severity: warning
  storeLimits:
    enabled: true
    headroomFactor: 3
    severity: critical
  pendingPods:
    enabled: true
  nodeClaims:
    enabled: true
  kargo:
    enabled: true
    for: 20m
    severity: warning
    absentFor: 45m
    absentSeverity: info
ownerLabel: owner
