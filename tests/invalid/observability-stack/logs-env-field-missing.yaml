# The other half of the same statement. The environment reaches the log
# store under whatever name the agent was told to add it as, and a filter
# naming any other one returns nothing at all, silently.
tenancy:
  issuerUrl: https://issuer.example
  logsTenantField: kubernetes.namespace_labels.tenancy.example.com/project
  principals:
    - group: example:k8s:viewer
      grants:
        - env: devel
          allTenants: true
