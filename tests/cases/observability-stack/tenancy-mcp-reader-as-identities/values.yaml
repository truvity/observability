# The case `tenancy-mcp-reader` with every principal of `tenancy.principals` rewritten as an
# identity of `tenancy.identities` (docs/tenancy-authz.md has the mapping).
# tests/identities_test.go holds that it renders byte for byte what `tenancy-mcp-reader` does.
# Do not edit by hand: change `tenancy-mcp-reader` and rewrite.
global:
  cluster: {dnsDomain: cluster.example.}
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  allowUnfilteredAlertReads: true
  allowUnfilteredTraceReads: true
  allowUnfilteredMetricMetadata: true
  identities:
  - groups: ['example:mcp:reader']
    audience: example-mcp-reader
    workload: {vmalertAPI: true}
    reach:
      clusters:
      - {cluster: example-cluster, allNamespaces: true}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret: {name: example-slack-bot, key: token}
  severities:
    critical: {receiver: slack, channel: '#alerts-critical'}
    warning: {receiver: slack, channel: '#alerts'}
victoria-metrics-k8s-stack: {enabled: false}
victoria-logs-single: {enabled: false}
victoria-traces-single:
  enabled: true
  server:
    persistentVolume: {enabled: false}
