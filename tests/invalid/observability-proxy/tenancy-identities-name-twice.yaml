# expect: the name "viewers" appears twice in `tenancy.identities`
# The same name written twice: one VMUser name, two reaches, one silently not applied.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: viewers
      groups: [example:other]
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]
    - name: viewers
      groups: [example:viewers]
      reach:
        clusters:
          - cluster: cluster-a
            namespaces: [example-app]

victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
