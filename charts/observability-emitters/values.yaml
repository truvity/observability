# observability-emitters — per-cluster collection.
#
# Three emitters, each optional, each writing to every destination it is
# given with its own on-disk buffer, and each stamping the same three
# dimensions on everything it collects.
#
# Three things to know before reading further.
#
# FIRST, and it is the whole point of this chart: THE SCOPING KEY IS
# STAMPED HERE AND NOWHERE ELSE. Every series, log stream and span carries
# the CLUSTER and the NAMESPACE under OpenTelemetry's names — the cluster
# from this values file, the namespace from the pod the emitter resolved
# the data to — and an application that sets either itself has it
# overwritten rather than merged. Query-time isolation in
# charts/observability-stack is only as good as this: a workload that
# could choose its own namespace could write into another team's data or
# hide its own from the people responsible for it. Every setting below
# that could weaken that is a refusal in templates/_validate.tpl, not a
# default.
#
# The third dimension, the environment tier, is DESCRIPTIVE: it rides on
# every signal so a dashboard can pin it, and it is never a key, because
# two clusters can share a tier and a filter on it would select both.
#
# SECOND: REPLICATION IS THE WRITER'S JOB. No store in this family
# replicates across a zone in a way that survives one, so each emitter
# sends every sample to every destination and keeps a per-destination
# buffer on disk. That buffer has to be backed by a volume that outlives
# the pod, or a rollout is a gap in the data — and it is a gap nothing
# reports. The chart refuses a buffer with nothing behind it.
#
# THIRD: the three emitters exist because our own software and everything
# else are wired differently ON PURPOSE. Applications speak OpenTelemetry
# and know nothing about a store; infrastructure and third-party components
# are taken as they come — a Prometheus endpoint through a scrape object, a
# container's stdout through the log agent. Collapsing the two into one
# path means either instrumenting components we do not own or teaching our
# own software a store's protocol. See docs/doctrine.md.

# -- Name overrides for the objects this chart renders itself.
nameOverride: ""
fullnameOverride: ""

# -- The one interval.
#
# It is the scrape interval of the metrics agent and — through
# `-dedup.minScrapeInterval` on the store, which charts/observability-stack
# sets from its own `interval` — the deduplication window that reads it
# back. The two are one number: a dedup window wider than the scrape
# interval silently discards good samples, and a narrower one deduplicates
# nothing. Neither says anything at the time.
interval: 30s

# Tenancy: the two values that are constant for the cluster.
#
# The names the emitters stamp are NOT values. They are OpenTelemetry's,
# spelled the way each store can carry them, and `pkg/tenancy` filters on
# the same spellings — so a key that could be changed here is a key that
# could stop matching the filter, which is an empty result rather than an
# error. What each writer stamps:
#
#   dimension   metrics label                  log field (both writers)       span attribute
#   cluster     k8s_cluster_name               k8s.cluster.name               k8s.cluster.name
#   namespace   k8s_namespace_name             kubernetes.pod_namespace       k8s.namespace.name
#   tier        deployment_environment_name    deployment.environment.name    deployment.environment.name
#
# The namespace needs no value: it is the namespace of the pod the data
# came from, which every emitter can see. The log field for it is the
# container-log agent's native spelling rather than the convention's,
# because that agent cannot rename a field and the gateway can — so the
# gateway yields, and writes that spelling on its log pipeline beside the
# conventional one. The Helm release (`app.kubernetes.io/instance`) passes
# through on every path for navigation and is never a key.
tenancy:
  # -- This cluster's name. Required, and matched exactly by every grant
  # the proxy injects: it is half of the scoping key, so it is the
  # estate's own vocabulary and not a display name.
  cluster: ""
  # -- This cluster's environment tier: the value of
  # `deployment.environment.name`. The convention's well-known values are
  # `production`, `staging`, `development` and `test`; any plain name is
  # accepted. Required, and never a key — several clusters may share it.
  environment: ""
  # -- OPT-IN (empty, the default, renders nothing): which COMPANY owns a
  # workload, as `owner` on every series, OTLP log record and span — the
  # label an Alertmanager route reads to send an alert to the right team's
  # chat. A map of owner name to the namespaces it owns; a pattern is a
  # namespace name, `*` standing for any run of namespace characters:
  #
  #   owners:
  #     acme: [checkout, "payments-*"]
  #     globex: ["globex-*"]
  #
  # Derived from the namespace the data came from, never from anything an
  # application says (an `owner` it sends is removed first). `owner` is NOT
  # a scoping key: no grant selects on it. Metrics get it from the metrics
  # agent just before sending, so it is correct on kube-state-metrics,
  # cAdvisor and kubelet series too; the OTLP gateway stamps logs and
  # spans (and OTLP metrics) the same way. The container-log agent cannot
  # stamp per namespace, so container logs carry no `owner`; see
  # docs/tenancy-owner.md.
  owners: {}
  # -- The owner of everything no pattern matches, including cluster-scoped
  # series with no namespace. Empty: such series carry no `owner` label.
  # Refused unless `owners` is non-empty.
  defaultOwner: ""

# -- The credential every emitter writes with.
#
# One bearer token for the cluster, delivered as the NAME of a Secret the
# estate created. The chart mounts it three different ways because the
# three agents accept it three different ways — a Secret reference for the
# metrics agent, a file for the log agent, an environment variable
# interpolated into a header for the gateway — and that is worth knowing
# once rather than discovering per agent.
#
# It is a bearer and not a person's token on purpose: a writer has no
# identity to scope and nothing to read.
writeCredentials:
  # -- Name of the Secret. It must exist in the release's namespace before
  # the emitters start; the chart neither creates it nor reads it.
  #
  # Refused non-empty together with `remote` (below): the two are the same
  # fact, and `remote.tokenSecret` is the one to set once `remote` is in
  # use.
  secretName: ""
  # -- The key inside it holding the token.
  key: token

# -- The single-destination sugar: one URL, one token, one optional CA,
# for however many of the three signals a cluster with no store of its
# own is writing ALL of to the SAME place — the common shape for a
# cluster that runs charts/observability-emitters but not
# charts/observability-stack (docs/target-state.md, "Central install,
# remote writers").
#
# Off (empty) by default. Setting `url` turns it on, and the chart
# expands it into the low-level destinations below FOR the signals
# named in `signals` — never both forms for the same signal at once;
# see each destination list's own refusal.
#
#   remote:
#     url: https://observability-write.example.private
#     tokenSecret: {name: observability-write-token, key: token}
#     caSecret: {name: observability-write-ca, key: ca.crt}
#
# is exactly `metrics.destinations`, `otlp.destinations.metrics`,
# `otlp.destinations.logs` and `otlp.destinations.traces` each holding
# one entry at this url/caSecret (`writeCredentials` set to
# `tokenSecret`) — compare tests/cases/observability-emitters/
# remote-tls-destination (the low-level form of the same install) with
# tests/cases/observability-emitters/remote-single-destination (this
# form): the two render identically apart from the destination `name`.
#
# WHAT THIS DOES NOT REACH, and the one place the simplification stops:
# `victoria-logs-collector.remoteWrite` (the container-log DaemonSet's
# OWN write path) is a REAL Helm subchart's values — Helm coalesces a
# subchart's values before any template runs, so this chart cannot
# write into it the way it writes `metrics.destinations` and
# `otlp.destinations.*` (both this chart's OWN values, computable at
# render time; docs/doctrine.md's note on mirrors). `signals: [logs]`
# still only reaches `otlp.destinations.logs` — the OTLP-received
# application-log path — never the log AGENT's own remoteWrite, which
# stays exactly as low-level as it always was, `remote` in use or not
# (see `victoria-logs-collector.remoteWrite`'s own comment below).
remote:
  # -- The base URL every covered signal writes to: no path — each
  # destination appends its own (`/api/v1/write` for the metrics agent,
  # nothing for the OTLP gateway's own exporters, which already append
  # theirs). Empty means off.
  url: ""
  # -- The one bearer, in place of `writeCredentials` (refused set
  # together with this).
  tokenSecret:
    name: ""
    key: token
  # -- OPTIONAL. A Secret holding a PEM CA bundle to trust for `url`'s
  # TLS, for a certificate that is not publicly trusted (a private/
  # estate root) — the same shape and the same meaning as a low-level
  # destination's own `caSecret`, applied to every signal this expands
  # into.
  caSecret: {}
  # -- Which of the three low-level forms this expands into. Every
  # signal listed must have its OWN low-level list empty (refused
  # otherwise); a signal left OUT is untouched, and an enabled emitter
  # that ends up with no destination anywhere still refuses exactly as
  # it always has (`observability-emitters.validate.destinations`).
  signals: [metrics, logs, traces]
  # -- The `name:` every generated destination entry carries — an
  # exporter id and a queue directory, the same as any low-level
  # destination's own `name`.
  name: remote

###############################################################################
# The metrics agent: vmagent, as a VMAgent object the operator reconciles.
###############################################################################
metrics:
  enabled: true
  # -- Where to write. One entry per store replica; every sample goes to
  # every entry.
  #
  #   destinations:
  #     - name: zone-a
  #       url: https://metrics-a.example/api/v1/write
  #     - name: zone-b
  #       url: https://metrics-b.example/api/v1/write
  #
  # An empty list is refused rather than rendering an agent that scrapes
  # the cluster and writes nowhere — which is a healthy pod, a full buffer
  # and no data.
  #
  # One more field, optional, for a `url` whose certificate is not
  # publicly trusted — a REMOTE store behind a private-CA gateway, for
  # instance:
  #
  #   destinations:
  #     - name: central
  #       url: https://observability-write.example.private/api/v1/write
  #       caSecret: {name: example-private-ca, key: ca.crt}
  #
  # `caSecret` names a Secret holding a PEM bundle; this chart takes the
  # NAME and never a value. The operator mounts it directly onto this
  # destination's own `remoteWrite[].tlsConfig.ca.secret` — no volume for
  # this chart to wire, unlike the OTLP gateway's own destinations below.
  destinations: []
  image:
    repository: victoriametrics/vmagent
    tag: v1.152.0
  replicaCount: 1
  # -- CPU request sized from measurement, no CPU limit, memory request ==
  # memory limit. Measured on a three-cluster install, the agent's p95 was
  # about 15m and its max about 31m; 100m is 1.5 x p95 rounded up with
  # headroom for a restart that replays the persistent queue. There is no
  # CPU limit, so a replay takes idle cores instead of being throttled,
  # and the memory request equals its limit, which keeps the agent out of
  # the kubelet's first eviction tier at the moment its buffer is holding
  # the data. To get the Guaranteed class back, write a whole-number CPU
  # limit equal to a whole-number request.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi
  # -- The persistent queue.
  #
  # Under the operator the queue lands on `/tmp` unless the agent runs in
  # stateful mode, and `/tmp` is emptyDir: every rollout drops whatever had
  # not been delivered, and on a node with an ephemeral-storage budget it
  # counts against that budget as well. This chart always renders
  # `statefulMode: true`; what is configurable is how much disk the queue
  # gets.
  #
  # Size it in multiples of 500MB — the chunk size — with at least 500Mi
  # per destination. The operator divides `requests.storage` by the number
  # of remote-write destinations to derive `-remoteWrite.maxDiskUsagePerURL`.
  queue:
    size: 10Gi
    storageClassName: ""
  scrape:
    # -- The node's own two endpoints, as inline scrape configs. Everything
    # else this agent collects arrives as a PodMonitor or a ServiceMonitor
    # authored by the chart that owns the thing being watched.
    kubelet: true
    cadvisor: true
    # -- Store the cadvisor series under `job="kubelet"` (with the
    # `metrics_path="/metrics/cadvisor"` label that tells them from the
    # kubelet's own), the kube-prometheus / kubernetes-mixin convention the
    # k8s-stack's default recording rules (`k8s.rules.container_*`) and the
    # mixin dashboards select on. `false` keeps the pre-0.13.0
    # `job="cadvisor"`; any query of yours that selected that label then
    # keeps working, and those recording rules keep matching nothing.
    cadvisorAsKubeletJob: true
    # -- Node labels to copy onto every kubelet and cadvisor series, by
    # name. Empty is the default, and the node's own `node` label is always
    # present. Opt-in rather than a `labelmap` of every node label because
    # those labels belong to the cloud provider: on EKS there are around
    # forty, which puts every node series past the store's
    # `-maxLabelsPerTimeseries` -- where it is IGNORED and the write still
    # answers 200.
    nodeLabels: []
    # -- A default DROP for the cadvisor scrape's OWN never-queried,
    # high-cardinality series — cadvisor only, never the kubelet job:
    # every pod recreation mints a fresh cadvisor series through its
    # identity labels (`id`, the cgroup path; `uid`; `container`;
    # `image`), and measured against a real install this is where most
    # of a store's new-series churn comes from (cadvisor plus
    # kube-state-metrics accounted for ~97% of series minted in a day,
    # cadvisor alone ~114k of them). The TSDB's own `requestsCount` —
    # how often each metric name was ever read by a query — showed
    # these never read even once: `container_tasks_state`,
    # `container_memory_failures_total`,
    # `container_blkio_device_usage_total`, and nearly every `_bucket`
    # histogram series cadvisor emits, with one exception,
    # `go_sched_latencies_seconds_bucket`, which IS heavily queried and
    # is kept. `id` (the cgroup path) is cleared on every SURVIVING
    # cadvisor series that already carries a non-empty `container`
    # label — NOT unconditionally: cadvisor also exports node-level
    # cgroups that are neither a pod nor a container (the root `id:
    # "/"`, `/kubepods.slice` and its QoS children,
    # `/system.slice/containerd.service`, `/system.slice/kubelet.service`,
    # and more), every one of them with `container=""` and `pod=""`,
    # where `id` is the ONLY label telling them apart. Clearing `id`
    # unconditionally merges every one of those, on one node, into ONE
    # identical label set, and vmagent/vmsingle deduplication then
    # keeps an arbitrary sample — silent data corruption, not a churn
    # saving. `container` non-empty is what makes `id` redundant:
    # (`namespace`, `pod`, `container`) already names the series once
    # `container` is set, so `id` adds nothing. Nothing this chart
    # ships — no dashboard in charts/observability-dashboards, no rule
    # in charts/platform-alerts — groups, filters or joins on `id`.
    # `pod`, `namespace`, `container` and `uid` are left alone:
    # dashboards and rules use them.
    #
    # Off (`enabled: false`) restores every one of these series exactly
    # as cadvisor emits them. `metricNames` and `keepBucketMetrics` are
    # each REPLACED wholesale by a consumer who sets that key —
    # ordinary Helm list semantics — so widen either default without
    # losing it by adding to `extraMetricNames` / `extraKeepBucketMetrics`
    # instead, which this chart concatenates onto the base list rather
    # than replacing it.
    #
    # See docs/reference.md and docs/safety.md for the measurement this
    # default is built from, and CHANGELOG.md's `0.9.1` entry for
    # exactly which metrics stop being stored by default.
    cadvisorDrop:
      enabled: true
      # -- Exact metric names, matched against `__name__` and dropped
      # outright.
      metricNames:
        - container_tasks_state
        - container_memory_failures_total
        - container_blkio_device_usage_total
      # -- Added to `metricNames` above rather than replacing it.
      extraMetricNames: []
      # -- Every cadvisor `_bucket` histogram series is dropped as
      # well, EXCEPT the names listed here.
      keepBucketMetrics:
        - go_sched_latencies_seconds_bucket
      # -- Added to `keepBucketMetrics` above rather than replacing it.
      extraKeepBucketMetrics: []
  # -- Anything else in the VMAgent spec, merged over what this chart
  # renders.
  #
  # It is an escape hatch and it is guarded: the settings that make the
  # agent stop stamping the scoping key, stop replicating or stop buffering
  # are refused here as firmly as they would be anywhere else, because an
  # escape hatch that can turn off the security property is not an escape
  # hatch, it is the door.
  spec: {}

###############################################################################
# The log agent: vlagent, from upstream's own chart.
#
# It collects container stdout and stderr and NOTHING ELSE. Kubernetes
# Events are not logs on a node's disk — they come from the gateway's
# `k8s_events` receiver below. Getting that backwards produces an install
# where Events are simply absent and nothing says so.
###############################################################################
logs:
  enabled: true

###############################################################################
# kube-state-metrics: the cluster's own object state, as upstream's chart.
#
# OFF BY DEFAULT, unlike the other three. Every one of them is something
# only this chart can do; this one is something a cluster may already have
# — an estate that already runs a shared kube-state-metrics for its whole
# fleet would get a SECOND install of the same series, and every rate() or
# sum() over the doubled series is silently twice what it should be. That
# is the exact failure charts/observability-stack's own vendored copy is
# left disabled to avoid (see its values.yaml); the same reasoning is why
# this one asks rather than assumes.
#
# ONE PER CLUSTER, here rather than in charts/observability-stack: it
# needs cluster-wide read RBAC the same way the metrics agent's kubelet
# and cAdvisor scrapes do, it has to exist on every cluster this chart is
# installed on regardless of whether that cluster hosts a store, and
# charts/observability-stack does not — a central cluster may host the
# STORES for many clusters, each of which still runs only its own
# emitters.
kubeStateMetrics:
  # -- Off by default; see above. Turning this on grants a ClusterRole
  # that reads every object of every kind in `kube-state-metrics.collectors`
  # below, cluster-wide — every namespace, not only this release's own.
  # That is what kube-state-metrics IS, and it is not defaulted on.
  enabled: false
  # Named presets, each turning kube-state-metrics' own
  # `customResourceState` feature onto one CRD family this chart already
  # knows how to shape, without asking for the ~40-line block by hand.
  customResources:
    # -- Kargo's own Stage and Promotion objects, as two metrics:
    # `kargo_stage_condition{namespace,stage,type,reason}` (a Gauge over
    # `status.conditions[]`) and `kargo_promotion_phase{namespace,
    # promotion,stage,phase}` (a StateSet over `status.phase`'s six
    # values), both with `metricNamePrefix: ""` — the exact shape
    # `charts/platform-alerts`' own `groups.kargo` (docs/reference.md)
    # is written to read. Off by default: nothing here reads a Kargo
    # object unless this is on, and turning it on grants ONLY
    # `get`/`list`/`watch` on `stages.kargo.akuity.io` and
    # `promotions.kargo.akuity.io` — no other apiGroup, no write verb.
    #
    # MECHANISM NOTE: this chart cannot compute
    # `kube-state-metrics.customResourceState.config` or `kube-state-
    # metrics.rbac.extraRules` from this flag the way it computes its
    # own objects — Helm coalesces a subchart's values before any
    # template runs (see docs/doctrine.md's note on mirrors), so a
    # parent chart cannot write into either one. What this chart CAN
    # do, and does: point `customResourceState` at a ConfigMap this
    # chart renders itself (`create: false`, an empty `resources: []`
    # config when this is off, the Kargo shape above when it is on —
    # see templates/kubestatemetrics-customresourcestate.yaml), and
    # grant the two extra verbs through a ClusterRole of this chart's
    # OWN, bound to kube-state-metrics' ServiceAccount, rather than
    # through `rbac.extraRules` (see templates/
    # kubestatemetrics-kargo-rbac.yaml). Both are ordinary objects this
    # chart owns, not a subchart value, which is what makes them
    # computable from this flag at all.
    #
    # The one cost of that mechanism, paid whenever `kubeStateMetrics.
    # enabled` is true regardless of this flag: `kube-state-metrics.
    # customResourceState.enabled` and `.create` are pinned by this
    # chart's own defaults (`true` / `false`), so a consumer-authored
    # `kube-state-metrics.customResourceState.config` would silently
    # stop being the config kube-state-metrics actually reads — refused
    # at render instead, by `observability-emitters.validate.
    # kubeStateMetrics` in _validate.tpl.
    kargo:
      enabled: false
    # -- Karpenter's NodeClaims (`nodeclaims.karpenter.sh`,
    # `karpenter.sh/v1`) as one metric,
    # `nodeclaim_status_condition{nodeclaim,nodepool,type,reason}` (a Gauge
    # over `status.conditions[]`: 1 when the condition is True, 0 when False
    # or Unknown), `metricNamePrefix: ""` — the shape
    # `charts/platform-alerts`' `groups.nodeClaims` reads. For a cluster
    # whose nodes Karpenter provisions, including EKS Auto Mode, where
    # Karpenter's own metrics cannot be scraped but its NodeClaim objects
    # can be read. Six condition series per NodeClaim, and a NodeClaim is
    # one per node. Off by default; turning it on grants ONLY
    # get/list/watch on `nodeclaims.karpenter.sh`. Same mechanism as
    # `kargo` above (ConfigMap + ClusterRole of this chart's own).
    nodeClaims:
      enabled: false

###############################################################################
# node-exporter: the node's own hardware and kernel metrics, as upstream's
# chart.
#
# OFF BY DEFAULT, for two reasons. It is a DaemonSet of privileged-looking
# pods (host network, host PID, the host's root filesystem read-only), which
# is something an estate opts into, and a cluster may already run one — a
# second install exports every `node_*` series twice, and every rate() or
# sum() over them is silently double, the same failure `kubeStateMetrics`
# above and charts/observability-stack's disabled copy exist to avoid.
#
# ONE PER NODE, here rather than in charts/observability-stack for the log
# agent's reason: it is a node agent, it has to exist on every cluster this
# chart is installed on whether or not that cluster hosts a store, and it
# is scraped by this chart's own metrics agent.
#
# What turning it on gives: `job="node-exporter"` (the kube-prometheus
# convention the node-exporter dashboard and the k8s-stack's `node.rules`
# and `kube-prometheus-node-recording.rules` select on), `instance` and
# `node` both the node's name, and the cluster and tier stamped like every
# other series. The node series carry no `k8s_namespace_name`, the same as
# the kubelet's and cAdvisor's node-level series: a node belongs to no
# namespace, so only a grant on all namespaces of this cluster reads them.
# The series do keep the `namespace` and `pod` of the node-exporter pod
# itself, because `node.rules` joins on them to find each series' node.
nodeExporter:
  # -- Off by default; see above. Everything else is the vendor's own values
  # shape under `prometheus-node-exporter` at the bottom of this file.
  enabled: false

###############################################################################
# The OpenTelemetry gateway.
#
# Everything our own software emits arrives here over OTLP — traces, and
# whatever logs and metrics a product chooses to send — together with
# Kubernetes Events and the OTLP a third-party component happens to offer.
# It is a StatefulSet rather than a Deployment because each replica owns a
# persistent queue, and a ReadWriteOnce volume cannot be shared by two.
###############################################################################
otlp:
  enabled: true
  # -- Pod security context for the gateway. The default exists because
  # the queue volume must be writable by the collector: a dynamically
  # provisioned volume arrives owned by root, the image does not run as
  # root, and `fsGroup` is what bridges the two. Replace it wholesale if
  # your cluster's policy says otherwise -- but a gateway with no fsGroup
  # cannot create its queue directory and exits at startup.
  podSecurityContext:
    fsGroup: 10001
    # The collector image runs as this user already; naming it is what lets
    # the kubelet verify `runAsNonRoot`, which Pod Security `restricted`
    # requires.
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  # -- Container security context for the gateway (Pod Security
  # `restricted`): no privilege escalation, no capabilities. The queue
  # volume is the only writable path it needs.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # -- Where the gateway may run. Empty means wherever the scheduler puts
  # it, which is correct on an untainted cluster and wrong on one where the
  # only nodes a workload should use carry a taint: the gateway then lands
  # on whatever is left, which tends to be the pool that is cheapest to
  # reclaim -- and this is a StatefulSet whose queue volume does not want
  # to be moved. The metrics agent takes the same settings through
  # `metrics.spec` and the log agent through its own subchart, so this is
  # the third of three rather than a new idea.
  nodeSelector: {}
  # -- Taints the gateway tolerates. NOT the log agent's blanket
  # `operator: Exists`: that one is a node agent and has to run everywhere,
  # while this is one replica per queue volume and should be placed
  # deliberately.
  tolerations: []
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.161.0
  replicaCount: 2
  # -- CPU request sized from measurement, no CPU limit, memory request ==
  # memory limit. Measured on a three-cluster install, the collector's p95
  # was under 5m and its max under 10m per replica; 50m is well above
  # 1.5 x p95 (the 10m floor would be too tight for a burst of events or a
  # restart that drains the queue). No CPU limit, so a burst is not
  # throttled. To get the Guaranteed class back, write a whole-number CPU
  # limit equal to a whole-number request.
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 1Gi
  # -- The persistent queue, one volume per replica.
  #
  # Two mechanisms live on it, because the exporters do not agree: the OTLP
  # exporters use a `sending_queue` backed by the `file_storage` extension,
  # and the Prometheus remote-write exporter — which has no `sending_queue`
  # at all — uses its own write-ahead log. Both are on this volume.
  queue:
    size: 10Gi
    storageClassName: ""
  # -- Where each signal goes. Three lists because three stores.
  #
  #   destinations:
  #     metrics:
  #       - name: zone-a
  #         url: https://metrics-a.example
  #     logs:
  #       - name: zone-a
  #         url: https://logs-a.example
  #     traces:
  #       - name: zone-a
  #         url: https://traces-a.example
  #
  # A base URL, not an endpoint: each exporter appends the path its store
  # documents, so a typo in a path cannot become a silent 404 — and a 404
  # is permanent loss, not a retry.
  #
  # Each entry also takes the same optional `caSecret: {name, key}` as
  # `metrics.destinations` above, for a `url` whose certificate is not
  # publicly trusted. Unlike the metrics agent, the gateway is an
  # OpenTelemetry Collector with no Secret access of its own: this chart
  # mounts the named key as a file (one volume per destination that sets
  # it) and points that destination's own exporter at it — a `caSecret`
  # on one destination cannot end up read by another's.
  destinations:
    metrics: []
    logs: []
    traces: []
  # -- Which resource attributes become log STREAM fields in the log store.
  #
  # This list is mandatory and is refused empty. With no `VL-Stream-Fields`
  # header VictoriaLogs treats EVERY resource attribute as a stream field,
  # and the resource attributes of an OpenTelemetry SDK include the pod's
  # UID and its start time — so every pod restart mints a new stream, and a
  # store whose stream count grows without bound degrades until it stops.
  #
  # Only attributes that are constant for the lifetime of a pod may appear.
  # The chart holds the list of those and refuses anything else: `ip`,
  # `user_id` and `trace_id` on a stream are the documented way to wreck
  # this store, and nothing about it looks wrong for the first week. The
  # two scoping keys are required; the Helm release label is a pod-level
  # field and is refused here — it is navigation, not a stream.
  streamFields:
    - k8s.cluster.name
    - kubernetes.pod_namespace
    - service.name
  events:
    # -- Kubernetes Events, through the `k8s_events` receiver.
    #
    # This is the one emitter that reads a cluster-scoped API, so it is the
    # one with a ClusterRole of its own. It is also the one that must not
    # run twice: every replica watching the same Events ingests all of
    # them, so the chart renders a leader-election lease whenever this is
    # on, and only the holder reads.
    enabled: true
  service:
    # -- The address applications send OTLP to. Both protocols, because an
    # SDK's default differs by language.
    grpcPort: 4317
    httpPort: 4318
  # -- Self-monitoring, as a PodMonitor.
  #
  # The gateway has no operator to scrape it and no Service on its
  # telemetry port, so the chart authors the object — as a PodMonitor, the
  # Prometheus Operator kind, like every other scrape object on the
  # cluster. The counters worth an alert are
  # `otelcol_exporter_send_failed_*` and `otelcol_exporter_enqueue_failed_*`:
  # a queue that is dropping is the failure this whole shape exists to
  # prevent.
  podMonitor:
    enabled: true
    extraLabels: {}

###############################################################################
# Self-monitoring for the metrics agent.
###############################################################################
selfMonitor:
  # -- Render a PodMonitor for the metrics agent, and tell the operator not
  # to scrape it with a kind of its own.
  #
  # The operator's default is to create a VMServiceScrape for every VMAgent
  # it reconciles. This chart turns that off and writes a PodMonitor
  # instead, for the same reason every other scrape object on the cluster
  # is a PodMonitor: the agent under it has to stay replaceable, and it
  # only stays replaceable while nothing depends on this vendor's scrape
  # kinds. See docs/doctrine.md.
  enabled: true
  extraLabels: {}

###############################################################################
# Upstream charts.
#
# Everything below is the vendor's own values shape. This chart reads these
# keys back and refuses the combinations that fail silently, so they are
# the surface for the log agent rather than a second set of keys that would
# have to be kept in step with them.
###############################################################################

# -- victoria-logs-collector: vlagent, as a DaemonSet.
victoria-logs-collector:
  # -- Where to write. One entry per log store replica; every line goes to
  # every entry, each with its own buffer under `extraArgs.tmpDataPath`.
  #
  #   remoteWrite:
  #     - url: https://logs-a.example
  #       maxDiskUsagePerURL: 5GB
  #     - url: https://logs-b.example
  #       maxDiskUsagePerURL: 5GB
  #
  # This is the destination list for the log path: there is no second copy
  # of it under `logs`, because a list written twice is a list that stops
  # agreeing. A URL with no path is sent to `/insert/native`, which is the
  # only path that accepts this protocol — the chart refuses any other,
  # because vlagent DROPS a block the store answers 404 to rather than
  # retrying it.
  #
  # A REMOTE `url` — one whose certificate is not publicly trusted, and
  # one this chart's own `writeCredentials` bearer must reach — is
  # already this upstream chart's own surface, unlike the metrics agent's
  # and the OTLP gateway's destinations above: vlagent reads its CA and
  # its bearer from FILES, not from fields this chart writes for you.
  # `_validate.tpl` refuses a destination with neither. The recipe:
  #
  #   victoria-logs-collector:
  #     remoteWrite:
  #       - url: https://logs.example.private
  #         maxDiskUsagePerURL: 5GB
  #         tlsCAFile: /etc/observability-emitters/tls/ca.crt
  #         bearerTokenFile: /etc/observability-emitters/tls/token
  #     extraVolumes:
  #       - name: remote-write-tls
  #         projected:
  #           sources:
  #             - secret: {name: example-private-ca, items: [{key: ca.crt, path: ca.crt}]}
  #             - secret: {name: example-writer-token, items: [{key: token, path: token}]}
  #     extraVolumeMounts:
  #       - name: remote-write-tls
  #         mountPath: /etc/observability-emitters/tls
  #         readOnly: true
  #
  # `bearerTokenFile` (rather than a header this chart would have to
  # template a Secret's VALUE into) is why: vlagent re-reads the file
  # when it changes, so a token rotation needs no restart.
  remoteWrite: []
  collector:
    # -- The stream fields, and THE PLACE THE LOG PATH'S SCOPING KEY IS
    # DECLARED.
    #
    # Upstream's three defaults are constant for the lifetime of a pod and
    # stay; `kubernetes.pod_namespace` among them is the namespace key on
    # this path, under the agent's own native spelling, because vlagent
    # cannot rename a field and the OTLP gateway can — so the gateway
    # writes this same name on its log pipeline and the two writers agree.
    # The cluster joins the list under its conventional name,
    # `k8s.cluster.name`, which is how it arrives from `extraFields` below.
    # The chart refuses to render until both keys are here: a LogsQL
    # stream filter, which is what the proxy injects, selects only on
    # stream fields, and a key that is an ordinary field is a key every
    # scoped query silently misses.
    #
    # Nothing an application writes ever becomes a stream field. That is
    # not a preference: a field that changes per request mints a stream
    # per value, and a store whose stream count grows without bound
    # degrades over weeks in a way that reads as growth. See
    # docs/safety.md.
    streamFields:
      - kubernetes.container_name
      - kubernetes.pod_name
      - kubernetes.pod_namespace
      - k8s.cluster.name
    # -- Pod labels as ordinary fields, which is upstream's default and is
    # what carries the Helm release: `kubernetes.pod_labels.app.kubernetes.io/instance`
    # is the navigation handle on this path. Fields, not stream fields —
    # they cost per line, not per stream.
    includePodLabels: true
    includePodAnnotations: false
    includeNodeLabels: false
    includeNodeAnnotations: false
    # -- MIRROR: `tenancy.cluster` and `tenancy.environment`, as the two
    # static fields this agent adds to every line, under the exact
    # conventional names. Both are constants for the cluster, which is
    # precisely what a static extra field can carry. The chart refuses a
    # value that does not carry both, equal to the values above:
    #
    #   extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
    extraFields: ""
  extraArgs:
    envflag.enable: true
    envflag.prefix: VL_
    loggerFormat: json
    # -- The checkpoints AND the per-destination buffer live here, and
    # upstream backs it with a hostPath by default. That default is the
    # right one and the chart refuses to replace it with an emptyDir: the
    # checkpoint records how far into each container's log file the agent
    # got, so an agent that forgets re-reads every file from the beginning
    # and ships every line a second time. A duplicate is not a gap, which
    # is why nobody notices it until the bill.
    tmpDataPath: /var/lib/vl-collector
  # -- Empty leaves upstream's hostPath at `extraArgs.tmpDataPath`. An
  # `emptyDir` here is refused.
  persistence:
    volume: {}
  # -- A DaemonSet pod is pinned to exactly one node and cannot go
  # elsewhere, so when that node is full — by CPU, memory or its
  # pod-count limit — the agent simply never runs there, and that node's
  # logs are silently missing: a component whose DaemonSet is Pending
  # looks exactly like a component with nothing wrong. `system-node-
  # critical`, the same class a cluster's own node-level CNI DaemonSet
  # typically carries, lets the scheduler PREEMPT a lower-priority pod
  # to make room rather than leave this one Pending. An install with no
  # headroom to spare for that preemption can override this back to
  # upstream's own default, `""`.
  priorityClassName: system-node-critical
  # -- `operator: Exists` with no key tolerates every taint, which is
  # the only setting that stays correct as node pools gain taints over
  # time: a log agent is a NODE agent, and a DaemonSet with no
  # tolerations collects from whichever pool happens to carry no taint
  # today — a fraction of the cluster, with nothing saying so.
  tolerations:
    - operator: Exists
  # -- Right-sized from a live fleet's own measurement (391kb of history
  # across every node pool, including the smallest and most tightly
  # packed): a node-level log agent typically uses a few millicores and
  # under 30Mi of memory, nowhere near upstream's own default of a whole
  # CPU. Requests equal limits on memory (an OOM kill is lost logs, so
  # memory is capped where it is measured, ~8x the observed peak) while
  # the CPU LIMIT is left with headroom above the request (~7x): only
  # the REQUEST decides scheduling, and a tight CPU ceiling would
  # throttle the agent on exactly the bursts it exists to collect —
  # node start-up, a crash-looping pod, a deploy wave. On a small,
  # tightly packed node this also matters for a second reason:
  # `priorityClassName` above lets this pod preempt another one to fit,
  # and a request sized to what the agent actually uses, rather than
  # upstream's whole-CPU ask, keeps that preemption a rare fallback
  # instead of the normal way this pod gets scheduled.
  resources:
    requests:
      cpu: 15m
      memory: 192Mi
    limits:
      cpu: 100m
      memory: 192Mi
  podMonitor:
    enabled: true
    # -- FALSE, and refused true. `true` renders a VMPodScrape instead of a
    # PodMonitor. Every scrape object on the cluster is a Prometheus
    # Operator kind so that the agent reading them can be replaced without
    # rewriting every chart that authors one; one object in the other
    # spelling is the first of the ones that follow it.
    vm: false

# -- kube-state-metrics: upstream's own values shape, read back by this
# chart's refusals the same way `victoria-logs-collector` above is. Only
# rendered while `kubeStateMetrics.enabled` is true.
kube-state-metrics:
  # -- One replica. Sharding (`autosharding.enabled`, upstream's own
  # feature) is not turned on by this chart and `replicas` above 1
  # without it is refused: unsharded replicas each list the whole
  # cluster and export the same series twice, and every rate() or sum()
  # over them silently doubles — the exact failure
  # charts/observability-stack's disabled copy exists to avoid, now
  # possible a second way inside one release.
  replicas: 1
  # -- Pinned by this chart, not upstream's own defaults (`enabled:
  # false`, `create: true`) — see `kubeStateMetrics.customResources`'
  # own comment above for the full reasoning. `enabled: true` here is
  # unconditional, whenever `kubeStateMetrics.enabled` is: this chart
  # always renders the ConfigMap `create: false` points at
  # (templates/kubestatemetrics-customresourcestate.yaml), empty
  # (`resources: []`, a valid, inert config) unless a preset under
  # `kubeStateMetrics.customResources` asks for more. `name` is left
  # unset so upstream's own fallback (`kube-state-metrics.
  # crsConfigMapName`, release-scoped) names it — this chart's own
  # template computes the identical name rather than a second literal
  # that could drift from it.
  #
  # A consumer-authored `config:` here is refused at render
  # (`observability-emitters.validate.kubeStateMetrics`): with `create:
  # false` pinned, it would never reach kube-state-metrics — this
  # chart's own ConfigMap is the one actually mounted.
  customResourceState:
    enabled: true
    create: false
  rbac:
    create: true
    # -- Cluster-wide read, not a Role scoped to this release's own
    # namespace. This IS what kube-state-metrics is for — the cluster's
    # own object state, not this namespace's — and `namespaces` below is
    # refused non-empty for the same reason: a namespace-scoped install
    # answers every query, reports healthy, and simply never held most
    # of the cluster's objects.
    useClusterRole: true
  # -- Refused non-empty; see `rbac.useClusterRole` above.
  namespaces: ""
  # -- A DELIBERATE TRIM of upstream's own default (28 resource kinds:
  # every one of `collectors:` in upstream's values.yaml except the four
  # RBAC-ish kinds already commented out there). Every kind enabled is a
  # ClusterRole read grant AND a cardinality line item, so the default
  # here is only what something in this repository or its estate is
  # already documented to read:
  #
  #   cronjobs, jobs        - docs/safety.md's CronJobNotSucceeding /
  #                           BackupJobFailed / the self-alerts snapshot-age
  #                           rules read kube_cronjob_status_last_successful_time
  #                           and kube_job_status_failed.
  #   persistentvolumeclaims - VolumeSmallerThanClaimed reads
  #                           kube_persistentvolumeclaim_resource_requests_storage_bytes.
  #   pods, nodes           - a fleet's own crashloop and node-pressure
  #                           rules read kube_pod_container_status_restarts_total
  #                           and kube_node_status_condition; neither ships
  #                           in this repository, both are the documented
  #                           reason a fleet installs this at all.
  #   deployments, replicasets, statefulsets, daemonsets, namespaces,
  #   horizontalpodautoscalers - the standard "is a rollout stuck"
  #                           surface (desired vs. ready/updated replicas,
  #                           a namespace stuck Terminating), one series
  #                           family per object, cheap relative to `pods`.
  #
  # Left OUT relative to upstream's default, and each one is a real
  # object read denied, not a metric dropped after collection:
  # certificatesigningrequests, configmaps, endpointslices, ingresses,
  # leases, limitranges, mutatingwebhookconfigurations, networkpolicies,
  # poddisruptionbudgets, replicationcontrollers, resourcequotas, secrets,
  # services, storageclasses, validatingwebhookconfigurations,
  # volumeattachments. Nothing in this repository reads their series
  # today; add one deliberately, with the name of the rule or dashboard
  # that will read it, rather than restoring the upstream default
  # wholesale.
  #
  # Upstream's own estimate (see its README) is on the order of ten to
  # twenty series per pod for the `pods` collector alone, single digits
  # per object for the others — but it is an upstream estimate, not a
  # measurement of this list against a real cluster's object count, and
  # this repository's own doctrine is to ask the store rather than trust
  # a sender's number.
  collectors:
    - cronjobs
    - jobs
    - pods
    - nodes
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - namespaces
    - persistentvolumeclaims
    - horizontalpodautoscalers
  # -- Both empty, upstream's own default, and REFUSED to hold `*` for
  # any resource: kube-state-metrics' per-label-set series shape means an
  # allow-list of every label multiplies series by every distinct value
  # combination a workload's own labels take, which is the identical
  # cardinality trap `metrics.scrape.nodeLabels` above documents for the
  # kubelet and cAdvisor scrapes — measured there as a store silently
  # IGNORING every series past `-maxLabelsPerTimeseries`. Ask for a label
  # by name once a dashboard or a rule needs it.
  metricLabelsAllowlist: []
  metricAnnotationsAllowList: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 100m
      memory: 256Mi
  prometheus:
    monitor:
      # -- A ServiceMonitor, the Prometheus Operator kind every other
      # scrape object in this chart uses, converted the same way. With
      # this false nothing scrapes kube-state-metrics at all: the pod
      # stays Ready, exports its metrics, and nothing ever reads them —
      # the same "component whose PodMonitor is ignored looks exactly
      # like a component with nothing wrong" this chart's own scrape
      # refusals already guard against for the metrics agent itself.
      enabled: true
      http:
        # -- THE MOST IMPORTANT BLOCK IN THIS FILE, and it takes eight
        # steps rather than two because `namespace` ALONE is not the
        # object's namespace by the time metric relabeling runs — it is
        # the kube-state-metrics POD's own namespace, and the object's
        # namespace is sitting under a different name. Getting this
        # wrong once already happened in this repository's own history;
        # see docs/kube-state-metrics.md and docs/safety.md for the full
        # argument. In short:
        #
        # The VictoriaMetrics operator's ServiceMonitor conversion (every
        # `endpoints`-role scrape, which this one is) stamps FOUR target
        # labels unconditionally, from the scrape target's OWN identity —
        # not the object a series describes: `namespace`, `pod` and
        # `container` from the kube-state-metrics pod, `service` from its
        # Service. This chart's own default scrape class adds a fifth,
        # `k8s_namespace_name`, from the same target-level source.
        #
        # `overrideHonorLabels: true` above forces `honor_labels: false`
        # on every scrape, and THAT is where it goes wrong for this
        # component specifically: under `honor_labels: false`, when a
        # SCRAPED sample's own label collides with a label the target
        # already carries, the target's value wins and the sample's own
        # value survives only as `exported_<name>`. kube-state-metrics'
        # own series carry `namespace`, and often `pod` and `container`
        # (`kube_pod_container_status_restarts_total` carries all three;
        # `kube_deployment_status_replicas` carries only `namespace`;
        # `kube_node_status_condition` carries none of the four at all).
        # So `kube_pod_info{namespace="team-a",pod="web-0",...}` arrives
        # at THIS point in the pipeline as `kube_pod_info{
        # namespace="<this release's own namespace>",
        # pod="<the kube-state-metrics pod's own name>",
        # exported_namespace="team-a", exported_pod="web-0", ...}` — the
        # object's real values are there, under the `exported_` names,
        # and `namespace` itself is the wrong one.
        #
        # So the fix is: drop the four target-stamped names outright
        # (they are the SCRAPE TARGET's identity, never the object's, and
        # keeping them when there is nothing to restore would leave a
        # cluster-scoped series such as `kube_node_status_condition`
        # carrying this release's own namespace as if it were the
        # object's); restore each from its `exported_` twin WHERE ONE
        # EXISTS, which is only for series that had that field
        # themselves — upstream's own `namespace` label lands back where
        # `docs/dashboards.md`'s "upstream's `namespace` label stays"
        # rule expects it, and `pod`/`container`/`service` land back for
        # the same reason; then clean up the `exported_` twins; then, and
        # only then, derive `k8s_namespace_name` from the now-CORRECTED
        # `namespace` — which is present for a namespace-scoped object
        # and absent for a genuinely cluster-scoped one, giving that
        # kind exactly the shape `observability-emitters.tenancy.
        # nodeMetricRelabelConfigs` already gives the kubelet's and
        # cAdvisor's own node-level series: no `k8s_namespace_name` at
        # all, visible only to a grant with `allNamespaces: true` on
        # this cluster (`pkg/tenancy.metricsFilter`'s own comment on
        # exactly this case).
        #
        # Order is not cosmetic: each step depends on the one before it
        # having already run.
        metricRelabelings:
          # 1. The target-stamped identity, wrong or ambiguous either
          #    way — drop it before anything else reads it.
          - action: labeldrop
            regex: k8s_namespace_name
          - action: labeldrop
            regex: (namespace|pod|container|service)
          # 2. Restore each from the object's OWN value, where the
          #    object had one — `(.+)` requires a non-empty match, so a
          #    series with no `exported_<name>` (nothing collided; the
          #    object never had that field) sets nothing here.
          #
          #    `action` is written out as `replace` on every one of
          #    these, even though it is the monitoring.coreos.com
          #    ServiceMonitor CRD's own structural-schema default: an
          #    omitted field is a field the API server fills in on
          #    admission, not one that stays absent in the stored
          #    object, so the LIVE ServiceMonitor always carries it —
          #    and a rendered manifest that leaves it out diffs against
          #    that stored object forever, the exact same class of
          #    latch as this chart's own `record: ""` VMRule issue.
          - action: replace
            sourceLabels: [exported_namespace]
            regex: (.+)
            targetLabel: namespace
          - action: replace
            sourceLabels: [exported_pod]
            regex: (.+)
            targetLabel: pod
          - action: replace
            sourceLabels: [exported_container]
            regex: (.+)
            targetLabel: container
          - action: replace
            sourceLabels: [exported_service]
            regex: (.+)
            targetLabel: service
          # 3. The `exported_` twins have done their job.
          - action: labeldrop
            regex: exported_(namespace|pod|container|service)
          # 4. NOW `namespace` is the object's own value where it has
          #    one, and absent where it does not (a cluster-scoped
          #    kind) — derive the scoping key from THIS, not from the
          #    target's stamp step 1 removed.
          - action: replace
            sourceLabels: [namespace]
            regex: (.+)
            targetLabel: k8s_namespace_name

# -- prometheus-node-exporter: upstream's own values shape, read back by
# this chart's refusals the same way `kube-state-metrics` above is. Only
# rendered while `nodeExporter.enabled` is true.
#
# Pinned to the same chart version the vendored k8s-stack carries and
# leaves disabled (see Chart.yaml).
prometheus-node-exporter:
  # -- A node agent must see the node, not its own pod: the host's network
  # namespace (otherwise `node_network_*` describes the pod's one veth), the
  # host's PID namespace (`node_processes_*`, `node_procs_*`) and, below,
  # the host's `/proc`, `/sys` and root filesystem read-only. Upstream's
  # defaults; written out here because they are refused when changed (see
  # `observability-emitters.validate.nodeExporter`): a pod with either off
  # stays Ready, is scraped and reports a different machine's numbers.
  hostNetwork: true
  hostPID: true
  hostRootFsMount:
    enabled: true
    mountPropagation: HostToContainer
  service:
    # -- Listen on the node's own address, not on every interface of a pod
    # that shares the host's network: with `hostNetwork` the exporter's
    # port would otherwise be open on every interface the node has,
    # including any that face outward. The scrape goes to the node's
    # address (the Endpoints of the Service are the nodes), which is the
    # one this binds.
    listenOnAllInterfaces: false
  # -- Same reasoning as the log agent's, and the same defaults: a DaemonSet
  # pod cannot go elsewhere, so a node too full for it is a node with no
  # metrics and nothing saying so. `system-node-critical` lets the
  # scheduler preempt to make room.
  priorityClassName: system-node-critical
  # -- `operator: Exists` tolerates every taint: a node agent that stays off
  # tainted pools collects from whichever pool happens to carry no taint
  # today. Upstream tolerates only NoSchedule, which leaves out NoExecute.
  tolerations:
    - operator: Exists
  # -- Where NOT to run, the same setting the log agent takes
  # (`victoria-logs-collector.affinity`). Empty here. A cluster whose
  # nodes come and go by the minute, CI pools for one, sets a
  # `nodeAffinity` such as
  #
  #   affinity:
  #     nodeAffinity:
  #       requiredDuringSchedulingIgnoredDuringExecution:
  #         nodeSelectorTerms:
  #           - matchExpressions:
  #               - key: karpenter.sh/nodepool
  #                 operator: NotIn
  #                 values: [ci-a, ci-b]
  #
  # Upstream merges that over its own default (no Fargate, no virtual
  # kubelet nodes); a `nodeAffinity` you set REPLACES that default rather
  # than adding to it.
  affinity: {}
  # -- Linux nodes only; upstream's default, restated because it is a
  # value a consumer replaces wholesale.
  nodeSelector:
    kubernetes.io/os: linux
  # -- Sized from a running exporter with the collector set below: 8Mi at
  # start and 10 to 25Mi and a few millicores per scrape, on a node with a
  # handful of disks and interfaces. Memory request equals limit, as for the
  # log agent, so the exporter is not the first thing evicted under node
  # pressure, and the cap (about 3x the observed peak) is where a node with
  # many mounts would show up. There is NO CPU limit, on purpose: the
  # collectors all run in parallel at scrape time, so one scrape is a burst
  # of a few hundred millicores for a few tens of milliseconds on a pod that
  # averages about 1m. Measured on production-sized nodes, 30 to 40% of
  # active CFS periods were throttled under a 100m quota, which fires
  # CPUThrottlingHigh and adds 0.2 to 0.3 s to every scrape. The quota
  # throttles the scrape itself, and only the request decides scheduling, so
  # the request stays and the limit goes; the memory limit and the lean
  # collector set below bound a misbehaving exporter. Requests are small on
  # purpose: `priorityClassName` above lets this pod preempt to fit, and a
  # request sized to use keeps that a rare fallback. To add a limit anyway,
  # set `resources.limits.cpu`.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi
  # -- THE COLLECTOR SET. Upstream turns on about forty collectors; this
  # chart turns ALL of them off (`--collector.disable-defaults`) and names
  # the ones something reads. What is on, and who reads it:
  #
  #   cpu, loadavg, meminfo, stat, vmstat, filefd, entropy, time, timex,
  #   uname, diskstats, filesystem, netdev, netclass, netstat, sockstat,
  #   tcpstat, udp_queues, softnet, schedstat, pressure, processes,
  #   conntrack, arp, hwmon, kernel_hung
  #                       - every family the node-exporter dashboard
  #                         (charts/observability-dashboards) queries, and
  #                         `cpu` and `meminfo` are also what
  #                         `node.rules` and `kube-prometheus-node-
  #                         recording.rules` record from.
  #
  # Left OUT, each because nothing here reads it or it costs a lot of
  # series for what it says: `interrupts` (one series per CPU per IRQ:
  # thousands on a large node), `systemd` (needs the host's D-Bus socket
  # mounted, a wider grant than the rest), `cpufreq`, `thermal_zone`,
  # `rapl` and `powersupplyclass` (per-CPU or per-sensor, and absent on a
  # cloud VM), `zoneinfo`, `buddyinfo` and `slabinfo`, `nfs`, `nfsd`,
  # `xfs`, `zfs`, `btrfs`, `bcache`, `mdadm`, `nvme`, `edac`, `ipvs`,
  # `infiniband`, `fibrechannel`, `bonding`, `tapestats`, `selinux`, `os`,
  # `sysctl` and `dmi`. Adding one is one more `--collector.<name>` here.
  #
  # Two device filters, because a Kubernetes node's series count is decided
  # by what is mounted and plumbed, not by its size. The pod interfaces the
  # CNIs create (`veth*`, `eni<hash>` on the AWS CNI, `lxc*`, `cali*`,
  # `cilium_*`, `flannel*`) and the container runtime's bridges are minted
  # and destroyed with every pod, and each carries about twenty
  # `node_network_*` series; the per-pod tmpfs and CSI mounts under
  # `/var/lib/kubelet` and the runtime's own under `/run/containerd` and
  # `/var/lib/containerd` are the same shape for `node_filesystem_*`.
  # The network filter is also applied to `netclass`, which the interface
  # up/carrier/speed panels read.
  extraArgs:
    - --collector.disable-defaults
    - --collector.arp
    - --collector.conntrack
    - --collector.cpu
    - --collector.diskstats
    - --collector.entropy
    - --collector.filefd
    - --collector.filesystem
    - --collector.hwmon
    - --collector.kernel_hung
    - --collector.loadavg
    - --collector.meminfo
    - --collector.netclass
    - --collector.netdev
    - --collector.netstat
    - --collector.pressure
    - --collector.processes
    - --collector.schedstat
    - --collector.sockstat
    - --collector.softnet
    - --collector.stat
    - --collector.tcpstat
    - --collector.time
    - --collector.timex
    - --collector.udp_queues
    - --collector.uname
    - --collector.vmstat
    - --collector.netdev.device-exclude=^(veth.*|lxc.*|cali.*|cilium_.*|eni[0-9a-f]{8,}|flannel.*|docker.*|br-.*|[a-f0-9]{15})$
    - --collector.netclass.ignored-devices=^(veth.*|lxc.*|cali.*|cilium_.*|eni[0-9a-f]{8,}|flannel.*|docker.*|br-.*|[a-f0-9]{15})$
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|run/containerd/.+|var/lib/containerd/.+|var/lib/docker/.+|var/lib/containers/storage/.+|var/lib/kubelet/(pods|plugins)/.+)($|/)
  prometheus:
    monitor:
      # -- A ServiceMonitor, the Prometheus Operator kind every other scrape
      # object in this chart uses. With this false nothing scrapes the
      # exporter at all: the pods stay Ready and nothing ever reads them.
      enabled: true
      # -- The endpoint's own `relabelings`, run on the TARGET before the
      # scrape. Three steps, all constants of the kube-prometheus
      # convention the dashboard and the recording rules are written for:
      #
      #   job       `node-exporter`. The operator would otherwise name the job
      #             for the Service (`<release>-prometheus-node-exporter`),
      #             which no dashboard or rule selects.
      #   instance  the NODE'S NAME, not `<node ip>:9100`: a stable identity
      #             per node, and the value the dashboard's own node picker
      #             and `instance:node_cpu:ratio` group on.
      #   node      the same name under the `node` label
      #             `node:node_cpu_utilization:ratio_rate5m` groups by and
      #             kube-state-metrics' `kube_pod_info` carries.
      #
      # `action` is written out for the reason the kube-state-metrics
      # block above gives. The cluster, tier and (for a namespaced target)
      # namespace come from the default scrape class, not from here.
      # Refused if any of the three is missing (see
      # `observability-emitters.validate.nodeExporter`).
      relabelings:
        - action: replace
          targetLabel: job
          replacement: node-exporter
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          regex: (.+)
          targetLabel: instance
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          regex: (.+)
          targetLabel: node
      # -- Series-level. A node is cluster-scoped: the default scrape class
      # stamped `k8s_namespace_name` from the exporter pod's own namespace,
      # which would make every node series readable by a grant on THAT
      # namespace (this release's own) and by nobody else on the cluster
      # who needs the node. Dropped, so the series carry the cluster and
      # nothing narrower — the kubelet's and cAdvisor's node-level shape.
      metricRelabelings:
        - action: labeldrop
          regex: k8s_namespace_name
