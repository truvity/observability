# expect: `backup.credentialsSecret` is empty

# `auth.mode` defaults to `secret`, and the default mode's own
# requirement — a credentialsSecret name — still applies with no
# `auth:` block written at all.
backup:
  enabled: true
  destination: s3://example-backups/observability

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
