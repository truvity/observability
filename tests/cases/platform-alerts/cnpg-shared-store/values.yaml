# A store that holds several clusters, rules running on one of them: the
# series' own cluster label survives.
commonLabels:
  k8s_cluster_name: central
groups:
  backups:
    enabled: false
  writePath:
    enabled: false
  volumes:
    enabled: false
  storeLimits:
    enabled: false
  cnpg:
    enabled: true
    for: 15m
    severity: critical
    keepClusterLabel: true
