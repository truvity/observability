# The alerting plane of tests/cases/observability-stack/remote-evaluators: that case's values
# (presets merged) kept to the keys this chart declares. tests/alerting_chart_test.go
# derives the same file for every stack case and holds the objects byte-identical.
stackReleaseName: observability-stack
tenancy: {}
vmalert:
  externalUrl: https://grafana.example
  externalLabels:
    k8s_cluster_name: central
  remoteEvaluators:
  - name: other-store
    datasource:
      url: https://metrics.other-store.example
      auth:
        bearer:
          secretName: example-other-store-read
          key: token
    externalLabels:
      k8s_cluster_name: edge
  - name: third-store
    evaluationInterval: 30s
    datasource:
      url: https://metrics.third-store.example
      auth:
        basic:
          secretName: example-third-store-read
          usernameKey: username
          passwordKey: password
      caBundle:
        configMap:
          name: example-third-store-ca
          key: ca.crt
notifications:
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-acme-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
alertmanager:
  replicaCount: 2
