apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-grafana
  namespace: default
  labels:
    helm.sh/chart: grafana-12.7.3
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: observability-grafana
    app.kubernetes.io/version: "13.1.1"
data:
  
  plugins: victoriametrics-metrics-datasource,victoriametrics-logs-datasource
  grafana.ini: |
    [alerting]
    enabled = false
    [analytics]
    check_for_updates = false
    reporting_enabled = false
    [auth]
    disable_login_form = true
    login_maximum_lifetime_duration = 24h
    [auth.jwt]
    enabled = true
    header_name = Authorization
    jwk_set_url = https://issuer.example.org/keys
    cache_ttl = 60m
    expect_claims = {"aud":"grafana-workload","iss":"https://issuer.example.org"}
    username_attribute_path = join(':', ['workload', sub])
    role_attribute_path = ends_with(sub, ':k8s:observability:observability-cluster-grafana-operator') && 'None' || 'Viewer'
    role_attribute_strict = true
    allow_assign_grafana_admin = false
    skip_org_role_sync = false
    auto_sign_up = true
    url_login = false
    enable_login_token = false
    [auth]
    oauth_auto_login = true
    [auth.generic_oauth]
    api_url = https://issuer.example.org/userinfo
    auth_url = https://issuer.example.org/authorize
    client_id = grafana
    enabled = true
    groups_attribute_path = groups
    name = SSO
    role_attribute_path = contains(groups[*], 'example:admin') && 'Admin' || 'Editor'
    role_attribute_strict = true
    scopes = openid profile email groups offline_access
    token_url = https://issuer.example.org/token
    use_pkce = true
    use_refresh_token = true
    [dashboards]
    default_home_dashboard_path = 
    [database]
    ca_cert_path = 
    host = postgres.example.org:5432
    locking_attempt_timeout_sec = 120
    name = grafana
    ssl_mode = verify-full
    type = postgres
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [security]
    cookie_samesite = lax
    cookie_secure = true
    [server]
    domain = ''
    root_url = https://grafana.example.org
    [unified_alerting]
    enabled = false
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve

