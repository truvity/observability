# expect: alertmanager.watchdog.tokenKey is set but
# `tokenKey` with no Secret: nothing to read the bearer from, and the deadman
# receiver does not exist without a Secret for its URL.
# `repeatInterval` equal to `timeout`: the heartbeat is due at the exact
# moment the far end gives up on it, so a single delayed delivery reads
# as the estate being down when it is not. It has to land comfortably
# INSIDE the far end's timeout, not merely before it.
stackReleaseName: observability-stack
tenancy: {}
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
    - name: acme
      appTokenSecret:
        name: example-slack-bot
        key: token
  severities:
    critical:
      receiver: slack
      channel: '#alerts-critical'
    warning:
      receiver: slack
      channel: '#alerts'
alertmanager:
  watchdog:
    tokenKey: token
