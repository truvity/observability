# The cluster's DNS suffix is an input, and this file sets it to a
# neutral placeholder: a golden render is a tracked file in a public
# repository, and the default suffix would put in-cluster names into one.
# It also proves the chart renders on a cluster that does not use the
# default — an estate on the default sees exactly this one difference.
global:
  cluster:
    dnsDomain: cluster.example.

# The smallest values file that renders something worth installing.
#
# Everything else has a default that is safe to leave alone; these two do
# not, because a stack whose proxy has no issuer to verify against and no
# principal to admit is a stack nobody can read.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  # The trace store is on by default, and this proxy cannot scope trace
  # reads: vmauth applies a grant by substituting it into the route, and
  # VictoriaTraces' Jaeger and Tempo select APIs accept no query
  # argument to substitute it into. So every principal below reads every
  # namespace's spans on every cluster, and the chart refuses to render until that is
  # written down. docs/safety.md has the mechanism; the alternative is
  # `victoria-traces-single.enabled: false`.
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

# The smallest shape that keeps `alertmanager.enabled`'s default from
# rendering the `blackhole` route: one receiver, one default per
# severity, nothing project-specific. See docs/notifications.md.
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}

# The opt-in guard on the self-alert source series: a store counter, a
# writer's two names and a proxy counter are watched; the cluster label is
# the default one.
selfAlerts:
  enabled: true
  ingest:
    metric: example_vm_rows_ignored_total
  writer:
    bufferMetric: example_vmalert_remotewrite_pending_data_bytes
    bufferMetricsExtra: [example_vlagent_remotewrite_pending_data_bytes]
  proxyConcurrency:
    limitedRequestsMetric: example_vmauth_concurrent_requests_limit_reached_total
  sourceAbsent:
    enabled: true
    lookback: 12h
    for: 10m
