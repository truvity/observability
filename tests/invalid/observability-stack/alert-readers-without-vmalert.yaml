# expect: There is no vmalert for this route to read
# alertReaders reads vmalert's own /api/v1/alerts — with vmalert.enabled
# false there is no vmalert running to answer it, and the reader would
# be installed and able to read nothing, silently.
vmalert:
  enabled: false
alertmanager:
  enabled: false
# MIRROR of alertmanager.enabled/vmalert.enabled above — see
# observability-stack.validate.vendoredSyncSources' own doc comment —
# so this fixture keeps testing alertReaders, not that refusal.
# (defaultDashboards.enabled stays at its own default of false, so the
# matching dashboard mirrors need no override here.)
victoria-metrics-k8s-stack:
  defaultRules:
    sources:
      alertmanager:
        enabled: false
      vmalert:
        enabled: false

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredAlertReads: true
  alertReaders:
    - name: statusbox
      tokenSecret:
        name: example-alerts-read-token
        key: token
