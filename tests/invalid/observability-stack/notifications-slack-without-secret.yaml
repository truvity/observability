# expect: at '/notifications/slack/webhookSecret/name'
# `notifications.slack` with an empty webhook secret name. A receiver
# that cannot send is worse than no receiver: the manifest, the route
# and the schema all agree it exists, and it never delivers anything.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    webhookSecret: {name: "", key: url}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
