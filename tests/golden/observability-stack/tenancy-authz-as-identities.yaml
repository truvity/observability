# Source: observability-stack/templates/tenancy-authz.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-stack-tenancy-authz
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/instance: observability-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-stack
    app.kubernetes.io/component: tenancy-authz
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: tenancy-authz
      app.kubernetes.io/instance: observability-stack
      app.kubernetes.io/name: tenancy-authz
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tenancy-authz
        app.kubernetes.io/instance: observability-stack
        app.kubernetes.io/name: tenancy-authz
      annotations:
        checksum/config: f3c47101a4e2c8ac8bd9b44e36def52020572787f8fb2ff3bb74b2eef2689af1
    spec:
      serviceAccountName: observability-stack-tenancy-authz
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: tenancy-authz
              app.kubernetes.io/instance: observability-stack
              app.kubernetes.io/name: tenancy-authz
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: tenancy-authz
              app.kubernetes.io/instance: observability-stack
              app.kubernetes.io/name: tenancy-authz
      containers:
        - name: tenancy-authz
          image: "ghcr.io/truvity/observability/tenancy-authz:0.0.0"
          imagePullPolicy: IfNotPresent
          args:
            - -config=/etc/tenancy-authz/config.yaml
            - -listen=:8080
            - -admin-listen=:9090
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/tenancy-authz/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: signing-key
              mountPath: /etc/tenancy-authz/signing
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-stack-tenancy-authz
        - name: signing-key
          secret:
            secretName: "observability-stack-tenancy-authz-signing"
            defaultMode: 0440

