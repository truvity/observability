{{- /*
Refusals first: a dashboard enabled with nowhere to point renders
happily and shows nothing, which is worse than failing — see
docs/dashboards.md's Refusals table.
*/ -}}
{{- $catalog := include "observability-dashboards.catalog" . | fromYaml -}}
{{- /* A catalog entry without `datasources` reads metrics. One that lists
       datasources (the Frontend pair: logs, and traces for the link to a
       trace) reads those instead and is refused without them. */ -}}
{{- $needMetrics := list -}}
{{- $needLogs := list -}}
{{- $needTraces := list -}}
{{- range $name, $spec := $catalog -}}
{{- if (get $.Values.dashboards $name).enabled -}}
{{- if not $spec.datasources -}}
{{- $needMetrics = append $needMetrics $name -}}
{{- end -}}
{{- if has "logs" ($spec.datasources | default list) -}}
{{- $needLogs = append $needLogs $name -}}
{{- end -}}
{{- if has "traces" ($spec.datasources | default list) -}}
{{- $needTraces = append $needTraces $name -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $needMetrics (not $.Values.datasources.metrics) -}}
{{- fail (printf "observability-dashboards: %s are enabled, but datasources.metrics is empty — dashboards for a store nobody can point at. Set it to this Grafana's provisioned VictoriaMetrics datasource UID." (join ", " $needMetrics)) -}}
{{- end -}}
{{- if and $needLogs (not $.Values.datasources.logs) -}}
{{- fail (printf "observability-dashboards: %s are enabled, but datasources.logs is empty — dashboards for a log store nobody can point at. Set it to this Grafana's provisioned VictoriaLogs datasource UID." (join ", " $needLogs)) -}}
{{- end -}}
{{- if and $needTraces (not $.Values.datasources.traces) -}}
{{- fail (printf "observability-dashboards: %s are enabled, but datasources.traces is empty — the link from an issue to its trace would open nothing. Set it to this Grafana's provisioned VictoriaTraces datasource UID." (join ", " $needTraces)) -}}
{{- end -}}

{{- if $.Values.home -}}
{{- $homeSpec := get $catalog $.Values.home -}}
{{- if not $homeSpec -}}
{{- fail (printf "observability-dashboards: home %q is not a shipped dashboard (one of: %s)" $.Values.home (keys $catalog | sortAlpha | join ", ")) -}}
{{- end -}}
{{- if not (get $.Values.dashboards $.Values.home).enabled -}}
{{- fail (printf "observability-dashboards: home %q is disabled — a home page nobody can open. Enable dashboards.%s or set home to \"\"." $.Values.home $.Values.home) -}}
{{- end -}}
{{- end -}}

{{- range $name, $spec := $catalog }}
{{- $entry := get $.Values.dashboards $name }}
{{- if $entry.enabled }}
{{- $folder := get $.Values.folders $spec.folder }}
{{- $content := $.Files.Get (printf "dashboards/%s" $spec.file) | replace "__DATASOURCE_UID__" $.Values.datasources.metrics | replace "__LOGS_DATASOURCE_UID__" $.Values.datasources.logs | replace "__TRACES_DATASOURCE_UID__" $.Values.datasources.traces }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability-dashboards.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "observability-dashboards.labels" $ | nindent 4 }}
  annotations:
    # The k8s-sidecar (quay.io/kiwigrid/k8s-sidecar) convention for filing
    # a dashboard into a Grafana subfolder rather than the sidecar's flat
    # default. INERT without the consuming Grafana's own chart setting
    # BOTH `sidecar.dashboards.folderAnnotation: k8s-sidecar-target-directory`
    # (so the sidecar reads this annotation at all) AND
    # `sidecar.dashboards.provider.foldersFromFilesStructure: true` (so
    # Grafana turns the resulting on-disk subdirectory into a folder) —
    # see values.yaml's own comment on `folders`. charts/observability-stack
    # does not set either as of this chart's first release.
    k8s-sidecar-target-directory: {{ $folder | quote }}
    {{- if eq $name $.Values.home }}
    # The designated home page: see values.yaml's `home` for how to point
    # Grafana's default_home_dashboard_path at it. Informational only.
    observability-dashboards/home: "true"
    {{- end }}
data:
  {{ $name }}.json: |
    {{- $content | nindent 4 }}
---
{{- end }}
{{- end }}
