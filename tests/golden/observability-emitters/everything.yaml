# Source: observability-emitters/templates/gateway.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: observability-emitters-gateway
  labels:
    app.kubernetes.io/name: emitters
    app.kubernetes.io/instance: observability-emitters
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: observability-emitters
spec:
  replicas: 3
  serviceName: observability-emitters-gateway-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: emitters-gateway
      app.kubernetes.io/instance: observability-emitters
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emitters-gateway
        app.kubernetes.io/instance: observability-emitters
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: observability-emitters
      annotations:
        observability-emitters/config-checksum: 9382f69150ddc28ef9aa709fd072b7cddcdc8af58b06390862db3febe848a0d1
    spec:
      serviceAccountName: observability-emitters-gateway
      securityContext:
        fsGroup: 10001
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - effect: NoSchedule
          key: arch
          operator: Equal
          value: arm64
      containers:
        - name: collector
          image: "otel/opentelemetry-collector-contrib:0.161.0"
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 14317
              protocol: TCP
            - name: otlp-http
              containerPort: 14318
              protocol: TCP
            - name: telemetry
              containerPort: 8888
              protocol: TCP
          env:
            - name: OBSERVABILITY_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "example-write-token"
                  key: "bearer"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol
      volumes:
        - name: config
          configMap:
            name: observability-emitters-gateway
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: queue
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "example-ssd"
        resources:
          requests:
            storage: 20Gi

