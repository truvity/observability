# shardByURL SPLITS the series between the destinations instead of
# replicating to all of them, so a zone-redundant pair holds half the
# data each. Every query still answers, with half of every result
# missing.

metrics:
  destinations:
  - name: primary
    url: https://metrics.example/api/v1/write
  spec:
    extraArgs:
      remoteWrite.shardByURL: 'true'
otlp:
  destinations:
    logs:
    - name: primary
      url: https://logs.example
    metrics:
    - name: primary
      url: https://metrics.example
    traces:
    - name: primary
      url: https://traces.example
tenancy:
  cluster: example-cluster
  environment: development
victoria-logs-collector:
  collector:
    extraFields: '{"k8s.cluster.name":"example-cluster","deployment.environment.name":"development"}'
    streamFields:
    - kubernetes.container_name
    - kubernetes.pod_name
    - kubernetes.pod_namespace
    - k8s.cluster.name
  extraVolumeMounts:
  - mountPath: /etc/observability-write-token
    name: write-token
    readOnly: true
  extraVolumes:
  - name: write-token
    secret:
      secretName: example-write-token
  remoteWrite:
  - bearerTokenFile: /etc/observability-write-token/token
    maxDiskUsagePerURL: 5GB
    url: https://logs.example
writeCredentials:
  secretName: example-write-token
