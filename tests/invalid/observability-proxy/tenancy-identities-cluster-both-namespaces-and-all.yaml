# expect: with both `allNamespaces` and a `namespaces` list
# A cluster entry that is both whole-cluster and namespace-scoped is ambiguous, and an ambiguous grant widens.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  identities:
    - name: example-app
      groups: [example:example-app]
      reach:
        clusters:
          - cluster: cluster-a
            allNamespaces: true
            namespaces: [example-app]


victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
