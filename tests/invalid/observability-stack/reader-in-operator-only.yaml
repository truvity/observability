# expect: `mode` is "operator-only" but `tenancy.readers`
# Operator-only runs no proxy; the full contract is met so this refusal is the one reached.
mode: operator-only
vmauth:
  enabled: false
vmalert:
  enabled: false
alertmanager:
  enabled: false
grafana:
  enabled: false
backup:
  enabled: false
selfAlerts:
  enabled: false
metricsSelfScrape:
  enabled: false
victoria-metrics-k8s-stack:
  vmsingle:
    enabled: false
  syncJob:
    enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
tenancy:
  readers:
    - name: edge-evaluator
      tokenSecret: {name: example-read-token, key: token}
      grants: [{cluster: example-edge, allNamespaces: true}]
