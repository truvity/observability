# The case `tenancy-traces` with every principal of `tenancy.principals` rewritten as an
# identity of `tenancy.identities` (docs/tenancy-authz.md has the mapping).
# tests/identities_test.go holds that it renders byte for byte what `tenancy-traces` does.
# Do not edit by hand: change `tenancy-traces` and rewrite.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  allowUnfilteredTraceReads: true
  identities:
  - groups: ['example:k8s:viewer']
    reach:
      clusters:
      - {cluster: example-cluster, allNamespaces: true}
victoria-traces-single:
  enabled: true
  server:
    persistentVolume: {enabled: false}
networkPolicy: {enabled: false}
victoria-metrics-k8s-stack: {enabled: false}
victoria-logs-single: {enabled: false}
