  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stack
            app.kubernetes.io/instance: observability-stack
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/part-of: observability-stack
            observability.backup: traces
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: server
                      app.kubernetes.io/name: vt-single
                      app.kubernetes.io/instance: observability-stack
          containers:
            - name: backup
              image: "example.com/mirror/rclone:1.73.0"
              env:
                - name: STORE_URL
                  value: "http://observability-stack-vt-single-server.observability.svc:10428"
                - name: DESTINATION
                  value: ":s3,env_auth=true:example-backups/observability/traces"
                - name: VM_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: "example-store-credentials"
                      key: "user"
                - name: VM_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "example-store-credentials"
                      key: "pass"
              envFrom:
                - secretRef:
                    name: "example-backup-credentials"
              volumeMounts:
                - name: store
                  mountPath: /storage
                  readOnly: true
              command:
                - /bin/sh
                - -euc
                - |
                  # The trace store has no snapshot API this chart will
                  # rely on, so the vendor's documented procedure it is:
                  # sync, detach, sync, attach. The second pass exists
                  # because the data files are immutable but the small
                  # metadata files beside them are not, and the first pass
                  # takes long enough for them to change.
                  auth="--user=$VM_USERNAME --password=$VM_PASSWORD"
                  test -d /storage/partitions || { echo "no partitions directory: this is not a trace store's volume" >&2; exit 1; }
                  # REFUSE AN EMPTY SOURCE, before anything is deleted at
                  # the destination.
                  test -n "$(ls -A /storage/partitions)" || { echo "the trace store has no partitions; refusing to sync an empty source over the backup" >&2; exit 1; }
                  rclone sync /storage/partitions "$DESTINATION" --checksum
                  for p in $(ls /storage/partitions); do
                    wget -q -O- $auth --post-data='' "$STORE_URL/internal/partition/detach?name=$p"
                  done
                  rclone sync /storage/partitions "$DESTINATION" --checksum
                  for p in $(ls /storage/partitions); do
                    wget -q -O- $auth --post-data='' "$STORE_URL/internal/partition/attach?name=$p"
                  done
          volumes:
            - name: store
              persistentVolumeClaim:
                claimName: "server-volume-observability-stack-vt-single-server-0"
                readOnly: true

