---
# Source: observability-dashboards/templates/dashboards.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboards-openbao
  namespace: default
  labels:
    app.kubernetes.io/name: observability-dashboards
    app.kubernetes.io/instance: observability-dashboards
    app.kubernetes.io/managed-by: Helm
    grafana_dashboard: "1"
  annotations:
    # The k8s-sidecar (quay.io/kiwigrid/k8s-sidecar) convention for filing
    # a dashboard into a Grafana subfolder rather than the sidecar's flat
    # default. INERT without the consuming Grafana's own chart setting
    # BOTH `sidecar.dashboards.folderAnnotation: k8s-sidecar-target-directory`
    # (so the sidecar reads this annotation at all) AND
    # `sidecar.dashboards.provider.foldersFromFilesStructure: true` (so
    # Grafana turns the resulting on-disk subdirectory into a folder) —
    # see values.yaml's own comment on `folders`. charts/observability-stack
    # does not set either as of this chart's first release.
    k8s-sidecar-target-directory: "Platform"
data:
  openbao.json: |
    {
      "title": "OpenBAO ($cluster)",
      "description": "OpenBAO server health: seal and active state, Raft and Autopilot, request rate and latency, tokens and leases, and the audit devices. Needs the server's metrics scraped (charts/openbao-ops serverMetrics).",
      "editable": false,
      "graphTooltip": 1,
      "refresh": "1m",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "",
      "annotations": {
        "list": []
      },
      "links": [
        {
          "type": "dashboards",
          "title": "Fleet overview",
          "tags": [
            "observability-fleet"
          ],
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "icon": "external link",
          "tooltip": "The home page: is anything wrong, and where?",
          "targetBlank": false,
          "url": ""
        },
        {
          "type": "dashboards",
          "title": "Kubernetes views",
          "tags": [
            "observability-kubernetes"
          ],
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "icon": "external link",
          "tooltip": "Cluster, namespace and pod drill-down views",
          "targetBlank": false,
          "url": ""
        },
        {
          "type": "dashboards",
          "title": "Store dashboards",
          "tags": [
            "observability-stores"
          ],
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "icon": "external link",
          "tooltip": "The observability stack's own health",
          "targetBlank": false,
          "url": ""
        },
        {
          "type": "dashboards",
          "title": "Platform dashboards",
          "tags": [
            "observability-platform"
          ],
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "icon": "external link",
          "tooltip": "ArgoCD, cert-manager, CloudNativePG, NATS, Envoy Gateway and Kargo",
          "targetBlank": false,
          "url": ""
        }
      ],
      "tags": [
        "observability-platform",
        "openbao"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": true,
              "text": "example-metrics",
              "value": "example-metrics"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "cluster",
            "label": "cluster",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(vault_core_unsealed, k8s_cluster_name)",
            "query": {
              "query": "label_values(vault_core_unsealed, k8s_cluster_name)",
              "refId": "cluster-Variable-Query"
            },
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Availability",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods reporting",
          "description": "OpenBAO server pods whose metrics are being scraped. Fewer than the StatefulSet's replicas means a pod is down or not scraped: the other panels then describe only the pods that answer.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(vault_core_unsealed{k8s_cluster_name=~\"$cluster\"}) or vector(0)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "n/a",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Sealed pods",
          "description": "Pods that report themselves sealed. A sealed pod serves nothing. With auto-unseal it should unseal on start: read its log for the seal's error (KMS permission, endpoint, plugin binary).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(vault_core_unsealed{k8s_cluster_name=~\"$cluster\"} == 0) or (0 * count(vault_core_unsealed{k8s_cluster_name=~\"$cluster\"}))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "n/a",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Active nodes",
          "description": "Pods that report themselves active. Exactly one is right: zero is no leader (every client fails), two is a split that Raft should not allow.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(vault_core_active{k8s_cluster_name=~\"$cluster\"}) or vector(0)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Healthy voters",
          "description": "Raft voters Autopilot reports healthy, read from the active node. Three of three is right; two leaves no failure to spare; fewer than two loses quorum.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(vault_autopilot_node_healthy{k8s_cluster_name=~\"$cluster\"} == 1 and on (namespace, pod) vault_core_active{k8s_cluster_name=~\"$cluster\"} == 1) or vector(0)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Failure tolerance",
          "description": "How many more voters can fail before quorum is lost, as Autopilot counts it. Zero means the next failure is an outage: find the unhealthy voter now.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max((vault_autopilot_failure_tolerance{k8s_cluster_name=~\"$cluster\"} and on (namespace, pod) vault_core_active{k8s_cluster_name=~\"$cluster\"} == 1))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "n/a",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Audit failures (1h)",
          "description": "Requests and responses the audit devices failed to log in the last hour. OpenBAO refuses a request it cannot audit, so a non-zero count is clients seeing errors. Read the pods' log and the audit device.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(sum(increase(vault_audit_log_request_failure{k8s_cluster_name=~\"$cluster\"}[1h])) or vector(0)) + (sum(increase(vault_audit_log_response_failure{k8s_cluster_name=~\"$cluster\"}[1h])) or vector(0))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Unsealed, by pod",
          "description": "1 while a pod is unsealed, 0 while it is sealed. A line at 0 is a pod serving nothing; a line that drops and returns is a restart that unsealed.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "vault_core_unsealed{k8s_cluster_name=~\"$cluster\"}",
              "legendFormat": "{{pod}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Active, by pod",
          "description": "1 on the pod that is the active node, 0 on standbys. A change of line is a leadership change; a graph with no 1 anywhere is an outage.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "vault_core_active{k8s_cluster_name=~\"$cluster\"}",
              "legendFormat": "{{pod}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "row",
          "title": "Raft",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Node health, by voter",
          "description": "1 while Autopilot reports a voter healthy, read from the active node. A voter at 0 cannot be reached or has fallen behind: open its pod's log and its disk.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(vault_autopilot_node_healthy{k8s_cluster_name=~\"$cluster\"} and on (namespace, pod) vault_core_active{k8s_cluster_name=~\"$cluster\"} == 1)",
              "legendFormat": "{{node_id}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Commit index, by pod",
          "description": "The index of the last Raft log entry each pod has committed to disk. The lines climb together; a pod whose line flattens while the others climb has stopped replicating.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "vault_raft_storage_stats_commit_index{k8s_cluster_name=~\"$cluster\"}",
              "legendFormat": "{{pod}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Applied index behind the leader, by follower",
          "description": "How many Raft log entries each follower has applied fewer than the leader. Should hover near zero; a follower stuck high is a slow disk or network, and cannot take over cleanly. The OpenBAORaftCommitLag alert fires above 500 for ten minutes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "vault_raft_storage_follower_applied_index_delta{k8s_cluster_name=~\"$cluster\"} and on (namespace, pod) vault_core_active{k8s_cluster_name=~\"$cluster\"} == 0",
              "legendFormat": "{{pod}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "links": []
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Leader contact (p99), by pod",
          "description": "Time since the leader last reached its followers when checking its lease, 99th percentile. A rise toward the election timeout is a network or load problem between pods, ahead of a leadership change.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
