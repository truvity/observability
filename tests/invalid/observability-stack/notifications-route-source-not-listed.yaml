# expect: add it to `notifications.routeLabels`
# A route matching on `source` while `routeLabels` is left at its default
# (cluster and namespace). The label is real -- alert-ingress stamps it --
# but the router was not told to match on it, so it is refused rather
# than silently listing a route nothing configured can reach.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
  routes:
    - match: {source: aws-guardduty}
      critical: "#alerts-security"
