# expect: to a literal rather than an environment reference
# The store password written into values: a credential in git and in the
# release's manifest.
# No proxy: no principals to admit, so none of the tenancy refusals
# apply and none can preempt this fixture's own.
vmauth:
  enabled: false

# The minimum receiver that keeps the "no receiver configured" refusal
# (Alertmanager is on by default) from preempting this fixture's own.
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
grafana:
  enabled: true
  admin:
    existingSecret: example-grafana
  envValueFrom:
    GF_SECURITY_SECRET_KEY:
      secretKeyRef: {name: example-grafana, key: secret_key}
    STORE_USERNAME:
      secretKeyRef: {name: observability-store-credentials, key: username}
    STORE_PASSWORD:
      secretKeyRef: {name: observability-store-credentials, key: password}
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          uid: victoriametrics
          version: 1
          url: http://vmsingle-example:8428/prometheus
          basicAuth: true
          basicAuthUser: ${STORE_USERNAME}
          secureJsonData:
            basicAuthPassword: not-a-reference
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: victorialogs
          version: 1
          url: http://logs-example:9428
          basicAuth: true
          basicAuthUser: ${STORE_USERNAME}
          secureJsonData:
            basicAuthPassword: ${STORE_PASSWORD}
        - name: VictoriaTraces
          type: jaeger
          uid: victoriatraces
          version: 1
          url: http://traces-example:10428/select/jaeger
          basicAuth: true
          basicAuthUser: ${STORE_USERNAME}
          secureJsonData:
            basicAuthPassword: ${STORE_PASSWORD}
