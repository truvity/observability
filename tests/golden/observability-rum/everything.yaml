# Source: observability-rum/templates/sourcemap-smctl.yaml
# Only the Alloy pods may read the maps (smctl has no authentication of its
# own, and a map can carry the app's source), and the pod may reach only
# DNS and the registry's HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-rum-sourcemaps
  namespace: rum
  labels:
    app.kubernetes.io/name: observability-rum
    app.kubernetes.io/instance: observability-rum
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: observability-rum
      app.kubernetes.io/name: observability-rum-sourcemaps
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: observability-rum
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    # EKS Pod Identity's agent answers credential requests on a link-local
    # address, over plain HTTP (IRSA needs only the HTTPS rule above).
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80

