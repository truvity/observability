apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts-upstream-kubernetes-resources
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/instance: platform-alerts
    app.kubernetes.io/managed-by: Helm
    observability.truvity.io/evaluator: metrics
    observability.truvity.io/rule-type: alert
spec:
  groups:
    - name: kubernetes-resources
      rules:
      - alert: KubeCPUOvercommit
        annotations:
          description: Cluster {{ $labels.k8s_cluster_name }} has overcommitted CPU resource
            requests for Pods by {{ printf "%.2f" $value }} CPU shares and cannot tolerate
            node failure.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecpuovercommit
          summary: Cluster has overcommitted CPU resource requests.
        expr: (((sum(namespace_cpu:kube_pod_container_resource_requests:sum) by(k8s_cluster_name)
          - sum(kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"}) by(k8s_cluster_name))
          > 0) and (count(max(kube_node_role{job="kube-state-metrics",role="control-plane"})
          by(k8s_cluster_name,node)) by(k8s_cluster_name) < 3)) or ((sum(namespace_cpu:kube_pod_container_resource_requests:sum)
          by(k8s_cluster_name) - ((sum(kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"})
          by(k8s_cluster_name) - max(kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"})
          by(k8s_cluster_name)) > 0)) > 0)
        for: 10m
        labels:
          severity: warning
      - alert: KubeMemoryOvercommit
        annotations:
          description: Cluster {{ $labels.k8s_cluster_name }} has overcommitted memory resource
            requests for Pods by {{ $value | humanize }} bytes and cannot tolerate node
            failure.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubememoryovercommit
          summary: Cluster has overcommitted memory resource requests.
        expr: (((sum(namespace_memory:kube_pod_container_resource_requests:sum) by(k8s_cluster_name)
          - sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
          by(k8s_cluster_name)) > 0) and (count(max(kube_node_role{job="kube-state-metrics",role="control-plane"})
          by(k8s_cluster_name,node)) by(k8s_cluster_name) < 3)) or ((sum(namespace_memory:kube_pod_container_resource_requests:sum)
          by(k8s_cluster_name) - ((sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
          by(k8s_cluster_name) - max(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
          by(k8s_cluster_name)) > 0)) > 0)
        for: 10m
        labels:
          severity: warning
      - alert: KubeCPUQuotaOvercommit
        annotations:
          description: Cluster {{ $labels.k8s_cluster_name }} has overcommitted CPU resource
            requests for Namespaces.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecpuquotaovercommit
          summary: Cluster has overcommitted CPU resource requests.
        expr: (sum(min(kube_resourcequota{job="kube-state-metrics",type="hard",resource=~"(cpu|requests.cpu)"})
          without(resource)) by(k8s_cluster_name) / sum(kube_node_status_allocatable{resource="cpu",job="kube-state-metrics"})
          by(k8s_cluster_name)) > 1.5
        for: 5m
        labels:
          severity: warning
      - alert: KubeMemoryQuotaOvercommit
        annotations:
          description: Cluster {{ $labels.k8s_cluster_name }} has overcommitted memory resource
            requests for Namespaces.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubememoryquotaovercommit
          summary: Cluster has overcommitted memory resource requests.
        expr: (sum(min(kube_resourcequota{job="kube-state-metrics",type="hard",resource=~"(memory|requests.memory)"})
          without(resource)) by(k8s_cluster_name) / sum(kube_node_status_allocatable{resource="memory",job="kube-state-metrics"})
          by(k8s_cluster_name)) > 1.5
        for: 5m
        labels:
          severity: warning
      - alert: KubeQuotaAlmostFull
        annotations:
          description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage
            }} of its {{ $labels.resource }} quota on cluster {{ $labels.k8s_cluster_name
            }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubequotaalmostfull
          summary: Namespace quota is going to be full.
        expr: ((topk(1, max(kube_resourcequota{job="kube-state-metrics",type="used"}) without(instance,job,type))
          by(k8s_cluster_name,namespace,resource,resourcequota) / on(k8s_cluster_name,namespace,resource,resourcequota)
          group_left() topk(1, max(kube_resourcequota{job="kube-state-metrics",type="hard"})
          without(instance,job,type) > 0) by(k8s_cluster_name,namespace,resource,resourcequota))
          > 0.9) < 1
        for: 15m
        labels:
          severity: info
      - alert: KubeQuotaFullyUsed
        annotations:
          description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage
            }} of its {{ $labels.resource }} quota on cluster {{ $labels.k8s_cluster_name
            }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubequotafullyused
          summary: Namespace quota is fully used.
        expr: (topk(1, max(kube_resourcequota{job="kube-state-metrics",type="used"}) without(instance,job,type))
          by(k8s_cluster_name,namespace,resource,resourcequota) / on(k8s_cluster_name,namespace,resource,resourcequota)
          group_left() topk(1, max(kube_resourcequota{job="kube-state-metrics",type="hard"})
          without(instance,job,type) > 0) by(k8s_cluster_name,namespace,resource,resourcequota))
          == 1
        for: 15m
        labels:
          severity: info
      - alert: KubeQuotaExceeded
        annotations:
          description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage
            }} of its {{ $labels.resource }} quota on cluster {{ $labels.k8s_cluster_name
            }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubequotaexceeded
          summary: Namespace quota has exceeded the limits.
        expr: (topk(1, max(kube_resourcequota{job="kube-state-metrics",type="used"}) without(instance,job,type))
          by(k8s_cluster_name,namespace,resource,resourcequota) / on(k8s_cluster_name,namespace,resource,resourcequota)
          group_left() topk(1, max(kube_resourcequota{job="kube-state-metrics",type="hard"})
          without(instance,job,type) > 0) by(k8s_cluster_name,namespace,resource,resourcequota))
          > 1
        for: 15m
        labels:
          severity: warning
      - alert: CPUThrottlingHigh
        annotations:
          description: '{{ $value | humanizePercentage }} throttling of CPU in namespace
            {{ $labels.namespace }} for container {{ $labels.container }} in pod {{ $labels.pod
            }} on cluster {{ $labels.k8s_cluster_name }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/cputhrottlinghigh
          summary: Processes experience elevated CPU throttling.
        expr: (sum(topk(1, increase(container_cpu_cfs_throttled_periods_total{container!="",job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))
          by(k8s_cluster_name,namespace,pod,container,instance)) without(id,metrics_path,name,image,endpoint,job,node)
          / on(k8s_cluster_name,namespace,pod,container,instance) group_left() sum(topk(1,
          increase(container_cpu_cfs_periods_total{job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))
          by(k8s_cluster_name,namespace,pod,container,instance)) without(id,metrics_path,name,image,endpoint,job,node))
          > 0.25
        for: 15m
        labels:
          severity: info

