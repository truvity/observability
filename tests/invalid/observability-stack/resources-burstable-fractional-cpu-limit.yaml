# expect: under `resources.policy: burstable`. The request may be fractional, the limit may not
# A fractional CPU LIMIT is still refused under `burstable`: the limit is
# the cgroup quota, and the quota is what the thread pool rounds DOWN.
# A fractional request is fine; this is the one CPU value that is not.
resources:
  policy: burstable
# No proxy: no principals to admit, so none of the tenancy refusals
# apply and none can preempt this fixture's own.
vmauth:
  enabled: false

vmalert:
  resources:
    requests: {cpu: 10m, memory: 128Mi}
    limits: {cpu: 500m, memory: 128Mi}

# The minimum receiver that keeps the "no receiver configured" refusal
# (Alertmanager is on by default) from preempting this fixture's own.
notifications:
  externalUrl: https://grafana.example
  slack:
    workspaces:
      - {name: acme, appTokenSecret: {name: example-slack-bot, key: token}}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}
