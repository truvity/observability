# Tag-triggered release — the shared implementation.
#
# The caller grants the permissions because a reusable workflow can narrow
# them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse than
# a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@83a33664e82b4df3764ed4b4544707320b51db92 # v3.13.1
    with:
      # goreleaser builds cmd/alert-ingress's image (see .goreleaser.yaml)
      # and cuts the GitHub release + changelog; every chart below is then
      # packaged at the tag's version and pushed to
      # oci://ghcr.io/truvity/charts/<name>.
      charts: '["observability-crds", "observability-emitters", "observability-stack", "platform-alerts", "alert-ingress", "observability-dashboards"]'
      # ko names the image after cmd/alert-ingress's own directory
      # (base_import_paths in .goreleaser.yaml), so this nests it as
      # ghcr.io/truvity/observability/alert-ingress — the repository
      # charts/alert-ingress/values.yaml's image.repository defaults to.
      ko-docker-repo: ghcr.io/truvity/observability
