# expect: renders no vmalert
# vmalert off.

vmalert:
  enabled: false
  remoteEvaluators:
    - name: other-store
      datasource:
        url: https://metrics.other-store.example
        auth:
          bearer: {secretName: example-other-store-read, key: token}


victoria-metrics-k8s-stack:
  defaultRules:
    sources:
      vmalert:
        enabled: false
