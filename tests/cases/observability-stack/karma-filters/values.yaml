# karma with its own default filters: the list REPLACES the chart's
# `alertname!=Watchdog`, it does not append to it.
global:
  cluster:
    dnsDomain: cluster.example.

tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true

vmalert:
  externalUrl: https://grafana.example

notifications:
  alertmanagerUrl: https://alertmanager.example
  slack:
    workspaces:
      - name: acme
        appTokenSecret: {name: example-acme-slack-bot, key: token}
  severities:
    critical: {receiver: slack, channel: "#alerts-critical"}
    warning: {receiver: slack, channel: "#alerts"}

networkPolicy:
  karmaFrom:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: gateway}
      podSelector:
        matchLabels: {app.kubernetes.io/name: oauth2-proxy}

karma:
  enabled: true
  filters:
    default:
      - "@state=active"
      - severity=critical
  alertmanagers:
    - name: other
      uri: http://alertmanager.other.svc:9093
      readonly: true
  authentication:
    header:
      name: X-Auth-Request-Email
      groupName: X-Auth-Request-Groups
      groupValueRe: ^(.+)$
      groupValueSeparator: ","
  authorization:
    groups:
      - name: admins
        members: [alice@example.com, bob@example.com]
      - name: users
        members: [carol@example.com]
  acl:
    silences:
      - action: block
        reason: regex silences are not allowed, use concrete label names and values
        scope:
          filters:
            - name_re: .+
              value_re: .+
              isRegex: true
      - action: allow
        reason: admins may silence anything
        scope:
          groups: [admins]
      - action: requireMatcher
        reason: users must name a cluster
        scope:
          groups: [users]
        matchers:
          required:
            - name: k8s_cluster_name
              value_re: .+
  history:
    enabled: true
    uri: http://prometheus.example.svc:9090
