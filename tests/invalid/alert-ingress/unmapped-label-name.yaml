# expect: 'my-label' does not match pattern '^[a-zA-Z_][a-zA-Z0-9_]*$'
# A dash is not allowed in a Prometheus label name; the schema rejects it
# before any template runs (templates/_validate.tpl#validate.unmapped re-checks).
image:
  repository: ghcr.io/example/alert-ingress
  tag: "1.0.0"
alertmanager:
  url: http://vmalertmanager-observability-stack.observability.svc:9093
topics:
  - "<the security-alerts topic ARN>"
unmapped:
  labels:
    my-label: x
heartbeat:
  match: {"source": "alert-ingress-heartbeat"}
  interval: 15m
networkPolicy:
  alertmanagerPeer:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vmalertmanager
