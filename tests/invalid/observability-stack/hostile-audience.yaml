# An audience that is a pattern rather than a client id.
#
# vmauth compiles every `matchClaims` value as a regular expression, so
# this one does not pin the client it appears to name — it admits every
# client of the issuer whose id starts that way. A pin that admits
# clients nobody wrote down is the failure the pin exists to prevent,
# and it is the same shape as the unanchored-claim advisory this chart's
# vmauth floor exists for. Such a value is refused, never escaped.
tenancy:
  issuerUrl: https://issuer.example
  audience: example-.*
  principals:
    - group: example:k8s:viewer
      grants:
        - cluster: example-cluster
          allNamespaces: true
