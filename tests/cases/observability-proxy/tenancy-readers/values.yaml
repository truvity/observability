# The Door half of the stack case of the same name (tests/cases/observability-stack/tenancy-readers):
# its values kept to the keys charts/observability-proxy declares, with
# `stackReleaseName` set to the stack's release name, so the render carries the
# names the stack's does.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  allowUnfilteredTraceReads: true
  principals:
  - group: example:k8s:viewer
    grants:
    - cluster: example-cluster
      allNamespaces: true
  writers:
  - name: metrics-agent
    tokenSecret:
      name: example-writer-token
      key: token
    destinations:
    - metrics
  readers:
  - name: edge-evaluator
    tokenSecret:
      name: example-metrics-read-token
      key: token
    grants:
    - cluster: example-edge
      namespaces:
      - example-app
      - example-jobs
  - name: wide-evaluator
    tokenSecret:
      name: example-wide-read-token
      key: token
    grants:
    - cluster: example-edge
      allNamespaces: true
    - cluster: example-other
      allNamespaces: true
