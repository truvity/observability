# The Door half of the stack case of the same name (tests/cases/observability-stack/tenancy-authz-existing-secret):
# its values kept to the keys charts/observability-proxy declares, with
# `stackReleaseName` set to the stack's release name, so the render carries the
# names the stack's does.
stackReleaseName: observability-stack
tenancy:
  issuerUrl: https://issuer.example
  audience: example-observability-client
  claimName: groups
  vmAccessReader:
    enabled: true
  authz:
    enabled: true
    replicas: 3
    upstreamIssuer: https://idp.example:8443
    personAudiences:
    - grafana
    - example-observability-client
    mintedAudience: example-vmauth
    tokenTTL: 2m
    traceClusters:
    - cluster-a
    signingKey:
      source: existingSecret
      existingSecret: example-authz-signing
    securityPolicy:
      enabled: false
    networkPolicy:
      gatewayFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: envoy
  principals:
  - group: example:example-app:deployer
    grants:
    - cluster: cluster-a
      namespaces:
      - example-app
victoria-metrics-k8s-stack:
  enabled: false
victoria-logs-single:
  enabled: false
victoria-traces-single:
  enabled: false
