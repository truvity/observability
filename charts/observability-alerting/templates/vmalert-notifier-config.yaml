{{- /*
The notifier configuration file of the vmalerts when `notifications.ownerFill`
is on: the notifier targets plus the relabeling that fills the owner label.
A Secret because `VMAlert.spec.notifierConfigRef` is a Secret key selector;
nothing secret is in it. See `observability-alerting.vmalert.notifierConfig`.
*/ -}}

{{- $eff := include "observability-alerting.effectiveEnabled" . | fromYaml }}
{{- if and $eff.vmalert (include "observability-alerting.ownerFill.enabled" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observability-alerting.fullname" . }}-vmalert-notifier
  labels:
    {{- include "observability-alerting.labels" . | nindent 4 }}
type: Opaque
stringData:
  notifier.yaml: |
    {{- include "observability-alerting.vmalert.notifierConfig" . | nindent 4 }}
{{- end }}

