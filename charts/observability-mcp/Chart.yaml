apiVersion: v2
name: observability-mcp
description: >-
  Read-only Model Context Protocol servers over the estate's observability
  store: one Deployment per enabled server, each the stock upstream MCP
  server on loopback behind a resource-proxy sidecar that validates the
  caller's access token and holds the only credential the store sees.
